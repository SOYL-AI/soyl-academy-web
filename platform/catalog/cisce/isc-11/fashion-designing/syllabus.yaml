exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course. There is no board examination in Class XI: the school conducts
  the Class XI examination on the Class XI portion, and promotion to Class XII needs at least 35% on the cumulative
  average in five subjects including English, with 75% attendance (ISC 2028 Regulations). The syllabus prescribes, and
  the school examination usually follows: Paper I Theory, 3 hours, 70 marks; Paper II Practical Work, 30 marks, a
  journal of the year's work assessed internally by the teacher. Class XI practical work covers hand embroidery
  (outline, filling and fancy stitches), cutting and finishing techniques (seams, tucks, pleats, gathers, neckline
  facings, fasteners, plackets, hem finishes), basic fashion illustration (drawing and fleshing out a croquis in 8-head
  and 10-head proportions and clothing it in two western and two Indian outfits), taking horizontal, vertical, sleeve
  and trouser body measurements, sources of buying fabric, and an accessory-making workshop (costume jewellery from
  scrap, beads and paper quilling). SOYL covers Paper I only. The syllabus asks for five Indian and five international
  designers (one each Japanese, Italian, French, American and British) without naming them, so schools choose the
  designers. No unit-wise marks weightage is published for Class XI, and no Class XI specimen paper is listed for this
  subject. CISCE lists topics under five numbered themes, not textbook chapters: SOYL groups them into 9 teachable
  chapters in syllabus order. The Class XII portion is in isc-12-fashion-designing.
