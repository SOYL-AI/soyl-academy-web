# ISC Class 11 Fashion Designing (865), Paper I Theory - ISC 2028 syllabus, CLASS XI portion only.
# Source: platform/catalog/sources/cisce.md#isc-2028-fashion-designing. Topic wording is our own summary of the official scope.
subject_id: isc-11-fashion-designing
academic_year: "2026-27"
source_status: verified
