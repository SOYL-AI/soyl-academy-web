# ISC Class 11 Chemistry (862), Paper I Theory - ISC 2028 syllabus, CLASS XI portion only.
# Source: platform/catalog/sources/cisce.md#isc-2028-chemistry. Topic wording is our own summary of the official scope.
subject_id: isc-11-chemistry
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-chemistry, isc-2028-regulations]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course. There is no board examination in Class XI: the final
  examination is conducted internally by the school on the Class XI portion, and promotion to Class XII needs at least
  35% on the cumulative average in five subjects including English, with 75% attendance (ISC 2028 Regulations).
  The syllabus prescribes, and the school examination usually follows: Paper I Theory, 3 hours, 70 marks; Paper II
  Practical, 3 hours, 15 marks, plus Project Work 10 marks and Practical File 5 marks (total 30). Practical work:
  basic laboratory techniques (cutting and bending a glass tube, drawing a jet, boring a cork); acid-base titrations
  (sodium carbonate, NaOH or KOH against dilute H2SO4 or HCl with methyl orange; calculations of molarity to four
  decimal places, concentration, water of crystallisation and percentage purity; concordant titre values, table in ink);
  qualitative analysis of a single salt (one anion, one cation); preparation of potash alum or Mohr's salt and of
  crystalline FeSO4 or CuSO4; and paper chromatography with Rf values. SOYL covers Paper I only.
  Both old (IA-VIIA, 0) and IUPAC (1-18) group numbering are accepted. No Class XI specimen paper is published for
  Chemistry. The official weightage table gives only branch totals (Physical 41, Inorganic 6, Organic 23) without marking
  which units fall in each branch: SOYL places Classification of Elements and Periodicity (Unit 3) under Inorganic,
  Units 1-2 and 4-7 under Physical, and Units 8-9 under Organic. CISCE lists topics under nine units, not textbook
  chapters: SOYL groups them into 24 teachable chapters in syllabus order. The Class XII portion is in isc-12-chemistry.
units:
  - { name: "Physical Chemistry (Units 1-2 and 4-7: Basic Concepts, Atomic Structure, Bonding, Thermodynamics, Equilibrium, Redox)", marks: 41 }
  - { name: "Inorganic Chemistry (Unit 3: Classification of Elements and Periodicity in Properties)", marks: 6 }
  - { name: "Organic Chemistry (Units 8-9: Basic Principles and Techniques, Hydrocarbons)", marks: 23 }
