    title: "Novel: Marhi Da Diva (Gurdial Singh), Kand 1-9"
    unit: "Section B: Prescribed Textbooks"
    topics:
      - id: isc-11-punjabi-ch05-t01
        title: "Kand 1-4 (Ik, Do, Tin, Chaar): the village, Jagseer and the beginning of the story"
        learning_outcomes:
