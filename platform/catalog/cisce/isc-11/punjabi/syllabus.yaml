          - "Explain how this part develops the central conflict and the characters"
      - id: isc-11-punjabi-ch05-t03
        title: "Character sketches: Jagseer and the people of the village"
        learning_outcomes:
          - "Describe Jagseer's life, relationships and position in the village with incidents from the prescribed chapters"
          - "Explain how other villagers' attitudes affect Jagseer"
      - id: isc-11-punjabi-ch05-t04
        title: "Themes: caste, land, poverty and loneliness in a Malwa village"
        learning_outcomes:
          - "Explain how the prescribed chapters present the life of a landless Dalit labourer in a changing village"
      - id: isc-11-punjabi-ch05-t05
        title: "The title 'Marhi Da Diva' and Gurdial Singh's realistic style"
        learning_outcomes:
          - "Explain the significance of the title and its symbolism"
          - "Comment on Gurdial Singh's use of the Malwai dialect and realistic detail"
