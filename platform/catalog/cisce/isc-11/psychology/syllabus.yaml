# ISC Class 11 Psychology (855) - ISC 2028 course, CLASS XI portion only.
# Source: platform/catalog/sources/cisce.md#isc-2028-psychology. Topic wording is our own summary of the official scope.
subject_id: isc-11-psychology
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-psychology, isc-2028-regulations]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course: there is no CISCE board examination in Class XI, and the
  school sets the Class XI examination on the Class XI portion, normally following the pattern below.
  Paper I Theory: 3 hours, 70 marks, on the seven Class XI topics below.
  Paper II Project Work: 30 marks. Candidates complete two studies or experiments based on any chapter covered in
  theory, each written up as aim, basic concept (definitions, theory, independent and dependent variables), method
  (sample, procedure and nature of raw data, treatment of data, results and discussion, conclusion) and bibliography.
  Marks per study (15): basic concept 3, method 4, results and discussion 4, viva 4.
  CISCE lists topics with scope notes, not textbook chapters: SOYL groups them into 17 teachable chapters in syllabus order.
  No unit-wise marks weightage is published for ISC Psychology.
units:
  - { name: "1. The Subject Psychology", marks: null }
  - { name: "2. Methods of Psychology", marks: null }
  - { name: "3. Attention and Perception", marks: null }
  - { name: "4. Emotions and Motivation", marks: null }
  - { name: "5. Learning", marks: null }
  - { name: "6. Remembering and Forgetting", marks: null }
  - { name: "7. Thinking, Problem Solving and Creativity", marks: null }
chapters:
  - id: isc-11-psychology-ch01
    number: 1
    title: "Psychology: Definition, Approaches and Schools of Thought"
    unit: "1. The Subject Psychology"
    topics:
      - id: isc-11-psychology-ch01-t01
        title: "Definition of psychology; behaviour, stimulus and response"
        learning_outcomes:
          - "Define psychology as the scientific study of behaviour and mental processes"
          - "Explain the terms behaviour, stimulus and response with everyday examples"
      - id: isc-11-psychology-ch01-t02
        title: "The eclectic approach: biological, behavioural, psychoanalytic, cognitive and sociocultural perspectives"
        learning_outcomes:
          - "Explain how each of the five modern approaches would interpret the same behaviour, such as exam anxiety"
      - id: isc-11-psychology-ch01-t03
        title: "Structuralism and Functionalism: main features and two psychologists of each"
        learning_outcomes:
          - "Compare the aims and methods of Structuralism and Functionalism"
          - "Name two psychologists associated with each school and one concept of each"
      - id: isc-11-psychology-ch01-t04
        title: "Behaviourism, Psychoanalysis and Gestalt psychology: main features and two psychologists of each"
        learning_outcomes:
          - "Describe the central idea of Behaviourism, Psychoanalysis and Gestalt psychology"
          - "Name two psychologists associated with each school and their key concepts"
      - id: isc-11-psychology-ch01-t05
        title: "Psychology and other disciplines: economics, political science, law and criminology, sociology, computer science, mass communication, music and fine arts"
        learning_outcomes:
          - "Explain with an example how psychology contributes to any three related disciplines"
