        title: "Chapters 1-4: the setting and the introduction of the main characters"
        learning_outcomes:
          - "Narrate the main events of this part of the novel in sequence in your own words"
          - "Explain how this part develops the central conflict and the characters"
      - id: isc-11-bengali-ch05-t02
        title: "Chapters 5-8: events and development of the story"
        learning_outcomes:
          - "Narrate the main events of this part of the novel in sequence in your own words"
          - "Explain how this part develops the central conflict and the characters"
      - id: isc-11-bengali-ch05-t03
        title: "Character sketches: Koni and her coach Khitish Sinha (Khitda)"
        learning_outcomes:
          - "Describe Koni's background, spirit and determination with incidents from the prescribed chapters"
          - "Explain how Khitda sees Koni's talent and how their coach-pupil relationship begins to develop"
      - id: isc-11-bengali-ch05-t04
        title: "Themes: poverty, sport, perseverance and the struggle for opportunity"
        learning_outcomes:
          - "Explain how the prescribed chapters show poverty as an obstacle to talent and perseverance as the answer to it"
      - id: isc-11-bengali-ch05-t05
        title: "The title and Moti Nondi's lively, sports-centred narration"
        learning_outcomes:
          - "Explain the significance of the title with reference to the prescribed chapters"
          - "Comment on Moti Nondi's narrative style and use of everyday Kolkata speech with examples"
