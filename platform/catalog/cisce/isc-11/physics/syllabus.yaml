# ISC Class 11 Physics (861), Paper I Theory - ISC 2028 syllabus, CLASS XI portion only.
# Source: platform/catalog/sources/cisce.md#isc-2028-physics. Topic wording is our own summary of the official scope.
subject_id: isc-11-physics
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-physics, isc-2028-regulations]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course. There is no board examination in Class XI: the final
  examination is conducted internally by the school on the Class XI portion, and promotion to Class XII needs at least
  35% on the cumulative average in five subjects including English, with 75% attendance (ISC 2028 Regulations).
  The syllabus prescribes, and the school examination usually follows: Paper I Theory, 3 hours, 70 marks; Paper II
  Practical, 3 hours, 15 marks, plus Project Work 10 marks and Practical File 5 marks (total 30). Required experiments:
  Vernier calipers (volume of a sphere with significant figures), screw gauge (percentage error in area), spherometer,
  parallelogram law of forces, force on a roller on an inclined plane, limiting friction and coefficient of friction,
  g from a simple pendulum (T^2 vs L, seconds pendulum), force constant of a spring, Boyle's law, cooling curve and
  Newton's law of cooling, resonance column (speed of sound), sonometer frequency and specific heat capacity of a solid;
  teacher demonstrations of Searle's method (Young's modulus), capillary rise (surface tension) and terminal-velocity
  viscosity. Observations are tabulated with units and every experiment ends with a graph and calculation. The project
  is a technical report (abstract, theory, set-up, data, analysis, conclusion). SOYL covers Paper I only.
  SI units throughout; every quantity is introduced with its unit and dimensions; numerical problems are set from all
  topics unless a topic is marked qualitative or excluded. No Class XI specimen paper is published for Physics.
  The official weightage table gives combined marks for groups of units (Units 1-3: 23, Units 4-6: 17, Units 7-9: 20,
  Unit 10: 10), so those groups are the units below. CISCE lists topics under ten units, not textbook chapters: SOYL
  groups them into 23 teachable chapters in syllabus order. The Class XII portion is in isc-12-physics.
units:
  - { name: "Units 1-3: Physical World and Measurement; Kinematics; Laws of Motion", marks: 23 }
  - { name: "Units 4-6: Work, Energy and Power; Motion of System of Particles and Rigid Body; Gravitation", marks: 17 }
  - { name: "Units 7-9: Properties of Bulk Matter; Heat and Thermodynamics; Kinetic Theory of Gases", marks: 20 }
  - { name: "Unit 10: Oscillations and Waves", marks: 10 }
chapters:
  - id: isc-11-physics-ch01
    number: 1
    title: "Units and Measurement"
    unit: "Units 1-3: Physical World and Measurement; Kinematics; Laws of Motion"
    topics:
      - id: isc-11-physics-ch01-t01
        title: "Physics as a science of measurement; unit as a reference standard; systems of units (CGS, FPS, MKS, MKSA, SI)"
        learning_outcomes:
          - "Explain why a unit must be well defined, reproducible and invariable"
          - "Compare the CGS, FPS, MKS and SI systems for length, mass and time"
      - id: isc-11-physics-ch01-t02
        title: "The seven SI base units, supplementary and derived units; rules for writing unit names and symbols; prefixes from atto to tera"
        learning_outcomes:
          - "List the seven SI base quantities with their units and symbols"
          - "Express a derived unit such as the newton or joule in terms of base units"
          - "Correct errors in unit symbols and prefixes written against SI rules"
      - id: isc-11-physics-ch01-t03
        title: "Other common units: fermi, angstrom, light year, astronomical unit, parsec, unified atomic mass unit (u); measuring length, mass and time"
        learning_outcomes:
          - "Convert astronomical and atomic distances between light years, AU, parsecs, fermi and metres"
          - "Choose a suitable unit and method to measure very large and very small lengths, masses and times"
      - id: isc-11-physics-ch01-t04
        title: "Errors in measurement; significant figures; rules for counting and for arithmetic operations; rounding off; order of magnitude"
        learning_outcomes:
          - "Count the significant figures in a measured value"
          - "Report the result of an addition or multiplication with the correct number of significant figures"
          - "Estimate the order of magnitude of quantities such as the size of an atom or the age of the universe"
      - id: isc-11-physics-ch01-t05
        title: "Dimensions and dimensional formulae of physical quantities and constants; principle of homogeneity"
        learning_outcomes:
          - "Write the dimensional formula of a quantity such as force, pressure or the gravitational constant, e.g. [F] = [MLT^-2]"
          - "State the principle of homogeneity of dimensions"
      - id: isc-11-physics-ch01-t06
        title: "Uses of dimensional analysis: checking equations, finding dimensions of constants, converting units; limitations"
        learning_outcomes:
          - "Check the dimensional correctness of an equation such as v^2 = u^2 + 2as"
          - "Convert a quantity such as 1 newton into dynes using dimensions"
          - "State three limitations of dimensional analysis"
    removed_topics: []
    literature_texts: []
