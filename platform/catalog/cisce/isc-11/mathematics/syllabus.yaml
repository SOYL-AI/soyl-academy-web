# ISC Class 11 Mathematics (860), Paper I Theory - ISC 2028 syllabus, CLASS XI portion only.
# Source: platform/catalog/sources/cisce.md#isc-2028-mathematics. Topic wording is our own summary of the official scope.
subject_id: isc-11-mathematics
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-mathematics, isc-2028-regulations]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course. There is no board examination in Class XI: the final
  examination is conducted internally by the school on the Class XI portion, and promotion to Class XII needs at least
  35% on the cumulative average in five subjects including English, with 75% attendance (ISC 2028 Regulations).
  The syllabus prescribes, and the school examination usually follows: Paper I Theory, 3 hours, 80 marks, on five
  compulsory units (Sets and Functions 18, Algebra 26, Coordinate Geometry 20, Calculus 8, Statistics and Probability 8);
  Paper II Project Work, 20 marks - two projects of 10 marks each (overall format 1, content 4, findings 2, viva-voce 3).
  Suggested projects include proving that a set of n elements has 2^n subsets, verifying set laws with Venn diagrams,
  comparing graphs of sin(theta), sin(2 theta) and 2 sin(theta), powers of i on the Argand plane, Pascal's triangle,
  sums of squares and cubes, coefficient of variation of two data sets, and modelling conics with a double cone or
  their focal properties; project work is not built as chapters. SOYL covers Paper I only. Mathematics may not be
  taken with Applied Mathematics. No Class XI specimen paper is published for Mathematics. CISCE lists topics under
  five units, not textbook chapters: SOYL groups them into 19 teachable chapters in syllabus order. The Class XII
  portion is in isc-12-mathematics.
units:
  - { name: "Unit 1: Sets and Functions", marks: 18 }
  - { name: "Unit 2: Algebra", marks: 26 }
  - { name: "Unit 3: Coordinate Geometry", marks: 20 }
  - { name: "Unit 4: Calculus", marks: 8 }
  - { name: "Unit 5: Statistics and Probability", marks: 8 }
