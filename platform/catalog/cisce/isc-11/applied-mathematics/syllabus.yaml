# ISC Class 11 Applied Mathematics (885), Paper I Theory - ISC 2028 syllabus, CLASS XI portion only.
# Source: platform/catalog/sources/cisce.md#isc-2028-applied-mathematics. Topic wording is our own summary of the official scope.
subject_id: isc-11-applied-mathematics
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-applied-mathematics, isc-2028-regulations]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course. There is no board examination in Class XI: the school conducts
  the Class XI examination on the Class XI portion, and promotion to Class XII needs at least 35% on the cumulative
  average in five subjects including English, with 75% attendance (ISC 2028 Regulations). The syllabus prescribes, and
  the school examination usually follows: Paper I Theory, 3 hours, 80 marks; Paper II Project Work, 20 marks - two
  projects, each marked out of 10 (overall format 1, content 4, findings 2, viva-voce 3). Suggested Class XI projects
  include proving that a set of n elements has 2^n subsets, verifying the distributive law with Venn diagrams, graphing
  sin x, sin 2x, 2 sin x and sin (x/2) on common axes, reading the maximum or minimum of a quadratic from its graph,
  Pascal's triangle, comparing the consistency of two data sets with the coefficient of variation, finding the median
  from ogives, truth values of compound statements with series and parallel switches, survey-based correlation
  studies, and comparing purchase options including GST and hidden costs. SOYL covers Paper I only. Applied
  Mathematics is meant for Humanities, Commerce, Economics and Bioscience students and may not be combined with
  Mathematics (ISC 2028 Regulations). No Class XI specimen paper is published for this subject. The published Class XI
  unit weightage is used for the units. CISCE lists topics under seven weighted units, not textbook chapters: SOYL
  groups them into 23 teachable chapters in syllabus order. The Class XII portion is in isc-12-applied-mathematics.
units:
  - { name: "Unit 1: Sets and Functions", marks: 12 }
  - { name: "Unit 2: Algebra", marks: 22 }
  - { name: "Unit 3: Coordinate Geometry", marks: 12 }
  - { name: "Unit 4: Calculus", marks: 6 }
  - { name: "Unit 5: Statistical Methods and Probability", marks: 12 }
  - { name: "Unit 6: Mathematical Reasoning", marks: 4 }
  - { name: "Unit 7: Financial Mathematics", marks: 12 }
