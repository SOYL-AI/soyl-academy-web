# ISC Class 11 Chinese (Modern Foreign Language elective, code 826) - ISC 2028 course, CLASS XI year.
# CISCE Appendix I (ISC 2028) lists no prescribed textbooks for Chinese, so Part 4 of the paper is two translation passages.
# CISCE has not bifurcated the syllabus, so this file covers the whole Classes XI-XII syllabus.
# Titles are in English; grammar markers are given in pinyin with simplified characters in brackets.
subject_id: isc-11-chinese
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-mfl, isc-2028-prescribed-books, isc-2028-regulations]
exam_notes: >-
  There is no board examination in Class XI: Class XI is year one of the two-year ISC 2028 course and the school sets the
  Class XI examination on the portion of the syllabus covered during the year. CISCE has not bifurcated this syllabus (the
  Class XII ISC paper is set on the entire syllabus), so this file covers the whole Classes XI-XII Chinese syllabus and nothing
  is removed. Paper I Theory (3 hours, 80 marks), which the school examination normally follows, has four parts: (1) a short
  composition in Chinese from a choice of subjects; (2) a Chinese passage for unprepared translation into English; (3) an
  unseen Chinese passage with questions - candidates may be asked to summarise part of it in Chinese, explain individual
  words, phrases or sentences, and answer comprehension questions (not every question type is set every year); (4) questions
  on prescribed textbooks - but CISCE Appendix I (ISC 2028) prescribes no textbooks for Chinese, so under the syllabus rule for
  languages without texts Part 4 consists of (a) one passage for translation from Chinese into English and (b) one passage
  for translation from English into Chinese. The syllabus asks schools to consult CISCE in time about prescribed textbooks.
  CISCE does not publish marks per part and does not say whether simplified or traditional characters are used; SOYL teaches
  Mandarin in simplified characters with Hanyu Pinyin. Paper II Project Work for Class XI (20 marks, assessed internally by
  the school during the year): Listening (6) - an unseen passage of about 500 words, a poem or an audio clip heard twice, with
  objective questions; Speaking (6) - an individual presentation of about three minutes (extempore, declamation, recitation,
  debate; e.g. narrating an experience, giving instructions, describing, reporting, giving an opinion or a speech) followed by
  two or three minutes' discussion with the teacher; Writing (8) - one assignment of about 200 words on any aspect of the
  language studied in Class XI (e.g. describing a process or an event, a summary, an alternative title with justification).
  CISCE sets no question paper for project work. The syllabus does not list grammar items; the two grammar chapters below
  cover the structures needed for composition and two-way translation - this breakdown is SOYL's, not CISCE's. CISCE lists
  topics not chapters; SOYL grouped them into teachable chapters in syllabus order.
units:
  - { name: "1. Composition", marks: null }
  - { name: "2. Unprepared translation into English", marks: null }
  - { name: "3. Unseen passage", marks: null }
  - { name: "4. Translation (no textbooks prescribed)", marks: null }
chapters:
  - id: isc-11-chinese-ch01
    number: 1
    title: "Composition"
    unit: "1. Composition"
    topics:
      - id: isc-11-chinese-ch01-t01
        title: "Planning a short composition: outline, paragraphs and sequencing words"
        learning_outcomes:
          - "Make an outline and write a short composition in Chinese with a clear beginning, middle and end"
          - "Order ideas with shouxian (首先), ranhou (然后), zuihou (最后) and add points with erqie (而且), lingwai (另外)"
      - id: isc-11-chinese-ch01-t02
        title: "Describing people, places and festivals"
        learning_outcomes:
          - "Describe a person, place or festival such as Diwali or the Spring Festival using adjectives with hen (很), feichang (非常), tebie (特别)"
      - id: isc-11-chinese-ch01-t03
        title: "Narrating a past experience"
        learning_outcomes:
          - "Narrate a past experience in time order, placing time expressions before the verb and using le (了) for completed actions"
      - id: isc-11-chinese-ch01-t04
        title: "Giving and supporting an opinion"
        learning_outcomes:
          - "State an opinion with wo juede (我觉得) or wo renwei (我认为) and support it with yinwei (因为) and two reasons"
      - id: isc-11-chinese-ch01-t05
        title: "Everyday subjects: family, school life, hobbies, food, travel, health, environment, technology"
        learning_outcomes:
          - "Use topic vocabulary accurately to write about everyday subjects, with examples from Indian life"
      - id: isc-11-chinese-ch01-t06
        title: "Writing characters accurately: stroke order, radicals and look-alike characters"
        learning_outcomes:
          - "Write common characters with correct stroke order and distinguish look-alike characters such as 己 / 已 and 人 / 入"
          - "Proof-read one's composition for wrong or missing characters and punctuation (。，、？)"
    removed_topics: []
    literature_texts: []
  - id: isc-11-chinese-ch02
    number: 2
    title: "Grammar (1): the simple sentence"
    unit: null
    topics:
      - id: isc-11-chinese-ch02-t01
        title: "Word order: subject - time - place - verb - object; adjectives as predicates"
        learning_outcomes:
          - "Arrange subject, time phrase, place phrase, verb and object in the correct Chinese order"
          - "Use an adjective as the predicate with hen (很) and without shi (是)"
      - id: isc-11-chinese-ch02-t02
        title: "Numbers, measure words and expressions of time (dates, clock time, duration)"
        learning_outcomes:
          - "Choose the right measure word (个, 本, 张, 条, 件, 杯) after numbers and demonstratives"
          - "Express dates, clock time and duration in the correct order and position"
      - id: isc-11-chinese-ch02-t03
        title: "Modal verbs: neng (能), hui (会), keyi (可以), yao (要), xiang (想), yinggai (应该)"
        learning_outcomes:
          - "Choose the modal verb that expresses ability, learned skill, permission, intention or obligation"
      - id: isc-11-chinese-ch02-t04
        title: "Aspect particles le (了), guo (过) and zhe (着); the progressive zai (在)"
        learning_outcomes:
          - "Use le for completed actions and changed situations, guo for past experience, zhe for continuing states and zai for actions in progress"
          - "Negate completed actions with mei(you) (没有) and drop le"
      - id: isc-11-chinese-ch02-t05
        title: "Questions: ma (吗), ne (呢), A-not-A and question words"
        learning_outcomes:
          - "Turn statements into each type of question and answer them in full sentences"
      - id: isc-11-chinese-ch02-t06
        title: "Comparison: bi (比), gen ... yiyang (跟……一样), meiyou ... name (没有……那么)"
        learning_outcomes:
          - "Compare two people or things with bi, gen ... yiyang and meiyou ... name"
    removed_topics: []
    literature_texts: []
  - id: isc-11-chinese-ch03
    number: 3
    title: "Grammar (2): complements, special constructions and complex sentences"
    unit: null
    topics:
      - id: isc-11-chinese-ch03-t01
        title: "The shi ... de (是……的) construction for time, place and manner of past events"
        learning_outcomes:
          - "Use shi ... de to stress when, where or how a past action happened"
      - id: isc-11-chinese-ch03-t02
        title: "Complements: degree (de 得), resultative (看完), directional (走进来) and potential (看得懂 / 看不懂)"
        learning_outcomes:
          - "Add the right complement to show how well, with what result, in which direction or whether an action can be done"
      - id: isc-11-chinese-ch03-t03
        title: "The ba (把) construction"
        learning_outcomes:
          - "Rewrite sentences with ba to show what is done to a definite object, keeping an element after the verb"
      - id: isc-11-chinese-ch03-t04
        title: "The bei (被) passive"
        learning_outcomes:
          - "Transform active sentences into bei passive sentences and explain when the passive is used"
      - id: isc-11-chinese-ch03-t05
        title: "Paired connectives: suiran ... danshi (虽然……但是), yinwei ... suoyi (因为……所以), ruguo ... jiu (如果……就), budan ... erqie (不但……而且), yi ... jiu (一……就)"
        learning_outcomes:
          - "Join two clauses with the paired connective that expresses contrast, cause, condition, addition or immediate sequence"
    removed_topics: []
    literature_texts: []
  - id: isc-11-chinese-ch04
    number: 4
    title: "Translation from Chinese into English"
    unit: "2. Unprepared translation into English"
    topics:
      - id: isc-11-chinese-ch04-t01
        title: "Reading for meaning: finding word boundaries and the sentence core"
        learning_outcomes:
          - "Divide a Chinese sentence into words and identify its subject, verb and object before translating"
      - id: isc-11-chinese-ch04-t02
        title: "Supplying English tense, number and articles that Chinese leaves implicit"
        learning_outcomes:
          - "Choose the English tense from time words and aspect particles, and add articles and plurals where English needs them"
      - id: isc-11-chinese-ch04-t03
        title: "Set phrases (chengyu), measure words and culture-specific words"
        learning_outcomes:
          - "Render a chengyu or culture-specific word by its meaning rather than word for word"
      - id: isc-11-chinese-ch04-t04
        title: "The second Chinese-to-English passage (Part 4a): producing and checking a complete version"
        learning_outcomes:
          - "Translate a longer passage completely and fluently, then check it sentence by sentence against the original"
    removed_topics: []
    literature_texts: []
  - id: isc-11-chinese-ch05
    number: 5
    title: "Unseen passage (comprehension and summary)"
    unit: "3. Unseen passage"
    topics:
      - id: isc-11-chinese-ch05-t01
        title: "Reading an unseen passage: main idea and key details"
        learning_outcomes:
          - "State the main idea of an unseen Chinese passage and locate supporting details"
      - id: isc-11-chinese-ch05-t02
        title: "Explaining words, phrases and sentences in context"
        learning_outcomes:
          - "Explain a word, phrase or sentence from the passage in simple Chinese, using a synonym or paraphrase"
      - id: isc-11-chinese-ch05-t03
        title: "Answering comprehension questions in Chinese"
        learning_outcomes:
          - "Answer questions in complete Chinese sentences in one's own words"
      - id: isc-11-chinese-ch05-t04
        title: "Summarising part of the passage in Chinese"
        learning_outcomes:
          - "Summarise a section of the passage in Chinese within a character limit, keeping only the essential points"
    removed_topics: []
    literature_texts: []
  - id: isc-11-chinese-ch06
    number: 6
    title: "Translation from English into Chinese"
    unit: "4. Translation (no textbooks prescribed)"
    topics:
      - id: isc-11-chinese-ch06-t01
        title: "Restructuring English sentences into Chinese word order"
        learning_outcomes:
          - "Translate English sentences into Chinese with time and place phrases before the verb and modifiers before the noun"
      - id: isc-11-chinese-ch06-t02
        title: "Expressing English tenses, passives and relative clauses in Chinese"
        learning_outcomes:
          - "Use aspect particles and time words for English tenses, bei for passives where natural, and de (的) for relative clauses"
      - id: isc-11-chinese-ch06-t03
        title: "Choosing measure words, complements and connectives"
        learning_outcomes:
          - "Translate sentences that need measure words, complements or paired connectives accurately"
      - id: isc-11-chinese-ch06-t04
        title: "Translating a continuous passage (Part 4b) and checking characters"
        learning_outcomes:
          - "Translate a short English passage into natural Chinese and proof-read it for wrong or missing characters"
    removed_topics: []
    literature_texts: []
removed_topics: []
