# ISC Class 11 Computer Science (868) - ISC 2028 course, CLASS XI portion only.
# Source: platform/catalog/sources/cisce.md#isc-2028-computer-science. Topic wording is our own summary of the official scope.
subject_id: isc-11-computer-science
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-computer-science, isc-2028-regulations, isc-2027-class-xi-specimen-papers]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course: there is no CISCE board examination in Class XI, and the
  school sets the Class XI examination on the Class XI portion, normally following the paper pattern below.
  Paper I Theory: 3 hours, 70 marks, in three sections - A Hardware (number systems, encodings, propositional logic
  and gates) 25 marks, B Java 30 marks, C Python and conceptual aspects 15 marks. CISCE has released a Class XI
  specimen paper for Computer Science Paper 1, which shows the school-exam pattern.
  Paper II Practical: 3 hours, 30 marks, evaluated internally by the school. The candidate attempts one of three
  Java programming problems: a 90-minute planning session (algorithm plus hand-written Java program) followed by a
  90-minute examination session (key in, run on seen and unseen inputs, attach a printout of listing and output).
  Marks: programming assignments through the year 10, one project 5, terminal Java solution on the computer 15.
  At least twenty assignments are expected (15 Java - conditional/iterative, 1-D arrays, 2-D arrays, strings, file
  handling, all class-based; 5 Python - sequential, conditional/iterative, nested iteration) plus ONE project on
  trends in computing (presentation, model or console application, for example an expert system or a cipher program).
  This lab work is practical and is reflected here only through the programming chapters. Java 6.0 or later and
  Python 3.13 or later; any editor or IDE. Topics 5 to 11 (Java) are meant to be introduced almost together with
  classes. CISCE lists topics, not textbook chapters: SOYL groups them into 19 teachable chapters in syllabus order.
units:
  - { name: "Section A: Hardware", marks: 25 }
  - { name: "Section B: Java", marks: 30 }
  - { name: "Section C: Python and Conceptual Aspects", marks: 15 }
