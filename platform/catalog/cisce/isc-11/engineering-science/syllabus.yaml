# ISC Class 11 Engineering Science (867), Paper I Theory - ISC 2028 syllabus, CLASS XI portion only.
# Source: platform/catalog/sources/cisce.md#isc-2028-engineering-science. Topic wording is our own summary of the official scope.
subject_id: isc-11-engineering-science
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-engineering-science, isc-2028-regulations]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course. There is no board examination in Class XI: the school conducts
  the Class XI examination on the Class XI portion, and promotion to Class XII needs at least 35% on the cumulative
  average in five subjects including English, with 75% attendance (ISC 2028 Regulations). The syllabus prescribes, and
  the school examination usually follows: Paper I Theory, 3 hours, 80 marks, with all questions in SI units
  (abbreviations as in the Indian Standards guide to SI units); examiners look for evidence that principles have been
  studied practically and may ask to see practical notebooks. Paper II Project Work, 20 marks - two projects on any
  theory topics, assessed by the subject teacher, each marked out of 10 (title and introduction 1, content 3,
  presentation and originality 2, conclusion 1, viva-voce 3). Suggested Class XI projects: velocity-time graphs and
  acceleration for different masses and forces, the range and height of a water jet at different angles of projection,
  a month of newspaper atmospheric-pressure and humidity data, and a study of an Indian or foreign physicist.
  SOYL covers Paper I only. Engineering Science may not be taken with Physics (ISC regulations). No topic-wise marks
  weightage is published, and no Class XI specimen paper is listed for this subject. CISCE lists 12 numbered topics,
  not textbook chapters: SOYL groups them into 15 teachable chapters in syllabus order (topics 1, 4 and 6 are each
  split in two). The Class XII portion is in isc-12-engineering-science.
