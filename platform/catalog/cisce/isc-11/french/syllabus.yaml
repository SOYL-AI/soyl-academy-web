# ISC Class 11 French (Modern Foreign Language elective, code 828) - ISC 2028 course, CLASS XI year.
# ISC 2028 has a new French syllabus (CEFR B1+): no prescribed literary texts, only suggested coursebooks.
# CISCE has not bifurcated the syllabus, so this file covers the whole Classes XI-XII syllabus.
subject_id: isc-11-french
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-mfl, isc-2028-prescribed-books, isc-2028-regulations]
exam_notes: >-
  There is no board examination in Class XI: Class XI is year one of the two-year ISC 2028 course and the school sets the
  Class XI examination on the portion of the syllabus covered during the year. CISCE has not bifurcated this syllabus (the
  Class XII ISC paper is set on the entire syllabus), so this file covers the whole Classes XI-XII French syllabus and nothing
  is removed. The ISC 2028 syllabus aims at intermediate (CEFR B1+) competence in reading, writing, listening and speaking.
  Paper I Theory (3 hours, 80 marks), which the school examination normally follows: (1) Composition (20) - one composition
  of 180-200 words in French from a choice of topics: a narrative recounting a past event, a descriptive text, an
  argumentative text or a critique of a book or film; (2) Email and letter writing (20) - one email or letter of about
  120-150 words, either formal (candidature, plainte / mécontentement, réclamation) or semi-formal (demande de renseignement,
  correspondance avec un responsable, organisation pratique), with layout, subject line, introduction and conclusion
  assessed; (3) Comprehension (30) - two or three reading tasks on informative French texts: practical documents such as
  brochures, leaflets or prospectuses, and simplified general-interest media articles of about 300-350 words, with
  multiple-choice, true/false and short written answers; (4) Grammar (10) - short situation-based tasks (fill in the blanks,
  multiple choice, sentence transformation such as reported speech or joining with a given connector) testing functional use
  of the listed grammar. Written work is graded with CISCE descriptors for content, coherence and cohesion, creativity
  (composition) or register (letter), vocabulary and grammar. Paper II Project Work for Class XI (20 marks, assessed
  internally by the subject teacher in four assessments during the year): Listening (10) - two or three short native-speaker
  audio clips of 2-3 minutes, each played twice, with objective questions (MCQ, true/false with justification, matching);
  Speaking (10) - a 12-15 minute test in three tasks: a directed interview about daily life, a problem-solving role play, and
  a prepared 3-5 minute point of view on a contemporary issue based on a short article (20 minutes' preparation). The Annexe
  themes (culture; health and well-being; education and future plans; community and society; the planet; science and
  technology) are to be used across all four skills: SOYL gives them three theme chapters at the end. Suggested coursebooks
  (reference only): Imagine 3 and Edito B1 (Didier), Décibel and Explore (Goyal). CISCE lists topics not chapters; SOYL
  grouped them into teachable chapters in syllabus order.
units:
  - { name: "1. Composition", marks: 20 }
  - { name: "2. Email and letter writing", marks: 20 }
  - { name: "3. Comprehension", marks: 30 }
  - { name: "4. Grammar", marks: 10 }
chapters:
  - id: isc-11-french-ch01
    number: 1
    title: "Composition (Production écrite)"
    unit: "1. Composition"
    topics:
      - id: isc-11-french-ch01-t01
        title: "Planning a 180-200 word composition: plan, paragraphs, introduction and conclusion"
        learning_outcomes:
          - "Draw up a plan for a given subject and write a composition in French of 180-200 words with an introduction, developed paragraphs and a conclusion"
          - "Link paragraphs with connecteurs such as d'abord, ensuite, de plus, en revanche, enfin"
      - id: isc-11-french-ch01-t02
        title: "Narrative text: recounting a past event"
        learning_outcomes:
          - "Narrate a real or imagined past event using the passé composé for actions, the imparfait for background and the plus-que-parfait for earlier actions"
          - "Sequence events with time markers such as ce jour-là, la veille, le lendemain, soudain"
      - id: isc-11-french-ch01-t03
        title: "Descriptive text: a person, a place, an event or a picture"
        learning_outcomes:
          - "Describe a person, place or festival vividly with precise adjectives, placed and agreed correctly"
      - id: isc-11-french-ch01-t04
        title: "Argumentative text: pour ou contre, giving and justifying an opinion"
        learning_outcomes:
          - "Present arguments for and against a statement, support each with a concrete example and reach a reasoned conclusion"
          - "Express an opinion with à mon avis, il me semble que, je suis convaincu(e) que and je ne pense pas que + subjonctif"
      - id: isc-11-french-ch01-t05
        title: "Critique of a book or a film (critique de livre / de film)"
        learning_outcomes:
          - "Write a critique that presents the work, summarises it briefly and gives a justified personal evaluation"
      - id: isc-11-french-ch01-t06
        title: "Meeting the grade criteria: originality, range of vocabulary and grammar, self-correction"
        learning_outcomes:
          - "Revise a draft to replace memorised or repeated expressions with varied vocabulary and complex sentences"
          - "Find and correct errors of agreement, accents and tense in one's own composition"
    removed_topics: []
    literature_texts: []
  - id: isc-11-french-ch02
    number: 2
    title: "Email and letter writing (Courriel et lettre)"
    unit: "2. Email and letter writing"
    topics:
      - id: isc-11-french-ch02-t01
        title: "Layout of a formal or semi-formal email and letter: objet, formule d'appel, formule de politesse, signature"
        learning_outcomes:
          - "Lay out an email or letter of 120-150 words with a suitable subject line, opening, paragraphs and closing formula"
      - id: isc-11-french-ch02-t02
        title: "Formal: lettre de candidature (applying for a job, internship, course or exchange)"
        learning_outcomes:
          - "Write a letter of application presenting oneself, one's motivation and one's qualities"
      - id: isc-11-french-ch02-t03
        title: "Formal: expressing a complaint or dissatisfaction (plainte, mécontentement) and making a claim (réclamation)"
        learning_outcomes:
          - "Write a polite but firm complaint that states the problem, gives facts and asks for a specific remedy or refund"
      - id: isc-11-french-ch02-t04
        title: "Semi-formal: asking for information (demande de renseignement) and writing to a person in charge"
        learning_outcomes:
          - "Write an email asking precise questions about a course, a stay or a service, using indirect questions"
      - id: isc-11-french-ch02-t05
        title: "Semi-formal: practical arrangements (organisation pratique) for a visit, event or exchange"
        learning_outcomes:
          - "Write an email proposing dates, times, places and tasks for an event and asking for confirmation"
      - id: isc-11-french-ch02-t06
        title: "Register: vouvoiement, formal and semi-formal tone"
        learning_outcomes:
          - "Adapt tone and fixed expressions to a formal or semi-formal situation without mixing registers"
    removed_topics: []
    literature_texts: []
  - id: isc-11-french-ch03
    number: 3
    title: "Comprehension (Compréhension écrite)"
    unit: "3. Comprehension"
    topics:
      - id: isc-11-french-ch03-t01
        title: "Practical documents: brochures, leaflets, prospectuses and notices"
        learning_outcomes:
          - "Locate specific information (dates, prices, conditions, contacts) in a practical document"
      - id: isc-11-french-ch03-t02
        title: "Extracting and comparing information from more than one document"
        learning_outcomes:
          - "Compare two offers or documents and choose the one that suits a given person, justifying the choice"
      - id: isc-11-french-ch03-t03
        title: "Simplified media articles of 300-350 words: main idea, details and the writer's view"
        learning_outcomes:
          - "State the main idea of an article, identify supporting details and recognise the writer's opinion"
      - id: isc-11-french-ch03-t04
        title: "Answering question types: QCM, vrai / faux with justification, short written answers"
        learning_outcomes:
          - "Answer multiple-choice and true/false questions accurately, justifying true/false answers from the text"
          - "Write short answers in correct French in one's own words"
      - id: isc-11-french-ch03-t05
        title: "Working out meaning from context: synonyms, word families and connectors"
        learning_outcomes:
          - "Deduce the meaning of unfamiliar words from context and word families, and use connectors to follow the argument"
    removed_topics: []
    literature_texts: []
  - id: isc-11-french-ch04
    number: 4
    title: "Grammaire (1): temps et modes"
    unit: "4. Grammar"
    topics:
      - id: isc-11-french-ch04-t01
        title: "Passé composé, imparfait and plus-que-parfait in narrative"
        learning_outcomes:
          - "Choose the passé composé, imparfait or plus-que-parfait in a narrative and justify the choice"
      - id: isc-11-french-ch04-t02
        title: "Dependent clauses in the future and the past (quand, dès que, lorsque + futur; tense sequence in the past)"
        learning_outcomes:
          - "Use the future after quand and dès que for future actions and keep tenses consistent in past-tense subordinate clauses"
      - id: isc-11-french-ch04-t03
        title: "Conditionnel présent: feelings, wishes, will, polite requests, hypotheses and imaginary situations"
        learning_outcomes:
          - "Form the conditionnel présent of regular and common irregular verbs"
          - "Use the conditional to make a polite request, express a wish or imagine a situation"
      - id: isc-11-french-ch04-t04
        title: "Subjonctif présent for feelings and obligation; il faut que / il ne faut pas que"
        learning_outcomes:
          - "Form the subjonctif présent of regular and common irregular verbs (être, avoir, aller, faire, pouvoir, savoir, vouloir)"
          - "Express necessity and feelings with il faut que, je suis content(e) que, j'ai peur que + subjonctif"
      - id: isc-11-french-ch04-t05
        title: "Subjonctif or indicatif? (j'aime que, j'espère que, je crois que, je ne crois pas que); verb or conjunction + subjonctif or infinitif"
        learning_outcomes:
          - "Decide whether a clause needs the subjonctif or the indicatif and justify the choice"
          - "Use an infinitive instead of the subjunctive when both clauses have the same subject (avant de partir / avant qu'il parte)"
    removed_topics: []
    literature_texts: []
  - id: isc-11-french-ch05
    number: 5
    title: "Grammaire (2): structures verbales"
    unit: "4. Grammar"
    topics:
      - id: isc-11-french-ch05-t01
        title: "Hypothesis with si: si + présent -> présent / futur (certain); si + imparfait -> conditionnel présent (uncertain); et si ...? + imparfait"
        learning_outcomes:
          - "Complete si-clauses with the correct tense sequence for a likely and an unlikely condition"
          - "Make a suggestion with Et si on + imparfait ...?"
      - id: isc-11-french-ch05-t02
        title: "Indirect speech in the present (discours indirect au présent): que, si, ce que, ce qui, question words"
        learning_outcomes:
          - "Report statements and questions with il dit que, il demande si, elle veut savoir ce que, changing pronouns correctly"
      - id: isc-11-french-ch05-t03
        title: "Prepositional verbs and adjectives (penser à, avoir besoin de, s'intéresser à, prêt à, fier de)"
        learning_outcomes:
          - "Use verbs and adjectives with the preposition they require in sentences"
      - id: isc-11-french-ch05-t04
        title: "Nominalisation des verbes (partir -> le départ, augmenter -> l'augmentation)"
        learning_outcomes:
          - "Turn a verb into its noun to write headlines, titles and concise sentences"
      - id: isc-11-french-ch05-t05
        title: "Le gérondif (en + participe présent)"
        learning_outcomes:
          - "Use the gérondif to express simultaneity, manner or condition (Il travaille en écoutant de la musique)"
      - id: isc-11-french-ch05-t06
        title: "La voix passive (être + participe passé, par / de)"
        learning_outcomes:
          - "Transform active sentences into the passive and back in the present, passé composé and future"
    removed_topics: []
    literature_texts: []
  - id: isc-11-french-ch06
    number: 6
    title: "Grammaire (3): pronoms, participe passé et mise en relief"
    unit: "4. Grammar"
    topics:
      - id: isc-11-french-ch06-t01
        title: "Double pronominalisation: order of COD and COI pronouns (me le, le lui, la leur)"
        learning_outcomes:
          - "Replace a direct and an indirect object with pronouns in the correct order, in statements and negatives"
      - id: isc-11-french-ch06-t02
        title: "Pronouns en (quantity; verbe + de) and y (place; verbe + à)"
        learning_outcomes:
          - "Replace a quantity or a complement introduced by de with en, and a place or a complement introduced by à with y"
      - id: isc-11-french-ch06-t03
        title: "Indefinite pronouns: plusieurs, quelques-uns, certains, chacun"
        learning_outcomes:
          - "Use indefinite pronouns with correct agreement to refer to part of a group"
      - id: isc-11-french-ch06-t04
        title: "Relative pronouns: qui, que, dont, où and compound forms (lequel, auquel, duquel, auxquelles, desquels)"
        learning_outcomes:
          - "Join two sentences with the correct simple or compound relative pronoun, including after a preposition"
      - id: isc-11-french-ch06-t05
        title: "Past participle agreement (le participe passé et son accord) with être, with avoir and a preceding COD, and with pronominal verbs"
        learning_outcomes:
          - "Make the past participle agree correctly in compound tenses and explain the rule applied"
      - id: isc-11-french-ch06-t06
        title: "Emphasis (la mise en relief): c'est ... qui / que; ce qui, ce que, ce dont ..., c'est ..."
        learning_outcomes:
          - "Rewrite a sentence to highlight one element with c'est ... qui / que or Ce que je veux dire, c'est que ..."
    removed_topics: []
    literature_texts: []
  - id: isc-11-french-ch07
    number: 7
    title: "Grammaire (4): connecteurs, adverbes et prépositions"
    unit: "4. Grammar"
    topics:
      - id: isc-11-french-ch07-t01
        title: "Cause and consequence: car, comme, puisque, grâce à, en effet; c'est pourquoi, voilà pourquoi, par conséquent"
        learning_outcomes:
          - "Join two ideas with a connector of cause or consequence and place comme and puisque correctly"
      - id: isc-11-french-ch07-t02
        title: "Purpose: pour que / afin que + subjonctif, pour / afin de + infinitif"
        learning_outcomes:
          - "Express purpose with the infinitive when the subject is the same and with the subjunctive when it changes"
      - id: isc-11-french-ch07-t03
        title: "Opposition and concession: alors que, au contraire; bien que, cependant, malgré, pourtant, néanmoins, quand même, tout de même"
        learning_outcomes:
          - "Contrast or concede ideas, using bien que with the subjunctive and malgré with a noun"
      - id: isc-11-french-ch07-t04
        title: "Addition, chronology and conclusion: également, aussi, finalement, à la fin"
        learning_outcomes:
          - "Structure a paragraph with connectors of addition, sequence and conclusion"
      - id: isc-11-french-ch07-t05
        title: "Adverbs of quantity (environ, presque, autant), manner (prudemment, brièvement) and time (autrefois, aussitôt, récemment)"
        learning_outcomes:
          - "Form adverbs in -ment, including -amment / -emment, and place adverbs correctly in simple and compound tenses"
      - id: isc-11-french-ch07-t06
        title: "Time indicators (la veille, le lendemain, dès que, d'ici, dans, vers) and prepositions of place (par, en)"
        learning_outcomes:
          - "Situate actions in time with the right time indicator and use par and en with places and means of transport"
    removed_topics: []
    literature_texts: []
  - id: isc-11-french-ch08
    number: 8
    title: "Thèmes (1): culture, santé et bien-être"
    unit: null
    topics:
      - id: isc-11-french-ch08-t01
        title: "Entertainment: cinema, TV and streaming, gaming, the internet; celebrity culture and role models"
        learning_outcomes:
          - "Discuss the role of entertainment in young people's lives and the responsibilities of celebrities, using topic vocabulary"
      - id: isc-11-french-ch08-t02
        title: "Identity and culture: style, language, groups and fashion; cultural heritage, monuments, festivals and traditions"
        learning_outcomes:
          - "Describe how young people express identity and present a heritage site or festival of France or India"
      - id: isc-11-french-ch08-t03
        title: "The arts: theatre, music, visual arts, dance, literature and film; access, funding, prizes and diversity"
        learning_outcomes:
          - "Give and justify an opinion on public funding of the arts or on representation in films"
      - id: isc-11-french-ch08-t04
        title: "Health and fitness: sport in society, fair play, physical and mental health, sleep, self-esteem, healthcare"
        learning_outcomes:
          - "Compare individual and team sports and give advice on physical and mental health"
      - id: isc-11-french-ch08-t05
        title: "Nutrition: diets and eating habits, food production and the environment, organic food, food waste, fair trade, labelling"
        learning_outcomes:
          - "Argue for or against a food-related measure such as clearer food labelling, with examples"
      - id: isc-11-french-ch08-t06
        title: "Managing well-being: work-life balance, leisure activities and relaxation"
        learning_outcomes:
          - "Describe one's own balance of study and leisure and suggest ways to reduce stress"
    removed_topics: []
    literature_texts: []
  - id: isc-11-french-ch09
    number: 9
    title: "Thèmes (2): éducation, avenir, communauté et société"
    unit: null
    topics:
      - id: isc-11-french-ch09-t01
        title: "Life at school: education systems, discipline, workload, time management, school as preparation for life"
        learning_outcomes:
          - "Compare the French and Indian school systems and discuss student issues such as workload"
      - id: isc-11-french-ch09-t02
        title: "Further and higher education: access and barriers, costs and benefits, vocational courses, apprenticeships, gap years"
        learning_outcomes:
          - "Weigh the costs and benefits of higher education against alternatives such as an apprenticeship"
      - id: isc-11-french-ch09-t03
        title: "Careers and work: career options, workplaces, unemployment, money versus job satisfaction, volunteering"
        learning_outcomes:
          - "Present one's future plans and justify a career choice"
      - id: isc-11-french-ch09-t04
        title: "Equality and diversity: inclusion, gender equality, social mobility, prejudice, immigration and integration"
        learning_outcomes:
          - "Explain a form of prejudice and propose measures that promote inclusion"
      - id: isc-11-french-ch09-t05
        title: "Lifestyle: family and friends, the generation gap, urban, rural and coastal life, overcrowding, isolation, lifestyle choices"
        learning_outcomes:
          - "Compare life in a city and in a village and discuss changing patterns of family life"
      - id: isc-11-french-ch09-t06
        title: "Society: law and order, local and national government, national and global citizenship, rights and responsibilities"
        learning_outcomes:
          - "Explain the rights and responsibilities of a citizen with examples from one's own community"
    removed_topics: []
    literature_texts: []
  - id: isc-11-french-ch10
    number: 10
    title: "Thèmes (3): la planète, les sciences et les technologies"
    unit: null
    topics:
      - id: isc-11-french-ch10-t01
        title: "The environment: climate change, pollution and solutions, biodiversity, treatment of animals, population growth"
        learning_outcomes:
          - "Describe an environmental problem, its causes and possible solutions by individuals and governments"
      - id: isc-11-french-ch10-t02
        title: "Sustainable living: natural resources, recycling, waste, overconsumption, fossil and renewable energy"
        learning_outcomes:
          - "Propose everyday actions in housing, food and travel that reduce one's environmental impact"
      - id: isc-11-french-ch10-t03
        title: "Protecting our world: sustainable tourism, global cooperation versus national agendas, environmental movements"
        learning_outcomes:
