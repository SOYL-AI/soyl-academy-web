exam_notes: >-
  There is no board examination in Class XI: Class XI is year one of the two-year ISC 2028 course and the school sets the
  Class XI examination on the Class XI portion. The syllabus prescribes for Class XI Paper I Theory: 3 hours, 70 marks, on
  the six Class XI topics below, and Paper II Project Work: 30 marks - two projects on any topic of the theory syllabus.
  Written projects have an abstract (reason for the topic, methods and materials), a main essay (brief background,
  explanation of the theme and issue, analysis and critical evaluation, conclusion), references and an optional appendix;
  audio-visual projects have an abstract, a communication strategy (theme, title, primary audience, message, language),
  references and an optional appendix. CISCE suggests projects such as analysing the front pages of two newspapers for
  inverted pyramid, headlines and photographs, a captioned photo essay, analysing gender stereotyping in advertisements,
  a radio script (news bulletin, radio drama or feature), an essay on a recent PR campaign and a PR crisis strategy for
  the school or neighbourhood. Projects are marked on a CISCE grade rubric (preparation, procedure, observation,
  inference, presentation; up to 3 marks each) with no viva; this project work is not part of the chapters below.
  CISCE lists topics with scope notes, not textbook chapters: SOYL groups them into 9 teachable chapters in syllabus order.
  No unit-wise marks weightage is published for ISC Mass Media & Communication. The Class XII portion is in
  isc-12-mass-media-communication.
