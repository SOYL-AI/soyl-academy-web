    number: 1
    title: "The Living World"
    unit: "Unit 1: Diversity of Living Organisms"
    topics:
      - id: isc-11-biology-ch01-t01
        title: "Need for classification; taxonomy (numerical taxonomy, cytotaxonomy, chemotaxonomy) and systematics"
        learning_outcomes:
          - "Explain why living organisms need to be classified"
          - "Distinguish numerical taxonomy, cytotaxonomy and chemotaxonomy by the data each uses"
      - id: isc-11-biology-ch01-t02
        title: "Concept of species (biological species concept); taxonomic hierarchy from species to kingdom with examples of man, housefly, mango and wheat"
        learning_outcomes:
          - "Arrange the taxonomic categories in hierarchical order"
          - "Write the classification of man and of mango from kingdom to species"
      - id: isc-11-biology-ch01-t03
        title: "Binomial nomenclature: rules and advantages of scientific names"
        learning_outcomes:
          - "Write scientific names correctly following the rules of binomial nomenclature"
          - "State two advantages of scientific names over common names"
      - id: isc-11-biology-ch01-t04
        title: "Artificial, natural and phylogenetic systems of classification"
        learning_outcomes:
          - "Compare artificial, natural and phylogenetic systems by the characters each uses"
