# ISC Class 11 Biology (863), Paper I Theory - ISC 2028 syllabus, CLASS XI portion only.
# Source: platform/catalog/sources/cisce.md#isc-2028-biology. Topic wording is our own summary of the official scope.
subject_id: isc-11-biology
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-biology, isc-2028-regulations]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course. There is no board examination in Class XI: the final
  examination is conducted internally by the school on the Class XI portion, and promotion to Class XII needs at least
  35% on the cumulative average in five subjects including English, with 75% attendance (ISC 2028 Regulations).
  The syllabus prescribes, and the school examination usually follows: Paper I Theory, 3 hours, 70 marks; Paper II
  Practical, 3 hours, 15 marks, plus Project Work 10 marks and Practical File 5 marks (total 30). Practical work covers
  parts and handling of dissecting and compound microscopes; food tests (starch, glucose, sucrose, proteins, fats);
  effect of thawing, heat and alcohol on beetroot cell permeability; paper chromatography of leaf pigments; effect of CO2
  concentration on photosynthesis; plasmolysis and the potato osmoscope; identifying modified roots, stems and leaves;
  temporary slides of Mucor or Rhizopus, onion peel, mitosis in onion root tip and T.S. of monocot and dicot stems and
  roots; and timed spotting (three minutes per spot) of slides, specimens and physiological set-ups. Handwritten
  investigatory projects are preferred. SOYL covers Paper I only. All structures are taught with labelled diagrams;
  the syllabus also lists scientists and their contributions (e.g. Woese, Whittaker, Mitchell, Singer and Nicolson,
  Landsteiner) and abbreviations (e.g. RuBisCO, ETS, ANF, GFR) to be learnt, which are folded into the topics below.
  No Class XI specimen paper is published for Biology. CISCE lists topics under five units, not textbook chapters:
  SOYL groups them into 21 teachable chapters in syllabus order. The Class XII portion is in isc-12-biology.
units:
  - { name: "Unit 1: Diversity of Living Organisms", marks: 9 }
  - { name: "Unit 2: Structural Organisation in Animals and Plants", marks: 11 }
  - { name: "Unit 3: Cell: Structure and Function", marks: 15 }
  - { name: "Unit 4: Plant Physiology", marks: 17 }
  - { name: "Unit 5: Human Physiology", marks: 18 }
chapters:
