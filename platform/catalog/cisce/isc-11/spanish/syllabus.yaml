      - id: isc-11-spanish-ch11-t05
        title: "Lifestyle: family and friends, the generation gap, urban, rural and coastal life, overcrowding, isolation, lifestyle choices"
        learning_outcomes:
          - "Compare life in a city and in a village and discuss changing patterns of family life"
      - id: isc-11-spanish-ch11-t06
        title: "Society: law and order, local and national government, national and global citizenship, rights and responsibilities"
        learning_outcomes:
