exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course. There is no board examination in Class XI: the school conducts
  the Class XI examination on the Class XI portion, and promotion to Class XII needs at least 35% on the cumulative
  average in five subjects including English, with 75% attendance (ISC 2028 Regulations). The syllabus prescribes, and
  the school examination usually follows: Paper I Theory, 3 hours, 70 marks; Paper II Practical, 30 marks. For Class XI
  the practical component is any five practicals recorded in a record book: a 24-hour dietary recall analysed against
  food groups and RDA; basic cooking (boiling, steaming, frying, baking) of simple snacks; a personal time-and-energy
  log with a modified routine; centre and side flower arrangements; basic stitches (hemming, running stitch, attaching
  fasteners), laundering of cotton, linen, wool, silk and rayon, stain removal and designing a garment care label; an
  observation visit to a nursery school to record children's play; and a survey of teenagers' social media use.
  SOYL covers Paper I only. No unit-wise marks weightage is published for Class XI, and no Class XI specimen paper is
  listed for this subject. CISCE lists topics with scope notes under seven themes, not textbook chapters: SOYL groups
  them into 11 teachable chapters in syllabus order. The Class XII portion is in isc-12-home-science.
