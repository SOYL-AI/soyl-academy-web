        learning_outcomes:
          - "Explain how Hardy's view of fate and indifferent forces shapes his poetry"
      - id: isc-11-elective-english-ch08-t02
        title: "Neutral Tones: the bleak memory of a love that ended"
        learning_outcomes:
          - "Analyse how the wintry setting and colourless imagery reflect the dead relationship"
      - id: isc-11-elective-english-ch08-t03
        title: "The Man He Killed: a soldier reflects on killing a stranger in war"
        learning_outcomes:
          - "Explain the speaker's attempt to justify the killing and why his reasoning falters"
          - "Discuss the poem's view of the senselessness of war"
      - id: isc-11-elective-english-ch08-t04
        title: "The Going: an elegy for a wife's sudden death"
        learning_outcomes:
          - "Explain the speaker's grief and regret and the autobiographical background of the poem"
      - id: isc-11-elective-english-ch08-t05
        title: "The Convergence of the Twain: the great ship and the iceberg"
        learning_outcomes:
          - "Explain how the poem presents the sinking as a meeting arranged by fate"
          - "Analyse the contrast between human pride and luxury and the forces of nature"
    removed_topics: []
    literature_texts:
      - { title: "Neutral Tones", author: "Thomas Hardy" }
      - { title: "The Man He Killed", author: "Thomas Hardy" }
      - { title: "The Going", author: "Thomas Hardy" }
      - { title: "The Convergence of the Twain", author: "Thomas Hardy" }
  - id: isc-11-elective-english-ch09
