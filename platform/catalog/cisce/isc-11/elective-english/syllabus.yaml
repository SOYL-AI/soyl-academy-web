# ISC Class 11 Elective English (850) - ISC 2028 course, CLASS XI section only.
# Source: platform/catalog/sources/cisce.md#isc-2028-elective-english and #isc-2028-prescribed-books.
# Literature: titles and authors only. Students read the texts in their own copies; topic wording is our own.
subject_id: isc-11-elective-english
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-elective-english, isc-2028-prescribed-books, isc-2028-regulations]
exam_notes: >-
  Elective English (850) is an optional elective, separate from compulsory English, offering a wider literature course.
  There is no board examination in Class XI: Class XI is year one of the two-year ISC 2028 course and the school sets the
  Class XI examination on the Class XI portion listed here. The syllabus prescribes Paper I Theory (3 hours, 80 marks),
  which compulsorily covers Prose (novel), Drama and Poetry: candidates choose ONE of the two prescribed novels (Animal
  Farm or From Heaven Lake) and ONE of the two prescribed plays (Twelve Angry Men or The Importance of Being Earnest),
  while all the prescribed poems from Fireflies (Macmillan Education India) are compulsory. Questions may be
  character-based, incident-based, broad, theme-based or call for critical evaluation; credit is given for textual detail
  and personal response, and answers should be precise. Paper II Project Work for Class XI (20 marks, assessed internally
  by the school, on Class XI texts only, two different texts): (A) a written assignment of 800-1000 words titled as a
  question, with introduction, methods, results, conclusion and bibliography (process 2, content 4, presentation 4);
  (B) an audio-visual (slide) presentation of 15-20 minutes and 20-25 slides followed by discussion (organisation/content 4,
  presentation 2, discussion 4). CISCE lists texts and areas of study, not chapters: SOYL gives each novel and play its own
  chapter (author, plot, characters, themes, devices, personal response) and each prescribed poet a chapter with one topic
  per poem, after a chapter on poetic forms, devices and critical appreciation. No section-wise marks are published, so
  units carry no marks. No Class XI specimen paper is published for this subject. The Class XII portion is in
  isc-12-elective-english.
units:
  - { name: "I. Prose (Novel)", marks: null }
  - { name: "II. Drama", marks: null }
  - { name: "III. Poetry", marks: null }
chapters:
  - id: isc-11-elective-english-ch01
    number: 1
    title: "Novel (Option 1): Animal Farm - George Orwell"
    unit: "I. Prose (Novel)"
    topics:
      - id: isc-11-elective-english-ch01-t01
        title: "George Orwell's life, his political views and the background of the Russian Revolution and Stalin's rule"
        learning_outcomes:
          - "Outline the events of Orwell's life that shaped his distrust of totalitarian power"
          - "Explain the historical events in Russia from 1917 to the 1940s that the novel allegorises"
      - id: isc-11-elective-english-ch01-t02
        title: "The fable form and allegory: Old Major's dream, the rebellion and the Seven Commandments"
        learning_outcomes:
          - "Explain why Orwell calls the work a fairy story and how the animal fable works as political allegory"
          - "Describe how the rebellion against Mr Jones begins and what the Seven Commandments are meant to guarantee"
      - id: isc-11-elective-english-ch01-t03
        title: "Plot and key incidents: the Battle of the Cowshed, the windmill, Snowball's expulsion and the show trials"
        learning_outcomes:
          - "Summarise the main incidents of the novel in sequence and explain the significance of each"
          - "Trace how the Commandments are altered step by step and what each change reveals"
      - id: isc-11-elective-english-ch01-t04
        title: "Characters and what they represent: Napoleon, Snowball, Squealer, Boxer, Benjamin, Mollie, Moses and Mr Jones"
        learning_outcomes:
          - "Evaluate the characters of Napoleon and Snowball and the historical figures they suggest"
          - "Analyse Boxer's loyalty and fate and Benjamin's cynicism as responses to tyranny"
          - "Explain how Squealer uses language to control the other animals"
      - id: isc-11-elective-english-ch01-t05
        title: "Themes: power and corruption, propaganda, class, education and the betrayal of ideals"
        learning_outcomes:
          - "Discuss how the novel shows a revolution turning into a new tyranny"
          - "Explain the role of propaganda, fear and the ignorance of the masses in keeping the pigs in power"
      - id: isc-11-elective-english-ch01-t06
        title: "Satire, irony and the final scene; personal response and relevance to contemporary society"
        learning_outcomes:
          - "Identify examples of satire, irony and dark humour and explain their effect"
          - "Interpret the ending and present a reasoned personal response on the novel's relevance today"
    removed_topics:
      - "Class XII novels: The Book Thief (Markus Zusak) or The Namesake (Jhumpa Lahiri) (see isc-12-elective-english)"
    literature_texts:
      - { title: "Animal Farm", author: "George Orwell" }
  - id: isc-11-elective-english-ch02
    number: 2
    title: "Novel (Option 2): From Heaven Lake - Vikram Seth"
    unit: "I. Prose (Novel)"
    topics:
      - id: isc-11-elective-english-ch02-t01
        title: "Vikram Seth's life and the travel narrative as a literary form"
        learning_outcomes:
          - "Outline Seth's life, including his years as a student in China, and his range as a writer"
          - "Explain the features of travel writing and how it differs from a novel"
      - id: isc-11-elective-english-ch02-t02
        title: "The journey: from a student trip to Xinjiang and Heaven Lake to hitch-hiking across Tibet to Nepal and India"
        learning_outcomes:
          - "Trace the route of the journey and the decision that sets it in motion"
          - "Describe the main stages and incidents of the journey and the difficulties met at each"
      - id: isc-11-elective-english-ch02-t03
        title: "People on the road: the truck driver Sui, officials, fellow travellers and hosts"
        learning_outcomes:
          - "Analyse the friendship between the narrator and the truck driver and how it develops"
          - "Explain how encounters with officials and strangers reveal Chinese and Tibetan society of the early 1980s"
      - id: isc-11-elective-english-ch02-t04
        title: "The narrator: curiosity, humour, language skills and the use of personal connections"
        learning_outcomes:
          - "Evaluate the narrator's character as revealed through his reactions and choices"
          - "Explain how knowledge of the language and of personal connections helps him overcome bureaucracy"
      - id: isc-11-elective-english-ch02-t05
        title: "Themes and description: landscape, culture, religion and politics in Xinjiang and Tibet"
        learning_outcomes:
          - "Analyse Seth's descriptions of landscape and how they create atmosphere"
          - "Discuss the book's observations on Tibetan culture and religion under Chinese rule"
      - id: isc-11-elective-english-ch02-t06
        title: "Style, humour and personal response; relevance to contemporary society"
        learning_outcomes:
          - "Identify features of Seth's style such as understatement, humour and close observation"
          - "Present a reasoned personal response to the book and its picture of crossing cultures"
    removed_topics: []
    literature_texts:
      - { title: "From Heaven Lake", author: "Vikram Seth" }
  - id: isc-11-elective-english-ch03
    number: 3
    title: "Drama (Option 1): Twelve Angry Men - Reginald Rose"
    unit: "II. Drama"
    topics:
      - id: isc-11-elective-english-ch03-t01
        title: "Reginald Rose's life, the play's origins as television drama and the American jury system"
        learning_outcomes:
          - "Outline Rose's life and his experience as a juror that inspired the play"
          - "Explain how a jury reaches a verdict and the meaning of 'reasonable doubt'"
      - id: isc-11-elective-english-ch03-t02
        title: "Plot and key incidents: the first vote, the knife, the evidence of the witnesses and the final verdict"
        learning_outcomes:
          - "Summarise how the jury moves from eleven votes to one towards a unanimous verdict"
          - "Explain how each piece of evidence is questioned and why it weakens the case"
      - id: isc-11-elective-english-ch03-t03
        title: "Characters: Juror 8 and the jurors who oppose and support him, especially Jurors 3, 4, 9 and 10"
        learning_outcomes:
          - "Evaluate Juror 8 as the play's moral centre and analyse his methods of persuasion"
          - "Analyse how personal history and prejudice shape the attitudes of Jurors 3 and 10"
          - "Compare the reasoning of Juror 4 with the emotional responses of others"
      - id: isc-11-elective-english-ch03-t04
        title: "Themes: justice and reasonable doubt, prejudice, personal responsibility and courage to dissent"
        learning_outcomes:
          - "Discuss how the play examines prejudice as a danger to justice"
          - "Explain the play's view of civic duty and the courage of one person to stand alone"
      - id: isc-11-elective-english-ch03-t05
        title: "Dramatic devices: a single setting, real time, tension, the heat and the storm; personal response"
        learning_outcomes:
          - "Analyse how the confined room, the heat and stage directions build tension"
          - "Present a reasoned personal assessment of the play and its relevance to courts and society today"
    removed_topics:
      - "Class XII plays: An Enemy of the People (Henrik Ibsen) or Tughlaq (Girish Karnad) (see isc-12-elective-english)"
    literature_texts:
      - { title: "Twelve Angry Men", author: "Reginald Rose" }
  - id: isc-11-elective-english-ch04
    number: 4
    title: "Drama (Option 2): The Importance of Being Earnest - Oscar Wilde"
    unit: "II. Drama"
    topics:
      - id: isc-11-elective-english-ch04-t01
        title: "Oscar Wilde's life, Victorian society and the comedy of manners"
        learning_outcomes:
          - "Outline Wilde's life and his place as a wit and dramatist of the 1890s"
          - "Explain the features of the comedy of manners with reference to this play"
      - id: isc-11-elective-english-ch04-t02
        title: "Plot and key incidents: double identities, 'Bunburying', the two engagements and the handbag revelation"
        learning_outcomes:
          - "Summarise the main incidents of each act and how the misunderstandings multiply"
          - "Explain how the final revelation resolves the confusion over the name Ernest"
      - id: isc-11-elective-english-ch04-t03
        title: "Characters: Jack Worthing, Algernon Moncrieff, Gwendolen, Cecily, Lady Bracknell, Miss Prism and Dr Chasuble"
        learning_outcomes:
          - "Compare Jack and Algernon and their reasons for leading double lives"
          - "Evaluate Lady Bracknell as a satirical figure of upper-class values"
          - "Contrast Gwendolen and Cecily and their romantic fantasies"
      - id: isc-11-elective-english-ch04-t04
        title: "Themes: marriage, social class, respectability, hypocrisy and the triviality of the serious"
        learning_outcomes:
          - "Discuss how the play mocks Victorian attitudes to marriage, money and class"
          - "Explain the double meaning of the title and the theme of identity"
      - id: isc-11-elective-english-ch04-t05
        title: "Wit and dramatic devices: epigram, paradox, irony, farce and coincidence; personal response"
        learning_outcomes:
          - "Identify examples of epigram, paradox and verbal irony and explain their comic effect"
          - "Present a reasoned personal assessment of the play and its relevance today"
    removed_topics: []
    literature_texts:
      - { title: "The Importance of Being Earnest", author: "Oscar Wilde" }
  - id: isc-11-elective-english-ch05
    number: 5
    title: "Studying Poetry: Forms, Literary Devices and Critical Appreciation"
    unit: "III. Poetry"
    topics:
      - id: isc-11-elective-english-ch05-t01
        title: "Types of poems: lyric, Petrarchan and Shakespearean sonnet, ballad, elegy, blank verse and free verse"
        learning_outcomes:
          - "Identify the form of a poem from its structure, rhyme and metre and state its characteristics"
          - "Distinguish the Petrarchan from the Shakespearean sonnet by rhyme scheme and turn of argument"
      - id: isc-11-elective-english-ch05-t02
        title: "Types of poems: narrative, pastoral, romantic poetry and the dramatic monologue"
        learning_outcomes:
          - "Describe the features of each type and recognise them in the prescribed poems"
      - id: isc-11-elective-english-ch05-t03
        title: "Literary devices (1): simile, metaphor, personification, apostrophe, imagery and symbolism"
        learning_outcomes:
          - "Recognise each device in an extract and explain the effect it creates"
      - id: isc-11-elective-english-ch05-t04
        title: "Literary devices (2): alliteration, assonance, onomatopoeia, repetition and enjambment"
        learning_outcomes:
          - "Explain how sound devices and line breaks contribute to meaning and mood"
      - id: isc-11-elective-english-ch05-t05
        title: "Literary devices (3): irony, pun, contrast, climax and anti-climax, hyperbole, oxymoron and litotes"
        learning_outcomes:
          - "Distinguish closely related devices (e.g. hyperbole and litotes, climax and anti-climax) with examples"
      - id: isc-11-elective-english-ch05-t06
        title: "Writing a critical appreciation: poet's life, autobiographical element, type, setting, theme, mood, levels of meaning, rhyme scheme, symbolism, imagery, devices and personal response"
        learning_outcomes:
          - "Write a structured critical appreciation of a prescribed poem covering all the required components"
          - "Support every point with close reference to the poem rather than general statements"
    removed_topics:
      - "Class XII Fireflies poets: T.S. Eliot, Maya Angelou, Sylvia Plath, Gieve Patel, Sujata Bhatt, Benjamin Zephaniah, Seamus Heaney (see isc-12-elective-english)"
    literature_texts: []
  - id: isc-11-elective-english-ch06
    number: 6
    title: "Fireflies: John Milton"
    unit: "III. Poetry"
    topics:
      - id: isc-11-elective-english-ch06-t01
        title: "John Milton: life, Puritan faith, blindness and the epic style"
        learning_outcomes:
          - "Relate events of Milton's life, including his loss of sight, to the concerns of his poems"
          - "Explain the features of the epic and of Milton's elevated style and blank verse"
      - id: isc-11-elective-english-ch06-t02
        title: "Song on May Morning: a welcome to the season of spring"
        learning_outcomes:
          - "Explain how the morning and May are personified and what mood the song creates"
      - id: isc-11-elective-english-ch06-t03
        title: "When I consider how my light is spent (On His Blindness): talent, doubt and patient faith"
        learning_outcomes:
          - "Explain the speaker's anxiety about his unused talent and how Patience answers it"
          - "Identify the features of the Petrarchan sonnet and the parable alluded to in the poem"
      - id: isc-11-elective-english-ch06-t04
        title: "Paradise Lost, Book I (lines 242-270): Satan's defiant speech on his new realm"
        learning_outcomes:
          - "Explain Satan's attitude to his fall and his claim about the power of the mind"
          - "Analyse how the speech's rhetoric makes Satan both impressive and morally flawed"
      - id: isc-11-elective-english-ch06-t05
        title: "Paradise Lost, Book IX (lines 733-785): Eve's reasoning before tasting the forbidden fruit"
        learning_outcomes:
          - "Trace the steps of Eve's argument and identify where her reasoning goes wrong"
          - "Explain the significance of the moment for the poem's theme of disobedience and the Fall"
    removed_topics: []
    literature_texts:
      - { title: "Song on May Morning", author: "John Milton" }
      - { title: "When I consider how my light is spent (On His Blindness)", author: "John Milton" }
      - { title: "Paradise Lost, Book I (lines 242-270): Satan's speech", author: "John Milton" }
      - { title: "Paradise Lost, Book IX (lines 733-785): Eve's lines", author: "John Milton" }
  - id: isc-11-elective-english-ch07
    number: 7
    title: "Fireflies: Percy Bysshe Shelley"
    unit: "III. Poetry"
    topics:
      - id: isc-11-elective-english-ch07-t01
        title: "Percy Bysshe Shelley: life, radical politics and Romantic idealism"
        learning_outcomes:
          - "Relate Shelley's political radicalism and Romantic beliefs to the themes of his poems"
      - id: isc-11-elective-english-ch07-t02
        title: "England in 1819: a political sonnet against the rulers of the day"
        learning_outcomes:
          - "Explain the state of England that the poem attacks and the hope expressed at the end"
          - "Analyse how the sonnet form is used for protest"
      - id: isc-11-elective-english-ch07-t03
        title: "To a Skylark: the bird as a spirit of pure joy and the poet's longing"
        learning_outcomes:
          - "Explain the series of comparisons used to describe the skylark's song"
          - "Contrast the bird's unmixed joy with human sorrow as the speaker presents it"
      - id: isc-11-elective-english-ch07-t04
        title: "The Cloud: the cloud's own voice and the cycle of change and renewal"
        learning_outcomes:
          - "Explain how the speaking cloud describes its roles in nature and the idea that it changes but never dies"
          - "Identify examples of personification and imagery and comment on their effect"
      - id: isc-11-elective-english-ch07-t05
        title: "Autumn: A Dirge: the dying year"
        learning_outcomes:
          - "Explain the features of a dirge and how the poem presents the death of the year"
    removed_topics: []
    literature_texts:
      - { title: "England in 1819", author: "Percy Bysshe Shelley" }
      - { title: "To a Skylark", author: "Percy Bysshe Shelley" }
      - { title: "The Cloud", author: "Percy Bysshe Shelley" }
      - { title: "Autumn: A Dirge", author: "Percy Bysshe Shelley" }
  - id: isc-11-elective-english-ch08
