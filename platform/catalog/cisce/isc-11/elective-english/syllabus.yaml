        title: "Wilfred Owen: soldier-poet of the First World War and the pity of war"
        learning_outcomes:
          - "Relate Owen's war service and death to the realism and anger of his poems"
          - "Identify features of his technique such as pararhyme and harsh sound effects"
      - id: isc-11-elective-english-ch10-t02
        title: "Arms and the Boy: innocence set against weapons"
        learning_outcomes:
