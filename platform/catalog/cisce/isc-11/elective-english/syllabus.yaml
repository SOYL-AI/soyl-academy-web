    title: "Fireflies: William Butler Yeats"
    unit: "III. Poetry"
    topics:
      - id: isc-11-elective-english-ch09-t01
        title: "W.B. Yeats: Irish nationalism, Maud Gonne, myth and symbol"
        learning_outcomes:
