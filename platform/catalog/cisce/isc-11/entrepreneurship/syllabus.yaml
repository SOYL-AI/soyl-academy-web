# ISC Class 11 Entrepreneurship (859) - ISC 2028 course, CLASS XI year. New subject (code 859 was formerly Business Studies).
# Source: platform/catalog/sources/cisce.md#isc-2028-entrepreneurship. Topic wording is our own summary of the official scope.
subject_id: isc-11-entrepreneurship
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-entrepreneurship, isc-2028-regulations, isc-2027-class-xi-specimen-papers]
exam_notes: >-
  Entrepreneurship (859) is new in the ISC 2028 course (code 859 was previously Business Studies, which has become
  Entrepreneurship; the former Commerce is now Business Studies 857). There is no board examination in Class XI: Class XI
  is year one of the two-year course and the school sets the Class XI examination on the Class XI portion. The syllabus
  prescribes Paper I Theory of 3 hours, 70 marks, and Paper II Project Work, 30 marks; CISCE has published a Class XI
  specimen question paper for Entrepreneurship (Year 2027) as a guide to the school paper. Published Class XI weightage:
  Entrepreneurship 20, Business Ideation, Assessment and Planning 20, Sustainable Development and Entrepreneurship 5,
  Business Ethics and Corporate Governance 15, Government Schemes for Entrepreneurs 5, Artificial Intelligence Enabled
  Entrepreneurship 5 (total 70). Paper II: any two of three assignments, 15 marks each - a written project (e.g.
  classifying entrepreneurs by Danhof's types, a SWOT analysis of innovators, designing and pitching a non-app game using
  design thinking, women entrepreneurs and government schemes, use of intellectual property rights), a field visit or
  study tour report (MSME unit, AI-enabled organisation, CSR, waste management, NGOs), or a 7-10 day internship in an
  organisation not belonging to the family, with a feedback form; viva-voce is part of each assignment. Several items are
  prescribed at "meaning only" or "basic understanding" depth, and the topic titles below say so. CISCE lists units and
  sub-topics, not chapters: SOYL groups them into 12 teachable chapters in syllabus order.
units:
  - { name: "1. Entrepreneurship", marks: 20 }
  - { name: "2. Business Ideation, Assessment and Planning", marks: 20 }
  - { name: "3. Sustainable Development and Entrepreneurship", marks: 5 }
