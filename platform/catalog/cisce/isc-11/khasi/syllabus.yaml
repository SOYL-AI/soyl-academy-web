    number: 1
    title: "Composition writing (about 400 words)"
    unit: "Section A: Language"
    topics:
      - id: isc-11-khasi-ch01-t01
        title: "Planning a composition: choosing a topic, outline, introduction, body and conclusion"
        learning_outcomes:
          - "Choose a suitable topic from a choice of six and prepare an outline before writing"
          - "Write a well-organised composition of about 400 words in Khasi, divided into paragraphs"
      - id: isc-11-khasi-ch01-t02
        title: "Descriptive and narrative compositions"
        learning_outcomes:
          - "Describe an experience, journey, place or event in Khasi vividly and in a logical sequence"
      - id: isc-11-khasi-ch01-t03
        title: "Reflective and argumentative compositions: for and against, and conclusion"
        learning_outcomes:
          - "Present a point of view on a social or current issue in Khasi, supported by reasons and examples"
          - "Weigh opposing arguments fairly and write a balanced conclusion"
      - id: isc-11-khasi-ch01-t04
        title: "Story writing from a given sentence, proverb or outline"
        learning_outcomes:
          - "Write an original story in Khasi that develops a given opening line, proverb or outline to a meaningful end"
      - id: isc-11-khasi-ch01-t05
        title: "Language and style: word choice, idioms, spelling and punctuation"
        learning_outcomes:
          - "Use vocabulary and idiomatic expressions suited to the topic"
          - "Proofread a composition and correct its errors of spelling and punctuation in Khasi"
