      - id: isc-11-arabic-classical-ch05-t02
        title: "The present tense (al-fi'l al-mudari') and its prefixes and endings"
        learning_outcomes:
          - "Conjugate a regular verb in the present tense and identify the person from its prefix and ending"
      - id: isc-11-arabic-classical-ch05-t03
        title: "The imperative (al-amr) and negation (ma, la, lam, lan)"
        learning_outcomes:
          - "Form the imperative from the present tense"
