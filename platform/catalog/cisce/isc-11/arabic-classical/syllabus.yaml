      - id: isc-11-arabic-classical-ch04-t04
        title: "Interrogative particles in nominal sentences (a, hal, ma, man, ayna, kayfa, kam)"
        learning_outcomes:
          - "Ask and answer questions with the common interrogative particles"
    removed_topics: []
    literature_texts: []
  - id: isc-11-arabic-classical-ch05
