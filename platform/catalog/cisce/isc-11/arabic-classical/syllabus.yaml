# ISC Class 11 Arabic (Classical Language elective, code 837) - ISC 2028 course, CLASS XI year.
# CISCE has not bifurcated the syllabus, so this file covers the whole Classes XI-XII syllabus and both prescribed books.
# Prescribed books: titles and authors only, as transliterated by CISCE. Titles are in English with transliterated Arabic terms.
subject_id: isc-11-arabic-classical
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-classical-languages, isc-2028-prescribed-books, isc-2028-regulations]
exam_notes: >-
  There is no board examination in Class XI: Class XI is year one of the two-year ISC 2028 course and the school sets the
  Class XI examination on the portion of the syllabus covered during the year. CISCE has not bifurcated this syllabus (the
  Class XII ISC paper is set on the entire syllabus), so this file covers the whole Classes XI-XII Arabic syllabus and nothing
  is removed. Paper I Theory (3 hours, 80 marks), which the school examination normally follows: (a) questions on grammar -
  articles, suffixed pronouns, relative pronouns, Sifat wa Mausuf, Mudaf wa Mudaf Ilaihi, the nominal sentence, cases of the
  noun and simple forms of the verb; (b) unseen translation from English into Arabic of short prose sentences and a continuous
  prose passage; (c) translation from the prescribed books, with no choice of passages; (d) short-answer questions on the
  subject matter of the prescribed books; (e) composition - reproducing descriptive and narrative passages from the text in
  simple Arabic. CISCE does not publish marks per part. Prescribed books (Appendix I, ISC 2028): Durus Al-Lughatal-Arabiyya
  Part 1 (complete) and Part 2 (lessons 1-15) by Dr. V. Abdur Rahim (Islamic Foundation Trust, Chennai). The syllabus text also
  says the prescribed books will include about 150 pages of selections of classical and modern Arabic prose and poetry;
  Appendix I names only the Durus books, so SOYL follows Appendix I. Paper II Project Work for Class XI (20 marks, assessed
  internally by the school during the year): Listening (6) - an unseen passage of about 500 words, a poem or an audio clip
  heard twice, with objective questions; Speaking (6) - an individual presentation of about three minutes (extempore,
  declamation, recitation, debate; the suggested tasks include reading out, after correcting, a grammatically incorrect
  passage of 150-200 words based on the grammar syllabus) followed by discussion with the teacher; Writing (8) - one
  assignment of about 200 words on any aspect of the language or literature studied in Class XI. CISCE sets no question paper
  for project work. Titles are in English / CISCE transliteration; Arabic-script titles to be added in language review. CISCE
  lists topics not chapters; SOYL grouped them into teachable chapters in syllabus order.
units:
  - { name: "(a) Grammar", marks: null }
  - { name: "(b) Unseen translation from English into Arabic", marks: null }
  - { name: "(c) and (d) Prescribed books: translation and short-answer questions", marks: null }
  - { name: "(e) Composition", marks: null }
chapters:
  - id: isc-11-arabic-classical-ch01
    number: 1
    title: "Articles and the noun"
    unit: "(a) Grammar"
    topics:
      - id: isc-11-arabic-classical-ch01-t01
        title: "The definite article al- and the indefinite noun with tanwin"
        learning_outcomes:
          - "Make a noun definite with al- and indefinite with tanwin, and explain the difference in meaning"
      - id: isc-11-arabic-classical-ch01-t02
        title: "Sun and moon letters (al-huruf al-shamsiyya wa al-qamariyya)"
        learning_outcomes:
          - "Classify nouns by their first letter and pronounce the article correctly before sun and moon letters"
      - id: isc-11-arabic-classical-ch01-t03
        title: "Gender: masculine and feminine nouns; ta marbuta"
        learning_outcomes:
          - "State the gender of a noun and form the feminine of adjectives and nouns of profession with ta marbuta"
      - id: isc-11-arabic-classical-ch01-t04
        title: "Number: singular, dual, sound plurals and common broken plurals"
        learning_outcomes:
          - "Form the dual and the sound masculine and feminine plurals, and give the broken plural of common nouns from the lessons"
    removed_topics: []
    literature_texts: []
  - id: isc-11-arabic-classical-ch02
    number: 2
    title: "Pronouns: separate, suffixed, demonstrative and relative"
    unit: "(a) Grammar"
    topics:
      - id: isc-11-arabic-classical-ch02-t01
        title: "Separate personal pronouns (ana, anta, anti, huwa, hiya, nahnu, antum, hum)"
        learning_outcomes:
          - "Use the separate pronouns as subjects of nominal sentences with the matching predicate"
      - id: isc-11-arabic-classical-ch02-t02
        title: "Suffixed pronouns on nouns, prepositions and verbs (kitabuhu, minka, ra'aytuhu)"
        learning_outcomes:
          - "Attach the correct suffixed pronoun to show possession, the object of a preposition or the object of a verb"
      - id: isc-11-arabic-classical-ch02-t03
        title: "Demonstratives: hadha, hadhihi, dhalika, tilka, ha'ula'i, ula'ika"
        learning_outcomes:
          - "Choose the demonstrative that agrees with the noun in gender, number and nearness"
      - id: isc-11-arabic-classical-ch02-t04
        title: "Relative pronouns: alladhi, allati, alladhina, allati / allawati; man and ma"
        learning_outcomes:
          - "Join two sentences with the relative pronoun that agrees with a definite antecedent, and use man and ma for indefinite reference"
    removed_topics: []
    literature_texts: []
  - id: isc-11-arabic-classical-ch03
    number: 3
    title: "Noun phrases: Sifat wa Mausuf and Mudaf wa Mudaf Ilaihi"
    unit: "(a) Grammar"
    topics:
      - id: isc-11-arabic-classical-ch03-t01
        title: "Sifat wa Mausuf: agreement of the adjective in gender, number, definiteness and case"
        learning_outcomes:
          - "Write noun-adjective phrases with full agreement, including the feminine singular adjective with non-human plurals"
      - id: isc-11-arabic-classical-ch03-t02
        title: "Mudaf wa Mudaf Ilaihi: forming the construct phrase"
        learning_outcomes:
          - "Form a construct phrase, dropping al- and tanwin from the mudaf and putting the mudaf ilaihi in the genitive"
      - id: isc-11-arabic-classical-ch03-t03
        title: "Construct phrases with suffixed pronouns and with an adjective"
        learning_outcomes:
          - "Add an adjective to a construct phrase and make it agree with the noun it describes"
      - id: isc-11-arabic-classical-ch03-t04
        title: "Distinguishing a noun-adjective phrase, a construct phrase and a nominal sentence"
        learning_outcomes:
          - "Classify pairs such as al-baytu al-kabiru, baytu al-mudarrisi and al-baytu kabirun and translate each correctly"
    removed_topics: []
    literature_texts: []
  - id: isc-11-arabic-classical-ch04
    number: 4
    title: "The nominal sentence and the cases of the noun"
    unit: "(a) Grammar"
    topics:
      - id: isc-11-arabic-classical-ch04-t01
        title: "The nominal sentence: mubtada and khabar"
