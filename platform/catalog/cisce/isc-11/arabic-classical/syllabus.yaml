      - id: isc-11-arabic-classical-ch05-t04
        title: "The verbal sentence: fi'l, fa'il and maf'ul bihi"
        learning_outcomes:
          - "Identify the verb, subject and object of a verbal sentence and put the object in the accusative"
    removed_topics: []
    literature_texts: []
