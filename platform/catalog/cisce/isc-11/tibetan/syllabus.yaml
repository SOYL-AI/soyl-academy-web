# ISC Class 11 Tibetan (Modern Foreign Language elective, code 835) - ISC 2028 course, CLASS XI year.
# CISCE Appendix I (ISC 2028) lists no prescribed textbooks for Tibetan, so Part 4 of the paper is two translation passages.
# CISCE has not bifurcated the syllabus, so this file covers the whole Classes XI-XII syllabus.
# Titles are in English; Tibetan grammatical particles are given in Wylie transliteration (no Tibetan script).
subject_id: isc-11-tibetan
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-mfl, isc-2028-prescribed-books, isc-2028-regulations]
exam_notes: >-
  There is no board examination in Class XI: Class XI is year one of the two-year ISC 2028 course and the school sets the
  Class XI examination on the portion of the syllabus covered during the year. CISCE has not bifurcated this syllabus (the
  Class XII ISC paper is set on the entire syllabus), so this file covers the whole Classes XI-XII Tibetan syllabus and nothing
  is removed. Paper I Theory (3 hours, 80 marks), which the school examination normally follows, has four parts: (1) a short
  composition in Tibetan from a choice of subjects; (2) a Tibetan passage for unprepared translation into English; (3) an
  unseen Tibetan passage with questions - candidates may be asked to summarise part of it in Tibetan, explain individual
  words, phrases or sentences, and answer comprehension questions (not every question type is set every year); (4) questions
  on prescribed textbooks - but CISCE Appendix I (ISC 2028) prescribes no textbooks for Tibetan, so under the syllabus rule for
  languages without texts Part 4 consists of (a) one passage for translation from Tibetan into English and (b) one passage
  for translation from English into Tibetan. The syllabus asks schools to consult CISCE in time about prescribed textbooks.
  CISCE does not publish marks per part. Paper II Project Work for Class XI (20 marks, assessed internally by the school during
  the year): Listening (6) - an unseen passage of about 500 words, a poem or an audio clip heard twice, with objective
  questions; Speaking (6) - an individual presentation of about three minutes (extempore, declamation, recitation, debate;
  e.g. narrating an experience, giving instructions, describing, reporting, giving an opinion or a speech) followed by two or
  three minutes' discussion with the teacher; Writing (8) - one assignment of about 200 words on any aspect of the language
  studied in Class XI (e.g. describing a process or an event, a summary, an alternative title with justification). CISCE sets
  no question paper for project work. The syllabus does not list grammar items; the two grammar chapters below cover the
  structures needed for composition and two-way translation - this breakdown is SOYL's, not CISCE's. Titles are in English
  with Wylie transliteration; Tibetan-script titles to be added in language review. CISCE lists topics not chapters; SOYL
  grouped them into teachable chapters in syllabus order.
units:
  - { name: "1. Composition", marks: null }
  - { name: "2. Unprepared translation into English", marks: null }
  - { name: "3. Unseen passage", marks: null }
  - { name: "4. Translation (no textbooks prescribed)", marks: null }
chapters:
  - id: isc-11-tibetan-ch01
    number: 1
    title: "Composition"
    unit: "1. Composition"
    topics:
      - id: isc-11-tibetan-ch01-t01
        title: "Planning a short composition: outline, paragraphs and connecting particles"
        learning_outcomes:
          - "Make an outline and write a short composition in Tibetan with a clear introduction, body and conclusion"
      - id: isc-11-tibetan-ch01-t02
        title: "Describing people, places and festivals"
        learning_outcomes:
          - "Describe a person, a monastery or village, or a festival such as Losar in well-formed Tibetan sentences"
      - id: isc-11-tibetan-ch01-t03
        title: "Narrating a past experience"
        learning_outcomes:
          - "Narrate a past experience in order, using past verb stems and connecting particles to link events"
      - id: isc-11-tibetan-ch01-t04
        title: "Giving and supporting an opinion"
        learning_outcomes:
          - "State an opinion on a subject and support it with two or three reasons"
      - id: isc-11-tibetan-ch01-t05
        title: "Everyday and community subjects: family, school, festivals, culture, environment, education"
        learning_outcomes:
          - "Use topic vocabulary accurately to write about everyday and community subjects, including Tibetan and Indian examples"
      - id: isc-11-tibetan-ch01-t06
        title: "Accuracy and register: spelling, the tsheg and shad, honorific and ordinary forms"
        learning_outcomes:
          - "Proof-read one's composition for spelling errors and punctuate correctly with the tsheg and shad"
          - "Use honorific forms consistently when writing about elders, teachers and respected persons"
    removed_topics: []
    literature_texts: []
  - id: isc-11-tibetan-ch02
    number: 2
    title: "Grammar (1): spelling and case particles"
    unit: null
    topics:
      - id: isc-11-tibetan-ch02-t01
        title: "The written syllable: root letter, prefix, superscript, subscript, vowel sign, suffix and second suffix"
        learning_outcomes:
          - "Identify the root letter and the other components of a written Tibetan syllable"
          - "Spell words correctly from dictation, including stacked letters"
      - id: isc-11-tibetan-ch02-t02
        title: "Genitive particles (kyi, gyi, gi, 'i, yi) and the rule for choosing each form"
        learning_outcomes:
          - "Choose the correct form of the genitive particle from the final letter of the preceding syllable"
      - id: isc-11-tibetan-ch02-t03
        title: "Agentive (instrumental) particles (kyis, gyis, gis, 'is, yis) with transitive verbs"
        learning_outcomes:
          - "Mark the agent of a transitive verb, or the instrument of an action, with the correct agentive particle"
      - id: isc-11-tibetan-ch02-t04
        title: "La-don particles (su, ra, ru, tu, du, na, la): object, purpose, location and time"
        learning_outcomes:
          - "Select the la-don particle that fits both its function and the preceding letter"
      - id: isc-11-tibetan-ch02-t05
        title: "Ablative particles (nas, las): source, origin and comparison"
        learning_outcomes:
          - "Use nas and las to express where something comes from and to compare two things"
    removed_topics: []
    literature_texts: []
  - id: isc-11-tibetan-ch03
    number: 3
    title: "Grammar (2): verbs, honorifics and sentence connection"
    unit: null
    topics:
      - id: isc-11-tibetan-ch03-t01
        title: "Verb stems: present, past, future and imperative"
        learning_outcomes:
          - "Give the four stems of common verbs and use the stem that matches the time of the action"
      - id: isc-11-tibetan-ch03-t02
        title: "Linking verbs (yin, red) and existential verbs (yod, 'dug)"
        learning_outcomes:
          - "Choose between yin / red and yod / 'dug according to meaning and the speaker's knowledge"
      - id: isc-11-tibetan-ch03-t03
        title: "Honorific vocabulary (zhe sa): nouns and verbs"
        learning_outcomes:
          - "Replace ordinary nouns and verbs with their honorific equivalents in sentences about respected persons"
      - id: isc-11-tibetan-ch03-t04
        title: "Connecting particles: nas, te / de / ste, cing / zhing / shing, kyang / yang / 'ang"
        learning_outcomes:
          - "Join clauses with the connecting particle that shows sequence, continuation or contrast, in the correct form"
      - id: isc-11-tibetan-ch03-t05
        title: "Negation (ma, mi, med, min) and questions"
        learning_outcomes:
          - "Make sentences negative with the correct negative particle and form yes-no and question-word questions"
    removed_topics: []
    literature_texts: []
  - id: isc-11-tibetan-ch04
    number: 4
    title: "Translation from Tibetan into English"
    unit: "2. Unprepared translation into English"
    topics:
      - id: isc-11-tibetan-ch04-t01
        title: "Reading for meaning: finding the final verb and working back through the particles"
        learning_outcomes:
          - "Identify the main verb, agent and object of a Tibetan sentence from its particles before translating"
      - id: isc-11-tibetan-ch04-t02
        title: "Turning verb-final Tibetan sentences into natural English"
        learning_outcomes:
          - "Break long Tibetan sentences joined by connecting particles into clear English sentences"
      - id: isc-11-tibetan-ch04-t03
        title: "Honorifics, cultural and religious terms"
        learning_outcomes:
          - "Translate honorific forms and culture-specific terms appropriately, keeping or explaining a term where English has no equivalent"
      - id: isc-11-tibetan-ch04-t04
        title: "The second Tibetan-to-English passage (Part 4a): producing and checking a complete version"
        learning_outcomes:
          - "Translate a longer passage completely and fluently, then check it sentence by sentence against the original"
    removed_topics: []
    literature_texts: []
  - id: isc-11-tibetan-ch05
    number: 5
    title: "Unseen passage (comprehension and summary)"
    unit: "3. Unseen passage"
    topics:
      - id: isc-11-tibetan-ch05-t01
        title: "Reading an unseen passage: main idea and key details"
        learning_outcomes:
          - "State the main idea of an unseen Tibetan passage and locate supporting details"
      - id: isc-11-tibetan-ch05-t02
        title: "Explaining words, phrases and sentences in context"
        learning_outcomes:
          - "Explain a word, phrase or sentence from the passage in simple Tibetan, using a synonym or paraphrase"
      - id: isc-11-tibetan-ch05-t03
        title: "Answering comprehension questions in Tibetan"
        learning_outcomes:
          - "Answer questions in complete Tibetan sentences in one's own words"
      - id: isc-11-tibetan-ch05-t04
        title: "Summarising part of the passage in Tibetan"
        learning_outcomes:
          - "Summarise a section of the passage in Tibetan within a word limit, keeping only the essential points"
    removed_topics: []
    literature_texts: []
  - id: isc-11-tibetan-ch06
    number: 6
    title: "Translation from English into Tibetan"
    unit: "4. Translation (no textbooks prescribed)"
    topics:
      - id: isc-11-tibetan-ch06-t01
        title: "Restructuring English sentences into Tibetan verb-final order"
        learning_outcomes:
          - "Translate English sentences into Tibetan with the verb at the end and modifiers correctly placed"
      - id: isc-11-tibetan-ch06-t02
        title: "Choosing the right particles, verb stems and auxiliaries"
        learning_outcomes:
          - "Mark agents, possessors and locations with the correct particles and use the verb stem and auxiliary for the tense"
