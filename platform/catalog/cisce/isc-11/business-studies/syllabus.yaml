# ISC Class 11 Business Studies (857, previously known as Commerce) - ISC 2028 course, CLASS XI year.
# Source: platform/catalog/sources/cisce.md#isc-2028-business-studies. Topic wording is our own summary of the official scope.
subject_id: isc-11-business-studies
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-business-studies, isc-2028-regulations, isc-2027-class-xi-specimen-papers]
exam_notes: >-
  From the ISC 2028 course, Commerce is renamed Business Studies (code 857); the former Business Studies becomes
  Entrepreneurship (859). There is no board examination in Class XI: Class XI is year one of the two-year course and the
  school sets the Class XI examination on the Class XI portion. The syllabus prescribes Paper I Theory of 3 hours, 80
  marks, and Paper II Project Work, 20 marks; CISCE has published a Class XI specimen question paper for Business Studies
  (Year 2027) as a guide to the school paper. Published Class XI weightage: Business: Purpose and Classification 10, Forms
  and Types of Business Organisation 30, Contemporary and Evolving Modes of Business 15, Domestic Trade 10, Business Risks
  and Insurance 15 (total 80). Paper II: two projects of 10 marks each from any theory topic (overall format 1, content 4,
  findings 2, viva-voce 3), preferably handwritten - for example tracing a consumer product from primary to tertiary
  industry, planning a partnership firm, a blockchain food-tracing or ethical-sourcing system, a PPP or co-operative study,
  CSR of companies, comparing life insurance policies, an e-business visit or a global enterprise's expansion. Several
  items are prescribed at "meaning only" or "brief understanding" depth, and the topic titles below say so. CISCE lists
  units and sub-topics, not chapters: SOYL groups them into 12 teachable chapters in syllabus order.
units:
  - { name: "1. Business: Purpose and Classification", marks: 10 }
  - { name: "2. Forms and Types of Business Organisation", marks: 30 }
  - { name: "3. Contemporary and Evolving Modes of Business", marks: 15 }
  - { name: "4. Domestic Trade", marks: 10 }
  - { name: "5. Business Risks and Insurance", marks: 15 }
