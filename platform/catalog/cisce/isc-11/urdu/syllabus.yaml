          - "Explain how this part develops the central conflict and the characters"
      - id: isc-11-urdu-ch06-t02
        title: "Act 2, scenes 1-2: developing conflict"
        learning_outcomes:
          - "Narrate the main events of this part of the play in sequence in your own words"
          - "Explain how this part develops the central conflict and the characters"
      - id: isc-11-urdu-ch06-t03
        title: "Character sketches of the main characters"
