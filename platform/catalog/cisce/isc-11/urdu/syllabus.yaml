          - "Explain how the story exposes the madness of Partition and the meaning of its ending in no man's land"
      - id: isc-11-urdu-ch07-t04
        title: "Nanhi Ki Nani (Ismat Chughtai): short story: plot, characters and theme"
        learning_outcomes:
