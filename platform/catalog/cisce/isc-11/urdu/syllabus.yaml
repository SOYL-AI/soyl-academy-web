        title: "Doodh Ki Qeemat (Prem Chand): a nurse-mother, her son and the ingratitude of the privileged"
        learning_outcomes:
          - "Narrate the story of Bhungi and her son Mangal in your own words"
          - "Explain the irony of the title and the story's criticism of caste and ingratitude"
      - id: isc-11-urdu-ch07-t02
