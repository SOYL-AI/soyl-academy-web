# ISC Class 11 Political Science (852) - ISC 2028 syllabus, CLASS XI portion only.
# Source: platform/catalog/sources/cisce.md#isc-2028-political-science. Topic wording is our own summary of the official scope.
subject_id: isc-11-political-science
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-political-science]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course. There is no board examination in Class XI: the school sets
  and conducts the Class XI examination on the Class XI portion. The syllabus prescribes two papers, which the school
  examination usually follows: Paper I Theory of 3 hours, 80 marks, with Section A Political Theory (political science
  and the state, origin of the state, ideologies, sovereignty, law, liberty, equality, justice) and Section B
  Contemporary International Relations (disintegration of the Soviet Union, the unipolar world, regional cooperation,
  India and South Asia); no section-wise or topic-wise marks are published. Paper II Project Work, 20 marks, is one
  project (case study, questionnaire survey, research project, contemporary political issue, or a review of books,
  films, documentaries, posters, newspapers or cartoons) of up to 2000 words that must not be based primarily on the
  syllabus; marks are process 5, understanding and analysis 5, presentation 5 and viva 5. Project work is not built
  as chapters. CISCE lists twelve topics, not textbook chapters: SOYL keeps them in syllabus order and splits the
  first topic into two chapters (13 chapters). The Class XII portion is in isc-12-political-science.
units:
  - { name: "Section A: Political Theory", marks: null }
  - { name: "Section B: Contemporary International Relations", marks: null }
