# ISC Class 11 Electricity and Electronics (866), Paper I Theory - ISC 2028 syllabus, CLASS XI portion only.
# Source: platform/catalog/sources/cisce.md#isc-2028-electricity-electronics. Topic wording is our own summary of the official scope.
subject_id: isc-11-electricity-electronics
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-electricity-electronics, isc-2028-regulations]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course. There is no board examination in Class XI: the school conducts
  the Class XI examination on the Class XI portion, and promotion to Class XII needs at least 35% on the cumulative
  average in five subjects including English, with 75% attendance (ISC 2028 Regulations). The syllabus prescribes, and
  the school examination usually follows: Paper I Theory, 3 hours, 80 marks; Paper II Project Work, 20 marks - two
  projects on any theory topics, assessed by the subject teacher, each marked out of 10 (title and introduction 1,
  content 3, presentation and originality 2, conclusion 1, viva-voce 3). Suggested Class XI projects: assembling a
  circuit with ammeter, voltmeter and rheostat and modifying it with resistors in series and parallel; a report on
  rheostats as potential dividers, keys, types of resistance, household versus laboratory wiring and battery
  eliminators; assembling a household circuit with three bulbs, switches, socket, fuse and main switch (including a
  two-way staircase point); and a study of an Indian or foreign physicist. SOYL covers Paper I only.
  No topic-wise marks weightage is published, and no Class XI specimen paper is listed for this subject. CISCE lists
  12 numbered topics, not textbook chapters: SOYL groups them into 15 teachable chapters in syllabus order (topics 3
  and 6 are each split in two or three). The Class XII portion is in isc-12-electricity-electronics.
