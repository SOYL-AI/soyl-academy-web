exam_notes: >-
  There is no board examination in Class XI: Class XI is year one of the two-year ISC 2028 course and the school sets
  the Class XI examination. The ISC paper pattern (normally followed by the school): Paper I Theory, one paper of 3
  hours, 80 marks, in two sections. Section A Language (40 marks, three compulsory questions): a composition of about
  400 words in Dzongkha from a choice of six topics; an unseen passage of about 300 words with questions and/or a
  summary with a heading (testing the ability to summarise and/or expand an idea); and functional grammar (correction
  of sentences and use of words/idioms in sentences, with correct agreement of number, gender, case, tense and voice).
  Section B Prescribed Textbooks (40 marks): answer four questions from any three of the prescribed books. The
  prescribed texts for Dzongkha are not bifurcated (the ISC 2028 syllabus bifurcates only Hindi, Malayalam, Punjabi,
  Tamil, Telugu, Bengali (Bangla), Gujarati, Kannada, Nepali, Odia, Urdu and Bhutia), so the whole two-year list in
  Appendix I applies to Classes XI and XII together and is covered here - the same literature as isc-12-dzongkha.
  CISCE does not split this list by class: the school decides which part of it is taught and examined in Class XI.
  Recommended for background work: Keayad Dang Yeakguye Jorya (Language and Grammar). All prescribed books are
  published by CAPSD, Ministry of Education, Thimphu, Bhutan; Appendix I does not list individual pieces for books
  I-III. Paper II Project Work for Class XI (20 marks, assessed internally by the school): Listening (6) - an unseen
  passage of about 500 words, a poem or an audio clip with objective questions; Speaking (6) - a presentation of about
  three minutes (extempore, declamation, recitation, debate and similar) with discussion; Writing (8) - a piece of
  600-800 words on language or the Class XI literature portion. CISCE lists topics, not chapters: SOYL grouped them
  into teachable chapters in syllabus order. CISCE does not publish question-wise marks within Section A and describes
  composition and grammar only generically: the composition types and grammar breakdown below are SOYL's, adapted to
  the grammar of the language. SOYL covers all four prescribed books so a student can pick any three. Titles are in
  English / CISCE transliteration; native-script titles to be added in language review.
units:
  - { name: "Section A: Language", marks: 40 }
  - { name: "Section B: Prescribed Textbooks", marks: 40 }
