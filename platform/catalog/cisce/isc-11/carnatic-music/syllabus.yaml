# ISC Class 11 Music: Indian Music - Carnatic (873), Paper 1 Theory - ISC 2028 course, year one (Class XI).
# Source: platform/catalog/sources/cisce.md#isc-2028-music. The ISC 2028 Carnatic syllabus is printed for Classes XI
# and XII together (no class split), so all of it is covered. Theory paper only; practical work is described in
# exam_notes. Topic wording is our own summary.
subject_id: isc-11-carnatic-music
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-music, isc-2028-regulations]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course: there is no CISCE board examination in Class XI, and the
  school sets the Class XI examination, normally following the pattern below. Paper 1 Theory: 3 hours, 70 marks;
  candidates answer five questions in all. Paper 2 Practical: about 20 minutes, 30 marks (practical examination 20,
  overall performance 5 - sruti, laya, tonal quality, expression - and teacher's evaluation of the year's work 5); in
  Class XI the practical is evaluated by the internal examiner, not a Visiting Practical Examiner. The subject may not
  be taken with Hindustani or Western Music. Practical work (vocal or one of vina, gottuvadyam, violin, balakokil,
  flute or nagasvaram, with tambura sruti for singers): two padams of Kshetrajna, one ragamalika, two tillanas, two
  javalis and listed kritis in the prescribed ragas or pieces of equal standard, knowing the outline meaning of at
  least six songs; alapana of eleven ragas; kalpana svaras in Todi, Bhairavi, Kambhoji, Sankarabharanam and Kalyani in
  Adi and Rupaka talas; singing from sa-ri-ga-ma notation; giving svaras for phrases heard; recognising ragas from
  alapana and talas of unfamiliar songs; plus common ear tests, sight-singing and musical dictation. This is not
  taught as chapters here. The syllabus is printed for Classes XI and XII together with no class split, so all of it
  is covered here (the document does not divide it between Classes XI and XII). For the history question, 10 of the 20 listed composers and
  theorists must be known; SOYL covers all 20. Two names are corrected from misprints in the source (Paidala
  Gurumurthi Sastri, Gopalakrishna Bharati). CISCE lists eleven numbered theory items, not chapters: SOYL groups them
  into teachable chapters in syllabus order. No topic-wise marks weightage is published.
