# ISC Class 11 Accounts (syllabus titled Accountancy, code 858) - ISC 2028 course, CLASS XI year.
# Source: platform/catalog/sources/cisce.md#isc-2028-accounts. Topic wording is our own summary of the official scope.
subject_id: isc-11-accounts
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-accounts, isc-2028-regulations, isc-2027-class-xi-specimen-papers]
exam_notes: >-
  There is no board examination in Class XI: Class XI is year one of the two-year ISC 2028 course and the school sets the
  Class XI examination on the Class XI portion. The syllabus prescribes Paper I Theory of 3 hours, 80 marks, and Paper II
  Project Work, 20 marks; CISCE has published a Class XI specimen question paper for Accountancy (Year 2027) as a guide to
  the school paper. Published Class XI weightage: Introduction to Accounting 2, Accounting Concepts 4, Journal, Ledger and
  Trial Balance 12, Bank Reconciliation Statement 10, Depreciation 10, Bills of Exchange 7, Final Accounts 14,
  Rectification of Errors 8, Not-for-profit Organisations 10, Computerised Accounting System 3 (total 80; the extracted
  table lists marks in a separate column and SOYL matched them to units in row order). Paper II: two projects of 10 marks
  each from any theory topic (overall format 1, content 4, findings 2, viva-voce 3), e.g. a sole trader's books from
  journal to final accounts, NPO accounts, a bank reconciliation, bills of exchange, depreciation or a one-week internship
  report. Transactions involving GST are excluded throughout (only a theoretical introduction to GST is taught).
  Final accounts are prepared in horizontal format. CISCE lists units and sub-topics, not chapters: SOYL groups them into
  16 teachable chapters in syllabus order.
units:
  - { name: "1. Introduction to Accounting", marks: 2 }
  - { name: "2. Accounting Concepts", marks: 4 }
  - { name: "3. Journal, Ledger and Trial Balance", marks: 12 }
  - { name: "4. Bank Reconciliation Statement", marks: 10 }
  - { name: "5. Depreciation", marks: 10 }
  - { name: "6. Bills of Exchange", marks: 7 }
  - { name: "7. Final Accounts", marks: 14 }
  - { name: "8. Rectification of Errors", marks: 8 }
  - { name: "9. Accounting for Not-for-profit Organisations", marks: 10 }
  - { name: "10. Computerised Accounting System (CAS)", marks: 3 }
