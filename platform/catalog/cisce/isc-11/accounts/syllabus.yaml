    title: "Introduction to Accounting"
    unit: "1. Introduction to Accounting"
    topics:
      - id: isc-11-accounts-ch01-t01
        title: "A brief history of accounting; book-keeping, accounting and accountancy compared; the accounting cycle"
        learning_outcomes:
          - "Outline the development of accounting from early record-keeping to double entry"
          - "Distinguish book-keeping, accounting and accountancy by scope and purpose"
          - "Arrange the stages of the accounting cycle in order from transaction to financial statements"
      - id: isc-11-accounts-ch01-t02
        title: "Basic terms: event, transaction, voucher, capital, drawings, profit, gain, loss, expense, revenue and income"
        learning_outcomes:
          - "Distinguish an event from a transaction and explain the role of a voucher as documentary evidence"
          - "Differentiate expense from loss and revenue from gain using business examples"
      - id: isc-11-accounts-ch01-t03
        title: "Assets (tangible, intangible, fixed, current, liquid, wasting, fictitious) and liabilities (internal, external, current, long-term, contingent)"
        learning_outcomes:
          - "Classify a given list of items into the different types of assets and liabilities"
          - "Explain why a contingent liability is not shown as an actual liability"
      - id: isc-11-accounts-ch01-t04
        title: "Trade terms: trade debtors and creditors, purchases, sales, goods, and stock (raw material, work in progress, finished goods)"
        learning_outcomes:
          - "Identify trade debtors and trade creditors in a set of business transactions"
          - "Distinguish the three kinds of stock held by a manufacturing business"
      - id: isc-11-accounts-ch01-t05
        title: "Stakeholders who use accounting information; financial, cost and management accounting (introduction)"
        learning_outcomes:
          - "Explain what owners, managers, lenders, investors, employees, government and the public each need from accounts"
          - "Distinguish financial, cost and management accounting by purpose and users"
