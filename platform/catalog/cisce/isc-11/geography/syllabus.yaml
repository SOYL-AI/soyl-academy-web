# ISC Class 11 Geography (853) - ISC 2028 syllabus, CLASS XI portion only (theory paper).
# Source: platform/catalog/sources/cisce.md#isc-2028-geography. Topic wording is our own summary of the official scope.
subject_id: isc-11-geography
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-geography]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course. There is no board examination in Class XI: the school sets
  and conducts the Class XI examination on the Class XI portion. The syllabus prescribes two papers, which the school
  examination usually follows: Paper I Theory of 3 hours, 70 marks (Geography as a Discipline and Principles of
  Physical Geography), including a map-work question to identify, locate and label items from the official world map
  list; and Paper II Practical Work and Project Work, 30 marks, assessed by the teacher and a Visiting Examiner with no
  CISCE question paper: practical file (sessional record) 10, project report 10, viva voce 10. Practical work is any
  two of: chain-and-tape surveying of a small area; statistical diagrams (simple and multiple line graphs, composite
  bars, pie, flow and star diagrams); map projections (cylindrical equal area, simple conical with one standard
  parallel, zenithal equidistant); and aerial photographs (types, scale, uses). The project is one assignment: a
  physical feature of the locality, an island area, a local natural hazard, or the world climatic types (equatorial,
  monsoon, desert, Mediterranean, marine west coast, sub-tropical and mid-latitude dry, boreal, tundra). Practical and
  project work are not built as chapters. Topic 1 (Geography as a Discipline) is taught for awareness only and is not
  tested. No topic-wise marks weightage is published. CISCE lists topics, not textbook chapters: SOYL groups them into
  24 teachable chapters in syllabus order. The Class XII portion (India in the world's context) is in isc-12-geography.
