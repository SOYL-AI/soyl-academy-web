# ISC Class 11 Sociology (854) - ISC 2028 syllabus, CLASS XI portion only.
# Source: platform/catalog/sources/cisce.md#isc-2028-sociology. Topic wording is our own summary of the official scope.
subject_id: isc-11-sociology
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-sociology]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course. There is no board examination in Class XI: the school sets
  and conducts the Class XI examination on the Class XI portion. The syllabus prescribes two papers, which the school
  examination usually follows: Paper I Theory of 3 hours, 70 marks, on the six Class XI topics below, and Paper II
  Practical (Project) Work, 30 marks - two studies of 15 marks each on any chapter of the theory syllabus (statement
  of purpose 1, overall format 1, hypothesis 1, choice of technique 1, detailed procedure 4, limitation 1,
  conclusion 2, viva-voce 4). CISCE suggests studies such as child labour, children and beggary, poverty and crime,
  the population explosion and urban society, changing culture and tradition, the urban family or neighbourhood,
  the Indian village, a biographical sketch of a thinker, slums, and problems of the aged and the differently abled,
  ideally one secondary-data study and one first-hand field study; this project work is not part of the chapters
  below. No unit-wise marks weightage is published. CISCE lists topics with scope notes, not textbook chapters: SOYL
  groups them into 13 teachable chapters in syllabus order. The Class XII portion is in isc-12-sociology.
units:
