  - { name: "2. Research Methodology", marks: null }
  - { name: "3. Basic Concepts", marks: null }
  - { name: "4. Social Structure", marks: null }
  - { name: "5. Social Problems", marks: null }
  - { name: "6. Indian Sociologists", marks: null }
