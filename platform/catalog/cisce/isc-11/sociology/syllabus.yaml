      - id: isc-11-sociology-ch02-t04
        title: "Max Weber: interpretive sociology; bureaucracy and types of authority"
        learning_outcomes:
          - "Describe the features of Weber's ideal-type bureaucracy"
          - "Classify examples of traditional, charismatic and legal-rational authority"
      - id: isc-11-sociology-ch02-t05
        title: "Karl Marx: conflict theory; class and class struggle"
        learning_outcomes:
          - "Explain Marx's idea of class based on ownership of the means of production and the role of class struggle in social change"
