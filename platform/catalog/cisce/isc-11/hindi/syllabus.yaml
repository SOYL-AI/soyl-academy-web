# ISC Class 11 Hindi (Indian Language elective, code 805) - ISC 2028 course, CLASS XI year.
# Literature: titles and authors only (CONTEXT section 8). Students read the texts in their own textbook.
subject_id: isc-11-hindi
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-indian-languages, isc-2028-prescribed-books, cisce-circular-2026-27-33-indian-languages, isc-2028-regulations]
exam_notes: >-
  There is no board examination in Class XI: Class XI is year one of the two-year ISC 2028 course and the school sets the
  Class XI examination, which CISCE says is conducted only on the portion prescribed for Class XI. The ISC paper pattern
  (normally followed by the school): Paper I Theory, one paper of 3 hours, 80 marks, in two sections. Section A Language
  (40 marks, three compulsory questions): a composition of about 400 words from a choice of six topics; an unseen passage
  of about 300 words with questions and/or a summary with a heading (testing the ability to summarise and/or expand an
  idea); and functional grammar (correction of sentences and use of words/idioms in sentences, with correct agreement of
  number, gender, case, tense and voice). Section B Prescribed Textbooks (40 marks): answer four questions from any three
  of the four prescribed books. Prescribed texts are bifurcated (Circular 2026-27/33; ISC 2028 Indian Languages syllabus):
  only the Class XI portion is listed here, the Class XII portion is in removed_topics. Recommended for background work:
  Vyakaran Manjusha (I.U.P.). Paper II Project Work for Class XI (20 marks, assessed internally by the school): Listening
  (6) - an unseen passage of about 500 words, a poem or an audio clip with objective questions; Speaking (6) - a
  presentation of about three minutes (extempore, declamation, recitation, debate and similar) with discussion; Writing (8)
  - a piece of 600-800 words on language or the Class XI literature portion. CISCE does not publish question-wise marks
  within Section A and describes composition and grammar only generically: the composition types and grammar breakdown
  below are SOYL's, based on the item types commonly set in ISC Hindi papers. SOYL covers all four prescribed books so a
  student can pick any three.
