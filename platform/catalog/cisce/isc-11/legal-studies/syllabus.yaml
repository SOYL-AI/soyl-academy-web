    topics:
      - id: isc-11-legal-studies-ch03-t01
        title: "Meaning of law and the province of jurisprudence as the science of law"
        learning_outcomes:
          - "Explain different definitions of law and the scope of jurisprudence"
      - id: isc-11-legal-studies-ch03-t02
        title: "Natural and historical schools of law"
        learning_outcomes:
          - "Explain the natural law view that law is based on reason and morality"
          - "Explain the historical school's view of law as growing out of the customs and spirit of a people"
      - id: isc-11-legal-studies-ch03-t03
        title: "Positivist, realist and sociological schools of law"
        learning_outcomes:
          - "Explain the positivist idea of law as the command of the sovereign"
          - "Contrast the realist focus on what courts actually do with the sociological focus on law as a tool of social engineering"
      - id: isc-11-legal-studies-ch03-t04
        title: "Main sources of law: custom, legislation and precedent"
        learning_outcomes:
          - "Explain the essentials of a valid custom and the role of legislation and judicial precedent as sources of law"
          - "Compare the three sources in terms of authority and flexibility"
      - id: isc-11-legal-studies-ch03-t05
        title: "Law and social change: law changing society and society changing law"
        learning_outcomes:
          - "Give Indian examples of laws that brought social reform and of social change that forced the law to change"
    removed_topics: []
    literature_texts: []
