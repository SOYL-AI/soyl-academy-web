        learning_outcomes:
          - "Explain the meaning of sovereign, socialist, secular, democratic and republic as used in the Preamble"
          - "Explain the objectives of justice, liberty, equality and fraternity and why the Preamble matters"
      - id: isc-11-legal-studies-ch02-t02
        title: "Amendability and justiciability of the Preamble"
        learning_outcomes:
          - "Explain whether the Preamble is part of the Constitution and whether it can be amended, with reference to leading Supreme Court decisions"
          - "State whether the Preamble can be enforced in a court of law and how courts use it in interpretation"
      - id: isc-11-legal-studies-ch02-t03
        title: "Differences between administrative law and constitutional law"
        learning_outcomes:
          - "Define administrative law and constitutional law"
          - "Distinguish the two in scope, subject matter and relationship to each other"
    removed_topics: []
    literature_texts: []
  - id: isc-11-legal-studies-ch03
