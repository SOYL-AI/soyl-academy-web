# ISC Class 11 Legal Studies (881) - ISC 2028 course, CLASS XI section only.
# Source: platform/catalog/sources/cisce.md#isc-2028-legal-studies. Topic wording is our own summary of the official scope.
subject_id: isc-11-legal-studies
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-legal-studies]
exam_notes: >-
  There is no board examination in Class XI: Class XI is year one of the two-year ISC 2028 course and the school sets the
  Class XI examination on the Class XI portion. The syllabus prescribes for Class XI Paper I Theory: 3 hours, 70 marks, on
  the seven Class XI topics below, and Paper II Project Work: 30 marks - two studies of 15 marks each chosen from anywhere
  in the Class XI theory syllabus, synthesising cases, legislation, the media and international instruments into a legal
  argument. CISCE suggests studies such as a presentation on the structure of the judiciary in India, revisiting landmark
  constitutional cases (Kesavananda Bharati, Golaknath, A.K. Gopalan, S.R. Bommai), consumer rights in practice, copyright
  cases on online piracy, generic versus patented medicines, types of trademarks, the Basmati GI dispute, theories of
  punishment, and cyber law topics; this project work is not part of the chapters below. Criminal procedure is taught under
  the Bharatiya Nagarik Suraksha Sanhita (BNSS), 2023, using the section numbers given in the syllabus. CISCE lists topics
  with scope notes, not textbook chapters: SOYL groups them into 13 teachable chapters in syllabus order. No unit-wise marks
  weightage is published for ISC Legal Studies. The Class XII portion (BNS, ADR, contract, torts, property and others) is in
  isc-12-legal-studies.
