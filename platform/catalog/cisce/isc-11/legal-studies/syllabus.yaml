chapters:
  - id: isc-11-legal-studies-ch01
    number: 1
    title: "The Constitution of India: Meaning, Functions and Salient Features"
    unit: "1. Basic Features of the Indian Constitution and the Constitutional Courts"
    topics:
      - id: isc-11-legal-studies-ch01-t01
        title: "Meaning and functions of a constitution; the Constitution of India as a modern and the lengthiest written constitution"
        learning_outcomes:
          - "Define a constitution and explain the functions it performs in a state"
          - "Explain why the Constitution of India is described as modern and as the lengthiest written constitution"
      - id: isc-11-legal-studies-ch01-t02
        title: "Fundamental Rights, Directive Principles of State Policy and Fundamental Duties as salient features"
        learning_outcomes:
          - "Explain the place of Fundamental Rights, Directive Principles and Fundamental Duties in the Constitution"
          - "Distinguish justiciable rights from non-justiciable directives with examples"
      - id: isc-11-legal-studies-ch01-t03
        title: "Amendment of the Constitution and the Schedules"
        learning_outcomes:
          - "Describe the procedures for amending the Constitution and why it is partly rigid and partly flexible"
          - "State the purpose of the Schedules and give examples of what they contain"
      - id: isc-11-legal-studies-ch01-t04
        title: "Adult suffrage, single citizenship and an independent judiciary"
        learning_outcomes:
          - "Explain universal adult suffrage and single citizenship as features of Indian democracy"
          - "Describe the constitutional safeguards that keep the judiciary independent"
      - id: isc-11-legal-studies-ch01-t05
        title: "Emergency provisions; federal in form, unitary in character"
        learning_outcomes:
          - "Outline the kinds of emergency provided for in the Constitution and their effect on the federal structure"
          - "Identify federal features and unitary features of the Constitution and justify the description 'federal in form, unitary in character'"
      - id: isc-11-legal-studies-ch01-t06
        title: "Separation of powers: meaning, benefits and defects"
        learning_outcomes:
          - "Explain the separation of powers between the legislature, executive and judiciary in India"
          - "Evaluate the benefits and defects of the doctrine with examples of checks and balances"
    removed_topics: []
    literature_texts: []
  - id: isc-11-legal-studies-ch02
