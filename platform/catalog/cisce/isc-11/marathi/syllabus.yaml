# ISC Class 11 Marathi (Indian Language elective, code 810) - ISC 2028 course, CLASS XI year.
# Literature: titles and authors only (CONTEXT section 8). Students read the texts in their own textbook.
subject_id: isc-11-marathi
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-indian-languages, isc-2028-prescribed-books, isc-2028-regulations]
exam_notes: >-
  There is no board examination in Class XI: Class XI is year one of the two-year ISC 2028 course and the school sets
  the Class XI examination. The ISC paper pattern (normally followed by the school): Paper I Theory, one paper of 3
  hours, 80 marks, in two sections. Section A Language (40 marks, three compulsory questions): a composition of about
  400 words in Marathi from a choice of six topics; an unseen passage of about 300 words with questions and/or a
  summary with a heading (testing the ability to summarise and/or expand an idea); and functional grammar (correction
  of sentences and use of words/idioms in sentences, with correct agreement of number, gender, case, tense and voice).
  Section B Prescribed Textbooks (40 marks): answer four questions from any three of the prescribed books. The
  prescribed texts for Marathi are not bifurcated (the ISC 2028 syllabus bifurcates only Hindi, Malayalam, Punjabi,
  Tamil, Telugu, Bengali (Bangla), Gujarati, Kannada, Nepali, Odia, Urdu and Bhutia), so the whole two-year list in
  Appendix I applies to Classes XI and XII together and is covered here - the same literature as isc-12-marathi. CISCE
  does not split this list by class: the school decides which part of it is taught and examined in Class XI. Paper II
  Project Work for Class XI (20 marks, assessed internally by the school): Listening (6) - an unseen passage of about
  500 words, a poem or an audio clip with objective questions; Speaking (6) - a presentation of about three minutes
  (extempore, declamation, recitation, debate and similar) with discussion; Writing (8) - a piece of 600-800 words on
  language or the Class XI literature portion. CISCE lists topics, not chapters: SOYL grouped them into teachable
  chapters in syllabus order. CISCE does not publish question-wise marks within Section A and describes composition
  and grammar only generically: the composition types and grammar breakdown below are SOYL's, adapted to the grammar
  of the language. SOYL covers all four prescribed books so a student can pick any three. Appendix I names the author
  of book IV only as "Deshpande"; the play Tu Jhe Ahe Tuj Pashi is by P. L. Deshpande.
