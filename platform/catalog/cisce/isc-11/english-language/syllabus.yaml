    number: 1
    title: "Composition: Narrative, Descriptive and Reflective Writing"
    unit: "Question 1: Composition"
    topics:
      - id: isc-11-english-language-ch01-t01
        title: "Reading the six topics and planning a 400-450 word composition"
        learning_outcomes:
          - "Choose, from six options, the topic for which one has the most relevant ideas and vocabulary, and justify the choice"
          - "Draft a quick outline with an opening, three or four body paragraphs and a conclusion before writing"
      - id: isc-11-english-language-ch01-t02
        title: "Narrative composition: point of view, order of events, pace and climax"
        learning_outcomes:
          - "Write a narrative that keeps a consistent point of view and moves through events in a clear sequence"
          - "Build tension towards a climax and resolve it in the closing paragraph"
      - id: isc-11-english-language-ch01-t03
        title: "Descriptive composition: sensory detail, figurative language and spatial organisation"
        learning_outcomes:
          - "Describe a place, person or occasion using precise sensory details instead of vague adjectives"
          - "Arrange descriptive details in a logical spatial or thematic order"
      - id: isc-11-english-language-ch01-t04
        title: "Reflective composition: from personal experience to general insight"
        learning_outcomes:
          - "Write a reflective piece that links a personal experience or idea to a wider observation about life"
          - "Sustain a calm, thoughtful tone throughout the composition"
      - id: isc-11-english-language-ch01-t05
        title: "Original short story: plot, character, setting, conflict and ending"
        learning_outcomes:
          - "Write an original short story within the word limit that has a clear conflict and a convincing resolution"
          - "Reveal character through action and dialogue rather than long explanation"
