# ISC Class 11 English Language (English 801, Paper 1: English Language) - ISC 2028 course, CLASS XI year.
# Source: platform/catalog/sources/cisce.md#isc-2028-english. Topic wording is our own summary of the official scope.
subject_id: isc-11-english-language
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-english, isc-2028-regulations]
exam_notes: >-
  English (801) is compulsory and has two components, English Language and Literature in English, each with its own
  theory paper of 80 marks and project work of 20 marks; this file is English Language (it may not be taken with Modern
  English). There is no board examination in Class XI: Class XI is year one of the two-year ISC 2028 course and the school
  sets the Class XI examination, normally following the ISC paper pattern, which is the same in Classes XI and XII.
  Theory paper: 3 hours, 80 marks, all four questions compulsory. Question 1: one composition (400-450 words) from a
  choice of six (narrative, descriptive, reflective, argumentative/persuasive, expository, original short story), marked
  on quality of language and organisation. Question 2: (a) directed writing of 250-300 words using all the given points
  (feature article, book review, blog, newspaper report, statement of purpose), with format taken into account, and
  (b) a proposal on a given situation in the CISCE format (introduction/heading, objectives, list of measures, concluding
  statement). Question 3: short compulsory items on transformation of sentences, phrasal verbs and verbs/tenses (number
  and type vary). Question 4: a passage of about 700 words with vocabulary, understanding and inference questions plus a
  summary within a word limit that must be written in grid form (no abbreviations or contractions).
  Project work for Class XI (20 marks, assessed internally by the school): Listening (10) - an unseen passage of about
  500 words read aloud twice, with objective questions; Speaking (10: content, fluency, vocabulary, sentence structure,
  confidence, 2 each) - a presentation of about three minutes (narrating an experience, giving directions or
  instructions, describing, reporting, expressing an opinion) followed by discussion with the teacher. CISCE describes
  question types, not chapters: SOYL groups the skills into teachable chapters in the order of the paper. No
  question-wise marks are published, so units carry no marks.
