# ISC Class 11 Economics (856) - ISC 2028 syllabus, CLASS XI portion only.
# Source: platform/catalog/sources/cisce.md#isc-2028-economics. Topic wording is our own summary of the official scope.
subject_id: isc-11-economics
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-economics, isc-2028-regulations]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course. There is no board examination in Class XI: the final
  examination is conducted internally by the school on the Class XI portion, and promotion to Class XII needs at least
  35% on the cumulative average in five subjects including English, with 75% attendance (ISC 2028 Regulations).
  The syllabus prescribes two papers, which the school examination usually follows: Paper I Theory of 3 hours,
  80 marks, on three sections (Understanding Economics, Indian Economic Development, Statistics), and Paper II Project
  Work, 20 marks - two projects on any theory topic, 10 marks each (overall format 1, content 4, findings 2,
  viva-voce 3). Suggested projects include a consumer-awareness questionnaire survey, a comparison of two cooperatives,
  SAARC and the Indian economy, poverty alleviation programmes such as MGNREGA, the status of women in one's State,
  and forest cover in India; project work is not built as chapters. No section-wise marks weightage is published for
  Class XI. CISCE lists topics, not chapters: SOYL groups them into 24 teachable chapters in syllabus order. The
  Class XII portion (microeconomics and macroeconomics) is in isc-12-economics.
units:
  - { name: "1. Understanding Economics", marks: null }
  - { name: "2. Indian Economic Development", marks: null }
  - { name: "3. Statistics", marks: null }
