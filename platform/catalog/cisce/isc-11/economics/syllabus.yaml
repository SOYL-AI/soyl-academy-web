    number: 1
    title: "Meaning and Definitions of Economics"
    unit: "1. Understanding Economics"
    topics:
      - id: isc-11-economics-ch01-t01
        title: "Economic phenomena: scarcity of resources and the need for allocation among alternative uses"
        learning_outcomes:
          - "Explain why scarcity of resources relative to wants makes choice and allocation necessary"
          - "Identify everyday Indian examples of economic choices made by households, firms and government"
      - id: isc-11-economics-ch01-t02
        title: "Adam Smith's wealth definition: main features and criticisms"
        learning_outcomes:
          - "State the main features of Adam Smith's wealth-centred definition of economics"
          - "Give two or three criticisms of the wealth definition"
      - id: isc-11-economics-ch01-t03
        title: "Alfred Marshall's welfare definition: main features and criticisms"
        learning_outcomes:
          - "Explain how Marshall shifted the focus of economics from wealth to human welfare"
          - "Evaluate the welfare definition by giving two or three criticisms"
      - id: isc-11-economics-ch01-t04
        title: "Lionel Robbins' scarcity definition: unlimited ends, scarce means with alternative uses; criticisms"
        learning_outcomes:
          - "Identify the elements of Robbins' definition and relate them to the problem of choice"
          - "Give two or three criticisms of the scarcity definition"
      - id: isc-11-economics-ch01-t05
        title: "Samuelson's growth-oriented definition and comparison of the four definitions"
        learning_outcomes:
          - "Explain how Samuelson's definition adds growth over time to the problem of choice"
          - "Compare the definitions of Smith, Marshall, Robbins and Samuelson on their main points"
