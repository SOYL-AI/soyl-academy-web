# ISC Class 11 History (851) - ISC 2028 syllabus, CLASS XI portion only.
# Source: platform/catalog/sources/cisce.md#isc-2028-history. Topic wording is our own summary of the official scope.
subject_id: isc-11-history
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-history]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course. There is no board examination in Class XI: the school sets
  and conducts the Class XI examination on the Class XI portion. The syllabus prescribes two papers, which the school
  examination usually follows: Paper I Theory of 3 hours, 80 marks, with Section A Indian History (colonial economy,
  social and protest movements, growth of nationalism, Gandhian nationalism to 1937) and Section B World History
  (First World War, Great Depression, Stalin's Russia, Fascist Italy, Nazi Germany, militarism in Japan); no
  section-wise or topic-wise marks are published. Paper II Project Work, 20 marks, is one project on an 18th-20th
  century theme (India or world: politics, military, economy, society and culture, religion) as a case study, field
  visit, local history, oral evidence, or a review of books, films, posters or cartoons, written up as an 800-1500 word
  essay (introduction, main body, conclusion, bibliography, optional appendix); marks are process 5, understanding and
  analysis 5, presentation 5 and viva 5. Project work is not built as chapters. CISCE lists twelve topics, not
  textbook chapters: SOYL splits the larger ones into 19 teachable chapters in syllabus order. The Class XII portion
  is in isc-12-history.
units:
  - { name: "Section A: Indian History", marks: null }
  - { name: "Section B: World History", marks: null }
