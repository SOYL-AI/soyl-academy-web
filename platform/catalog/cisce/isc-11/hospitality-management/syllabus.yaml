# ISC Class 11 Hospitality Management (880), Paper I Theory - ISC 2028 syllabus, CLASS XI portion only.
# Source: platform/catalog/sources/cisce.md#isc-2028-hospitality-management. Topic wording is our own summary of the official scope.
subject_id: isc-11-hospitality-management
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-hospitality-management, isc-2028-regulations]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course. There is no board examination in Class XI: the school conducts
  the Class XI examination on the Class XI portion, and promotion to Class XII needs at least 35% on the cumulative
  average in five subjects including English, with 75% attendance (ISC 2028 Regulations). The syllabus prescribes, and
  the school examination usually follows: Paper I Theory, 3 hours, 70 marks, on the five Class XI topics below; Paper II
  Practical Work, 30 marks, assessed internally by the teacher from a practical file kept through the year. Class XI
  practical work covers front office role plays (standard guest phrases, telephone manners, guest handling and the
  guest cycle, practised at real events such as school functions) and accommodation operations (cleaning agents for
  public areas, flower arrangements, and decor projects for public areas and guest rooms). This practical work is not
  part of the chapters below. SOYL covers Paper I only. No Class XI specimen paper is published for this subject, and
  no unit-wise marks weightage is published for ISC Hospitality Management. CISCE lists topics with scope notes, not
  textbook chapters: SOYL groups them into 8 teachable chapters in syllabus order, giving each hotel department its own
  chapter. The Class XII portion is in isc-12-hospitality-management.
