# ISC Class 11 Persian (Classical Language elective, code 839) - ISC 2028 course, CLASS XI year.
# CISCE has not bifurcated the syllabus, so this file covers the whole Classes XI-XII syllabus and the prescribed book.
# Prescribed book: title as transliterated by CISCE. Titles are in English with transliterated Persian terms.
subject_id: isc-11-persian-classical
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-classical-languages, isc-2028-prescribed-books, isc-2028-regulations]
exam_notes: >-
  There is no board examination in Class XI: Class XI is year one of the two-year ISC 2028 course and the school sets the
  Class XI examination on the portion of the syllabus covered during the year. CISCE has not bifurcated this syllabus (the
  Class XII ISC paper is set on the entire syllabus), so this file covers the whole Classes XI-XII Persian syllabus and nothing
  is removed. Paper I Theory (3 hours, 80 marks), which the school examination normally follows: (a) questions on grammar;
  (b) unseen translation from English into Persian of short prose sentences and a continuous prose passage; (c) translation
  from the prescribed book, with no choice of passages; (d) short-answer questions on the subject matter of the prescribed
  book. CISCE does not publish marks per part. Prescribed book (Appendix I, ISC 2028): Farsi Va Dastoor, available from Anjuman
  Tarrqie Urdu (no author named). Paper II Project Work for Class XI (20 marks, assessed internally by the school during the
  year): Listening (6) - an unseen passage of about 500 words, a poem or an audio clip heard twice, with objective questions;
  Speaking (6) - an individual presentation of about three minutes (extempore, declamation, recitation, debate; the suggested
  tasks include reading out, after correcting, a grammatically incorrect passage of 150-200 words based on the grammar
  syllabus) followed by discussion with the teacher; Writing (8) - one assignment of about 200 words on any aspect of the
  language or literature studied in Class XI (e.g. describing an event, a book review, a summary of a text, an alternative
  title with justification). CISCE sets no question paper for project work. CISCE does not list the grammar items for Persian;
  the grammar chapters below follow the school grammar of Persian as taught in India (terms such as Mazi Mutlaq, Muzare, Amr) -
  this breakdown is SOYL's, not CISCE's. SOYL did not have the contents of Farsi Va Dastoor, so the prescribed-book chapter is
  skill-based rather than lesson by lesson. Titles are in English / CISCE transliteration; Persian-script titles to be added in
  language review. CISCE lists topics not chapters; SOYL grouped them into teachable chapters in syllabus order.
units:
  - { name: "(a) Grammar", marks: null }
  - { name: "(b) Unseen translation from English into Persian", marks: null }
  - { name: "(c) and (d) Prescribed book: translation and short-answer questions", marks: null }
chapters:
  - id: isc-11-persian-classical-ch01
    number: 1
    title: "Script, nouns and the izafat"
    unit: "(a) Grammar"
    topics:
      - id: isc-11-persian-classical-ch01-t01
        title: "The Persian alphabet: the letters pe, che, zhe and gaf, joining forms and short vowels"
        learning_outcomes:
          - "Write the Persian alphabet with its joining forms and read words with and without short-vowel marks"
      - id: isc-11-persian-classical-ch01-t02
        title: "Plural with -ha and -an; Arabic broken plurals used in Persian"
        learning_outcomes:
          - "Form the plural of nouns with -ha or -an according to the type of noun"
          - "Recognise common Arabic broken plurals in Persian texts and give their singular"
      - id: isc-11-persian-classical-ch01-t03
        title: "Indefiniteness: ya-e-wahdat and yek"
        learning_outcomes:
          - "Make a noun indefinite with the suffix -i or with yek and translate the result"
      - id: isc-11-persian-classical-ch01-t04
        title: "The izafat: noun + adjective and noun + noun"
        learning_outcomes:
          - "Link a noun to its adjective or possessor with the izafat and read the construction aloud correctly"
    removed_topics: []
    literature_texts: []
  - id: isc-11-persian-classical-ch02
    number: 2
    title: "Pronouns, adjectives and numerals"
    unit: "(a) Grammar"
    topics:
      - id: isc-11-persian-classical-ch02-t01
        title: "Separate personal pronouns (man, tu, u, ma, shuma, ishan) and attached pronouns (-am, -at, -ash, -eman, -etan, -eshan)"
        learning_outcomes:
          - "Use separate and attached pronouns to show the subject, the possessor and the object"
      - id: isc-11-persian-classical-ch02-t02
        title: "Demonstratives (in, an) and the reflexive khud"
        learning_outcomes:
          - "Use in, an and khud correctly with nouns and verbs"
      - id: isc-11-persian-classical-ch02-t03
        title: "Comparative and superlative: -tar az and -tarin"
        learning_outcomes:
          - "Compare people or things with -tar az and form the superlative with -tarin"
      - id: isc-11-persian-classical-ch02-t04
        title: "Cardinal and ordinal numbers"
        learning_outcomes:
          - "Write cardinal and ordinal numbers and use them with nouns"
    removed_topics: []
    literature_texts: []
  - id: isc-11-persian-classical-ch03
    number: 3
    title: "Verbs (1): infinitive, stems and past tenses"
    unit: "(a) Grammar"
    topics:
      - id: isc-11-persian-classical-ch03-t01
        title: "Masdar (infinitive), past stem and present stem"
        learning_outcomes:
          - "Derive the past stem from the infinitive and give the present stem of common regular and irregular verbs"
      - id: isc-11-persian-classical-ch03-t02
        title: "Mazi Mutlaq (simple past) and Mazi Istemrari (past continuous)"
        learning_outcomes:
          - "Conjugate a verb in the simple past and past continuous with all persons and translate the forms"
      - id: isc-11-persian-classical-ch03-t03
        title: "Mazi Qarib (present perfect) and Mazi Baeed (past perfect)"
        learning_outcomes:
          - "Form the present perfect and past perfect and explain how they differ in meaning"
      - id: isc-11-persian-classical-ch03-t04
        title: "Mazi Ihtemali (probable past) and Mazi Tamannai (past of wish or condition)"
        learning_outcomes:
          - "Recognise the probable past and the past of wish or condition in texts and translate them"
    removed_topics: []
    literature_texts: []
  - id: isc-11-persian-classical-ch04
    number: 4
    title: "Verbs (2): present, future, imperative, negation and passive"
    unit: "(a) Grammar"
    topics:
      - id: isc-11-persian-classical-ch04-t01
        title: "Muzare (aorist / subjunctive) and Haal (present with mi-)"
        learning_outcomes:
          - "Conjugate a verb in the Muzare and in the Haal and use each in suitable sentences"
      - id: isc-11-persian-classical-ch04-t02
        title: "Mustaqbil (future with khwastan + past stem)"
        learning_outcomes:
          - "Form the future tense with the present of khwastan and the past stem"
      - id: isc-11-persian-classical-ch04-t03
        title: "Amr (imperative) and Nahi (prohibition)"
        learning_outcomes:
          - "Form the imperative with bi- and the prohibitive with ma- or na-"
      - id: isc-11-persian-classical-ch04-t04
        title: "Negation with na- and the passive with shudan"
        learning_outcomes:
          - "Negate verbs in each tense"
          - "Change active sentences into the passive with the past participle and shudan"
    removed_topics: []
    literature_texts: []
  - id: isc-11-persian-classical-ch05
    number: 5
    title: "The sentence: word order, ra, prepositions and compound verbs"
    unit: "(a) Grammar"
    topics:
      - id: isc-11-persian-classical-ch05-t01
        title: "Word order (subject - object - verb) and the object marker ra"
        learning_outcomes:
          - "Build Persian sentences in the right order and mark a definite direct object with ra"
      - id: isc-11-persian-classical-ch05-t02
        title: "Prepositions: az, ba, bi, dar, bar, ta, bara-ye"
        learning_outcomes:
          - "Use common prepositions correctly in sentences"
      - id: isc-11-persian-classical-ch05-t03
        title: "Compound verbs with kardan, shudan, dadan and namudan"
        learning_outcomes:
          - "Form and translate compound verbs made with a noun or adjective and a light verb"
      - id: isc-11-persian-classical-ch05-t04
        title: "Complex sentences with ke, agar, chun and ta"
        learning_outcomes:
          - "Join clauses with ke, agar, chun and ta to express reported content, condition, cause and purpose"
    removed_topics: []
    literature_texts: []
  - id: isc-11-persian-classical-ch06
    number: 6
    title: "Unseen translation from English into Persian"
    unit: "(b) Unseen translation from English into Persian"
    topics:
      - id: isc-11-persian-classical-ch06-t01
        title: "Translating short prose sentences: tense, person and word order"
        learning_outcomes:
