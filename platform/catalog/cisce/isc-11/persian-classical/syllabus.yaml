      - id: isc-11-persian-classical-ch06-t02
        title: "Using izafat, ra and compound verbs in translation"
        learning_outcomes:
          - "Use the izafat, ra and suitable compound verbs where the English sentence needs them"
      - id: isc-11-persian-classical-ch06-t03
        title: "Translating a continuous prose passage"
        learning_outcomes:
          - "Translate a short connected English passage into simple, correct Persian"
