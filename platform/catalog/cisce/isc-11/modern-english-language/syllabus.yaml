# ISC Class 11 Modern English: English Language (Modern English 891, component 1) - ISC 2028 course, CLASS XI year.
# Source: platform/catalog/sources/cisce.md#isc-2028-modern-english. Topic wording is our own summary of the official scope.
subject_id: isc-11-modern-english-language
academic_year: "2026-27"
