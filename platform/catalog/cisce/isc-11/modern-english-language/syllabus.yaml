exam_notes: >-
  Modern English (891) is the compulsory alternative to English (801) and may not be taken with it. It has two components,
  English Language and Literature in English, each with a theory paper of 80 marks and project work of 20 marks; this file
  is English Language (Literature is isc-11-modern-english-literature). There is no board examination in Class XI: Class XI
  is year one of the two-year ISC 2028 course and the school sets the Class XI examination, which normally follows the
  paper pattern the syllabus prescribes for Classes XI and XII. Theory paper: 3 hours, 80 marks, all four questions
  compulsory. Question 1: one composition of 400-450 words chosen from six topics (narrative, descriptive, reflective,
  argumentative/persuasive, expository, original short story), marked for quality of language and organisation.
  Question 2: (a) directed writing of 250-300 words using all the given information and points (feature article, book
  review, blog, newspaper report, statement of purpose), testing amplifying, describing and re-stating, with format;
  (b) a proposal on a given situation in the CISCE format (introduction/heading, objectives, list of measures, concluding
  statement), also marked for linguistic ability. Question 3: compulsory short items on transformation of sentences,
  phrasal verbs and verbs/tenses (number and type vary). Question 4: a passage of about 700 words with questions on
  vocabulary, content, inference and analysis, and a summary of all or part of it within a word limit, written in grid
  form without abbreviations or contractions. Project work for Class XI (20 marks, assessed internally by the school):
  Listening (10) - an unseen passage of about 500 words, not from an ICSE/ISC textbook, read aloud twice (about 110 words a
  minute, then slower) with objective questions; Speaking (10: content, fluency, vocabulary, sentence structure,
  confidence 2 each) - an individual presentation of about three minutes followed by two to three minutes of discussion
  with the teacher (narrating an experience, giving directions or instructions, describing, reporting, expressing an
  opinion). The Class XII writing-skills project is not part of Class XI. CISCE describes question types, not chapters:
  SOYL groups the skills into teachable chapters in the order of the paper. No question-wise marks are published, so units
  carry no marks.
