# ISC Class 11 Robotics (884), Paper I Theory - ISC 2028 syllabus, CLASS XI portion only.
# Source: platform/catalog/sources/cisce.md#isc-2028-robotics. Topic wording is our own summary of the official scope.
subject_id: isc-11-robotics
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-robotics, isc-2028-regulations]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course. There is no board examination in Class XI: the school conducts
  the Class XI examination on the Class XI portion, and promotion to Class XII needs at least 35% on the cumulative
  average in five subjects including English, with 75% attendance (ISC 2028 Regulations). The syllabus prescribes, and
  the school examination usually follows: Paper I Theory, 3 hours, 70 marks; Paper II Practical, 30 marks, evaluated
  internally by the school. The 3-hour practical has three problem statements of which one is attempted: 90 minutes
  for an algorithm, circuit or block diagram and handwritten program, then 90 minutes to build, code and run it on the
  computer and hardware with seen and unseen inputs (15 marks). The rest is continuous evaluation of at least twenty
  assignments done during the year (execution 4, practical file documentation 6) and one project on any syllabus topic
  (knowledge 1, functionality 3, presentation 1). The front page of the syllabus splits the 30 marks as Practical 15,
  Project Work 10 and Practical File 5, which does not match this detailed scheme; schools follow the detailed scheme.
  Suggested assignments include describing object positions in Cartesian, polar and cylindrical coordinates, building
  a simple arm and analysing its degrees of freedom, obstacle avoidance with ultrasonic or infrared sensors,
  programming basic movements on a microcontroller board, wireless control over Bluetooth or Wi-Fi, simulation, and a
  team robot project. SOYL covers Paper I only. Robotics may be taken with Computer Science but not with Artificial
  Intelligence (ISC 2028 Regulations). No Class XI specimen paper is published for this subject. The published Class
  XI unit weightage is used for the units. CISCE lists topics under five weighted units, not textbook chapters: SOYL
  groups them into 8 teachable chapters in syllabus order. The Class XII portion is in isc-12-robotics.
units:
  - { name: "Unit 1: Introduction to Robotics", marks: 10 }
  - { name: "Unit 2: Mechanical System", marks: 15 }
  - { name: "Unit 3: Computing Systems", marks: 20 }
  - { name: "Unit 4: Electrical and Control Systems", marks: 15 }
  - { name: "Unit 5: Applications of Robotic Systems", marks: 10 }
