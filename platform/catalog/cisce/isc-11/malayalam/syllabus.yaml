        title: "Chapters 3-4: events and development of the story"
        learning_outcomes:
          - "Narrate the main events of this part of the novel in sequence in your own words"
          - "Explain how this part develops the central conflict and the characters"
      - id: isc-11-malayalam-ch05-t03
        title: "Character sketch: Govindankutty and the people around him"
        learning_outcomes:
          - "Describe Govindankutty's situation in the family and the village with incidents from the prescribed chapters"
          - "Explain how other members of the family and village treat him"
      - id: isc-11-malayalam-ch05-t04
        title: "Themes: the decaying joint family (tharavad), caste, poverty and alienation"
        learning_outcomes:
          - "Explain how the prescribed chapters show the decline of the tharavad and the loneliness of the outsider"
      - id: isc-11-malayalam-ch05-t05
        title: "Title, narrative technique and language"
        learning_outcomes:
          - "Explain the significance of the title with reference to the prescribed portion"
          - "Comment on the author's narrative style and use of language with examples"
    removed_topics:
