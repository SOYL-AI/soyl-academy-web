# ISC Class 11 Environmental Science (877), Paper I Theory - ISC 2028 syllabus, CLASS XI portion only.
# Source: platform/catalog/sources/cisce.md#isc-2028-environmental-science. Topic wording is our own summary of the official scope.
subject_id: isc-11-environmental-science
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-environmental-science, isc-2028-regulations, isc-2027-class-xi-specimen-papers]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course. There is no board examination in Class XI: the school conducts
  the Class XI examination on the Class XI portion, and promotion to Class XII needs at least 35% on the cumulative
  average in five subjects including English, with 75% attendance (ISC 2028 Regulations). The syllabus prescribes, and
  the school examination usually follows: Paper I Theory, 3 hours, 70 marks; Paper II Project Work, 30 marks, made up
  of two handwritten projects of 15 marks each on any syllabus topics, evaluated by the subject teacher (introduction
  and objectives 3, content with causes, effects, remedies and a case study 4, presentation and analysis of material 4,
  originality and local solutions 2, bibliography 2). Suggested projects include a study of one Indian biome, a
  non-biodegradable pollutant, a local pollution problem, interactions between organisms, environmental laws and
  agencies, urban traffic congestion, an alternative energy source, an application of biotechnology, provisioning
  services of local flora and fauna, hydroponics or vertical farming, and a herbarium of five local plants. CISCE has
  published a Class XI specimen question paper for Environmental Science (Year 2027) as a guide to the school paper.
  SOYL covers Paper I only. The 14 listed abbreviations (AIDS, AYUSH, BP, COPD, HIV, NGO, NGT, PVTG, SCR, TNC, UNCTAD,
  UNDP, UNEP, WHO) are folded into the relevant topics. Published Class XI unit weightage is used for the units. CISCE
  lists topics under seven units with scope notes, not textbook chapters: SOYL groups them into 20 teachable chapters
  in syllabus order. The Class XII portion is in isc-12-environmental-science.
units:
  - { name: "1. Environment - The Foundation of Life", marks: 5 }
  - { name: "2. Modes of Existence", marks: 7 }
  - { name: "3. Ecology", marks: 15 }
  - { name: "4. Pollution", marks: 15 }
  - { name: "5. Legal Regimes for Sustainable Development", marks: 10 }
  - { name: "6. Technology and Environment", marks: 10 }
  - { name: "7. Design and Planning for Environmental Conservation and Protection", marks: 8 }
