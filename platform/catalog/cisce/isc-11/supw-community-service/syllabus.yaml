# ISC Class 11 Socially Useful Productive Work and Community Service (SUPW) - ISC 2028 course, CLASS XI portion.
# Source: platform/catalog/sources/cisce.md#isc-2028-supw. Topic wording is our own summary; SUPW is mainly practical work.
subject_id: isc-11-supw-community-service
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-supw, isc-2028-regulations]
exam_notes: >-
  No written paper. Class XI is year one of the two-year ISC 2028 course. SUPW (work practice in a craft) and Community
  Service (work in the home, school and outside that benefits the community) are assessed internally by the school in
  each of Classes XI and XII, marked out of 100; each year the candidate takes one craft and one service, and may add
  topics from the optional Contemporary Studies component. SUPW is assessed on preparation 10, organisation 20, skills
  40, research 20 and interest 10; community service on preparation 10, organisation 20, skills 40, resourcefulness 20
  and interest 10, entered on a record card (and, for day scholars, a parent-kept diary of 20-30 minutes of daily home
  and neighbourhood service). Contemporary Studies is assessed by participation in class discussion. Heads of schools
  submit grades A (Very Good) to E (Unsatisfactory, fail) online through the CISCE CAREERS portal. About 150 hours a
  year (15% of working time) are recommended. The hands-on craft and service work itself is practical and is not
  listed as chapters. SOYL covers the planning and assessment knowledge (common to both years) in chapters 1-2 and the
  Class XI Contemporary Studies topics in chapters 3-7; the Class XII list is in isc-12-supw-community-service. The
  document gives no weightage for Contemporary Studies.
units:
