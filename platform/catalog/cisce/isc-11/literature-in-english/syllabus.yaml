# ISC Class 11 Literature in English (English 801, Paper 2: Prescribed Texts) - ISC 2028 course, CLASS XI year.
# Literature: titles and authors only (CONTEXT section 8). Students read the texts in their own textbook.
subject_id: isc-11-literature-in-english
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-english, isc-2028-prescribed-books]
exam_notes: >-
  English (801) is compulsory; Literature in English is its second component, with a theory paper of 3 hours and 80 marks
  plus project work of 20 marks. There is no board examination in Class XI: Class XI is year one of the two-year ISC 2028
  course, and CISCE states that the Class XI examination (set by the school) is conducted only on the portion prescribed
  for Class XI, listed here: Macbeth Acts I and II, five stories from Prism and five poems from Rhapsody (both Evergreen
  Publications). The paper sets questions on Drama, Prose (short stories) and Poetry. Drama and prose questions are
  central to the text and test understanding, appreciation, analysis and synthesis in the candidate's own words; poetry
  questions on a poem or group of poems test content, personal response and appreciation of stylistic and literary features.
  Project work for Class XI (20 marks, assessed internally by the school): one written assignment of 1000-1500 words on
  the Class XI texts only, titled as a question, with an introduction, a main body under sub-headings and a conclusion
  (process 6, understanding/application/analysis 8, presentation 6); the texts used may not be repeated in the Class XII
  project. No question-wise or section-wise marks are published, so units carry no marks. SOYL splits the drama into one
  chapter per act and gives each prescribed story and poem its own topic. The Class XII portion is in isc-12-literature-in-english.
units:
  - { name: "I. Drama", marks: null }
  - { name: "II. Prose (Short Stories)", marks: null }
  - { name: "III. Poetry", marks: null }
chapters:
  - id: isc-11-literature-in-english-ch01
    number: 1
    title: "Macbeth: Act I"
    unit: "I. Drama"
    topics:
      - id: isc-11-literature-in-english-ch01-t01
        title: "Introducing Shakespearean tragedy: the Jacobean stage, the historical Scotland of the play and the main characters"
        learning_outcomes:
          - "Explain the features of a Shakespearean tragedy and the idea of a tragic hero"
          - "Describe the setting of the play and identify the main characters and their relationships"
      - id: isc-11-literature-in-english-ch01-t02
        title: "Act I, scenes 1-2: the witches' opening and the report of Macbeth's valour in battle"
        learning_outcomes:
          - "Explain how the opening scene creates an atmosphere of evil and moral confusion"
          - "Describe how the Captain's report presents Macbeth before we meet him and why Duncan rewards him"
      - id: isc-11-literature-in-english-ch01-t03
        title: "Act I, scene 3: the witches' prophecies to Macbeth and Banquo and the news of the thaneship of Cawdor"
        learning_outcomes:
          - "Compare Macbeth's and Banquo's reactions to the prophecies"
          - "Analyse what Macbeth's asides reveal about his hidden ambition once the first prophecy comes true"
      - id: isc-11-literature-in-english-ch01-t04
        title: "Act I, scenes 4-5: Malcolm named Prince of Cumberland; Lady Macbeth reads the letter and resolves on murder"
        learning_outcomes:
          - "Explain why Malcolm's nomination is an obstacle to Macbeth and how he responds"
          - "Analyse Lady Macbeth's view of her husband's character and her invocation of dark powers"
      - id: isc-11-literature-in-english-ch01-t05
        title: "Act I, scenes 6-7: Duncan at Inverness; Macbeth's doubts and Lady Macbeth's persuasion"
        learning_outcomes:
          - "Identify the dramatic irony in Duncan's praise of the castle and his hosts"
          - "Summarise Macbeth's arguments against the murder in his soliloquy and explain how Lady Macbeth overcomes them"
    removed_topics: []
    literature_texts:
      - { title: "Macbeth (Act I)", author: "William Shakespeare" }
  - id: isc-11-literature-in-english-ch02
    number: 2
    title: "Macbeth: Act II"
    unit: "I. Drama"
    topics:
      - id: isc-11-literature-in-english-ch02-t01
        title: "Act II, scene 1: Banquo's unease and the dagger soliloquy"
        learning_outcomes:
          - "Contrast Banquo's response to the witches' words with Macbeth's"
          - "Analyse how the dagger soliloquy shows Macbeth's disturbed mind just before the murder"
      - id: isc-11-literature-in-english-ch02-t02
        title: "Act II, scene 2: the murder of Duncan and its immediate aftermath"
        learning_outcomes:
          - "Compare the reactions of Macbeth and Lady Macbeth immediately after the murder"
          - "Explain the significance of the images of sleep, blood and washing in the scene"
      - id: isc-11-literature-in-english-ch02-t03
        title: "Act II, scene 3: the Porter, the discovery of the murder and the flight of Malcolm and Donalbain"
        learning_outcomes:
          - "Explain the dramatic purpose of the Porter scene, including comic relief and its link to hell and equivocation"
          - "Evaluate Macbeth's and Lady Macbeth's behaviour when the murder is discovered and why the princes flee"
      - id: isc-11-literature-in-english-ch02-t04
        title: "Act II, scene 4: unnatural omens, suspicion of the princes and Macbeth's coming coronation"
        learning_outcomes:
          - "Describe the disturbances in nature reported in the scene and link them to the murder of a king"
          - "Explain what Macduff's decision not to attend the coronation suggests"
      - id: isc-11-literature-in-english-ch02-t05
        title: "Acts I-II review: ambition, appearance and reality, the supernatural, and the Macbeths' partnership"
        learning_outcomes:
          - "Trace Macbeth's development from loyal general to murderer across the first two acts"
          - "Analyse key themes and recurring imagery (darkness, blood, clothing, sleep) in Acts I and II"
    removed_topics:
      - "Acts III, IV and V (Class XII portion; see isc-12-literature-in-english)"
    literature_texts:
      - { title: "Macbeth (Act II)", author: "William Shakespeare" }
  - id: isc-11-literature-in-english-ch03
    number: 3
    title: "Prism: Short Stories (Class XI portion)"
    unit: "II. Prose (Short Stories)"
    topics:
      - id: isc-11-literature-in-english-ch03-t01
        title: "A Living God (Lafcadio Hearn): an old man's sacrifice that saves a village from a tidal wave"
        learning_outcomes:
          - "Narrate how Hamaguchi recognises the danger and why he sets fire to his own rice harvest"
          - "Explain why the villagers come to honour him as a living god and what this shows about Japanese belief and gratitude"
          - "Discuss themes of selflessness, wisdom and community in the story"
      - id: isc-11-literature-in-english-ch03-t02
        title: "Advice to Youth (Mark Twain): satire in the form of a speech of advice"
        learning_outcomes:
          - "Identify the pieces of advice the speaker gives and explain how each is undercut by humour"
          - "Analyse the use of irony, exaggeration and anticlimax to satirise conventional moral instruction"
      - id: isc-11-literature-in-english-ch03-t03
        title: "The Paper Menagerie (Ken Liu): a mother's origami animals, a son's rejection of his heritage and a final letter"
        learning_outcomes:
          - "Summarise the stages of Jack's relationship with his mother from childhood to her death"
          - "Analyse the role of the paper animals and the mother's letter as symbols of love and memory"
          - "Discuss themes of immigrant identity, racism, language and regret"
      - id: isc-11-literature-in-english-ch03-t04
        title: "The Great Automatic Grammatizator (Roald Dahl): a machine that writes fiction"
        learning_outcomes:
          - "Outline how Adolph Knipe builds and exploits his story-writing machine with Mr Bohlen"
          - "Evaluate the story's satire of commercialised writing and its warning about machines replacing human creativity"
          - "Explain the significance of the narrator's position at the end of the story"
      - id: isc-11-literature-in-english-ch03-t05
        title: "Thank You, Ma'am (Langston Hughes): an attempted theft answered with kindness"
        learning_outcomes:
          - "Narrate the encounter between Roger and Mrs Luella Bates Washington Jones and how it ends"
          - "Analyse how Mrs Jones's actions and words teach Roger about trust and dignity"
          - "Explain the significance of the title and the story's minimal dialogue from Roger"
    removed_topics:
      - "Class XII stories of Prism: Atithi / Guest, The Cookie Lady, There Will Come Soft Rains, Indigo, The Medicine Bag (see isc-12-literature-in-english)"
    literature_texts:
      - { title: "A Living God", author: "Lafcadio Hearn" }
      - { title: "Advice to Youth", author: "Mark Twain" }
      - { title: "The Paper Menagerie", author: "Ken Liu" }
      - { title: "The Great Automatic Grammatizator", author: "Roald Dahl" }
      - { title: "Thank You, Ma'am", author: "Langston Hughes" }
  - id: isc-11-literature-in-english-ch04
    number: 4
    title: "Rhapsody: Poems (Class XI portion)"
    unit: "III. Poetry"
    topics:
      - id: isc-11-literature-in-english-ch04-t01
        title: "Abhisara: The Tryst (Rabindranath Tagore): a monk's compassion for a dancer cast out by the city"
        learning_outcomes:
          - "Narrate the two meetings between Upagupta and Vasavadatta and explain the meaning of 'the time has not yet come'"
          - "Contrast earthly beauty and spiritual love as presented in the poem and explain its Buddhist context"
      - id: isc-11-literature-in-english-ch04-t02
        title: "Why I Like the Hospital (Tony Hoagland): finding honesty and shared humanity in a place of illness"
        learning_outcomes:
          - "Summarise the speaker's reasons for valuing the hospital in one's own words"
          - "Analyse the poem's conversational tone, free verse and unexpected viewpoint"
          - "Comment on what the poem suggests about vulnerability and human connection"
      - id: isc-11-literature-in-english-ch04-t03
        title: "Sonnet 116 (William Shakespeare): love that does not alter"
        learning_outcomes:
          - "Paraphrase the speaker's definition of true love, both what it is and what it is not"
          - "Explain the images of the guiding star and Time's sickle and the role of the closing couplet"
          - "Identify the structure and rhyme scheme of a Shakespearean sonnet"
      - id: isc-11-literature-in-english-ch04-t04
        title: "Death of a Naturalist (Seamus Heaney): childhood wonder turning to revulsion"
        learning_outcomes:
          - "Contrast the child's delight in the first stanza with his fear and disgust in the second"
          - "Analyse the use of sound devices, sensory imagery and military metaphors"
          - "Explain how the poem presents the loss of childhood innocence"
      - id: isc-11-literature-in-english-ch04-t05
        title: "Strange Meeting (Wilfred Owen): a dead soldier's encounter with the enemy he killed"
        learning_outcomes:
          - "Describe the setting of the poem and the identity of the 'strange friend'"
          - "Analyse the message about the waste and pity of war in the enemy's speech"
          - "Identify Owen's use of pararhyme (half-rhyme) and explain its effect"
    removed_topics:
      - "Class XII poems of Rhapsody: Telephone Conversation, Tithonus, Beethoven, Small Towns and the River, Death be not Proud (see isc-12-literature-in-english)"
    literature_texts:
      - { title: "Abhisara: The Tryst", author: "Rabindranath Tagore" }
      - { title: "Why I Like the Hospital", author: "Tony Hoagland" }
      - { title: "Sonnet 116", author: "William Shakespeare" }
      - { title: "Death of a Naturalist", author: "Seamus Heaney" }
      - { title: "Strange Meeting", author: "Wilfred Owen" }
