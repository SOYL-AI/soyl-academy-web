# ISC Class 11 Physical Education (875) - ISC 2028 course, CLASS XI portion only (theory paper).
# Source: platform/catalog/sources/cisce.md#isc-2028-physical-education. Topic wording is our own summary of the official scope.
subject_id: isc-11-physical-education
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-physical-education, isc-2028-regulations]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course: there is no CISCE board examination in Class XI, and the
  school sets the Class XI examination on the Class XI portion, normally following the pattern below.
  Paper I Theory: 3 hours, 70 marks. Section A covers six theory topics; Section B covers the theory of games -
  each candidate studies ANY TWO of Cricket, Football, Hockey, Basketball, Volleyball, Badminton, Tennis, Swimming
  and Athletics (rules and their interpretation, officials and their duties, dimensions and diagrams of play area and
  equipment, terminology, fundamental skills, strategies and formations, associations and tournaments). SOYL gives one
  chapter per game so a student can pick any two. Paper II Practical Work: 30 marks, evaluated in Class XI by the
  internal examiner on the scheme printed after Class XII: continuous evaluation 10 (file work on two games/activities 4,
  participation and performance 3, physical efficiency tests 3) and practical evaluation 20 (physical efficiency tests 12,
  specialisation tests on two basic skills of each chosen game/activity 6, viva 2). The six physical efficiency tests are
  50 m run, standing long jump, 1000 m (boys) / 600 m (girls) run, push-ups, 10 m shuttle run and 60-second sit-ups;
  practical activities also include softball, dancing, gymnastics and yoga. Practical work is not part of the chapters below.
  CISCE lists topics with scope notes, not textbook chapters: SOYL groups them into 18 teachable chapters in syllabus order.
  No section-wise marks weightage is published in the syllabus document.
