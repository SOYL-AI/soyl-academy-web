# ISC Class 11 Art (871) - ISC 2028 course, year one (Class XI).
# Source: platform/catalog/sources/cisce.md#isc-2028-art. The ISC 2028 syllabus is printed for Classes XI and XII
# together (no class split), so all of it is covered. Theory-only coverage: every paper is practical, so chapters
# teach the knowledge and technique each paper needs. Topic wording is our own summary of the official scope.
subject_id: isc-11-art
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-art, isc-2028-regulations]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course: there is no CISCE board examination in Class XI, and the
  school sets and assesses the Class XI work, normally following the pattern below. The ISC 2028 Art syllabus is
  printed for Classes XI and XII together with no class split, so all of it is covered here. Candidates take three papers of 100 marks each, at least one from Section A (Papers 1-3) and at least one from
  Section B (Papers 4-6); success depends on the subject as a whole. Papers 1-5 are 3-hour practical examinations:
  Paper 1 Drawing or Painting from Still Life; Paper 2 Drawing or Painting from Nature (A: structure of natural forms,
  or B: outdoor study); Paper 3 Drawing or Painting of a Living Person (A: whole figure in a described pose, or B:
  head study that may include arms and hands; a second study may be added); Paper 4 Original Imaginative Composition
  in Colour (list of subjects issued at least seven days before; no sketches or notes in the room); Paper 5 Crafts A
  (one question - book page/cover/end papers, notice or pictorial poster, card or emblem, or patterned paper - on flat
  paper with ink and/or colour). Paper 6 Crafts B (school candidates only; no CISCE question paper) is one or two
  pieces in one of eight crafts made during the year, with optional working drawings, notebook or photographs,
  certified by the Principal as unaided, and assessed by a locally appointed Visiting Examiner. Exam rules - any
  suitable medium; painted work quick-drying and fully dry; acrylic mixed with water; crayon or chalk fixed;
  monochrome does not meet the colour requirement of Paper 4; no measuring or ruling in Papers 1-4 (instruments and
  tracing allowed but discouraged in Paper 5); paper at least 35 cm x 25 cm, own paper up to Half Imperial or Royal
  (64 cm x 51 cm), no boards or mounting, work must fill the page; UID and Index Number only, on the front top right
  and on the back. All drawing, painting and craft production is practical work and is not taught as chapters here;
  SOYL covers the theory and technique knowledge the six papers draw on. The ISC 2028 Art syllabus has no separate
  written history-of-art paper. CISCE describes papers, not chapters: SOYL groups the required knowledge into teachable
  chapters, foundations first and then paper by paper in syllabus order. No marks weightage beyond 100 per paper is
  published.
units:
  - { name: "Foundations: media, elements and principles of art", marks: null }
  - { name: "Paper 1: Drawing or Painting from Still Life", marks: 100 }
  - { name: "Paper 2: Drawing or Painting from Nature", marks: 100 }
  - { name: "Paper 3: Drawing or Painting of a Living Person", marks: 100 }
  - { name: "Paper 4: Original Imaginative Composition in Colour", marks: 100 }
  - { name: "Paper 5: Crafts A", marks: 100 }
  - { name: "Paper 6: Crafts B (Craftwork)", marks: 100 }
