# ISC Class 11 Modern Armenian (Modern Foreign Language elective, code 833) - ISC 2028 course, CLASS XI year.
# Modern Armenian is new in the ISC 2028 Modern Foreign Languages syllabus (common syllabus with Chinese, Tibetan, Thai, Portuguese).
# CISCE Appendix I (ISC 2028) lists no prescribed textbooks for Modern Armenian, so Part 4 of the paper is two translation passages.
# CISCE has not bifurcated the syllabus, so this file covers the whole Classes XI-XII syllabus.
# Titles are in English with a few transliterated grammatical terms (no Armenian script).
subject_id: isc-11-modern-armenian
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-mfl, isc-2028-prescribed-books, isc-2028-regulations]
exam_notes: >-
  There is no board examination in Class XI: Class XI is year one of the two-year ISC 2028 course and the school sets the
  Class XI examination on the portion of the syllabus covered during the year. CISCE has not bifurcated this syllabus (the
  Class XII ISC paper is set on the entire syllabus), so this file covers the whole Classes XI-XII Modern Armenian syllabus and
  nothing is removed. Paper I Theory (3 hours, 80 marks), which the school examination normally follows, has four parts:
  (1) a short composition in Armenian from a choice of subjects; (2) an Armenian passage for unprepared translation into
  English; (3) an unseen Armenian passage with questions - candidates may be asked to summarise part of it in Armenian,
  explain individual words, phrases or sentences, and answer comprehension questions (not every question type is set every
  year); (4) questions on prescribed textbooks - but CISCE Appendix I (ISC 2028) prescribes no textbooks for Modern Armenian,
  so under the syllabus rule for languages without texts Part 4 consists of (a) one passage for translation from Armenian
  into English and (b) one passage for translation from English into Armenian. The syllabus asks schools to consult CISCE in
  time about prescribed textbooks. CISCE does not publish marks per part, and does not say whether Eastern or Western Armenian
  is expected; SOYL teaches standard Eastern Armenian and points out the main Western Armenian differences where they matter
  (schools should confirm the standard with CISCE). Paper II Project Work for Class XI (20 marks, assessed internally by the
  school during the year): Listening (6) - an unseen passage of about 500 words, a poem or an audio clip heard twice, with
  objective questions; Speaking (6) - an individual presentation of about three minutes (extempore, declamation, recitation,
  debate; e.g. narrating an experience, giving instructions, describing, reporting, giving an opinion or a speech) followed by
  two or three minutes' discussion with the teacher; Writing (8) - one assignment of about 200 words on any aspect of the
  language studied in Class XI (e.g. describing a process or an event, a summary, an alternative title with justification).
  CISCE sets no question paper for project work. The syllabus does not list grammar items; the two grammar chapters below
  cover the structures needed for composition and two-way translation - this breakdown is SOYL's, not CISCE's. Titles are in
  English; Armenian-script titles to be added in language review. CISCE lists topics not chapters; SOYL grouped them into
  teachable chapters in syllabus order.
units:
  - { name: "1. Composition", marks: null }
  - { name: "2. Unprepared translation into English", marks: null }
  - { name: "3. Unseen passage", marks: null }
  - { name: "4. Translation (no textbooks prescribed)", marks: null }
chapters:
  - id: isc-11-modern-armenian-ch01
    number: 1
    title: "Composition"
    unit: "1. Composition"
    topics:
      - id: isc-11-modern-armenian-ch01-t01
        title: "Planning a short composition: outline, paragraphs and linking words"
        learning_outcomes:
          - "Make an outline and write a short composition in Armenian with a clear introduction, body and conclusion"
          - "Link ideas with conjunctions and linking words for addition, contrast and sequence"
      - id: isc-11-modern-armenian-ch01-t02
        title: "Describing people, places and festivals"
        learning_outcomes:
          - "Describe a person, a city or a festival in Armenia or India in well-formed sentences with suitable adjectives"
      - id: isc-11-modern-armenian-ch01-t03
        title: "Narrating a past experience"
        learning_outcomes:
          - "Narrate a past experience in order, using the simple past (aorist) for events and the imperfect for background"
      - id: isc-11-modern-armenian-ch01-t04
        title: "Giving and supporting an opinion"
        learning_outcomes:
          - "State an opinion on a subject and support it with two or three reasons and an example"
      - id: isc-11-modern-armenian-ch01-t05
        title: "Everyday and community subjects: family, school, festivals, culture and heritage, travel, environment, technology"
        learning_outcomes:
          - "Use topic vocabulary accurately to write about everyday subjects, including the Armenian community and heritage in India"
      - id: isc-11-modern-armenian-ch01-t06
        title: "Accuracy: spelling, capital letters and Armenian punctuation (the verjaket full stop; question and exclamation marks written over the stressed vowel)"
        learning_outcomes:
          - "Proof-read one's composition for spelling errors and use Armenian punctuation marks correctly"
    removed_topics: []
    literature_texts: []
  - id: isc-11-modern-armenian-ch02
    number: 2
    title: "Grammar (1): the noun and the noun phrase"
    unit: null
    topics:
      - id: isc-11-modern-armenian-ch02-t01
        title: "The Armenian alphabet: letters, sounds and spelling rules"
        learning_outcomes:
          - "Read and write all the letters of the Armenian alphabet and spell common words correctly from dictation"
      - id: isc-11-modern-armenian-ch02-t02
        title: "The definite article (-ə / -n) and the indefinite article"
        learning_outcomes:
          - "Add the definite article in its correct form after consonants and vowels, and make a noun indefinite"
      - id: isc-11-modern-armenian-ch02-t03
        title: "Plural of nouns (-er and -ner)"
        learning_outcomes:
          - "Form the plural of one-syllable and longer nouns with the correct ending"
      - id: isc-11-modern-armenian-ch02-t04
        title: "Noun cases: nominative, accusative, genitive, dative, ablative, instrumental and (Eastern) locative"
        learning_outcomes:
          - "Decline common nouns in each case and choose the case that a sentence requires"
      - id: isc-11-modern-armenian-ch02-t05
        title: "Postpositions (e.g. vra 'on', mej 'in', het 'with', hamar 'for') and the case they govern"
        learning_outcomes:
          - "Use common postpositions with the noun in the correct case to express place, company and purpose"
      - id: isc-11-modern-armenian-ch02-t06
        title: "Pronouns, possessive suffixes (-s 'my', -d 'your') and adjectives"
        learning_outcomes:
          - "Use personal, demonstrative and possessive forms, including the possessive suffixes, in sentences"
          - "Place adjectives before the noun and form comparatives and superlatives"
    removed_topics: []
    literature_texts: []
  - id: isc-11-modern-armenian-ch03
    number: 3
    title: "Grammar (2): the verb and the complex sentence"
    unit: null
    topics:
      - id: isc-11-modern-armenian-ch03-t01
        title: "The infinitive and the conjugations (-el, -al; also -il in Western Armenian); the auxiliary verb 'to be'"
        learning_outcomes:
          - "Identify the conjugation of a verb from its infinitive and conjugate the auxiliary verb in present and past"
      - id: isc-11-modern-armenian-ch03-t02
        title: "Present, imperfect and future tenses"
        learning_outcomes:
          - "Form the present, imperfect and future of regular verbs and use them with suitable time expressions"
      - id: isc-11-modern-armenian-ch03-t03
        title: "Simple past (aorist) and perfect; common irregular verbs"
        learning_outcomes:
          - "Form the aorist and the perfect of regular and common irregular verbs and distinguish their uses"
      - id: isc-11-modern-armenian-ch03-t04
        title: "Imperative, subjunctive and conditional moods"
        learning_outcomes:
          - "Give commands and requests, express wishes and possibility, and write simple if-sentences"
      - id: isc-11-modern-armenian-ch03-t05
        title: "Negation with ch- and questions"
        learning_outcomes:
          - "Make verbs negative with the prefix ch- in each tense and form yes-no and question-word questions"
      - id: isc-11-modern-armenian-ch03-t06
        title: "Complex sentences: relative and conjunctive vor, conditional ete, causal and contrastive conjunctions"
        learning_outcomes:
          - "Join clauses with vor, ete and conjunctions of cause and contrast to build longer sentences"
    removed_topics: []
    literature_texts: []
  - id: isc-11-modern-armenian-ch04
    number: 4
    title: "Translation from Armenian into English"
    unit: "2. Unprepared translation into English"
    topics:
