# ISC Class 11 Biotechnology (878), Paper I Theory - ISC 2028 syllabus, CLASS XI portion only.
# Source: platform/catalog/sources/cisce.md#isc-2028-biotechnology. Topic wording is our own summary of the official scope.
subject_id: isc-11-biotechnology
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-biotechnology, isc-2028-regulations, isc-2027-class-xi-specimen-papers]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course. There is no board examination in Class XI: the school conducts
  the Class XI examination on the Class XI portion, and promotion to Class XII needs at least 35% on the cumulative
  average in five subjects including English, with 75% attendance (ISC 2028 Regulations). The syllabus prescribes, and
  the school examination usually follows: Paper I Theory, 3 hours, 70 marks; Paper II Practical, 3 hours, 15 marks,
  plus Project Work 10 marks and Practical File 5 marks, assessed by the teacher (total 30). CISCE has published a
  Class XI specimen question paper for Biotechnology (Year 2027) as a guide to the school paper. Class XI experiments:
  blood grouping with antisera (with safe finger-prick rules), blood smear with Leishman's stain, names, uses and
  principles of laboratory instruments, pH of tap water with acid and base, onion root-tip mitosis and mitotic index,
  meiosis from permanent slides, effect of temperature on curdling of milk by Lactobacillus, food tests for
  carbohydrates, proteins and lipids, milk purity with a lactometer, karyotype preparation, quadrat and transect
  sampling with pea seeds, and primary and secondary data analysis. The project is one study on any aspect of
  biotechnology. SOYL covers Paper I only. The syllabus lists 27 abbreviations (CCMB, CdK, COV, DBT, EFB, ELISA, ELSI,
  GEAC, GMO, HLA, ICGEB, IEF, IPR, IVF, MALDI-MS, MI, NBRC, NBTB, NIPGR, OECD, PBR, PCD, PPV and FR, PKU, RE, Rf, TSG)
  whose full forms candidates must know; they are folded into the relevant topics below. Published Class XI weightage
  is used for the units. CISCE lists topics under five units with scope notes, not textbook chapters: SOYL groups them
  into 14 teachable chapters in syllabus order. The Class XII portion is in isc-12-biotechnology.
units:
  - { name: "1. Introduction to Biotechnology", marks: 12 }
  - { name: "2. Cell Biology", marks: 14 }
  - { name: "3. Biomolecules, Separation Techniques and Defence Strategies in Organisms", marks: 17 }
  - { name: "4. Genetics", marks: 12 }
  - { name: "5. Introduction to Cell Culture Technology", marks: 15 }
chapters:
  - id: isc-11-biotechnology-ch01
    number: 1
    title: "History of Biotechnology and Fermentation"
    unit: "1. Introduction to Biotechnology"
    topics:
      - id: isc-11-biotechnology-ch01-t01
        title: "Definitions of biotechnology by OECD and EFB; the kitchen as the first biotechnology laboratory (curd making)"
        learning_outcomes:
          - "State the OECD and EFB definitions of biotechnology and expand both abbreviations"
          - "Explain curd making as a traditional biotechnological process"
      - id: isc-11-biotechnology-ch01-t02
        title: "Early discoveries (Hooke, Leeuwenhoek, Mendel) and the modern era (Fleming, Pasteur, Watson and Crick, Arber and Smith, Boyer and Cohen)"
        learning_outcomes:
          - "Match each scientist to his contribution, such as restriction enzymes (Arber and Smith) or recombinant DNA (Boyer and Cohen)"
          - "Arrange key discoveries on a timeline from classical to modern biotechnology"
      - id: isc-11-biotechnology-ch01-t03
        title: "Anaerobic respiration: homo-fermentation and hetero-fermentation; lactic acid fermentation in dairy and probiotics"
        learning_outcomes:
          - "Distinguish homo-fermentation from hetero-fermentation by their end products"
          - "Explain the use of lactic acid fermentation in dairy and probiotic industries"
      - id: isc-11-biotechnology-ch01-t04
        title: "Alcoholic fermentation in bioethanol and beverages; fermentation in beer production"
        learning_outcomes:
          - "Write the overall change in alcoholic fermentation of glucose by yeast"
          - "Outline the main stages of beer production"
      - id: isc-11-biotechnology-ch01-t05
        title: "Good Laboratory Practices and Good Manufacturing Practices: definitions, objectives, principles and examples"
        learning_outcomes:
          - "Distinguish GLP from GMP and state the objectives and principles of each"
          - "Give one example of applying GLP and one of applying GMP"
    removed_topics: []
    literature_texts: []
