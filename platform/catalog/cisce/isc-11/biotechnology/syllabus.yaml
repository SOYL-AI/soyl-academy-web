      - id: isc-11-biotechnology-ch02-t02
        title: "Discoveries versus inventions; Intellectual Property Rights: patents and their components, trademarks, trade secrets, copyright and geographical indications"
        learning_outcomes:
          - "Distinguish a discovery from an invention"
          - "Identify the type of IPR that protects a given product, name or process, such as a geographical indication for Darjeeling tea"
      - id: isc-11-biotechnology-ch02-t03
        title: "Plant Breeders' Rights and the PPV and FR Act, 2001"
        learning_outcomes:
          - "Explain the need for the Protection of Plant Varieties and Farmers' Rights Act, 2001"
      - id: isc-11-biotechnology-ch02-t04
        title: "Ethical, legal and social issues (ELSI), e.g. IVF and stem cell therapy; biosafety of GMOs and the role of GEAC"
        learning_outcomes:
          - "Discuss ethical, legal and social issues raised by IVF and stem cell therapy"
          - "Explain the role of GEAC in approving genetically modified organisms"
      - id: isc-11-biotechnology-ch02-t05
        title: "Indian and global institutes: NCBI, EMBL, NBTB, CCMB, ICGEB, DBT, CDFD, NIPGR, NBRC and leading Indian biotechnology companies"
        learning_outcomes:
