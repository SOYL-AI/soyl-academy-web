# ISC Class 11 Kannada (Indian Language elective, code 806) - ISC 2028 course, CLASS XI year.
# Literature: titles and authors only (CONTEXT section 8). Students read the texts in their own textbook.
subject_id: isc-11-kannada
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-indian-languages, isc-2028-prescribed-books, cisce-circular-2026-27-33-indian-languages, isc-2028-regulations]
exam_notes: >-
  There is no board examination in Class XI: Class XI is year one of the two-year ISC 2028 course and the school sets
  the Class XI examination, which CISCE says is conducted only on the portion prescribed for Class XI. The ISC paper
  pattern (normally followed by the school): Paper I Theory, one paper of 3 hours, 80 marks, in two sections. Section
  A Language (40 marks, three compulsory questions): a composition of about 400 words in Kannada from a choice of six
  topics; an unseen passage of about 300 words with questions and/or a summary with a heading (testing the ability to
  summarise and/or expand an idea); and functional grammar (correction of sentences and use of words/idioms in
  sentences, with correct agreement of number, gender, case, tense and voice). Section B Prescribed Textbooks (40
  marks): answer four questions from any three of the prescribed books. Prescribed texts are bifurcated (Circular
  2026-27/33; ISC 2028 Indian Languages syllabus): only the Class XI portion is listed here, the Class XII portion
  (isc-12-kannada) is in each chapter's removed_topics. The Language section (Section A) is not bifurcated. Paper II
  Project Work for Class XI (20 marks, assessed internally by the school): Listening (6) - an unseen passage of about
  500 words, a poem or an audio clip with objective questions; Speaking (6) - a presentation of about three minutes
  (extempore, declamation, recitation, debate and similar) with discussion; Writing (8) - a piece of 600-800 words on
  language or the Class XI literature portion. CISCE lists topics, not chapters: SOYL grouped them into teachable
  chapters in syllabus order. CISCE does not publish question-wise marks within Section A and describes composition
  and grammar only generically: the composition types and grammar breakdown below are SOYL's, adapted to the grammar
  of the language. SOYL covers all four prescribed books so a student can pick any three. Titles are in English /
  CISCE transliteration; native-script titles to be added in language review.
units:
  - { name: "Section A: Language", marks: 40 }
  - { name: "Section B: Prescribed Textbooks", marks: 40 }
chapters:
  - id: isc-11-kannada-ch01
    number: 1
    title: "Composition writing (about 400 words)"
    unit: "Section A: Language"
    topics:
      - id: isc-11-kannada-ch01-t01
        title: "Planning a composition: choosing a topic, outline, introduction, body and conclusion"
        learning_outcomes:
          - "Choose a suitable topic from a choice of six and prepare an outline before writing"
          - "Write a well-organised composition of about 400 words in Kannada, divided into paragraphs"
      - id: isc-11-kannada-ch01-t02
        title: "Descriptive and narrative compositions"
        learning_outcomes:
          - "Describe an experience, journey, place or event in Kannada vividly and in a logical sequence"
      - id: isc-11-kannada-ch01-t03
        title: "Reflective and argumentative compositions: for and against, and conclusion"
        learning_outcomes:
          - "Present a point of view on a social or current issue in Kannada, supported by reasons and examples"
          - "Weigh opposing arguments fairly and write a balanced conclusion"
      - id: isc-11-kannada-ch01-t04
        title: "Story writing from a given sentence, proverb or outline"
        learning_outcomes:
          - "Write an original story in Kannada that develops a given opening line, proverb or outline to a meaningful end"
      - id: isc-11-kannada-ch01-t05
        title: "Language and style: word choice, idioms, spelling and punctuation"
        learning_outcomes:
          - "Use vocabulary and idiomatic expressions suited to the topic"
          - "Proofread a composition and correct its errors of spelling and punctuation in Kannada"
    removed_topics: []
    literature_texts: []
  - id: isc-11-kannada-ch02
    number: 2
    title: "Comprehension: unseen passage (about 300 words) and summary"
    unit: "Section A: Language"
    topics:
      - id: isc-11-kannada-ch02-t01
        title: "Identifying the main idea and supporting points of a passage"
        learning_outcomes:
          - "State the central idea of an unseen Kannada passage of about 300 words in your own words"
      - id: isc-11-kannada-ch02-t02
        title: "Answering questions on the passage in your own words"
        learning_outcomes:
          - "Answer factual and inferential questions accurately without copying lines from the passage"
          - "Explain the meaning of difficult words and phrases from their context"
      - id: isc-11-kannada-ch02-t03
        title: "Writing a summary with a heading"
        learning_outcomes:
          - "Write a summary of the passage in about one-third of its length and give it a suitable heading"
      - id: isc-11-kannada-ch02-t04
        title: "Expanding an idea given in the passage"
        learning_outcomes:
          - "Expand a statement or idea from the passage into a paragraph with examples"
    removed_topics: []
    literature_texts: []
  - id: isc-11-kannada-ch03
    number: 3
    title: "Grammar: correction of sentences"
    unit: "Section A: Language"
    topics:
      - id: isc-11-kannada-ch03-t01
        title: "Agreement of subject and verb in person, number and gender (masculine, feminine, neuter)"
        learning_outcomes:
