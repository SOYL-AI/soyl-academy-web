# ISC Class 11 Modern English: Literature in English (Modern English 891, component 2: Prescribed Texts) - ISC 2028 course, CLASS XI year.
# Source: platform/catalog/sources/cisce.md#isc-2028-modern-english and #isc-2028-prescribed-books.
# Literature: titles and authors only. Students read the texts in their own textbook; topic wording is our own.
subject_id: isc-11-modern-english-literature
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-modern-english, isc-2028-prescribed-books]
exam_notes: >-
  Modern English (891) is the compulsory alternative to English (801); Literature in English is its second component,
  with a theory paper of 3 hours and 80 marks plus project work of 20 marks. There is no board examination in Class XI:
  Class XI is year one of the two-year ISC 2028 course, and CISCE states that the Class XI examination (set by the school)
  is conducted on the portion prescribed for Class XI, listed here: Pygmalion Acts I and II, five pieces from Perspectives
  (ISC short stories) and five poems from Reflections (ISC poems), both Evergreen Publications. Questions are set on Drama,
  Prose (short stories) and Poetry: drama and prose questions are central to the text and test understanding,
  appreciation, analysis and synthesis in the candidate's own words; poetry questions on a poem or group of poems test
  content, personal response and appreciation of stylistic and literary features. Project work for Class XI (20 marks,
  assessed internally by the school): one written assignment of 1000-1500 words on the Class XI texts only, titled as a
  question, with an introduction, a main body under sub-headings and a conclusion (process 6, understanding/application/
  analysis 8, presentation 6); the texts used may not be repeated in the Class XII project. No section-wise marks are
  published, so units carry no marks. SOYL splits the drama into one chapter per act and gives each prescribed story and
  poem its own topic. The Class XII portion is in isc-12-modern-english-literature.
units:
  - { name: "I. Drama", marks: null }
  - { name: "II. Prose (Short Stories)", marks: null }
  - { name: "III. Poetry", marks: null }
chapters:
  - id: isc-11-modern-english-literature-ch01
    number: 1
    title: "Pygmalion: Act I"
    unit: "I. Drama"
    topics:
      - id: isc-11-modern-english-literature-ch01-t01
        title: "George Bernard Shaw, the Pygmalion myth and the play as a social comedy"
        learning_outcomes:
          - "Outline Shaw's life and his use of drama to criticise society"
          - "Explain the classical myth behind the title and how Shaw adapts it"
      - id: isc-11-modern-english-literature-ch01-t02
        title: "The rainy night at Covent Garden: the Eynsford Hill family, Freddy and the flower girl"
        learning_outcomes:
          - "Describe the setting and how the crowd sheltering from the rain brings different classes together"
          - "Characterise Mrs Eynsford Hill, Clara and Freddy from their behaviour in the scene"
      - id: isc-11-modern-english-literature-ch01-t03
        title: "The note taker: Higgins's study of accents and the flower girl's alarm"
        learning_outcomes:
          - "Explain why the crowd and the flower girl suspect the note taker and how he reveals his skill"
          - "Analyse Higgins's manner towards Eliza and what it reveals about his attitude to class"
      - id: isc-11-modern-english-literature-ch01-t04
        title: "Higgins meets Pickering: the boast about speech and social rank, and Eliza's taxi ride"
        learning_outcomes:
          - "Explain Higgins's claim that speech decides a person's place in society"
          - "Discuss how the act's ending prepares for Eliza's visit in Act II"
    removed_topics:
      - "Acts III, IV and V (Class XII portion; see isc-12-modern-english-literature)"
    literature_texts:
      - { title: "Pygmalion (Act I)", author: "George Bernard Shaw" }
  - id: isc-11-modern-english-literature-ch02
    number: 2
    title: "Pygmalion: Act II"
    unit: "I. Drama"
    topics:
      - id: isc-11-modern-english-literature-ch02-t01
        title: "Higgins's laboratory in Wimpole Street and Eliza's arrival to ask for lessons"
        learning_outcomes:
          - "Explain why Eliza comes to Higgins and what she hopes to achieve"
          - "Describe the comedy of the bargaining over the price of lessons"
      - id: isc-11-modern-english-literature-ch02-t02
        title: "The wager with Pickering and Mrs Pearce's objections"
        learning_outcomes:
          - "Explain the terms of the experiment and why Pickering agrees to pay for it"
          - "Analyse Mrs Pearce's concerns about Eliza's welfare and Higgins's thoughtlessness"
      - id: isc-11-modern-english-literature-ch02-t03
        title: "Alfred Doolittle's visit: the 'undeserving poor' and middle-class morality"
        learning_outcomes:
          - "Describe Doolittle's purpose in visiting and how he bargains with Higgins"
          - "Discuss how Shaw uses Doolittle's arguments to satirise middle-class ideas of respectability"
      - id: isc-11-modern-english-literature-ch02-t04
        title: "Characters and themes of Acts I-II: Higgins, Pickering, Eliza and the link between language and class"
        learning_outcomes:
          - "Compare the ways Higgins and Pickering treat Eliza"
          - "Explain how the first two acts set up the themes of class, speech and transformation"
    removed_topics: []
    literature_texts:
      - { title: "Pygmalion (Act II)", author: "George Bernard Shaw" }
  - id: isc-11-modern-english-literature-ch03
    number: 3
    title: "Perspectives: Short Stories (Class XI portion)"
    unit: "II. Prose (Short Stories)"
    topics:
      - id: isc-11-modern-english-literature-ch03-t01
        title: "Lawley Road (R.K. Narayan): renaming and removing a colonial statue in Malgudi"
        learning_outcomes:
          - "Summarise the Municipal Chairman's campaign after independence and the fate of the statue"
          - "Explain how Narayan satirises bureaucracy and hasty patriotic zeal through irony"
      - id: isc-11-modern-english-literature-ch03-t02
        title: "The Landlady (Roald Dahl): a young traveller, a strange boarding house and a sinister host"
        learning_outcomes:
          - "Trace the clues that suggest danger to Billy and explain why he fails to notice them"
          - "Analyse how Dahl builds suspense and leaves the ending open"
      - id: isc-11-modern-english-literature-ch03-t03
        title: "Most Beautiful (Ruskin Bond): a differently-abled boy, the cruelty of others and a mother's love"
        learning_outcomes:
          - "Describe how the boy is treated by others and how the narrator responds"
          - "Discuss the story's message about beauty, compassion and acceptance"
      - id: isc-11-modern-english-literature-ch03-t04
        title: "Dream-Children: A Reverie (Charles Lamb): imagined children, family memories and loneliness"
        learning_outcomes:
          - "Explain the situation of the essay and the memories the narrator shares with the children"
          - "Analyse how the ending reveals the narrator's loneliness and creates pathos"
      - id: isc-11-modern-english-literature-ch03-t05
        title: "Ratan Tata: A Life - Settling in at Cornell (Thomas Mathew): a young Indian student in America"
        learning_outcomes:
          - "Describe the challenges the young Ratan Tata faced in adjusting to student life abroad"
          - "Identify the qualities and values that the excerpt shows him developing"
    removed_topics:
      - "Class XII stories of Perspectives: The Doll's House, Death by Scrabble, The Dreamer, Games at Twilight, The Father-Thing (see isc-12-modern-english-literature)"
    literature_texts:
      - { title: "Lawley Road", author: "R.K. Narayan" }
      - { title: "The Landlady", author: "Roald Dahl" }
      - { title: "Most Beautiful", author: "Ruskin Bond" }
      - { title: "Dream-Children: A Reverie", author: "Charles Lamb" }
      - { title: "Ratan Tata: A Life - Settling in at Cornell (An Excerpt)", author: "Thomas Mathew" }
  - id: isc-11-modern-english-literature-ch04
    number: 4
    title: "Reflections: Poems (Class XI portion)"
    unit: "III. Poetry"
    topics:
      - id: isc-11-modern-english-literature-ch04-t01
        title: "Father Returning Home (Dilip Chitre): a commuter's loneliness and alienation"
        learning_outcomes:
          - "Describe the father's journey home and his evening routine as the poem presents them"
          - "Analyse the imagery that conveys his isolation from his family and the modern world"
      - id: isc-11-modern-english-literature-ch04-t02
        title: "Life Doesn't Frighten Me (Maya Angelou): a child's courage in the face of fears"
        learning_outcomes:
          - "Identify the real and imaginary fears listed and explain how the speaker faces them"
          - "Explain the effect of the refrain, rhythm and childlike voice"
      - id: isc-11-modern-english-literature-ch04-t03
        title: "Sadness Comes (Donna Ashworth): accepting sadness as part of life"
        learning_outcomes:
          - "Explain the poem's attitude to sadness and how it suggests one should respond to it"
          - "Identify the main images and comment on the poem's consoling tone"
      - id: isc-11-modern-english-literature-ch04-t04
        title: "A Prayer for My Daughter (W.B. Yeats): a father's hopes during a storm"
        learning_outcomes:
          - "List the qualities the speaker wishes for his daughter and those he wants her to avoid"
          - "Explain the contrast between the storm and the ideal of custom, ceremony and inner peace"
      - id: isc-11-modern-english-literature-ch04-t05
        title: "Bora Ring (Judith Wright): the lost ceremonies of Aboriginal Australia"
        learning_outcomes:
          - "Explain what the bora ring was and what its abandonment signifies"
          - "Discuss the poem's sense of loss and guilt about the destruction of an indigenous culture"
    removed_topics:
      - "Class XII poems of Reflections: My Grandmother's House, Refugee Blues, Urban, Ode to Tomatoes, The Black Santa (see isc-12-modern-english-literature)"
    literature_texts:
      - { title: "Father Returning Home", author: "Dilip Chitre" }
      - { title: "Life Doesn't Frighten Me", author: "Maya Angelou" }
      - { title: "Sadness Comes", author: "Donna Ashworth" }
      - { title: "A Prayer for My Daughter", author: "William Butler Yeats" }
      - { title: "Bora Ring", author: "Judith Wright" }
