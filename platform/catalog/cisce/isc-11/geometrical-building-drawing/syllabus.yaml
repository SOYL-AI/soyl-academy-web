# ISC Class 11 Geometrical and Building Drawing (870) - ISC 2028 syllabus, CLASS XI portion only.
# Source: platform/catalog/sources/cisce.md#isc-2028-geometrical-building-drawing. Topic wording is our own summary.
# Drawing-based subject: chapters teach the geometrical constructions and projection methods as concepts and
# step-by-step procedures; students practise the drawings with instruments on A2 sheets. The Class XI theory is the
# same plane and solid geometry as Geometrical and Mechanical Drawing (869); only the drawing code and project differ.
subject_id: isc-11-geometrical-building-drawing
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-geometrical-building-drawing, isc-2028-regulations]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course. There is no board examination in Class XI: the school conducts
  the Class XI examination on the Class XI portion, and promotion to Class XII needs at least 35% on the cumulative
  average in five subjects including English, with 75% attendance (ISC 2028 Regulations). The syllabus prescribes, and
  the school examination usually follows: Paper I Theory (drawing), 3 hours, 80 marks, in A Plane Geometry and B Solid
  Geometry; candidates must reach a minimum standard in the subject as a whole. Drawing board, tee-square and
  set-squares are required (a parallel-motion board or drafting machine is permitted), A2 paper is used, IS:962-1972
  (Code of Practice for Architectural and Building Drawings) is followed, and the use of models is encouraged.
  Question diagrams may be printed in First or Third Angle projection (the one used is stated) and answers in either
  are accepted. Paper II Project Work, 20 marks, assessed by the subject teacher: two projects on any topics covered in
  theory; the syllabus refers to the Class XII section for project details and suggestions (theory-based, model-based
  and sketching-based projects). Project work is practical and is not taught as chapters here. SOYL covers the
  concepts and construction procedures of Paper I. The subject may not be taken with Geometrical and Mechanical
  Drawing (ISC 2028 Regulations). No Class XI specimen paper and no section-wise marks weightage are published. CISCE
  lists topics under two sections, not textbook chapters: SOYL opens with a drawing-practice chapter and then groups
  the topics into teachable chapters in syllabus order, 14 in all. The Class XII portion is in
  isc-12-geometrical-building-drawing.
units:
