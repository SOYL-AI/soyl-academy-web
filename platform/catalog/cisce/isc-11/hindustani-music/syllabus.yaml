# ISC Class 11 Music: Indian Music - Hindustani (872), Paper 1 Theory - ISC 2028 course, CLASS XI portion only.
# Source: platform/catalog/sources/cisce.md#isc-2028-music. Theory paper only; practical work is described in exam_notes.
# Topic wording is our own summary of the official scope.
subject_id: isc-11-hindustani-music
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-music, isc-2028-regulations]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course: there is no CISCE board examination in Class XI, and the
  school sets the Class XI examination on the Class XI portion, normally following the pattern below. Paper 1 Theory:
  3 hours, 70 marks. Paper 2 Practical: 30 marks (practical examination 20, overall impression of the performance 5 -
  accuracy of shruti and laya, confidence, posture, tonal quality, expression - and teacher's evaluation of the year's
  work 5); in Class XI the practical is evaluated by the internal examiner. The syllabus has three parts - Part 1
  Vocal, Part 2 Instrumental, Part 3 Instrumental Percussion (Tabla) - and a candidate takes both papers from one part
  only. The subject may not be taken with Carnatic or Western Music. Class XI practical work (Part 1: chhota khayal
  with five taans in Yaman, Bhupali, Khamaj, Bhairav and Desh, five alankars, a devotional or folk song; Part 2:
  Razakhani/drut gat with five todas in the same ragas, five alankars, a dhun in any raga; Parts 1 and 2: padhant of
  Teentaal, Dadra, Kaharwa and Jhaptaal in thah, dugun and chaugun with tali and khali shown by hand; Part 3: Teentaal,
  Ektaal, Chaartaal, Rupak and Tivra on the tabla in thah, dugun and chaugun, a peshkara, uthaan and kayada with four
  paltas and tihai in Teentaal, a paran in Chaartaal, a tukda in Ektaal, kisms in Rupak and Tivra, producing tabla
  syllables, theka accompaniment and knowledge of lehra) is not taught as chapters here. Theory items 1, 3, 4, 6 and 7
  are identical for Parts 1 and 2, and the eminent musicians and the essay of about 200 words on a topic of general
  interest in music are also set for Part 3. Class XII theory (Naad, raga types, Dhrupad-Dhamar and gat forms, shrutis,
  ten thaats, the Class XII ragas and taals, instruments) is in isc-12-hindustani-music. CISCE lists numbered theory
  items per part, not chapters: SOYL groups them into teachable chapters in syllabus order, placing theory shared by
  parts in common units. No marks weightage by part or topic is published.
