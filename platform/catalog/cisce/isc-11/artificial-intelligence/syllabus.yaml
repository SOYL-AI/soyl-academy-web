# ISC Class 11 Artificial Intelligence (883), Paper I Theory - ISC 2028 syllabus, CLASS XI portion only.
# Source: platform/catalog/sources/cisce.md#isc-2028-artificial-intelligence. Topic wording is our own summary of the official scope.
subject_id: isc-11-artificial-intelligence
academic_year: "2026-27"
source_status: verified
sources: [isc-2028-artificial-intelligence, isc-2028-regulations]
exam_notes: >-
  Class XI is year one of the two-year ISC 2028 course. There is no board examination in Class XI: the school conducts
  the Class XI examination on the Class XI portion, and promotion to Class XII needs at least 35% on the cumulative
  average in five subjects including English, with 75% attendance (ISC 2028 Regulations). The syllabus prescribes, and
  the school examination usually follows: Paper I Theory, 3 hours, 70 marks; Paper II Practical, 30 marks, evaluated
  internally by the school. The 3-hour practical has three problem statements of which one is attempted: 90 minutes
  for a written algorithm and handwritten program, then 90 minutes to code, execute and print it (15 marks). The rest
  is continuous evaluation of at least twenty programming assignments done during the year (execution 4, practical
  file documentation 6) and one project on any syllabus topic (knowledge 1, functionality 3, presentation 1). The
  front page of the syllabus splits the 30 marks as Practical 15, Project Work 10 and Practical File 5, which does not
  match this detailed scheme; schools follow the detailed scheme. Suggested assignments use Python with Matplotlib,
  Seaborn, NumPy and Pandas: line, bar, scatter, box and pair plots, outlier handling, simulating coin flips, sampling a
  normal distribution, building a DataFrame from a Kaggle dataset, and a simple hypothesis test. SOYL covers Paper I
  only. AI may be taken with Computer Science but not with Robotics (ISC 2028 Regulations). No Class XI specimen paper
  is published for this subject. The published Class XI unit weightage is used for the units. CISCE lists topics under
  seven weighted units, not textbook chapters: SOYL groups them into 11 teachable chapters in syllabus order. The Class
  XII portion is in isc-12-artificial-intelligence.
units:
  - { name: "Unit 1: Basic Concepts of Artificial Intelligence", marks: 8 }
  - { name: "Unit 2: Introduction and State of Art of AI, NLP and Potential Use of AI", marks: 8 }
  - { name: "Unit 3: Mathematics for AI", marks: 12 }
  - { name: "Unit 4: Data Visualization", marks: 16 }
  - { name: "Unit 5: Theoretical and Practical Aspects of Data Processing", marks: 8 }
  - { name: "Unit 6: Data Modelling, Simple Linear Regression", marks: 12 }
  - { name: "Unit 7: Ethical Practices in AI", marks: 6 }
