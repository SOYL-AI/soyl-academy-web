# ICSE Class 10 Auto Service Technician (code 96, Group III Section B vocational) - ICSE 2027 examination.
# Source: platform/catalog/sources/cisce.md#icse-2027-vocational-auto-service-technician (Class X portion). Topic wording is our own summary.
subject_id: icse-10-auto-service-technician
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-vocational-auto-service-technician, icse-2027-regulations]
exam_notes: >-
  One written paper of 2 hours, 100 marks: Part I-A Employability Skills 30 marks (Units 1-5) and Part I-B Vocational
  Skills 70 marks (Units 6-10); no further unit-wise weightage is published. Internal assessment of practical work 100 marks,
  marked 50 by the subject teacher and 50 by an external examiner nominated by the Head of School: Practical Work 70
  (practical examination 40 - any two practicals from different units chosen by the external examiner; practical file 10;
  viva voce 20) and Project Work 30 (field visit or project report 10, student portfolio 10, viva voce 10).
  The syllabus pairs each theory list with practical activities (demonstrations, role plays, charts, field visits); these
  are assessed internally and are not listed as chapters here. The document has separate Class IX and Class X unit lists:
  this file covers the Class X list only, which is the content of the Class X written paper.
  No 2027 specimen paper is listed for this subject. The Class X vocational units are listed very briefly (Units 9 and 10
  have one item each); SOYL topics stay at the level of an introductory automobile course.
  CISCE lists learning outcomes unit by unit, not textbook chapters: SOYL groups them into 10 teachable chapters in
  syllabus order (chapters 1-5 = Units 1-5; Unit 6 = chapters 6-7; Units 7 and 8 = chapters 8 and 9; Units 9-10 = chapter 10).
units:
  - { name: "Part I-A: Employability Skills", marks: 30 }
  - { name: "Part I-B: Vocational Skills", marks: 70 }
chapters:
