    title: "Communication Skills - II"
    unit: "Part I-A: Employability Skills"
    topics:
      - id: icse-10-auto-service-technician-ch01-t01
        title: "Methods of communication: verbal, non-verbal and visual"
        learning_outcomes:
          - "Compare verbal, non-verbal and visual communication with one workplace example of each"
          - "List the advantages and limitations of written, spoken and non-verbal messages"
          - "Identify common body-language mistakes and suggest how to avoid them"
      - id: icse-10-auto-service-technician-ch01-t02
        title: "Communication cycle and feedback: meaning and importance; descriptive feedback; specific and non-specific feedback"
        learning_outcomes:
          - "Explain the role of feedback in completing the communication cycle"
          - "Distinguish specific from non-specific feedback using examples"
          - "Write descriptive, specific feedback on a given piece of work"
      - id: icse-10-auto-service-technician-ch01-t03
        title: "Barriers to effective communication: types, causes and measures to overcome them"
        learning_outcomes:
          - "Classify barriers to communication (physical, linguistic, emotional, cultural, organisational) in a given situation"
          - "Suggest suitable measures to overcome each barrier identified"
      - id: icse-10-auto-service-technician-ch01-t04
        title: "Principles of effective communication and the 7Cs"
        learning_outcomes:
          - "State the 7Cs of effective communication (clear, concise, concrete, correct, coherent, complete, courteous)"
          - "Rewrite a poorly worded message so that it satisfies the 7Cs"
      - id: icse-10-auto-service-technician-ch01-t05
        title: "Basic writing skills: sentence, phrase, kinds and parts of a sentence, parts of speech, articles and paragraph construction"
        learning_outcomes:
          - "Identify the kind of a sentence and its subject and predicate"
          - "Use parts of speech and articles correctly in sentences"
          - "Write a well-organised paragraph on a topic related to the job role"
