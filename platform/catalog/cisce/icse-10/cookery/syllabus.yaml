    number: 1
    title: "Seasonal Foods, Food Purchase and Convenience Foods"
    unit: "1. Choice and cost of seasonal foods; convenience foods"
    topics:
      - id: icse-10-cookery-ch01-t01
        title: "Food guides and the choice of seasonal foods; nutrient value versus cost"
        learning_outcomes:
          - "Explain why foods in season are richer in nutrients and cheaper"
          - "Evaluate whether the price of a food reflects its nutritive value, with examples"
      - id: icse-10-cookery-ch01-t02
        title: "Cheaper nutritious substitutes for expensive foods"
        learning_outcomes:
          - "Suggest low-cost substitutes such as green leafy vegetables, amla and guava for costly sources of the same nutrients"
      - id: icse-10-cookery-ch01-t03
        title: "Perishable, semi-perishable and non-perishable foods: choice and purchase"
        learning_outcomes:
          - "Classify common foods as perishable, semi-perishable or non-perishable"
          - "List points to check when buying each type of food"
      - id: icse-10-cookery-ch01-t04
        title: "Economical shopping: supermarkets, wholesale outlets, retail shops and street vendors"
