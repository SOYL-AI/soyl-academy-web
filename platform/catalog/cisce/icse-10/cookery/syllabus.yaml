          - "Justify using convenience foods sparingly in favour of fresh seasonal foods"
      - id: icse-10-cookery-ch01-t07
        title: "Reading food labels: trademark, shelf life, manufacture and expiry dates; ISI, FPO and Agmark marks"
        learning_outcomes:
          - "Identify the information a buyer should read on a packaged food label"
          - "State what the ISI, FPO and Agmark quality marks certify"
