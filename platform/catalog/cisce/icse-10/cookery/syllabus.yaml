# ICSE Class 10 Cookery (Group III elective, code 69) - ICSE 2027 examination.
# Source: platform/catalog/sources/cisce.md#icse-2027-cookery. Class X portion only. Topic wording is our own summary of the official scope.
subject_id: icse-10-cookery
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-cookery, icse-2027-regulations]
exam_notes: >-
  One theory paper of 2 hours, 100 marks, plus internal assessment 100 marks; the external paper and internal
  assessment each carry 50% of the subject result (Group III). Internal assessment is practical work in cookery:
  at least five practical-oriented assignments set by the teacher in Class X (e.g. cooking processes, meal planning
  and preparation for different people and occasions, baking, salads, pickles, squashes and jams, chapatis and naans,
  nutritive cooking) plus a final test in which an External Examiner sets the planning and preparation of a meal;
  marked 50 by the subject teacher and 50 by the External Examiner on planning, working to time, manipulation,
  quality and appearance. Practical work is not covered as chapters here.
  The Class IX theory (nutritive value of foods, basic methods of cooking, enhancing food value, effect of heat on
  foods) is in icse-9-cookery and is not examined in the ICSE 2027 paper except as background.
  CISCE lists seven numbered topics with explanatory notes, not textbook chapters; SOYL teaches each as one chapter
  in syllabus order. No section-wise marks weightage is published.
