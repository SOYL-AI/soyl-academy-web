        title: "Stress management: meaning and importance"
        learning_outcomes:
          - "Explain what stress is and why managing it matters for health and work performance"
          - "Identify common sources of stress for a student or a worker"
      - id: icse-10-early-years-physical-activity-facilitator-ch02-t02
        title: "Stress management techniques: physical exercise, yoga, meditation, holidays with family and friends, nature walks"
        learning_outcomes:
          - "Describe how each technique helps to reduce stress"
          - "Plan a weekly routine that includes at least two stress management techniques"
      - id: icse-10-early-years-physical-activity-facilitator-ch02-t03
        title: "Working independently: importance; types of self-awareness; self-motivation and self-regulation"
        learning_outcomes:
          - "Explain why the ability to work independently is valued at the workplace"
          - "Describe the types of self-awareness and the meaning of self-motivation and self-regulation"
          - "Plan and schedule a task to be completed without external direction"
