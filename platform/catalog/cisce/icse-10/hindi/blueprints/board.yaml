notes: >-
  ICSE 2027 Second Language Hindi: one paper of three hours, 80 marks; internal assessment 20 marks is not modelled. VERIFIED from the
  ICSE 2027 Second Languages syllabus (icse-2027-second-languages): Section A Language 40 marks, compulsory (one composition from a
  choice of subjects, one letter from a choice of two, an unseen passage of about 250 words with questions, grammar); Section B
  Prescribed Texts 40 marks (four questions from ONLY two of the prescribed books, Class X portion only per circular 2026-27/33).
  UNVERIFIED: the per-question marks (15 / 7 / 10 / 8), five composition topics, eight 1-mark grammar items, 10-mark text questions in
  2 + 2 + 3 + 3 parts and two questions per book (eight in Section B) follow recent ICSE Hindi papers; no 2027 specimen exists for Hindi
  (the October 2026 circular keeps the 2026 rubric) and the 2026 paper could not be fetched (icse-2026-hindi-paper; owner request in the
  handoff). Hence source_status unverified. No mark_shares: CISCE publishes no competency design for Hindi.
  Section B models the four books as the four text chapters (Sahitya Sagar stories and poems, Naya Raasta, Ekanki Sanchay); the schema
  cannot express "only two books", so eight questions over the four chapters are offered with "attempt 4 of 8" and chapter spread makes
  two per chapter likely. Unit weightage 40 / 40 comes from the syllabus units. Texts are never reproduced: questions refer to a
  scene or lines by place (CONTEXT section 8).
