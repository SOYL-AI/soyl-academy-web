notes: >-
  SOYL half-syllabus test for ICSE Hindi; not an official CISCE paper. The series planner groups the nine chapters into three
  contiguous groups (composition, letter and unseen passage; grammar and stories; poems, novel and one-act plays), which hold different
  kinds of work, so this blueprint uses only item types every group can supply (MCQs and short answers). 40 marks in 90 minutes. The
  six full mocks carry the board pattern.
