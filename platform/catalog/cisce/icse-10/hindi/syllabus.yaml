# ICSE Class 10 Hindi (Second Language, code 05) - ICSE 2027 examination.
# Literature: titles and authors only (CONTEXT section 8). Students read the texts in their own textbook.
subject_id: icse-10-hindi
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-second-languages, icse-2027-prescribed-books, cisce-circular-2026-27-33-indian-languages, icse-2027-regulations]
exam_notes: >-
  One paper of 3 hours, 80 marks, plus internal assessment 20 marks (two or three assignments: one language, one literature).
  Section A Language (40 marks, compulsory): composition, letter, unseen comprehension (about 250 words) and grammar.
  Section B Prescribed Texts (40 marks): answer four questions from ONLY two of the four prescribed books.
  Prescribed texts are bifurcated (Circular 2026-27/33): the ICSE 2027 paper is set only on the Class X portion listed here
  (Class IX portion is in icse-9-hindi). Recommended for background work: Saras Hindi Vyakaran (Evergreen Publications).
  CISCE describes the grammar component only generically (vocabulary, syntax, idioms, sentence synthesis); the grammar
  chapters below break it into the item types commonly set in ICSE Hindi papers - this breakdown is SOYL's, not CISCE's.
  SOYL covers all four prescribed books so a student can pick any two.
units:
  - { name: "खंड क - भाषा (Section A: Language)", marks: 40 }
  - { name: "खंड ख - निर्धारित पाठ्य-पुस्तकें (Section B: Prescribed Texts)", marks: 40 }
