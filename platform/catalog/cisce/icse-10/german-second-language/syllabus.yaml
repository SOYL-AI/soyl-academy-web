# ICSE Class 10 German (Second Language, Group I, code 28) - ICSE 2027 examination.
# No literature is prescribed for this subject; resource books are named in exam_notes only.
subject_id: icse-10-german-second-language
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-mfl-group-1, icse-2027-prescribed-books, icse-2027-regulations]
exam_notes: >-
  One paper of 3 hours, 80 marks, plus internal assessment 20 marks (listening 5, speaking 5, creative writing 10;
  two assessments in Class X, marked 10 by the subject teacher and 10 by an external examiner).
  The paper has five parts: (1) one short composition in German from a choice of subjects or picture/object stimuli;
  (2) a formal or informal letter, with the layout assessed; (3) an unseen passage of about 150 words with questions answered in German;
  (4) grammar - vocabulary, syntax and idiom, without detailed grammatical definitions; (5) translation German to English and
  English to German, and/or a dialogue of about 150 words on an everyday situation. CISCE does not publish marks per part.
  CISCE gives the German grammar scope as an unordered list of items; SOYL grouped every item by grammar area (verbs, modal verbs and imperative, past tenses, articles and cases, pronouns, questions and negation, prepositions, adjectives and comparison, word order, word formation).
  CISCE has not bifurcated this syllabus: the Class X (ICSE 2027) paper is set on the entire Classes IX-X syllabus, so nothing is removed here.
  The Annexe lists communication themes (Myself; Holiday Time and Travel; Work and Lifestyle) that supply the vocabulary and situations
  for composition, letter, comprehension and dialogue questions. Teaching and study resource books (not prescribed literature): Planet 1 for Class IX and Planet 2 for Class X, textbook and workbook (Hueber Verlag, published in India by Langers); suggested references Pingpong Neu 1, Team Deutsch 1 and 2, and a German dictionary.
  A candidate taking German in Group I may not take it again in Group II or III. CISCE lists topics not chapters; SOYL grouped them into teachable chapters in syllabus order.
