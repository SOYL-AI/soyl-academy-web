  - id: icse-10-economics-ch07
    number: 7
    title: "Elasticity of Demand and Supply"
    unit: "2. Theory of Demand and Supply"
    topics:
      - id: icse-10-economics-ch07-t01
        title: "Price elasticity of demand: meaning and types (perfectly elastic to perfectly inelastic)"
        learning_outcomes:
          - "Define price elasticity of demand"
          - "Describe the five degrees of price elasticity of demand and sketch the demand curve for each"
      - id: icse-10-economics-ch07-t02
        title: "Percentage method of measuring elasticity of demand"
        learning_outcomes:
          - "State Ed = percentage change in quantity demanded / percentage change in price and interpret a value greater than, equal to or less than 1"
      - id: icse-10-economics-ch07-t03
        title: "Factors affecting elasticity of demand"
        learning_outcomes:
          - "Explain how availability of substitutes, nature of the good, share of income spent, number of uses and time period affect elasticity of demand"
          - "Predict whether demand for goods such as salt, cars or a particular brand of soap is elastic or inelastic"
      - id: icse-10-economics-ch07-t04
        title: "Elasticity of supply: meaning, types and percentage method"
        learning_outcomes:
          - "Define elasticity of supply and describe its five degrees with diagrams"
          - "State Es = percentage change in quantity supplied / percentage change in price"
      - id: icse-10-economics-ch07-t05
        title: "Factors affecting elasticity of supply"
        learning_outcomes:
          - "Explain how time period, nature of the good, cost of production and production techniques affect elasticity of supply"
