# ICSE Class 10 Economics (code 64, Group II) - ICSE 2027 examination, CLASS X portion only.
# Source: platform/catalog/sources/cisce.md#icse-2027-economics. Topic wording is our own summary of the official scope.
subject_id: icse-10-economics
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-economics, icse-2027-regulations]
exam_notes: >-
  One theory paper of 2 hours, 80 marks, plus internal assessment 20 marks (at least one project/assignment set by
  the teacher from the syllabus, e.g. analysing the factors of production in a local unit, a tax survey of 15 neighbours,
  or the effect of GST on five everyday products; marked 10 by the subject teacher and 10 by an external examiner).
  Group II elective; candidates offering Economic Applications (Group III) may not offer Economics.
  The syllabus does not print the question-paper pattern; ICSE Group II papers usually open with compulsory short-answer
  questions across the syllabus followed by a choice of structured long questions (check the latest CISCE specimen paper).
  The ICSE 2027 paper is set only on the Class X syllabus (Class IX portion is in icse-9-economics).
  CISCE lists numbered topics, not textbook chapters: SOYL groups them into 16 teachable chapters in syllabus order,
  except that elasticity of demand and supply (printed as item 1(ii) inside The Productive Mechanism) is taught after
  the theory of demand and supply, as in common ICSE texts. No unit-wise marks weightage is published.
units:
  - { name: "1. The Productive Mechanism", marks: null }
  - { name: "2. Theory of Demand and Supply", marks: null }
  - { name: "3. Market", marks: null }
  - { name: "4. Banking in India", marks: null }
  - { name: "5. Inflation", marks: null }
  - { name: "6. Consumer Awareness", marks: null }
chapters:
  - id: icse-10-economics-ch01
    number: 1
    title: "Factors of Production and Land"
    unit: "1. The Productive Mechanism"
    topics:
      - id: icse-10-economics-ch01-t01
        title: "Factors of production: land, labour, capital and entrepreneur and their rewards"
        learning_outcomes:
          - "Identify the four factors of production used by a given producer, such as a rice mill or a tailoring unit"
          - "Explain how the combination of factors available shapes the production structure of an economy"
      - id: icse-10-economics-ch01-t02
        title: "Land: meaning and characteristics"
        learning_outcomes:
          - "Define land in the economic sense, including natural resources above and below the surface"
          - "Explain characteristics of land such as fixed supply, immobility, heterogeneity and being a gift of nature"
      - id: icse-10-economics-ch01-t03
        title: "Productivity of land: meaning and factors affecting it"
        learning_outcomes:
          - "Define productivity of land"
          - "Explain how fertility, location, irrigation, use of technology and land improvements affect the productivity of land"
    removed_topics: []
    literature_texts: []
  - id: icse-10-economics-ch02
