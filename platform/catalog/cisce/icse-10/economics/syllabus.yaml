    title: "Labour"
    unit: "1. The Productive Mechanism"
    topics:
      - id: icse-10-economics-ch02-t01
        title: "Labour: meaning and characteristics"
        learning_outcomes:
          - "Distinguish labour as a factor of production from non-economic physical or mental effort"
          - "Explain characteristics of labour such as perishability, inseparability from the labourer and weak bargaining power"
      - id: icse-10-economics-ch02-t02
        title: "Division of labour: meaning, types (simple, complex, territorial) and advantages"
        learning_outcomes:
          - "Classify a given example as simple, complex or territorial division of labour"
          - "Explain the advantages of division of labour to producers, workers and consumers"
      - id: icse-10-economics-ch02-t03
        title: "Efficiency of labour: meaning and factors"
        learning_outcomes:
          - "Define efficiency of labour and explain how health, education, training and working conditions influence it"
      - id: icse-10-economics-ch02-t04
        title: "Reasons for low efficiency of Indian labour"
        learning_outcomes:
          - "Explain at least five reasons for the low efficiency of labour in India, such as poor health, illiteracy and lack of training"
          - "Suggest measures to raise the efficiency of Indian workers"
    removed_topics: []
    literature_texts: []
