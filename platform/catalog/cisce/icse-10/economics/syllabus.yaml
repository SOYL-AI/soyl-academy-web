      - id: icse-10-economics-ch03-t03
        title: "Capital formation: meaning and process (saving, mobilisation of savings, investment)"
        learning_outcomes:
          - "Define capital formation"
          - "Describe the three stages of capital formation, giving the role of banks and financial institutions in mobilising savings"
      - id: icse-10-economics-ch03-t04
        title: "Need for capital formation in a developing economy like India"
        learning_outcomes:
          - "Explain how capital formation raises output, employment and technological progress"
    removed_topics: []
    literature_texts: []
  - id: icse-10-economics-ch04
