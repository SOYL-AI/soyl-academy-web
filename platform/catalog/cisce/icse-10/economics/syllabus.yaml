  - id: icse-10-economics-ch05
    number: 5
    title: "Demand"
    unit: "2. Theory of Demand and Supply"
    topics:
      - id: icse-10-economics-ch05-t01
        title: "Meaning of demand; desire, want and demand; types of demand"
        learning_outcomes:
          - "Explain the three elements of demand: desire, ability to pay and willingness to pay, at a given price and time"
          - "Distinguish types of demand such as individual and market, direct and derived, joint and composite demand with examples"
      - id: icse-10-economics-ch05-t02
        title: "Law of demand: demand schedule and demand curve (individual and market)"
        learning_outcomes:
          - "State the law of demand and its assumptions"
          - "Construct an individual and a market demand schedule and draw the corresponding demand curves"
          - "Explain why the demand curve slopes downwards"
      - id: icse-10-economics-ch05-t03
        title: "Determinants of demand"
        learning_outcomes:
          - "Explain how price of related goods, income, tastes, population and expectations affect demand"
      - id: icse-10-economics-ch05-t04
        title: "Movement along and shift of the demand curve"
        learning_outcomes:
          - "Distinguish an extension or contraction of demand from an increase or decrease in demand"
          - "Draw diagrams showing a movement along and a shift of the demand curve and name the cause of each"
      - id: icse-10-economics-ch05-t05
        title: "Exceptions to the law of demand"
        learning_outcomes:
          - "Explain exceptions such as Giffen goods, prestige goods, expectation of price change and ignorance"
