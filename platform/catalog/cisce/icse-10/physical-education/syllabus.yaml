# ICSE Class 10 Physical Education (Group III elective, code 72) - ICSE 2027 examination.
# Source: platform/catalog/sources/cisce.md#icse-2027-physical-education. Class X portion only.
# Topic wording is our own summary of the official scope. Section B: one chapter per game; candidates study any two.
subject_id: icse-10-physical-education
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-physical-education, icse-2027-regulations]
exam_notes: >-
  One written theory paper of 2 hours, 100 marks, plus internal assessment 100 marks; the external paper and internal
  assessment each carry 50% of the subject result (Group III). The paper has Section A (human growth, physical
  education, body types, fitness, sports training, safety, health education and nutrition, careers) and Section B,
  in which candidates answer questions on any two of six team games: Cricket, Football, Hockey, Basketball,
  Volleyball and Badminton. SOYL gives each game its own chapter (chapters 8-13); a student needs only the two
  games they have chosen. Internal assessment is practical: 50 marks by the teacher(s) for skill and performance in
  two games or activities of the candidate's choice, and 50 marks by an External Examiner - physical efficiency tests
  (30: 50 m run, standing long jump, 1000 m/600 m run, push-ups, sit-ups and related tests marked on CISCE
  performance tables) and a specialisation test in the chosen activity (20). Practical work is not covered as
  chapters here. The Class IX theory (body systems, games and sports) is in icse-9-physical-education.
  CISCE lists topics, not textbook chapters; SOYL groups Section A into teachable chapters in syllabus order.
  Some governing bodies and tournaments are listed as named in the CISCE document even where names have since
  changed. No section-wise marks weightage is published.
units:
  - { name: "Section A", marks: null }
  - { name: "Section B: Team Games (any two)", marks: null }
