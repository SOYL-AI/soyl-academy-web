# ICSE Class 10 Technical Drawing Applications (Group III elective, code 65) - ICSE 2027 examination.
# Source: platform/catalog/sources/cisce.md#icse-2027-technical-drawing-applications. Class X portion only.
# Topic wording is our own summary of the official scope. Drawing-based subject: chapters teach the construction
# methods and projection concepts; students practise the drawings with instruments on paper.
subject_id: icse-10-technical-drawing-applications
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-technical-drawing-applications, icse-2027-regulations]
exam_notes: >-
  One written (drawing) paper of 3 hours, 100 marks, plus internal assessment 100 marks; the external paper and
  internal assessment each carry 50% of the subject result (Group III). The paper has Section A (plane geometry,
  area constructions, templates, scales, engineering curves, solids, oblique drawing) and Section B (sections of
  solids, isometric drawing, sectional orthographic views); answers are drawn to scale with instruments.
  Internal assessment (50 subject teacher + 50 External Examiner): a file of at least 15 drawing assignments covering
  the whole Class X syllabus on half-imperial sheets, a cartridge-paper model using the development of a prism or
  pyramid, and a thermocol model showing the true shape of a section of a truncated solid. These practical items are
  not covered as chapters here. Class IX basics (lines, dimensioning, lettering, sheet layout, basic constructions,
  projections of points, lines and planes, freehand sketching) are in icse-9-technical-drawing-applications and are
  assumed. CISCE lists ten numbered topics, not textbook chapters; SOYL groups them into teachable chapters in syllabus
  order. No topic-wise marks weightage is published.
units:
  - { name: "1. Geometrical constructions based on plane geometry", marks: null }
  - { name: "2. Area constructions", marks: null }
  - { name: "3. Templates", marks: null }
  - { name: "4. Scales", marks: null }
  - { name: "5. Engineering curves", marks: null }
  - { name: "6. Solids", marks: null }
  - { name: "7. Oblique drawing", marks: null }
  - { name: "8. Sections of right solids", marks: null }
  - { name: "9. Isometric drawing", marks: null }
  - { name: "10. Sectional orthographic views", marks: null }
