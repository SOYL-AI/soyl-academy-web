# ICSE Class 10 Nepali (Second Language, code 10) - ICSE 2027 examination.
# Literature: titles and authors only (CONTEXT section 8). Students read the texts in their own textbook.
subject_id: icse-10-nepali
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-second-languages, icse-2027-prescribed-books, cisce-circular-2026-27-33-indian-languages, icse-2027-regulations]
exam_notes: >-
  One paper of 3 hours, 80 marks, plus internal assessment 20 marks (two or three assignments in Class X, at least one written
  assignment from language and one from literature; marked 10 by the subject teacher and 10 by an external examiner). Section A
  Language (40 marks, compulsory): one composition, one letter (choice of two), an unseen comprehension passage of about 250
  words, and grammar (vocabulary, syntax and idiom, sentence synthesis, sentences embodying given words or forms). Section B
  Prescribed Texts (40 marks): answer four questions from ONLY two of the four prescribed books; questions are set and answered
  in the language. Prescribed texts are bifurcated (Circular 2026-27/33): the ICSE 2027 paper is set ONLY on the Class X
  portion listed here (Class IX portion is in icse-9-nepali). Sahitya Kunj and Ekanki Kunj are published by Gamma Publication,
  Darjeeling. Devanagari spellings of some titles are SOYL renderings of the CISCE transliteration (e.g. Shrinkhala Bandhne
  Chhanharu); title_en keeps the CISCE form. CISCE describes the grammar component only generically and says it needs no
  knowledge of grammatical terms; the grammar chapters below break it into item types commonly set in ICSE papers - this
  breakdown is SOYL's, not CISCE's. CISCE lists topics not chapters; SOYL grouped them into teachable chapters in syllabus
  order. SOYL covers all four prescribed books so a student can pick any two.
units:
  - { name: "खण्ड क - भाषा (Section A: Language)", marks: 40 }
  - { name: "खण्ड ख - निर्धारित पाठ्यपुस्तकहरू (Section B: Prescribed Texts)", marks: 40 }
