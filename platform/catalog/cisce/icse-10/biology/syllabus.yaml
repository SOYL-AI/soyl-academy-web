          - "Describe the potassium permanganate diffusion demonstration and the thistle funnel and potato osmoscope experiments"
      - id: icse-10-biology-ch03-t02
        title: "Turgidity and flaccidity; plasmolysis and deplasmolysis"
        learning_outcomes:
          - "Explain turgidity, flaccidity and plasmolysis in terms of water movement across the cell membrane"
          - "Predict what happens to plant cells placed in hypotonic, isotonic and hypertonic solutions"
      - id: icse-10-biology-ch03-t03
        title: "Structure of a root hair and adaptations of roots for absorbing water"
        learning_outcomes:
          - "Draw and label a single full-grown root hair"
          - "List features of roots that make them suited for water absorption"
      - id: icse-10-biology-ch03-t04
        title: "Absorption of water and minerals; active and passive transport (in brief)"
        learning_outcomes:
