  - { name: "3. Human Anatomy and Physiology", marks: null }
  - { name: "4. Population", marks: null }
  - { name: "5. Human Evolution", marks: null }
  - { name: "6. Pollution", marks: null }
chapters:
  - id: icse-10-biology-ch01
    number: 1
    title: "Cell Cycle, Cell Division and Structure of Chromosomes"
    unit: "1. Basic Biology"
    topics:
      - id: icse-10-biology-ch01-t01
        title: "The cell cycle: interphase (G1, S, G2) and mitotic phase"
        learning_outcomes:
          - "Describe the events of the G1, S and G2 phases of interphase"
          - "Draw a labelled diagram of the cell cycle"
      - id: icse-10-biology-ch01-t02
        title: "Mitosis and its stages (prophase, metaphase, anaphase, telophase); cytokinesis in plant and animal cells"
        learning_outcomes:
          - "Identify the stage of mitosis from a diagram or slide and describe what happens to the chromosomes"
          - "Distinguish cytokinesis in plant cells (cell plate) from animal cells (furrowing)"
      - id: icse-10-biology-ch01-t03
        title: "Meiosis as a reduction division; homologous chromosomes and crossing over as a source of variation"
        learning_outcomes:
          - "Explain why meiosis halves the chromosome number and why this is necessary in gamete formation"
          - "Explain how crossing over between homologous chromosomes produces variation"
      - id: icse-10-biology-ch01-t04
        title: "Significance of mitosis and meiosis; differences between them"
        learning_outcomes:
          - "Tabulate the differences between mitosis and meiosis"
          - "State the significance of each type of division"
      - id: icse-10-biology-ch01-t05
        title: "Structure of a chromosome: chromatin, chromatids, centromere, genes and DNA"
        learning_outcomes:
          - "Draw and label a chromosome showing chromatids and centromere"
          - "Explain the relationship between DNA, genes, chromatin and chromosomes"
    removed_topics:
      - "Stages of meiosis"
    literature_texts: []
  - id: icse-10-biology-ch02
    number: 2
    title: "Genetics"
    unit: "1. Basic Biology"
    topics:
      - id: icse-10-biology-ch02-t01
        title: "Terms in genetics: gene, allele, dominant, recessive, homozygous, heterozygous, phenotype, genotype, mutation and variation"
        learning_outcomes:
          - "Define each genetic term and use it correctly in describing a cross"
      - id: icse-10-biology-ch02-t02
        title: "Mendel's experiments with garden peas; the laws of dominance, segregation and independent assortment"
        learning_outcomes:
          - "State Mendel's three laws of inheritance"
          - "Explain why Mendel chose the garden pea for his experiments"
      - id: icse-10-biology-ch02-t03
        title: "Monohybrid cross: phenotypic and genotypic ratios"
        learning_outcomes:
          - "Work out a monohybrid cross to the F2 generation using a Punnett square"
          - "Derive the 3:1 phenotypic and 1:2:1 genotypic ratios"
      - id: icse-10-biology-ch02-t04
        title: "Dihybrid cross: phenotypic ratio only"
        learning_outcomes:
          - "Work out the F2 phenotypes of a dihybrid cross and obtain the 9:3:3:1 ratio"
          - "Explain how the dihybrid cross illustrates the law of independent assortment"
      - id: icse-10-biology-ch02-t05
        title: "Sex determination in human beings"
        learning_outcomes:
          - "Explain with a cross why the father's gamete determines the sex of the child"
      - id: icse-10-biology-ch02-t06
        title: "X-linked inheritance: haemophilia and colour blindness"
        learning_outcomes:
          - "Work out crosses showing how a carrier mother can pass haemophilia or colour blindness to her sons"
          - "Explain why X-linked disorders are more common in males"
    removed_topics:
      - "Genotypic ratio of a dihybrid cross (phenotype only)"
      - "Sex-linked disorders other than X-linked haemophilia and colour blindness"
