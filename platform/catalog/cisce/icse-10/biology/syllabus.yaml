# ICSE Class 10 Biology (Science Paper 3) - ICSE 2027 examination.
# Source: platform/catalog/sources/cisce.md#icse-2027-biology (CLASS X section only). Topic wording is our own summary of the official scope.
subject_id: icse-10-biology
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-biology, icse-2027-regulations, icse-2027-specimen-papers, cisce-circular-specimen-papers-2027]
exam_notes: >-
  One theory paper of 2 hours, 80 marks, plus internal assessment of practical work 20 marks
  (10 subject teacher + 10 external examiner, graded on preparation, procedure, observation, inference and presentation).
  The 2027 specimen paper (code 523) has Section A (40 marks, compulsory; Question 1 is 15 one-mark objective items) and
  Section B (40 marks, any four of six questions); labelled diagrams are central. About 50% of marks target higher-order
  skills (apply, analyse, evaluate, create) per the October 2026 circular.
  Practical work (assessed internally): permanent slides of mitosis; diffusion with potassium permanganate; osmosis with a
  thistle funnel and a potato osmoscope; absorption by a herbaceous plant; transpiration with a bell jar, cobalt chloride paper
  and Ganong's potometer; photosynthesis experiments (light, CO2, chlorophyll, O2 release with hydrilla); identification of
  blood cells, and of the heart, kidney, urinary system, brain, eye, ear and endocrine glands from models and charts. The
  experiments also appear as topics below because the theory paper asks about them.
  CISCE publishes a topic list in six sections, not textbook chapters: SOYL groups it into 16 teachable chapters in
  syllabus order. No unit-wise marks weightage is published for ICSE Biology.
