          - "Distinguish active from passive transport of minerals"
      - id: icse-10-biology-ch03-t05
        title: "Ascent of sap: root pressure, cohesion, adhesion and transpirational pull; experiments on conduction through xylem"
        learning_outcomes:
          - "Explain how root pressure and transpirational pull, aided by cohesion and adhesion, raise water in the xylem"
          - "Describe an experiment using a coloured solution to show that water is conducted through the xylem"
