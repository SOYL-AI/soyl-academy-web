# ICSE Class 10 Environmental Science (code 82, Group II) - ICSE 2027 examination, CLASS X portion only.
# Source: platform/catalog/sources/cisce.md#icse-2027-environmental-science. Topic wording is our own summary of the official scope.
subject_id: icse-10-environmental-science
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-environmental-science, icse-2027-regulations]
exam_notes: >-
  One theory paper of 2 hours, 80 marks, plus internal assessment 20 marks (a minimum of three assignments set by the
  teacher, e.g. a 1500-word field study of human impact on the local environment or a 2000-word original study with a
  supporting functional model; marked 10 by the subject teacher and 10 by an external examiner). Group II elective;
  candidates offering Environmental Applications (Group III) may not offer Environmental Science.
  The syllabus does not print the question-paper pattern; ICSE Group II papers usually open with compulsory short-answer
  questions across the syllabus followed by a choice of structured long questions (check the latest CISCE specimen paper).
  Some items are marked "not to be tested, for knowledge and understanding only" (demographic transition, development
  framework for poverty alleviation, fossil-fuel electricity); they are kept as topics for context and listed under the
  chapter's removed_topics. The ICSE 2027 paper is set only on the Class X syllabus (Class IX portion is in
  icse-9-environmental-science). CISCE lists ten numbered topics, not textbook chapters: SOYL groups them into
  13 teachable chapters in syllabus order. No unit-wise marks weightage is published.
