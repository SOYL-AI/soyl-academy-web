chapters:
  - id: icse-10-environmental-science-ch01
    number: 1
    title: "Controlling Air Pollution"
    unit: "1. Controlling Air Pollution"
    topics:
      - id: icse-10-environmental-science-ch01-t01
        title: "Reducing pollution from domestic combustion; clean cooking fuels for rural homes"
        learning_outcomes:
          - "Explain why indoor smoke from burning wood, dung and crop waste harms health, especially of women and children"
          - "Compare biomass with cleaner fuels such as kerosene and LPG, and improved stoves, for rural cooking"
      - id: icse-10-environmental-science-ch01-t02
        title: "Technological measures against industrial air pollution: energy-efficient devices and clean technologies"
        learning_outcomes:
          - "Explain how energy-efficient devices and cleaner production processes reduce industrial emissions"
      - id: icse-10-environmental-science-ch01-t03
        title: "Meteorological controls and zoning strategy for industries"
        learning_outcomes:
          - "Explain how tall stacks and siting industries with regard to wind direction help disperse pollutants"
          - "Describe zoning as separating industrial areas from residential areas"
      - id: icse-10-environmental-science-ch01-t04
        title: "Penalties and subsidies as tools of pollution control"
        learning_outcomes:
          - "Evaluate how penalties on polluters and subsidies for clean technology change industrial behaviour"
      - id: icse-10-environmental-science-ch01-t05
        title: "Case study: the Taj Trapezium"
        learning_outcomes:
          - "Explain how industrial emissions threatened the Taj Mahal and the measures taken in the Taj Trapezium Zone"
      - id: icse-10-environmental-science-ch01-t06
        title: "Vehicle emission control through engine design: catalytic converters and four-stroke engines"
        learning_outcomes:
          - "Explain how a catalytic converter reduces harmful exhaust gases"
          - "State why four-stroke engines pollute less than two-stroke engines"
      - id: icse-10-environmental-science-ch01-t07
        title: "Clean fuels, public transport, traffic management and economic policy measures"
        learning_outcomes:
          - "Explain how CNG, better public transport and traffic management reduce vehicular pollution in cities"
          - "Suggest economic measures such as fuel taxes or congestion charges to cut vehicle use"
    removed_topics: []
    literature_texts: []
  - id: icse-10-environmental-science-ch02
    number: 2
    title: "Addressing Population"
    unit: "2. Addressing Population"
    topics:
      - id: icse-10-environmental-science-ch02-t01
        title: "Growing population and environmental degradation: UN projections for 2050, the climate link and alternative futures"
        learning_outcomes:
          - "Explain how population growth increases pressure on land, water, forests and the climate"
          - "Discuss how different choices today lead to alternative population and environmental futures"
      - id: icse-10-environmental-science-ch02-t02
        title: "Growing population in developing countries versus rising consumption in developed countries"
        learning_outcomes:
          - "Compare the environmental impact of population growth in developing countries with high per-person consumption in developed countries"
      - id: icse-10-environmental-science-ch02-t03
        title: "The demographic transition: stages and examples of developed and developing nations (for understanding)"
        learning_outcomes:
          - "Describe the stages of the demographic transition in terms of birth and death rates"
          - "Place countries such as India, China, Korea and Malaysia on the transition model"
      - id: icse-10-environmental-science-ch02-t04
        title: "Strategies for controlling population growth: family planning, health care, education and economic development"
        learning_outcomes:
          - "Explain how family planning, better health care and education help to lower birth rates"
      - id: icse-10-environmental-science-ch02-t05
        title: "Women-centred human development"
        learning_outcomes:
          - "Explain why the education and empowerment of women is central to slowing population growth"
      - id: icse-10-environmental-science-ch02-t06
        title: "Development framework for poverty alleviation: social mobilisation, agriculture, small-scale industry, human development (for understanding)"
        learning_outcomes:
          - "Describe how the four elements of the framework work together to reduce poverty"
    removed_topics:
