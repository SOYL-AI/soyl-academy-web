# ICSE Class 10 French (Modern Foreign Language, Group II, code 77) - ICSE 2027 examination.
# No textbooks or literature are prescribed for this subject.
subject_id: icse-10-french-group-2
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-mfl-group-2, icse-2027-french-group-1, icse-2027-regulations]
exam_notes: >-
  One paper of 2 hours, 80 marks, plus internal assessment 20 marks (two or three assignments in Class X - suggested oral and aural work -
  marked 10 by the subject teacher and 10 by an external examiner). All five questions are compulsory: (1) a composition of about 250 words
  from a choice of subjects or stimuli; (2) a letter of about 150 words from a choice of two subjects, layout assessed; (3) vocabulary, syntax
  and idiom - sentence synthesis and forming sentences that embody given words or forms, without grammatical terms; (4) an unseen passage of
  about 150 words with questions answered in French; (5) translation of a short passage from French into English.
  CISCE does not publish marks per question and prescribes no textbooks. The syllabus is common to Classes IX and X with no class-wise split,
  so the ICSE 2027 paper may draw on all of it. CISCE does not list grammar items for Group II; SOYL's grammar chapters condense the scope
  CISCE publishes for French in Group I - this breakdown is SOYL's, not CISCE's. A candidate taking French in Group II may not take it
  in Group I or III. CISCE lists topics not chapters; SOYL grouped them into teachable chapters in syllabus order.
units:
  - { name: "Question 1: Composition", marks: null }
  - { name: "Question 2: Letter", marks: null }
  - { name: "Question 3: Vocabulary, syntax and idiom", marks: null }
  - { name: "Question 4: Unseen passage", marks: null }
  - { name: "Question 5: Translation into English", marks: null }
chapters:
  - id: icse-10-french-group-2-ch01
    number: 1
    title: "Composition (Rédaction)"
    unit: "Question 1: Composition"
    topics:
      - id: icse-10-french-group-2-ch01-t01
        title: "Planning a short composition: ideas, outline, paragraphs and linking words"
        learning_outcomes:
          - "Draw up a short plan and write a composition of about 250 words in French with an introduction, body and conclusion"
          - "Link ideas with connectors such as d'abord, ensuite, puis, enfin, cependant"
      - id: icse-10-french-group-2-ch01-t02
        title: "Descriptions of people, places and events"
        learning_outcomes:
          - "Describe a person, place or festival with suitable adjectives that agree correctly"
      - id: icse-10-french-group-2-ch01-t03
        title: "Narratives: recounting an experience"
        learning_outcomes:
          - "Narrate a past experience in sequence using the passé composé and the imparfait correctly"
      - id: icse-10-french-group-2-ch01-t04
        title: "Short explanations and directions"
        learning_outcomes:
          - "Explain how to do something or how to reach a place, using imperatives and sequencing words"
      - id: icse-10-french-group-2-ch01-t05
        title: "Composition from a picture, object or language stimulus"
        learning_outcomes:
          - "Write a composition prompted by a picture or object, describing the scene and imagining what happened before and after"
    removed_topics: []
    literature_texts: []
  - id: icse-10-french-group-2-ch02
    number: 2
    title: "Letter writing (La lettre)"
    unit: "Question 2: Letter"
    topics:
      - id: icse-10-french-group-2-ch02-t01
        title: "Layout of a French letter: place and date, salutation, body, closing formula, signature"
        learning_outcomes:
          - "Set out a letter in the correct French layout, writing the place and date in French style (e.g. \"Paris, le 5 mars 2027\")"
      - id: icse-10-french-group-2-ch02-t02
        title: "Formal letters: request, complaint, reservation, application (Madame, Monsieur ... Veuillez agréer, Madame, Monsieur, mes salutations distinguées)"
        learning_outcomes:
          - "Write a formal letter of about 150 words using polite address and the set opening and closing formulas"
      - id: icse-10-french-group-2-ch02-t03
        title: "Informal letters to friends and family (Cher / Chère ..., Amitiés, Bises, À bientôt)"
        learning_outcomes:
          - "Write an informal letter of about 150 words (invitation, thanks, holiday news) with familiar address and closings"
      - id: icse-10-french-group-2-ch02-t04
        title: "Expanding the given suggestions into a complete letter"
        learning_outcomes:
          - "Cover every suggestion given in the question in a well-ordered letter"
          - "Choose between the two subjects offered and keep the register consistent"
    removed_topics: []
    literature_texts: []
  - id: icse-10-french-group-2-ch03
    number: 3
    title: "Grammar: articles, adjectives and pronouns"
    unit: "Question 3: Vocabulary, syntax and idiom"
    topics:
      - id: icse-10-french-group-2-ch03-t01
        title: "Articles définis, indéfinis, contractés et partitifs"
        learning_outcomes:
          - "Choose the correct article, including du/de la/des and de after a negative"
      - id: icse-10-french-group-2-ch03-t02
        title: "Adjectifs qualificatifs, possessifs et démonstratifs: agreement and position"
        learning_outcomes:
          - "Make adjectives agree and place them correctly"
      - id: icse-10-french-group-2-ch03-t03
        title: "Pronoms COD, COI, en et y"
        learning_outcomes:
          - "Replace nouns with the right object pronoun and place it before the verb"
      - id: icse-10-french-group-2-ch03-t04
        title: "Pronoms relatifs qui, que, où"
        learning_outcomes:
          - "Join two sentences with qui, que or où"
    removed_topics:
