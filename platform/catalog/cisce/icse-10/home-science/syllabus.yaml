# ICSE Class 10 Home Science (code 68, Group III) - ICSE 2027 examination, CLASS X portion only.
# Source: platform/catalog/sources/cisce.md#icse-2027-home-science. Topic wording is our own summary of the official scope.
# Theory-only file: practical work is described in exam_notes, not as chapters.
subject_id: icse-10-home-science
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-home-science, icse-2027-regulations]
exam_notes: >-
  Home Science (68) is a Group III subject: the external written paper and the internal assessment each carry 50% of the
  subject result. Part I: one written paper of 2 hours, 100 marks, set only on the Class X syllabus (Class IX portion is
  not examined in ICSE 2027). Part II: internal assessment 100 marks, at least five practical-oriented assignments in
  Class X across Foods and Nutrition (identifying cereals, pulses and spices, cooking methods, cuts of vegetables, food
  preservation such as chutneys, pickles and jam, table layouts), Human Development (evaluating play materials,
  observing children), Textiles and Clothing (fabric comparison, burning test for fibres, laundering, planning interiors),
  Resource Management (recycling, compost pits, laboratory layout, cleaning surfaces and appliances, family budget) and
  Communication and Extension (awareness leaflets, posters, street plays), assessed continuously or by periodic tests,
  plus a final test by the external examiner; marked 50 by the subject teacher and 50 by the external examiner.
  SOYL covers the written-paper theory only.
  CISCE lists numbered topics, not textbook chapters: SOYL groups them into 11 teachable chapters in syllabus order.
  No unit-wise marks weightage is published.
