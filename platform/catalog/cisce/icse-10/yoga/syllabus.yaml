# ICSE Class 10 Yoga (Group III elective, code 84) - ICSE 2027 examination.
# Source: platform/catalog/sources/cisce.md#icse-2027-yoga. Class X portion only. Topic wording is our own summary of the official scope.
subject_id: icse-10-yoga
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-yoga, icse-2027-regulations]
exam_notes: >-
  Paper 1 (theory): one written paper of 2 hours, 100 marks, in four sections - Human Biology, Sages of India,
  the Yoga Sutras of Patanjali, and Schools of Philosophy with five important sutras. Paper 2 (internal assessment):
  100 marks; the external paper and internal assessment each carry 50% of the subject result (Group III).
  Internal assessment: Section A course work 40 marks (continuous assessment of practice, assisting yoga therapy
  sessions, participation in programmes) and Section B practical tests 60 marks by an External Examiner - six
  predetermined asanas (30), four or five asanas of the examiner's choice from the Class X list (20) and two asanas of
  the candidate's choice (10). The Class X practical list has 19 asanas (e.g. Ardha Chandrasana, Parivritta
  Trikonasana, Chaturanga Dandasana, Paschimottanasana, Urdhva Dhanurasana, Ardha Matsyendrasana, Salamba Shirshasana
  and Sarvangasana, Halasana, Setu Bandha Sarvangasana) and pranayama (revision of the full yogic breath, Bhramari);
  reference book Light on Yoga (B.K.S. Iyengar). Asana and pranayama practice is not covered as chapters here.
  CISCE lists topics in four sections, not textbook chapters; SOYL groups them into teachable chapters in syllabus
  order. No section-wise marks weightage is published.
