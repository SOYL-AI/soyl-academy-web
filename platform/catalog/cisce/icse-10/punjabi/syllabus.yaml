      - id: icse-10-punjabi-ch04-t02
        title: "Synonyms and antonyms"
        learning_outcomes:
          - "Give appropriate synonyms and antonyms of commonly used words"
      - id: icse-10-punjabi-ch04-t03
        title: "One word for a group of words"
        learning_outcomes:
          - "Replace a phrase with a single suitable word and use it in a sentence"
      - id: icse-10-punjabi-ch04-t04
        title: "Words that sound or look alike but differ in meaning; correct spelling"
        learning_outcomes:
          - "Distinguish between commonly confused words by using each in a sentence"
          - "Correct misspelt words"
    removed_topics:
      - "Knowledge of grammatical terms as such (CISCE: the grammar question does not require it)"
    literature_texts: []
