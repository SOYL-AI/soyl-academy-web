# ICSE Class 10 Art (Group III elective, code 60) - ICSE 2027 examination.
# Source: platform/catalog/sources/cisce.md#icse-2027-art. The syllabus is common to Classes IX and X (no class split).
# Theory-only coverage: every paper is practical, so chapters teach the knowledge and technique each paper needs.
# Topic wording is our own summary of the official scope.
subject_id: icse-10-art
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-art, icse-2027-regulations]
exam_notes: >-
  Part 1 external examination (50% of the subject result, Group III): four practical papers of 3 hours and 100 marks
  each, of which the candidate offers any TWO - Paper 1 Drawing and/or Painting from Still Life; Paper 2 Drawing
  and/or Painting from Nature (A: study of the structure of natural forms, or B: outdoor study); Paper 3 Original
  Imaginative Composition in Colour (list of subjects issued at least 7 days before; no sketches or notes may be taken
  into the room); Paper 4 Applied Art (one question: book page/cover/end paper, notice or pictorial poster, card or
  emblem, or patterned paper). Exam rules - any medium suited to the subject; painted work in a quick-drying medium;
  acrylic must be mixed with water; crayons or chalk must be fixed; monochrome does not satisfy the colour requirement
  of Paper 3; no measuring or ruling in Papers 1-3 (instruments and tracing allowed but discouraged in Paper 4);
  paper about 35 cm x 25 cm (own paper up to Half-Imperial/Royal 65 cm x 50 cm), work must fill the page, no
  mounting; name on the front top right-hand corner and on the back only.
  Part 2 internal assessment, 100 marks (50 subject teacher + 50 External Examiner): course work (sketching, painting
  and practical work such as pottery, sculpture, carving, relief panels, block printing, batik, tie and dye, wood/lino
  printing, creative photography, cartoon and portrait drawing, animation) plus four finished artworks, graded on
  imaginative expression, quality of pattern, line and materials, skill with tools and materials, and use of colour.
  All drawing and painting is practical work and is not taught as chapters here; SOYL covers the theory and
  technique knowledge (media, composition, colour, tone, perspective, lettering and design) the four papers draw on.
  CISCE describes papers, not chapters: SOYL groups the required knowledge into teachable chapters, foundations
  first and then paper by paper in syllabus order. No marks weightage beyond 100 per paper is published.
units:
  - { name: "Foundations: media, elements and principles of art", marks: null }
  - { name: "Paper 1: Drawing and/or Painting from Still Life", marks: 100 }
  - { name: "Paper 2: Drawing and/or Painting from Nature", marks: 100 }
  - { name: "Paper 3: Original Imaginative Composition in Colour", marks: 100 }
  - { name: "Paper 4: Applied Art", marks: 100 }
chapters:
  - id: icse-10-art-ch01
    number: 1
    title: "Art Materials, Media and Tools"
    unit: "Foundations: media, elements and principles of art"
    topics:
      - id: icse-10-art-ch01-t01
        title: "Dry media: graded pencils (H to B), charcoal, coloured crayons, pastels and chalk; fixing dry work"
        learning_outcomes:
          - "Select a pencil grade suited to light construction lines versus dark tonal areas"
          - "Explain why crayon and chalk work must be fixed before it is sent to the examiner"
      - id: icse-10-art-ch01-t02
        title: "Wet media: watercolour, poster colour and acrylic diluted with water; why exam work must be quick-drying"
        learning_outcomes:
          - "Compare transparent watercolour with opaque poster colour in coverage and layering"
          - "State the exam rules for acrylic paint and for drying painted work before dispatch"
      - id: icse-10-art-ch01-t03
        title: "Brushes, palettes, inks and pens; care and handling of tools"
        learning_outcomes:
          - "Match round and flat brushes of different sizes to washes, details and edges"
          - "Describe good practice for cleaning and storing brushes and pens"
      - id: icse-10-art-ch01-t04
        title: "Paper and format: sizes allowed (about 35 cm x 25 cm up to Half-Imperial/Royal), choosing size and proportion of height to width"
        learning_outcomes:
          - "Decide between portrait and landscape format for a given subject and justify the choice"
          - "Plan a drawing that fills or approximately fills the sheet"
      - id: icse-10-art-ch01-t05
        title: "Monochrome versus full colour; choosing a medium suitable for the subject"
        learning_outcomes:
          - "Identify which papers accept monochrome work and why Paper 3 requires colour"
          - "Choose an appropriate medium for a still life, an outdoor study and a poster"
