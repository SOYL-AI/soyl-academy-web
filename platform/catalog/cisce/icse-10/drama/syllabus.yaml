# ICSE Class 10 Performing Arts: Drama (Group III elective, code 95) - ICSE 2027 examination.
# Source: platform/catalog/sources/cisce.md#icse-2027-performing-arts. The syllabus is common to Classes IX and X.
# Theory paper only. Literature: no texts are prescribed; the plays named are example sources of extracts (titles and authors only).
# Topic wording is our own summary of the official scope.
subject_id: icse-10-drama
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-performing-arts, icse-2027-regulations]
exam_notes: >-
  Part 1 Theory: one paper of 2 hours, 100 marks, in two sections - A Drama as Art, B Technical Aspects of Drama.
  Questions give resource material (extracts from plays, themes, situations or printed visual sequences) as stimuli;
  answers are written commentaries that may include sketches, diagrams and notes, and candidates may add dialogue
  creatively. Section B questions use resource material as a basis for technical design.
  Part 2: internal assessment of practical work, 100 marks (50 subject teacher + 50 External Examiner); the external
  paper and internal assessment each carry 50% of the subject result (Group III). Practical work has two parts -
  Acting (an original piece or an extract from a play, assessed as course work; video evidence may be submitted)
  and Stagecraft (one area chosen from costumes, make-up, stage design including sets, lighting or sound, presented
  as designs for a play developed during the year) - graded on regularity, make-up, acting, dialogue and emotional
  appeal. Performance and stagecraft execution are not taught as chapters here.
  The syllabus is printed for Classes IX and X together with no class split, so all of it is examined in ICSE 2027.
  CISCE lists elements to be appreciated, not chapters: SOYL groups them into teachable chapters in syllabus order.
  No section-wise marks weightage is published.
units:
  - { name: "Section A: Drama as Art", marks: null }
  - { name: "Section B: Technical Aspects of Drama", marks: null }
