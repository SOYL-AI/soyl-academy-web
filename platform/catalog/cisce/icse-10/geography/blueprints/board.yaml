notes: >-
  ICSE 2027 History, Civics and Geography (50) Paper 2, specimen paper code 502: one theory paper of two hours (plus 15 minutes reading
  time), 80 marks; internal assessment 20 marks is not modelled. Part I (30, compulsory): Q1 topographical sheet 10 x 1 (a 10-mark
  case item on map-work chapters 1-3), Q2 outline map of India 10 (chapters 4-5), Q3 10 x 1 objective items on the Geography of India.
  Part II (50): any five of nine 10-mark questions, one per topic of the Geography of India (climate, soils, vegetation, water,
  minerals and energy, agriculture, industries, transport, waste). Unit weightage follows from this layout: Map Work 20, Geography of
  India 60 (syllabus units). The board supplies a real Survey of India sheet; SOYL uses its own drawn extracts (CONTEXT section 8).
  mark_shares 0.5 / 0.5: the October 2026 circular (cisce-circular-specimen-papers-2027) gives higher-order questions an approximate
  weightage of 50% in 2027.
  Deviation: one chapter per question in the item model, so a Part II question's four parts come from one chapter.
