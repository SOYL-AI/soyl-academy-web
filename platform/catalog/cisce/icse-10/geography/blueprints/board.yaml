sections:
  - id: I-TOPO
    title: Part I Question 1 - Topographical map (10 marks, compulsory)
    instructions: >-
      Five pairs of 1-mark sub-questions on the given extract of a Survey of India topographical sheet: grid references, heights and
      contours, distance and area from the scale, direction, conventional symbols, drainage patterns, settlements, land use and the
      reasons behind them. SOYL supplies its own original map extract as the stimulus.
    chapters: [icse-10-geography-ch01, icse-10-geography-ch02, icse-10-geography-ch03]
    items:
      - {type: case-based, count: 1, marks_each: 10}
  - id: I-MAP
    title: Part I Question 2 - Outline map of India (10 marks, compulsory)
    instructions: Mark and name six features and identify four marked features on the outline map of India provided.
    chapters: [icse-10-geography-ch04, icse-10-geography-ch05]
    items:
      - {type: map, count: 1, marks_each: 10}
  - id: I-OBJ
    title: Part I Question 3 - Objective (10 marks, compulsory)
    instructions: Ten 1-mark multiple-choice items on the Geography of India (one assertion-reason); write the correct answers only.
    chapters: [icse-10-geography-ch06, icse-10-geography-ch07, icse-10-geography-ch08, icse-10-geography-ch09, icse-10-geography-ch10, icse-10-geography-ch11, icse-10-geography-ch12, icse-10-geography-ch13, icse-10-geography-ch14, icse-10-geography-ch15, icse-10-geography-ch16, icse-10-geography-ch17, icse-10-geography-ch18]
    items:
      - {type: mcq, count: 9, marks_each: 1}
      - {type: assertion-reason, count: 1, marks_each: 1}
  - id: II
    title: Part II - Any five of nine (50 marks)
    instructions: >-
      Attempt any five of Questions 4-12, 10 marks each, in four parts (2 + 2 + 3 + 3 marks): reasons, climatic data, pictures, sketches
      and short explanations.
    chapters: [icse-10-geography-ch06, icse-10-geography-ch07, icse-10-geography-ch08, icse-10-geography-ch09, icse-10-geography-ch10, icse-10-geography-ch11, icse-10-geography-ch12, icse-10-geography-ch13, icse-10-geography-ch14, icse-10-geography-ch15, icse-10-geography-ch16, icse-10-geography-ch17, icse-10-geography-ch18]
