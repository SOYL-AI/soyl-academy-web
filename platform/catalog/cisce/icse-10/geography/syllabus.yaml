# ICSE Class 10 Geography (H.C.G. Paper 2, code 50) - ICSE 2027 examination, CLASS X portion only.
# Source: platform/catalog/sources/cisce.md#icse-2027-geography. Topic wording is our own summary of the official scope.
subject_id: icse-10-geography
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-geography, icse-2027-regulations, icse-2027-specimen-papers, cisce-circular-specimen-papers-2027]
exam_notes: >-
  History, Civics and Geography (50) is examined as two papers; this is Paper 2 (2027 specimen paper code 502).
  One theory paper of 2 hours, 80 marks, plus internal assessment 20 marks (one project report, e.g. local land use,
  transport or a visit to a water/sewage treatment or composting site; 10 marks subject teacher + 10 external examiner).
  Part I Map Work is compulsory: interpretation of a Survey of India topographical sheet and an outline map of India
  (6 features to mark and 4 to identify). The 2027 specimen paper has Part I (30 marks, compulsory: topographical sheet 10,
  map of India 10, ten 1-mark objective items on the Geography of India) and Part II (50 marks: any five of nine 10-mark
  questions on the Geography of India). Answers are expected to use sketches, diagrams, graphs and charts, and
  questions may require interpreting photographs. About 50% of marks target higher-order skills per the October 2026 circular.
  Map reading is an examined written skill, so it is taught here as chapters (chapters 1-5), not as practical work.
  The ICSE 2027 paper is set only on the Class X syllabus (Class IX Principles of Geography is in icse-9-geography).
  CISCE lists numbered topics, not textbook chapters: SOYL groups them into 18 teachable chapters in syllabus order.
  No marks weightage per part is published in the syllabus; the unit marks below follow from the specimen layout (map work:
  Questions 1 and 2, 20 marks; Geography of India: Question 3 and Part II, 60 marks).
units:
  - { name: "Part I: Map Work", marks: 20 }
  - { name: "Part II: Geography of India", marks: 60 }
