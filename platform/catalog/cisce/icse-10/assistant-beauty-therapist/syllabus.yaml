# ICSE Class 10 Assistant Beauty Therapist (code 59, Group III Section B vocational) - ICSE 2027 examination.
# Source: platform/catalog/sources/cisce.md#icse-2027-vocational-beauty-therapist (Class X portion). Topic wording is our own summary.
subject_id: icse-10-assistant-beauty-therapist
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-vocational-beauty-therapist, icse-2027-specimen-papers, icse-2027-regulations]
exam_notes: >-
  One written paper of 2 hours, 100 marks: Part I-A Employability Skills 30 marks (Units 1-5) and Part I-B Vocational
  Skills 70 marks (Units 6-9); no further unit-wise weightage is published. Internal assessment of practical work 100 marks,
  marked 50 by the subject teacher and 50 by an external examiner nominated by the Head of School: Practical Work 70
  (practical examination 40 - any two practicals from different units chosen by the external examiner; practical file 10;
  viva voce 20) and Project Work 30 (field visit or project report 10, student portfolio 10, viva voce 10).
  The syllabus pairs each theory list with practical activities (demonstrations, role plays, charts, field visits); these
  are assessed internally and are not listed as chapters here. The document has separate Class IX and Class X unit lists:
  this file covers the Class X list only, which is the content of the Class X written paper.
  The 2027 specimen paper (code 591) has Section A (40 marks, all questions compulsory) and Section B (60 marks,
  any four of six questions).
  CISCE lists learning outcomes unit by unit, not textbook chapters: SOYL groups them into 10 teachable chapters in
  syllabus order (chapters 1-5 = Units 1-5; Unit 6 = chapter 6; Unit 7 = chapters 7-8; Unit 8 = chapter 9; Unit 9 = chapter 10).
units:
  - { name: "Part I-A: Employability Skills", marks: 30 }
  - { name: "Part I-B: Vocational Skills", marks: 70 }
chapters:
  - id: icse-10-assistant-beauty-therapist-ch01
    number: 1
    title: "Communication Skills - II"
    unit: "Part I-A: Employability Skills"
    topics:
      - id: icse-10-assistant-beauty-therapist-ch01-t01
        title: "Methods of communication: verbal, non-verbal and visual"
        learning_outcomes:
          - "Compare verbal, non-verbal and visual communication with one workplace example of each"
          - "List the advantages and limitations of written, spoken and non-verbal messages"
          - "Identify common body-language mistakes and suggest how to avoid them"
      - id: icse-10-assistant-beauty-therapist-ch01-t02
        title: "Communication cycle and feedback: meaning and importance; descriptive feedback; specific and non-specific feedback"
        learning_outcomes:
          - "Explain the role of feedback in completing the communication cycle"
          - "Distinguish specific from non-specific feedback using examples"
          - "Write descriptive, specific feedback on a given piece of work"
      - id: icse-10-assistant-beauty-therapist-ch01-t03
        title: "Barriers to effective communication: types, causes and measures to overcome them"
        learning_outcomes:
          - "Classify barriers to communication (physical, linguistic, emotional, cultural, organisational) in a given situation"
          - "Suggest suitable measures to overcome each barrier identified"
      - id: icse-10-assistant-beauty-therapist-ch01-t04
        title: "Principles of effective communication and the 7Cs"
        learning_outcomes:
          - "State the 7Cs of effective communication (clear, concise, concrete, correct, coherent, complete, courteous)"
          - "Rewrite a poorly worded message so that it satisfies the 7Cs"
      - id: icse-10-assistant-beauty-therapist-ch01-t05
        title: "Basic writing skills: sentence, phrase, kinds and parts of a sentence, parts of speech, articles and paragraph construction"
        learning_outcomes:
          - "Identify the kind of a sentence and its subject and predicate"
          - "Use parts of speech and articles correctly in sentences"
          - "Write a well-organised paragraph on a topic related to the job role"
    removed_topics: []
    literature_texts: []
