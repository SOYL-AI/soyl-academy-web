      - id: icse-10-kashmiri-ch02-t02
        title: "Formal letters to a principal, editor or official (application, complaint, request)"
        learning_outcomes:
          - "State a problem briefly and politely and make a suitable request or suggestion"
      - id: icse-10-kashmiri-ch02-t03
        title: "Informal letters to friends and relatives"
        learning_outcomes:
          - "Use an apt salutation, a warm personal tone and a suitable closing in an informal letter in Kashmiri"
      - id: icse-10-kashmiri-ch02-t04
        title: "Developing a letter from the suggestions given in the question"
        learning_outcomes:
          - "Include every suggested point in a well-connected letter of appropriate length"
    removed_topics: []
    literature_texts: []
