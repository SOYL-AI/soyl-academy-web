# ICSE Class 10 Performing Arts: Carnatic Music (Group III elective, code 92) - ICSE 2027 examination.
# Source: platform/catalog/sources/cisce.md#icse-2027-performing-arts. Class X portion only; written paper only.
# Topic wording is our own summary of the official scope.
subject_id: icse-10-carnatic-music
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-performing-arts, icse-2027-regulations]
exam_notes: >-
  Part 1: one written paper of 2 hours, 100 marks. Part 2: internal assessment of practical work in Carnatic music,
  100 marks (50 subject teacher + 50 External Examiner), assessed in Class X; the external paper and internal
  assessment each carry 50% of the subject result (Group III). Practical work - singing or playing one or more
  instruments, individual and group performance, practice for school functions or making a musical instrument, plus a
  test by the External Examiner in singing or playing one instrument - is assessed on purity of swara, laya,
  knowledge of raga/tala, recall of concepts and overall presentation; it is not taught as chapters here.
  The Class X theory has three numbered items: history of Carnatic music through twelve composers and theorists;
  musical instruments and the voice; musical sound and acoustics. The Class IX theory (technical terms, notation
  symbols, the 72-melakarta scheme and katapayadi formula, janya ragas, lakshanas of 16 ragas, manodharma sangita and
  gamakas, the 35-tala scheme, and musical forms such as gita, varnam, kriti, ragamalika, padam and javali) is in
  icse-9-carnatic-music and is assumed background.
  CISCE lists topics, not chapters: SOYL groups them into teachable chapters in syllabus order (composers in the
  order CISCE lists them, grouped by period). No marks weightage by item is published.
units:
  - { name: "1. History of Carnatic Music: Composers and Theorists", marks: null }
  - { name: "2. Musical Instruments and the Voice", marks: null }
  - { name: "3. Musical Sound and Voice", marks: null }
chapters:
  - id: icse-10-carnatic-music-ch01
    number: 1
    title: "The Trinity of Carnatic Music"
    unit: "1. History of Carnatic Music: Composers and Theorists"
    topics:
      - id: icse-10-carnatic-music-ch01-t01
        title: "Outline history of Carnatic music and why the Trinity period is called its golden age"
        learning_outcomes:
          - "Place the composers in this syllabus on a timeline of Carnatic music history"
          - "Explain why the late eighteenth and early nineteenth centuries are seen as a golden age"
      - id: icse-10-carnatic-music-ch01-t02
        title: "Thyagaraja: life, devotion to Rama, Telugu kritis, Pancharatna kritis, musical plays, use of sangatis"
        learning_outcomes:
          - "Write a short biography of Thyagaraja"
          - "Describe his contribution to the kriti form, including sangatis and group kritis"
      - id: icse-10-carnatic-music-ch01-t03
        title: "Syama Sastry: life, devotion to Kamakshi, swarajatis, mudra and rhythmic mastery"
        learning_outcomes:
          - "Write a short biography of Syama Sastry and state his mudra"
          - "Explain his contribution to the swarajati and to complex tala usage"
      - id: icse-10-carnatic-music-ch01-t04
        title: "Muthuswami Dikshitar: life, Sanskrit kritis, group kritis (Navagraha, Navavarna), mudra and vilamba kala style"
        learning_outcomes:
          - "Write a short biography of Muthuswami Dikshitar and state his mudra"
          - "Describe his group kritis and characteristic style"
      - id: icse-10-carnatic-music-ch01-t05
        title: "Comparing the Trinity: language, deity, style, tempo and favourite forms"
        learning_outcomes:
          - "Compare the three composers in a table under language, mudra, style and main compositions"
