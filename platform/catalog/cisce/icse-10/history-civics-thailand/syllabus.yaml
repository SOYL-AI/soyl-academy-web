chapters:
  - id: icse-10-history-civics-thailand-ch01
    number: 1
    title: "The National Assembly: Structure and Parliamentary Procedures"
    unit: "Civics 1: The Legislature"
    topics:
      - id: icse-10-history-civics-thailand-ch01-t01
        title: "The set-up of government in Thailand (the syllabus's 'federal set-up'): central government, provinces and local administration"
        learning_outcomes:
          - "Explain how power is shared between the central government in Bangkok, the provinces and local self-government bodies"
          - "Distinguish a federal from a unitary arrangement and decide which better describes Thailand"
      - id: icse-10-history-civics-thailand-ch01-t02
        title: "The National Assembly: composition of the House of Representatives and the Senate"
        learning_outcomes:
          - "Describe the bicameral National Assembly and how members of each House come to office"
      - id: icse-10-history-civics-thailand-ch01-t03
        title: "Qualifications for membership, election, term and the Presiding Officer of the National Assembly"
        learning_outcomes:
          - "State the main qualifications and term of members of each House"
          - "Identify who presides over the National Assembly and over each House"
      - id: icse-10-history-civics-thailand-ch01-t04
        title: "The Speaker: election and functions"
        learning_outcomes:
          - "Describe how the Speaker of the House of Representatives is elected"
          - "Explain the Speaker's role in conducting proceedings and maintaining order"
      - id: icse-10-history-civics-thailand-ch01-t05
        title: "Parliamentary procedures: sessions, quorum and casting vote"
        learning_outcomes:
          - "Explain the meaning of a session, quorum and casting vote"
      - id: icse-10-history-civics-thailand-ch01-t06
        title: "Interpellation and the no-confidence motion"
        learning_outcomes:
          - "Explain how interpellation allows members to question ministers"
          - "Describe the purpose and consequence of a successful no-confidence motion against the government"
