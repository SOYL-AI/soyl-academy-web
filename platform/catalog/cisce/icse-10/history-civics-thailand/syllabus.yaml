# ICSE Class 10 History & Civics (Thailand) (H.C.G. Thailand Paper 1, code 58) - ICSE 2027 examination, CLASS X portion only.
# Source: platform/catalog/sources/cisce.md#icse-2027-history-civics-thailand. Topic wording is our own summary of the official scope.
subject_id: icse-10-history-civics-thailand
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-history-civics-thailand, icse-2027-regulations]
exam_notes: >-
  History, Civics and Geography (Thailand) (58) is a Group I subject offered only to candidates from CISCE-affiliated
  schools in Thailand, in place of History, Civics and Geography (50); it is examined as two papers and this is Paper 1.
  One theory paper of 2 hours, 80 marks, plus internal assessment 20 marks (one project/assignment on the syllabus, such as
  a mock court, a life sketch of a Thai monarch or a report on a UN agency; marked 10 by the subject teacher and 10 by an
  external examiner). The paper has Section A: Civics and Section B: History; the syllabus does not print the detailed
  question pattern (the Indian H.C.G. paper opens with compulsory short-answer questions followed by a choice of structured
  long questions in each section). The ICSE 2027 paper is set only on the Class X syllabus (Class IX portion is in
  icse-9-history-civics-thailand). CISCE lists numbered topics, not textbook chapters: SOYL groups them into 14 teachable
  chapters in syllabus order. Where the syllabus wording uses terms borrowed from the Indian paper (for example a
  "federal set-up" or the Supreme Court's advisory jurisdiction), topics follow the syllabus wording and outcomes ask
  learners to relate it to Thailand's actual institutions. No unit-wise marks weightage is published.
