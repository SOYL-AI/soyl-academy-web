# ICSE Class 10 Tenyidie (Second Language, code 41) - ICSE 2027 examination.
# Literature: titles and authors only (CONTEXT section 8). Students read the texts in their own textbook.
subject_id: icse-10-tenyidie
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-second-languages, icse-2027-prescribed-books, icse-2027-regulations]
exam_notes: >-
  One paper of 3 hours, 80 marks, plus internal assessment 20 marks (two or three assignments in Class X, at least one written
  assignment from language and one from literature; suggested oral work, creative writing and literature assignments; marked 10
  by the subject teacher and 10 by an external examiner). Section A Language (40 marks, compulsory): one composition, one
  letter (choice of two), an unseen comprehension passage of about 250 words, and grammar (vocabulary, syntax and idiom,
  sentence synthesis, sentences embodying given words or forms). Section B Prescribed Texts (40 marks): answer four questions
  from ONLY two of the prescribed books; questions are set and answered in the language. Tenyidie appears in the ICSE 2027
  Regulations and in Appendix I but not in the list of languages in the Second Languages syllabus; SOYL applies the common
  Indian-language paper pattern above. The Tenyidie syllabus is NOT bifurcated: the whole Classes IX-X list is examined. Three
  books are prescribed (Neteya; Noudo Dze; Uca-53), of which candidates offer two; SOYL covers all three. CISCE does not list
  the lessons inside these books, so SOYL topics are skill-based; add lesson titles in language review. CISCE describes the
  grammar component only generically and says it needs no knowledge of grammatical terms; the split into two grammar chapters
  is SOYL's, not CISCE's. Titles are in English / CISCE transliteration; native-script titles to be added in language review.
  CISCE lists topics not chapters; SOYL grouped them into teachable chapters in syllabus order.
units:
  - { name: "Section A: Language", marks: 40 }
  - { name: "Section B: Prescribed Texts", marks: 40 }
chapters:
  - id: icse-10-tenyidie-ch01
    number: 1
    title: "Composition writing in Tenyidie"
    unit: "Section A: Language"
    topics:
      - id: icse-10-tenyidie-ch01-t01
        title: "Planning a composition: choosing a topic, outline, introduction, body and conclusion"
        learning_outcomes:
          - "Prepare an outline and write a well-organised composition of about 250-300 words in Tenyidie"
          - "Link paragraphs in a logical order using suitable connecting words"
      - id: icse-10-tenyidie-ch01-t02
        title: "Descriptive and narrative compositions"
        learning_outcomes:
          - "Describe a place, person, event or experience vividly"
          - "Narrate a sequence of events with a clear beginning, middle and end"
      - id: icse-10-tenyidie-ch01-t03
        title: "Short explanations, directions and reflective or argumentative essays"
        learning_outcomes:
          - "Explain a process or give clear step-by-step directions"
          - "Present points for and against a social issue and reach a reasoned conclusion"
      - id: icse-10-tenyidie-ch01-t04
        title: "Composition from a picture, object or other stimulus (opening line, proverb)"
        learning_outcomes:
          - "Write an original story or essay suggested by a picture, object or given opening line"
      - id: icse-10-tenyidie-ch01-t05
        title: "Accuracy: spelling, punctuation and apt choice of words"
        learning_outcomes:
          - "Identify and correct spelling, punctuation and word-choice errors in their own Tenyidie writing"
    removed_topics: []
    literature_texts: []
