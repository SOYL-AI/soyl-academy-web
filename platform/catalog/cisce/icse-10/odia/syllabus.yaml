# ICSE Class 10 Odia (Second Language, code 11) - ICSE 2027 examination.
# Literature: titles and authors only (CONTEXT section 8). Students read the texts in their own textbook.
subject_id: icse-10-odia
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-second-languages, icse-2027-prescribed-books, cisce-circular-2026-27-33-indian-languages, icse-2027-regulations]
exam_notes: >-
  One paper of 3 hours, 80 marks, plus internal assessment 20 marks (two or three assignments in Class X, at least one written
  assignment from language and one from literature; suggested oral work, creative writing and literature assignments; marked 10
  by the subject teacher and 10 by an external examiner). Section A Language (40 marks, compulsory): one composition, one
  letter (choice of two), an unseen comprehension passage of about 250 words, and grammar (vocabulary, syntax and idiom,
  sentence synthesis, sentences embodying given words or forms). Section B Prescribed Texts (40 marks): answer four questions
  from ONLY two of the prescribed books; questions are set and answered in the language. Prescribed texts are bifurcated
  (Circular 2026-27/33): the ICSE 2027 paper is set ONLY on the Class X portion listed here (Class IX portion is in
  icse-9-odia). SOYL covers every prescribed book so a student can pick any two. CISCE describes the grammar component only
  generically and says it needs no knowledge of grammatical terms; the split into two grammar chapters is SOYL's, not CISCE's.
  Titles are in English / CISCE transliteration; native-script titles to be added in language review. CISCE lists topics not
  chapters; SOYL grouped them into teachable chapters in syllabus order.
units:
  - { name: "Section A: Language", marks: 40 }
  - { name: "Section B: Prescribed Texts", marks: 40 }
chapters:
  - id: icse-10-odia-ch01
    number: 1
    title: "Composition writing in Odia"
    unit: "Section A: Language"
    topics:
      - id: icse-10-odia-ch01-t01
        title: "Planning a composition: choosing a topic, outline, introduction, body and conclusion"
        learning_outcomes:
          - "Prepare an outline and write a well-organised composition of about 250-300 words in Odia"
          - "Link paragraphs in a logical order using suitable connecting words"
      - id: icse-10-odia-ch01-t02
        title: "Descriptive and narrative compositions"
        learning_outcomes:
          - "Describe a place, person, event or experience vividly"
          - "Narrate a sequence of events with a clear beginning, middle and end"
      - id: icse-10-odia-ch01-t03
        title: "Short explanations, directions and reflective or argumentative essays"
        learning_outcomes:
          - "Explain a process or give clear step-by-step directions"
          - "Present points for and against a social issue and reach a reasoned conclusion"
      - id: icse-10-odia-ch01-t04
        title: "Composition from a picture, object or other stimulus (opening line, proverb)"
        learning_outcomes:
          - "Write an original story or essay suggested by a picture, object or given opening line"
      - id: icse-10-odia-ch01-t05
        title: "Accuracy: spelling, punctuation and apt choice of words"
        learning_outcomes:
          - "Identify and correct spelling, punctuation and word-choice errors in their own Odia writing"
    removed_topics: []
    literature_texts: []
  - id: icse-10-odia-ch02
    number: 2
    title: "Letter writing"
    unit: "Section A: Language"
    topics:
      - id: icse-10-odia-ch02-t01
        title: "Layout of a formal letter: sender's address, date, addressee, subject, salutation, body and closing"
        learning_outcomes:
          - "Set out a formal letter in Odia with all its parts in the correct order and format"
      - id: icse-10-odia-ch02-t02
        title: "Formal letters to a principal, editor or official: application, request, complaint, suggestion"
        learning_outcomes:
          - "State a problem politely and concisely and make a clear, reasonable request"
      - id: icse-10-odia-ch02-t03
        title: "Informal letters to friends, parents and relatives"
        learning_outcomes:
          - "Use a suitable form of address, a warm personal tone and an appropriate closing in an informal letter"
      - id: icse-10-odia-ch02-t04
        title: "Developing a letter from the suggestions given in the question"
        learning_outcomes:
          - "Include every point suggested in the question in a coherent, well-paragraphed letter"
    removed_topics: []
    literature_texts: []
  - id: icse-10-odia-ch03
    number: 3
    title: "Unseen passage (comprehension)"
    unit: "Section A: Language"
    topics:
      - id: icse-10-odia-ch03-t01
        title: "Reading strategy: finding the main idea and supporting details"
        learning_outcomes:
          - "State the central idea of an unseen Odia passage of about 250 words in one or two sentences"
      - id: icse-10-odia-ch03-t02
        title: "Answering factual and inferential questions in their own words"
        learning_outcomes:
          - "Answer factual questions in their own words without copying lines from the passage"
          - "Infer causes, consequences and the writer's attitude from the passage"
      - id: icse-10-odia-ch03-t03
        title: "Word meanings from context, a suitable title and the message"
        learning_outcomes:
          - "Work out the meaning of unfamiliar words and phrases from the context"
          - "Suggest a suitable title for the passage and justify it"
    removed_topics: []
    literature_texts: []
  - id: icse-10-odia-ch04
    number: 4
    title: "Grammar: vocabulary and word formation"
    unit: "Section A: Language"
    topics:
      - id: icse-10-odia-ch04-t01
        title: "Forming nouns, adjectives and other word forms from given words"
        learning_outcomes:
          - "Form the required noun, adjective or verb from a given Odia word"
      - id: icse-10-odia-ch04-t02
        title: "Synonyms and antonyms"
        learning_outcomes:
          - "Give appropriate synonyms and antonyms of commonly used words"
      - id: icse-10-odia-ch04-t03
        title: "One word for a group of words"
        learning_outcomes:
          - "Replace a phrase with a single suitable word and use it in a sentence"
      - id: icse-10-odia-ch04-t04
        title: "Words that sound or look alike but differ in meaning; correct spelling"
        learning_outcomes:
          - "Distinguish between commonly confused words by using each in a sentence"
          - "Correct misspelt words"
    removed_topics:
      - "Knowledge of grammatical terms as such (CISCE: the grammar question does not require it)"
    literature_texts: []
  - id: icse-10-odia-ch05
    number: 5
    title: "Grammar: idioms, sentence construction and synthesis"
    unit: "Section A: Language"
    topics:
      - id: icse-10-odia-ch05-t01
        title: "Idioms and proverbs: meaning and use in sentences"
        learning_outcomes:
          - "Explain the meaning of common Odia idioms and proverbs and use them appropriately in sentences"
      - id: icse-10-odia-ch05-t02
        title: "Correcting errors in sentences (agreement, tense, gender and number, case endings or postpositions)"
        learning_outcomes:
          - "Identify the grammatical error in a sentence and rewrite it correctly"
      - id: icse-10-odia-ch05-t03
        title: "Transforming sentences as directed (tense, voice, affirmative/negative, statement/question)"
        learning_outcomes:
          - "Rewrite a sentence as directed without changing its meaning"
      - id: icse-10-odia-ch05-t04
        title: "Synthesis: combining two or more sentences into one"
        learning_outcomes:
          - "Combine two or more simple sentences into one compound or complex sentence"
      - id: icse-10-odia-ch05-t05
        title: "Making sentences that correctly use given words or forms"
        learning_outcomes:
          - "Use a given word, phrase or form correctly in a meaningful sentence"
    removed_topics:
      - "Knowledge of grammatical terms as such (CISCE: the grammar question does not require it)"
    literature_texts: []
