      - id: icse-10-kannada-ch04-t02
        title: "Synonyms and antonyms"
        learning_outcomes:
          - "Give suitable synonyms and correct antonyms for common words"
      - id: icse-10-kannada-ch04-t03
        title: "One word for a group of words"
        learning_outcomes:
          - "Replace a phrase with a single suitable word and use it in a sentence"
      - id: icse-10-kannada-ch04-t04
        title: "Words often confused and correct spelling"
        learning_outcomes:
          - "Show the difference in meaning between similar-looking or similar-sounding words through sentences"
          - "Correct misspelt words"
    removed_topics: []
    literature_texts: []
  - id: icse-10-kannada-ch05
    number: 5
    title: "Grammar: sentence construction and idioms"
    unit: "Section A: Language"
    topics:
      - id: icse-10-kannada-ch05-t01
        title: "Idioms and proverbs: meaning and use in sentences"
        learning_outcomes:
          - "Explain the meaning of common Kannada idioms and proverbs and use them aptly in sentences"
      - id: icse-10-kannada-ch05-t02
        title: "Correcting errors in sentences: agreement, tense, word order and word endings"
        learning_outcomes:
          - "Identify the error in a sentence and rewrite it correctly"
