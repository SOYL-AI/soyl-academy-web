    topics:
      - id: icse-10-history-civics-ch01-t01
        title: "The federal set-up in India: division of powers between the Union and the States"
        learning_outcomes:
          - "Explain the meaning of a federal set-up with reference to the Union, State and Concurrent Lists"
          - "Identify two features that make India a federation with a strong Centre"
      - id: icse-10-history-civics-ch01-t02
        title: "Lok Sabha: composition, term and qualifications for membership"
        learning_outcomes:
          - "State the maximum strength, term and age qualification of members of the Lok Sabha"
          - "Explain how the Lok Sabha may be dissolved before its term or its term extended during a national emergency"
      - id: icse-10-history-civics-ch01-t03
        title: "The Speaker: election, removal and functions"
        learning_outcomes:
          - "Describe how the Speaker is elected and how the Speaker can be removed"
          - "Explain the Speaker's role in conducting business, maintaining order and certifying a Money Bill"
      - id: icse-10-history-civics-ch01-t04
        title: "Rajya Sabha: composition, qualifications, election, term and Presiding Officer"
        learning_outcomes:
