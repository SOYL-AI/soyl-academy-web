# ICSE Class 10 History & Civics (H.C.G. Paper 1, code 50) - ICSE 2027 examination, CLASS X portion only.
# Source: platform/catalog/sources/cisce.md#icse-2027-history-civics. Topic wording is our own summary of the official scope.
subject_id: icse-10-history-civics
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-history-civics, icse-2027-regulations, icse-2027-specimen-papers, cisce-circular-specimen-papers-2027]
exam_notes: >-
  History, Civics and Geography (50) is examined as two papers; this is Paper 1 (2027 specimen paper code 501).
  One theory paper of 2 hours, 80 marks, plus internal assessment 20 marks (one project/assignment on the syllabus,
  marked 10 by the subject teacher and 10 by an external examiner). The paper has Section A: Civics and Section B: History;
  ICSE papers open with compulsory objective and short-answer questions across the whole syllabus, followed by a choice
  of structured long questions in Civics and in History (see the 2027 specimen paper for the exact pattern). About 50% of
  marks target higher-order skills (apply, analyse, evaluate, create) per the October 2026 circular.
  The ICSE 2027 paper is set only on the Class X syllabus (Class IX portion is in icse-9-history-civics).
  CISCE lists numbered topics, not textbook chapters: SOYL groups them into 18 teachable chapters in syllabus order.
  No unit-wise marks weightage is published.
