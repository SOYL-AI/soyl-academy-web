notes: >-
  ICSE 2027 History, Civics and Geography (50) Paper 1, specimen paper code 501: one theory paper of two hours (plus 15 minutes reading
  time), 80 marks; internal assessment 20 marks is not modelled. Part I (30, compulsory, whole syllabus): Q1 16 x 1 incl. 1
  assertion-reason, Q2 7 x 2. Part II: Section A Civics (chapters 1-6) any two of three 10-mark questions; Section B History (chapters
  7-18) any three of five. Civics and History marks in Part I are not fixed by CISCE, so Part I has no chapter scope and the syllabus
  units carry no marks. Picture and source stimuli are SOYL-made or described in words (CONTEXT section 8).
  mark_shares 0.5 / 0.5: the October 2026 circular (cisce-circular-specimen-papers-2027) gives higher-order questions an approximate
  weightage of 50% in 2027.
  Deviation: one chapter per question in the item model, so a Part II question's three parts come from one chapter.
