# ICSE Class 10 Mass Media & Communication (code 90, Group III) - ICSE 2027 examination, CLASS X portion only.
# Source: platform/catalog/sources/cisce.md#icse-2027-mass-media-communication. Topic wording is our own summary of the official scope.
subject_id: icse-10-mass-media-communication
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-mass-media-communication, icse-2027-regulations]
exam_notes: >-
  Mass Media & Communication (90) is a Group III subject: the external written paper and the internal assessment each
  carry 50% of the subject result. One written paper of 2 hours, 100 marks, set only on the Class X syllabus (Class IX
  portion is not examined in ICSE 2027). Internal assessment 100 marks: a minimum of four assignments during the year
  (for example a documentary on the evolution of cameras, a product-selling slide presentation, a blog about one's city,
  a four-page newspaper, a 20-30 minute radio programme, a student survey presented as pie charts, a survey of TV
  watching habits), marked 50 by the subject teacher and 50 by an external examiner. Most theory items call for a brief
  understanding with examples; case studies may be used for Integrated Marketing Communications.
  CISCE lists numbered topics, not textbook chapters: SOYL groups them into 8 teachable chapters in syllabus order.
  No unit-wise marks weightage is published.
