        title: "Principles of communication: irreversible, multi-purpose, interactive, transactional, punctuated"
        learning_outcomes:
          - "Explain each principle of communication with an everyday example"
      - id: icse-10-mass-media-communication-ch01-t02
        title: "Barriers or noise in communication: physical, psychological, semantic, organisational and cultural"
        learning_outcomes:
          - "Identify the type of barrier in a given communication situation and explain its effect"
