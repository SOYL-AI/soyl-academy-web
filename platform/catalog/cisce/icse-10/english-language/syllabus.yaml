# ICSE Class 10 English Language (English Paper 1, code 01) - ICSE 2027 examination.
# Source: platform/catalog/sources/cisce.md#icse-2027-english. Topic wording is our own summary of the official scope.
subject_id: icse-10-english-language
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-english, icse-2027-regulations, icse-2027-specimen-papers, cisce-circular-specimen-papers-2027]
exam_notes: >-
  English (01) is examined as two separately set papers; this is Paper 1, English Language (2027 specimen paper code 011).
  One paper of 2 hours, 80 marks, all questions compulsory: Q1 composition of about 300-350 words from a choice of topics
  (some suggested by pictures); Q2 a formal or informal letter from a choice of two; Q3 a notice and an e-mail on the same
  situation; Q4 an unseen prose passage of about 500 words with vocabulary-in-context, short-answer and summary questions;
  Q5 functional grammar (prepositions, conjunctions, verbs and sentence structure). The syllabus publishes no weightage;
  the 2027 specimen paper (code 011) gives Q1 20 (one of five topics), Q2 10 (one of two letters), Q3 5 + 5, Q4 20
  (comprehension 12 + summary 8) and Q5 20 (4 + 4 + 4 + 8), which the unit marks below follow.
  Internal assessment 20 marks: Listening (10; a passage of about 300 words read aloud twice, objective test) and
  Speaking (10; a two-minute presentation followed by about three minutes of discussion), two assessments in Class X,
  marked by the subject teacher and an external examiner. These are school-assessed skills, so they are not chapters here.
  About 50% of marks target higher-order skills per the October 2026 circular. No textbook is prescribed for Paper 1.
  CISCE describes the paper by question, not by chapters: SOYL groups each question's skills into teachable chapters,
  and the split of Q5 into grammar chapters (verbs, prepositions, conjunctions, transformation) is SOYL's, not CISCE's.
units:
  - { name: "Question 1: Composition", marks: 20 }
  - { name: "Question 2: Letter Writing", marks: 10 }
  - { name: "Question 3: Notice and E-mail", marks: 10 }
  - { name: "Question 4: Comprehension and Summary", marks: 20 }
  - { name: "Question 5: Functional Grammar", marks: 20 }
