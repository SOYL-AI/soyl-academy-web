notes: >-
  SOYL chapter test for ICSE English Language (icse-2027-specimen-011-english-language); not an official CISCE paper. The paper is
  skill-based and its chapters are of different kinds (composition, letter, notice and e-mail, comprehension, summary, grammar), so one
  subject-level blueprint uses only item types every chapter can supply: 1-mark MCQs and 2- and 4-mark short answers (for writing
  chapters: an opening paragraph, a format element, a corrected draft; for grammar chapters: rewriting or completing sentences). 20 marks
  in 30 minutes. Authored chapter tests may add a full writing task (writing chapters) or a fill-in passage (grammar chapters) with
  blueprint_id null, as the CBSE English chapters do.
