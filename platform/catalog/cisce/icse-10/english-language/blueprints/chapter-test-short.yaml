sections:
  - id: A
    title: Section A - Objective (8 marks)
    instructions: Eight multiple-choice items (1 mark each) on the chapter's skill, in the board's "choose the correct option" style.
    items:
      - {type: mcq, count: 8, marks_each: 1}
  - id: B
    title: Section B - Short answers (12 marks)
    instructions: Four 2-mark answers and one 4-mark task on the chapter's skill.
