notes: >-
  ICSE 2027 English (01) Paper 1 English Language, specimen paper code 011: one paper of two hours (plus 15 minutes reading time),
  80 marks, all five questions compulsory; internal assessment (listening 10, speaking 10) is not modelled. Q1 composition 20 (any one
  of five), Q2 letter 10 (one of two), Q3 notice 5 + e-mail 5, Q4 comprehension 12 + summary 8 on one unseen passage, Q5 grammar
  4 + 4 + 4 + 8. Writing items carry a word limit and rubric (contract v2). The syllabus units carry these question marks
  (20 / 10 / 10 / 20 / 20). Passages are SOYL-original (CONTEXT section 8); the specimen's passage is from a published story and is
  not reused. Q5(ii) is set on prepositions as in the specimen; the board may use other one-word blanks.
  mark_shares 0.5 / 0.5: the October 2026 circular (cisce-circular-specimen-papers-2027) gives higher-order questions an approximate
  weightage of 50% in 2027; the specimen tags composition and letters as creating / evaluating and the grammar items as applying.
  Deviation: the notice and the e-mail are two separate items, so they need not share a situation as on the board paper.
