# ICSE Class 10 Mathematics (51) - ICSE 2027 examination.
# Source: platform/catalog/sources/cisce.md#icse-2027-mathematics (CLASS X section only). Topic wording is our own summary of the official scope.
subject_id: icse-10-mathematics
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-mathematics, icse-2027-regulations, icse-2027-specimen-papers, cisce-circular-specimen-papers-2027]
exam_notes: >-
  One paper of 3 hours, 80 marks, plus internal assessment 20 marks (at least two assignments prescribed by the teacher,
  10 subject teacher + 10 external examiner). Both the 2027 syllabus and the 2027 specimen paper (code 511) state three hours.
  Logarithmic and trigonometric tables are provided and may be needed; a question may draw on more than one branch.
  The specimen paper has Section A (40 marks, compulsory; Question 1 is 15 one-mark objective items) and Section B
  (40 marks, any four of seven questions); all working must be shown. About 50% of marks target higher-order skills
  (apply, analyse, evaluate, create) per the October 2026 circular.
  CISCE publishes a topic list in seven sections, not textbook chapters: SOYL groups it into 24 teachable chapters in
  syllabus order. No unit-wise marks weightage is published for ICSE Mathematics.
