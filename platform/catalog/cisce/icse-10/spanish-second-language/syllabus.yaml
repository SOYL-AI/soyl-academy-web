# ICSE Class 10 Spanish (Second Language, Group I, code 36) - ICSE 2027 examination.
# No literature is prescribed for this subject; resource books are named in exam_notes only.
subject_id: icse-10-spanish-second-language
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-mfl-group-1, icse-2027-prescribed-books, icse-2027-regulations]
exam_notes: >-
  One paper of 3 hours, 80 marks, plus internal assessment 20 marks (listening 5, speaking 5, creative writing 10;
  two assessments in Class X, marked 10 by the subject teacher and 10 by an external examiner).
  The paper has five parts: (1) one short composition in Spanish from a choice of subjects or picture/object stimuli;
  (2) a formal or informal letter, with the layout assessed; (3) an unseen passage of about 150 words with questions answered in Spanish;
  (4) grammar - vocabulary, syntax and idiom, without detailed grammatical definitions; (5) translation Spanish to English and
  English to Spanish, and/or a dialogue of about 150 words on an everyday situation. CISCE does not publish marks per part.
  CISCE lists the Spanish grammar scope (nouns, articles, adjectives, adverbs, quantifiers, pronouns, verbs and tenses including the subjunctive, prepositions, conjunctions, numbers, quantities and dates); the chapters follow that order.
  CISCE has not bifurcated this syllabus: the Class X (ICSE 2027) paper is set on the entire Classes IX-X syllabus, so nothing is removed here.
  The Annexe lists communication themes (Myself; Holiday Time and Travel; Work and Lifestyle) that supply the vocabulary and situations
  for composition, letter, comprehension and dialogue questions. Teaching and study resource books (not prescribed literature): Español Sin Fronteras Book 2, workbook Nuevo Ven Book 2 and Pasaporte Book 2.
  A candidate taking Spanish in Group I may not take it again in Group II or III. CISCE lists topics not chapters; SOYL grouped them into teachable chapters in syllabus order.
units:
  - { name: "1. Composition", marks: null }
  - { name: "2. Letter", marks: null }
  - { name: "3. Comprehension", marks: null }
  - { name: "4. Grammar", marks: null }
  - { name: "5. Translation and/or Dialogue Writing", marks: null }
  - { name: "Annexe: Communication themes", marks: null }
chapters:
