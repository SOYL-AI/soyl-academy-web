# ICSE Class 10 Commercial Applications (code 88, Group III) - ICSE 2027 examination, CLASS X portion only.
# Source: platform/catalog/sources/cisce.md#icse-2027-commercial-applications. Topic wording is our own summary of the official scope.
subject_id: icse-10-commercial-applications
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-commercial-applications, icse-2027-regulations]
exam_notes: >-
  Commercial Applications (88) is a Group III subject: the external written paper and the internal assessment each carry
  50% of the subject result. One written paper of 2 hours, 100 marks, set only on the Class X syllabus (Class IX portion
  is not examined in ICSE 2027). Internal assessment 100 marks: a minimum of four assignments during the year (for example
  a marketing plan for a new low-priced product, a report on non-traditional markets, comparing marketing strategies of a
  service firm and a manufacturer, placing a product on its life cycle, evaluating advertisements, commenting on a
  company's annual report, studying a bank branch or the role of the RBI, studying the HR policies of an IT firm or the
  PR department of a media firm), marked 50 by the subject teacher and 50 by an external examiner.
  Candidates offering Commercial Studies (Group II) may not offer Commercial Applications.
  CISCE lists numbered topics, not textbook chapters: SOYL groups them into 12 teachable chapters in syllabus order.
  No unit-wise marks weightage is published.
units:
  - { name: "1: Markets and Marketing", marks: null }
  - { name: "2: Understanding Finance", marks: null }
  - { name: "3: Understanding Human Resources", marks: null }
  - { name: "4: Development of Public Relations", marks: null }
