# ICSE Class 10 Robotics and Artificial Intelligence (code 66, Group III Section B vocational) - ICSE 2027 examination.
# Source: platform/catalog/sources/cisce.md#icse-2027-vocational-robotics-ai (Class X portion). Topic wording is our own summary.
subject_id: icse-10-robotics-artificial-intelligence
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-vocational-robotics-ai, icse-2027-specimen-papers, icse-2027-regulations]
exam_notes: >-
  One written paper of 2 hours, 100 marks, plus internal assessment 100 marks. Written paper weightage: Part I Robotics
  50 marks (New Age Robotic Systems 12, Components of Robots as a System 15, Visualization, Design and Creation of
  Components 15, Integrating Robots as a System 8) and Part II Artificial Intelligence 50 marks (Decision Making in
  Machines 8, Machine Intelligence and Cybersecurity 8, Components of AI Project Framework 14, Data and Programming
  with Python 20). The 2027 specimen paper (code 661) has Section A (40 marks, compulsory) and Section B (60 marks,
  any four of six questions).
  Internal assessment: at least 20 assignments in the year (3 robotics, 2 AI, 15 Python programming, e.g. NumPy arrays,
  reading CSV/JSON into Pandas, Matplotlib plots), marked 50 by the subject teacher and 50 by an external examiner on
  class design, variable description, coding and documentation, and execution/output. Teacher demonstrations of
  line-follower, obstacle-avoidance and edge-detection mobile robots are for familiarisation and are not evaluated.
  Class IX key concepts are a stated prerequisite but the Class X paper is set on the Class X syllabus only.
  CISCE lists topics, not textbook chapters: SOYL groups them into 11 teachable chapters in syllabus order (the 3D
  design work is described generically; the syllabus names Tinkercad as the tool).
