chapters:
  - id: icse-10-commercial-studies-ch01
    number: 1
    title: "Stakeholders in Commercial Organisations"
    unit: "1. Stakeholders in Commercial Organisations"
    topics:
      - id: icse-10-commercial-studies-ch01-t01
        title: "Stakeholder: meaning"
        learning_outcomes:
          - "Define a stakeholder and identify the stakeholders of a given business such as a local supermarket"
      - id: icse-10-commercial-studies-ch01-t02
        title: "Internal stakeholders: shareholders, employees and employers"
        learning_outcomes:
          - "Explain the meaning of each internal stakeholder and its link with the organisation"
      - id: icse-10-commercial-studies-ch01-t03
        title: "External stakeholders: suppliers, creditors, government and society"
        learning_outcomes:
          - "Explain the meaning of each external stakeholder"
          - "Distinguish internal from external stakeholders on at least three points"
      - id: icse-10-commercial-studies-ch01-t04
        title: "Expectations of employers (owners and managers) and employees"
        learning_outcomes:
          - "List the expectations owners and managers have from a commercial organisation, such as return on capital and growth"
          - "Explain what employees expect, such as fair wages, job security and good working conditions"
      - id: icse-10-commercial-studies-ch01-t05
        title: "Expectations of creditors, suppliers, government and society"
        learning_outcomes:
          - "Explain the expectations of creditors and suppliers, such as timely payment and regular orders"
          - "Describe what government and society expect, such as payment of taxes, law compliance, fair prices and protection of the environment"
