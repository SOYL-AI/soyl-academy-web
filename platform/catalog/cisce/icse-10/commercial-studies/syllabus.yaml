# ICSE Class 10 Commercial Studies (code 63, Group II) - ICSE 2027 examination, CLASS X portion only.
# Source: platform/catalog/sources/cisce.md#icse-2027-commercial-studies. Topic wording is our own summary of the official scope.
subject_id: icse-10-commercial-studies
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-commercial-studies, icse-2027-regulations]
exam_notes: >-
  One written paper of 2 hours, 80 marks, plus internal assessment 20 marks (one project set by the teacher from the
  syllabus; marked 10 by the subject teacher and 10 by an external examiner). Group II elective; candidates offering
  Commercial Applications (Group III) may not offer Commercial Studies.
  The syllabus does not print the question-paper pattern; ICSE Group II papers usually open with compulsory short-answer
  questions across the syllabus followed by a choice of structured long questions (check the latest CISCE specimen paper).
  Final accounts of a sole proprietor are examined as numerical work (trading account, profit and loss account and
  balance sheet from a trial balance, with closing stock as the only adjustment).
  The ICSE 2027 paper is set only on the Class X syllabus (Class IX portion is in icse-9-commercial-studies).
  CISCE lists numbered topics, not textbook chapters: SOYL groups them into 16 teachable chapters in syllabus order.
  No unit-wise marks weightage is published.
