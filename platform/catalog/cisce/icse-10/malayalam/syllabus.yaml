    literature_texts: []
  - id: icse-10-malayalam-ch06
    number: 6
    title: "Sahitya Surabhi: short stories (Class X portion)"
    unit: "Section B: Prescribed Texts"
    topics:
      - id: icse-10-malayalam-ch06-t01
        title: "Manikkan (Lalithambika Antherjanam): plot, characters and theme"
        learning_outcomes:
          - "Summarise the plot of the story in their own words"
          - "Describe the main characters with examples from the story"
          - "Explain the theme of the story and the significance of its title"
      - id: icse-10-malayalam-ch06-t02
        title: "Janmadinam (Vaikom Muhammad Basheer): a birthday remembered in the first person"
        learning_outcomes:
          - "Narrate the narrator's day in sequence in their own words"
          - "Explain how Basheer mixes humour and pathos in writing about poverty and hunger"
          - "Comment on the personal, conversational style of the story"
      - id: icse-10-malayalam-ch06-t03
        title: "Thahaseeldarude Achan (Thakazhy Sivasankara Pillai): plot, characters and social theme"
        learning_outcomes:
          - "Summarise the plot of the story in their own words"
          - "Explain what the title reveals about the central relationship in the story"
          - "Comment on the writer's view of social status and family ties"
      - id: icse-10-malayalam-ch06-t04
        title: "Kaliya Mardanam (Kakkanadan): plot, characters and the allusion in the title"
        learning_outcomes:
          - "Summarise the plot of the story in their own words"
          - "Explain the mythological allusion in the title and how it connects with the story"
      - id: icse-10-malayalam-ch06-t05
        title: "Model (Ponkunnam Varkey): plot, characters and theme"
        learning_outcomes:
          - "Summarise the plot of the story in their own words"
          - "Describe the main characters with examples from the story"
          - "Explain the theme of the story and the significance of its title"
