    unit: "Section A: Language"
    topics:
      - id: icse-10-malayalam-ch05-t01
        title: "Idioms and proverbs: meaning and use in sentences"
        learning_outcomes:
          - "Explain the meaning of common Malayalam idioms and proverbs and use them appropriately in sentences"
      - id: icse-10-malayalam-ch05-t02
        title: "Correcting errors in sentences (agreement, tense, gender and number, case endings or postpositions)"
        learning_outcomes:
