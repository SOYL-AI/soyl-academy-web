      - id: icse-10-sanskrit-classical-ch02-t05
        title: "व्यञ्जनान्तशब्दाः - भवत्, राजन्, जगत्, नामन्, मनस्"
        title_en: "Consonant-ending nouns: bhavat, rajan, jagat, naman, manas"
        learning_outcomes:
          - "व्यञ्जनान्तशब्दानां प्रमुखरूपाणि अभिज्ञाय वाक्येषु प्रयुङ्क्ते"
