# ICSE Class 10 Sanskrit (Classical Language, Group II, code 76) - ICSE 2027 examination.
# No textbooks or literature are prescribed for this paper.
subject_id: icse-10-sanskrit-classical
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-classical-language, icse-2027-second-languages, icse-2027-regulations]
exam_notes: >-
  One paper of 2 hours, 80 marks, plus internal assessment 20 marks (two or three assignments in Class X - suggested oral and aural work -
  marked 10 by the subject teacher and 10 by an external examiner). The paper has three tests: (a) questions on elementary Sanskrit grammar;
  (b) unprepared translation of short prose sentences from English into Sanskrit; (c) unprepared translation from Sanskrit into English.
  CISCE does not publish marks per test and prescribes no textbooks. The syllabus is common to Classes IX and X with no class-wise split,
  so the ICSE 2027 paper may draw on all of it. CISCE does not list the grammar items for this paper; SOYL's grammar chapters follow the
  grammar scope CISCE publishes for Sanskrit as a Group I second language (sandhi, noun and pronoun declensions, numerals, verb forms in
  five lakaras, karakas, compounds and suffixes) - this breakdown is SOYL's, not CISCE's. Papers are set in Sanskrit and other classical
  languages on request. A candidate taking Sanskrit in Group I may not take it here. CISCE lists topics not chapters; SOYL grouped them into teachable chapters in syllabus order.
units:
  - { name: "क - प्रारम्भिकं संस्कृतव्याकरणम् (Elementary Sanskrit grammar)", marks: null }
  - { name: "ख - आङ्ग्लभाषातः संस्कृते अनुवादः (Translation from English into Sanskrit)", marks: null }
  - { name: "ग - संस्कृततः आङ्ग्लभाषायाम् अनुवादः (Translation from Sanskrit into English)", marks: null }
