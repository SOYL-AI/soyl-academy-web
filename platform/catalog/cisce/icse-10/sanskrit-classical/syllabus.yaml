      - id: icse-10-sanskrit-classical-ch02-t03
        title: "स्त्रीलिङ्गशब्दाः - रमा, नदी, धेनु, वधू, मातृ"
        title_en: "Feminine nouns: rama, nadi, dhenu, vadhu, matri"
        learning_outcomes:
          - "स्त्रीलिङ्गशब्दानां रूपाणि लिखति वाक्येषु च प्रयुङ्क्ते"
      - id: icse-10-sanskrit-classical-ch02-t04
