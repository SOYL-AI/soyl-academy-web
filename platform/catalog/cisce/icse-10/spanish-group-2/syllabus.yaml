# ICSE Class 10 Spanish (Modern Foreign Language, Group II, code 85) - ICSE 2027 examination.
# No textbooks or literature are prescribed for this subject.
subject_id: icse-10-spanish-group-2
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-mfl-group-2, icse-2027-mfl-group-1, icse-2027-regulations]
exam_notes: >-
  One paper of 2 hours, 80 marks, plus internal assessment 20 marks (two or three assignments in Class X - suggested oral and aural work -
  marked 10 by the subject teacher and 10 by an external examiner). All five questions are compulsory: (1) a composition of about 250 words
  from a choice of subjects or stimuli; (2) a letter of about 150 words from a choice of two subjects, layout assessed; (3) vocabulary, syntax
  and idiom - sentence synthesis and forming sentences that embody given words or forms, without grammatical terms; (4) an unseen passage of
  about 150 words with questions answered in Spanish; (5) translation of a short passage from Spanish into English.
  CISCE does not publish marks per question and prescribes no textbooks. The syllabus is common to Classes IX and X with no class-wise split,
  so the ICSE 2027 paper may draw on all of it. CISCE does not list grammar items for Group II; SOYL's grammar chapters condense the scope
  CISCE publishes for Spanish in Group I - this breakdown is SOYL's, not CISCE's. A candidate taking Spanish in Group II may not take it
  in Group I or III. CISCE lists topics not chapters; SOYL grouped them into teachable chapters in syllabus order.
units:
  - { name: "Question 1: Composition", marks: null }
  - { name: "Question 2: Letter", marks: null }
  - { name: "Question 3: Vocabulary, syntax and idiom", marks: null }
  - { name: "Question 4: Unseen passage", marks: null }
  - { name: "Question 5: Translation into English", marks: null }
chapters:
  - id: icse-10-spanish-group-2-ch01
    number: 1
    title: "Composition (Redacción)"
    unit: "Question 1: Composition"
    topics:
      - id: icse-10-spanish-group-2-ch01-t01
        title: "Planning a short composition: ideas, outline, paragraphs and linking words"
        learning_outcomes:
          - "Draw up a short plan and write a composition of about 250 words in Spanish with an introduction, body and conclusion"
          - "Link ideas with connectors such as primero, luego, después, finalmente, sin embargo"
      - id: icse-10-spanish-group-2-ch01-t02
        title: "Descriptions of people, places and events"
        learning_outcomes:
          - "Describe a person, place or festival with suitable adjectives that agree correctly"
      - id: icse-10-spanish-group-2-ch01-t03
        title: "Narratives: recounting an experience"
        learning_outcomes:
          - "Narrate a past experience in sequence using the pretérito indefinido and the imperfecto correctly"
      - id: icse-10-spanish-group-2-ch01-t04
        title: "Short explanations and directions"
        learning_outcomes:
          - "Explain how to do something or how to reach a place, using imperatives and sequencing words"
      - id: icse-10-spanish-group-2-ch01-t05
        title: "Composition from a picture, object or language stimulus"
        learning_outcomes:
          - "Write a composition prompted by a picture or object, describing the scene and imagining what happened before and after"
    removed_topics: []
    literature_texts: []
  - id: icse-10-spanish-group-2-ch02
    number: 2
    title: "Letter writing (La carta)"
    unit: "Question 2: Letter"
    topics:
      - id: icse-10-spanish-group-2-ch02-t01
        title: "Layout of a Spanish letter: place and date, salutation, body, closing formula, signature"
        learning_outcomes:
          - "Set out a letter in the correct Spanish layout, writing the place and date in Spanish style (e.g. \"Madrid, 5 de marzo de 2027\")"
      - id: icse-10-spanish-group-2-ch02-t02
        title: "Formal letters: request, complaint, reservation, application (Estimado/a señor/a ... Atentamente)"
        learning_outcomes:
          - "Write a formal letter of about 150 words using polite address and the set opening and closing formulas"
      - id: icse-10-spanish-group-2-ch02-t03
        title: "Informal letters to friends and family (Querido/a ..., Un abrazo, Besos)"
        learning_outcomes:
          - "Write an informal letter of about 150 words (invitation, thanks, holiday news) with familiar address and closings"
      - id: icse-10-spanish-group-2-ch02-t04
        title: "Expanding the given suggestions into a complete letter"
        learning_outcomes:
          - "Cover every suggestion given in the question in a well-ordered letter"
          - "Choose between the two subjects offered and keep the register consistent"
    removed_topics: []
    literature_texts: []
  - id: icse-10-spanish-group-2-ch03
    number: 3
    title: "Grammar: nouns, adjectives and pronouns"
    unit: "Question 3: Vocabulary, syntax and idiom"
    topics:
      - id: icse-10-spanish-group-2-ch03-t01
        title: "Género y número; artículos definidos e indefinidos"
        learning_outcomes:
          - "Make articles and nouns agree in gender and number"
      - id: icse-10-spanish-group-2-ch03-t02
        title: "Adjetivos: agreement, posesivos, demostrativos"
        learning_outcomes:
          - "Use adjectives, possessives and demonstratives that agree with the noun"
      - id: icse-10-spanish-group-2-ch03-t03
        title: "Pronombres de objeto directo e indirecto: position and order"
        learning_outcomes:
          - "Replace objects with pronouns and place them correctly"
      - id: icse-10-spanish-group-2-ch03-t04
        title: "Pronombres reflexivos y relativos (que, quien, lo que)"
        learning_outcomes:
          - "Use reflexive pronouns and join sentences with relative pronouns"
    removed_topics:
      - "Questions do not require knowledge of grammatical terms"
    literature_texts: []
  - id: icse-10-spanish-group-2-ch04
    number: 4
    title: "Grammar: verbs and tenses"
    unit: "Question 3: Vocabulary, syntax and idiom"
    topics:
      - id: icse-10-spanish-group-2-ch04-t01
        title: "Presente: regular, irregular, radical-changing and reflexive verbs"
        learning_outcomes:
          - "Conjugate common verbs in the present in all persons"
      - id: icse-10-spanish-group-2-ch04-t02
        title: "Ser y estar"
        learning_outcomes:
          - "Choose ser or estar according to meaning"
      - id: icse-10-spanish-group-2-ch04-t03
        title: "Pretérito indefinido, imperfecto and pretérito perfecto"
        learning_outcomes:
          - "Narrate past events choosing the appropriate past tense"
      - id: icse-10-spanish-group-2-ch04-t04
        title: "Futuro, ir a + infinitivo and condicional"
        learning_outcomes:
          - "Talk about plans, predictions and polite requests"
      - id: icse-10-spanish-group-2-ch04-t05
        title: "Imperativo and the commonest uses of the present subjunctive"
        learning_outcomes:
          - "Give commands and use the subjunctive after querer que and para que"
    removed_topics: []
    literature_texts: []
  - id: icse-10-spanish-group-2-ch05
    number: 5
    title: "Grammar: sentence structure and usage"
    unit: "Question 3: Vocabulary, syntax and idiom"
    topics:
      - id: icse-10-spanish-group-2-ch05-t01
        title: "Questions and negative sentences"
        learning_outcomes:
          - "Frame questions with interrogatives and make sentences negative"
      - id: icse-10-spanish-group-2-ch05-t02
        title: "Preposiciones: personal a, por y para"
        learning_outcomes:
          - "Choose por or para and use the personal a"
      - id: icse-10-spanish-group-2-ch05-t03
        title: "Comparativos y superlativos (mejor, peor, mayor, menor)"
        learning_outcomes:
          - "Compare people and things, including irregular forms"
      - id: icse-10-spanish-group-2-ch05-t04
        title: "Conjunctions and sentence synthesis; forming sentences with given words"
        learning_outcomes:
          - "Combine sentences with conjunctions and write correct sentences using given words or forms"
    removed_topics: []
    literature_texts: []
  - id: icse-10-spanish-group-2-ch06
    number: 6
    title: "Unseen passage (Comprensión lectora)"
    unit: "Question 4: Unseen passage"
    topics:
      - id: icse-10-spanish-group-2-ch06-t01
        title: "Reading an unseen passage of about 150 words: gist and key details"
        learning_outcomes:
          - "State the main idea of an unseen Spanish passage and locate specific details"
      - id: icse-10-spanish-group-2-ch06-t02
        title: "Answering questions in Spanish in complete sentences"
        learning_outcomes:
          - "Answer factual questions in Spanish, changing pronouns and verb forms from the passage where needed (e.g. first to third person)"
      - id: icse-10-spanish-group-2-ch06-t03
        title: "Vocabulary from context and simple inference"
        learning_outcomes:
          - "Work out the meaning of unfamiliar words from context"
          - "Answer an inference question and support it with evidence from the passage"
    removed_topics: []
    literature_texts: []
  - id: icse-10-spanish-group-2-ch07
    number: 7
    title: "Translation from Spanish into English"
    unit: "Question 5: Translation into English"
    topics:
      - id: icse-10-spanish-group-2-ch07-t01
        title: "Reading for meaning before translating"
        learning_outcomes:
          - "Identify the subject, verb and time reference of each Spanish sentence before translating it"
      - id: icse-10-spanish-group-2-ch07-t02
        title: "Tenses, pronouns and word order in translation"
        learning_outcomes:
          - "Render Spanish tenses and pronouns by the correct English forms and natural English word order"
      - id: icse-10-spanish-group-2-ch07-t03
        title: "Idioms, set expressions and false friends"
        learning_outcomes:
          - "Avoid false friends (e.g. embarazada/embarrassed, librería/library) and translate idioms by meaning, not word for word"
          - "Produce a complete, fluent English version of a short passage"
