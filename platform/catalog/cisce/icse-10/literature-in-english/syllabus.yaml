# ICSE Class 10 Literature in English (English Paper 2, code 01) - ICSE 2027 examination, CLASS X portion only.
# Sources: platform/catalog/sources/cisce.md#icse-2027-english and #icse-2027-prescribed-books.
# Literature: titles and authors only. Students read the texts in their own copy of the play and of Treasure Chest.
subject_id: icse-10-literature-in-english
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-english, icse-2027-prescribed-books, icse-2027-regulations, icse-2027-specimen-papers, cisce-circular-specimen-papers-2027]
exam_notes: >-
  English (01) is examined as two separately set papers; this is Paper 2, Literature in English (2027 specimen paper code 012).
  One paper of 2 hours, 80 marks, on the prescribed texts: Drama (Julius Caesar, Acts III, IV and V), Prose (five short
  stories) and Poetry (five poems), the last two from Treasure Chest: A Collection of ICSE Short Stories and Poems
  (Evergreen Publications). Questions are central to the text; drama and prose questions may be set on extracts, and
  poetry questions on a poem or lines from it, testing content, understanding and personal response. The 2027 specimen
  paper (code 012) has Section A (16 one-mark MCQs, compulsory) and Sections B Drama, C Prose and D Poetry with two
  16-mark extract questions each; candidates answer one from each of B, C and D and one more from any of them.
  About 50% of marks target higher-order skills per the
  October 2026 circular. Internal assessment 20 marks: two or three written assignments on the prescribed texts (not
  exceeding 1500 words in total), marked by the subject teacher and an external examiner.
  The ICSE 2027 paper is set ONLY on the Class X portion; Julius Caesar Acts I-II and the Class IX stories and poems are
  in icse-9-literature-in-english. CISCE lists texts, not chapters: SOYL gives one chapter per act of the play, one
  whole-play chapter on character and theme, one chapter each for the stories and poems, and a chapter on literary
  devices and answering extract-based questions.
units:
  - { name: "Drama: Julius Caesar (Acts III-V)", marks: null }
  - { name: "Prose: Short Stories", marks: null }
  - { name: "Poetry", marks: null }
chapters:
  - id: icse-10-literature-in-english-ch01
    number: 1
    title: "Julius Caesar: Act III"
    unit: "Drama: Julius Caesar (Acts III-V)"
    topics:
      - id: icse-10-literature-in-english-ch01-t01
        title: "Act III Scene 1: the Ides of March, the petition and the assassination of Caesar"
        learning_outcomes:
          - "Narrate the sequence of events at the Capitol leading to the assassination"
          - "Explain how Caesar's pride and refusal of the petition reveal his character at this moment"
          - "Explain the dramatic irony of Caesar ignoring the warning letter"
      - id: icse-10-literature-in-english-ch01-t02
        title: "Act III Scene 1: Antony's response, his bargain with the conspirators and his soliloquy over Caesar's body"
        learning_outcomes:
          - "Analyse how Antony conceals his intentions from the conspirators"
          - "Explain Brutus' error in allowing Antony to speak at the funeral and Cassius' objection"
          - "Summarise the prophecy of civil war in Antony's soliloquy"
      - id: icse-10-literature-in-english-ch01-t03
        title: "Act III Scene 2: Brutus' funeral speech"
        learning_outcomes:
          - "Explain how Brutus justifies the killing by appealing to reason and patriotism"
          - "Comment on his use of prose and its effect on the crowd"
      - id: icse-10-literature-in-english-ch01-t04
        title: "Act III Scene 2: Antony's funeral oration and the turning of the crowd"
        learning_outcomes:
          - "Analyse Antony's rhetorical techniques: verbal irony, repetition, pauses, the will and the display of the wounds"
          - "Trace step by step how the mood of the crowd changes from support of Brutus to mutiny"
      - id: icse-10-literature-in-english-ch01-t05
        title: "Act III Scene 3: the mob and Cinna the poet"
        learning_outcomes:
          - "Explain what the killing of Cinna the poet shows about mob violence and the unleashed chaos in Rome"
    removed_topics: []
    literature_texts:
      - { title: "Julius Caesar (Act III)", author: "William Shakespeare" }
  - id: icse-10-literature-in-english-ch02
    number: 2
    title: "Julius Caesar: Act IV"
    unit: "Drama: Julius Caesar (Acts III-V)"
    topics:
      - id: icse-10-literature-in-english-ch02-t01
        title: "Act IV Scene 1: the triumvirs and the proscription list"
        learning_outcomes:
          - "Explain what the proscription scene reveals about Antony's ruthlessness and his view of Lepidus"
          - "Contrast the new rulers with the idealism claimed by the conspirators"
      - id: icse-10-literature-in-english-ch02-t02
        title: "Act IV Scene 2: Brutus' camp near Sardis and the growing coldness between Brutus and Cassius"
        learning_outcomes:
          - "Explain the signs of strain in the friendship reported in this scene"
      - id: icse-10-literature-in-english-ch02-t03
        title: "Act IV Scene 3: the quarrel scene and the reconciliation"
        learning_outcomes:
          - "Identify the causes of the quarrel (the bribery charge and the refused gold) and how each man argues"
          - "Explain how the reconciliation is achieved and what it reveals about both characters"
      - id: icse-10-literature-in-english-ch02-t04
        title: "Act IV Scene 3: news of Portia's death, the decision to march to Philippi and the appearance of Caesar's Ghost"
        learning_outcomes:
          - "Evaluate Brutus' reasons for marching to Philippi against Cassius' advice"
          - "Explain the dramatic significance of the Ghost and Brutus' gentleness towards Lucius"
    removed_topics: []
    literature_texts:
      - { title: "Julius Caesar (Act IV)", author: "William Shakespeare" }
  - id: icse-10-literature-in-english-ch03
    number: 3
    title: "Julius Caesar: Act V"
    unit: "Drama: Julius Caesar (Acts III-V)"
    topics:
      - id: icse-10-literature-in-english-ch03-t01
        title: "Act V Scene 1: the parley at Philippi, the omens and the farewell of Brutus and Cassius"
        learning_outcomes:
          - "Describe the exchange of insults between the two sides during the parley"
          - "Explain Cassius' change of mind about omens and the mood of the farewell"
      - id: icse-10-literature-in-english-ch03-t02
        title: "Act V Scenes 2-3: the battle, Cassius' misjudgement and death, and Titinius' death"
        learning_outcomes:
          - "Explain how a misunderstanding about Titinius leads to Cassius' death"
          - "Explain the irony of the weapon used in Cassius' death and Brutus' remark that Caesar's spirit is still powerful"
      - id: icse-10-literature-in-english-ch03-t03
        title: "Act V Scene 4: young Cato and Lucilius' loyalty"
        learning_outcomes:
          - "Explain how Lucilius protects Brutus and how Antony responds to his loyalty"
      - id: icse-10-literature-in-english-ch03-t04
        title: "Act V Scene 5: the death of Brutus and the tributes of Antony and Octavius"
        learning_outcomes:
          - "Narrate the circumstances of Brutus' death"
          - "Explain why Antony's final tribute presents Brutus as the most honourable of the conspirators"
    removed_topics: []
    literature_texts:
      - { title: "Julius Caesar (Act V)", author: "William Shakespeare" }
  - id: icse-10-literature-in-english-ch04
    number: 4
    title: "Julius Caesar (Acts III-V): Characters, Themes and Dramatic Devices"
    unit: "Drama: Julius Caesar (Acts III-V)"
    topics:
      - id: icse-10-literature-in-english-ch04-t01
        title: "Character of Brutus: idealism, honour and political misjudgement"
        learning_outcomes:
          - "Write a character sketch of Brutus supported by incidents from Acts III-V"
          - "Evaluate whether Brutus is the tragic hero of the play"
      - id: icse-10-literature-in-english-ch04-t02
        title: "Characters of Mark Antony and Cassius"
        learning_outcomes:
          - "Compare Antony as orator and opportunist with Cassius as shrewd but emotional, using evidence from the text"
      - id: icse-10-literature-in-english-ch04-t03
        title: "Minor characters: Octavius, Lepidus, Portia, Lucius, Titinius, Pindarus and the citizens"
        learning_outcomes:
          - "Explain the dramatic function of minor characters in the later acts"
      - id: icse-10-literature-in-english-ch04-t04
        title: "Themes: power and ambition, honour and friendship, persuasion and the fickle crowd, fate and free will"
        learning_outcomes:
          - "Discuss a theme with reference to at least two scenes"
          - "Explain why the play is named after Caesar though he dies in Act III"
      - id: icse-10-literature-in-english-ch04-t05
        title: "Dramatic devices: soliloquy, dramatic irony, the supernatural, blank verse versus prose"
        learning_outcomes:
          - "Identify and explain the effect of a soliloquy, dramatic irony or supernatural element in a given extract"
    removed_topics:
      - "Julius Caesar Acts I and II (Class IX portion; see icse-9-literature-in-english)"
    literature_texts: []
  - id: icse-10-literature-in-english-ch05
    number: 5
    title: "Treasure Chest: Short Stories (Class X portion)"
    unit: "Prose: Short Stories"
    topics:
      - id: icse-10-literature-in-english-ch05-t01
        title: "With the Photographer (Stephen Leacock): humour, satire on vanity and artificial portraits"
        learning_outcomes:
          - "Summarise the narrator's experience at the photographer's studio"
          - "Explain how Leacock uses exaggeration and irony to satirise the photographer and the pursuit of a flattering image"
      - id: icse-10-literature-in-english-ch05-t02
        title: "The Elevator (William Sleator): fear, suspense and the supernatural"
        learning_outcomes:
          - "Trace how suspense builds through Martin's repeated encounters in the elevator"
          - "Analyse Martin's fears and his relationship with his father"
          - "Discuss possible interpretations of the open ending"
      - id: icse-10-literature-in-english-ch05-t03
        title: "The Girl Who Can (Ama Ata Aidoo): gender stereotypes and a child's perspective"
        learning_outcomes:
          - "Explain the views of Adjoa's grandmother and mother about her thin legs"
          - "Analyse how Adjoa's success in the school race challenges stereotypes"
          - "Comment on the use of a young first-person narrator"
      - id: icse-10-literature-in-english-ch05-t04
        title: "The Pedestrian (Ray Bradbury): technology, conformity and a dystopian future"
        learning_outcomes:
          - "Describe the setting of the story and Leonard Mead's nightly walks"
          - "Explain the irony of Mead's arrest by the police car and its destination"
          - "Evaluate the story's warning about technology and isolation"
      - id: icse-10-literature-in-english-ch05-t05
        title: "The Last Lesson (Alphonse Daudet): language, identity and loss"
        learning_outcomes:
          - "Explain the historical situation behind the last French lesson in Alsace"
          - "Analyse the change in Franz's attitude and in M. Hamel's behaviour"
          - "Discuss the theme of linguistic identity and the cost of procrastination"
    removed_topics:
      - "Class IX short stories of Treasure Chest (see icse-9-literature-in-english)"
    literature_texts:
      - { title: "With the Photographer", author: "Stephen Leacock" }
      - { title: "The Elevator", author: "William Sleator" }
      - { title: "The Girl Who Can", author: "Ama Ata Aidoo" }
      - { title: "The Pedestrian", author: "Ray Bradbury" }
      - { title: "The Last Lesson", author: "Alphonse Daudet" }
  - id: icse-10-literature-in-english-ch06
    number: 6
    title: "Treasure Chest: Poems (Class X portion)"
    unit: "Poetry"
    topics:
      - id: icse-10-literature-in-english-ch06-t01
        title: "Haunted Houses (H.W. Longfellow): the presence of the past and the spirit world"
        learning_outcomes:
          - "Explain the poet's idea that every house where people have lived is haunted"
          - "Interpret the poem's imagery of the visible and invisible worlds and its central message"
      - id: icse-10-literature-in-english-ch06-t02
        title: "The Glove and the Lions (Leigh Hunt): narrative ballad on love, vanity and courage"
        learning_outcomes:
          - "Narrate the events in the king's arena and the lady's test of the Count"
          - "Evaluate the Count's response and the king's judgement on the lady's motive"
          - "Identify features of the ballad form such as rhyme, rhythm and storytelling"
      - id: icse-10-literature-in-english-ch06-t03
        title: "When Great Trees Fall (Maya Angelou): grief at the death of great people and recovery"
        learning_outcomes:
          - "Explain the extended metaphor of great trees falling"
          - "Trace the movement of the poem from shock and loss to healing"
      - id: icse-10-literature-in-english-ch06-t04
        title: "A Considerable Speck (Robert Frost): respect for life and a tiny creature's intelligence"
        learning_outcomes:
          - "Describe the speaker's encounter with the mite on the page and his decision"
          - "Explain the poem's gentle satire on human intelligence and its tone"
      - id: icse-10-literature-in-english-ch06-t05
        title: "The Power of Music (Sukumar Ray): humour, exaggeration and nonsense verse"
        learning_outcomes:
          - "Summarise the effect of the singer's music on people and animals"
          - "Identify hyperbole and irony and explain how they create humour"
    removed_topics:
      - "Class IX poems of Treasure Chest (see icse-9-literature-in-english)"
    literature_texts:
      - { title: "Haunted Houses", author: "H.W. Longfellow" }
      - { title: "The Glove and the Lions", author: "Leigh Hunt" }
      - { title: "When Great Trees Fall", author: "Maya Angelou" }
      - { title: "A Considerable Speck", author: "Robert Frost" }
      - { title: "The Power of Music", author: "Sukumar Ray" }
  - id: icse-10-literature-in-english-ch07
    number: 7
    title: "Literary Devices and Answering Extract-based Questions"
    unit: null
    topics:
      - id: icse-10-literature-in-english-ch07-t01
        title: "Figures of speech: simile, metaphor, personification, hyperbole, alliteration, irony, apostrophe, oxymoron"
        learning_outcomes:
          - "Identify a figure of speech in a given line and explain its effect in context"
      - id: icse-10-literature-in-english-ch07-t02
        title: "Poetic form and sound: rhyme scheme, rhythm, refrain, stanza, ballad, free verse, tone and mood"
        learning_outcomes:
          - "Work out the rhyme scheme of a stanza and describe the tone and mood of a poem"
      - id: icse-10-literature-in-english-ch07-t03
        title: "Narrative and dramatic techniques: point of view, setting, foreshadowing, suspense, dramatic irony, soliloquy, aside"
        learning_outcomes:
          - "Explain how a technique such as foreshadowing or point of view shapes a story or scene"
      - id: icse-10-literature-in-english-ch07-t04
        title: "Answering context questions on extracts: locating the moment, speaker, listener and situation"
        learning_outcomes:
          - "Place an extract in its context by identifying speaker, listener, situation and what happens next"
          - "Explain the meaning of words and lines in an extract in one's own words"
      - id: icse-10-literature-in-english-ch07-t05
        title: "Writing longer answers: character sketches, theme questions and personal response"
        learning_outcomes:
          - "Write a structured answer that makes a clear point and supports it with close reference to the text"
          - "Give a reasoned personal response to a character's choice or a poem's message"
    removed_topics: []
    literature_texts: []
