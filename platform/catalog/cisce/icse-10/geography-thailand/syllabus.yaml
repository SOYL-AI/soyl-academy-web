# ICSE Class 10 Geography (Thailand) (H.C.G. Thailand Paper 2, code 58) - ICSE 2027 examination, CLASS X portion only.
# Source: platform/catalog/sources/cisce.md#icse-2027-geography-thailand. Topic wording is our own summary of the official scope.
subject_id: icse-10-geography-thailand
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-geography-thailand, icse-2027-regulations]
exam_notes: >-
  History, Civics and Geography (Thailand) (58) is a Group I subject offered only to candidates from CISCE-affiliated
  schools in Thailand, in place of History, Civics and Geography (50); it is examined as two papers and this is Paper 2.
  One theory paper of 2 hours, 80 marks, plus internal assessment 20 marks (one project report, e.g. land use in Thai
  regions, a survey of a floating market, tourism or transport development, or a visit to a water or sewage treatment or
  composting site; marked 10 by the subject teacher and 10 by an external examiner). Part I Map Work covers interpretation
  of topographical maps and an outline map of Thailand; Part II is the Geography of Thailand. Answers are expected to use
  sketches, diagrams, graphs and charts, and questions may require interpreting photographs. The syllabus does not print
  the detailed question pattern or marks per part. Map reading is an examined written skill, so it is taught here as
  chapters (chapters 1-4), not as practical work. The ICSE 2027 paper is set only on the Class X syllabus (Class IX
  Principles of Geography is in icse-9-geography-thailand). CISCE lists numbered topics, not textbook chapters: SOYL
  groups them into 17 teachable chapters in syllabus order. No marks weightage is published.
units:
  - { name: "Part I: Map Work", marks: null }
  - { name: "Part II: Geography of Thailand", marks: null }
