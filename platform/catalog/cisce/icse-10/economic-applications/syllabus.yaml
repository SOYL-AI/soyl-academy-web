# ICSE Class 10 Economic Applications (code 87, Group III) - ICSE 2027 examination, CLASS X portion only.
# Source: platform/catalog/sources/cisce.md#icse-2027-economic-applications. Topic wording is our own summary of the official scope.
subject_id: icse-10-economic-applications
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-economic-applications, icse-2027-regulations]
exam_notes: >-
  Economic Applications (87) is a Group III subject: the external theory paper and the internal assessment each carry
  50% of the subject result. One theory paper of 2 hours, 100 marks, set only on the Class X syllabus (Class IX portion
  is not examined in ICSE 2027). Internal assessment 100 marks: a minimum of four assignments during the year (for example
  analysing demand for a household product, building demand and supply tables for a commodity to find the equilibrium
  price, classifying goods as price elastic or inelastic, studying a privatised public enterprise, visiting a bank branch,
  surveying reactions to interest-rate cuts, examining product differentiation in consumer goods, tracing the factors of
  production used by a company), marked 50 by the subject teacher and 50 by an external examiner on preparation,
  procedure, observation, inference and presentation. Case studies are suggested on factors of production, banking and
  inflation. Candidates offering Economics (Group II) may not offer Economic Applications.
  CISCE lists numbered topics, not textbook chapters: SOYL groups them into 11 teachable chapters in syllabus order.
  No unit-wise marks weightage is published.
units:
  - { name: "1: Demand and Supply", marks: null }
  - { name: "2: Factors of Production", marks: null }
  - { name: "3: Alternative Market Structures", marks: null }
  - { name: "4: The State and Economic Development", marks: null }
  - { name: "5: Money and Banking", marks: null }
chapters:
  - id: icse-10-economic-applications-ch01
    number: 1
    title: "Demand and the Law of Demand"
    unit: "1: Demand and Supply"
    topics:
      - id: icse-10-economic-applications-ch01-t01
        title: "Meaning of demand; joint, derived and composite demand"
        learning_outcomes:
          - "Define demand and distinguish it from desire and want"
          - "Classify given examples as joint, derived or composite demand"
      - id: icse-10-economic-applications-ch01-t02
        title: "Law of demand: individual and market demand schedules and curves"
        learning_outcomes:
          - "State the law of demand and its assumptions"
          - "Construct a market demand schedule by adding individual schedules and draw the corresponding curves"
      - id: icse-10-economic-applications-ch01-t03
        title: "Determinants of demand"
        learning_outcomes:
          - "Explain how price, income, prices of related goods, tastes and expectations affect demand"
      - id: icse-10-economic-applications-ch01-t04
        title: "Movement along versus shift of the demand curve"
        learning_outcomes:
          - "Distinguish an extension or contraction of demand from an increase or decrease in demand with diagrams"
          - "Identify whether a given change causes a movement along or a shift of the demand curve"
      - id: icse-10-economic-applications-ch01-t05
        title: "Exceptions to the law of demand"
        learning_outcomes:
          - "Explain exceptions such as Giffen goods, prestige goods, expected price rise and necessities"
