          - "Explain why Java is called platform independent"
      - id: icse-10-computer-applications-ch01-t04
        title: "Objects and classes: state and behaviour, class as blueprint and object factory, message passing"
        learning_outcomes:
          - "Identify the attributes and methods of a real-world entity modelled as an object"
          - "Explain a class as a user-defined data type and an object as its instance"
