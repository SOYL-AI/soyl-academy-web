# ICSE Class 10 Computer Applications (86) - ICSE 2027 examination.
# Source: platform/catalog/sources/cisce.md#icse-2027-computer-applications (CLASS X section only). Topic wording is our own summary of the official scope.
subject_id: icse-10-computer-applications
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-computer-applications, icse-2027-regulations, cisce-circular-specimen-papers-2027]
exam_notes: >-
  Group III subject, weighted 50% external examination and 50% internal assessment (Regulations).
  One written theory paper of 2 hours, 100 marks, plus internal assessment of 100 marks: at least 20 programming
  assignments in Java during the year, marked 50 by the subject teacher and 50 by an external examiner on class design,
  variable description, coding and documentation, and execution/output. Programs are written in Java using BlueJ or any
  IDE with a JDK. No 2027 specimen paper was released for Class X Computer Applications (the October 2026 circular lists
  it only for Class IX), so the 2026 paper format continues: a compulsory short-answer and output-based Section A and a
  Section B of programs with a choice of questions.
  The Class X syllabus begins with a revision of the Class IX topics, which are examined in the Class X paper; SOYL groups
  that revision into five chapters, then follows the seven new Class X sections in order (13 chapters in all).
  No unit-wise marks weightage is published.
units:
  - { name: "1. Revision of Class IX Syllabus", marks: null }
  - { name: "2. Class as the Basis of all Computation", marks: null }
  - { name: "3. User-defined Methods", marks: null }
  - { name: "4. Constructors", marks: null }
  - { name: "5. Library Classes", marks: null }
  - { name: "6. Encapsulation", marks: null }
  - { name: "7. Arrays", marks: null }
  - { name: "8. String Handling", marks: null }
chapters:
