sections:
  - id: A
    title: Section A - Compulsory (40 marks)
    instructions: >-
      Attempt all questions. Question 1: 20 multiple-choice items of 1 mark on Java concepts, syntax and library methods. Question 2:
      ten 2-mark items - short answers (write a Java expression or statement, explain, find the error) and predict-the-output items.
    items:
      - {type: mcq, count: 20, marks_each: 1}
      - {type: short, count: 6, marks_each: 2}
      - {type: code-output, count: 4, marks_each: 2}
  - id: B
    title: Section B - Any four of six programs (60 marks)
    instructions: >-
      Attempt any four of the six questions, 15 marks each. Each asks for a complete Java program (class design, methods, constructors,
      arrays, strings, menus) written in BlueJ style with variable descriptions or comments; marks go to logic, syntax and documentation.
    items:
      - {type: long, count: 6, marks_each: 15, internal_choice: {attempt: 4, of: 6}}
