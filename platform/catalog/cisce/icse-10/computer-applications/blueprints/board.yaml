notes: >-
  ICSE 2027 Computer Applications (86), a Group III subject: one theory paper of two hours, 100 marks (VERIFIED from the ICSE 2027
  syllabus, icse-2027-computer-applications); the internal assessment of 100 marks (programming assignments) is not modelled.
  UNVERIFIED: the section layout - Section A 40 compulsory (20 x 1 MCQ, 10 x 2 short / output items), Section B any four of six
  15-mark programs - is the 2026-cycle format, which the October 2026 circular keeps for 2027 (no 2027 Class X specimen; the circular
  lists Computer Applications for Class IX only). The 2026 paper could not be fetched (icse-2026-computer-applications-paper; owner
  request in the handoff), so the layout comes from recent ICSE papers and the 6 / 4 split of Question 2 between short answers and
  predict-the-output items is SOYL's. No mark_shares: CISCE publishes no competency design for this subject in 2027.
  Programs are self-evaluated or AI-evaluated against a marking scheme; predict-the-output items are auto-graded (code-output).
