sections:
  - id: A
    title: Section A - Compulsory (40 marks)
    instructions: >-
      Attempt all questions. Question 1: 15 multiple-choice items of 1 mark (one assertion-reason); write the correct answers only.
      Question 2: six 1-mark fill-ins choosing the correct word from a bracket, a 2-mark match-the-columns item and a 2-mark data or
      graph item. Question 3: six 2-mark items and one 3-mark item (definitions, short reasoning, short numericals, diagrams).
    items:
      - {type: mcq, count: 14, marks_each: 1}
      - {type: assertion-reason, count: 1, marks_each: 1}
      - {type: fill-blank, count: 6, marks_each: 1}
      - {type: match, count: 1, marks_each: 2}
      - {type: short, count: 7, marks_each: 2}
      - {type: short, count: 1, marks_each: 3}
  - id: B
    title: Section B - Any four of six (40 marks)
    instructions: >-
      Attempt any four of Questions 4-9, 10 marks each. On the board paper each question has three parts (3 + 3 + 4 marks: ray diagrams,
      numericals, graphs, experiments) that may come from different topics; SOYL sets each as one structured multi-part question on one
      chapter.
    items:
      - {type: long, count: 6, marks_each: 10, internal_choice: {attempt: 4, of: 6}}
source_status: verified
source: icse-2027-specimen-521-physics
notes: >-
  ICSE 2027 Science (52) Paper 1 Physics, specimen paper code 521: one theory paper of two hours (plus 15 minutes reading time),
  80 marks; internal assessment of practical work 20 marks is not modelled. Section A (40, compulsory): Q1 15 x 1 MCQ incl. 1
  assertion-reason; Q2 6 x 1 fill-ins + a 2-mark match + a 2-mark graph item; Q3 6 x 2 + 1 x 3. Section B (40): any four of six
  10-mark questions. Numericals are constructed responses with step marks (short/long slots also accept the numerical type).
  mark_shares 0.5 / 0.5: the October 2026 circular (cisce-circular-specimen-papers-2027) gives higher-order questions an approximate
  weightage of 50% in 2027. CISCE publishes no unit-wise marks for ICSE Physics, so no unit weightage is applied.
  Deviation: one chapter per question in the item model, so a Section B question cannot mix topics across its parts.
