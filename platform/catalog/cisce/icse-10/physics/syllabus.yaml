# ICSE Class 10 Physics (Science Paper 1) - ICSE 2027 examination.
# Source: platform/catalog/sources/cisce.md#icse-2027-physics. Topic wording is our own summary of the official scope.
subject_id: icse-10-physics
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-physics, icse-2027-regulations, icse-2027-specimen-papers, cisce-circular-specimen-papers-2027]
exam_notes: >-
  One theory paper of 2 hours, 80 marks, plus internal assessment of practical work 20 marks
  (10 subject teacher + 10 external examiner; about ten experiments). SI units throughout.
  The 2027 specimen paper (code 521) has Section A (40 marks, compulsory; Question 1 is 15 one-mark objective items) and
  Section B (40 marks, any four of six 10-mark questions); about 50% of marks target higher-order skills (apply, analyse, evaluate, create) per the October 2026 circular.
  CISCE publishes a topic list in six sections, not textbook chapters: SOYL groups it into 12 teachable chapters in
  syllabus order (conservation of energy is taught with work and energy, before machines, as in common ICSE texts).
  No unit-wise marks weightage is published for ICSE Physics.
units:
  - { name: "1. Force, Work, Power and Energy", marks: null }
  - { name: "2. Light", marks: null }
  - { name: "3. Sound", marks: null }
  - { name: "4. Electricity and Magnetism", marks: null }
  - { name: "5. Heat", marks: null }
  - { name: "6. Modern Physics", marks: null }
chapters:
  - id: icse-10-physics-ch01
    number: 1
    title: "Force: Turning Effect and Circular Motion"
    unit: "1. Force, Work, Power and Energy"
    topics:
      - id: icse-10-physics-ch01-t01
        title: "Translational and rotational motion; moment of a force (torque) and its SI and cgs units"
        learning_outcomes:
          - "Distinguish translational from rotational motion with everyday examples"
          - "Calculate the moment of a force about a point as force times perpendicular distance, in N m and dyne cm"
          - "Explain why door handles and spanners are placed far from the axis of rotation"
      - id: icse-10-physics-ch01-t02
        title: "Clockwise and anticlockwise moments; resultant moment"
        learning_outcomes:
          - "Identify the sense of rotation produced by a force and assign sign conventions to moments"
          - "Calculate the resultant moment when several forces act on a rigid body"
      - id: icse-10-physics-ch01-t03
        title: "Equilibrium: conditions for translational and rotational equilibrium; principle of moments"
        learning_outcomes:
          - "State the two conditions for a body to be in equilibrium"
          - "Apply the principle of moments to find an unknown force or distance on a balanced metre rule"
          - "Describe how the principle of moments is verified with a metre rule and spring balances"
      - id: icse-10-physics-ch01-t04
        title: "Centre of gravity of regular bodies and irregular laminae (qualitative)"
        learning_outcomes:
          - "Locate the centre of gravity of regular shapes such as a rod, ring, disc and triangle"
          - "Describe the plumb-line method of finding the centre of gravity of an irregular lamina"
      - id: icse-10-physics-ch01-t05
        title: "Uniform circular motion; centripetal and centrifugal force"
        learning_outcomes:
          - "Explain why uniform circular motion is accelerated even though speed is constant"
          - "Differentiate centripetal force from centrifugal force with examples"
    removed_topics: []
    literature_texts: []
  - id: icse-10-physics-ch02
    number: 2
    title: "Work, Energy and Power"
    unit: "1. Force, Work, Power and Energy"
    topics:
      - id: icse-10-physics-ch02-t01
        title: "Work done by a force: W = F s cos(theta); special cases at 0 and 90 degrees; work against gravity W = mgh"
        learning_outcomes:
          - "Calculate work done when force and displacement are at a given angle"
          - "Explain why no work is done when the force is perpendicular to the displacement"
      - id: icse-10-physics-ch02-t02
        title: "Energy as capacity to do work; units of work and energy (joule, erg, calorie, kW h, eV) and conversions"
        learning_outcomes:
          - "Convert between joule, erg, calorie, kilowatt-hour and electron volt"
      - id: icse-10-physics-ch02-t03
        title: "Power: P = W/t; units watt, kW, MW, GW and horsepower"
        learning_outcomes:
          - "Calculate power from work and time and convert horsepower to watts"
          - "Distinguish energy from power using an example such as two people climbing stairs"
      - id: icse-10-physics-ch02-t04
        title: "Mechanical energy: gravitational potential energy U = mgh and kinetic energy K = (1/2)mv^2 with derivations"
        learning_outcomes:
          - "Derive U = mgh and K = (1/2)mv^2 from the definition of work"
          - "Solve numerical problems on potential and kinetic energy for translational motion"
          - "Name the forms of kinetic energy: translational, rotational and vibrational"
      - id: icse-10-physics-ch02-t05
        title: "Other forms of energy and energy conversions in daily life"
        learning_outcomes:
          - "Identify energy conversions in devices such as a battery, loudspeaker, solar cell and electric heater"
      - id: icse-10-physics-ch02-t06
        title: "Principle of conservation of energy; U + K constant for a freely falling body; simple pendulum (qualitative)"
        learning_outcomes:
          - "State the principle of conservation of energy"
          - "Show by calculation that total mechanical energy stays constant at different heights of a freely falling body"
          - "Describe energy changes during one oscillation of a simple pendulum"
    removed_topics:
      - "Numerical problems on kinetic and potential energy for rotational or vibrational motion (only translational motion is examined)"
    literature_texts: []
  - id: icse-10-physics-ch03
    number: 3
    title: "Machines"
    unit: "1. Force, Work, Power and Energy"
    topics:
      - id: icse-10-physics-ch03-t01
        title: "Machines as force multipliers; load, effort, mechanical advantage, velocity ratio, input, output and efficiency"
        learning_outcomes:
          - "Define mechanical advantage, velocity ratio and efficiency and state their units (if any)"
          - "Derive the relation efficiency = MA / VR"
          - "Explain why MA is less than VR and efficiency is less than 1 for every practical machine"
      - id: icse-10-physics-ch03-t02
        title: "Levers: principle; first, second and third class levers; MA and VR of each class"
        learning_outcomes:
          - "Classify a given lever by the relative positions of fulcrum, load and effort"
          - "Predict whether a lever's MA is greater than, equal to, or less than 1 from its class"
      - id: icse-10-physics-ch03-t03
        title: "Levers in the human body"
        learning_outcomes:
          - "Identify the class of lever at the neck, foot (raising heels) and forearm"
      - id: icse-10-physics-ch03-t04
        title: "Pulley systems: single fixed, single movable, block and tackle; MA, VR and efficiency"
        learning_outcomes:
          - "Calculate MA, VR and efficiency of a block and tackle system, including the effect of the weight of the movable block"
          - "Explain the practical advantage of a single fixed pulley despite MA = 1"
    removed_topics: []
    literature_texts: []
  - id: icse-10-physics-ch04
    number: 4
    title: "Refraction of Light at Plane Surfaces"
    unit: "2. Light"
    topics:
      - id: icse-10-physics-ch04-t01
        title: "Partial reflection and refraction; laws of refraction; effect on speed, wavelength and frequency"
        learning_outcomes:
          - "State the laws of refraction"
          - "Explain which of speed, wavelength and frequency change when light enters a denser medium"
          - "State the conditions under which a ray passes undeviated"
      - id: icse-10-physics-ch04-t02
        title: "Refractive index: mu = c/v and v = f x lambda; typical values for water, glass and diamond"
        learning_outcomes:
          - "Calculate refractive index from speeds of light"
          - "Calculate the speed of light in a medium of known refractive index"
      - id: icse-10-physics-ch04-t03
        title: "Refraction through a rectangular glass block; lateral displacement; multiple images in a thick mirror"
        learning_outcomes:
          - "Draw the path of a ray through a glass block and mark the lateral displacement"
          - "Explain the formation of multiple images in a thick plane mirror"
      - id: icse-10-physics-ch04-t04
        title: "Real and apparent depth; apparent bending of a stick in water"
        learning_outcomes:
          - "Use refractive index = real depth / apparent depth in numerical problems"
          - "Draw a ray diagram explaining why a pool looks shallower than it is"
      - id: icse-10-physics-ch04-t05
        title: "Refraction through a triangular prism; deviation"
        learning_outcomes:
          - "Trace the path of a ray through a prism and mark the angle of deviation"
      - id: icse-10-physics-ch04-t06
        title: "Critical angle and total internal reflection (mu = 1/sin C); conditions; TIR in triangular prisms (60-60-60, 30-60-90, 45-45-90); comparison with plane-mirror reflection"
        learning_outcomes:
          - "State the two conditions for total internal reflection"
          - "Calculate the critical angle from the refractive index"
          - "Draw ray diagrams for right-angled isosceles prisms deviating light through 90 and 180 degrees"
          - "Give two advantages of a totally reflecting prism over a plane mirror"
    removed_topics: []
    literature_texts: []
  - id: icse-10-physics-ch05
    number: 5
    title: "Refraction through Lenses"
    unit: "2. Light"
    topics:
      - id: icse-10-physics-ch05-t01
        title: "Convex and concave lenses; lens as a set of prisms; centre of curvature, principal axis, optical centre, foci, focal plane, focal length"
        learning_outcomes:
          - "Label the principal axis, optical centre, principal foci and focal length on a lens diagram"
          - "Explain converging and diverging action using the lens-as-prisms model"
      - id: icse-10-physics-ch05-t02
        title: "Principal (construction) rays and images formed by a convex lens for different object positions"
        learning_outcomes:
          - "Draw ray diagrams for an object at infinity, beyond 2F, at 2F, between F and 2F, at F and within F"
          - "State the position, nature and relative size of the image in each case"
      - id: icse-10-physics-ch05-t03
        title: "Images formed by a concave lens"
        learning_outcomes:
          - "Draw a ray diagram for a concave lens and state why its image is always virtual, erect and diminished"
      - id: icse-10-physics-ch05-t04
        title: "Sign convention, lens formula 1/v - 1/u = 1/f and magnification (direct numerical problems)"
        learning_outcomes:
          - "Apply the New Cartesian sign convention to object and image distances"
          - "Solve direct numerical problems using the lens formula and magnification"
      - id: icse-10-physics-ch05-t05
        title: "Power of a lens in dioptre; simple microscope (magnifying glass); applications of lenses"
        learning_outcomes:
          - "Calculate the power of a lens from its focal length with the correct sign"
          - "Locate the image in a magnifying glass by ray diagram and state its nature"
    removed_topics:
      - "Derivation of the lens formula"
      - "Scale drawing or graphical determination of images"
      - "Formula and numerical problems on magnifying power of a simple microscope"
    literature_texts: []
  - id: icse-10-physics-ch06
