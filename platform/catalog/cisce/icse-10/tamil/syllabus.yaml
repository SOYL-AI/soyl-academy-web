      - id: icse-10-tamil-ch05-t04
        title: "Synthesis: combining two or more sentences into one"
        learning_outcomes:
          - "Combine two or more simple sentences into one compound or complex sentence"
      - id: icse-10-tamil-ch05-t05
        title: "Making sentences that correctly use given words or forms"
        learning_outcomes:
          - "Use a given word, phrase or form correctly in a meaningful sentence"
    removed_topics:
      - "Knowledge of grammatical terms as such (CISCE: the grammar question does not require it)"
    literature_texts: []
  - id: icse-10-tamil-ch06
    number: 6
    title: "Drama: Rajaraja Cholan (Scenes 21 to 39)"
    unit: "Section B: Prescribed Texts"
    topics:
      - id: icse-10-tamil-ch06-t01
        title: "Scenes 21-26: events and development of the plot"
        learning_outcomes:
          - "Narrate the main events of these scenes in order"
      - id: icse-10-tamil-ch06-t02
        title: "Scenes 27-32: conflicts and turning points"
        learning_outcomes:
          - "Explain the main conflicts in these scenes and how they develop"
      - id: icse-10-tamil-ch06-t03
        title: "Scenes 33-39: the later events of the prescribed portion"
        learning_outcomes:
          - "Summarise how the prescribed portion ends and give a personal response"
      - id: icse-10-tamil-ch06-t04
        title: "Rajaraja Chola and other major characters"
        learning_outcomes:
          - "Write a character sketch of Rajaraja Chola or another major character with examples from the play"
      - id: icse-10-tamil-ch06-t05
        title: "Historical background: the Chola empire as presented in the play"
        learning_outcomes:
          - "Relate the play to the history of the Chola empire and Rajaraja Chola I"
      - id: icse-10-tamil-ch06-t06
        title: "Dramatic technique: dialogue, stage directions and scene structure"
        learning_outcomes:
          - "Comment on how dialogue and stage directions create character and suspense"
    removed_topics:
