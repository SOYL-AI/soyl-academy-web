# ICSE Class 10 Fashion Designing (Group III elective, code 70) - ICSE 2027 examination.
# Source: platform/catalog/sources/cisce.md#icse-2027-fashion-designing. Class X portion only. Topic wording is our own summary of the official scope.
subject_id: icse-10-fashion-designing
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-fashion-designing, icse-2027-regulations]
exam_notes: >-
  One theory paper of 2 hours, 100 marks, plus internal assessment 100 marks; the external paper and internal
  assessment each carry 50% of the subject result (Group III). Internal assessment is practical needlework: at least
  five practical-oriented assignments set by the teacher in Class X (needlework tools and processes, parts of a dress
  such as necklines, collars, sleeves, cuffs, pockets, buttonholes and zips, making garments such as blouses, skirts and
  salwar-kameez, sewing for the home, children's clothes) plus finished work of two dresses or combinations, or a set of
  four pieces, for the External Examiner; marked 50 by the subject teacher and 50 by the External Examiner. Practical
  work is not covered as chapters here.
  The Class IX theory (fibres and fabrics, buying fabric and estimating quantity, choice of clothes) is in
  icse-9-fashion-designing. CISCE lists only four brief Class X topics; SOYL breaks them into teachable chapters in
  syllabus order, using standard dressmaking content that falls within each topic (the detailed breakdown is SOYL's,
  not CISCE's). No topic-wise marks weightage is published.
