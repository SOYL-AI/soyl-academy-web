# ICSE Class 10 Performing Arts: Hindustani Music (Group III elective, code 91) - ICSE 2027 examination.
# Source: platform/catalog/sources/cisce.md#icse-2027-performing-arts. Class X portion only; theory paper only.
# Topic wording is our own summary of the official scope.
subject_id: icse-10-hindustani-music
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-performing-arts, icse-2027-regulations]
exam_notes: >-
  Part 1 Theory: one written paper of 2 hours, 100 marks. Part 2: internal assessment of practical work, 100 marks
  (50 subject teacher + 50 External Examiner), assessed in Class X; the external paper and internal assessment each
  carry 50% of the subject result (Group III). The theory syllabus has three sections - A Vocal, B Instrumental
  (excluding tabla), C Tabla; a candidate studies the section that matches the vocal, instrumental or tabla work
  they perform. Practical work (singing or playing alankars in Teentaal, Jhaptaal and Dadra; khayals or gats in
  Bhairav, Bhoopali, Desh, Bageshri and Malkauns with alaap, taan, toda and jhala; tarana or dhun; padhant of thekas
  with tali and khali in dugun and chaugun; raga identification by ear; tabla bols, developments and accompaniment;
  course work such as performances, a presentation on an eminent musician, a recording-studio visit) is assessed on
  purity of swar, laya, knowledge of raga/taal, recall of concepts and overall presentation; it is not taught as
  chapters here.
  The Class X theory explicitly includes the five ragas and five taals learnt in Class IX, so those are covered here.
  Other Class IX theory (the Class IX term lists, Jati, Varna and Laya, the lives of Tansen and Pt. V.N. Bhatkhande)
  is in icse-9-hindustani-music and is assumed background.
  CISCE lists numbered theory items per section, not chapters: SOYL groups them into teachable chapters in syllabus
  order, placing theory that is identical for Sections A and B in one common unit. No marks weightage by section or
  topic is published.
