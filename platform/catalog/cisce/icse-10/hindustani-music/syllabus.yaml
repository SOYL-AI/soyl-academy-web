    number: 1
    title: "Sound, Nad and Shruti"
    unit: "Sections A and B: Common theory (Vocal and Instrumental)"
    topics:
      - id: icse-10-hindustani-music-ch01-t01
        title: "Sound (Dhwani): musical sound versus noise; Nad and its kinds (Ahat and Anahat)"
        learning_outcomes:
          - "Distinguish musical sound from noise in terms of regular vibration"
          - "Define Nad and explain the difference between Ahat and Anahat Nad"
      - id: icse-10-hindustani-music-ch01-t02
        title: "Three qualities of Nad: volume (magnitude), pitch and timbre (quality)"
        learning_outcomes:
          - "Relate volume to amplitude and pitch to frequency of vibration"
          - "Explain why the same note sounds different on a sitar and in the human voice"
      - id: icse-10-hindustani-music-ch01-t03
        title: "Shruti: the 22 shrutis and the placement of the 12 swaras (7 shuddha and 5 vikrit) on them"
        learning_outcomes:
          - "Define shruti and state how many shrutis are recognised in an octave"
          - "Show the placement of the shuddha and vikrit swaras on the 22 shrutis in a table"
