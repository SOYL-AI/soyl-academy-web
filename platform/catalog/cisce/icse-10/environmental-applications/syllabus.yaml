# ICSE Class 10 Environmental Applications (code 89, Group III) - ICSE 2027 examination, CLASS X portion only.
# Source: platform/catalog/sources/cisce.md#icse-2027-environmental-applications. Topic wording is our own summary of the official scope.
subject_id: icse-10-environmental-applications
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-environmental-applications, icse-2027-regulations]
exam_notes: >-
  Environmental Applications (89) is a Group III subject: the external written paper and the internal assessment each
  carry 50% of the subject result. One paper of 2 hours, 100 marks, set only on the Class X syllabus (Class IX portion
  is not examined in ICSE 2027). Internal assessment 100 marks: students are recommended to complete two case studies
  (secondary-data reports of about 1500 words, for example on Tarun Bharat Sangh, Ralegan Siddhi, the Bhopal and Chernobyl
  tragedies, river-water disputes or large dams) and one project based mainly (50-70%) on primary field data (for
  example monitoring traffic pollution, plastic disposal, sewage water wastage, non-conventional power); an optional viva
  may be held. Marked 50 by the subject teacher and 50 by an external examiner. The syllabus also suggests field visits
  and activities (industry waste treatment, improved chulha and solar cooker models, pollution control board, dams and
  catchments, Khadi units, power and biogas plants, rainwater harvesting); these are not separate theory topics.
  Candidates offering Environmental Science (Group II) may not offer Environmental Applications.
  CISCE lists numbered topics, not textbook chapters: SOYL groups them into 12 teachable chapters in syllabus order.
  No unit-wise marks weightage is published.
