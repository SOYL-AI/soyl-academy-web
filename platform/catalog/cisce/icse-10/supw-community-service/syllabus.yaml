# ICSE Class 10 Socially Useful Productive Work and Community Service (SUPW) - ICSE 2027 certificate requirement.
# Source: platform/catalog/sources/cisce.md#icse-2027-supw. Topic wording is our own summary; SUPW is mainly practical work.
subject_id: icse-10-supw-community-service
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-supw, icse-2027-regulations]
exam_notes: >-
  No written board paper. SUPW and Community Service are assessed internally by the school over Classes IX and X
  (each marked out of 50 and combined into an order of merit out of 100); the Head of School submits a grade A-E
  (A Very Good to E Unsatisfactory) for Class X, and grade E is a fail. Each year the candidate takes one main craft
  and one subsidiary service, or one main service and one subsidiary craft, from five areas (health and hygiene, food,
  shelter, clothing, cultural and recreational). SUPW is assessed on preparation 5, organisation 10, skills 20,
  research 10 and interest 5; community service on preparation 5, organisation 10, skills 20, resourcefulness 10 and
  interest 5, recorded on a record card (and, for day scholars, a parent-signed diary of home and neighbourhood service).
  The hands-on craft work itself is practical and is not listed as chapters. CISCE recommends an optional
  Contemporary Studies component, correlated with SUPW, with a Class X topic list (the Class IX list is not included here):
  SOYL covers it in chapters 2-5, after a chapter on planning and recording SUPW projects. The document gives no
  weightage for Contemporary Studies.
units:
  - { name: "SUPW and Community Service: Work Practice", marks: null }
  - { name: "Contemporary Studies (optional, Class X)", marks: null }
chapters:
  - id: icse-10-supw-community-service-ch01
    number: 1
    title: "Planning, Doing and Recording SUPW and Community Service"
    unit: "SUPW and Community Service: Work Practice"
    topics:
      - id: icse-10-supw-community-service-ch01-t01
        title: "Main and subsidiary crafts and services in the five areas: health and hygiene, food, shelter, clothing, cultural and recreational"
        learning_outcomes:
          - "Give examples of main and subsidiary crafts or services in each of the five areas"
          - "Distinguish SUPW (making useful articles or practising a skill) from community service (work that benefits the community)"
      - id: icse-10-supw-community-service-ch01-t02
        title: "Preparation: choosing a socially useful craft or service within one's capability; forming teams and choosing a leader"
        learning_outcomes:
          - "Justify the choice of a craft or service in terms of social usefulness and own capability"
      - id: icse-10-supw-community-service-ch01-t03
        title: "Organisation: tools, materials and processes; drawing up a timetable or programme of work"
        learning_outcomes:
          - "Write a work plan listing tools, materials, steps and a timetable for a chosen craft or service"
      - id: icse-10-supw-community-service-ch01-t04
        title: "Research and resourcefulness: analysing a process, suggesting improvements and improvising"
        learning_outcomes:
          - "Suggest an improvement to a craft process or a way around a problem met during community service"
      - id: icse-10-supw-community-service-ch01-t05
        title: "Record keeping and assessment: record card, home-service diary and grades A to E"
        learning_outcomes:
          - "Maintain a record of work done with dates, nature of work and time spent"
          - "Explain the assessment areas and how grades are awarded"
