# ICSE Class 10 Hospitality Management (code 73, Group III) - ICSE 2027 examination, CLASS X portion only.
# Source: platform/catalog/sources/cisce.md#icse-2027-hospitality-management. Topic wording is our own summary of the official scope.
# Theory-only file: practical and project work is described in exam_notes, not as chapters.
subject_id: icse-10-hospitality-management
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-hospitality-management, icse-2027-regulations]
exam_notes: >-
  Hospitality Management (73) is a Group III subject: the external written paper and the internal assessment each carry
  50% of the subject result. One written paper of 2 hours, 100 marks, set only on the Class X syllabus (Class IX portion
  is not examined in ICSE 2027). Internal assessment 100 marks: a minimum of four assignments during the year (for example
  describing two tourist spots of the State against the four A's, popular local street foods, profiling 5-star hotels in
  the city, demonstrating napkin folds, planning menus with table set-ups for three occasions, identifying kitchen and F&B
  equipment, comparing safety and hygiene at home and in hotels, sustainable tourist destinations, a grooming and
  etiquette role play, comparing four types of hotels), marked 50 by the subject teacher and 50 by an external examiner.
  SOYL covers the written-paper theory only; hands-on demonstrations (napkin folding, table set-up, role play) belong to
  the internal assessment.
  CISCE lists numbered topics, not textbook chapters: SOYL groups them into 6 teachable chapters in syllabus order.
  No unit-wise marks weightage is published.
units:
  - { name: "1: Soft Skills", marks: null }
  - { name: "2: Tourism Products", marks: null }
  - { name: "3: Hotels", marks: null }
  - { name: "4: Operational Departments of Hotels", marks: null }
chapters:
