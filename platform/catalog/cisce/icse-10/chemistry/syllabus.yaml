# ICSE Class 10 Chemistry (Science Paper 2) - ICSE 2027 examination.
# Source: platform/catalog/sources/cisce.md#icse-2027-chemistry (CLASS X section only). Topic wording is our own summary of the official scope.
subject_id: icse-10-chemistry
academic_year: "2026-27"
source_status: verified
sources: [icse-2027-chemistry, icse-2027-regulations, icse-2027-specimen-papers, cisce-circular-specimen-papers-2027]
exam_notes: >-
  One theory paper of 2 hours, 80 marks, plus internal assessment of practical work 20 marks
  (10 subject teacher + 10 external examiner). Every reaction is studied with reactants, products, conditions,
  observations, balanced equations and diagrams. The 2027 specimen paper (code 522) has Section A (40 marks, compulsory;
  Question 1 is 15 one-mark objective items) and Section B (40 marks, any four of six questions); about 50% of marks target
  higher-order skills (apply, analyse, evaluate, create) per the October 2026 circular.
  Practical work (assessed internally, not in the theory chapters): identification of the gases H2, O2, CO2, Cl2, HCl, SO2,
  H2S, NH3, water vapour and NO2 and of the ions Cu, Fe, Pb, Zn, NH4+, carbonate, chloride, nitrate, sulphide, sulphite and
  sulphate; minimum exercises are action of heat on copper and zinc carbonates and on zinc, copper and lead nitrates, NaOH /
  NH4OH tests on solutions of Cu2+, Fe2+, Fe3+, Pb2+, Zn2+ and NH4+, two tests each to tell a dilute acid from an alkali, and
  warming copper oxide and manganese dioxide with concentrated HCl. No formal scheme of analysis is required.
  Both old (IA-VIIA, 0) and IUPAC (1-18) group numbering are accepted.
  CISCE publishes a topic list in nine sections, not textbook chapters: SOYL groups it into 15 teachable chapters in
  syllabus order. No unit-wise marks weightage is published for ICSE Chemistry.
