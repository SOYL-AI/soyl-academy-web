chapters:
  - id: icse-10-chemistry-ch01
    number: 1
    title: "Periodic Table, Periodic Properties and Variations of Properties"
    unit: "1. Periodic Properties and Variations of Properties"
    topics:
      - id: icse-10-chemistry-ch01-t01
        title: "Modern periodic law; periodicity based on atomic number; groups and periods up to period 4 (calcium)"
        learning_outcomes:
          - "State the modern periodic law and explain why atomic number, not atomic mass, is the basis of periodicity"
          - "Locate an element of atomic number 1 to 20 in the periodic table from its electronic configuration"
      - id: icse-10-chemistry-ch01-t02
        title: "Explaining periodic trends with nuclear charge and number of shells"
        learning_outcomes:
          - "Explain how increasing nuclear charge across a period and added shells down a group change the pull on valence electrons"
      - id: icse-10-chemistry-ch01-t03
        title: "Atomic size: definition and trends in groups and periods"
        learning_outcomes:
          - "Predict which of two given elements has the larger atomic radius and justify the answer"
          - "Explain why noble gas radii are not compared with those of other elements in a period"
      - id: icse-10-chemistry-ch01-t04
        title: "Metallic and non-metallic character: trends in groups and periods"
        learning_outcomes:
          - "Relate metallic character to the ease of losing electrons and non-metallic character to the ease of gaining them"
          - "Arrange given elements of period 3 in order of increasing metallic character"
      - id: icse-10-chemistry-ch01-t05
        title: "Ionisation potential, electron affinity and electronegativity: definitions and trends"
        learning_outcomes:
          - "Define ionisation potential, electron affinity and electronegativity"
          - "Describe how each property varies across a period and down a group and give the reason"
          - "Identify the element with the highest ionisation potential or electronegativity in a given set"
      - id: icse-10-chemistry-ch01-t06
        title: "Trends in the alkali metal (group 1) and halogen (group 17) families"
        learning_outcomes:
          - "Compare the reactivity of lithium, sodium and potassium and explain the trend using atomic size"
          - "Explain why reactivity of halogens decreases down the group from fluorine to iodine"
    removed_topics:
      - "Questions on elements beyond period 4 (calcium); the full table is shown for exposure only"
      - "Explanation of periodicity in terms of orbitals (shells only)"
    literature_texts: []
  - id: icse-10-chemistry-ch02
    number: 2
    title: "Chemical Bonding"
    unit: "2. Chemical Bonding"
    topics:
      - id: icse-10-chemistry-ch02-t01
        title: "Electrovalent (ionic) bonding: electron dot structures of NaCl, MgCl2 and CaO"
        learning_outcomes:
          - "Draw electron dot diagrams showing electron transfer in the formation of NaCl, MgCl2 and CaO"
          - "Explain why electrovalent bonds form between elements of low ionisation potential and high electron affinity"
      - id: icse-10-chemistry-ch02-t02
        title: "Properties of electrovalent compounds: state, melting and boiling points, conductivity and dissociation in solution or melt"
        learning_outcomes:
          - "Explain why ionic compounds are hard solids with high melting points"
          - "Explain why ionic compounds conduct electricity when molten or dissolved but not as solids, linking this to electrolysis"
      - id: icse-10-chemistry-ch02-t03
        title: "Covalent bonding: duplet and octet; non-polar molecules H2, Cl2, O2, N2, CCl4 and CH4"
        learning_outcomes:
          - "Draw electron dot structures showing single, double and triple shared pairs in H2, Cl2, O2 and N2"
          - "Draw electron dot structures of CH4 and CCl4 and explain why they are non-polar"
      - id: icse-10-chemistry-ch02-t04
        title: "Polar covalent molecules HCl, NH3 and H2O: electronegativity difference and structures"
        learning_outcomes:
          - "Explain the origin of partial charges in HCl, NH3 and H2O using electronegativity difference"
          - "Draw the electron dot structures of HCl, NH3 and H2O and identify lone pairs"
      - id: icse-10-chemistry-ch02-t05
        title: "Properties of covalent compounds; comparison of electrovalent and covalent compounds"
        learning_outcomes:
          - "Tabulate differences between electrovalent and covalent compounds in state, melting point, solubility and conductivity"
          - "Explain why some polar covalent compounds such as HCl ionise in water"
      - id: icse-10-chemistry-ch02-t06
        title: "Coordinate bonding: lone pair; formation of hydronium (H3O+) and ammonium (NH4+) ions"
        learning_outcomes:
          - "Define a coordinate bond and a lone pair"
          - "Draw electron dot diagrams for the formation of H3O+ from water and NH4+ from ammonia"
          - "Explain how the lone pair on water produces H3O+ and OH- ions in water"
    removed_topics: []
    literature_texts: []
  - id: icse-10-chemistry-ch03
    number: 3
    title: "Acids, Bases and Salts"
    unit: "3. Study of Acids, Bases and Salts"
    topics:
      - id: icse-10-chemistry-ch03-t01
        title: "Acids, bases and alkalis: definitions in terms of ions; ionisation and dissociation equations"
        learning_outcomes:
          - "Define an acid as a substance giving H3O+ as the only positive ion in water and an alkali as one giving OH- as the only negative ion"
          - "Write ionisation equations for HCl, H2SO4 and HNO3 and dissociation equations for NaOH and KOH"
      - id: icse-10-chemistry-ch03-t02
        title: "Indicators (litmus, methyl orange, phenolphthalein), pH scale, pH paper and universal indicator"
        learning_outcomes:
          - "State the colours of litmus, methyl orange and phenolphthalein in acidic and alkaline solutions"
          - "Classify a solution as strongly acidic, weakly acidic, neutral or alkaline from its pH value"
      - id: icse-10-chemistry-ch03-t03
        title: "Salts: definition; normal, acid, basic and complex salts"
        learning_outcomes:
          - "Explain salt formation as partial or complete replacement of the hydrogen ion of an acid by a metal"
          - "Classify given salts such as NaHSO4, Na2SO4, Pb(OH)Cl and a complex salt as normal, acid, basic or complex"
      - id: icse-10-chemistry-ch03-t04
        title: "Action of dilute acids on carbonates, hydrogen carbonates, sulphites, hydrogen sulphites and sulphides"
        learning_outcomes:
          - "Write balanced equations for the reaction of dilute acids with each class of salt and name the gas evolved"
          - "Describe a test to identify the gas evolved in each case"
      - id: icse-10-chemistry-ch03-t05
        title: "Preparation of normal salts: direct combination, displacement and precipitation (double decomposition)"
        learning_outcomes:
          - "Choose a suitable method to prepare a given salt based on its solubility"
          - "Write balanced equations for preparing salts such as iron(III) chloride, zinc sulphate and lead chloride"
      - id: icse-10-chemistry-ch03-t06
        title: "Preparation of normal salts: neutralisation of an insoluble base, titration of an alkali, and acids on carbonates and bicarbonates"
        learning_outcomes:
          - "Explain why titration is used for preparing sodium or potassium salts but excess insoluble base for copper sulphate"
          - "Write equations for preparing a salt from an acid and a carbonate or hydrogen carbonate"
    removed_topics:
      - "Details of apparatus or procedures for preparing normal salts (method and equations only)"
