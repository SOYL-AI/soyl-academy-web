notes: >-
  ICSE 2027 Science (52) Paper 2 Chemistry, specimen paper code 522: one theory paper of two hours (plus 15 minutes reading time),
  80 marks; internal assessment of practical work 20 marks is not modelled. Section A (40, compulsory): Q1 15 x 1 MCQ incl. 1
  assertion-reason; Q2 five 5-mark parts (diagram-based sub-questions as a 5-mark case item, ten 1-mark equation / naming / structure
  answers, one 5-blank bracket fill-in, one 5-pair match). Section B (40): any four of six 10-mark questions.
  No mark_shares, so no competency balance: the October 2026 circular (cisce-circular-specimen-papers-2027) gives higher-order questions (apply, analyse, evaluate, create) only an approximate overall weightage of about 50%, not a per-band design, and the engine rule (each band within 3 marks whichever alternatives are attempted) would, with single-competency 10-mark items and choice groups of 4 of 6 or more, push whole choice sections into one band and move the paper away from the specimen (follow-up in the handoff). CISCE publishes no unit-wise marks for ICSE Chemistry, so no unit weightage is applied.
  Deviation: one chapter per question in the item model, so a Section B question cannot mix topics across its parts, and the
  specimen's organic naming/structure part (Q2 v) is merged into the 1-mark short answers without a chapter scope (the board may set
  that part on any topic).
