# ICSE Class 9 French (Modern Foreign Language, Group II, code 77) - ICSE 2028 course.
# CISCE has not bifurcated this syllabus, so the whole Classes IX-X syllabus is covered. No literature is prescribed.
subject_id: icse-9-french-group-2
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-mfl-group-2, icse-2028-prescribed-books, icse-2027-class-ix-specimen-papers, icse-2028-regulations]
exam_notes: >-
  Class IX is year one of the two-year ICSE 2028 course: there is no board examination in Class IX; the school sets the Class IX examination on the portion covered during the year, normally on the ICSE paper pattern below. CISCE has not prescribed a bifurcation: the Class X (ICSE 2028) paper is set on the entire syllabus and the Class IX
  internal examination covers the portion taught in the year, so this file covers the whole syllabus. The ICSE 2028 French syllabus
  is new and aligned to CEFR level A2. One paper of 3 hours, 80 marks: (1) composition of about 120-150 words - a narrative of a past
  event, a description (e.g. of a picture) or a simple opinion text such as an article or blog - 15 marks; (2) an email of about 80-100
  words, informal or semi-formal, with the layout and subject line assessed - 15 marks; (3) comprehension - three or four reading tasks on
  short everyday documents (postcards, announcements, job advertisements, menus, classified ads) with multiple-choice, true/false with
  justification and similar questions answered in French - 30 marks; (4) grammar - short functional tasks (conjugation, fill in the
  blanks, error correction, questions and negatives, jumbled sentences, multiple choice, sentence transformation), with no grammatical
  definitions - 20 marks. The CISCE Class IX specimen paper follows this pattern (Q1 composition 15, Q2 email 15, Q3-Q5 reading 10 each,
  Q6 grammar 20). Composition and email are marked on pragmatic, sociolinguistic (politeness formulas and tone) and linguistic
  (vocabulary, grammar) competences. Internal assessment 20 marks, listening 10 and speaking 10: in Class IX four assessments, all by the
  subject teacher (the fourth at the internal final examination); listening uses two or three short audio clips (announcements, voicemail,
  dialogue) with objective questions; speaking has three tasks - interaction (1 min), prepared monologue on an annexe topic (2 min) and
  role play (3-4 min). CISCE lists the French grammar to be assessed: articles; regular, irregular, pronominal, transitive and intransitive verbs; present, passé composé with participle agreement, imparfait, plus-que-parfait, futur proche, futur simple, passé récent and present progressive; imperative, present and past conditional, reported speech, a very basic awareness of the subjunctive, active and passive voice, gerund and present participle; pronouns; adjectives; adverbs; negation; the three forms of interrogation; presentatives; time markers; nominalisation; prepositions; comparison; impersonal il phrases; connectors. The Annexe topics (A Identity and culture; B Holidays, tourism and travel; C Health, education and
  technology; D The world around) supply the vocabulary and situations for all four skills. Suggested (not prescribed) books: Imagine 2 and Edito A2 (Didier), Décibel and Explore (Goyal). The French syllabus is the same in Group II (77) and Group I (27, icse-9-french-second-language); a candidate taking a modern foreign language in Group II cannot take one in Group I. CISCE lists topics not chapters; SOYL grouped them into teachable chapters in syllabus order.
units:
  - { name: "1. Composition", marks: 15 }
  - { name: "2. Email writing", marks: 15 }
  - { name: "3. Comprehension", marks: 30 }
  - { name: "4. Grammar", marks: 20 }
  - { name: "Annexe: Topics for reading, writing, listening and speaking", marks: null }
chapters:
  - id: icse-9-french-group-2-ch01
    number: 1
    title: "Composition (Rédaction)"
    unit: "1. Composition"
    topics:
      - id: icse-9-french-group-2-ch01-t01
        title: "Composition types and planning: narrative, descriptive and opinion texts of about 120-150 words"
        learning_outcomes:
          - "Identify whether a task asks for a narrative, a description or an opinion and draw up a short plan"
          - "Write a composition of about 120-150 words in French with an introduction, body and conclusion"
      - id: icse-9-french-group-2-ch01-t02
        title: "Narrative text: recounting a past event or personal experience"
        learning_outcomes:
          - "Narrate a past event in sequence using the passé composé and the imparfait correctly"
          - "Describe feelings and reactions to the event with suitable vocabulary"
      - id: icse-9-french-group-2-ch01-t03
        title: "Descriptive text: describing a picture, a person or a place"
        learning_outcomes:
          - "Describe what a picture shows (people, place, action) and then what it suggests or what might happen next"
      - id: icse-9-french-group-2-ch01-t04
        title: "Opinion text: article, blog post, forum message or magazine contribution"
        learning_outcomes:
          - "State and justify an opinion on a familiar topic using expressions such as à mon avis, je pense que, je trouve que"
          - "Support an opinion with at least two reasons or examples"
      - id: icse-9-french-group-2-ch01-t05
        title: "Coherence, cohesion and accuracy: connectors, paragraphs and self-checking"
        learning_outcomes:
          - "Link statements with common connectors such as d'abord, ensuite, puis, enfin, cependant, donc"
          - "Check a draft against the marking criteria (content, coherence, vocabulary, grammar) and correct agreement and spelling errors"
    removed_topics: []
    literature_texts: []
