      - id: icse-9-french-group-2-ch02-t02
        title: "Informal emails to friends and family: news, invitations, thanks, holiday plans"
        learning_outcomes:
          - "Write an informal email of about 80-100 words in French sharing news or accepting or declining an invitation"
      - id: icse-9-french-group-2-ch02-t03
        title: "Semi-formal emails: demande de renseignements, remerciement, invitation"
        learning_outcomes:
          - "Write a semi-formal email asking for information, thanking someone or replying to an invitation"
      - id: icse-9-french-group-2-ch02-t04
        title: "Tone and politeness formulas (Cher / Chère ..., Bonjour Madame / Monsieur; Amitiés, Bises, Cordialement, Bien à vous)"
        learning_outcomes:
          - "Choose tu or vous and the matching greeting and closing for an informal or a semi-formal reader"
      - id: icse-9-french-group-2-ch02-t05
        title: "Covering every cue within the word limit"
        learning_outcomes:
          - "Address every cue given in the question in a logical order, within about 80-100 words"
    removed_topics: []
    literature_texts: []
