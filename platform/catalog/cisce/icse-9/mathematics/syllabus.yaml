# ICSE Class 9 Mathematics (51) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-mathematics (CLASS IX section only). Topic wording is our own summary of the official scope.
subject_id: icse-9-mathematics
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-mathematics, icse-2028-regulations]
exam_notes: >-
  There is no board examination in Class IX: the Class IX final examination is conducted internally by the school on the
  Class IX portion (ICSE 2028 Regulations), and promotion to Class X depends on cumulative achievement through the year.
  The syllabus prescribes one paper of 3 hours, 80 marks, plus internal assessment 20 marks (at least two assignments
  prescribed by the teacher, such as a survey shown graphically, a canteen or loan study, or estimating the area of a
  circle on graph paper; 10 subject teacher + 10 external examiner); school examinations usually follow this pattern.
  Logarithmic and trigonometric tables may be needed, and a question may draw on more than one branch.
  Proofs of the listed theorems are taught unless the syllabus says "without proof" (those are listed under removed_topics).
  No Class IX specimen paper was released for Mathematics.
  CISCE publishes a topic list in eight sections, not textbook chapters: SOYL groups it into 21 teachable chapters in
  syllabus order. No unit-wise marks weightage is published for ICSE Mathematics.
