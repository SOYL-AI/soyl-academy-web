# ICSE Class 9 Performing Arts: Indian Dance (Group III elective, code 94) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-performing-arts. The syllabus is printed for Classes IX and X together
# (no class split), so all of it is covered here. Theory paper only. Topic wording is our own summary of the official scope.
subject_id: icse-9-indian-dance
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-performing-arts, icse-2028-regulations]
exam_notes: >-
  There is no board examination in Class IX: the school sets the Class IX examination on the work of the year
  (ICSE 2028 Regulations), usually following the paper pattern below; the board papers are taken at the end of Class X.
  Part 1 Theory: one paper of 2 hours, 100 marks. Part 2: internal assessment of practical work, 100 marks
  (50 subject teacher + 50 External Examiner); the external paper and internal assessment each carry 50% of the
  subject result (Group III). Each candidate selects one dance style from Bharatanatyam, Kathak, Odissi, Kuchipudi,
  Manipuri and Kathakali. The theory paper may require an overview of classical dance in India and simple
  comparisons between styles; items 4 and 6 (guru-shishya lineage, repertoire and accompaniment) apply to the chosen
  style only. Practical work - Nritya (stances, neck and eye movements, at least 15 steps in three speeds, tal,
  recitation of bols, a short nritya item) and Abhinaya (asamyuta and samyuta hastas, deva hastas, dasavatara
  hastas, the nava rasas, a short abhinaya item) - is assessed on regularity, movements, facial expression and
  make-up and is not taught as chapters here.
  The syllabus is printed for Classes IX and X together with no class split, so Class IX works on all of it and the
  board paper at the end of Class X (ICSE 2028) covers the whole syllabus.
  CISCE lists seven numbered theory items, not chapters: SOYL groups them into teachable chapters in syllabus order.
  No marks weightage by item is published.
