# ICSE Class 9 Performing Arts: Carnatic Music (Group III elective, code 92) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-performing-arts (CLASS IX section only). Written paper only.
# Topic wording is our own summary of the official scope.
subject_id: icse-9-carnatic-music
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-performing-arts, icse-2028-regulations]
exam_notes: >-
  There is no board examination in Class IX: the school sets the Class IX examination on the Class IX portion
  (ICSE 2028 Regulations), usually following the pattern the syllabus prescribes - one written paper of 2 hours,
  100 marks, plus practical/internal assessment of 100 marks (50 subject teacher + 50 External Examiner), which CISCE
  has assessed by the school in Class X; the external paper and internal assessment each carry 50% of the subject
  result (Group III). Practical work - singing or playing one or more instruments, individual and group
  performance, practice for school functions or making a musical instrument, plus a test by the External Examiner in
  singing or playing one instrument - is graded on purity of swara, laya, knowledge of raga/tala, recall of concepts
  and overall presentation; it is not taught as chapters here.
  The Class IX theory has seven numbered items: technical terms; notation; raga classification (72 melakartas,
  katapayadi formula, janya ragas, ragalakshana); lakshanas of 16 ragas; manodharma sangita and gamakas; the tala
  system; musical forms. The Class X theory (history through twelve composers and theorists, instruments and the
  voice, musical sound and acoustics) is in icse-10-carnatic-music.
  CISCE lists topics, not chapters: SOYL groups them into teachable chapters in syllabus order; the 16 ragas are
  split into three chapters (melakarta ragas, then janya ragas) for teaching. No marks weightage by item is published.
