# ICSE Class 9 Economic Applications (code 87, Group III) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-economic-applications (CLASS IX section only). Topic wording is our own summary of the official scope.
subject_id: icse-9-economic-applications
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-economic-applications, icse-2028-regulations]
exam_notes: >-
  There is no board examination in Class IX: the Class IX final examination is conducted internally by the school on the
  Class IX portion (ICSE 2028 Regulations), and promotion to Class X depends on cumulative achievement through the year.
  Economic Applications (87) is a Group III subject: the written paper and the internal assessment each carry 50% of the
  subject result. The syllabus prescribes one theory paper of 2 hours, 100 marks, plus internal assessment of 100 marks;
  school examinations usually follow this pattern. Internal assessment: a minimum of four assignments during the year (for
  example surveying household spending on a common grocery item, comparing sales of bathing soaps across local shops,
  presenting the central problems of the Indian economy, comparing a developed and a developing economy, analysing public
  transport in one's city, interpreting food grain production or sector-wise contribution tables, studying India's trading
  partners and exports and imports from secondary data), marked 50 by the subject teacher and 50 by an external examiner
  on preparation, procedure, observation, inference and presentation. Case studies are suggested on globalisation,
  consumer awareness, the Bhopal gas tragedy and the Chernobyl disaster. Candidates offering Economics (Group II) may not
  offer Economic Applications. No Class IX specimen paper was released for Economic Applications.
  CISCE lists numbered topics, not textbook chapters: SOYL groups them into 9 teachable chapters in syllabus order.
  No unit-wise marks weightage is published.
