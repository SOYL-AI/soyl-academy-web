# ICSE Class 9 Physical Education (Group III elective, code 72) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-physical-education (CLASS IX section only).
# Topic wording is our own summary of the official scope. Section B: one chapter per game; candidates study any two.
subject_id: icse-9-physical-education
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-physical-education, icse-2028-regulations]
exam_notes: >-
  There is no board examination in Class IX: the Class IX final examination is conducted internally by the school on
  the Class IX portion (ICSE 2028 Regulations), and promotion to Class X depends on cumulative achievement through the
  year. The syllabus prescribes one written theory paper of 2 hours, 100 marks, plus internal assessment 100 marks;
  in the ICSE result the external paper and internal assessment each carry 50% (Group III), and school examinations
  usually follow this pattern. The Class IX paper has Section A (skeletal, muscular, respiratory and circulatory
  systems, and games and sports) and Section B, in which candidates study any two of six team games: Cricket,
  Football, Hockey, Basketball, Volleyball and Badminton. SOYL gives each game its own chapter (chapters 6-11);
  a student needs only the two games they have chosen. Internal assessment follows the Class X guidelines and is
  practical: 50 marks by the teacher(s) for skill and performance in two games or activities of the candidate's
  choice, and 50 marks by an External Examiner - physical efficiency tests (50 m run, standing long jump,
  1000 m/600 m run, push-ups, shuttle run, 30-second sit-ups) and a specialisation test in athletics, gymnastics,
  swimming, dancing or yoga. Practical work is not covered as chapters here. The Class X theory (growth and
  development, fitness, sports training, safety, nutrition, careers) is in icse-10-physical-education.
  No Class IX specimen paper was released for Physical Education.
  CISCE lists topics, not textbook chapters; SOYL groups Section A into teachable chapters in syllabus order.
  Some governing bodies and tournaments are listed as named in the CISCE document even where names have since
  changed. No section-wise marks weightage is published.
units:
  - { name: "Section A", marks: null }
  - { name: "Section B: Team Games (any two)", marks: null }
chapters:
  - id: icse-9-physical-education-ch01
    number: 1
    title: "The Skeletal System"
    unit: "Section A"
    topics:
      - id: icse-9-physical-education-ch01-t01
        title: "Identifying the major bones: cranium, vertebrae, scapula, clavicle, ribs, sternum, pelvis and the bones of the fore limb and hind limb"
        learning_outcomes:
          - "Locate and name the prescribed bones of the neck, shoulder, thorax, spine and hip on a diagram of the skeleton"
          - "Name the bones of the arm (humerus, radius, ulna, carpals, metacarpals, phalanges) and of the leg (femur, patella, tibia, fibula, tarsals, metatarsals, phalanges)"
      - id: icse-9-physical-education-ch01-t02
        title: "Functions of the skeletal system: framework and support, movement, protection, mineral storage and blood cell production"
        learning_outcomes:
          - "Explain each function of the skeleton with an example, such as the skull protecting the brain"
      - id: icse-9-physical-education-ch01-t03
        title: "Types of joints: fixed (fibrous), slightly movable (cartilaginous) and freely movable (synovial)"
        learning_outcomes:
          - "Classify joints by the amount of movement they allow and give an example of each type"
      - id: icse-9-physical-education-ch01-t04
        title: "Joint movements in physical activity: hinge, pivot, ball and socket and saddle joints; flexion, extension, abduction, adduction, rotation and circumduction"
        learning_outcomes:
          - "Define flexion, extension, abduction, adduction, rotation and circumduction"
          - "Identify the joint and the movement involved in actions such as kicking a ball or bowling in cricket"
      - id: icse-9-physical-education-ch01-t05
        title: "Benefits of exercise on the skeletal system"
        learning_outcomes:
          - "Explain how regular exercise strengthens bones and joints, improves flexibility and supports good posture"
    removed_topics: []
    literature_texts: []
  - id: icse-9-physical-education-ch02
    number: 2
    title: "The Muscular System"
    unit: "Section A"
    topics:
      - id: icse-9-physical-education-ch02-t01
        title: "Types of muscles: voluntary (skeletal), involuntary (smooth) and cardiac"
        learning_outcomes:
          - "Distinguish voluntary, involuntary and cardiac muscle by control, location and function"
      - id: icse-9-physical-education-ch02-t02
        title: "Isometric and isotonic muscle contraction"
        learning_outcomes:
          - "Define isometric and isotonic contraction and state the difference between them"
          - "Classify given exercises, such as a plank or a bicep curl, as isometric or isotonic"
      - id: icse-9-physical-education-ch02-t03
        title: "Identifying major muscles: latissimus dorsi, deltoid, rotator cuff, pectorals, biceps, triceps, abdominals, hip flexors, gluteals, hamstrings, quadriceps, gastrocnemius, tibialis anterior"
        learning_outcomes:
          - "Locate the prescribed muscles on a diagram of the human body"
          - "Name the main muscle used in actions such as pushing, jumping and kicking"
      - id: icse-9-physical-education-ch02-t04
        title: "Benefits of exercise on the muscular system"
        learning_outcomes:
          - "Explain how exercise increases strength, endurance and power and improves neuromuscular coordination, posture and flexibility"
          - "Explain why stronger, more flexible muscles reduce the chance of injury"
    removed_topics: []
    literature_texts: []
  - id: icse-9-physical-education-ch03
    number: 3
    title: "The Respiratory System"
    unit: "Section A"
    topics:
      - id: icse-9-physical-education-ch03-t01
        title: "Pathway of air: nose and mouth, pharynx, larynx, trachea, bronchi, bronchioles, lungs and alveoli; role of the diaphragm"
        learning_outcomes:
          - "Draw and label a diagram of the respiratory tract"
          - "Trace the path of air from the nose to the alveoli"
      - id: icse-9-physical-education-ch03-t02
        title: "Mechanics of breathing: external respiration, gas exchange in the alveoli and internal (cellular) respiration"
        learning_outcomes:
          - "Distinguish external respiration from internal respiration"
          - "Describe the diffusion of oxygen and carbon dioxide across the alveoli"
      - id: icse-9-physical-education-ch03-t03
        title: "Oxygen debt, lactic acid accumulation and second wind (meaning only)"
        learning_outcomes:
          - "State the meaning of oxygen debt and lactic acid accumulation during hard exercise"
          - "State what is meant by second wind in a long-distance race"
      - id: icse-9-physical-education-ch03-t04
        title: "Vital capacity and tidal volume"
        learning_outcomes:
          - "Define vital capacity and tidal volume and state the difference between them"
      - id: icse-9-physical-education-ch03-t05
        title: "Benefits of exercise on the respiratory system"
        learning_outcomes:
          - "Explain how training increases tidal volume, strengthens respiratory muscles, improves aerobic endurance and speeds recovery"
    removed_topics:
      - "Oxygen debt, lactic acid accumulation and second wind: meaning only"
    literature_texts: []
