# ICSE Class 9 Auto Service Technician (code 96, Group III Section B vocational) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-vocational-auto-service-technician (Class IX section only). Topic wording is our own summary.
subject_id: icse-9-auto-service-technician
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-vocational-auto-service-technician, icse-2028-regulations]
exam_notes: >-
  There is no board examination in Class IX: the school sets the Class IX examination on the Class IX portion. The
  syllabus prescribes one written paper of 2 hours, 100 marks: Part I-A Employability Skills 30 marks (Units 1-5) and
  Part I-B Vocational Skills 70 marks (Units 6-12); no further unit-wise weightage is published. Internal assessment of
  practical work 100 marks, assessed by the school on the Class X guidelines (subject teacher 50 and an external
  examiner nominated by the Head of School 50): Practical Work 70 (practical examination 40 - two practicals from
  different units; practical file 10; viva voce 20) and Project Work 30 (field visit or project report 10, student
  portfolio 10, viva voce 10). The syllabus pairs each theory list with practical activities (demonstrations, role
  plays, charts, field visits); these are assessed internally and are not listed as chapters here. The document has
  separate Class IX and Class X unit lists: this file covers the Class IX list only. The Class IX vocational units are
  listed briefly (Unit 12 has a single item); SOYL topics stay at the level of an introductory automobile course. No
  Class IX specimen paper is listed for this subject. CISCE lists learning outcomes unit by unit, not textbook chapters:
  SOYL groups them into 12 teachable chapters in syllabus order (chapters 1-5 = Units 1-5; Unit 6 = chapter 6; Unit 7 =
  chapter 7; Unit 8 = chapters 8-9; Unit 9 = chapter 10; Unit 10 = chapter 11; Units 11-12 = chapter 12).
units:
  - { name: "Part I-A: Employability Skills", marks: 30 }
  - { name: "Part I-B: Vocational Skills", marks: 70 }
chapters:
