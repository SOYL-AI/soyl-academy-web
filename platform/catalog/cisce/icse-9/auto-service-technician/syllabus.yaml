          - "Trace the communication cycle in a simple exchange between a service technician and a customer or colleague"
      - id: icse-9-auto-service-technician-ch01-t03
        title: "Perspectives in communication and the factors that affect them: visual perception, language, past experience, prejudices, feelings, environment"
        learning_outcomes:
