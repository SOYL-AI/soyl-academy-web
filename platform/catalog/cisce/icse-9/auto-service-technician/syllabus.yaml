        title: "Basic writing skills: phrases, kinds of sentences, parts of a sentence, parts of speech, use of articles, paragraph construction"
        learning_outcomes:
          - "Classify sentences by kind and identify the subject and predicate"
          - "Use parts of speech and articles correctly"
          - "Write a well-organised paragraph on a topic related to the subject"
