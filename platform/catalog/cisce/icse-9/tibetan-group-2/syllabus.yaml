        title: "Layout of a Tibetan letter: address, date, salutation, body, closing formula and signature"
        learning_outcomes:
          - "Set out a letter in the correct Tibetan layout, writing the date in the Tibetan date order (year, month, day)"
      - id: icse-9-tibetan-group-2-ch02-t02
        title: "Formal letters: request, complaint, enquiry, application"
        learning_outcomes:
          - "Write a formal letter of about 150 words using honorific address and respectful closing formulas"
      - id: icse-9-tibetan-group-2-ch02-t03
        title: "Informal letters to friends and family: invitation, thanks, news"
        learning_outcomes:
          - "Write an informal letter of about 150 words using familiar address and friendly closings for friends and family"
      - id: icse-9-tibetan-group-2-ch02-t04
        title: "Expanding the given suggestions into a complete letter"
        learning_outcomes:
          - "Cover every suggestion given in the question in a well-ordered letter"
