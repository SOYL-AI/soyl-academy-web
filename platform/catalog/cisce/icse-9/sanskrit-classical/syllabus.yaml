# ICSE Class 9 Sanskrit (Classical Language, Group II, code 76) - ICSE 2028 course.
# The syllabus is common to Classes IX and X with no class-wise split, so all of it is covered. No textbooks are prescribed.
subject_id: icse-9-sanskrit-classical
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-classical-language, icse-2028-second-languages, icse-2028-regulations]
exam_notes: >-
  Class IX is year one of the two-year ICSE 2028 course: there is no board examination in Class IX; the school sets the Class IX examination on the portion covered during the year, normally on the ICSE paper pattern below. The Classical Language syllabus is common to Classes IX and X and CISCE prescribes no class-wise split, so this file covers all of
  it. One paper of 2 hours, 80 marks, with three tests: (a) questions on elementary Sanskrit grammar; (b) unprepared translation of short
  prose sentences from English into Sanskrit; (c) unprepared translation from Sanskrit into English. CISCE does not publish marks per test
  and prescribes no textbooks. Internal assessment 20 marks: two or three assignments in Class IX (suggested: creative writing from stimuli
  such as recorded music or sounds, a picture, an opening sentence or a news clipping, factual and expressive writing, a film or book
  review), marked 10 by the subject teacher and 10 by an external examiner. CISCE does not list the grammar items for this paper; SOYL's
  grammar chapters follow the grammar list CISCE publishes for Sanskrit as a Group I second language in the ICSE 2028 Second Languages
  syllabus (varna and places of articulation, three kinds of sandhi, the listed noun, pronoun and numeral declensions, five lakaras for
  the listed parasmaipada, atmanepada and ubhayapada roots, karakas and upapada vibhaktis, five samasas, krit, taddhita and stri
  pratyayas) - this breakdown is SOYL's, not CISCE's. That list is printed in legacy Kruti Dev encoding in the source text and was decoded
  by SOYL. Papers are set in Sanskrit and other classical languages on request. A candidate offering Sanskrit as the Group I second
  language may not offer it here. CISCE lists topics not chapters; SOYL grouped them into teachable chapters in syllabus order.
