chapters:
  - id: icse-9-portuguese-second-language-ch01
    number: 1
    title: "Composition (Composição)"
    unit: "1. Composition"
    topics:
      - id: icse-9-portuguese-second-language-ch01-t01
        title: "Planning a composition: ideas, outline, paragraphs and linking words"
        learning_outcomes:
          - "Draw up a short plan and write a composition in Portuguese with an introduction, body and conclusion"
          - "Link ideas with connectors such as primeiro, depois, em seguida, finalmente, no entanto, por isso"
      - id: icse-9-portuguese-second-language-ch01-t02
        title: "Descriptions of people, places, festivals and events"
        learning_outcomes:
          - "Describe a person, place or festival in Portuguese using precise vocabulary and adjectives that agree in gender and number"
      - id: icse-9-portuguese-second-language-ch01-t03
        title: "Narratives: recounting an experience"
        learning_outcomes:
          - "Narrate a past experience in sequence using the pretérito perfeito and the pretérito imperfeito"
      - id: icse-9-portuguese-second-language-ch01-t04
        title: "Short explanations and directions"
        learning_outcomes:
          - "Explain how to do something or how to reach a place, using instructions and sequencing words"
      - id: icse-9-portuguese-second-language-ch01-t05
        title: "Composition from a picture, object or language stimulus"
        learning_outcomes:
          - "Write a composition prompted by a picture or object, describing the scene and imagining what happened before and after"
    removed_topics: []
