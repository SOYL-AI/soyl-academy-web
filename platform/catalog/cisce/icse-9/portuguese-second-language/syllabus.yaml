      - id: icse-9-portuguese-second-language-ch02-t03
        title: "Informal letters to friends and family: invitation, thanks, news"
        learning_outcomes:
          - "Write an informal letter using Querido(a) ..., Um abraço, Beijinhos"
      - id: icse-9-portuguese-second-language-ch02-t04
        title: "Expanding the given suggestions into a complete letter"
        learning_outcomes:
