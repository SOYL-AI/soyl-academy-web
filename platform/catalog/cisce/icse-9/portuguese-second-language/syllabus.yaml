# ICSE Class 9 Portuguese (Second Language, Group I, code 43) - ICSE 2028 course.
# CISCE has not bifurcated this syllabus, so the whole Classes IX-X syllabus is covered. No textbooks or literature are prescribed.
subject_id: icse-9-portuguese-second-language
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-mfl-group-1, icse-2028-regulations]
exam_notes: >-
  Class IX is year one of the two-year ICSE 2028 course: there is no board examination in Class IX; the school sets the Class IX examination on the portion covered during the year, normally on the ICSE paper pattern below. CISCE has not prescribed a bifurcation: the Class X (ICSE 2028) paper is set on the entire syllabus and the Class IX internal
  examination covers the portion taught in the year, so this file covers the whole syllabus. Portuguese is examined on the common Group I
  rubric that CISCE sets for Chinese (25), Tibetan (15), Modern Armenian (23), Thai (38) and Portuguese (43); papers are set on request.
  One paper of 3 hours, 80 marks, with five parts: (1) one short composition in Portuguese (explanation, directions, description or narrative)
  from a choice of subjects or picture/object stimuli; (2) a formal or informal letter, with the layout assessed; (3) an unseen passage of
  about 150 words with questions answered in Portuguese; (4) grammar - vocabulary, syntax and idiom (sentence synthesis, forming sentences
  that embody given words or forms), without detailed grammatical definitions; (5) translation Portuguese to English and English to Portuguese,
  and/or a dialogue of about 150 words on an everyday situation. CISCE does not publish marks per part. Internal assessment 20 marks
  (listening 5, speaking 5, creative writing 10; three assessments in Class IX; 10 marks subject teacher, 10 external examiner); the
  Class IX aural assignment is a passage of about 300 words read twice, with an objective test. CISCE gives no language-specific grammar
  for Portuguese: the grammar chapters are SOYL's breakdown of the rubric for this language (Portuguese, with European and Brazilian usage noted where they differ) - not CISCE's. The Annexe
  communication themes (Myself; Holiday Time and Travel; Work and Lifestyle) supply vocabulary and situations for the written and oral
  work. No textbooks are prescribed. A candidate taking a modern foreign language in Group I cannot take one in Group II. CISCE lists topics not chapters; SOYL grouped them into teachable chapters in syllabus order.
