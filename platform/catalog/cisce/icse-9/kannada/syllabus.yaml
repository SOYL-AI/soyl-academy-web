  - id: icse-9-kannada-ch06
    number: 6
    title: "Sahitya Sangama: short stories (Class IX portion)"
    unit: "Section B: Prescribed Texts"
    topics:
      - id: icse-9-kannada-ch06-t01
        title: "Shivabhutiya Kathe (Panchatantra): a Panchatantra tale: events, characters and moral"
        learning_outcomes:
          - "Narrate the tale in sequence in Kannada, in own words"
          - "State the moral of the tale and relate it to an everyday situation"
      - id: icse-9-kannada-ch06-t02
        title: "Deepavali Mahime (Janapada): a folk tale about Deepavali: events and message"
        learning_outcomes:
          - "Narrate the folk tale in sequence in Kannada, in own words"
          - "Explain what the tale says about the festival and identify features of folk storytelling in it"
      - id: icse-9-kannada-ch06-t03
        title: "Thalmege Olida Adrushta (N. Damodhara): plot, characters and message"
        learning_outcomes:
          - "Narrate the main events of the story in sequence in Kannada, in own words"
          - "Describe the main characters with examples from the story"
          - "State the theme or message and explain the significance of the title"
      - id: icse-9-kannada-ch06-t04
        title: "Tuchip, Tudand, Tubad - Ready (Chaduranga): plot, characters and message"
        learning_outcomes:
          - "Narrate the main events of the story in sequence in Kannada, in own words"
          - "Describe the main characters with examples from the story"
          - "State the theme or message and explain the significance of the title"
      - id: icse-9-kannada-ch06-t05
        title: "Garuadagambada Dasaiah (Goruru Ramaswamy Iyengar): plot, characters and message"
        learning_outcomes:
          - "Narrate the main events of the story in sequence in Kannada, in own words"
          - "Describe the main characters with examples from the story"
          - "State the theme or message and explain the significance of the title"
