# ICSE Class 9 Kannada (Second Language, code 06) - ICSE 2028 course, CLASS IX portion only.
# Literature: titles and authors only (CONTEXT section 8). Students read the texts in their own textbook.
subject_id: icse-9-kannada
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-second-languages, icse-2028-prescribed-books, cisce-circular-2026-27-33-indian-languages, icse-2028-regulations]
exam_notes: >-
  Class IX is year one of the two-year ICSE 2028 course: there is no board examination in Class IX. The school sets the
  Class IX examination, normally on the ICSE paper pattern prescribed in the Second Languages syllabus: one paper of 3
  hours, 80 marks, plus internal assessment 20 marks (marked 10 by the subject teacher and 10 by an external examiner):
  two or three assignments, two of them written - one from language and one from literature. Class IX suggestions are
  creative writing of about 300-400 words from a stimulus (recorded music or sounds, a picture, an opening sentence, a
  news clipping), one factual and one expressive piece, a film or book review, an aural exercise (listening to a talk or
  conversation and noting the main points), and literature assignments on character/theme analysis, background and
  summary. Section A Language (40 marks, compulsory): one composition from a choice of subjects (short explanations,
  directions, descriptions or narratives, possibly suggested by pictures or objects), one letter from a choice of two
  (layout assessed), an unseen passage of about 250 words with questions answered in the language, and grammar
  (vocabulary, syntax and idioms, synthesis of sentences, sentences using given words or forms; no knowledge of
  grammatical terms is required). Section A is the same in Classes IX and X. Section B Prescribed Texts (40 marks): four
  questions from ONLY two of the prescribed books, set and answered in the language. Prescribed texts are bifurcated
  (ICSE 2028 Second Languages syllabus and Appendix I; Circular 2026-27/33): the Class IX examination is set ONLY on the
  Class IX portion listed here (the Class X portion is in icse-10-kannada and listed under removed_topics). Short
  stories and poems are from Sahitya Sangama: A collection of ICSE Short Stories & Poems (Navakarnataka Publications,
  Bengaluru). CISCE describes grammar only generically; the two grammar chapters break it into item types commonly set
  in ICSE language papers - this breakdown is SOYL's, not CISCE's. CISCE lists skills and texts, not chapters; SOYL
  grouped them into teachable chapters in syllabus order. SOYL covers all four prescribed books so a student can pick
  any two. Titles are in English / CISCE transliteration; native-script titles to be added in language review.
units:
  - { name: "Section A: Language", marks: 40 }
  - { name: "Section B: Prescribed Texts", marks: 40 }
chapters:
  - id: icse-9-kannada-ch01
    number: 1
    title: "Composition writing"
    unit: "Section A: Language"
    topics:
      - id: icse-9-kannada-ch01-t01
        title: "Planning a composition: choosing a topic, outline, introduction, body and conclusion"
        learning_outcomes:
          - "Prepare an outline and write a well-organised composition in Kannada on a chosen subject"
          - "Link paragraphs in a logical order with suitable connecting words"
      - id: icse-9-kannada-ch01-t02
        title: "Descriptive and narrative compositions"
        learning_outcomes:
          - "Describe a place, person, event or experience vividly in Kannada"
          - "Narrate a sequence of events with a clear beginning, middle and end"
      - id: icse-9-kannada-ch01-t03
        title: "Short explanations, directions and argumentative compositions"
        learning_outcomes:
          - "Write clear step-by-step directions or a short explanation of a process"
          - "Present arguments for and against an issue and reach a reasoned conclusion"
      - id: icse-9-kannada-ch01-t04
        title: "Story writing and compositions suggested by a picture or object"
        learning_outcomes:
          - "Write an original story from a given opening line, proverb or outline"
          - "Write a composition based on a given picture or object"
      - id: icse-9-kannada-ch01-t05
        title: "Accuracy and style: spelling, punctuation and choice of words"
        learning_outcomes:
          - "Find and correct spelling and punctuation errors in their own writing"
          - "Choose precise and varied vocabulary suited to the subject and reader"
    removed_topics: []
    literature_texts: []
