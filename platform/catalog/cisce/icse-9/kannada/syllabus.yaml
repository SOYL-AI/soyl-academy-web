      - id: icse-9-kannada-ch03-t02
        title: "Answering factual and inferential questions in own words"
        learning_outcomes:
          - "Answer questions in own words without copying whole lines from the passage"
          - "Infer causes, consequences and the writer's attitude from the passage"
      - id: icse-9-kannada-ch03-t03
        title: "Word meanings in context, a suitable title and the message of the passage"
        learning_outcomes:
