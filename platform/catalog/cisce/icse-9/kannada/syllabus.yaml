  - id: icse-9-kannada-ch07
    number: 7
    title: "Sahitya Sangama: poems (Class IX portion)"
    unit: "Section B: Prescribed Texts"
    topics:
      - id: icse-9-kannada-ch07-t01
        title: "Vachanagalu (Basavanna & Akkamahadevi): the vachana form: devotion, sincerity and social equality"
        learning_outcomes:
          - "Explain the meaning of the prescribed vachanas in Kannada, in own words"
          - "Identify the values the vachanas teach and the features of the vachana form"
      - id: icse-9-kannada-ch07-t02
        title: "Bakasurana Vadhe (Kumaravyasa): Bhima's slaying of the demon Baka in Kumaravyasa's Bharata"
        learning_outcomes:
          - "Narrate the episode of Bakasura's killing in Kannada, in own words"
          - "Explain how the poet presents Bhima's courage and comment on the vigour of the narrative verse"
      - id: icse-9-kannada-ch07-t03
        title: "Tirukana Kanasu (Muppina Shadakshri): a beggar's dream and its lesson"
        learning_outcomes:
          - "Narrate what the beggar dreams and how the dream ends, in Kannada"
          - "Explain the lesson the poem draws from the dream"
      - id: icse-9-kannada-ch07-t04
        title: "Garathiya Hadugalu (Janapada): folk songs of women: home, family and work"
        learning_outcomes:
          - "Explain the central idea of the prescribed folk songs in Kannada, in own words"
          - "Identify features of folk song (repetition, rhythm, everyday images) with examples"
      - id: icse-9-kannada-ch07-t05
        title: "Negila Yogi (Kuvempu): the farmer as the yogi of the plough"
        learning_outcomes:
          - "Explain why the poet calls the farmer a yogi, in Kannada, in own words"
          - "Discuss the respect for the farmer's labour expressed in the poem"
    removed_topics:
