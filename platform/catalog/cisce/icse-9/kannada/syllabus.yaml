      - id: icse-9-kannada-ch04-t03
        title: "One word for a group of words"
        learning_outcomes:
          - "Replace a phrase with a single suitable word and use it in a sentence"
      - id: icse-9-kannada-ch04-t04
        title: "Words often confused and correct spelling"
        learning_outcomes:
          - "Show the difference in meaning between similar-looking or similar-sounding words through sentences"
          - "Correct misspelt words"
