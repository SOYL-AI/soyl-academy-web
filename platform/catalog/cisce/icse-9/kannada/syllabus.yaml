    literature_texts: []
  - id: icse-9-kannada-ch05
    number: 5
    title: "Grammar: sentence construction and idioms"
    unit: "Section A: Language"
    topics:
      - id: icse-9-kannada-ch05-t01
        title: "Idioms and proverbs: meaning and use in sentences"
        learning_outcomes:
          - "Explain the meaning of common Kannada idioms and proverbs and use them aptly in sentences"
      - id: icse-9-kannada-ch05-t02
        title: "Correcting errors in sentences: agreement, tense, word order and word endings"
        learning_outcomes:
          - "Identify the error in a sentence and rewrite it correctly"
      - id: icse-9-kannada-ch05-t03
        title: "Synthesis: joining and transforming sentences as directed"
        learning_outcomes:
          - "Combine two or more simple sentences into one sentence without changing the meaning"
          - "Change the form of a sentence as instructed (tense, statement to question, positive to negative)"
      - id: icse-9-kannada-ch05-t04
        title: "Making sentences with given words or forms"
        learning_outcomes:
          - "Write meaningful sentences that correctly use a given word, phrase or grammatical form"
