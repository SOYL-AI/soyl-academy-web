  - id: icse-9-tamil-ch06
    number: 6
    title: "Drama: Rajaraja Cholan (Scenes 1 to 20)"
    unit: "Section B: Prescribed Texts"
    topics:
      - id: icse-9-tamil-ch06-t01
        title: "Scenes 1-7: opening of the play and the main characters"
        learning_outcomes:
          - "Narrate the main events of these scenes in order"
      - id: icse-9-tamil-ch06-t02
        title: "Scenes 8-14: conflicts and their development"
        learning_outcomes:
          - "Explain the main conflicts in these scenes and how they develop"
      - id: icse-9-tamil-ch06-t03
        title: "Scenes 15-20: the later events of the Class IX portion"
        learning_outcomes:
          - "Summarise how the Class IX portion ends and give a personal response"
      - id: icse-9-tamil-ch06-t04
        title: "Rajaraja Chola and other major characters"
        learning_outcomes:
          - "Write a character sketch of Rajaraja Chola or another major character with examples from the play"
      - id: icse-9-tamil-ch06-t05
        title: "Historical background: the Chola empire as presented in the play"
        learning_outcomes:
          - "Relate the play to the history of the Chola empire and Rajaraja Chola I"
      - id: icse-9-tamil-ch06-t06
        title: "Dramatic technique: dialogue, stage directions and scene structure"
        learning_outcomes:
          - "Comment on how dialogue and stage directions create character and suspense"
