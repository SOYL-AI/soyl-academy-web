# ICSE Class 9 Physics (Science Paper 1) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-physics (CLASS IX section only). Topic wording is our own summary of the official scope.
subject_id: icse-9-physics
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-physics, icse-2028-regulations]
exam_notes: >-
  There is no board examination in Class IX: the Class IX final examination is conducted internally by the school on the
  Class IX portion (ICSE 2028 Regulations), and promotion to Class X depends on cumulative achievement through the year.
  The syllabus prescribes one theory paper of 2 hours, 80 marks, plus internal assessment of practical work 20 marks
  (10 subject teacher + 10 external examiner); school examinations usually follow this pattern. SI units throughout.
  Practical work (assessed internally, not in the theory chapters): a set of 6 to 10 experiments such as least count and
  readings of Vernier callipers and screw gauge, density of a glass block, volume of a pendulum bob by displacement,
  l versus T^2 graph of a simple pendulum to find g, Celsius-Fahrenheit thermometer graph, laws of reflection and image
  position in a plane mirror, focal length of a concave mirror, bulbs in series and parallel, plotting magnetic field lines
  and neutral points, and verifying Archimedes' principle with a spring balance.
  No Class IX specimen paper was released for Physics.
  CISCE publishes a topic list in eight sections, not textbook chapters: SOYL groups it into 12 teachable chapters in
  syllabus order. No unit-wise marks weightage is published for ICSE Physics.
units:
  - { name: "1. Measurements and Experimentation", marks: null }
  - { name: "2. Motion in One Dimension", marks: null }
  - { name: "3. Laws of Motion", marks: null }
  - { name: "4. Fluids", marks: null }
  - { name: "5. Heat and Energy", marks: null }
  - { name: "6. Light", marks: null }
  - { name: "7. Sound", marks: null }
  - { name: "8. Electricity and Magnetism", marks: null }
chapters:
  - id: icse-9-physics-ch01
    number: 1
    title: "Measurements and Experimentation"
    unit: "1. Measurements and Experimentation"
    topics:
      - id: icse-9-physics-ch01-t01
        title: "International System of Units: fundamental and derived SI units with correct symbols; fps and cgs systems"
        learning_outcomes:
          - "Name the seven fundamental SI quantities with their units and symbols"
          - "Express a derived unit such as density or momentum in terms of fundamental units"
          - "Convert a quantity between SI, cgs and fps units"
      - id: icse-9-physics-ch01-t02
        title: "Least count of common instruments; smaller least count gives greater accuracy"
        learning_outcomes:
          - "Determine the least count of a metre rule, measuring cylinder and stopwatch"
          - "Explain why an instrument with a smaller least count measures more accurately"
      - id: icse-9-physics-ch01-t03
        title: "Vernier callipers: main and vernier scales, least count, zero error (basic idea), reading a measurement"
        learning_outcomes:
          - "Calculate the least count of a Vernier callipers from its scale divisions"
          - "Read the length or diameter shown in a diagram of a Vernier callipers, correcting for zero error"
      - id: icse-9-physics-ch01-t04
        title: "Micrometre screw gauge: pitch, least count (pitch 1 mm, LC 0.01 mm), zero error, reading a measurement"
        learning_outcomes:
          - "Calculate the pitch and least count of a screw gauge"
          - "Read the diameter of a wire from a pictorial screw gauge reading, applying zero-error correction"
      - id: icse-9-physics-ch01-t05
        title: "Simple pendulum: time period and frequency; T = 2 pi sqrt(l/g) without derivation; l versus T^2 graph and its slope"
        learning_outcomes:
          - "Define the time period and frequency of a simple pendulum and relate them"
          - "Use T = 2 pi sqrt(l/g) to solve simple numerical problems"
          - "Interpret the slope of an l versus T^2 graph and use it to find g"
    removed_topics:
      - "Derivation of the formula for the time period of a simple pendulum"
      - "Non-pictorial numerical problems on Vernier callipers and screw gauge (only pictorial numericals are included)"
    literature_texts: []
  - id: icse-9-physics-ch02
    number: 2
    title: "Motion in One Dimension"
    unit: "2. Motion in One Dimension"
    topics:
      - id: icse-9-physics-ch02-t01
        title: "Scalar and vector quantities; rest and motion; distance and displacement"
        learning_outcomes:
          - "Classify given physical quantities as scalars or vectors"
          - "Distinguish distance from displacement for a body moving along a straight line and back"
      - id: icse-9-physics-ch02-t02
        title: "Speed and velocity; uniform and variable motion; acceleration and retardation"
        learning_outcomes:
          - "Calculate average speed, average velocity and acceleration from given data"
          - "Explain the meaning of a negative acceleration (retardation)"
      - id: icse-9-physics-ch02-t03
        title: "Distance-time and velocity-time graphs and the information derived from them"
        learning_outcomes:
          - "Find speed from the slope of a distance-time graph"
          - "Find acceleration from the slope and displacement from the area of a velocity-time graph"
          - "Sketch the graphs for a body at rest, in uniform motion and in uniformly accelerated motion"
      - id: icse-9-physics-ch02-t04
        title: "Equations of uniformly accelerated motion derived graphically: v = u + at, S = ut + (1/2)at^2, S = (1/2)(u + v)t, v^2 = u^2 + 2aS"
        learning_outcomes:
          - "Derive the four equations of motion from a velocity-time graph"
          - "Solve simple numerical problems using the equations of motion"
      - id: icse-9-physics-ch02-t05
        title: "Motion under gravity: free fall with acceleration g"
        learning_outcomes:
          - "Apply the equations of motion with a = g to a body dropped or thrown vertically upward"
    removed_topics:
      - "Motion with non-uniform acceleration"
    literature_texts: []
  - id: icse-9-physics-ch03
    number: 3
    title: "Force and Newton's Laws of Motion"
    unit: "3. Laws of Motion"
    topics:
      - id: icse-9-physics-ch03-t01
        title: "Contact forces (friction, normal reaction, tension) and non-contact forces (gravitational, electric, magnetic); inverse square relation"
        learning_outcomes:
          - "Classify forces as contact or non-contact with everyday examples"
          - "State general properties of non-contact forces, including the inverse square dependence on distance"
      - id: icse-9-physics-ch03-t02
        title: "Units of force: newton and dyne; gravitational units kgf and gf and their relation to absolute units"
        learning_outcomes:
          - "Convert between newton, dyne, kgf and gf"
      - id: icse-9-physics-ch03-t03
        title: "Newton's first law: inertia, static and dynamic inertia; definition of force from the first law"
        learning_outcomes:
          - "State Newton's first law and explain how it defines inertia and force"
          - "Explain everyday examples of inertia of rest and inertia of motion"
      - id: icse-9-physics-ch03-t04
        title: "Linear momentum p = mv; rate of change of momentum; Newton's second law F = ma"
        learning_outcomes:
          - "Show that the rate of change of momentum equals ma for a body of constant mass"
          - "Solve simple numerical problems combining F = ma with the equations of motion"
          - "Explain applications of the second law, such as a fielder drawing back the hands while catching a ball"
      - id: icse-9-physics-ch03-t05
        title: "Newton's third law: action-reaction pairs act on different bodies"
        learning_outcomes:
          - "Identify the action-reaction pair in situations such as walking, rowing and a rocket"
          - "Explain why action and reaction do not cancel each other"
    removed_topics:
      - "Inertial mass"
      - "Units of force other than cgs and SI in second-law numericals"
    literature_texts: []
  - id: icse-9-physics-ch04
    number: 4
    title: "Gravitation"
    unit: "3. Laws of Motion"
    topics:
      - id: icse-9-physics-ch04-t01
        title: "Universal law of gravitation: statement, equation F = G m1 m2 / r^2, importance and applications"
        learning_outcomes:
          - "State the universal law of gravitation and write its equation"
          - "Predict how the gravitational force changes when masses or separation change"
      - id: icse-9-physics-ch04-t02
        title: "Gravity, acceleration due to gravity and free fall"
        learning_outcomes:
          - "Explain why all bodies fall with the same acceleration in the absence of air resistance"
      - id: icse-9-physics-ch04-t03
        title: "Mass and weight: weight as the force of gravity; comparison; simple numerical problems"
        learning_outcomes:
          - "Compare mass and weight in terms of definition, unit, nature and measuring instrument"
          - "Calculate the weight of a body from its mass, in newton and kgf"
    removed_topics:
      - "Problems on variation of g"
    literature_texts: []
  - id: icse-9-physics-ch05
    number: 5
    title: "Pressure in Fluids"
    unit: "4. Fluids"
    topics:
      - id: icse-9-physics-ch05-t01
        title: "Thrust and pressure and their units; everyday examples"
        learning_outcomes:
          - "Distinguish thrust from pressure and calculate pressure as thrust per unit area"
          - "Explain why sharp knives cut better and why heavy vehicles have broad tyres"
      - id: icse-9-physics-ch05-t02
        title: "Pressure exerted by a liquid column p = h rho g; factors affecting pressure in a stationary fluid"
        learning_outcomes:
          - "Calculate liquid pressure at a given depth using p = h rho g"
          - "Explain why a dam is broader at the base and why a diver needs a special suit"
      - id: icse-9-physics-ch05-t03
        title: "Transmission of pressure in liquids; Pascal's law and simple numerical problems"
        learning_outcomes:
          - "State Pascal's law and give examples of transmission of pressure"
          - "Solve simple problems on force and pressure transmitted through a liquid"
    removed_topics:
      - "Working of hydraulic machines"
    literature_texts: []
  - id: icse-9-physics-ch06
    number: 6
    title: "Upthrust and Archimedes' Principle"
    unit: "4. Fluids"
    topics:
      - id: icse-9-physics-ch06-t01
        title: "Buoyancy and upthrust: definition and characteristic properties"
        learning_outcomes:
          - "Explain why a body seems lighter in a liquid"
          - "State the factors on which upthrust depends"
      - id: icse-9-physics-ch06-t02
        title: "Archimedes' principle; apparent weight when upthrust is less than the weight of the body"
        learning_outcomes:
          - "State Archimedes' principle"
          - "Calculate upthrust and apparent weight of a body immersed in a liquid"
      - id: icse-9-physics-ch06-t03
        title: "Relative density; experimental determination of RD of a solid denser than water and of a liquid"
        learning_outcomes:
          - "Distinguish density from relative density"
          - "Calculate relative density from weights in air and in water"
      - id: icse-9-physics-ch06-t04
        title: "Floatation: upthrust equal to or greater than weight; law of floatation; fraction of volume immersed"
        learning_outcomes:
          - "State the conditions for a body to sink, float or rise in a liquid by comparing densities"
          - "Use V(immersed)/V(total) = density of body / density of liquid in numerical problems"
      - id: icse-9-physics-ch06-t05
        title: "Applications: ships, submarines, icebergs and balloons; numerical problems on all three cases"
        learning_outcomes:
          - "Explain how a submarine dives and surfaces and why an iron ship floats"
          - "Explain why only a small part of an iceberg is seen above water"
    removed_topics: []
    literature_texts: []
  - id: icse-9-physics-ch07
