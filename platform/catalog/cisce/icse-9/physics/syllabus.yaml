    title: "Heat and Energy"
    unit: "5. Heat and Energy"
    topics:
      - id: icse-9-physics-ch07-t01
        title: "Heat and temperature; heat as energy; joule; 1 cal = 4.186 J"
        learning_outcomes:
          - "Distinguish heat from temperature"
          - "Convert heat quantities between calorie and joule"
      - id: icse-9-physics-ch07-t02
        title: "Anomalous expansion of water; volume-temperature and density-temperature graphs from 0 to 10 degrees C"
