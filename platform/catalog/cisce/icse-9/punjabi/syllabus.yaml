    literature_texts: []
  - id: icse-9-punjabi-ch05
    number: 5
    title: "Grammar: idioms, sentence construction and synthesis"
    unit: "Section A: Language"
    topics:
      - id: icse-9-punjabi-ch05-t01
        title: "Idioms and proverbs: meaning and use in sentences"
        learning_outcomes:
          - "Explain the meaning of common Punjabi idioms and proverbs and use them appropriately in sentences"
      - id: icse-9-punjabi-ch05-t02
        title: "Correcting errors in sentences (agreement, tense, gender and number, case endings or postpositions)"
        learning_outcomes:
          - "Identify the grammatical error in a sentence and rewrite it correctly"
      - id: icse-9-punjabi-ch05-t03
        title: "Transforming sentences as directed (tense, voice, affirmative/negative, statement/question)"
        learning_outcomes:
          - "Rewrite a sentence as directed without changing its meaning"
      - id: icse-9-punjabi-ch05-t04
        title: "Synthesis: combining two or more sentences into one"
        learning_outcomes:
          - "Combine two or more simple sentences into one compound or complex sentence"
      - id: icse-9-punjabi-ch05-t05
        title: "Making sentences that correctly use given words or forms"
        learning_outcomes:
          - "Use a given word, phrase or form correctly in a meaningful sentence"
    removed_topics:
      - "Knowledge of grammatical terms as such (CISCE: the grammar question does not require it)"
    literature_texts: []
  - id: icse-9-punjabi-ch06
    number: 6
    title: "Kav-Katha Samvedna: short stories (Class IX portion)"
    unit: "Section B: Prescribed Texts"
    topics:
      - id: icse-9-punjabi-ch06-t01
        title: "Pahuta Pandhi (Gurbax Singh): plot, characters and theme"
        learning_outcomes:
          - "Summarise the plot of the story in their own words"
          - "Describe the main characters with examples from the story"
          - "Explain the theme of the story and the significance of its title"
      - id: icse-9-punjabi-ch06-t02
        title: "Bhatta (Sant Singh Sekhon): plot, characters and rural life"
        learning_outcomes:
          - "Summarise the plot of the story in their own words"
          - "Describe the main characters with examples from the story"
          - "Explain the theme of the story and the significance of its title"
      - id: icse-9-punjabi-ch06-t03
        title: "Zeenat Appa (Kartar Singh Duggal): plot, the central character and human relationships"
        learning_outcomes:
          - "Summarise the plot of the story in their own words"
          - "Write a character sketch of Zeenat Appa with examples from the story"
          - "Explain the theme of the story and the significance of its title"
      - id: icse-9-punjabi-ch06-t04
        title: "Dharti Hethla Balad (Kulwant Singh Virk): plot, characters and the symbolism of the title"
        learning_outcomes:
          - "Summarise the plot of the story in their own words"
          - "Describe the main characters and their feelings with examples from the story"
          - "Explain the folk belief behind the title and how the story uses it"
      - id: icse-9-punjabi-ch06-t05
        title: "Sanjhi Kandh (Santokh Singh Dheer): neighbours, the shared wall and the message"
        learning_outcomes:
          - "Summarise the plot of the story in their own words"
          - "Explain what the shared wall of the title stands for in the relationship between the characters"
    removed_topics:
