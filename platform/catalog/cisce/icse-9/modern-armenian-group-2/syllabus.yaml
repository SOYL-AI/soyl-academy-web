    topics:
      - id: icse-9-modern-armenian-group-2-ch02-t01
        title: "Layout of a Modern Armenian letter: address, date, salutation, body, closing formula and signature"
        learning_outcomes:
          - "Set out a letter in the correct Modern Armenian layout, writing the date in the Armenian date format"
      - id: icse-9-modern-armenian-group-2-ch02-t02
        title: "Formal letters: request, complaint, enquiry, application"
        learning_outcomes:
          - "Write a formal letter of about 150 words using Hargeli ... (Dear / Respected ...) and a respectful closing (Hargankov)"
      - id: icse-9-modern-armenian-group-2-ch02-t03
        title: "Informal letters to friends and family: invitation, thanks, news"
        learning_outcomes:
          - "Write an informal letter of about 150 words using Sireli ... (Dear ...) and a warm closing"
      - id: icse-9-modern-armenian-group-2-ch02-t04
        title: "Expanding the given suggestions into a complete letter"
        learning_outcomes:
          - "Cover every suggestion given in the question in a well-ordered letter"
          - "Keep the register consistent with the reader of the letter"
    removed_topics: []
