  - id: icse-9-assamese-ch06
    number: 6
    title: "Karengar Ligiri (drama): Act 1 Scene 1 to Act 2 Scene 4"
    unit: "Section B: Prescribed Texts"
    topics:
      - id: icse-9-assamese-ch06-t01
        title: "Introducing the play: Jyoti Prasad Agarwala, the royal-palace setting and the meaning of the title"
        learning_outcomes:
          - "Explain the meaning of the title Karengar Ligiri and describe the setting of the play in Assamese"
          - "State the place of Jyoti Prasad Agarwala in modern Assamese drama"
      - id: icse-9-assamese-ch06-t02
        title: "Act 1: the opening situation and the introduction of the main characters"
        learning_outcomes:
          - "Narrate the events of Act 1 in sequence in Assamese, in own words"
          - "Explain how the opening scenes introduce the central conflict"
      - id: icse-9-assamese-ch06-t03
        title: "Act 2, Scenes 1-4: development of the action and rising conflict"
        learning_outcomes:
          - "Narrate the events of Act 2 Scenes 1 to 4 in sequence"
          - "Explain how the relationships between the main characters change in these scenes"
      - id: icse-9-assamese-ch06-t04
        title: "Characters of the prescribed acts"
        learning_outcomes:
          - "Write character sketches of the main characters using their words and actions in Acts 1 and 2"
      - id: icse-9-assamese-ch06-t05
        title: "Dialogue, stage situations and dramatic technique in the opening acts"
        learning_outcomes:
          - "Comment on how dialogue and stage situations reveal character and build tension, with examples"
    removed_topics:
