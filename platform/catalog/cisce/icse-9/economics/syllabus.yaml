        title: "Capitalist and socialist economies: meaning and differences"
        learning_outcomes:
          - "Define a capitalist and a socialist economy"
          - "Compare them on ownership of resources, role of the price mechanism and motive of production"
      - id: icse-9-economics-ch03-t02
        title: "Mixed economy with reference to India"
        learning_outcomes:
          - "Explain why India is described as a mixed economy, with examples of public and private sector enterprises"
          - "Distinguish a mixed economy from capitalist and socialist economies"
      - id: icse-9-economics-ch03-t03
        title: "Developed and developing economies: meaning and differences"
        learning_outcomes:
          - "Distinguish developed from developing economies using indicators such as per capita income, literacy and occupational structure"
      - id: icse-9-economics-ch03-t04
        title: "Economic growth and economic development: meaning and differences"
        learning_outcomes:
          - "Define economic growth and economic development"
          - "Explain why growth in output need not mean development, with an example"
    removed_topics: []
    literature_texts: []
