      - id: icse-9-economics-ch04-t02
        title: "The basic economic problem: unlimited wants, limited resources with alternative uses"
        learning_outcomes:
          - "Explain the basic economic problem of scarcity and choice"
          - "Explain the need for efficient use of resources using an example such as a farmer's choice of crop"
      - id: icse-9-economics-ch04-t03
        title: "Central problems of an economy: what to produce, how to produce and for whom to produce"
        learning_outcomes:
