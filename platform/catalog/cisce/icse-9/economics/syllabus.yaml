# ICSE Class 9 Economics (code 64, Group II) - ICSE 2028 course, CLASS IX portion only.
# Source: platform/catalog/sources/cisce.md#icse-2028-economics. Topic wording is our own summary of the official scope.
subject_id: icse-9-economics
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-economics, icse-2028-regulations]
exam_notes: >-
  Class IX is year one of the two-year ICSE 2028 course: there is no board examination in Class IX. The school conducts
  the Class IX final examination on the Class IX portion (Regulations). The syllabus prescribes one theory paper of
  2 hours, 80 marks, plus internal assessment 20 marks (at least one project/assignment set by the teacher from the
  syllabus, e.g. a case study of industrial pollution, research on the local economy using one parameter such as health
  or employment, the effect of liberalisation on an industry's output, or a report on a visit to a cottage or small-scale
  unit; marked 10 by the subject teacher and 10 by an external examiner). Group II elective; candidates offering Economic
  Applications (Group III) may not offer Economics. The syllabus does not print the question-paper pattern; school papers
  usually follow the ICSE Group II pattern of compulsory short-answer questions across the syllabus followed by a choice
  of structured long questions. The case studies of Digital India and Skill India are marked "not to be tested".
  Class X topics (factors of production, demand and supply, market, banking, public finance, inflation, consumer
  awareness) are in icse-10-economics. CISCE lists numbered topics, not textbook chapters: SOYL groups them into
  10 teachable chapters in syllabus order. No unit-wise marks weightage is published.
units:
  - { name: "1. Introduction to Economics", marks: null }
  - { name: "2. Types of Economies", marks: null }
  - { name: "3. Problems of an Economy", marks: null }
  - { name: "4. The Indian Economy: A Study", marks: null }
  - { name: "5. Major Problems of the Indian Economy", marks: null }
  - { name: "6. Major Reforms and Emerging Trends in the Indian Economy", marks: null }
chapters:
  - id: icse-9-economics-ch01
    number: 1
    title: "What is Economics?"
    unit: "1. Introduction to Economics"
    topics:
      - id: icse-9-economics-ch01-t01
        title: "Definitions of economics: Adam Smith (wealth), Robbins (scarcity), Keynes and Samuelson (growth and choice)"
        learning_outcomes:
          - "State the central idea of each definition of economics given by Adam Smith, Robbins, Keynes and Samuelson"
          - "Compare the wealth-centred and scarcity-centred views of economics with an example"
      - id: icse-9-economics-ch01-t02
        title: "Microeconomics and macroeconomics: meaning, differences and examples"
        learning_outcomes:
          - "Classify given questions, such as the price of onions or India's national income, as micro or macro"
          - "Distinguish microeconomics from macroeconomics on scope and unit of study"
      - id: icse-9-economics-ch01-t03
        title: "Economic and non-economic activities: meaning, examples and differences"
        learning_outcomes:
          - "Classify activities such as a doctor treating patients and a mother cooking for the family as economic or non-economic"
          - "Explain the differences between economic and non-economic activities"
    removed_topics: []
    literature_texts: []
  - id: icse-9-economics-ch02
    number: 2
    title: "Basic Economic Terms and Economic Entities"
    unit: "1. Introduction to Economics"
    topics:
      - id: icse-9-economics-ch02-t01
        title: "Wants, goods, services and utility"
        learning_outcomes:
          - "Define wants, goods, services and utility, giving an Indian example of each"
          - "Distinguish goods from services"
      - id: icse-9-economics-ch02-t02
        title: "Production, consumption, sustainable consumption and factors of production"
        learning_outcomes:
          - "Define production and consumption and identify the factors of production used in a given activity"
          - "Explain sustainable consumption with examples such as saving water and reusing bags"
      - id: icse-9-economics-ch02-t03
        title: "Market, price and value"
        learning_outcomes:
          - "Define market, price and value in the economic sense"
          - "Distinguish price from value with an example"
      - id: icse-9-economics-ch02-t04
        title: "Income, saving, wealth, welfare and economy"
        learning_outcomes:
          - "Define income, saving, wealth, welfare and economy"
          - "Explain how income and saving relate to the creation of wealth"
      - id: icse-9-economics-ch02-t05
        title: "Economic entities: households, firms, government sector and foreign sector"
        learning_outcomes:
          - "State the meaning of each economic entity and identify the entity making a given economic decision"
    removed_topics: []
    literature_texts: []
  - id: icse-9-economics-ch03
    number: 3
    title: "Types of Economies"
    unit: "2. Types of Economies"
    topics:
