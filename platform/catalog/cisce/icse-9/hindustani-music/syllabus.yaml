# ICSE Class 9 Performing Arts: Hindustani Music (Group III elective, code 91) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-performing-arts (CLASS IX section only). Theory paper only.
# Topic wording is our own summary of the official scope.
subject_id: icse-9-hindustani-music
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-performing-arts, icse-2028-regulations]
exam_notes: >-
  There is no board examination in Class IX: the school sets the Class IX examination on the Class IX portion
  (ICSE 2028 Regulations), usually following the pattern the syllabus prescribes - Part 1 Theory, one written paper
  of 2 hours, 100 marks, plus Part 2 internal assessment of practical work, 100 marks (50 subject teacher + 50
  External Examiner), which CISCE has assessed by the school in Class X; the external paper and internal assessment
  each carry 50% of the subject result (Group III). The theory has three sections - A Vocal, B Instrumental
  (excluding tabla), C Tabla; a candidate studies the section that matches the vocal, instrumental or tabla work
  they perform.
  Class IX practical work (not taught as chapters here): singing or playing and identifying shuddha and vikrit
  swaras; the three layas; 10 alankars in dugun and chaugun (instrumental also in thah); in Yaman, Khamaj, Kafi,
  Bhairavi and Alhaiya Bilawal - madhya laya khayals with alaap and taan in three ragas plus lakshangeet and
  swarmalika in the other two and one dhrupad (sthayi and antara), or a Razakhani gat with alaap and toda in all
  five ragas plus a dhun; the National Anthem and National Song (notation required only for instrumentalists);
  padhant of the thekas of Teentaal, Keharwa, Dadra, Ektaal and Chautaal with tali and khali, also in dugun; raga
  identification; simple mizrab bols such as Da Ra Da Ra; for tabla - producing the main varnas of dayan and bayan,
  thekas of six taals with development (two kaydas with four paltas and tihai in Teentaal, a tukda each in Jhaptaal
  and Ektaal, a paran in Chautaal, two kismen each in Dadra and Keharwa), sangat in Dadra and Keharwa, and padhant.
  Practical work is graded on purity of swar, laya, knowledge of raga/taal, recall of concepts and overall effect.
  Class X theory (Nad and shruti, ornaments, time theory, the five Class X ragas and taals, Amir Khusro and
  Pt. V.D. Paluskar, instruments and eminent musicians) is in icse-10-hindustani-music.
  CISCE lists numbered theory items per section, not chapters: SOYL groups them into teachable chapters in syllabus
  order, placing theory that is identical for Sections A and B in one common unit. No marks weightage by section or
  topic is published.
