      - id: icse-9-chinese-second-language-ch04-t04
        title: "Measure words (ge, ben, zhang, tiao, jian, bei) with numbers and the demonstratives zhe and na"
        learning_outcomes:
          - "Use the right measure word between a number or demonstrative and a noun"
      - id: icse-9-chinese-second-language-ch04-t05
        title: "Expressing time: dates, clock time, duration and frequency"
        learning_outcomes:
          - "Say and write dates and times and state how long or how often something happens"
    removed_topics: []
    literature_texts: []
  - id: icse-9-chinese-second-language-ch05
    number: 5
    title: "Grammar: verbs, aspect and complements"
    unit: "4. Grammar"
    topics:
      - id: icse-9-chinese-second-language-ch05-t01
        title: "Modal verbs: hui, neng, keyi, yao, xiang, yinggai"
        learning_outcomes:
          - "Choose the modal verb that expresses ability, permission, wish or obligation"
      - id: icse-9-chinese-second-language-ch05-t02
        title: "Aspect: le (completed action and change), guo (past experience), zhe (continuing state); zai / zhengzai (action in progress)"
        learning_outcomes:
          - "Use le, guo and zhe correctly and describe an action in progress with zai"
      - id: icse-9-chinese-second-language-ch05-t03
        title: "The shi ... de construction for the time, place or manner of a past action"
        learning_outcomes:
          - "Stress when, where or how something happened with shi ... de"
      - id: icse-9-chinese-second-language-ch05-t04
        title: "Complements of result, direction and degree; the three particles pronounced de (structural, adverbial, complement)"
        learning_outcomes:
          - "Add result, direction and degree complements to verbs and choose the correct de particle"
      - id: icse-9-chinese-second-language-ch05-t05
        title: "The ba construction and the bei passive"
        learning_outcomes:
          - "Rewrite a sentence with ba to stress what happens to the object and with bei for the passive"
    removed_topics: []
    literature_texts: []
  - id: icse-9-chinese-second-language-ch06
