          - "Frame the question that matches a given answer using the appropriate question form"
      - id: icse-9-chinese-second-language-ch06-t02
        title: "Negation with bu and mei (you)"
        learning_outcomes:
          - "Choose bu or mei according to time reference and verb type"
      - id: icse-9-chinese-second-language-ch06-t03
        title: "Comparison: bi, gen ... yiyang, mei you ... name, zui"
        learning_outcomes:
