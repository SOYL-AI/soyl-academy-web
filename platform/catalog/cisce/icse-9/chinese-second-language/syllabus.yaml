    unit: "2. Letter"
    topics:
      - id: icse-9-chinese-second-language-ch02-t01
        title: "Layout of a Chinese letter: address, date, salutation, body, closing formula and signature"
        learning_outcomes:
          - "Set out a letter in the correct Chinese layout, writing the date in the Chinese year-month-day order (2027 nian 3 yue 5 ri)"
      - id: icse-9-chinese-second-language-ch02-t02
        title: "Formal letters: request, complaint, enquiry, application"
        learning_outcomes:
          - "Write a formal letter using a respectful opening to the addressee and the set closing wishes"
      - id: icse-9-chinese-second-language-ch02-t03
        title: "Informal letters to friends and family: invitation, thanks, news"
        learning_outcomes:
          - "Write an informal letter using a familiar opening (qin'ai de ...) and friendly closing wishes"
      - id: icse-9-chinese-second-language-ch02-t04
        title: "Expanding the given suggestions into a complete letter"
        learning_outcomes:
          - "Cover every suggestion given in the question in a well-ordered letter"
          - "Keep the register consistent with the reader of the letter"
    removed_topics: []
    literature_texts: []
  - id: icse-9-chinese-second-language-ch03
    number: 3
    title: "Unseen passage"
    unit: "3. Comprehension"
    topics:
      - id: icse-9-chinese-second-language-ch03-t01
        title: "Reading an unseen passage of about 150 words: gist and key details"
        learning_outcomes:
          - "State the main idea of an unseen Chinese passage and locate specific details"
      - id: icse-9-chinese-second-language-ch03-t02
        title: "Answering questions in Chinese in complete sentences"
        learning_outcomes:
          - "Answer factual questions in Chinese, changing pronouns and verb forms from the passage where needed"
      - id: icse-9-chinese-second-language-ch03-t03
        title: "Vocabulary from context and simple inference"
        learning_outcomes:
          - "Work out the meaning of unfamiliar words from context"
          - "Answer an inference question and support it with evidence from the passage"
    removed_topics: []
    literature_texts: []
  - id: icse-9-chinese-second-language-ch04
    number: 4
    title: "Grammar: sounds, characters and basic word order"
    unit: "4. Grammar"
    topics:
      - id: icse-9-chinese-second-language-ch04-t01
        title: "Pinyin, the four tones and the neutral tone; tone changes of bu and yi"
        learning_outcomes:
          - "Read and write pinyin with tone marks and apply the tone changes of bu and yi"
      - id: icse-9-chinese-second-language-ch04-t02
        title: "Characters: radicals, stroke order and simplified forms"
        learning_outcomes:
          - "Identify common radicals and write characters in the correct stroke order"
      - id: icse-9-chinese-second-language-ch04-t03
        title: "Basic word order: subject - time - place - verb - object"
        learning_outcomes:
