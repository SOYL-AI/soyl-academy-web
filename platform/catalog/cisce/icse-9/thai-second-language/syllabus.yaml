      - id: icse-9-thai-second-language-ch02-t02
        title: "Formal letters: request, complaint, enquiry, application"
        learning_outcomes:
          - "Write a formal letter using the formal opening rian ... and the closing kho sadaeng khwam nap thue"
      - id: icse-9-thai-second-language-ch02-t03
        title: "Informal letters to friends and family: invitation, thanks, news"
        learning_outcomes:
          - "Write an informal letter using the opening thueng ... and a friendly closing"
      - id: icse-9-thai-second-language-ch02-t04
        title: "Expanding the given suggestions into a complete letter"
        learning_outcomes:
