# ICSE Class 9 Performing Arts: Drama (Group III elective, code 95) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-performing-arts. The syllabus is printed for Classes IX and X together
# (no class split), so all of it is covered here. The ICSE 2028 Drama syllabus is substantially revised from ICSE 2027.
# Theory paper only. Literature: titles and authors only. Topic wording is our own summary of the official scope.
subject_id: icse-9-drama
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-performing-arts, icse-2028-regulations]
exam_notes: >-
  There is no board examination in Class IX: the school sets the Class IX examination on the work of the year
  (ICSE 2028 Regulations), usually following the paper pattern below; the board paper is taken at the end of Class X.
  Part 1 Theory: one paper of 2 hours, 100 marks, in two sections - A Drama as Art (14 elements), B Technical Aspects
  of Drama (9 elements). Section A questions give resource material (extracts from plays, themes, situations or
  pictures) as stimuli; answers are written commentaries that may include sketches, diagrams and notes, and
  candidates may creatively add dialogue to the prompt. Section B questions use resource material as a basis for
  technical design, answered with sketches, notes and diagrams.
  Part 2: internal practical assessment, 100 marks (50 subject teacher + 50 External Examiner); the external paper
  and internal assessment each carry 50% of the subject result (Group III). Candidates choose ONE of Acting (an
  original piece or an extract from a play, book or film; video evidence and reviews may be submitted) or Stagecraft
  (a stagecraft model based on a scene from a play, book or film, tested in one or more of its elements; photographs,
  designs and video may be submitted). Graded on regularity, make-up, acting, dialogue and emotional appeal.
  Performance and model making are not taught as chapters here.
  The syllabus is printed for Classes IX and X together with no class split, so Class IX works on all of it and the
  board paper at the end of Class X (ICSE 2028) covers the whole syllabus.
  CISCE lists elements to be appreciated, not chapters: SOYL groups them into teachable chapters in syllabus order.
  No section-wise marks weightage is published.
units:
  - { name: "Section A: Drama as Art", marks: null }
  - { name: "Section B: Technical Aspects of Drama", marks: null }
