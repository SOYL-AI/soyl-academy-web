exam_notes: >-
  There is no board examination in Class IX: the Class IX final examination is conducted internally by the school on
  the Class IX portion (ICSE 2028 Regulations), and promotion to Class X depends on cumulative achievement through the
  year. The syllabus prescribes Paper I (theory): one written paper of 2 hours, 100 marks, in four sections - Human
  Biology, Sages of India, Concepts of Yoga, and Psychology and Physiology of Yoga - and Paper II (internal
  assessment), 100 marks; in the ICSE result the two each carry 50% (Group III), and school examinations usually
  follow this pattern. Internal assessment: Section A course work 40 marks (continuous assessment of effort and
  progress in practice, assisting yoga therapy sessions, improving one's own health through yoga, participation in
  programmes) and Section B practical tests 60 marks - six predetermined asanas (30), four or five asanas of the
  teacher's choice from the Class IX list (20) and two asanas of the candidate's choice (10). The Class IX practical
  list has 23 asanas (e.g. Vrikshasana, Garudasana, Utthita Trikonasana, Virabhadrasana I and II, Adho Mukha
  Shvanasana, Ushtrasana, Dhanurasana, half Shirshasana against a wall, Salamba Sarvangasana I, Halasana, Karna
  Pidasana), Surya Namaskar, and breathing practices (Anapanasati, abdominal breathing, the full yogic breath).
  Asana, Surya Namaskar and pranayama practice is not covered as chapters here. The Class X theory (nervous, sensory,
  endocrine, circulatory and excretory systems, further sages, the Yoga Sutras, schools of philosophy) is in
  icse-10-yoga. No Class IX specimen paper was released for Yoga.
  CISCE lists topics in four sections, not textbook chapters; SOYL groups them into teachable chapters in syllabus
  order. No section-wise marks weightage is published.
