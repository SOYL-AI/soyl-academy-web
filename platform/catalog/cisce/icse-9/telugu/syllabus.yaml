        learning_outcomes:
          - "Summarise the action of these scenes in their own words"
      - id: icse-9-telugu-ch09-t02
        title: "Scenes 3-4: summary of the action"
        learning_outcomes:
          - "Summarise the action of these scenes in their own words"
      - id: icse-9-telugu-ch09-t03
        title: "Main characters and their conflicts"
        learning_outcomes:
          - "Describe the main characters with examples of their speech and actions"
      - id: icse-9-telugu-ch09-t04
        title: "Themes, humour and dramatic technique"
        learning_outcomes:
          - "Explain what the play says about learning English and its place in society"
          - "Comment on the use of dialogue and stage directions"
