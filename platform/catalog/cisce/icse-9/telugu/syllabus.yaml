    literature_texts:
      - { title: "Indra Dyumuni Samudra Prayaanam", author: "Madhira Subbanna Deekshitulu" }
      - { title: "Seethaanveshana", author: "Padala Ramarao" }
      - { title: "Appudu Putti Vunte", author: "Devulapalli Krishna Sastry" }
      - { title: "Bhasha Saili - Rachana Bedhalu", author: "Chekuri Ramarao" }
      - { title: "Samskruti", author: "Acharya Khandavalli Lakshmi Ranjanam and Khandavalli Balendhu Sekharam" }
  - id: icse-9-telugu-ch08
