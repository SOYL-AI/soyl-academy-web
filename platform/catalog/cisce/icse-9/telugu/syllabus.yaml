# ICSE Class 9 Telugu (Second Language, code 14) - ICSE 2028 course, CLASS IX portion only.
# Literature: titles and authors only (CONTEXT section 8). Students read the texts in their own textbook.
subject_id: icse-9-telugu
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-second-languages, icse-2028-prescribed-books, cisce-circular-2026-27-33-indian-languages, icse-2028-regulations]
exam_notes: >-
  Class IX is year one of the two-year ICSE 2028 course: there is no board examination in Class IX. The school conducts the
  Class IX examination, normally on the ICSE paper pattern: one paper of 3 hours, 80 marks, plus internal assessment 20 marks
  (two or three assignments in Class IX, of which two are written - one from language and one from literature; suggested Class
  IX work: creative writing of about 300-400 words from stimuli such as recorded music or sounds, a picture, an opening
  sentence or a news clipping, factual and expressive writing, a film or book review, an aural (listening) exercise, and
  literature assignments on character/theme, background and summary; marked 10 by the subject teacher and 10 by an external
  examiner). Section A Language (40 marks, compulsory): one composition, one letter (choice of two), an unseen comprehension
  passage of about 250 words, and grammar (vocabulary, syntax and idiom, sentence synthesis, sentences embodying given words or
  forms). Section B Prescribed Texts (40 marks): answer four questions from ONLY two of the prescribed books; questions are set
  and answered in the language. Prescribed texts are bifurcated (Second Languages syllabus and Circular 2026-27/33): the Class
  IX examination is set ONLY on the Class IX portion listed here (Class X portion is in icse-10-telugu); Section A is not
  bifurcated. SOYL covers every prescribed book so a student can pick any two. The "short stories" section of the Class IX
  portion also contains essays (Bhasha Saili - Rachana Bedhalu, Samskruti); SOYL treats them as prose essays. CISCE describes
  the grammar component only generically and says it needs no knowledge of grammatical terms; the split into two grammar
  chapters is SOYL's, not CISCE's. Titles are in English / CISCE transliteration; native-script titles to be added in language
  review. CISCE lists topics not chapters; SOYL grouped them into teachable chapters in syllabus order.
units:
  - { name: "Section A: Language", marks: 40 }
  - { name: "Section B: Prescribed Texts", marks: 40 }
chapters:
  - id: icse-9-telugu-ch01
    number: 1
    title: "Composition writing in Telugu"
    unit: "Section A: Language"
    topics:
      - id: icse-9-telugu-ch01-t01
        title: "Planning a composition: choosing a topic, outline, introduction, body and conclusion"
        learning_outcomes:
          - "Prepare an outline and write a well-organised composition of about 250-300 words in Telugu"
          - "Link paragraphs in a logical order using suitable connecting words"
      - id: icse-9-telugu-ch01-t02
        title: "Descriptive and narrative compositions"
        learning_outcomes:
          - "Describe a place, person, event or experience vividly"
          - "Narrate a sequence of events with a clear beginning, middle and end"
      - id: icse-9-telugu-ch01-t03
        title: "Short explanations, directions and reflective or argumentative essays"
        learning_outcomes:
          - "Explain a process or give clear step-by-step directions"
          - "Present points for and against a social issue and reach a reasoned conclusion"
      - id: icse-9-telugu-ch01-t04
        title: "Composition from a picture, object or other stimulus (opening line, proverb)"
        learning_outcomes:
          - "Write an original story or essay suggested by a picture, object or given opening line"
      - id: icse-9-telugu-ch01-t05
        title: "Accuracy: spelling, punctuation and apt choice of words"
        learning_outcomes:
          - "Identify and correct spelling, punctuation and word-choice errors in their own Telugu writing"
    removed_topics: []
    literature_texts: []
  - id: icse-9-telugu-ch02
    number: 2
    title: "Letter writing"
    unit: "Section A: Language"
    topics:
      - id: icse-9-telugu-ch02-t01
        title: "Layout of a formal letter: sender's address, date, addressee, subject, salutation, body and closing"
        learning_outcomes:
          - "Set out a formal letter in Telugu with all its parts in the correct order and format"
      - id: icse-9-telugu-ch02-t02
        title: "Formal letters to a principal, editor or official: application, request, complaint, suggestion"
        learning_outcomes:
          - "State a problem politely and concisely and make a clear, reasonable request"
      - id: icse-9-telugu-ch02-t03
        title: "Informal letters to friends, parents and relatives"
        learning_outcomes:
          - "Use a suitable form of address, a warm personal tone and an appropriate closing in an informal letter"
      - id: icse-9-telugu-ch02-t04
        title: "Developing a letter from the suggestions given in the question"
        learning_outcomes:
          - "Include every point suggested in the question in a coherent, well-paragraphed letter"
    removed_topics: []
    literature_texts: []
  - id: icse-9-telugu-ch03
    number: 3
    title: "Unseen passage (comprehension)"
    unit: "Section A: Language"
    topics:
      - id: icse-9-telugu-ch03-t01
        title: "Reading strategy: finding the main idea and supporting details"
        learning_outcomes:
          - "State the central idea of an unseen Telugu passage of about 250 words in one or two sentences"
      - id: icse-9-telugu-ch03-t02
        title: "Answering factual and inferential questions in their own words"
        learning_outcomes:
          - "Answer factual questions in their own words without copying lines from the passage"
          - "Infer causes, consequences and the writer's attitude from the passage"
      - id: icse-9-telugu-ch03-t03
        title: "Word meanings from context, a suitable title and the message"
        learning_outcomes:
          - "Work out the meaning of unfamiliar words and phrases from the context"
          - "Suggest a suitable title for the passage and justify it"
    removed_topics: []
    literature_texts: []
  - id: icse-9-telugu-ch04
    number: 4
    title: "Grammar: vocabulary and word formation"
    unit: "Section A: Language"
    topics:
      - id: icse-9-telugu-ch04-t01
        title: "Forming nouns, adjectives and other word forms from given words"
        learning_outcomes:
          - "Form the required noun, adjective or verb from a given Telugu word"
      - id: icse-9-telugu-ch04-t02
        title: "Synonyms and antonyms"
        learning_outcomes:
          - "Give appropriate synonyms and antonyms of commonly used words"
      - id: icse-9-telugu-ch04-t03
        title: "One word for a group of words"
        learning_outcomes:
          - "Replace a phrase with a single suitable word and use it in a sentence"
      - id: icse-9-telugu-ch04-t04
        title: "Words that sound or look alike but differ in meaning; correct spelling"
        learning_outcomes:
          - "Distinguish between commonly confused words by using each in a sentence"
          - "Correct misspelt words"
    removed_topics:
      - "Knowledge of grammatical terms as such (CISCE: the grammar question does not require it)"
    literature_texts: []
  - id: icse-9-telugu-ch05
    number: 5
    title: "Grammar: idioms, sentence construction and synthesis"
    unit: "Section A: Language"
    topics:
      - id: icse-9-telugu-ch05-t01
        title: "Idioms and proverbs: meaning and use in sentences"
        learning_outcomes:
          - "Explain the meaning of common Telugu idioms and proverbs and use them appropriately in sentences"
      - id: icse-9-telugu-ch05-t02
        title: "Correcting errors in sentences (agreement, tense, gender and number, case endings or postpositions)"
        learning_outcomes:
          - "Identify the grammatical error in a sentence and rewrite it correctly"
      - id: icse-9-telugu-ch05-t03
        title: "Transforming sentences as directed (tense, voice, affirmative/negative, statement/question)"
        learning_outcomes:
          - "Rewrite a sentence as directed without changing its meaning"
      - id: icse-9-telugu-ch05-t04
        title: "Synthesis: combining two or more sentences into one"
        learning_outcomes:
          - "Combine two or more simple sentences into one compound or complex sentence"
      - id: icse-9-telugu-ch05-t05
        title: "Making sentences that correctly use given words or forms"
        learning_outcomes:
          - "Use a given word, phrase or form correctly in a meaningful sentence"
    removed_topics:
      - "Knowledge of grammatical terms as such (CISCE: the grammar question does not require it)"
    literature_texts: []
  - id: icse-9-telugu-ch06
    number: 6
    title: "Padya, Gadya Kadambamu: poems (Class IX portion)"
    unit: "Section B: Prescribed Texts"
    topics:
      - id: icse-9-telugu-ch06-t01
        title: "Vidura Neethi (Tikkana Somayaji): Vidura's counsel on right conduct (from the Telugu Mahabharatam)"
        learning_outcomes:
          - "Explain the advice given in each prescribed verse in their own words"
          - "Narrate the Mahabharata context of the passage"
          - "Comment on how the moral ideas apply to life today"
      - id: icse-9-telugu-ch06-t02
        title: "Atidhi Sevanamu (Sri Krishna Devarayalu): the ideal of hospitality to guests"
        learning_outcomes:
          - "Explain the central idea of the passage in their own words"
          - "Describe how the passage presents service to guests as a virtue"
          - "Comment on the poet's descriptive style"
      - id: icse-9-telugu-ch06-t03
        title: "Hithopadesamu (Atukuri Molla): good counsel in a Ramayana episode"
        learning_outcomes:
          - "Narrate the context of the passage in their own words"
          - "Explain the advice given and its moral value"
          - "Comment on Molla's simple and natural style"
      - id: icse-9-telugu-ch06-t04
        title: "Krushivaludu (Duvvuri Ramireddy): the farmer's life and labour"
        learning_outcomes:
          - "Describe the farmer's life and work as presented in the poem"
          - "Identify the images of rural life and explain what they convey"
          - "Comment on the poet's respect for the farmer"
      - id: icse-9-telugu-ch06-t05
        title: "Mathru Mandiram (Devulapalli Krishna Shastri): central idea, imagery and lyrical style"
        learning_outcomes:
          - "Explain the central idea of the poem in their own words"
          - "Identify the main images or figures of speech and explain what they convey"
          - "Comment on the poet's message and its relevance today"
    removed_topics:
      - "Class X poems of Padya, Gadya Kadambamu: Sneha Dharmam, Paarijatha Prasoonamu, Sathaka Manjari, Manavathvam, Nenantanu (see icse-10-telugu)"
    literature_texts:
      - { title: "Vidura Neethi", author: "Tikkana Somayaji" }
      - { title: "Atidhi Sevanamu", author: "Sri Krishna Devarayalu" }
      - { title: "Hithopadesamu", author: "Atukuri Molla" }
      - { title: "Krushivaludu", author: "Duvvuri Ramireddy" }
      - { title: "Mathru Mandiram", author: "Devulapalli Krishna Shastri" }
  - id: icse-9-telugu-ch07
    number: 7
    title: "Padya, Gadya Kadambamu: short stories and prose (Class IX portion)"
    unit: "Section B: Prescribed Texts"
    topics:
      - id: icse-9-telugu-ch07-t01
        title: "Indra Dyumuni Samudra Prayaanam (Madhira Subbanna Deekshitulu): the tale, its characters and its wonder"
        learning_outcomes:
          - "Narrate the story in their own words"
          - "Describe the main characters and the adventures in the tale"
          - "Explain the message of the story"
      - id: icse-9-telugu-ch07-t02
        title: "Seethaanveshana (Padala Ramarao): the search for Sita (Ramayana episode)"
        learning_outcomes:
          - "Narrate the episode of the search for Sita in their own words"
          - "Describe the qualities of the main characters shown in the episode"
          - "Explain the values the episode conveys"
      - id: icse-9-telugu-ch07-t03
        title: "Appudu Putti Vunte (Devulapalli Krishna Sastry): the writer imagines another age"
        learning_outcomes:
          - "Summarise the main ideas of the essay in their own words"
          - "Explain the writer's point of view with examples from the text"
          - "Comment on the relevance of the ideas today"
      - id: icse-9-telugu-ch07-t04
        title: "Bhasha Saili - Rachana Bedhalu (Chekuri Ramarao): language, style and kinds of writing"
        learning_outcomes:
          - "Summarise the main ideas of the essay in their own words"
          - "Explain, with examples, the differences in style between kinds of writing discussed in the essay"
      - id: icse-9-telugu-ch07-t05
        title: "Samskruti (Acharya Khandavalli Lakshmi Ranjanam and Khandavalli Balendhu Sekharam): the meaning of culture"
        learning_outcomes:
          - "Summarise the main ideas of the essay in their own words"
          - "Explain the writer's point of view with examples from the text"
          - "Comment on the relevance of the ideas today"
    removed_topics:
