# ICSE Class 9 Socially Useful Productive Work and Community Service (SUPW) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-supw (Class IX content). Topic wording is our own summary; SUPW is mainly practical work.
subject_id: icse-9-supw-community-service
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-supw, icse-2028-regulations]
exam_notes: >-
  No written paper. SUPW and Community Service are compulsory and assessed internally by the school over Classes IX and
  X (each marked out of 50 and combined into an order of merit out of 100); the Head of School submits a grade A-E (A
  Very Good to E Unsatisfactory) at the end of Class X, and grade E is a fail. In Class IX the candidate takes one main
  craft and one subsidiary service, or one main service and one subsidiary craft, from five areas (health and hygiene,
  food, shelter, clothing, cultural and recreational). SUPW is assessed on preparation 5, organisation 10, skills 20,
  research 10 and interest 5; community service on preparation 5, organisation 10, skills 20, resourcefulness 10 and
  interest 5, recorded on a record card (and, for day scholars, a parent-signed diary of 20-30 minutes of daily home and
  neighbourhood service). The hands-on craft work itself is practical and is not listed as chapters. CISCE recommends an
  optional Contemporary Studies component, correlated with SUPW, with a Class IX topic list: SOYL covers it in chapters
  2-7, after a chapter on planning and recording SUPW projects. The Class X Contemporary Studies list is not included
  here. The document gives no weightage for Contemporary Studies.
units:
