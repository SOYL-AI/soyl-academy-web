# ICSE Class 9 Marathi (Second Language, code 09) - ICSE 2028 course, CLASS IX portion only.
# Literature: titles and authors only (CONTEXT section 8). Students read the texts in their own textbook.
subject_id: icse-9-marathi
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-second-languages, icse-2028-prescribed-books, cisce-circular-2026-27-33-indian-languages, icse-2028-regulations]
exam_notes: >-
  Class IX is year one of the two-year ICSE 2028 course: there is no board examination in Class IX. The school conducts the
  Class IX examination, normally on the ICSE paper pattern: one paper of 3 hours, 80 marks, plus internal assessment 20 marks
  (two or three assignments in Class IX, of which two are written - one from language and one from literature; suggested Class
  IX work: creative writing of about 300-400 words from stimuli such as recorded music or sounds, a picture, an opening
  sentence or a news clipping, a film or book review, an aural (listening) exercise, and literature assignments on
  character/theme, background and summary; marked 10 by the subject teacher and 10 by an external examiner). Section A Language
  (40 marks, compulsory): one composition, one letter (choice of two), an unseen comprehension passage of about 250 words, and
  grammar (vocabulary, syntax and idiom, sentence synthesis, sentences embodying given words or forms). Section B Prescribed
  Texts (40 marks): answer four questions from ONLY two of the four prescribed books; questions are set and answered in the
  language. Prescribed texts are bifurcated (Second Languages syllabus and Circular 2026-27/33): the Class IX examination is
  set ONLY on the Class IX portion listed here (Class X portion is in icse-10-marathi); Section A is not bifurcated. All four
  books are published by Saraswati House, New Delhi. Appendix I does not name the author of the novel Karunashtak (printed
  Karunastak for Class IX); it is Vyankatesh Madgulkar. The play authors appear in Appendix I as R G Gadkari, A. Kanekar, P L
  Deshpande and P. Darvekar (Ram Ganesh Gadkari, Anant Kanekar, Pu. La. Deshpande, Purushottam Darvhekar). In Santawani, the
  Bharud by Sant Eknath has been cancelled by CISCE. Devanagari spellings of some titles are SOYL renderings of the CISCE
  transliteration; title_en keeps the CISCE form. CISCE describes the grammar component only generically and says it needs no
  knowledge of grammatical terms; the grammar chapters below break it into item types commonly set in ICSE papers - this
  breakdown is SOYL's, not CISCE's. CISCE lists topics not chapters; SOYL grouped them into teachable chapters in syllabus
  order. SOYL covers all four prescribed books so a student can pick any two.
