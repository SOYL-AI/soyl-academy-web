# ICSE Class 9 Health and Physical Education (compulsory, internally assessed) - ICSE 2028 course, Class IX year.
# Source: platform/catalog/sources/cisce.md#icse-2028-health-physical-education. Topic wording is our own summary of the official scope.
subject_id: icse-9-health-physical-education
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-health-physical-education, cisce-circular-hpe-2026]
exam_notes: >-
  Compulsory subject introduced by CISCE (July 2026 circular) for the ICSE 2028 cohort; it is assessed internally by
  the school over Classes IX-X, with no written board paper, and the result is reported as a grade (A 90-100,
  B 70-89, C 50-69, D 35-49, E below 35; E is a fail). Assessment out of 100: ACTIVE CISCE Physical Health and
  Fitness Assessment 50 (drawn directly from the ACTIVE CISCE portal record, not awarded by the school);
  Participation in Games and Sports 25 (by the PE teacher: physical education activities 10, health awareness and
  wellness activities 10, youth awareness programmes such as NCC, NSS, Scouts and Guides, CISCE games and state- or
  national-level games 5); Health, Safety and Well-being 25 (by the class teacher: two collaborative learning tasks
  in groups of 6-7 - Task 1 on physical health and safety 10, Task 2 on socio-emotional health and safety 10 - plus
  observed values such as respect, empathy, inclusion and responsibility 5). Suggested tasks include a balanced meal
  plan, a fitness schedule, a nutrition-label analysis, a hygiene or safety audit, a first-aid or self-defence
  demonstration, a disaster-preparedness plan, case studies, reflective journals and anti-bullying action plans.
  Participation in games, sports, fitness activities and yoga practice is practical and is not part of the chapters below.
  The syllabus gives eight key focus areas common to Classes IX and X, to be addressed progressively through
  experiential learning; it does not divide them by class, so SOYL presents all eight areas for Class IX as
  13 awareness chapters (health, nutrition, well-being, body and safety, sports awareness, yoga theory, inclusion,
  digital well-being) in syllabus order. No area-wise marks are published.
