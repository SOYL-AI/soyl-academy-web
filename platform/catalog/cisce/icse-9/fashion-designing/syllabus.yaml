# ICSE Class 9 Fashion Designing (Group III elective, code 70) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-fashion-designing (CLASS IX section only). Topic wording is our own summary of the official scope.
subject_id: icse-9-fashion-designing
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-fashion-designing, icse-2028-regulations]
exam_notes: >-
  There is no board examination in Class IX: the Class IX final examination is conducted internally by the school on
  the Class IX portion (ICSE 2028 Regulations), and promotion to Class X depends on cumulative achievement through the
  year. The syllabus prescribes one theory paper of 2 hours, 100 marks, plus internal assessment 100 marks; in the
  ICSE result the external paper and internal assessment each carry 50% (Group III), and school examinations usually
  follow this pattern. Internal assessment follows the Class X guidelines and is practical needlework: at least five
  practical-oriented assignments set by the teacher in Class IX (needlework tools and processes such as measuring,
  marking, hand and machine stitching, seams, darts, pleats and gathers; parts of a dress; making garments; sewing for
  the home; children's clothes) plus finished work of two dresses or combinations, or a set of four pieces, for the
  External Examiner; marked 50 by the subject teacher and 50 by the External Examiner. Practical work is not covered as
  chapters here. The Class X theory (tools and sewing machines, patterns and fitting, stitches and processes,
  decorative stitchery) is in icse-10-fashion-designing. No Class IX specimen paper was released for Fashion Designing.
  CISCE lists only three brief Class IX topics; SOYL breaks them into teachable chapters in syllabus order, using
  standard textiles and clothing content that falls within each topic (the detailed breakdown is SOYL's, not
  CISCE's). No topic-wise marks weightage is published.
