      - id: icse-9-chinese-group-2-ch06-t03
        title: "Vocabulary and idiom: opposites, related words and set expressions"
        learning_outcomes:
          - "Supply the opposite or a related word and use common set phrases and four-character idioms (chengyu) in context"
