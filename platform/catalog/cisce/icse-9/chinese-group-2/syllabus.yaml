chapters:
  - id: icse-9-chinese-group-2-ch01
    number: 1
    title: "Composition"
    unit: "Question 1: Composition"
    topics:
      - id: icse-9-chinese-group-2-ch01-t01
        title: "Planning a composition: ideas, outline, paragraphs and linking words"
        learning_outcomes:
          - "Draw up a short plan and write a composition of about 250 words in Chinese with an introduction, body and conclusion"
          - "Link ideas with connectors such as xian ... ranhou ... zuihou (first ... then ... finally), danshi (but), suoyi (so)"
      - id: icse-9-chinese-group-2-ch01-t02
        title: "Descriptions of people, places, festivals and events"
        learning_outcomes:
          - "Describe a person, place or festival in Chinese using precise vocabulary and the structural particle de and degree adverbs (hen, feichang, tai)"
      - id: icse-9-chinese-group-2-ch01-t03
        title: "Narratives: recounting an experience"
        learning_outcomes:
          - "Narrate a past experience in sequence using time words with the aspect particles le and guo"
      - id: icse-9-chinese-group-2-ch01-t04
        title: "Short explanations and directions"
        learning_outcomes:
          - "Explain how to do something or how to reach a place, using instructions and sequencing words"
      - id: icse-9-chinese-group-2-ch01-t05
        title: "Composition from a picture, object or language stimulus"
        learning_outcomes:
          - "Write a composition prompted by a picture or object, describing the scene and imagining what happened before and after"
    removed_topics: []
    literature_texts: []
  - id: icse-9-chinese-group-2-ch02
    number: 2
    title: "Letter writing"
    unit: "Question 2: Letter"
    topics:
      - id: icse-9-chinese-group-2-ch02-t01
        title: "Layout of a Chinese letter: address, date, salutation, body, closing formula and signature"
        learning_outcomes:
          - "Set out a letter in the correct Chinese layout, writing the date in the Chinese year-month-day order (2027 nian 3 yue 5 ri)"
      - id: icse-9-chinese-group-2-ch02-t02
        title: "Formal letters: request, complaint, enquiry, application"
        learning_outcomes:
          - "Write a formal letter of about 150 words using a respectful opening to the addressee and the set closing wishes"
      - id: icse-9-chinese-group-2-ch02-t03
        title: "Informal letters to friends and family: invitation, thanks, news"
        learning_outcomes:
          - "Write an informal letter of about 150 words using a familiar opening (qin'ai de ...) and friendly closing wishes"
      - id: icse-9-chinese-group-2-ch02-t04
        title: "Expanding the given suggestions into a complete letter"
        learning_outcomes:
          - "Cover every suggestion given in the question in a well-ordered letter"
          - "Keep the register consistent with the reader of the letter"
    removed_topics: []
    literature_texts: []
  - id: icse-9-chinese-group-2-ch03
    number: 3
    title: "Grammar: sounds, characters and basic word order"
    unit: "Question 3: Vocabulary, syntax and idiom"
    topics:
      - id: icse-9-chinese-group-2-ch03-t01
        title: "Pinyin, the four tones and the neutral tone; tone changes of bu and yi"
        learning_outcomes:
          - "Read and write pinyin with tone marks and apply the tone changes of bu and yi"
      - id: icse-9-chinese-group-2-ch03-t02
        title: "Characters: radicals, stroke order and simplified forms"
        learning_outcomes:
          - "Identify common radicals and write characters in the correct stroke order"
      - id: icse-9-chinese-group-2-ch03-t03
        title: "Basic word order: subject - time - place - verb - object"
        learning_outcomes:
          - "Place time and place expressions before the verb in a sentence"
      - id: icse-9-chinese-group-2-ch03-t04
        title: "Measure words (ge, ben, zhang, tiao, jian, bei) with numbers and the demonstratives zhe and na"
        learning_outcomes:
          - "Use the right measure word between a number or demonstrative and a noun"
      - id: icse-9-chinese-group-2-ch03-t05
        title: "Expressing time: dates, clock time, duration and frequency"
        learning_outcomes:
          - "Say and write dates and times and state how long or how often something happens"
    removed_topics: []
    literature_texts: []
  - id: icse-9-chinese-group-2-ch04
    number: 4
    title: "Grammar: verbs, aspect and complements"
    unit: "Question 3: Vocabulary, syntax and idiom"
    topics:
      - id: icse-9-chinese-group-2-ch04-t01
        title: "Modal verbs: hui, neng, keyi, yao, xiang, yinggai"
        learning_outcomes:
          - "Choose the modal verb that expresses ability, permission, wish or obligation"
      - id: icse-9-chinese-group-2-ch04-t02
        title: "Aspect: le (completed action and change), guo (past experience), zhe (continuing state); zai / zhengzai (action in progress)"
        learning_outcomes:
          - "Use le, guo and zhe correctly and describe an action in progress with zai"
      - id: icse-9-chinese-group-2-ch04-t03
        title: "The shi ... de construction for the time, place or manner of a past action"
        learning_outcomes:
          - "Stress when, where or how something happened with shi ... de"
      - id: icse-9-chinese-group-2-ch04-t04
        title: "Complements of result, direction and degree; the three particles pronounced de (structural, adverbial, complement)"
        learning_outcomes:
          - "Add result, direction and degree complements to verbs and choose the correct de particle"
      - id: icse-9-chinese-group-2-ch04-t05
        title: "The ba construction and the bei passive"
        learning_outcomes:
          - "Rewrite a sentence with ba to stress what happens to the object and with bei for the passive"
    removed_topics: []
    literature_texts: []
  - id: icse-9-chinese-group-2-ch05
    number: 5
    title: "Grammar: questions, negation, comparison and linking"
    unit: "Question 3: Vocabulary, syntax and idiom"
    topics:
      - id: icse-9-chinese-group-2-ch05-t01
        title: "Questions with ma and ne, affirmative-negative questions, haishi, and question words (shenme, shei, nar, ji, duoshao, zenme, weishenme)"
        learning_outcomes:
          - "Frame the question that matches a given answer using the appropriate question form"
      - id: icse-9-chinese-group-2-ch05-t02
        title: "Negation with bu and mei (you)"
        learning_outcomes:
          - "Choose bu or mei according to time reference and verb type"
      - id: icse-9-chinese-group-2-ch05-t03
        title: "Comparison: bi, gen ... yiyang, mei you ... name, zui"
        learning_outcomes:
          - "Compare people and things with bi and express equality and the superlative"
      - id: icse-9-chinese-group-2-ch05-t04
        title: "Paired conjunctions: yinwei ... suoyi, suiran ... danshi, ruguo ... jiu, yi ... jiu; haishi and huozhe"
        learning_outcomes:
          - "Join clauses with paired conjunctions and choose haishi or huozhe for \"or\""
    removed_topics: []
    literature_texts: []
  - id: icse-9-chinese-group-2-ch06
    number: 6
