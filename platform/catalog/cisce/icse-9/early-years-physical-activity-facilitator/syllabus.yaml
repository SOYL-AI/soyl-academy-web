# ICSE Class 9 Early Years Physical Activity Facilitator (code 75, Group III Section B vocational) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-vocational-early-years-pa-facilitator (Class IX section only). Topic wording is our own summary.
subject_id: icse-9-early-years-physical-activity-facilitator
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-vocational-early-years-pa-facilitator, icse-2028-regulations]
exam_notes: >-
  There is no board examination in Class IX: the school sets the Class IX examination on the Class IX portion. The
  syllabus prescribes one written paper of 2 hours, 100 marks: Part I-A Employability Skills 30 marks (Units 1-5) and
  Part I-B Vocational Skills 70 marks (Units 6-9); no further unit-wise weightage is published. Internal assessment of
  practical work 100 marks, assessed by the school on the Class X guidelines (subject teacher 50 and an external
  examiner nominated by the Head of School 50): Practical Work 70 (practical examination 40 - two practicals from
  different units; practical file 10; viva voce 20) and Project Work 30 (field visit or project report 10, student
  portfolio 10, viva voce 10). The syllabus pairs each theory list with practical activities (demonstrations, role
  plays, charts, field visits); these are assessed internally and are not listed as chapters here. The document has
  separate Class IX and Class X unit lists: this file covers the Class IX list only. No Class IX specimen paper is
  listed for this subject. CISCE lists learning outcomes unit by unit, not textbook chapters: SOYL groups them into 11
  teachable chapters in syllabus order (chapters 1-5 = Units 1-5; Unit 6 = chapters 6-8; Unit 7 = chapter 9; Unit 8 =
  chapter 10; Unit 9 = chapter 11).
units:
  - { name: "Part I-A: Employability Skills", marks: 30 }
  - { name: "Part I-B: Vocational Skills", marks: 70 }
chapters:
  - id: icse-9-early-years-physical-activity-facilitator-ch01
    number: 1
    title: "Communication Skills - I"
    unit: "Part I-A: Employability Skills"
    topics:
      - id: icse-9-early-years-physical-activity-facilitator-ch01-t01
        title: "Methods of communication: verbal, non-verbal and visual"
        learning_outcomes:
          - "Compare verbal, non-verbal and visual communication with one example of each"
          - "List the advantages and disadvantages of written, spoken and non-verbal communication"
          - "State dos and don'ts for avoiding common body-language mistakes"
      - id: icse-9-early-years-physical-activity-facilitator-ch01-t02
        title: "Meaning and importance of communication; elements of the communication cycle: sender, ideas, encoding, channel, receiver, decoding, feedback"
        learning_outcomes:
          - "Explain why good communication skills matter at school and at work"
          - "Draw and label the communication cycle and explain the role of each element"
          - "Trace the communication cycle in a simple exchange between a physical activity facilitator and a customer or colleague"
      - id: icse-9-early-years-physical-activity-facilitator-ch01-t03
        title: "Perspectives in communication and the factors that affect them: visual perception, language, past experience, prejudices, feelings, environment"
        learning_outcomes:
          - "Explain how each factor can change the way a message is understood"
          - "Suggest ways to reduce misunderstanding caused by differing perspectives at the workplace"
      - id: icse-9-early-years-physical-activity-facilitator-ch01-t04
        title: "Basic writing skills: phrases, kinds of sentences, parts of a sentence, parts of speech, use of articles, paragraph construction"
        learning_outcomes:
          - "Classify sentences by kind and identify the subject and predicate"
          - "Use parts of speech and articles correctly"
          - "Write a well-organised paragraph on a topic related to the subject"
    removed_topics: []
    literature_texts: []
