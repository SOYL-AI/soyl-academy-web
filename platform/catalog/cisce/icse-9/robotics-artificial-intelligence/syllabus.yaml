# ICSE Class 9 Robotics and Artificial Intelligence (code 66, Group III Section B vocational) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-vocational-robotics-ai (CLASS IX section only). Topic wording is our own summary.
subject_id: icse-9-robotics-artificial-intelligence
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-vocational-robotics-ai, icse-2028-regulations]
exam_notes: >-
  There is no board examination in Class IX: the school sets the Class IX examination on the Class IX portion. The
  syllabus prescribes one written paper of 2 hours, 100 marks, plus internal assessment 100 marks. Written paper
  weightage: Part I Robotics 50 marks (Introduction to Robotics 10, Robot as a System 20, Concepts in Robotics 20) and
  Part II Artificial Intelligence 50 marks (Introduction to AI 10, Role of Data and Information and Evolution of
  Computing 10, Introduction to Data and Programming with Python 20, AI Concepts and AI Project Framework 10). Internal
  assessment: at least 15 assignments in the year (3 robotics, 2 AI, 10 Python programming, e.g. prime check, HCF and
  LCM, Fibonacci series, if-elif discount bills), marked out of 100 by the subject teacher on class design 20, variable
  description 20, coding and documentation 20, and execution/output 40. Teacher demonstrations (a vibration-motor
  bristle-bot game and an intelligent robotic waste bin with ultrasonic, temperature, flame sensors and a servo lid) are
  for familiarisation and are not evaluated. No Class IX specimen paper is listed for this subject. CISCE lists topics,
  not textbook chapters: SOYL groups them into 11 teachable chapters in syllabus order.
units:
  - { name: "Part I, 1. Introduction to Robotics", marks: 10 }
  - { name: "Part I, 2. Robot as a System", marks: 20 }
  - { name: "Part I, 3. Concepts in Robotics", marks: 20 }
  - { name: "Part II, 1. Introduction to Artificial Intelligence (AI)", marks: 10 }
  - { name: "Part II, 2. Role of Data and Information, Evolution of Computing", marks: 10 }
  - { name: "Part II, 3. Introduction to Data and Programming with Python", marks: 20 }
  - { name: "Part II, 4. AI Concepts and AI Project Framework", marks: 10 }
