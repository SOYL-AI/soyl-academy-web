# ICSE Class 9 Commercial Studies (code 63, Group II) - ICSE 2028 course, CLASS IX portion only.
# Source: platform/catalog/sources/cisce.md#icse-2028-commercial-studies. Topic wording is our own summary of the official scope.
subject_id: icse-9-commercial-studies
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-commercial-studies, icse-2028-regulations]
exam_notes: >-
  Class IX is year one of the two-year ICSE 2028 course: there is no board examination in Class IX. The school conducts
  the Class IX final examination on the Class IX portion (Regulations). The syllabus prescribes one written paper of
  2 hours, 80 marks, plus internal assessment 20 marks (one project set by the teacher from the syllabus; marked 10 by the
  subject teacher and 10 by an external examiner). Group II elective; candidates offering Commercial Applications
  (Group III) may not offer Commercial Studies. The syllabus does not print the question-paper pattern; school papers
  usually follow the ICSE Group II pattern of compulsory short-answer questions across the syllabus followed by a choice
  of structured long questions. Bookkeeping is examined as simple numerical work: journal entries, ledger posting and
  balancing, and a trial balance from given ledger balances. Class X topics (stakeholders, marketing and sales, final
  accounts, human resources, logistics, central and internet banking, government environmental initiatives) are in
  icse-10-commercial-studies. CISCE lists numbered topics, not textbook chapters: SOYL groups them into 12 teachable
  chapters in syllabus order. No unit-wise marks weightage is published.
