# ICSE Class 9 Literature in English (English Paper 2, code 01) - ICSE 2028 course, CLASS IX portion only.
# Sources: platform/catalog/sources/cisce.md#icse-2028-english and #icse-2028-prescribed-books.
# Literature: titles and authors only. Students read the texts in their own copy of the play and of Treasure Chest.
subject_id: icse-9-literature-in-english
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-english, icse-2028-prescribed-books, icse-2028-regulations]
exam_notes: >-
  English (01) is examined as two separately set papers; this is Paper 2, Literature in English. Class IX is year one of
  the two-year ICSE 2028 course: there is no board examination in Class IX; the Class IX examination is conducted by the
  school on the portion prescribed for Class IX only (syllabus note and Regulations).
  The syllabus prescribes one paper of 2 hours, 80 marks, on Drama (Julius Caesar, Acts I and II), Prose (five short
  stories) and Poetry (five poems), the last two from Treasure Chest: A Collection of ICSE Short Stories and Poems
  (Evergreen Publications); Appendix I says all the listed stories and poems are to be studied. Questions are central to
  the text; drama and prose questions may be set on extracts, and poetry questions on a poem or lines from it, testing
  content, understanding and personal response to the poem as a whole. Internal assessment 20 marks: two or three written
  assignments of about 300-400 words each on the prescribed texts (pair/group work encouraged), marked by the subject
  teacher and an external examiner.
  Julius Caesar Acts III-V and the Class X stories and poems are in icse-10-literature-in-english. CISCE lists texts, not
  chapters: SOYL gives one chapter per act of the play, one chapter on character and theme in Acts I-II, one chapter
  each for the stories and poems, and a chapter on literary devices and answering extract-based questions.
units:
  - { name: "Drama: Julius Caesar (Acts I-II)", marks: null }
  - { name: "Prose: Short Stories", marks: null }
  - { name: "Poetry", marks: null }
chapters:
  - id: icse-9-literature-in-english-ch01
    number: 1
    title: "Julius Caesar: Act I"
    unit: "Drama: Julius Caesar (Acts I-II)"
    topics:
      - id: icse-9-literature-in-english-ch01-t01
        title: "Act I Scene 1: the tribunes Flavius and Marullus and the commoners celebrating Caesar's triumph"
        learning_outcomes:
          - "Explain why the tribunes rebuke the commoners and what this reveals about divided opinion in Rome"
          - "Comment on the puns of the cobbler and the fickleness of the crowd"
      - id: icse-9-literature-in-english-ch01-t02
        title: "Act I Scene 2: the Feast of Lupercal and the Soothsayer's warning"
        learning_outcomes:
          - "Explain the significance of the warning about the Ides of March and Caesar's dismissal of it"
          - "Describe what Caesar's request to Antony about Calpurnia reveals about him"
      - id: icse-9-literature-in-english-ch01-t03
        title: "Act I Scene 2: Cassius sounds out Brutus"
        learning_outcomes:
          - "Analyse the arguments and flattery Cassius uses to turn Brutus against Caesar, including his stories of Caesar's weakness"
          - "Explain Brutus' inner conflict between love for Caesar and concern for Rome"
      - id: icse-9-literature-in-english-ch01-t04
        title: "Act I Scene 2: Casca's account of the offer of the crown; Caesar's view of Cassius; Cassius' soliloquy"
        learning_outcomes:
          - "Summarise Casca's report of the crown being offered and refused and of Caesar's fit"
          - "Explain Caesar's judgement of Cassius and what it shows about both men"
          - "Explain Cassius' plan, revealed in his soliloquy, to win Brutus through forged letters"
      - id: icse-9-literature-in-english-ch01-t05
        title: "Act I Scene 3: the storm, the portents and Cassius drawing Casca into the conspiracy"
        learning_outcomes:
          - "Describe the unnatural portents seen during the storm and explain how Cassius and Casca interpret them"
          - "Explain why the conspirators need Brutus to join them"
    removed_topics: []
    literature_texts:
      - { title: "Julius Caesar (Act I)", author: "William Shakespeare" }
  - id: icse-9-literature-in-english-ch02
    number: 2
    title: "Julius Caesar: Act II"
    unit: "Drama: Julius Caesar (Acts I-II)"
    topics:
      - id: icse-9-literature-in-english-ch02-t01
        title: "Act II Scene 1: Brutus' soliloquy in the orchard and his decision"
        learning_outcomes:
          - "Explain the reasoning by which Brutus decides that Caesar must die"
          - "Explain the effect of the forged letters on Brutus"
      - id: icse-9-literature-in-english-ch02-t02
        title: "Act II Scene 1: the meeting of the conspirators and Brutus' decisions on the oath, Cicero and Antony"
        learning_outcomes:
          - "Explain why Brutus rejects an oath, the inclusion of Cicero and the killing of Antony"
          - "Evaluate how these decisions show Brutus' idealism and his errors of judgement"
      - id: icse-9-literature-in-english-ch02-t03
        title: "Act II Scene 1: Portia and Brutus; Ligarius joins the cause"
        learning_outcomes:
          - "Analyse how Portia persuades Brutus to confide in her and what the scene shows about their marriage"
      - id: icse-9-literature-in-english-ch02-t04
        title: "Act II Scene 2: Calpurnia's dream, the augurers and Decius' reinterpretation"
        learning_outcomes:
          - "Describe Calpurnia's fears and explain why Caesar first agrees to stay at home"
          - "Explain how Decius flatters Caesar and reinterprets the dream to bring him to the Senate"
          - "Identify the dramatic irony when Caesar greets the conspirators as friends"
      - id: icse-9-literature-in-english-ch02-t05
        title: "Act II Scenes 3-4: Artemidorus' letter and Portia's anxiety"
        learning_outcomes:
          - "Explain how the scenes with Artemidorus and Portia build suspense before the assassination"
    removed_topics: []
    literature_texts:
      - { title: "Julius Caesar (Act II)", author: "William Shakespeare" }
  - id: icse-9-literature-in-english-ch03
    number: 3
    title: "Julius Caesar (Acts I-II): Characters, Themes and Dramatic Devices"
    unit: "Drama: Julius Caesar (Acts I-II)"
    topics:
      - id: icse-9-literature-in-english-ch03-t01
        title: "Background: Shakespeare's Roman play, the historical Caesar and the Roman Republic"
        learning_outcomes:
          - "Explain the political situation in Rome at the opening of the play and why some feared Caesar's ambition"
      - id: icse-9-literature-in-english-ch03-t02
        title: "Characters of Caesar, Brutus and Cassius in Acts I-II"
        learning_outcomes:
          - "Write a character sketch of Brutus or Cassius supported by incidents from Acts I and II"
          - "Contrast Caesar's public image of strength with the hints of physical weakness and vanity"
      - id: icse-9-literature-in-english-ch03-t03
        title: "Minor characters: Casca, Calpurnia, Portia, Decius, the Soothsayer and the commoners"
        learning_outcomes:
          - "Explain the dramatic function of a minor character in the first two acts"
      - id: icse-9-literature-in-english-ch03-t04
        title: "Themes: ambition and power, honour, friendship and manipulation, fate and omens"
        learning_outcomes:
          - "Discuss a theme with reference to at least two scenes from Acts I and II"
      - id: icse-9-literature-in-english-ch03-t05
        title: "Dramatic devices: soliloquy, dramatic irony, foreshadowing and the supernatural"
        learning_outcomes:
          - "Identify and explain the effect of a soliloquy, dramatic irony, an omen or foreshadowing in a given extract"
    removed_topics:
      - "Julius Caesar Acts III, IV and V (Class X portion; see icse-10-literature-in-english)"
    literature_texts: []
  - id: icse-9-literature-in-english-ch04
    number: 4
    title: "Treasure Chest: Short Stories (Class IX portion)"
    unit: "Prose: Short Stories"
    topics:
      - id: icse-9-literature-in-english-ch04-t01
        title: "Bonku Babu's Friend (Satyajit Ray): a timid teacher, an extraordinary encounter and self-respect"
        learning_outcomes:
          - "Describe how Bonku Babu is treated by the people at the evening gatherings"
          - "Explain how his encounter with the visitor from another planet changes him"
          - "Discuss the story's message about courage and self-respect"
      - id: icse-9-literature-in-english-ch04-t02
        title: "Oliver Asks for More (Charles Dickens): life in the workhouse and social satire"
        learning_outcomes:
          - "Describe the conditions of the boys in the workhouse"
          - "Explain why Oliver asks for more and how the authorities react"
          - "Identify Dickens' use of irony to criticise the treatment of the poor"
      - id: icse-9-literature-in-english-ch04-t03
        title: "The Model Millionaire (Oscar Wilde): generosity, appearance and reality"
        learning_outcomes:
          - "Summarise the plot, including Hughie's gift to the model and its unexpected result"
          - "Explain the irony of the title and the theme that appearances can deceive"
          - "Describe the character of Hughie Erskine"
      - id: icse-9-literature-in-english-ch04-t04
        title: "The Home-coming (Rabindranath Tagore): adolescence, loneliness and longing for home"
        learning_outcomes:
          - "Describe Phatik's life in the village and his difficulties after moving to Calcutta"
          - "Analyse the causes of Phatik's unhappiness and the role of the adults around him"
          - "Explain the meaning of the title"
      - id: icse-9-literature-in-english-ch04-t05
        title: "The Boy who Broke the Bank (Ruskin Bond): rumour and its chain of consequences"
        learning_outcomes:
          - "Trace how Nathu's complaint grows into a rumour that ruins the bank"
          - "Explain the humour and irony of the ending"
          - "Discuss the story's message about gossip and its effects"
    removed_topics:
      - "Class X short stories of Treasure Chest (see icse-10-literature-in-english)"
    literature_texts:
      - { title: "Bonku Babu's Friend", author: "Satyajit Ray" }
      - { title: "Oliver Asks for More", author: "Charles Dickens" }
      - { title: "The Model Millionaire", author: "Oscar Wilde" }
      - { title: "The Home-coming", author: "Rabindranath Tagore" }
      - { title: "The Boy who Broke the Bank", author: "Ruskin Bond" }
  - id: icse-9-literature-in-english-ch05
    number: 5
    title: "Treasure Chest: Poems (Class IX portion)"
    unit: "Poetry"
    topics:
      - id: icse-9-literature-in-english-ch05-t01
        title: "The Night Mail (W.H. Auden): the overnight mail train and the human need for letters"
        learning_outcomes:
          - "Describe the journey of the mail train as presented in the poem"
          - "Explain how rhythm and sound imitate the movement of the train"
          - "Discuss what the poem says about the importance of letters to people"
      - id: icse-9-literature-in-english-ch05-t02
        title: "Skimbleshanks: The Railway Cat (T.S. Eliot): humour and personification"
        learning_outcomes:
          - "Describe how Skimbleshanks is presented as being in charge of the night train"
          - "Identify personification, rhyme and rhythm and explain how they create humour"
      - id: icse-9-literature-in-english-ch05-t03
        title: "I Remember, I Remember (Thomas Hood): childhood memories and the loss of innocence"
        learning_outcomes:
          - "Explain the memories of childhood the speaker recalls"
          - "Explain the contrast between childhood happiness and adult feeling and the effect of the refrain"
      - id: icse-9-literature-in-english-ch05-t04
        title: "A Doctor's Journal Entry for August 6, 1945 (Vikram Seth): the bombing of Hiroshima"
        learning_outcomes:
          - "Explain the historical event behind the poem and the speaker's situation"
          - "Analyse how imagery and the journal form convey the horror and confusion of the bombing"
          - "Discuss the poem's message about war"
      - id: icse-9-literature-in-english-ch05-t05
        title: "A Work of Artifice (Marge Piercy): the bonsai tree as an extended metaphor"
        learning_outcomes:
          - "Explain the extended metaphor of the bonsai tree and what it suggests about the restriction of women"
          - "Comment on the poem's tone and its use of free verse"
    removed_topics:
      - "Class X poems of Treasure Chest (see icse-10-literature-in-english)"
    literature_texts:
      - { title: "The Night Mail", author: "W.H. Auden" }
      - { title: "Skimbleshanks: The Railway Cat", author: "T.S. Eliot" }
      - { title: "I Remember, I Remember", author: "Thomas Hood" }
      - { title: "A Doctor's Journal Entry for August 6, 1945", author: "Vikram Seth" }
      - { title: "A Work of Artifice", author: "Marge Piercy" }
  - id: icse-9-literature-in-english-ch06
    number: 6
    title: "Literary Devices and Answering Extract-based Questions"
    unit: null
    topics:
      - id: icse-9-literature-in-english-ch06-t01
        title: "Figures of speech: simile, metaphor, personification, alliteration, onomatopoeia, hyperbole, irony"
        learning_outcomes:
          - "Identify a figure of speech in a given line and explain its effect"
      - id: icse-9-literature-in-english-ch06-t02
        title: "Poetic form and sound: rhyme scheme, rhythm, refrain, stanza, free verse, tone and mood"
        learning_outcomes:
          - "Work out the rhyme scheme of a stanza and describe the tone and mood of a poem"
      - id: icse-9-literature-in-english-ch06-t03
        title: "Elements of a short story and a play: plot, setting, character, point of view, conflict, climax"
        learning_outcomes:
          - "Identify the setting, conflict, climax and point of view of a prescribed story"
      - id: icse-9-literature-in-english-ch06-t04
        title: "Answering questions on extracts: speaker, listener, situation and meaning"
        learning_outcomes:
          - "Place an extract in context by identifying speaker, listener and situation"
          - "Explain the meaning of words and lines in an extract in one's own words"
      - id: icse-9-literature-in-english-ch06-t05
        title: "Writing longer answers: character sketches, themes and personal response"
        learning_outcomes:
          - "Write a structured answer that supports each point with close reference to the text"
          - "Give a reasoned personal response to a character, event or poem"
    removed_topics: []
    literature_texts: []
