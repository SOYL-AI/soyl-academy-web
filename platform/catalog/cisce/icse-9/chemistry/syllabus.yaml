# ICSE Class 9 Chemistry (Science Paper 2) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-chemistry (CLASS IX section only). Topic wording is our own summary of the official scope.
subject_id: icse-9-chemistry
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-chemistry, icse-2028-regulations]
exam_notes: >-
  There is no board examination in Class IX: the Class IX final examination is conducted internally by the school on the
  Class IX portion (ICSE 2028 Regulations), and promotion to Class X depends on cumulative achievement through the year.
  The syllabus prescribes one theory paper of 2 hours, 80 marks, plus internal assessment of practical work 20 marks;
  school examinations usually follow this pattern. Every reaction is studied with reactants, products, conditions,
  observations, balanced equations and diagrams.
  Practical work (assessed internally, not in the theory chapters): recognition of the gases H2, O2, CO2, Cl2, HCl, SO2,
  H2S, NH3, water vapour and NO2; action of heat on copper and zinc carbonates, washing soda, copper sulphate crystals,
  zinc, copper and lead nitrates, ammonium chloride, iodine and ammonium dichromate; flame tests for sodium, potassium,
  calcium and copper salts; simple experiments on hard and soft water; the three prescribed double displacement
  reactions; and a local survey of sources of water pollution with suggested preventive steps.
  No Class IX specimen paper was released for Chemistry.
  CISCE publishes a topic list in eight sections, not textbook chapters: SOYL groups it into 13 teachable chapters in
  syllabus order. No unit-wise marks weightage is published for ICSE Chemistry.
