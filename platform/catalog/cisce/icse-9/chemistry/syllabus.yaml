chapters:
  - id: icse-9-chemistry-ch01
    number: 1
    title: "Symbols, Valency, Radicals and Formulae"
    unit: "1. The Language of Chemistry"
    topics:
      - id: icse-9-chemistry-ch01-t01
        title: "Symbols of elements: definition and the symbols of commonly used elements"
        learning_outcomes:
          - "Write the symbols of common elements, including those derived from Latin names"
          - "Explain what a symbol represents qualitatively and quantitatively"
      - id: icse-9-chemistry-ch01-t02
        title: "Valency: definition; combining with hydrogen; valence electrons of metals and non-metals; mono-, di-, tri- and tetravalent elements"
        learning_outcomes:
          - "Deduce the valency of an element from its hydride or from its valence electrons"
          - "Classify given elements as monovalent, divalent, trivalent or tetravalent"
      - id: icse-9-chemistry-ch01-t03
        title: "Radicals: definition, valencies of common acidic and basic radicals"
        learning_outcomes:
          - "Name common positive and negative radicals and state their valencies"
          - "Distinguish a simple radical from a compound radical"
      - id: icse-9-chemistry-ch01-t04
        title: "Radicals in the atmosphere: their effects on living organisms and ways of reducing them"
        learning_outcomes:
          - "Explain how reactive radicals present in polluted air can harm living organisms"
          - "Suggest ways to reduce the formation of harmful radicals in the atmosphere"
      - id: icse-9-chemistry-ch01-t05
        title: "Writing names and formulae of compounds using valencies"
        learning_outcomes:
          - "Write the formula of a compound by exchanging valencies of its radicals"
          - "Name a compound from its formula"
