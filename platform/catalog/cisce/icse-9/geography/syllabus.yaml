# ICSE Class 9 Geography (H.C.G. Paper 2, code 50) - ICSE 2028 course, CLASS IX portion only (Principles of Geography).
# Source: platform/catalog/sources/cisce.md#icse-2028-geography. Topic wording is our own summary of the official scope.
subject_id: icse-9-geography
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-geography, icse-2028-regulations]
exam_notes: >-
  History, Civics and Geography (50) is examined as two papers; this is Paper 2. Class IX is year one of the two-year
  ICSE 2028 course: there is no board examination in Class IX. The school conducts the Class IX final examination on the
  Class IX portion (Principles of Geography) per the Regulations.
  The syllabus prescribes one theory paper of 2 hours, 80 marks, plus internal assessment 20 marks: a record file of any
  three practical exercises (uses of maps, directions, reading scales, reading a town guide or atlas map, drawing and
  recognising contour forms, a sketch map; 10 marks) and one project report (e.g. weather records, pollution of a local
  water body, meteorological instruments; 10 marks), marked by the subject teacher and an external examiner. These
  practical exercises are school-assessed, so they are not chapters here. Answers are expected to use sketches,
  diagrams, graphs and charts, and questions may require interpreting photographs of geographical interest.
  World outline-map work (natural regions, oceans, seas, gulfs, straits, rivers, mountains, plateaus) is part of the
  written syllabus and is taught as chapters 17-18. Class X (topographical maps, map of India, Geography of India) is in
  icse-10-geography. CISCE lists numbered topics, not textbook chapters: SOYL groups them into 18 teachable chapters in
  syllabus order. No marks weightage per topic is published.
