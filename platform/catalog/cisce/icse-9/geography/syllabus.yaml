    title: "Earth as a Planet and Latitudes"
    unit: "1. Our World"
    topics:
      - id: icse-9-geography-ch01-t01
        title: "Shape of the earth and evidence for it"
        learning_outcomes:
          - "Describe the shape of the earth as a geoid"
          - "Give evidence that the earth is spherical, such as ships appearing mast-first and satellite images"
      - id: icse-9-geography-ch01-t02
        title: "Earth as the home of humankind: conditions that support life"
        learning_outcomes:
          - "Explain the conditions that make life possible on earth: suitable temperature, water, oxygen and a protective atmosphere"
      - id: icse-9-geography-ch01-t03
        title: "Concept of latitude; the main latitudes and their location in degrees"
        learning_outcomes:
          - "Define latitude and explain how it is measured from the centre of the earth"
          - "Locate the Equator, the Tropics of Cancer and Capricorn and the Arctic and Antarctic Circles with their values in degrees"
      - id: icse-9-geography-ch01-t04
        title: "Parallels of latitude and their uses; heat zones"
        learning_outcomes:
          - "State the characteristics of parallels of latitude"
          - "Explain the uses of latitudes, including dividing the earth into Torrid, Temperate and Frigid heat zones"
    removed_topics: []
    literature_texts: []
  - id: icse-9-geography-ch02
