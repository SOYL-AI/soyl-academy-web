# ICSE Class 9 Thai (Modern Foreign Language, Group II, no code published) - ICSE 2028 course.
# The syllabus is common to Classes IX and X with no class-wise split, so all of it is covered. No textbooks or literature are prescribed.
subject_id: icse-9-thai-group-2
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-mfl-group-2, icse-2028-regulations]
exam_notes: >-
  Class IX is year one of the two-year ICSE 2028 course: there is no board examination in Class IX; the school sets the Class IX examination on the portion covered during the year, normally on the ICSE paper pattern below. The syllabus is common to Classes IX and X and CISCE prescribes no class-wise split, so this file covers all of it. Thai is
  examined on the common Group II rubric that CISCE sets for Modern Armenian (23), Portuguese (81), Tibetan, Thai, Chinese and Russian (79);
  papers are set on request. CISCE's ICSE 2028 Group II list names Thai without a subject code, so no code is given here. One paper of 3 hours, 80 marks: (1) a composition of about 250 words (explanation, directions, description or
  narrative) from a choice of subjects or stimuli; (2) a letter of about 150 words from a choice of two subjects, layout assessed;
  (3) vocabulary, syntax and idiom - sentence synthesis and forming sentences that embody given words or forms, with no knowledge of
  grammatical terms required; (4) an unseen passage of about 150 words with questions answered in Thai; (5) translation of a short
  passage from Thai into English. CISCE does not publish marks per question and prescribes no textbooks. Internal assessment 20 marks:
  two or three assignments in Class IX (suggested: creative writing from stimuli such as recorded music or sounds, a picture, an opening
  sentence or a news clipping, factual and expressive writing, a film or book review), marked 10 by the subject teacher and 10 by an
  external examiner. CISCE gives no language-specific grammar for Thai: the grammar chapters are SOYL's breakdown for this language
  (Standard (Central) Thai in Thai script, with romanisation in SOYL topic titles) - not CISCE's. A candidate taking a modern foreign language in Group II cannot take one in Group I. CISCE lists topics not chapters; SOYL grouped them into teachable chapters in syllabus order.
