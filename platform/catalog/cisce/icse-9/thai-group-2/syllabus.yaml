chapters:
  - id: icse-9-thai-group-2-ch01
    number: 1
    title: "Composition"
    unit: "Question 1: Composition"
    topics:
      - id: icse-9-thai-group-2-ch01-t01
        title: "Planning a composition: ideas, outline, paragraphs and linking words"
        learning_outcomes:
          - "Draw up a short plan and write a composition of about 250 words in Thai with an introduction, body and conclusion"
          - "Link ideas with connectors such as kon (first), laeo ko (and then), nai thi sut (finally), tae (but), dangnan (therefore)"
      - id: icse-9-thai-group-2-ch01-t02
        title: "Descriptions of people, places, festivals and events"
        learning_outcomes:
          - "Describe a person, place or festival in Thai using precise vocabulary and modifiers placed after the noun and classifiers"
      - id: icse-9-thai-group-2-ch01-t03
        title: "Narratives: recounting an experience"
        learning_outcomes:
          - "Narrate a past experience in sequence using time words and the markers laeo and khoei (Thai verbs do not change for tense)"
      - id: icse-9-thai-group-2-ch01-t04
        title: "Short explanations and directions"
        learning_outcomes:
          - "Explain how to do something or how to reach a place, using instructions and sequencing words"
      - id: icse-9-thai-group-2-ch01-t05
        title: "Composition from a picture, object or language stimulus"
        learning_outcomes:
          - "Write a composition prompted by a picture or object, describing the scene and imagining what happened before and after"
