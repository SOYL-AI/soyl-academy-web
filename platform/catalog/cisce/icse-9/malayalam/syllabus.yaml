    title: "Novel: Mayyazhippuzhayude Theerangalil (Chapters 1 to 21)"
    unit: "Section B: Prescribed Texts"
    topics:
      - id: icse-9-malayalam-ch08-t01
        title: "Chapters 1-7: opening of the story, setting and the main families"
        learning_outcomes:
