          - "Describe Karna's character as presented by the poet"
          - "Comment on Ulloor's classical diction and figures of speech"
      - id: icse-9-malayalam-ch07-t05
        title: "Priyathame Prabhatame (K. Ayyappa Panicker): central idea, imagery and modern style"
        learning_outcomes:
          - "Explain the central idea of the poem in their own words"
          - "Identify the main images or figures of speech and explain what they convey"
          - "Comment on the poet's message and its relevance today"
