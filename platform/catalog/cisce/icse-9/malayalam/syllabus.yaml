      - id: icse-9-malayalam-ch08-t04
        title: "Character sketches: Dasan and other major characters"
        learning_outcomes:
          - "Write a character sketch of Dasan or another major character with examples from the novel"
      - id: icse-9-malayalam-ch08-t05
        title: "Setting and themes: colonial Mayyazhi, French rule and the river"
        learning_outcomes:
          - "Explain how the setting of Mayyazhi and its river shapes the story"
          - "Identify the theme of colonial rule as it appears in the prescribed chapters"
    removed_topics:
      - "Chapters 22 to 43 (Class X portion; see icse-10-malayalam)"
    literature_texts:
      - { title: "Mayyazhippuzhayude Theerangalil (Chapters 1 to 21)", author: "M. Mukundan" }
  - id: icse-9-malayalam-ch09
    number: 9
    title: "Drama: Saketham (Scene 1 - Onnam Ankam and Scene 2 - Randaam Ankam)"
    unit: "Section B: Prescribed Texts"
    topics:
      - id: icse-9-malayalam-ch09-t01
        title: "Scene 1 (Onnam Ankam): summary of the action"
        learning_outcomes:
          - "Summarise the action of Scene 1 in their own words"
      - id: icse-9-malayalam-ch09-t02
        title: "Scene 2 (Randaam Ankam): summary of the action"
        learning_outcomes:
          - "Summarise the action of Scene 2 in their own words"
      - id: icse-9-malayalam-ch09-t03
        title: "Characters in Scenes 1 and 2 and their inner conflicts"
        learning_outcomes:
          - "Describe the main characters of these scenes and the conflicts they face"
      - id: icse-9-malayalam-ch09-t04
        title: "Ramayana background, themes and dramatic technique"
        learning_outcomes:
          - "Explain how the play reinterprets its Ramayana source"
          - "Comment on the use of dialogue and stage directions in the scenes"
    removed_topics:
