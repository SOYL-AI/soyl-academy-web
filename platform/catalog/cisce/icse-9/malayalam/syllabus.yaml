      - { title: "Bhoomikkoru Charama Geetham", author: "O. N. V. Kuruppu" }
      - { title: "Karnabhushanam (lines 1-110)", author: "Ulloor S. Parameswara Iyer" }
      - { title: "Priyathame Prabhatame", author: "K. Ayyappa Panicker" }
  - id: icse-9-malayalam-ch08
