# ICSE Class 9 German (Second Language, Group I, code 28) - ICSE 2028 course.
# CISCE has not bifurcated this syllabus, so the whole Classes IX-X syllabus is covered. No literature is prescribed.
subject_id: icse-9-german-second-language
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-mfl-group-1, icse-2028-prescribed-books, icse-2027-class-ix-specimen-papers, icse-2028-regulations]
exam_notes: >-
  Class IX is year one of the two-year ICSE 2028 course: there is no board examination in Class IX; the school sets the Class IX examination on the portion covered during the year, normally on the ICSE paper pattern below. CISCE has not prescribed a bifurcation: the Class X (ICSE 2028) paper is set on the entire syllabus and the Class IX
  internal examination covers the portion taught in the year, so this file covers the whole syllabus. The ICSE 2028 German syllabus
  is new and aligned to CEFR level A2. One paper of 3 hours, 80 marks: (1) composition of about 100-120 words - a narrative of a past
  event, a description (e.g. of a picture) or a simple opinion text such as an article or blog - 15 marks; (2) an email of about 80-100
  words, informal or semi-formal, with the layout and subject line assessed - 15 marks; (3) comprehension - three or four reading tasks on
  short everyday documents (postcards, announcements, job advertisements, menus, classified ads) with multiple-choice, true/false with
  justification and similar questions answered in German - 30 marks; (4) grammar - short functional tasks (conjugation, fill in the
  blanks, error correction, questions and negatives, jumbled sentences, multiple choice, sentence transformation), with no grammatical
  definitions - 20 marks. The CISCE Class IX specimen paper follows this pattern (Q1 composition 15, Q2 email 15, Q3-Q5 reading 10 each,
  Q6 grammar 20). Composition and email are marked on pragmatic, sociolinguistic (politeness formulas and tone) and linguistic
  (vocabulary, grammar) competences. Internal assessment 20 marks, listening 10 and speaking 10: in Class IX four assessments, all by the
  subject teacher (the fourth at the internal final examination); listening uses two or three short audio clips (announcements, voicemail,
  dialogue) with objective questions; speaking has three tasks - interaction (1 min), prepared monologue on an annexe topic (2 min) and
  role play (3-4 min). CISCE gives the German grammar as an unordered list (articles, verb types, verbs with fixed prepositions, sentence structure, Präsens and Partizip II, Präteritum of sein, haben and the modal verbs, imperative, suggestions with sollen/sollten, pronouns in three cases, question words, relative, demonstrative and possessive pronouns, prepositions with all four cases, two-way prepositions, adjective declension and comparison, negation, nominalisation, connectors, final clauses); SOYL grouped every item by grammar area. The Annexe topics (A Identity and culture; B Holidays, tourism and travel; C Health, education and
  technology; D The world around) supply the vocabulary and situations for all four skills. The German annexe prints "France (geography)" under culture and traditions, evidently a slip for the German-speaking countries; SOYL reads it that way. Suggested (not prescribed) books: Beste Freunde B1.1 for both years (Hueber, published in India by Goyal) and Get Ready (Goyal) for Classes 9 and 10. The German syllabus is the same in Group I (28) and Group II (80, icse-9-german-group-2); a candidate taking a modern foreign language in Group I cannot take one in Group II. CISCE lists topics not chapters; SOYL grouped them into teachable chapters in syllabus order.
units:
  - { name: "1. Composition", marks: 15 }
  - { name: "2. Email writing", marks: 15 }
  - { name: "3. Comprehension", marks: 30 }
  - { name: "4. Grammar", marks: 20 }
  - { name: "Annexe: Topics for reading, writing, listening and speaking", marks: null }
chapters:
  - id: icse-9-german-second-language-ch01
    number: 1
    title: "Composition (Aufsatz)"
    unit: "1. Composition"
    topics:
      - id: icse-9-german-second-language-ch01-t01
        title: "Composition types and planning: narrative, descriptive and opinion texts of about 100-120 words"
        learning_outcomes:
          - "Identify whether a task asks for a narrative, a description or an opinion and draw up a short plan"
          - "Write a composition of about 100-120 words in German with an introduction, body and conclusion"
      - id: icse-9-german-second-language-ch01-t02
        title: "Narrative text: recounting a past event or personal experience"
        learning_outcomes:
          - "Narrate a past event in sequence using the Perfekt and the Präteritum of sein, haben and the modal verbs correctly"
          - "Describe feelings and reactions to the event with suitable vocabulary"
      - id: icse-9-german-second-language-ch01-t03
        title: "Descriptive text: describing a picture, a person or a place"
        learning_outcomes:
          - "Describe what a picture shows (people, place, action) and then what it suggests or what might happen next"
      - id: icse-9-german-second-language-ch01-t04
        title: "Opinion text: article, blog post, forum message or magazine contribution"
        learning_outcomes:
          - "State and justify an opinion on a familiar topic using expressions such as meiner Meinung nach, ich finde, dass ..., ich glaube, dass ..."
          - "Support an opinion with at least two reasons or examples"
      - id: icse-9-german-second-language-ch01-t05
        title: "Coherence, cohesion and accuracy: connectors, paragraphs and self-checking"
        learning_outcomes:
          - "Link statements with common connectors such as zuerst, dann, danach, zum Schluss, aber, deshalb"
          - "Check a draft against the marking criteria (content, coherence, vocabulary, grammar) and correct agreement and spelling errors"
    removed_topics: []
    literature_texts: []
  - id: icse-9-german-second-language-ch02
    number: 2
    title: "Email writing (Die E-Mail)"
    unit: "2. Email writing"
    topics:
      - id: icse-9-german-second-language-ch02-t01
        title: "Layout of an email: Betreff (subject line), greeting, introduction, body, closing and sign-off"
        learning_outcomes:
          - "Set out an email in German with a relevant subject line, a greeting, clear paragraphs and a sign-off"
      - id: icse-9-german-second-language-ch02-t02
        title: "Informal emails to friends and family: news, invitations, thanks, holiday plans"
        learning_outcomes:
          - "Write an informal email of about 80-100 words in German sharing news or accepting or declining an invitation"
      - id: icse-9-german-second-language-ch02-t03
        title: "Semi-formal emails: nach Informationen fragen, sich bedanken, Einladung"
        learning_outcomes:
          - "Write a semi-formal email asking for information, thanking someone or replying to an invitation"
      - id: icse-9-german-second-language-ch02-t04
        title: "Tone and politeness formulas (Liebe / Lieber ..., Sehr geehrte Frau ... / Sehr geehrter Herr ...; Viele Grüße, Liebe Grüße, Mit freundlichen Grüßen)"
        learning_outcomes:
          - "Choose du or Sie and the matching greeting and closing for an informal or a semi-formal reader"
      - id: icse-9-german-second-language-ch02-t05
        title: "Covering every cue within the word limit"
        learning_outcomes:
          - "Address every cue given in the question in a logical order, within about 80-100 words"
    removed_topics: []
    literature_texts: []
  - id: icse-9-german-second-language-ch03
    number: 3
    title: "Reading comprehension (Leseverstehen)"
    unit: "3. Comprehension"
    topics:
