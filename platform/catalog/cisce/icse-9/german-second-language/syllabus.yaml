        title: "Short everyday documents: postcards, notices, announcements and opening hours"
        learning_outcomes:
          - "Locate dates, times, places and prices in a short everyday document"
      - id: icse-9-german-second-language-ch03-t02
        title: "Advertisements, menus, job advertisements and classified ads"
        learning_outcomes:
          - "Compare the information in several short advertisements or announcements to answer a question"
      - id: icse-9-german-second-language-ch03-t03
        title: "Short narrative or informative passages on everyday topics"
        learning_outcomes:
          - "State the main idea of a short passage and identify the key details"
          - "Work out the meaning of an unfamiliar word from context"
      - id: icse-9-german-second-language-ch03-t04
        title: "Question formats: multiple choice, true or false with justification, fill in the blanks"
        learning_outcomes:
          - "Decide whether a statement is true or false and justify the answer with evidence from the text"
      - id: icse-9-german-second-language-ch03-t05
        title: "Answering in German in one's own words"
        learning_outcomes:
          - "Answer questions in German in eigenen Worten (in one's own words), changing pronouns and verb forms where needed"
    removed_topics: []
    literature_texts: []
  - id: icse-9-german-second-language-ch04
    number: 4
    title: "Grammatik: Artikel und Kasus"
    unit: "4. Grammar"
    topics:
      - id: icse-9-german-second-language-ch04-t01
        title: "Bestimmter und unbestimmter Artikel; kein (Nominativ, Akkusativ, Dativ)"
        learning_outcomes:
          - "Choose der/die/das, ein or kein and give it the case the sentence requires"
      - id: icse-9-german-second-language-ch04-t02
        title: "Demonstrativartikel dieser / diese / dieses and the question word welcher?"
        learning_outcomes:
          - "Use dieser and welcher with the correct ending"
      - id: icse-9-german-second-language-ch04-t03
        title: "Possessivartikel mein, dein, sein, ihr, unser, euer, Ihr in Nominativ, Akkusativ and Dativ"
        learning_outcomes:
          - "Choose the possessive article that matches the owner and give it the correct case ending"
      - id: icse-9-german-second-language-ch04-t04
        title: "Genitiv: possession with names (Annas Buch) and des / der"
        learning_outcomes:
          - "Express possession with the Genitiv and ask about it with wessen?"
    removed_topics: []
    literature_texts: []
