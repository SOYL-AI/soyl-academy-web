# ICSE Class 9 Cookery (Group III elective, code 69) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-cookery (CLASS IX section only). Topic wording is our own summary of the official scope.
subject_id: icse-9-cookery
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-cookery, icse-2028-regulations]
exam_notes: >-
  There is no board examination in Class IX: the Class IX final examination is conducted internally by the school on
  the Class IX portion (ICSE 2028 Regulations), and promotion to Class X depends on cumulative achievement through the
  year. The syllabus prescribes one theory paper of 2 hours, 100 marks, plus internal assessment 100 marks; in the
  ICSE result the external paper and internal assessment each carry 50% (Group III), and school examinations usually
  follow this pattern. Internal assessment follows the Class X guidelines and is practical work in cookery: at least
  five practical-oriented assignments set by the teacher in Class IX (e.g. use and care of kitchen equipment, cooking
  processes such as boiling, frying, steaming, baking, grilling and stewing, meal planning and preparation, baking,
  salads, pickles, squashes and jams, chapatis and naans, nutritive cooking) plus a final test in which an External
  Examiner sets the planning and preparation of a meal; marked 50 by the subject teacher and 50 by the External
  Examiner. Practical work is not covered as chapters here. The Class X theory (seasonal and convenience foods, meal
  planning, therapeutic diets, preservation, kitchen planning, hygiene and equipment) is in icse-10-cookery.
  No Class IX specimen paper was released for Cookery.
  CISCE lists four numbered topics with explanatory notes, not textbook chapters; SOYL splits the first (nutritive
  value of foods) into three chapters and teaches the others as one chapter each, in syllabus order. No topic-wise
  marks weightage is published.
