    title: "Our Constitution: Meaning, Adoption and Salient Features"
    unit: "Civics 1: Our Constitution"
    topics:
      - id: icse-9-history-civics-ch01-t01
        title: "Meaning of a constitution; dates of adoption (26 November 1949) and enforcement (26 January 1950) and their significance"
        learning_outcomes:
          - "Define a constitution and explain why a country needs one"
          - "State the dates of adoption and enforcement of the Indian Constitution and explain why 26 January was chosen"
      - id: icse-9-history-civics-ch01-t02
        title: "Single citizenship"
        learning_outcomes:
          - "Explain the meaning of single citizenship and how it promotes national unity"
          - "Contrast single citizenship in India with dual citizenship in a federation such as the USA"
      - id: icse-9-history-civics-ch01-t03
        title: "Universal Adult Franchise"
        learning_outcomes:
          - "Explain universal adult franchise and the minimum voting age in India"
          - "Give two reasons why universal adult franchise strengthens democracy"
      - id: icse-9-history-civics-ch01-t04
        title: "Fundamental Rights: meaning and the main categories"
        learning_outcomes:
          - "Explain what makes a right 'fundamental' and why such rights are justiciable"
          - "Name the categories of Fundamental Rights and give one example of each"
      - id: icse-9-history-civics-ch01-t05
        title: "Fundamental Duties"
        learning_outcomes:
          - "List any five Fundamental Duties of an Indian citizen"
          - "Explain how Fundamental Duties complement Fundamental Rights"
