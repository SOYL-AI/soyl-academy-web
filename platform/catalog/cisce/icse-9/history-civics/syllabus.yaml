# ICSE Class 9 History & Civics (H.C.G. Paper 1, code 50) - ICSE 2028 course, CLASS IX portion only.
# Source: platform/catalog/sources/cisce.md#icse-2028-history-civics. Topic wording is our own summary of the official scope.
subject_id: icse-9-history-civics
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-history-civics, icse-2028-regulations]
exam_notes: >-
  History, Civics and Geography (50) is examined as two papers; this is Paper 1. Class IX is year one of the two-year
  ICSE 2028 course: there is no board examination in Class IX. The school conducts the Class IX final examination on the
  Class IX portion (Regulations), and promotion to Class X is decided by the school on cumulative achievement.
  The syllabus prescribes one theory paper of 2 hours, 80 marks, plus internal assessment 20 marks (any one
  project/assignment on the syllabus, e.g. a case study on constitutional protection of children, women and minorities,
  a visit to a museum or historical site, or a comparison of the Harappan and Mesopotamian civilisations; marked 10 by the
  subject teacher and 10 by an external examiner). The paper has Section A: Civics and Section B: History; school papers
  usually follow the ICSE pattern of compulsory short-answer questions across the syllabus followed by a choice of
  structured long questions. Civics is an elementary study without verbatim study of Constitutional Articles.
  Class X topics (Union Legislature, Executive, Judiciary, the National Movement, the Contemporary World) are in
  icse-10-history-civics. CISCE lists numbered topics, not textbook chapters: SOYL groups them into 17 teachable chapters
  in syllabus order. No unit-wise marks weightage is published.
