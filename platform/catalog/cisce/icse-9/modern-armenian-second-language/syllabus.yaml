      - id: icse-9-modern-armenian-second-language-ch02-t02
        title: "Formal letters: request, complaint, enquiry, application"
        learning_outcomes:
          - "Write a formal letter using Hargeli ... (Dear / Respected ...) and a respectful closing (Hargankov)"
      - id: icse-9-modern-armenian-second-language-ch02-t03
        title: "Informal letters to friends and family: invitation, thanks, news"
        learning_outcomes:
          - "Write an informal letter using Sireli ... (Dear ...) and a warm closing"
      - id: icse-9-modern-armenian-second-language-ch02-t04
        title: "Expanding the given suggestions into a complete letter"
        learning_outcomes:
          - "Cover every suggestion given in the question in a well-ordered letter"
          - "Keep the register consistent with the reader of the letter"
    removed_topics: []
    literature_texts: []
  - id: icse-9-modern-armenian-second-language-ch03
