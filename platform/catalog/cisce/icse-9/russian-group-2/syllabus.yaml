      - id: icse-9-russian-group-2-ch02-t02
        title: "Formal letters: request, complaint, enquiry, application"
        learning_outcomes:
          - "Write a formal letter of about 150 words using Uvazhaemyi / Uvazhaemaya ... and S uvazheniem"
      - id: icse-9-russian-group-2-ch02-t03
        title: "Informal letters to friends and family: invitation, thanks, news"
        learning_outcomes:
          - "Write an informal letter of about 150 words using Dorogoi / Dorogaya ..., Tvoi / Tvoya ..."
      - id: icse-9-russian-group-2-ch02-t04
        title: "Expanding the given suggestions into a complete letter"
        learning_outcomes:
