chapters:
  - id: icse-9-russian-group-2-ch01
    number: 1
    title: "Composition"
    unit: "Question 1: Composition"
    topics:
      - id: icse-9-russian-group-2-ch01-t01
        title: "Planning a composition: ideas, outline, paragraphs and linking words"
        learning_outcomes:
          - "Draw up a short plan and write a composition of about 250 words in Russian with an introduction, body and conclusion"
          - "Link ideas with connectors such as snachala, potom, nakonets, no, poetomu"
      - id: icse-9-russian-group-2-ch01-t02
        title: "Descriptions of people, places, festivals and events"
        learning_outcomes:
          - "Describe a person, place or festival in Russian using precise vocabulary and adjectives that agree in gender, number and case"
      - id: icse-9-russian-group-2-ch01-t03
        title: "Narratives: recounting an experience"
        learning_outcomes:
          - "Narrate a past experience in sequence using past-tense forms by gender and the right choice of aspect"
      - id: icse-9-russian-group-2-ch01-t04
        title: "Short explanations and directions"
        learning_outcomes:
          - "Explain how to do something or how to reach a place, using instructions and sequencing words"
      - id: icse-9-russian-group-2-ch01-t05
        title: "Composition from a picture, object or language stimulus"
        learning_outcomes:
          - "Write a composition prompted by a picture or object, describing the scene and imagining what happened before and after"
