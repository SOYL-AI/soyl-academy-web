# ICSE Class 9 Technical Drawing Applications (Group III elective, code 65) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-technical-drawing-applications (CLASS IX section only).
# Topic wording is our own summary of the official scope. Drawing-based subject: chapters teach the construction
# methods and projection concepts; students practise the drawings with instruments on paper.
subject_id: icse-9-technical-drawing-applications
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-technical-drawing-applications, icse-2028-regulations]
exam_notes: >-
  There is no board examination in Class IX: the Class IX final examination is conducted internally by the school on
  the Class IX portion (ICSE 2028 Regulations), and promotion to Class X depends on cumulative achievement through the
  year. The syllabus prescribes one written (drawing) paper of 3 hours, 100 marks, plus internal assessment 100 marks;
  in the ICSE result the external paper and internal assessment each carry 50% (Group III), and school examinations
  usually follow this pattern. Answers are drawn to scale with instruments (T-square, set squares, compasses).
  Internal assessment in Class IX is a minimum of fifteen drawing assignments set by the teacher during the year,
  evaluated by the subject teacher and an External Examiner (50 marks each) under the CISCE guidelines; these
  practical items are not covered as chapters here. The Class X topics (area constructions, templates, scales,
  engineering curves, solids, oblique and isometric drawing, sections) are in icse-10-technical-drawing-applications.
  No Class IX specimen paper was released for Technical Drawing Applications.
  CISCE lists eight numbered topics, not textbook chapters; SOYL groups them into teachable chapters in syllabus
  order, splitting the long geometrical-constructions and orthographic-projection topics into several chapters.
  No topic-wise marks weightage is published.
