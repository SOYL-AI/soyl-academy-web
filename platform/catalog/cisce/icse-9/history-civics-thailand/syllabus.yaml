# ICSE Class 9 History & Civics (Thailand) (H.C.G. Thailand Paper 1, code 58) - ICSE 2028 course, CLASS IX portion only.
# Source: platform/catalog/sources/cisce.md#icse-2028-history-civics-thailand. Topic wording is our own summary of the official scope.
subject_id: icse-9-history-civics-thailand
academic_year: "2026-27"
source_status: verified
