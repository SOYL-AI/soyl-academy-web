exam_notes: >-
  History, Civics and Geography (Thailand) (58) is a Group I subject offered only to candidates from CISCE-affiliated
  schools in Thailand, in place of History, Civics and Geography (50); it is examined as two papers and this is Paper 1.
  Class IX is year one of the two-year ICSE 2028 course: there is no board examination in Class IX. The school conducts
  the Class IX final examination on the Class IX portion (Regulations). The syllabus prescribes one theory paper of
  2 hours, 80 marks, plus internal assessment 20 marks (any one project/assignment on the syllabus, e.g. a case study of
  constitutional protection of children and women, civic issues of the locality, a visit to a museum or historical site,
  or the architecture of a monument such as Wat Pho; marked 10 by the subject teacher and 10 by an external examiner).
  The paper has Section A: Civics and Section B: History; the syllabus does not print the detailed question pattern
  (school papers usually follow the ICSE pattern of compulsory short-answer questions followed by a choice of structured
  long questions in each section). Where the syllabus uses terms borrowed from the Indian paper (Fundamental Rights and
  Duties, Directive Principles), topics follow the syllabus wording and outcomes relate it to Thailand's Constitution.
  Two syllabus slips are corrected in topic wording: the Great Wall was begun by Qin Shi Huang of the Qin dynasty (the
  Ming rebuilt it), and the law code is the Three Seals Law (Kotmai Tra Sam Duang). Class X topics (Legislature,
  Executive, Judiciary, reform period to ASEAN, the contemporary world) are in icse-10-history-civics-thailand.
  CISCE lists numbered topics, not textbook chapters: SOYL groups them into 15 teachable chapters in syllabus order.
  No unit-wise marks weightage is published.
