    title: "Gramática: verbos e tempos"
    unit: "Question 3: Vocabulary, syntax and idiom"
    topics:
      - id: icse-9-portuguese-group-2-ch05-t01
        title: "Presente do indicativo: regular -ar, -er, -ir verbs and common irregular verbs (ser, estar, ter, ir, fazer, poder, dizer)"
        learning_outcomes:
          - "Conjugate regular and common irregular verbs in the present in all persons"
      - id: icse-9-portuguese-group-2-ch05-t02
        title: "Ser, estar e ficar"
        learning_outcomes:
          - "Choose ser, estar or ficar according to meaning (identity, state, location, change)"
      - id: icse-9-portuguese-group-2-ch05-t03
        title: "Pretérito perfeito e pretérito imperfeito"
        learning_outcomes:
          - "Narrate past events, choosing the pretérito perfeito or the imperfeito"
      - id: icse-9-portuguese-group-2-ch05-t04
        title: "Futuro (ir + infinitivo and futuro simples) and the condicional for polite requests"
        learning_outcomes:
          - "Talk about plans and predictions and make polite requests"
      - id: icse-9-portuguese-group-2-ch05-t05
        title: "Imperativo; actions in progress (estar a + infinitivo / estar + gerúndio)"
        learning_outcomes:
          - "Give instructions and describe an action in progress"
    removed_topics: []
    literature_texts: []
  - id: icse-9-portuguese-group-2-ch06
