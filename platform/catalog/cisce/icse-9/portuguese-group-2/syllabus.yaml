  - { name: "Question 3: Vocabulary, syntax and idiom", marks: null }
  - { name: "Question 4: Unseen passage", marks: null }
  - { name: "Question 5: Translation into English", marks: null }
chapters:
  - id: icse-9-portuguese-group-2-ch01
    number: 1
    title: "Composition (Composição)"
    unit: "Question 1: Composition"
    topics:
      - id: icse-9-portuguese-group-2-ch01-t01
        title: "Planning a composition: ideas, outline, paragraphs and linking words"
        learning_outcomes:
          - "Draw up a short plan and write a composition of about 250 words in Portuguese with an introduction, body and conclusion"
          - "Link ideas with connectors such as primeiro, depois, em seguida, finalmente, no entanto, por isso"
      - id: icse-9-portuguese-group-2-ch01-t02
        title: "Descriptions of people, places, festivals and events"
        learning_outcomes:
          - "Describe a person, place or festival in Portuguese using precise vocabulary and adjectives that agree in gender and number"
      - id: icse-9-portuguese-group-2-ch01-t03
        title: "Narratives: recounting an experience"
        learning_outcomes:
          - "Narrate a past experience in sequence using the pretérito perfeito and the pretérito imperfeito"
      - id: icse-9-portuguese-group-2-ch01-t04
        title: "Short explanations and directions"
        learning_outcomes:
          - "Explain how to do something or how to reach a place, using instructions and sequencing words"
      - id: icse-9-portuguese-group-2-ch01-t05
        title: "Composition from a picture, object or language stimulus"
        learning_outcomes:
          - "Write a composition prompted by a picture or object, describing the scene and imagining what happened before and after"
    removed_topics: []
    literature_texts: []
  - id: icse-9-portuguese-group-2-ch02
    number: 2
    title: "Letter writing (A carta)"
    unit: "Question 2: Letter"
    topics:
      - id: icse-9-portuguese-group-2-ch02-t01
        title: "Layout of a Portuguese letter: address, date, salutation, body, closing formula and signature"
        learning_outcomes:
          - "Set out a letter in the correct Portuguese layout, writing the date in \"Panaji, 5 de março de 2027\""
      - id: icse-9-portuguese-group-2-ch02-t02
        title: "Formal letters: request, complaint, enquiry, application"
        learning_outcomes:
          - "Write a formal letter of about 150 words using Exmo(a). Senhor(a) ... Com os melhores cumprimentos / Atenciosamente"
      - id: icse-9-portuguese-group-2-ch02-t03
        title: "Informal letters to friends and family: invitation, thanks, news"
        learning_outcomes:
          - "Write an informal letter of about 150 words using Querido(a) ..., Um abraço, Beijinhos"
      - id: icse-9-portuguese-group-2-ch02-t04
        title: "Expanding the given suggestions into a complete letter"
        learning_outcomes:
          - "Cover every suggestion given in the question in a well-ordered letter"
          - "Keep the register consistent with the reader of the letter"
    removed_topics: []
    literature_texts: []
  - id: icse-9-portuguese-group-2-ch03
    number: 3
    title: "Gramática: artigos, substantivos, adjetivos e determinantes"
    unit: "Question 3: Vocabulary, syntax and idiom"
    topics:
      - id: icse-9-portuguese-group-2-ch03-t01
        title: "Artigos definidos e indefinidos; contractions with prepositions (do, na, ao, pelo)"
        learning_outcomes:
          - "Choose the article that agrees with the noun and contract it with de, em, a and por"
      - id: icse-9-portuguese-group-2-ch03-t02
        title: "Género e número dos substantivos, including plurals in -ão (-ões, -ães, -ãos)"
        learning_outcomes:
          - "Identify gender and form plurals, including nouns ending in -ão, -l and -m"
      - id: icse-9-portuguese-group-2-ch03-t03
        title: "Adjetivos: concordância e posição; comparativos e superlativos (mais ... do que, melhor, pior, -íssimo)"
        learning_outcomes:
          - "Make adjectives agree and compare people and things, including irregular forms"
      - id: icse-9-portuguese-group-2-ch03-t04
        title: "Possessivos e demonstrativos (este, esse, aquele; isto, isso, aquilo)"
        learning_outcomes:
          - "Choose possessives and demonstratives by owner, distance, gender and number"
    removed_topics: []
    literature_texts: []
  - id: icse-9-portuguese-group-2-ch04
    number: 4
    title: "Gramática: pronomes"
    unit: "Question 3: Vocabulary, syntax and idiom"
    topics:
      - id: icse-9-portuguese-group-2-ch04-t01
        title: "Pronomes pessoais sujeito: eu, tu, você, ele / ela, nós, vocês, eles / elas"
        learning_outcomes:
          - "Use subject pronouns and choose tu, você or o senhor / a senhora to suit the listener"
      - id: icse-9-portuguese-group-2-ch04-t02
        title: "Pronomes complemento direto e indireto (o, a, os, as, lhe, lhes) and their position"
        learning_outcomes:
          - "Replace objects with pronouns and place them before or after the verb correctly"
      - id: icse-9-portuguese-group-2-ch04-t03
        title: "Pronomes reflexos e verbos pronominais (levantar-se, chamar-se)"
        learning_outcomes:
          - "Describe a daily routine with pronominal verbs"
      - id: icse-9-portuguese-group-2-ch04-t04
        title: "Pronomes relativos e interrogativos (que, quem, onde, qual, quanto)"
        learning_outcomes:
          - "Join sentences with relative pronouns and ask questions with interrogatives"
    removed_topics: []
    literature_texts: []
  - id: icse-9-portuguese-group-2-ch05
