      - id: icse-9-commercial-applications-ch01-t04
        title: "Classification by objective: profit and non-profit organisations"
        learning_outcomes:
          - "Distinguish profit-making from non-profit organisations by objective, with examples"
          - "Explain why good management is essential in both kinds of organisation"
      - id: icse-9-commercial-applications-ch01-t05
        title: "Classification by ownership structure: features and distinctions"
        learning_outcomes:
