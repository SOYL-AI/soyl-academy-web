    title: "Commercial Organisations and Their Classification"
    unit: "1: Introduction to Commercial Organisations"
    topics:
      - id: icse-9-commercial-applications-ch01-t01
        title: "Commerce, business, industry and trade: meaning and distinctions"
        learning_outcomes:
          - "Define commerce, business, industry and trade"
          - "Distinguish the four terms using examples from Indian industries"
      - id: icse-9-commercial-applications-ch01-t02
        title: "Organisation, firm and company; meaning of a commercial organisation"
        learning_outcomes:
          - "Distinguish an organisation, a firm and a company"
          - "Explain what makes an organisation a commercial organisation"
      - id: icse-9-commercial-applications-ch01-t03
        title: "Classification by activity: industrial groupings such as textiles and fast moving consumer goods"
        learning_outcomes:
