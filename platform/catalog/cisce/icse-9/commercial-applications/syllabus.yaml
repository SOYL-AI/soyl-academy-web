# ICSE Class 9 Commercial Applications (code 88, Group III) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-commercial-applications (CLASS IX section only). Topic wording is our own summary of the official scope.
subject_id: icse-9-commercial-applications
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-commercial-applications, icse-2028-regulations]
exam_notes: >-
  There is no board examination in Class IX: the Class IX final examination is conducted internally by the school on the
  Class IX portion (ICSE 2028 Regulations), and promotion to Class X depends on cumulative achievement through the year.
  Commercial Applications (88) is a Group III subject: the written paper and the internal assessment each carry 50% of the
  subject result. The syllabus prescribes one written paper of 2 hours, 100 marks, plus internal assessment of 100 marks;
  school examinations usually follow this pattern. Internal assessment: a minimum of four assignments during the year (for
  example grouping consumer-durables firms by ownership or FMCG firms by objective, comparing core industries, studying the
  functional strategy of an organisation, a play on communication problems, evaluating ways and tools of business
  communication, studying the accounting books of a manufacturer or the balance sheet of a listed company), marked 50 by
  the subject teacher and 50 by an external examiner. The accounting topic is conceptual: no questions are set on
  recording entries or on calculations. Candidates offering Commercial Studies (Group II) may not offer Commercial
  Applications. No Class IX specimen paper was released for Commercial Applications.
  CISCE lists numbered topics, not textbook chapters: SOYL groups them into 7 teachable chapters in syllabus order.
  No unit-wise marks weightage is published.
