# ICSE Class 9 Urdu (Second Language, code 16) - ICSE 2028 course, CLASS IX portion only.
# Literature: titles and authors only (CONTEXT section 8). Students read the texts in their own textbook.
subject_id: icse-9-urdu
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-second-languages, icse-2028-prescribed-books, cisce-circular-2026-27-33-indian-languages, icse-2028-regulations]
exam_notes: >-
  Class IX is year one of the two-year ICSE 2028 course: there is no board examination in Class IX. The school conducts the
  Class IX examination, normally on the ICSE paper pattern: one paper of 3 hours, 80 marks, plus internal assessment 20 marks
  (two or three assignments in Class IX, of which two are written - one from language and one from literature; suggested Class
  IX work: creative writing of about 300-400 words from stimuli such as recorded music or sounds, a picture, an opening
  sentence or a news clipping, factual and expressive writing, a film or book review, an aural (listening) exercise, and
  literature assignments on character/theme, background and summary; marked 10 by the subject teacher and 10 by an external
  examiner). Section A Language (40 marks, compulsory): one composition, one letter (choice of two), an unseen comprehension
  passage of about 250 words, and grammar (vocabulary, syntax and idiom, sentence synthesis, sentences embodying given words or
  forms). Section B Prescribed Texts (40 marks): answer four questions from ONLY two of the prescribed books; questions are set
  and answered in the language. Prescribed texts are bifurcated (Second Languages syllabus and Circular 2026-27/33): the Class
  IX examination is set ONLY on the Class IX portion listed here (Class X portion is in icse-10-urdu); Section A is not
  bifurcated. SOYL covers every prescribed book so a student can pick any two. CISCE describes the grammar component only
  generically and says it needs no knowledge of grammatical terms; the split into two grammar chapters is SOYL's, not CISCE's.
  Titles are in English / CISCE transliteration; native-script titles to be added in language review. CISCE lists topics not
  chapters; SOYL grouped them into teachable chapters in syllabus order.
units:
  - { name: "Section A: Language", marks: 40 }
  - { name: "Section B: Prescribed Texts", marks: 40 }
chapters:
  - id: icse-9-urdu-ch01
    number: 1
    title: "Composition writing in Urdu"
    unit: "Section A: Language"
    topics:
      - id: icse-9-urdu-ch01-t01
        title: "Planning a composition: choosing a topic, outline, introduction, body and conclusion"
        learning_outcomes:
          - "Prepare an outline and write a well-organised composition of about 250-300 words in Urdu"
          - "Link paragraphs in a logical order using suitable connecting words"
      - id: icse-9-urdu-ch01-t02
        title: "Descriptive and narrative compositions"
        learning_outcomes:
          - "Describe a place, person, event or experience vividly"
          - "Narrate a sequence of events with a clear beginning, middle and end"
      - id: icse-9-urdu-ch01-t03
        title: "Short explanations, directions and reflective or argumentative essays"
        learning_outcomes:
          - "Explain a process or give clear step-by-step directions"
          - "Present points for and against a social issue and reach a reasoned conclusion"
      - id: icse-9-urdu-ch01-t04
        title: "Composition from a picture, object or other stimulus (opening line, proverb)"
        learning_outcomes:
          - "Write an original story or essay suggested by a picture, object or given opening line"
      - id: icse-9-urdu-ch01-t05
        title: "Accuracy: spelling, punctuation and apt choice of words"
        learning_outcomes:
          - "Identify and correct spelling, punctuation and word-choice errors in their own Urdu writing"
    removed_topics: []
    literature_texts: []
  - id: icse-9-urdu-ch02
    number: 2
    title: "Letter writing"
    unit: "Section A: Language"
    topics:
      - id: icse-9-urdu-ch02-t01
        title: "Layout of a formal letter: sender's address, date, addressee, subject, salutation, body and closing"
        learning_outcomes:
          - "Set out a formal letter in Urdu with all its parts in the correct order and format"
      - id: icse-9-urdu-ch02-t02
        title: "Formal letters to a principal, editor or official: application, request, complaint, suggestion"
        learning_outcomes:
          - "State a problem politely and concisely and make a clear, reasonable request"
      - id: icse-9-urdu-ch02-t03
        title: "Informal letters to friends, parents and relatives"
        learning_outcomes:
          - "Use a suitable form of address, a warm personal tone and an appropriate closing in an informal letter"
      - id: icse-9-urdu-ch02-t04
        title: "Developing a letter from the suggestions given in the question"
        learning_outcomes:
          - "Include every point suggested in the question in a coherent, well-paragraphed letter"
    removed_topics: []
    literature_texts: []
  - id: icse-9-urdu-ch03
    number: 3
    title: "Unseen passage (comprehension)"
    unit: "Section A: Language"
    topics:
      - id: icse-9-urdu-ch03-t01
        title: "Reading strategy: finding the main idea and supporting details"
        learning_outcomes:
          - "State the central idea of an unseen Urdu passage of about 250 words in one or two sentences"
      - id: icse-9-urdu-ch03-t02
        title: "Answering factual and inferential questions in their own words"
        learning_outcomes:
          - "Answer factual questions in their own words without copying lines from the passage"
          - "Infer causes, consequences and the writer's attitude from the passage"
      - id: icse-9-urdu-ch03-t03
        title: "Word meanings from context, a suitable title and the message"
        learning_outcomes:
          - "Work out the meaning of unfamiliar words and phrases from the context"
          - "Suggest a suitable title for the passage and justify it"
    removed_topics: []
    literature_texts: []
  - id: icse-9-urdu-ch04
    number: 4
    title: "Grammar: vocabulary and word formation"
    unit: "Section A: Language"
    topics:
      - id: icse-9-urdu-ch04-t01
        title: "Forming nouns, adjectives and other word forms from given words"
        learning_outcomes:
          - "Form the required noun, adjective or verb from a given Urdu word"
      - id: icse-9-urdu-ch04-t02
        title: "Synonyms and antonyms"
        learning_outcomes:
          - "Give appropriate synonyms and antonyms of commonly used words"
      - id: icse-9-urdu-ch04-t03
        title: "One word for a group of words"
        learning_outcomes:
          - "Replace a phrase with a single suitable word and use it in a sentence"
      - id: icse-9-urdu-ch04-t04
        title: "Words that sound or look alike but differ in meaning; correct spelling"
        learning_outcomes:
          - "Distinguish between commonly confused words by using each in a sentence"
          - "Correct misspelt words"
    removed_topics:
      - "Knowledge of grammatical terms as such (CISCE: the grammar question does not require it)"
    literature_texts: []
  - id: icse-9-urdu-ch05
    number: 5
    title: "Grammar: idioms, sentence construction and synthesis"
    unit: "Section A: Language"
    topics:
      - id: icse-9-urdu-ch05-t01
        title: "Idioms and proverbs: meaning and use in sentences"
        learning_outcomes:
          - "Explain the meaning of common Urdu idioms and proverbs and use them appropriately in sentences"
      - id: icse-9-urdu-ch05-t02
        title: "Correcting errors in sentences (agreement, tense, gender and number, case endings or postpositions)"
        learning_outcomes:
          - "Identify the grammatical error in a sentence and rewrite it correctly"
      - id: icse-9-urdu-ch05-t03
        title: "Transforming sentences as directed (tense, voice, affirmative/negative, statement/question)"
        learning_outcomes:
          - "Rewrite a sentence as directed without changing its meaning"
      - id: icse-9-urdu-ch05-t04
        title: "Synthesis: combining two or more sentences into one"
        learning_outcomes:
          - "Combine two or more simple sentences into one compound or complex sentence"
      - id: icse-9-urdu-ch05-t05
        title: "Making sentences that correctly use given words or forms"
        learning_outcomes:
          - "Use a given word, phrase or form correctly in a meaningful sentence"
    removed_topics:
      - "Knowledge of grammatical terms as such (CISCE: the grammar question does not require it)"
    literature_texts: []
  - id: icse-9-urdu-ch06
    number: 6
    title: "Lazawal Muraqqe: short stories (Class IX portion)"
    unit: "Section B: Prescribed Texts"
    topics:
      - id: icse-9-urdu-ch06-t01
        title: "Ibbrath (Munshi Prem Chand): plot, characters and the lesson of the title"
        learning_outcomes:
          - "Summarise the plot of the story in their own words"
          - "Describe the main characters with examples from the story"
          - "Explain the theme of the story and the significance of its title"
      - id: icse-9-urdu-ch06-t02
        title: "Bachpan (Ismath Chugtai): childhood memories, humour and characters"
        learning_outcomes:
          - "Summarise the main incidents of the story in their own words"
          - "Describe the narrator as a child with examples from the story"
          - "Comment on the writer's humorous, conversational style"
      - id: icse-9-urdu-ch06-t03
        title: "Manzoor (Sadath Haisan Manto): plot, the central character and theme"
        learning_outcomes:
          - "Summarise the plot of the story in their own words"
          - "Describe the main characters with examples from the story"
          - "Explain the theme of the story and the significance of its title"
      - id: icse-9-urdu-ch06-t04
        title: "Akhri Qadam (Dr. Zakir Hussain): plot, characters and moral message"
        learning_outcomes:
          - "Summarise the plot of the story in their own words"
          - "Describe the main characters with examples from the story"
          - "Explain the theme of the story and the significance of its title"
      - id: icse-9-urdu-ch06-t05
        title: "Khadar Ka Kaffan (Khaja Ahmed Abbas): plot, characters and the symbol in the title"
        learning_outcomes:
          - "Summarise the plot of the story in their own words"
          - "Describe the main characters with examples from the story"
          - "Explain the significance of khadi (khadar) in the title and the story"
    removed_topics:
      - "Class X stories of Lazawal Muraqqe: Bhoola, Pital Ka Ghanta, Allah Dey Banda Ley, Addu, Ek Aur Sharwan Kumar (see icse-10-urdu)"
    literature_texts:
      - { title: "Ibbrath", author: "Munshi Prem Chand" }
      - { title: "Bachpan", author: "Ismath Chugtai" }
      - { title: "Manzoor", author: "Sadath Haisan Manto" }
      - { title: "Akhri Qadam", author: "Dr. Zakir Hussain" }
      - { title: "Khadar Ka Kaffan", author: "Khaja Ahmed Abbas" }
  - id: icse-9-urdu-ch07
    number: 7
    title: "Lazawal Muraqqe: poems and ghazals (Class IX portion)"
    unit: "Section B: Prescribed Texts"
    topics:
      - id: icse-9-urdu-ch07-t01
        title: "Piya Baaj Piala Piya Jaye Na (Ghazal, Mohd Quli Qutub Shah): mood, imagery and ghazal form"
        learning_outcomes:
          - "Explain the meaning of each prescribed couplet (sher) in their own words"
          - "Identify the matla, maqta, radif and qafia of the ghazal"
      - id: icse-9-urdu-ch07-t02
        title: "Faqeerana Ayee Sada Kar Chaley (Ghazal, Mir Taqi Mir): mood, imagery and ghazal form"
        learning_outcomes:
          - "Explain the meaning of each prescribed couplet (sher) in their own words"
          - "Identify the matla, maqta, radif and qafia of the ghazal"
      - id: icse-9-urdu-ch07-t03
        title: "Dard Minnat Kashey Dawa Na Huwa (Ghazal, Mirza Asad Ullah Khan Ghalib): mood, imagery and ghazal form"
        learning_outcomes:
