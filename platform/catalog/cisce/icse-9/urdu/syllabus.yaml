      - { title: "Faqeerana Ayee Sada Kar Chaley (Ghazal)", author: "Mir Taqi Mir" }
      - { title: "Dard Minnat Kashey Dawa Na Huwa (Ghazal)", author: "Mirza Asad Ullah Khan Ghalib" }
      - { title: "Kalijug (Poem)", author: "Nazeer Akbar Aabadi" }
