# ICSE Class 9 Environmental Science (code 82, Group II) - ICSE 2028 course, CLASS IX portion only.
# Source: platform/catalog/sources/cisce.md#icse-2028-environmental-science. Topic wording is our own summary of the official scope.
subject_id: icse-9-environmental-science
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-environmental-science, icse-2028-regulations, icse-2027-class-ix-specimen-papers]
exam_notes: >-
  Class IX is year one of the two-year ICSE 2028 course: there is no board examination in Class IX. The school conducts
  the Class IX final examination on the Class IX portion (Regulations). The syllabus prescribes one theory paper of
  2 hours, 80 marks, plus internal assessment 20 marks (any one project/assignment and one case study, e.g. a campus
  biodiversity checklist, a home water budget, a school plastic-waste or energy audit, or tracking one SDG in India;
  marked 10 by the subject teacher and 10 by an external examiner). Group II elective; candidates offering
  Environmental Applications (Group III) may not offer Environmental Science. The CISCE Class IX specimen paper
  (code 821) has Section A, 40 marks, compulsory (objective items, then short 2-mark questions) and Section B, 40 marks,
  any four of six questions with two 5-mark parts each, many based on pictures, diagrams and local situations.
  The ICSE 2028 syllabus is a revised one built around the triple planetary crisis (pollution, biodiversity loss and
  climate change); several topics are to be studied through case studies in the CISCE resource material (e.g. mining
  in Jhansi, urbanisation of Delhi, pesticide misuse in Yavatmal and Punjab, Bhopal and Minamata, Bellandur Lake), which
  SOYL lessons may use as examples. Class X topics (interlinkages of the crisis, policies and actions against pollution,
  biodiversity loss and climate change, green economy, sustainable practices, green skills) are in
  icse-10-environmental-science. CISCE lists eight numbered topics, not textbook chapters: SOYL groups them into
  17 teachable chapters in syllabus order. No unit-wise marks weightage is published.
