    title: "Our Planet Earth and its Environment"
    unit: "1. Our Planet Earth"
    topics:
      - id: icse-9-environmental-science-ch01-t01
        title: "The environment around us: biotic and abiotic components and their interactions; life on Earth"
        learning_outcomes:
          - "Classify components of a given environment, such as a pond, as biotic or abiotic"
          - "Explain with examples how biotic and abiotic components interact to support life"
      - id: icse-9-environmental-science-ch01-t02
        title: "Earth's components: hydrosphere, lithosphere, atmosphere, cryosphere and biosphere and their interactions"
        learning_outcomes:
