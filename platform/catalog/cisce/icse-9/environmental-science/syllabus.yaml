          - "Explain an interaction between spheres, such as glaciers feeding rivers or volcanic gases affecting the atmosphere"
      - id: icse-9-environmental-science-ch01-t03
        title: "Human-environment interconnection: humans as part of the environment; two-way effects"
        learning_outcomes:
          - "Explain why humans are a part of the environment and not at the top of it"
          - "Give examples of how human activities affect the environment and how environmental changes affect people"
      - id: icse-9-environmental-science-ch01-t04
        title: "Need for environmental education"
        learning_outcomes:
