          - "State dos and don'ts for avoiding common body-language mistakes"
      - id: icse-9-dietetic-aide-ch01-t02
        title: "Meaning and importance of communication; elements of the communication cycle: sender, ideas, encoding, channel, receiver, decoding, feedback"
        learning_outcomes:
          - "Explain why good communication skills matter at school and at work"
          - "Draw and label the communication cycle and explain the role of each element"
          - "Trace the communication cycle in a simple exchange between a dietetic aide and a customer or colleague"
      - id: icse-9-dietetic-aide-ch01-t03
        title: "Perspectives in communication and the factors that affect them: visual perception, language, past experience, prejudices, feelings, environment"
        learning_outcomes:
