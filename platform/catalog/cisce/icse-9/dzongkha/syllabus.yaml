# ICSE Class 9 Dzongkha (Second Language, code 26) - ICSE 2028 course, texts not bifurcated, whole Class IX-X list.
# Literature: titles and authors only (CONTEXT section 8). Students read the texts in their own textbook.
subject_id: icse-9-dzongkha
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-second-languages, icse-2028-prescribed-books, icse-2028-regulations]
exam_notes: >-
  Class IX is year one of the two-year ICSE 2028 course: there is no board examination in Class IX. The school sets the
  Class IX examination, normally on the ICSE paper pattern prescribed in the Second Languages syllabus: one paper of 3
  hours, 80 marks, plus internal assessment 20 marks (marked 10 by the subject teacher and 10 by an external examiner):
  two or three assignments, two of them written - one from language and one from literature. Class IX suggestions are
  creative writing of about 300-400 words from a stimulus (recorded music or sounds, a picture, an opening sentence, a
  news clipping), one factual and one expressive piece, a film or book review, an aural exercise (listening to a talk or
  conversation and noting the main points), and literature assignments on character/theme analysis, background and
  summary. Section A Language (40 marks, compulsory): one composition from a choice of subjects (short explanations,
  directions, descriptions or narratives, possibly suggested by pictures or objects), one letter from a choice of two
  (layout assessed), an unseen passage of about 250 words with questions answered in the language, and grammar
  (vocabulary, syntax and idioms, synthesis of sentences, sentences using given words or forms; no knowledge of
  grammatical terms is required). Section A is the same in Classes IX and X. Section B Prescribed Texts (40 marks): four
  questions from ONLY two of the prescribed books, set and answered in the language. Dzongkha prescribed texts are NOT
  bifurcated (ICSE 2028 Appendix I: "The Syllabus has not been bifurcated"; the 2028 Second Languages syllabus
  bifurcates only 14 languages): the same books are studied over Classes IX and X and the ICSE 2028 paper covers the
  whole list, so this file lists all of them (same books as icse-10-dzongkha); the school decides how much of each book
  it covers for the Class IX examination. CISCE names only the three books (no authors or selections); Dzongkha is
  written in Tibetan script. CISCE describes grammar only generically; the two grammar chapters break it into item types
  commonly set in ICSE language papers - this breakdown is SOYL's, not CISCE's. CISCE lists skills and texts, not
  chapters; SOYL grouped them into teachable chapters in syllabus order. SOYL covers all three prescribed books so a
  student can pick any two. Titles are in English / CISCE transliteration; native-script titles to be added in language
  review.
units:
  - { name: "Section A: Language", marks: 40 }
  - { name: "Section B: Prescribed Texts", marks: 40 }
