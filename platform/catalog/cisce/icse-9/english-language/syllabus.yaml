exam_notes: >-
  English (01) is examined as two separately set papers; this is Paper 1, English Language. Class IX is year one of the
  two-year ICSE 2028 course: there is no board examination in Class IX; the school conducts the Class IX examination
  (Regulations), normally on the Paper 1 pattern the syllabus prescribes for Classes IX and X.
  One paper of 2 hours, 80 marks, all questions compulsory: Q1 composition of about 300-350 words from a choice of topics
  (some suggested by pictures); Q2 a formal or friendly letter from a choice of two; Q3 a notice and an e-mail on the same
  situation; Q4 an unseen prose passage of about 500 words with vocabulary-in-context, short-answer and summary questions;
  Q5 functional grammar (prepositions, conjunctions, verbs and sentence structure). The syllabus publishes no marks per
  question. Internal assessment 20 marks: Listening (10; a passage of about 300 words read aloud twice, objective test)
  and Speaking (10; a two-minute presentation followed by about three minutes of discussion), with three assessments in
  the course of Class IX, marked by the subject teacher and an external examiner. These are school-assessed skills, so
  they are not chapters here. No textbook is prescribed for Paper 1.
  CISCE describes the paper by question, not by chapters: SOYL groups each question's skills into teachable chapters,
  and the split of Q5 into grammar chapters (verbs, prepositions, conjunctions, sentence structure) is SOYL's, not CISCE's.
  The paper pattern is the same in Class X (icse-10-english-language); Class IX builds the foundations.
