# ICSE Class 9 Mass Media & Communication (code 90, Group III) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-mass-media-communication (CLASS IX section only). Topic wording is our own summary of the official scope.
subject_id: icse-9-mass-media-communication
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-mass-media-communication, icse-2028-regulations]
exam_notes: >-
  There is no board examination in Class IX: the Class IX final examination is conducted internally by the school on the
  Class IX portion (ICSE 2028 Regulations), and promotion to Class X depends on cumulative achievement through the year.
  Mass Media & Communication (90) is a Group III subject: the written paper and the internal assessment each carry 50% of
  the subject result. The syllabus prescribes one written paper of 2 hours, 100 marks, plus internal assessment of 100
  marks; school examinations usually follow this pattern. Internal assessment: a minimum of four assignments during the
  year (for example writing and staging a one-act play on a social theme, a 20-minute radio-jockey interview with a local
  personality, a poster advertising the school canteen, a group sales pitch, designing a newspaper front page, an
  eight-page school-year magazine; other assignments aligned to the syllabus are acceptable), marked 50 by the subject
  teacher and 50 by an external examiner. Most theory items call for a brief understanding with examples.
  No Class IX specimen paper was released for Mass Media & Communication.
  CISCE lists numbered topics, not textbook chapters: SOYL groups them into 8 teachable chapters in syllabus order.
  No unit-wise marks weightage is published.
