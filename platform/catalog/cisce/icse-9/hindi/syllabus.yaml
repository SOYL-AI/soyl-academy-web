        title_en: "Descriptive composition: a person, place, event or experience"
        learning_outcomes:
          - "किसी स्थान या घटना का क्रमबद्ध और सजीव वर्णन करना"
      - id: icse-9-hindi-ch01-t03
        title: "विचारात्मक रचना और व्याख्या/निर्देश लिखना"
        title_en: "Reflective composition; writing explanations and directions"
        learning_outcomes:
          - "किसी विषय पर अपने विचार तर्क और उदाहरण सहित प्रस्तुत करना"
          - "किसी कार्य को करने की विधि क्रमबद्ध निर्देशों में समझाना"
      - id: icse-9-hindi-ch01-t04
