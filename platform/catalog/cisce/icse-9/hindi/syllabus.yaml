# ICSE Class 9 Hindi (Second Language, code 05) - ICSE 2028 course, CLASS IX portion only.
# Literature: titles and authors only (CONTEXT section 8). Students read the texts in their own textbook.
subject_id: icse-9-hindi
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-second-languages, icse-2028-prescribed-books, cisce-circular-2026-27-33-indian-languages, icse-2028-regulations]
exam_notes: >-
  Class IX is year one of the two-year ICSE 2028 course: there is no board examination in Class IX. The school conducts
  the Class IX examination on the portion of the prescribed texts set for Class IX (Second Languages syllabus and
  Circular 2026-27/33), normally on the ICSE paper pattern: one paper of 3 hours, 80 marks, plus internal assessment
  20 marks (two or three assignments, of which two are written - one language, one literature; Class IX suggestions
  include creative writing of about 300-400 words from stimuli such as a picture or an opening sentence, and an aural
  exercise). Section A Language (40 marks, compulsory): composition, letter, unseen comprehension (about 250 words) and
  grammar. Section B Prescribed Texts (40 marks): answer four questions from ONLY two of the four prescribed books.
  Prescribed texts are bifurcated: only the Class IX portion is listed here (Class X portion is in icse-10-hindi);
  Section A is not bifurcated. Recommended for background work: Saras Hindi Vyakaran (Evergreen Publications).
  CISCE describes the grammar component only generically (vocabulary, syntax, idioms, sentence synthesis, forming
  sentences with given words); the grammar chapters below break it into item types commonly set in ICSE Hindi papers -
  this breakdown is SOYL's, not CISCE's. SOYL covers all four prescribed books so a student can pick any two.
units:
  - { name: "खंड क - भाषा (Section A: Language)", marks: 40 }
  - { name: "खंड ख - निर्धारित पाठ्य-पुस्तकें (Section B: Prescribed Texts)", marks: 40 }
chapters:
