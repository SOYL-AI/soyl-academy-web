        learning_outcomes:
          - "दिए गए विषयों में से उपयुक्त विषय चुनकर उसकी संक्षिप्त रूपरेखा बनाना"
          - "भूमिका, विस्तार और उपसंहार वाले सुसंगठित अनुच्छेद लिखना"
      - id: icse-9-hindi-ch01-t02
