        title_en: "Composition based on a picture or object"
        learning_outcomes:
          - "चित्र को ध्यान से देखकर उससे जुड़ी कहानी या लेख लिखना"
      - id: icse-9-hindi-ch01-t06
        title: "भाषा की शुद्धता: वर्तनी, विराम-चिह्न और शब्द-चयन"
        title_en: "Accuracy: spelling, punctuation and word choice"
        learning_outcomes:
          - "अपनी रचना की वर्तनी और विराम-चिह्नों की त्रुटियाँ पहचानकर सुधारना"
