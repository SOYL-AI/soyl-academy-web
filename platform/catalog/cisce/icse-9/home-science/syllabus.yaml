# ICSE Class 9 Home Science (code 68, Group III) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-home-science (CLASS IX section only). Topic wording is our own summary of the official scope.
# Theory-only file: practical work is described in exam_notes, not as chapters.
subject_id: icse-9-home-science
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-home-science, icse-2028-regulations]
exam_notes: >-
  There is no board examination in Class IX: the Class IX final examination is conducted internally by the school on the
  Class IX portion (ICSE 2028 Regulations), and promotion to Class X depends on cumulative achievement through the year.
  Home Science (68) is a Group III subject: the written paper and the internal assessment each carry 50% of the subject
  result. The syllabus prescribes Part I, one written paper of 2 hours, 100 marks, and Part II, internal assessment of 100
  marks following the Class X guidelines; school examinations usually follow this pattern. Internal assessment: at least
  five practical-oriented assignments in Class IX across Foods and Nutrition (identifying cereals, pulses and spices,
  cooking methods, cuts of vegetables, collecting kitchen herbs and spices), Human Development (evaluating play materials,
  observing children), Textiles and Clothing (fabric comparison, burning test for fibres, laundering, planning interiors),
  Resource Management (recycling, compost pits, cleaning surfaces and appliances, family budget) and Communication and
  Extension (awareness leaflets, posters, street plays), assessed continuously or by periodic tests, plus a final test by
  the external examiner; marked 50 by the subject teacher and 50 by the external examiner. SOYL covers the written-paper
  theory only. No Class IX specimen paper was released for Home Science.
  CISCE lists numbered topics, not textbook chapters: SOYL groups them into 10 teachable chapters in syllabus order.
  No unit-wise marks weightage is published.
