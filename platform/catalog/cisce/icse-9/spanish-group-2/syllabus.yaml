        learning_outcomes:
          - "Write an informal email of about 80-100 words in Spanish sharing news or accepting or declining an invitation"
      - id: icse-9-spanish-group-2-ch02-t03
        title: "Semi-formal emails: pedir información, agradecer, invitar, presentarse"
        learning_outcomes:
          - "Write a semi-formal email asking for information, thanking someone or replying to an invitation"
      - id: icse-9-spanish-group-2-ch02-t04
        title: "Tone and politeness formulas (Querido/a ..., Estimado/a señor/a ...; Un abrazo, Besos, Saludos cordiales, Atentamente)"
        learning_outcomes:
