# ICSE Class 9 Computer Applications (86) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-computer-applications (CLASS IX section only). Topic wording is our own summary of the official scope.
subject_id: icse-9-computer-applications
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-computer-applications, icse-2028-regulations, icse-2027-class-ix-specimen-papers]
exam_notes: >-
  There is no board examination in Class IX: the Class IX final examination is conducted internally by the school on the
  Class IX portion (ICSE 2028 Regulations), and promotion to Class X depends on cumulative achievement through the year.
  Group III subject, weighted 50% external examination and 50% internal assessment (Regulations).
  The syllabus prescribes one written theory paper of 2 hours, 100 marks, plus internal assessment of 100 marks: at least
  15 Java programming assignments during the year (80 marks: class design, variable description, coding and documentation,
  and execution or output, 20 each) and a written project on Ethical Computing (20 marks: introduction, content,
  presentation, conclusion), marked by the subject teacher. Programs are written in Java with OpenJDK and an IDE such as
  BlueJ, DrJava or NetBeans; the keywords public, static and String args[] are treated as default in the prescribed
  program structure. CISCE released a 2027 Class IX specimen paper for Computer Applications (anchor
  icse-2027-class-ix-specimen-papers) that schools can use as the model for the school examination.
  Ethical Computing is listed in the theory syllabus but the syllabus marks it for a project counted in internal assessment.
  CISCE publishes a topic list in eleven sections, not textbook chapters: SOYL groups it into 13 teachable chapters in
  syllabus order. No unit-wise marks weightage is published.
