# ICSE Class 9 Hospitality Management (code 73, Group III) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-hospitality-management (CLASS IX section only). Topic wording is our own summary of the official scope.
# Theory-only file: project work is described in exam_notes, not as chapters.
subject_id: icse-9-hospitality-management
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-hospitality-management, icse-2028-regulations]
exam_notes: >-
  There is no board examination in Class IX: the Class IX final examination is conducted internally by the school on the
  Class IX portion (ICSE 2028 Regulations), and promotion to Class X depends on cumulative achievement through the year.
  Hospitality Management (73) is a Group III subject: the written paper and the internal assessment each carry 50% of the
  subject result. The syllabus prescribes one written paper of 2 hours, 100 marks, plus internal assessment of 100 marks;
  school examinations usually follow this pattern. Internal assessment: a minimum of four assignments during the year (for
  example a chart of three types of tourism, a portfolio on the development of hospitality, the growth of hotels in India,
  the history of global hotel chains, sustainability practices in hotels and tourist destinations, the features of two
  tourist attractions in the State, the functions of three hospitality-related industries with Indian and international
  examples), marked 50 by the subject teacher and 50 by an external examiner. The syllabus names specific Indian and
  international hotel, retail and food-service chains as examples; SOYL describes them generically and does not use brand
  names. No Class IX specimen paper was released for Hospitality Management.
  CISCE lists numbered topics, not textbook chapters: SOYL groups them into 8 teachable chapters in syllabus order.
  No unit-wise marks weightage is published.
