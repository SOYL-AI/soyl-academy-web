  - id: icse-9-bengali-ch07
    number: 7
    title: "Sonkolita: poems (Class IX portion)"
    unit: "Section B: Prescribed Texts"
    topics:
      - id: icse-9-bengali-ch07-t01
        title: "Sabhyotar Proti (Rabindranath Thakur): the plea to give back the forest in exchange for the city; civilisation and nature"
        learning_outcomes:
          - "Explain the poet's plea to modern civilisation in Bengali, in own words"
          - "Contrast the life of the city with the life of the forest as presented in the poem"
      - id: icse-9-bengali-ch07-t02
        title: "Sinri (Sukanta Bhattacharya): the staircase as a symbol of exploited working people"
        learning_outcomes:
          - "Explain what the staircase stands for and who speaks in the poem"
          - "Discuss the protest against exploitation expressed in the poem, with reference to its images"
      - id: icse-9-bengali-ch07-t03
        title: "Rabindranather Proti (Buddhadeb Basu): a later poet's tribute to Rabindranath"
        learning_outcomes:
          - "Explain the central idea of the poem in Bengali, in own words"
          - "Describe the feelings the poet expresses towards Rabindranath"
      - id: icse-9-bengali-ch07-t04
        title: "Phool Phutuk Na Phutuk (Subhash Mukhopadhyay): affirming spring and life in the midst of hardship"
        learning_outcomes:
          - "Explain the central idea of the poem in Bengali, in own words"
          - "Explain how the poem contrasts a harsh reality with a determined celebration of spring"
      - id: icse-9-bengali-ch07-t05
        title: "Babu Bolen (Sankha Ghosh): central idea, feeling and imagery"
        learning_outcomes:
          - "Explain the central idea of the poem in Bengali, in own words"
          - "Identify the poet's feelings, tone and main images with reference to the poem"
    removed_topics:
      - "Class X poems: Bangabhoomir Proti (Michael Madhusudan Dutta), Kuli-Mojur (Kazi Nazrul Islam), Aabar Asibo Phire (Jibanananda Das), Amalkanti (Nirendranath Chakraborty), Kho-Kho (Amitabha Dasgupta) - see icse-10-bengali"
    literature_texts:
