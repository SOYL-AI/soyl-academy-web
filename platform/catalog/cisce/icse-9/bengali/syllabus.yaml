  - id: icse-9-bengali-ch06
    number: 6
    title: "Sonkolita: short stories (Class IX portion)"
    unit: "Section B: Prescribed Texts"
    topics:
      - id: icse-9-bengali-ch06-t01
        title: "Ginni (Rabindranath Thakur): a teacher's mocking nickname and a schoolboy's humiliation"
        learning_outcomes:
          - "Narrate the main events of the story in sequence in Bengali, in own words"
          - "Describe how the boy is treated at school and how he feels, with examples"
          - "Explain what the story says about cruelty and sensitivity in teaching children"
      - id: icse-9-bengali-ch06-t02
        title: "Lalu (Sarat Chandra Chattopadhyay): the mischievous boy Lalu, his pranks and the humour of the story"
        learning_outcomes:
          - "Narrate the main incidents of the story in Bengali, in own words"
          - "Write a character sketch of Lalu with examples of his pranks"
          - "Explain how the writer creates humour in the story"
      - id: icse-9-bengali-ch06-t03
        title: "Canvasser (Banaphool): plot, characters and message"
        learning_outcomes:
          - "Narrate the main events of the story in sequence in Bengali, in own words"
          - "Describe the main characters with examples from the story"
          - "State the theme or message and explain the significance of the title"
      - id: icse-9-bengali-ch06-t04
        title: "Debotar Janmo (Shibram Chakraborty): humour and satire on blind faith"
        learning_outcomes:
          - "Narrate the main events of the story in sequence in Bengali, in own words"
          - "Explain how the story uses humour to criticise blind faith"
          - "Explain the significance of the title"
      - id: icse-9-bengali-ch06-t05
        title: "Neel Manusher Kahini (Sunil Gangopadhyay): plot, characters and message"
        learning_outcomes:
          - "Narrate the main events of the story in sequence in Bengali, in own words"
          - "Describe the main characters with examples from the story"
          - "State the theme or message and explain the significance of the title"
    removed_topics:
      - "Class X stories: Bama (Bibhutibhushan Bandyopadhyay), Naam (Narendranath Mitra), Asohojogee (Manik Bandyopadhyay), Gandhota Khub Sandehojanok (Shirshendu Mukhopadhyay), Lokti (Humayun Ahmed) - see icse-10-bengali"
