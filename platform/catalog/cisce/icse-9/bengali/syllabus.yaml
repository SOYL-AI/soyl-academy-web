      - { title: "Sinri", author: "Sukanta Bhattacharya" }
      - { title: "Rabindranather Proti", author: "Buddhadeb Basu" }
      - { title: "Phool Phutuk Na Phutuk", author: "Subhash Mukhopadhyay" }
      - { title: "Babu Bolen", author: "Sankha Ghosh" }
