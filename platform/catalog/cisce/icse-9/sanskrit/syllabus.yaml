# ICSE Class 9 Sanskrit (Second Language, code 19) - ICSE 2028 course, CLASS IX portion only.
# Literature: titles and authors only (CONTEXT section 8). Students read the texts in their own textbook.
subject_id: icse-9-sanskrit
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-second-languages, icse-2028-prescribed-books, icse-2028-regulations]
exam_notes: >-
  Class IX is year one of the two-year ICSE 2028 course: there is no board examination in Class IX; the school sets the Class
  IX examination, normally on the ICSE pattern: one paper of 3 hours, 80 marks, plus internal assessment 20 marks (work set and
  marked by the teacher over the two years; 10 marks subject teacher, 10 marks external examiner). Section A Language (40
  marks, compulsory): one short composition, one letter (choice of two), an unseen Sanskrit passage with questions answered in
  Sanskrit, and grammar - the listed grammar topics plus grammar arising from the prescribed textbooks, tested through
  vocabulary, syntax and idiom, sentence synthesis and sentences embodying given words or forms. Section B Prescribed Texts (40
  marks): in the ICSE paper, four questions from ONLY two prescribed textbooks, set and answered in Sanskrit. Prescribed books:
  Sanskrit Vani Book 4 (for Class IX) and Book 5 (for Class X) by H.D. Vijayshri and Mrs. S. Bolar (Orient Longman); Sanskrit
  is not in the bifurcation circular, but Appendix I assigns Book 4 to Class IX, so this file covers Book 4 and the school sets
  Section B of the Class IX examination on it. The grammar list in the syllabus is printed in two parts (I and II). SOYL reads
  part I as the Class IX part (sounds and places of articulation, sandhi, noun/pronoun/numeral declensions, verb forms in five
  lakaras, general knowledge of karakas) and part II (samasa, karaka with upapada vibhaktis, pratyayas) as the Class X part
  covered in icse-10-sanskrit; CISCE does not label the parts by class, so confirm with the school. The grammar list in the
  source file is in legacy Kruti Dev encoding and was decoded by SOYL. Candidates offering Sanskrit as a Group II classical
  language may not also offer it here. CISCE lists topics not chapters; SOYL grouped them into teachable chapters in syllabus
  order.
units:
