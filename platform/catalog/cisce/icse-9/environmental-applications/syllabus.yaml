    title: "Environmental Problems: Ecosystems and Resources"
    unit: "1: Introduction"
    topics:
      - id: icse-9-environmental-applications-ch01-t01
        title: "Studying environmental problems: magnitude, facts and statistics, linked frameworks and systems"
        learning_outcomes:
          - "Explain why environmental problems are complex and interlinked"
          - "Use given facts and statistics to describe the scale of an environmental problem"
      - id: icse-9-environmental-applications-ch01-t02
        title: "Threats to ecosystems: major causes of destruction; forest cover in India and the world and its rate of loss"
        learning_outcomes:
          - "Identify the major causes of ecosystem destruction"
          - "Interpret data on forest cover and its rate of loss in India and the world"
      - id: icse-9-environmental-applications-ch01-t03
        title: "Efforts to save forests: conservation organisations and the Chipko movement"
        learning_outcomes:
          - "Describe the work of conservation organisations named in the syllabus, such as WFCTI and SayTrees"
          - "Outline the location, objectives and outcomes of the Chipko movement"
      - id: icse-9-environmental-applications-ch01-t04
        title: "Resource depletion: water and fossil fuels with local and international examples"
        learning_outcomes:
          - "Explain the consequences of depleting water and fossil fuel resources"
          - "Describe examples such as the limited remaining life of petroleum reserves and water crises in parts of Africa"
