# ICSE Class 9 Environmental Applications (code 89, Group III) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-environmental-applications (CLASS IX section only). Topic wording is our own summary of the official scope.
subject_id: icse-9-environmental-applications
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-environmental-applications, icse-2028-regulations]
exam_notes: >-
  There is no board examination in Class IX: the Class IX final examination is conducted internally by the school on the
  Class IX portion (ICSE 2028 Regulations), and promotion to Class X depends on cumulative achievement through the year.
  Environmental Applications (89) is a Group III subject: the written paper and the internal assessment each carry 50% of
  the subject result. The syllabus prescribes one written paper of 2 hours, 100 marks, plus internal assessment of 100
  marks; school examinations usually follow this pattern. Internal assessment: students are recommended to complete two
  case studies (secondary-data reports of about 1500 words, for example on a nearby ecosystem, the public distribution
  system, small and large farmers, a genetically modified crop or bio-piracy) and one project based mainly (50-70%) on
  primary field data (for example the decline of sparrows, conserving turtles or mangroves, green areas in a city, zoos and
  conservation, a study of a selected area); case studies 10 + 10 and project 30 marks from each of the subject teacher
  and an external examiner (50 + 50), with an optional viva. The syllabus also suggests field visits and activities
  (rapid assessment of an ecosystem, a national park, a rehabilitation site, a local factory, chemical and organic farms,
  a wholesale market, small-plot farming) and personal action at home, in school and in the neighbourhood; these are not
  separate theory topics. Candidates offering Environmental Science (Group II) may not offer Environmental Applications.
  No Class IX specimen paper was released for Environmental Applications.
  CISCE lists numbered topics, not textbook chapters: SOYL groups them into 10 teachable chapters in syllabus order.
  No unit-wise marks weightage is published.
