# ICSE Class 9 Performing Arts: Western Music (Group III elective, code 93) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-performing-arts. The syllabus is printed for Classes IX and X together
# (no class split), so all of it is covered here. Theory paper only. Topic wording is our own summary of the official scope.
subject_id: icse-9-western-music
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-performing-arts, icse-2028-regulations]
exam_notes: >-
  There is no board examination in Class IX: the school sets the Class IX examination on the work of the year
  (ICSE 2028 Regulations), usually following the paper pattern below; the board papers are taken at the end of Class X.
  Part 1 Theory: one paper of 2 hours, 100 marks, in two sections - A Musical Instruments, B Forms and Analysis of
  Music (forms, life and works, technology in music, personal experience). Part 2 Practical, 100 marks: candidates
  must have passed Grade 4 or higher of the practical examination of the Associated Board of the Royal Schools of
  Music, Trinity College London or London College of Music (or an equivalent examination approved by CISCE); preparation for that examination is the course work and its result is
  the assessment. The external paper and internal assessment each carry 50% of the subject result (Group III).
  Practical playing or singing is not taught as chapters here.
  The syllabus is printed for Classes IX and X together with no class split, so Class IX works on all of it and the
  board paper at the end of Class X (ICSE 2028) covers the whole syllabus.
  Questions test that candidates have listened to works in each category, know its characteristics and context, and
  know prominent composers; answers should name specific works heard. Some answers are essays of about 500 words
  (composer or jazz exponent; personal experience). CISCE gives templates for analysing a symphony and a concerto,
  reflected in the analysis topics. CISCE lists topics, not chapters: SOYL groups them into teachable chapters in
  syllabus order. No section-wise marks weightage is published.
units:
  - { name: "Section A: Musical Instruments", marks: null }
  - { name: "Section B: Forms and Analysis of Music", marks: null }
