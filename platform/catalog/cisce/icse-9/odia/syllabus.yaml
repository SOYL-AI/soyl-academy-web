          - "Describe the main characters and the conflict between them"
          - "Explain what the flag in the title stands for in the play"
      - id: icse-9-odia-ch09-t03
        title: "Elements of the one-act play: plot, dialogue, conflict, stage directions"
        learning_outcomes:
