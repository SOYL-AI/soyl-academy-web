      - { title: "Kalijai", author: "Godabarish Mishra" }
      - { title: "Gariba ra Durgastaba", author: "Godabarish Mohapatra" }
      - { title: "Mani Kanchan Joga", author: "Radhamohan Gadanaik" }
      - { title: "Banaphula Udyana Kusuma", author: "Kuntala Kumari Sabat" }
  - id: icse-9-odia-ch08
    number: 8
    title: "Novel: Adoora Sakala (Chapters 1 to 4)"
