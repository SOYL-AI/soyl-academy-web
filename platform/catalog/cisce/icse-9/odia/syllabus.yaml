    removed_topics:
      - "Class X one-act plays: Petu, Bagha Shikar, Konark, Aahuti (see icse-10-odia)"
    literature_texts:
      - { title: "Rani Shukadei", author: "Manoranjan Das" }
      - { title: "Ei Pataka Tale", author: "Kulamani Mohapatra" }
