    number: 1
    title: "The Cell: A Unit of Life"
    unit: "1. Basic Biology"
    topics:
      - id: icse-9-biology-ch01-t01
        title: "The cell as the unit of life; cell theory; protoplasm and cytoplasm"
        learning_outcomes:
          - "State the main points of the cell theory"
          - "Distinguish protoplasm from cytoplasm"
      - id: icse-9-biology-ch01-t02
        title: "Cell boundaries: cell wall and cell membrane"
        learning_outcomes:
          - "Compare the cell wall and the cell membrane in composition, permeability and function"
      - id: icse-9-biology-ch01-t03
        title: "Nucleus and nucleolus; mitochondria, endoplasmic reticulum, ribosomes and Golgi bodies"
        learning_outcomes:
          - "State the function of each of these organelles"
          - "Explain why mitochondria are called the powerhouses of the cell"
      - id: icse-9-biology-ch01-t04
        title: "Plastids, lysosomes, centrosome and vacuoles"
        learning_outcomes:
          - "Distinguish chloroplasts, chromoplasts and leucoplasts by function"
          - "State the functions of lysosomes, the centrosome and vacuoles"
      - id: icse-9-biology-ch01-t05
        title: "Prokaryotic and eukaryotic cells"
        learning_outcomes:
