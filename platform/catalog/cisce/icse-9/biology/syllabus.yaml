      - id: icse-9-biology-ch01-t06
        title: "Plant cell versus animal cell: cell wall, centrosome, vacuoles and plastids"
        learning_outcomes:
          - "Draw labelled diagrams of a generalised plant cell and animal cell"
          - "Tabulate the differences between plant and animal cells"
