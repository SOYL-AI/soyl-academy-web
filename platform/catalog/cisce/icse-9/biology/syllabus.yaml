# ICSE Class 9 Biology (Science Paper 3) - year one of the ICSE 2028 course.
# Source: platform/catalog/sources/cisce.md#icse-2028-biology (CLASS IX section only). Topic wording is our own summary of the official scope.
subject_id: icse-9-biology
academic_year: "2026-27"
source_status: verified
sources: [icse-2028-biology, icse-2028-regulations]
exam_notes: >-
  There is no board examination in Class IX: the Class IX final examination is conducted internally by the school on the
  Class IX portion (ICSE 2028 Regulations), and promotion to Class X depends on cumulative achievement through the year.
  The syllabus prescribes one theory paper of 2 hours, 80 marks, plus internal assessment of practical work 20 marks;
  school examinations usually follow this pattern, and labelled diagrams are central.
  Practical work (assessed internally, not in the theory chapters): onion peel and human cheek cell under the microscope;
  parts of a cross-pollinated flower such as Hibiscus; germinating bean seed and maize grain; food tests for sugar, starch,
  protein and fat; identification of specimens of the non-chordate phyla and the five chordate classes; lung and skin from
  specimens, models and charts; the bell jar model of the mechanism of breathing compared with human lungs; and visits to
  local workshops, markets or treatment and composting sites to report on waste disposal.
  No Class IX specimen paper was released for Biology.
  CISCE publishes a topic list in seven sections, not textbook chapters: SOYL groups it into 14 teachable chapters in
  syllabus order. No unit-wise marks weightage is published for ICSE Biology.
