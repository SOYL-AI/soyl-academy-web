# ICSE Class 7 English - CISCE Curriculum for Upper Primary Classes VI-VIII (2016), English, Class VII part only.
# Source: platform/catalog/sources/cisce.md#cisce-upper-primary-curriculum (English, Class VII: four skill strands).
# Topic wording is our own summary of the official learning outcomes and suggested content.
subject_id: icse-7-english
academic_year: "2026-27"
source_status: verified
sources: [cisce-upper-primary-curriculum]
exam_notes: >-
  No board examination in Class 7. CISCE publishes a recommended theme-based curriculum (Curriculum for Upper Primary
  Classes VI-VIII, RDCD, 2016) with learning outcomes per class; it prescribes no textbooks, no paper pattern and no
  marks weightage. Schools choose their own textbooks and set their own unit tests and term examinations; the curriculum
  asks for continuous assessment through oral and written work, projects, activities and portfolios as well as tests.
  English is taught as the first language, with language and literature together; CISCE prescribes no literature texts
  at this stage. The curriculum sets out four strands for Class VII - Listening and Speaking, Reading, Writing, and
  Grammar and Vocabulary in Context - each with learning outcomes and suggested content; SOYL grouped them into 13
  teachable chapters in curriculum order. Recitation is meant to be a regular part of the timetable and may count
  towards internal assessment. The curriculum also gives a suggested (not prescribed) reading list for Classes VI-VII,
  e.g. Malgudi Days (R.K. Narayan), The Happy Prince and Other Tales (Oscar Wilde), The Lost World (Arthur Conan Doyle),
  Tuck Everlasting (Natalie Babbitt), Animal Farm (George Orwell), I am Malala, Ignited Minds (A.P.J. Abdul Kalam) and
  short stories by writers such as Tagore, Premchand, O. Henry, Saki and Kipling; teachers may choose any
  age-appropriate books, so SOYL covers reading skills rather than particular texts.
units:
  - { name: "Listening and Speaking", marks: null }
  - { name: "Reading", marks: null }
  - { name: "Writing", marks: null }
  - { name: "Grammar and Vocabulary in Context", marks: null }
