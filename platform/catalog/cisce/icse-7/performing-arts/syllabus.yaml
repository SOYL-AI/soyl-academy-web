# ICSE Class 7 Performing Arts - CISCE Curriculum: Performing Arts (Classes VI-VIII), Class VII part.
# Source: platform/catalog/sources/cisce.md#cisce-performing-arts-vi-viii.
# Theory only (music, dance and theatre concepts, forms and terminology); topic wording is our own summary.
subject_id: icse-7-performing-arts
academic_year: "2026-27"
source_status: verified
sources: [cisce-performing-arts-vi-viii]
exam_notes: >-
  No board examination in Class 7: schools assess Performing Arts internally through observation, participation,
  presentations and performances, and choose their own resources. The CISCE curriculum covers Music, Dance and
  Theatre through eight themes, each revisited in Classes VI-VIII: Sound, Voice and Speech; Space; Rhythm; Body
  Movement; Composition; Art Vocabulary; Performance; and Art Appreciation. SOYL covers the knowledge side of the
  Class VII themes (concepts, forms, terminology and appreciation) as 9 chapters in curriculum order (Sound, Voice
  and Speech split into voice/speech and music). Practical work - voice and breathing exercises, singing and
  playing compositions, puppet shows, choreography, mime, folk dance, yogasanas, body and junk orchestras, stage
  performances and visits - is practical and not covered as lessons. No marks weightage is published.
