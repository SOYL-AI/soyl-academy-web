# ICSE Class 7 Computer Studies - CISCE Curriculum for Upper Primary Classes VI-VIII (2016), Computer Studies, Class VII part only.
# Source: platform/catalog/sources/cisce.md#cisce-upper-primary-curriculum (Computer Studies, Class VII, Topics 1-7).
# Topic wording is our own summary of the official key concepts and learning outcomes.
subject_id: icse-7-computer-studies
academic_year: "2026-27"
source_status: verified
sources: [cisce-upper-primary-curriculum]
exam_notes: >-
  No board examination in Class 7. CISCE publishes a recommended theme-based curriculum (Curriculum for Upper Primary
  Classes VI-VIII, RDCD, 2016) with learning outcomes per class; it prescribes no textbooks, no paper pattern and no
  marks weightage. Schools choose their own textbooks and set their own unit tests and term examinations; the curriculum
  asks for continuous assessment through oral and written work, projects, activities and portfolios as well as tests.
  The Class VII Computer Studies curriculum has seven topics (hardware, number systems, computer viruses, ethics and
  safety, spreadsheets, databases, advanced HTML), each with learning outcomes and key concepts; SOYL grouped them into
  9 teachable chapters in curriculum order. Much of the work is hands-on in the computer lab (building a worksheet, a
  database table and a web page); schools assess it through practical tasks, projects, quizzes and worksheets as well as
  written tests. Software is generic: any spreadsheet, database or HTML editor may be used.
