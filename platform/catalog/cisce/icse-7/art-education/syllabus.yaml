# ICSE Class 7 Arts Education (Visual Arts) - CISCE Upper Primary curriculum (Classes VI-VIII), Class VII part.
# Source: platform/catalog/sources/cisce.md#cisce-upper-primary-curriculum (Arts Education section, Class VII).
# Theory and appreciation only; topic wording is our own summary of the official key concepts.
subject_id: icse-7-art-education
academic_year: "2026-27"
source_status: verified
sources: [cisce-upper-primary-curriculum]
exam_notes: >-
  No board examination in Class 7: schools assess Arts Education internally through observation, portfolios,
  worksheets, displays and presentations, and choose their own materials. The CISCE curriculum is limited to the
  Visual Arts and has eight themes, each revisited in Classes VI-VIII: Form, Colour, Texture, Composition, Tools
  and Techniques, Art (Visual Arts) Vocabulary, Responding to the Artefacts and Nature, and Perspective. SOYL
  covers the knowledge, vocabulary and appreciation side of the Class VII themes as 9 chapters in curriculum order
  (Tools and Techniques split into 2-D and 3-D work). Hands-on work - sketching, painting compositions and
  posters, grey-tone charts, printing, clay modelling, terracotta, masks, puppets, photography, still-life
  practice and museum visits - is practical and not covered as lessons. No marks weightage is published.
