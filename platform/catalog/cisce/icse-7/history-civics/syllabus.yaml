# ICSE Class 7 History & Civics - CISCE Upper Primary curriculum (Classes VI-VIII), Class VII part.
# Source: platform/catalog/sources/cisce.md#cisce-upper-primary-curriculum (HCG section, Class VII: The Medieval World + Civics);
# RDCD History and Civics resource used only to sharpen scope. Topic wording is our own summary of the official key concepts.
subject_id: icse-7-history-civics
academic_year: "2026-27"
source_status: verified
sources: [cisce-upper-primary-curriculum, cisce-upper-primary-history-civics-resource]
exam_notes: >-
  No board examination in Class 7: schools set their own unit tests and term examinations and choose their own
  textbooks (CISCE does not prescribe books below Class IX). History & Civics is taught as part of History, Civics
  and Geography (HCG). The CISCE curriculum is theme-based, with key concepts and learning outcomes per theme:
  Class VII History covers The Medieval World in six themes (Medieval Europe and Christianity, Islam, the Delhi
  Sultanate, Vijayanagar and Bahmani kingdoms, the Mughal Empire, Making of Composite Culture) and Civics covers
  two themes (The Constitution of India, Directive Principles of State Policy). SOYL grouped these themes into 12
  teachable chapters in curriculum order. Map work (routes of the crusaders, extent of kingdoms) and timelines are
  part of the themes. No marks weightage is published.
units:
  - { name: "History: The Medieval World", marks: null }
  - { name: "Civics", marks: null }
chapters:
  - id: icse-7-history-civics-ch01
    number: 1
    title: "The Medieval Period and the Rise of Christianity"
    unit: "History: The Medieval World"
    topics:
      - id: icse-7-history-civics-ch01-t01
        title: "Meaning of 'medieval'; tracing the beginning of the medieval period in the world and in India from evidence"
        learning_outcomes:
          - "Explain what historians mean by the medieval period"
          - "Compare when the medieval period is said to begin in Europe and in India, citing the kind of evidence used"
      - id: icse-7-history-civics-ch01-t02
        title: "Socio-political background: Roman conquest of Palestine; birth of Jesus in Bethlehem"
        learning_outcomes:
          - "Describe the political conditions in Palestine under Roman rule at the time of Jesus"
          - "Locate Palestine, Bethlehem and Rome on an outline map"
      - id: icse-7-history-civics-ch01-t03
        title: "Main teachings of Jesus; his opposition to Jewish religious leaders; the crucifixion"
        learning_outcomes:
          - "State the main teachings of Jesus, such as love, forgiveness and service to others"
          - "Explain why Jesus came into conflict with the religious leaders of his time"
          - "Discuss the relevance of these teachings today and identify values shared with other religions"
      - id: icse-7-history-civics-ch01-t04
        title: "Spread of Christianity: role of Emperor Constantine; Constantinople as the new Christian capital"
        learning_outcomes:
          - "Explain how Constantine's support helped Christianity become a major religion of the Roman Empire"
          - "Construct a simple timeline of the rise and spread of Christianity"
    removed_topics: []
    literature_texts: []
