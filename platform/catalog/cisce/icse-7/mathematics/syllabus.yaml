# ICSE Class 7 Mathematics - CISCE Curriculum for Upper Primary Classes VI-VIII (2016), Mathematics, Class VII part only.
# Source: platform/catalog/sources/cisce.md#cisce-upper-primary-curriculum (Mathematics, Class VII, Themes 1-6).
# Topic wording is our own summary of the official key concepts and learning outcomes.
subject_id: icse-7-mathematics
academic_year: "2026-27"
source_status: verified
sources: [cisce-upper-primary-curriculum]
exam_notes: >-
  No board examination in Class 7. CISCE publishes a recommended theme-based curriculum (Curriculum for Upper Primary
  Classes VI-VIII, RDCD, 2016) with learning outcomes per class; it prescribes no textbooks, no paper pattern and no
  marks weightage. Schools choose their own textbooks and set their own unit tests and term examinations; the curriculum
  asks for continuous assessment through oral and written work, projects, activities and portfolios as well as tests.
  The Class VII curriculum has six themes (Number System, Ratio and Proportion, Algebra, Geometry, Mensuration, Data
  Handling), each with learning outcomes and key concepts; SOYL grouped them into 16 teachable chapters in curriculum
  order. The curriculum stresses discovering rules through patterns, paper folding and hands-on work with a maths kit
  and geoboard. The Theme 1 introduction also mentions LCM and HCF, which are revised alongside divisibility.
units:
  - { name: "Theme 1: Number System", marks: null }
  - { name: "Theme 2: Ratio and Proportion", marks: null }
  - { name: "Theme 3: Algebra", marks: null }
  - { name: "Theme 4: Geometry", marks: null }
  - { name: "Theme 5: Mensuration", marks: null }
  - { name: "Theme 6: Data Handling", marks: null }
chapters:
  - id: icse-7-mathematics-ch01
    number: 1
    title: "Integers and Divisibility"
    unit: "Theme 1: Number System"
    topics:
      - id: icse-7-mathematics-ch01-t01
        title: "Multiplication of integers using patterns"
        learning_outcomes:
          - "Multiply a positive and a negative integer and two negative integers, using number patterns to justify the sign rules"
          - "Explain why the product of two negative integers is positive"
      - id: icse-7-mathematics-ch01-t02
        title: "Division of integers"
        learning_outcomes:
          - "Divide integers by finding the number that multiplies the divisor to give the dividend"
          - "State and apply the sign rules for division of integers"
      - id: icse-7-mathematics-ch01-t03
        title: "Properties of operations on integers"
        learning_outcomes:
          - "Verify commutativity, associativity, identity, inverse and distributivity for integers with examples"
          - "Use the properties to simplify calculations"
      - id: icse-7-mathematics-ch01-t04
        title: "Word problems on integers (all operations)"
        learning_outcomes:
          - "Solve daily-life problems involving temperature, money, heights and depths using integers"
      - id: icse-7-mathematics-ch01-t05
        title: "Divisibility rules from patterns in multiplication tables; factors, multiples, HCF and LCM"
        learning_outcomes:
          - "Form and apply divisibility rules for 2, 3, 4, 5, 6, 9 and 10 by observing patterns in tables"
          - "Find the HCF and LCM of given numbers and use them in simple problems"
    removed_topics: []
    literature_texts: []
