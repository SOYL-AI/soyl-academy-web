# ICSE Class 7 Geography - CISCE Upper Primary curriculum (Classes VI-VIII), Class VII part.
# Source: platform/catalog/sources/cisce.md#cisce-upper-primary-curriculum (HCG section, Geography, Class VII);
# RDCD Geography resource used only to sharpen scope. Topic wording is our own summary of the official key concepts.
subject_id: icse-7-geography
academic_year: "2026-27"
source_status: verified
sources: [cisce-upper-primary-curriculum, cisce-upper-primary-geography-resource]
exam_notes: >-
  No board examination in Class 7: schools set their own unit tests and term examinations and choose their own
  textbooks (CISCE does not prescribe books below Class IX). Geography is taught as part of History, Civics and
  Geography (HCG). The CISCE curriculum is theme-based, with key concepts and learning outcomes per theme; Class
  VII has seven themes (Representation of Geographical Features, Atmosphere, Weather and Climate, Weathering and
  Soil Formation, Industries, Energy and Power Resources, Study of Continents: Europe, Africa, Australia and
  Antarctica). SOYL grouped these into 10 teachable chapters in curriculum order. Map skills (topographical sheet
  colours, signs, scales; locating countries, physical features and hydroelectric projects) are assessed within
  the themes. No marks weightage is published.
units: []
chapters:
  - id: icse-7-geography-ch01
    number: 1
    title: "Representation of Geographical Features: Topographical Sheets"
    unit: null
    topics:
      - id: icse-7-geography-ch01-t01
        title: "Use of colours on topographical sheets: blue, red, yellow, brown and green"
        learning_outcomes:
          - "State what each standard colour represents on a topographical sheet"
          - "Identify water bodies, settlements, agricultural land, high relief and forests on a toposheet from their colours"
      - id: icse-7-geography-ch01-t02
        title: "Conventional signs and symbols on Survey of India topographical sheets"
        learning_outcomes:
          - "Identify common conventional signs and symbols used on Survey of India toposheets"
          - "Draw a simple map using correct colours and conventional symbols"
      - id: icse-7-geography-ch01-t03
        title: "Types of scale: representative fraction and linear scale"
        learning_outcomes:
          - "Express the scale of a map as a representative fraction and as a linear scale"
          - "Convert a representative fraction into a statement of distance"
      - id: icse-7-geography-ch01-t04
        title: "Measuring straight-line and curved distances on a map using the scale"
        learning_outcomes:
          - "Calculate the actual distance between two places using the map scale"
          - "Describe how a thread is used to measure the length of a curved feature such as a river"
