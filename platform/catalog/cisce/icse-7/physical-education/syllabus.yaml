# ICSE Class 7 Physical Education - CISCE Curriculum: Physical Education (Classes VI-VIII), Class VII part.
# Source: platform/catalog/sources/cisce.md#cisce-physical-education-vi-viii.
# Theory only (fitness concepts, health awareness, rules and techniques of games, safety); topic wording is our own summary.
subject_id: icse-7-physical-education
academic_year: "2026-27"
source_status: verified
sources: [cisce-physical-education-vi-viii]
exam_notes: >-
  No board examination in Class 7: Physical Education is assessed by schools through participation and performance
  in activities. The CISCE curriculum has two themes common to Classes VI-VIII - Physical Fitness Components
  (speed, agility, flexibility, coordination, balance, endurance, strength) and Games/Sports Skills (any two games
  or sports chosen by the school from a list such as football, basketball, volleyball, hockey, cricket, kabaddi,
  kho-kho, athletics, gymnastics, swimming, combat sports and racquet games) - plus awareness of diet, nutrition,
  hygiene and safety. Class-wise differences lie in the suggested activities. SOYL covers the knowledge side as 10
  chapters: fitness concepts illustrated by the Class VII activities (80 m run, shuttle run, round-off, shot put,
  etc.), health awareness, classification of games, and the techniques and rules of the games used in the Class
  VII activities (handball, volleyball, kho-kho, cricket, badminton, table tennis). Actual drills, fitness
  activities and game play are practical and not covered as lessons. No marks weightage is published.
