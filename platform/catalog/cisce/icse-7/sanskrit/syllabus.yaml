# ICSE Class 7 Sanskrit (Third Language) - CISCE Sanskrit Curriculum, Classes V-VIII, Class VII part only.
# Source: platform/catalog/sources/cisce.md#cisce-sanskrit-v-viii (Class VII, Themes 1-2; decoded from Kruti Dev).
# Topic wording is our own summary of the official learning outcomes and recommended content.
subject_id: icse-7-sanskrit
academic_year: "2026-27"
source_status: verified
sources: [cisce-sanskrit-v-viii]
exam_notes: >-
  No board examination in Class 7. Sanskrit is offered as a third language, and CISCE publishes a separate recommended
  curriculum for it (Sanskrit, Classes V-VIII, RDCD) with learning outcomes per class; it prescribes no textbooks, no
  paper pattern and no marks weightage. Schools choose their own textbooks and set their own unit tests and term
  examinations, with continuous assessment through recitation, conversation, projects and written work. For Class VII it
  sets out two themes - Listening, Speaking and Reading, and Language and Writing - each with learning outcomes,
  recommended content, teaching processes and resources; it names no prescribed texts, so this file has no literature
  texts. SOYL grouped the themes into 10 teachable chapters in curriculum order. The source document is typeset in the
  legacy Kruti Dev font; SOYL decoded it to Unicode Devanagari before use. Learning outcomes are written in simple
  Sanskrit. The Class VII learning-outcome list names the i-stem masculine nouns (muni, kapi, hari) as a-stem; the
  content table correctly lists them as i-stem, and SOYL follows the content table.
units:
