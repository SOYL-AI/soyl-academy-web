#   Classes 7-8 -> CISCE Curriculum for Upper Primary Classes (VI-VIII)
# Modelling: every separately examined paper with its own syllabus is its own subject
# (English Language / Literature in English; Physics / Chemistry / Biology; History & Civics / Geography;
#  each Performing Arts / Music option; each language in each group). Shared official codes repeat.
# tier: core = platform core (compulsory subjects plus the mainstream subjects in the Wave 1 build list);
