chapters:
  - id: isc-12-legal-studies-ch01
    number: 1
    title: "BNS: Elements and Stages of Crime, Punishments and General Defences"
    unit: "1. The Bharatiya Nyaya Sanhita (BNS), 2023"
    topics:
      - id: isc-12-legal-studies-ch01-t01
        title: "Elements of crime: mens rea and actus reus"
        learning_outcomes:
          - "Explain mens rea and actus reus and why both are normally required for criminal liability"
          - "Identify the guilty act and guilty mind in a given fact situation"
      - id: isc-12-legal-studies-ch01-t02
        title: "Stages in crime: intention, preparation, attempt and commission"
        learning_outcomes:
          - "Distinguish the four stages of a crime and explain why mere intention and (generally) preparation are not punished"
          - "Apply the stages to a hypothetical case and identify the stage reached"
      - id: isc-12-legal-studies-ch01-t03
        title: "Punishments under Section 4: death, life imprisonment, rigorous and simple imprisonment, forfeiture, fine and community service"
        learning_outcomes:
          - "List the kinds of punishment under Section 4 BNS and explain community service as a new addition"
          - "Explain the 'rarest of rare' guideline for the death sentence with reference to Machhi Singh v. State of Punjab"
      - id: isc-12-legal-studies-ch01-t04
        title: "Defences based on justification: private defence, necessity and consent"
        learning_outcomes:
          - "Explain the limits of the right of private defence of body and property, with reference to Cherubin Gregory v. State of Bihar"
          - "Distinguish necessity and consent as justifications with examples"
      - id: isc-12-legal-studies-ch01-t05
        title: "Defences based on excuse: duress, intoxication, mistake, infancy and unsoundness of mind"
        learning_outcomes:
          - "Explain each excuse and the conditions under which it removes criminal liability"
          - "Distinguish a justification from an excuse"
    removed_topics: []
    literature_texts: []
  - id: isc-12-legal-studies-ch02
