# ISC Class 12 Legal Studies (881) - ISC 2027 examination, CLASS XII portion only.
# Source: platform/catalog/sources/cisce.md#isc-2027-legal-studies (re-uploaded February 2026). Topic wording is our own summary of the official scope.
subject_id: isc-12-legal-studies
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-legal-studies, isc-2027-regulations]
exam_notes: >-
  Paper I Theory: 3 hours, 70 marks, on the nine Class XII topics below. Paper II Project Work: 30 marks - two studies of
  15 marks each chosen from anywhere in the theory syllabus, synthesising cases, legislation, media and international
  instruments into a legal argument; each study is marked 5 by the teacher and 10 by a Visiting Examiner appointed locally
  and approved by CISCE (presentation 2, content 2, analysis 3, viva-voce 3). CISCE suggests studies such as acts that are
  both civil and criminal wrongs, the move from litigation to arbitration, classic contract cases, electronic contracts,
  everyday torts, the role of mediators and conciliators, court observation reports, custodial violence and human rights,
  free speech and contempt of court, the development of mens rea, and the Motor Vehicles Act or the dowry system; this
  project work is not part of the chapters below and no question paper is set for it. Criminal law is taught under the
  Bharatiya Nyaya Sanhita (BNS), 2023, using the section numbers given in the syllabus; the case laws listed by CISCE are
  indicative and are attached to the topics they illustrate. CISCE lists topics with scope notes, not textbook chapters:
  SOYL groups them into 16 teachable chapters in syllabus order. No unit-wise marks weightage is published for ISC Legal
  Studies.
