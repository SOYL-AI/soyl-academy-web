        learning_outcomes:
          - "State the three ways of abetting an offence and give an example of each"
          - "Explain the ruling in Gian Kaur v. State of Punjab on abetment of suicide and the right to life"
      - id: isc-12-legal-studies-ch02-t02
        title: "Criminal conspiracy (Section 61) and attempt (Section 62)"
        learning_outcomes:
          - "Explain the elements of criminal conspiracy, including the agreement between two or more persons"
          - "Distinguish attempt from preparation and state how attempts are punished"
      - id: isc-12-legal-studies-ch02-t03
        title: "Assault or criminal force to outrage a woman's modesty (Section 74) and stalking (Section 78)"
        learning_outcomes:
          - "Identify the elements, examples and punishment of each offence"
      - id: isc-12-legal-studies-ch02-t04
        title: "Dowry death (Section 80)"
        learning_outcomes:
          - "State the conditions for a death to be treated as a dowry death and the presumption that arises"
          - "Explain the significance of Pawan Kumar v. State of Haryana on cruelty and dowry demands"
      - id: isc-12-legal-studies-ch02-t05
        title: "Offences against children: exposure and abandonment of a child under twelve (Sections 91 and 93 as listed)"
        learning_outcomes:
          - "Explain the elements and punishment of abandoning or exposing a child under twelve by a parent or carer"
    removed_topics: []
    literature_texts: []
  - id: isc-12-legal-studies-ch03
