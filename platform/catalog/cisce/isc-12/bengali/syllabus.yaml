# ISC Class 12 Bengali (Bangla) (Indian Language elective, code 803) - ISC 2027 examination.
# Literature: titles and authors only (CONTEXT section 8). Students read the texts in their own textbook.
subject_id: isc-12-bengali
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-indian-languages, isc-2027-prescribed-books, cisce-circular-2026-27-33-indian-languages, isc-2027-regulations]
exam_notes: >-
  Paper I Theory: one paper of 3 hours, 80 marks, in two sections. Section A Language (40 marks, three compulsory
  questions): a composition of about 400 words in Bengali (Bangla) from a choice of six topics; an unseen passage of
  about 300 words with questions and/or a summary with a heading (testing the ability to summarise and/or expand an
  idea); and functional grammar (correction of sentences and use of words/idioms in sentences, with correct agreement
  of number, gender, case, tense and voice). Section B Prescribed Textbooks (40 marks): answer four questions from any
  three of the prescribed books. Prescribed texts are bifurcated (Circular 2026-27/33): the ISC 2027 paper is set only
  on the Class XII portion listed here; the Class XI portion (isc-11-bengali) is listed under each chapter's
  removed_topics. Paper II Project Work (20 marks): Listening (5) and Speaking (5) assessed by the teacher; Writing
  (10) assessed by a Visiting Examiner - one assignment of 1000-1500 words on a literature text not used in the Class
  XI project. CISCE lists topics, not chapters: SOYL grouped them into teachable chapters in syllabus order. CISCE
  does not publish question-wise marks within Section A and describes composition and grammar only generically: the
  composition types and grammar breakdown below are SOYL's, adapted to the grammar of the language. SOYL covers all
  four prescribed books so a student can pick any three. Titles are in English / CISCE transliteration; native-script
  titles to be added in language review.
units:
  - { name: "Section A: Language", marks: 40 }
  - { name: "Section B: Prescribed Textbooks", marks: 40 }
chapters:
  - id: isc-12-bengali-ch01
    number: 1
    title: "Composition writing (about 400 words)"
    unit: "Section A: Language"
    topics:
      - id: isc-12-bengali-ch01-t01
        title: "Planning a composition: choosing a topic, outline, introduction, body and conclusion"
        learning_outcomes:
          - "Choose a suitable topic from a choice of six and prepare an outline before writing"
          - "Write a well-organised composition of about 400 words in Bengali, divided into paragraphs"
      - id: isc-12-bengali-ch01-t02
        title: "Descriptive and narrative compositions"
        learning_outcomes:
          - "Describe an experience, journey, place or event in Bengali vividly and in a logical sequence"
      - id: isc-12-bengali-ch01-t03
        title: "Reflective and argumentative compositions: for and against, and conclusion"
        learning_outcomes:
          - "Present a point of view on a social or current issue in Bengali, supported by reasons and examples"
          - "Weigh opposing arguments fairly and write a balanced conclusion"
      - id: isc-12-bengali-ch01-t04
        title: "Story writing from a given sentence, proverb or outline"
        learning_outcomes:
          - "Write an original story in Bengali that develops a given opening line, proverb or outline to a meaningful end"
      - id: isc-12-bengali-ch01-t05
        title: "Language and style: word choice, idioms, spelling and punctuation"
        learning_outcomes:
          - "Use vocabulary and idiomatic expressions suited to the topic"
          - "Proofread a composition and correct its errors of spelling and punctuation in Bengali"
    removed_topics: []
    literature_texts: []
  - id: isc-12-bengali-ch02
    number: 2
    title: "Comprehension: unseen passage (about 300 words) and summary"
    unit: "Section A: Language"
    topics:
      - id: isc-12-bengali-ch02-t01
        title: "Identifying the main idea and supporting points of a passage"
        learning_outcomes:
          - "State the central idea of an unseen Bengali passage of about 300 words in your own words"
      - id: isc-12-bengali-ch02-t02
        title: "Answering questions on the passage in your own words"
        learning_outcomes:
          - "Answer factual and inferential questions accurately without copying lines from the passage"
          - "Explain the meaning of difficult words and phrases from their context"
      - id: isc-12-bengali-ch02-t03
        title: "Writing a summary with a heading"
        learning_outcomes:
          - "Write a summary of the passage in about one-third of its length and give it a suitable heading"
      - id: isc-12-bengali-ch02-t04
        title: "Expanding an idea given in the passage"
        learning_outcomes:
          - "Expand a statement or idea from the passage into a paragraph with examples"
    removed_topics: []
    literature_texts: []
  - id: isc-12-bengali-ch03
    number: 3
    title: "Grammar: correction of sentences"
    unit: "Section A: Language"
    topics:
      - id: isc-12-bengali-ch03-t01
        title: "Subject-verb agreement in person and honorific level (tui, tumi, apni forms); number and gender forms of nouns"
        learning_outcomes:
          - "Correct verb forms that do not match the person or honorific level of the subject"
          - "Use plural markers and feminine noun forms (stri-pratyay) correctly in sentences"
      - id: isc-12-bengali-ch03-t02
        title: "Karak and bibhakti: case relations, case endings and postpositions"
        learning_outcomes:
          - "Identify a wrong case ending or postposition in a sentence and replace it with the correct form"
      - id: isc-12-bengali-ch03-t03
        title: "Errors of tense and voice"
        learning_outcomes:
          - "Remove inconsistencies of tense within a sentence"
          - "Rewrite sentences correctly in the active and passive voice"
      - id: isc-12-bengali-ch03-t04
        title: "Errors of word order, redundancy, wrong word choice and spelling"
        learning_outcomes:
          - "Rewrite a faulty sentence correctly by fixing word order, removing redundant words and correcting spelling"
      - id: isc-12-bengali-ch03-t05
        title: "Avoiding the mixing of sadhu and cholit bhasha (guruchandali dosh)"
        learning_outcomes:
          - "Identify sentences that mix sadhu and cholit forms and rewrite them consistently in one style"
    removed_topics: []
    literature_texts: []
  - id: isc-12-bengali-ch04
    number: 4
    title: "Grammar: using words and idioms in sentences"
    unit: "Section A: Language"
    topics:
      - id: isc-12-bengali-ch04-t01
        title: "Idioms: meaning and use in sentences"
        learning_outcomes:
          - "Give the meaning of a Bengali idiom and use it in a sentence that makes the meaning clear"
      - id: isc-12-bengali-ch04-t02
        title: "Proverbs: meaning and use"
        learning_outcomes:
          - "Distinguish a proverb from an idiom and use a proverb aptly in context"
      - id: isc-12-bengali-ch04-t03
        title: "Using given words correctly in sentences: similar-sounding words with different meanings"
        learning_outcomes:
          - "Bring out the difference in meaning between similar-sounding words by using each in a sentence"
          - "Use a given word in a sentence in its correct form"
    removed_topics: []
    literature_texts: []
  - id: isc-12-bengali-ch05
    number: 5
    title: "Novel: Koni (Moti Nondi), chapters 9-14"
    unit: "Section B: Prescribed Textbooks"
    topics:
      - id: isc-12-bengali-ch05-t01
        title: "Chapters 9-11: events and development of the story"
        learning_outcomes:
          - "Narrate the main events of this part of the novel in sequence in your own words"
          - "Explain how this part develops the central conflict and the characters"
      - id: isc-12-bengali-ch05-t02
        title: "Chapters 12-14: events and the outcome of Koni's struggle"
        learning_outcomes:
          - "Narrate the main events of chapters 12-14 in sequence in your own words"
          - "Explain how the closing chapters resolve Koni's struggle"
      - id: isc-12-bengali-ch05-t03
        title: "Character sketches: Koni and her coach Khitish Sinha (Khitda)"
        learning_outcomes:
          - "Describe Koni's determination and growth with incidents from the prescribed chapters"
          - "Explain Khitda's role as coach and mentor and his relationship with Koni"
      - id: isc-12-bengali-ch05-t04
        title: "Themes: poverty, sport, perseverance and unfair treatment"
        learning_outcomes:
          - "Explain how the novel shows poverty and unfair treatment as obstacles to talent, and how perseverance answers them"
      - id: isc-12-bengali-ch05-t05
        title: "The title, the cry 'Fight, Koni, fight' and Moti Nondi's style"
        learning_outcomes:
          - "Explain the significance of the title and of the novel's repeated call to fight on"
          - "Comment on Moti Nondi's lively, sports-centred narration with examples"
    removed_topics:
      - "Koni chapters 1-8 (Class XI portion; see isc-11-bengali)"
    literature_texts:
      - { title: "Koni (chapters 9 to 14)", author: "Moti Nondi" }
  - id: isc-12-bengali-ch06
    number: 6
    title: "Drama: Mukut (Rabindra Nath Thakur), Act 3"
    unit: "Section B: Prescribed Textbooks"
    topics:
      - id: isc-12-bengali-ch06-t01
        title: "Act 3: events and climax of the play"
        learning_outcomes:
          - "Narrate the main events of Act 3 in sequence in your own words"
          - "Explain how Act 3 brings the conflict of the play to its climax and resolution"
      - id: isc-12-bengali-ch06-t02
        title: "Character sketches of the main characters"
        learning_outcomes:
          - "Write a character sketch of a main character, supported by incidents from the prescribed portion"
          - "Compare two characters and their responses to the central conflict"
      - id: isc-12-bengali-ch06-t03
        title: "Themes: ambition, rivalry, pride and the meaning of the crown (mukut)"
        learning_outcomes:
          - "Explain what the crown stands for in the play and what the ending says about ambition and pride"
      - id: isc-12-bengali-ch06-t04
        title: "Title and dramatic craft: dialogue, stage directions and stageability"
        learning_outcomes:
          - "Explain the significance of the title with reference to the prescribed portion"
          - "Comment on the playwright's use of dialogue and stage directions with examples"
    removed_topics:
      - "Mukut Acts 1 & 2 (Class XI portion; see isc-11-bengali)"
    literature_texts:
      - { title: "Mukut (Act 3)", author: "Rabindra Nath Thakur" }
  - id: isc-12-bengali-ch07
    number: 7
    title: "Probondho O Godya Sonkolon: short stories and essays (Class XII portion)"
    unit: "Section B: Prescribed Textbooks"
    topics:
      - id: isc-12-bengali-ch07-t01
        title: "Birjo Shulka (Sharadindu Bandyopadhyay): short story: plot, characters and theme"
        learning_outcomes:
          - "Summarise the story in your own words, bringing out its main events and turning point"
          - "Describe the main characters and explain the theme or message of the story"
      - id: isc-12-bengali-ch07-t02
        title: "Adaab (Samaresh Basu): two strangers from different communities during a communal riot"
        learning_outcomes:
          - "Narrate how two men from different communities, trapped during a riot and curfew, come to trust each other"
          - "Explain the significance of the title and the story's message of shared humanity"
      - id: isc-12-bengali-ch07-t03
        title: "Lachmoner Ma (Mahasweta Devi): short story: plot, characters and theme"
        learning_outcomes:
          - "Summarise the story in your own words, bringing out its main events and turning point"
          - "Describe the main characters and explain the theme or message of the story"
      - id: isc-12-bengali-ch07-t04
        title: "Ekti Tulsi Gacher Kahini (Walli Ullah): refugees, an abandoned house and a tulsi plant"
        learning_outcomes:
          - "Narrate how the new occupants of an abandoned house respond to the tulsi plant left by its former residents"
          - "Explain how the story reflects the pain of Partition and displacement"
      - id: isc-12-bengali-ch07-t05
        title: "Na Paharar Porikkha (Shankhyo Ghosh): essay: main ideas, examples and style"
        learning_outcomes:
          - "Summarise the writer's main ideas and the examples used to support them"
          - "Evaluate the relevance of the essay's ideas to present-day life"
    removed_topics:
      - "Class XI pieces of Probondho O Godya Sonkolon: Thakurda, Jora Sankor Dhare, Taser Ghar, Anachaar, Record (Class XI portion; see isc-11-bengali)"
    literature_texts:
