      - { title: "Lachmoner Ma", author: "Mahasweta Devi" }
      - { title: "Ekti Tulsi Gacher Kahini", author: "Walli Ullah" }
      - { title: "Na Paharar Porikkha (essay)", author: "Shankhyo Ghosh" }
  - id: isc-12-bengali-ch08
    number: 8
    title: "Kobita Sonkolon: poems (Class XII portion)"
    unit: "Section B: Prescribed Textbooks"
    topics:
      - id: isc-12-bengali-ch08-t01
        title: "Baborer Prarthona (Shankhyo Ghosh): a father's prayer for the next generation"
        learning_outcomes:
          - "Explain how the poet uses the story of Babur's prayer for his son"
          - "Interpret the poem's anxiety for the younger generation in today's world"
      - id: isc-12-bengali-ch08-t02
        title: "Jodi Nirbasan Dao (Sunil Gangyopadhyay): poem: central idea, imagery and style"
        learning_outcomes:
          - "Explain the central idea of the poem in your own words"
          - "Identify the imagery and figures of speech in the poem and comment on their effect"
      - id: isc-12-bengali-ch08-t03
        title: "Raasta Karor Ekar Noy (Birendra Chattopadhyay): the road as a shared right of all"
        learning_outcomes:
