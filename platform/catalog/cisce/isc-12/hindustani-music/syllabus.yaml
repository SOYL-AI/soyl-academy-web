# ISC Class 12 Music: Indian Music - Hindustani (872), Paper 1 Theory - ISC 2027 examination (Class XII portion only).
# Source: platform/catalog/sources/cisce.md#isc-2027-music. Theory paper only; practical work is described in exam_notes.
# Topic wording is our own summary of the official scope.
subject_id: isc-12-hindustani-music
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-music, isc-2027-regulations]
exam_notes: >-
  Paper 1 Theory: 3 hours, 70 marks. Paper 2 Practical: 30 marks (practical examination 20, overall impression by a
  locally appointed Visiting Practical Examiner 5 - accuracy of shruti and laya, confidence, posture, tonal quality,
  expression - and teacher's evaluation of the year's work 5). The syllabus has three parts - Part 1 Vocal, Part 2
  Instrumental, Part 3 Instrumental Percussion (Tabla) - and a candidate takes both papers from one part only. The
  subject may not be taken with Carnatic or Western Music. Class XII practical work (Part 1: chhota khayal with alaap
  and five taans in Bihag, Bageshwari, Kafi, Bhairavi and Malkauns, one vilambit khayal, ten alankars, padhant of
  Chaartaal, Dhamar, Ektaal and Roopak in dugun and chaugun; Part 2: Razakhani/drut gat with five todas and jhala in
  the same ragas, one Maseetkhani gat, ten alankars and the same padhant; both: raga identification from alaap;
  Part 3: Jhaptaal, Dadra, Teentaal, Dhamar, Jhoomra and Kaharwa in thah, dugun and chaugun, kisms, tukdas, kayadas
  with paltas and tihai, gat, laggi, ladi, chakkardar tukda and paran, and theka accompaniment) is not taught as
  chapters here. Theory items 2-8 and 10-12 are identical for Parts 1 and 2; essay questions of about 200 words are
  set on topics of general interest in music. Class XI theory (musical terms, khayal, the Class XI ragas and taals,
  Bhatkhande and Paluskar) is in isc-11-hindustani-music and is assumed background. CISCE lists numbered theory items
  per part, not chapters: SOYL groups them into teachable chapters in syllabus order, placing theory common to Parts 1
  and 2 in one unit. No marks weightage by part or topic is published.
