# ISC Class 12 Business Studies (859) - ISC 2027 examination, CLASS XII portion only.
# Source: platform/catalog/sources/cisce.md#isc-2027-business-studies. Topic wording is our own summary of the official scope.
subject_id: isc-12-business-studies
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-business-studies, isc-2027-regulations]
exam_notes: >-
  Two papers: Paper I Theory of 3 hours, 80 marks, and Paper II Project Work, 20 marks. For Paper II the candidate
  completes two projects (10 marks each: overall format 1, content 4, findings 2, viva-voce 3) on any theory topic,
  assessed by the teacher and a Visiting Examiner; viva-voce is conducted only by the Visiting Examiner and CISCE sets
  no question paper for it. The Class XII theory syllabus has five units; no unit-wise marks weightage is published.
  Candidates must be able to draft all the listed business letters in the correct format. CISCE lists topics, not
  chapters: SOYL groups them into 19 teachable chapters in syllabus order (the thirteen Human Resource Management
  sub-topics are kept largely one per chapter). The Class XI portion is in isc-11-business-studies. From the ISC 2028
  cohort, code 859 becomes Entrepreneurship.
units:
