# ISC Class 12 Mass Media & Communication (879) - ISC 2027 examination, CLASS XII portion only.
# Source: platform/catalog/sources/cisce.md#isc-2027-mass-media-communication. Topic wording is our own summary of the official scope.
subject_id: isc-12-mass-media-communication
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-mass-media-communication, isc-2027-regulations]
exam_notes: >-
  Paper I Theory: 3 hours, 70 marks, on the eight Class XII topics below. Paper II Project Work: 30 marks - two projects
  on any topic or allied aspect of the theory syllabus (script writing, documentary or video, book/film review, posters,
  advertisements, cartoon strip, advertising or social media campaign, case study, field visit), assessed 15 marks by the
  teacher and 15 marks by a Visiting Examiner appointed locally and approved by CISCE. CISCE suggests projects such as a
  30-second radio advertisement with jingle on a social issue, a hand-drawn comic story, a documentary on school life, a
  non-electronic environmental advertising campaign, a presentation on graduation courses, a week-long analysis of a
  social media campaign, a 1-5 minute fiction video and a review of a fantasy/sci-fi, comedy or musical film; this
  project work is not part of the chapters below and no question paper is set for it. CISCE lists topics with scope
  notes, not textbook chapters: SOYL groups them into 9 teachable chapters in syllabus order. No unit-wise marks
  weightage is published for ISC Mass Media & Communication.
