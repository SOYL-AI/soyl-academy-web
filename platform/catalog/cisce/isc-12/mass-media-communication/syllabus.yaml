      - id: isc-12-mass-media-communication-ch03-t02
        title: "Functions of television advertising: reach, informing and educating, entertaining, building a loyal following, affordable distribution"
        learning_outcomes:
          - "Explain each function with an example of a public service or product advertisement"
      - id: isc-12-mass-media-communication-ch03-t03
        title: "Types: cross promotion, merchandise, covert advertising, infomercials, bumper ads, sponsorship and call to action"
        learning_outcomes:
