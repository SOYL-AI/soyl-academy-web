chapters:
  - id: isc-12-mass-media-communication-ch01
    number: 1
    title: "Culture, Communication and Social Change"
    unit: "1. Communication"
    topics:
      - id: isc-12-mass-media-communication-ch01-t01
        title: "What is culture? The relationship between culture and mass media"
        learning_outcomes:
          - "Define culture and explain how mass media both reflect and shape it"
      - id: isc-12-mass-media-communication-ch01-t02
        title: "Communication in a cultural context; media as a vehicle of cultural transmission"
        learning_outcomes:
          - "Explain how cultural background affects the sending and interpretation of messages"
          - "Give examples of media carrying festivals, languages and traditions to new audiences"
      - id: isc-12-mass-media-communication-ch01-t03
        title: "Representation and stereotyping in mass media"
        learning_outcomes:
          - "Identify stereotypes of gender, region, caste or age in films, serials or advertisements"
          - "Evaluate the effect of stereotyped representation on audiences"
      - id: isc-12-mass-media-communication-ch01-t04
        title: "Social change: meaning; media as a catalyst for social change"
        learning_outcomes:
          - "Define social change and explain how media can speed it up"
          - "Discuss the role of media in social movements with Indian and global examples"
    removed_topics: []
    literature_texts: []
  - id: isc-12-mass-media-communication-ch02
    number: 2
    title: "Journalism: Qualities of a Journalist and Ethical Issues"
    unit: "2. Journalism"
    topics:
      - id: isc-12-mass-media-communication-ch02-t01
        title: "Qualities of a good journalist: nose for news, inquisitiveness, language skills, trustworthiness and empathy"
        learning_outcomes:
          - "Explain each quality and show how it helps a journalist report a story well"
      - id: isc-12-mass-media-communication-ch02-t02
        title: "Sensationalism, fake news and paid news"
        learning_outcomes:
          - "Define each practice, give an example and explain the harm it causes to public trust"
          - "Apply simple checks to judge whether a news item may be fake"
      - id: isc-12-mass-media-communication-ch02-t03
        title: "Plagiarism, advertorials and partisan reporting"
        learning_outcomes:
          - "Distinguish an advertorial from genuine editorial content"
          - "Explain why plagiarism and partisan reporting breach journalistic ethics"
      - id: isc-12-mass-media-communication-ch02-t04
        title: "Sting operations: public interest versus privacy and deception"
        learning_outcomes:
          - "Evaluate the arguments for and against sting operations with an example"
    removed_topics: []
    literature_texts: []
