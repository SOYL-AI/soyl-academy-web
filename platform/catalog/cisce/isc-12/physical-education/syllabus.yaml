# ISC Class 12 Physical Education (875) - ISC 2027 examination, CLASS XII portion only (theory paper).
# Source: platform/catalog/sources/cisce.md#isc-2027-physical-education. Topic wording is our own summary of the official scope.
subject_id: isc-12-physical-education
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-physical-education, isc-2027-regulations]
exam_notes: >-
  Paper I Theory: 3 hours, 70 marks. Section A covers six theory topics; Section B covers the theory of games -
  each candidate studies ANY TWO of Cricket, Football, Hockey, Basketball, Volleyball, Badminton, Tennis, Swimming
  and Athletics (rules and laws, officials, dimensions and diagrams of play area and equipment, terminology,
  fundamental skills, strategies and formations, associations and tournaments). SOYL gives one chapter per game
  so a student can pick any two. Paper II Practical Work: 30 marks, no question paper set by CISCE -
  continuous evaluation by the teacher 10 (file work on two games/activities 4, participation and performance 3,
  physical efficiency tests 3) and practical evaluation by a Visiting Examiner 20 (physical efficiency tests 12,
  specialisation tests on two basic skills of each chosen game/activity 6, viva 2). The six physical efficiency tests are
  50 m run, standing long jump, 1000 m (boys) / 600 m (girls) run, push-ups, 10 m shuttle run and 60-second sit-ups;
  practical activities also include softball, dancing, gymnastics and yoga. Practical work is not part of the chapters below.
  CISCE lists topics with scope notes, not textbook chapters: SOYL groups them into 17 teachable chapters in syllabus order.
  No section-wise marks weightage is published in the syllabus document.
