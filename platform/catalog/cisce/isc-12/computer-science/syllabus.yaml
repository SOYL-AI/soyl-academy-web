# ISC Class 12 Computer Science (868) - ISC 2027 examination, CLASS XII portion only.
# Source: platform/catalog/sources/cisce.md#isc-2027-computer-science. Topic wording is our own summary of the official scope.
subject_id: isc-12-computer-science
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-computer-science, isc-2027-regulations]
exam_notes: >-
  Paper I Theory: 3 hours, 70 marks, in three sections - A (Boolean algebra and computer hardware),
  B (programming in Java) and C (inheritance, interfaces, polymorphism, data structures and computational complexity).
  Paper II Practical: 3 hours, 30 marks, evaluated by a Visiting Examiner appointed locally and approved by CISCE.
  The candidate attempts one of three programming problems: a 90-minute planning session (algorithm in pseudo code
  plus a hand-written Java program) followed by a 90-minute examination session (key in, run on seen and unseen inputs,
  attach a printout). Marks: programming assignments through the year 10 (internal) + 5 (Visiting Examiner);
  terminal solution on the computer 15 (algorithm 3, documented Java program 7, printout 2, output 3).
  At least twenty-five programming assignments are expected during the year; this lab work (syllabus item 3,
  implementing algorithms in Java) is practical and is reflected here only through the programming chapters.
  Java 5.0 or later; BlueJ is recommended. Item 4 of the Class XII syllabus is a review of Class XI Sections B and C:
  SOYL teaches the items that Class XII lists again (objects, types, expressions, statements, methods, arrays, strings,
  recursion); Class XI-only items such as exceptions, data file handling, packages and trends/ethics in computing
  are in isc-11-computer-science. CISCE lists topics, not textbook chapters: SOYL groups them into 13 teachable
  chapters in syllabus order. No section-wise marks weightage is published in the syllabus document.
units:
  - { name: "Section A: Boolean Algebra and Computer Hardware", marks: null }
  - { name: "Section B: Programming in Java", marks: null }
  - { name: "Section C: Inheritance, Interfaces, Polymorphism, Data Structures and Complexity", marks: null }
chapters:
  - id: isc-12-computer-science-ch01
    number: 1
    title: "Propositional Logic"
    unit: "Section A: Boolean Algebra and Computer Hardware"
    topics:
      - id: isc-12-computer-science-ch01-t01
        title: "Propositions, propositional variables and connectives (negation, conjunction, disjunction, implication, biconditional)"
        learning_outcomes:
          - "Identify propositions and write compound statements using the five logical connectives"
          - "Translate a simple word problem into a well-formed formula (wff)"
      - id: isc-12-computer-science-ch01-t02
        title: "Well-formed formulae, truth values, interpretation and truth tables"
        learning_outcomes:
          - "Decide whether a given string of symbols is a well-formed formula"
          - "Construct the truth table of a wff with up to three variables"
      - id: isc-12-computer-science-ch01-t03
        title: "Satisfiable, unsatisfiable and valid formulae; tautology, contradiction and contingency"
        learning_outcomes:
          - "Classify a formula as a tautology, contradiction or contingency from its truth table"
          - "Distinguish satisfiable, unsatisfiable and valid formulae with examples"
      - id: isc-12-computer-science-ch01-t04
        title: "Equivalence laws: commutative, associative, distributive, De Morgan, implication, biconditional, identity, negation, excluded middle, contradiction"
        learning_outcomes:
          - "State each equivalence law and verify it with a truth table"
          - "Simplify a wff step by step, naming the law used at each step"
      - id: isc-12-computer-science-ch01-t05
        title: "Converse, inverse and contrapositive; chain rule and modus ponens"
        learning_outcomes:
          - "Write the converse, inverse and contrapositive of an implication and state which is equivalent to it"
          - "Apply modus ponens and the chain rule to draw a valid conclusion from given premises"
    removed_topics: []
    literature_texts: []
