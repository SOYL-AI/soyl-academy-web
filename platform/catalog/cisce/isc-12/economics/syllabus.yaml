# ISC Class 12 Economics (856) - ISC 2027 examination, CLASS XII portion only.
# Source: platform/catalog/sources/cisce.md#isc-2027-economics. Topic wording is our own summary of the official scope.
subject_id: isc-12-economics
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-economics, isc-2027-regulations, isc-2027-specimen-papers]
exam_notes: >-
  Two papers: Paper I Theory of 3 hours, 80 marks, and Paper II Project Work, 20 marks. For Paper II the candidate
  completes two projects (10 marks each: overall format 1, content 4, findings 2, viva-voce 3) on any theory topic,
  assessed by the teacher and a Visiting Examiner; viva-voce is conducted only by the Visiting Examiner and CISCE sets
  no question paper for it. Paper I is split equally: Microeconomic Theory 40 marks and Macroeconomics 40 marks.
  The published weightage table (as reconstructed from the extracted PDF, where the rows sum to 40 + 40) gives
  Demand and Elasticity of Demand 16, Supply and Market Mechanism 12, Production, Cost and Revenue and Market Forms 12,
  Theory of Income and Employment 8, Money and Banking 8, Balance of Payments and Exchange Rate 6, Public Finance 6,
  National Income 12. CISCE asks for examples from the Indian economy wherever relevant. CISCE lists topics, not
  chapters: SOYL groups them into 20 teachable chapters in syllabus order. The Class XI portion (Understanding
  Economics, Indian Economic Development, Statistics) is in isc-11-economics and is not examined in ISC 2027.
units:
  - { name: "1. Microeconomic Theory: Demand and Elasticity of Demand", marks: 16 }
  - { name: "1. Microeconomic Theory: Supply and Market Mechanism", marks: 12 }
  - { name: "1. Microeconomic Theory: Production, Cost and Revenue, Market Forms", marks: 12 }
  - { name: "2. Theory of Income and Employment", marks: 8 }
  - { name: "3. Money and Banking", marks: 8 }
  - { name: "4. Balance of Payments and Exchange Rate", marks: 6 }
  - { name: "5. Public Finance", marks: 6 }
  - { name: "6. National Income", marks: 12 }
chapters:
  - id: isc-12-economics-ch01
    number: 1
    title: "Theory of Demand"
    unit: "1. Microeconomic Theory: Demand and Elasticity of Demand"
    topics:
      - id: isc-12-economics-ch01-t01
        title: "Meaning and types of demand (individual, market, joint, composite, derived)"
        learning_outcomes:
          - "Define demand and distinguish it from desire and want"
          - "Classify given examples as joint, composite or derived demand"
      - id: isc-12-economics-ch01-t02
        title: "Determinants of demand and the demand function Dx = f(Px, Py, Y, T, ...)"
        learning_outcomes:
          - "Write a demand function and explain how each determinant affects quantity demanded"
          - "Distinguish substitutes from complements and normal goods from inferior goods using Indian examples"
      - id: isc-12-economics-ch01-t03
        title: "Law of Demand: assumptions, demand schedule and demand curve; reasons for the downward slope"
        learning_outcomes:
          - "Draw a demand curve from a given demand schedule"
          - "Explain the income effect, substitution effect, law of diminishing marginal utility and new buyers as reasons for the downward slope"
      - id: isc-12-economics-ch01-t04
        title: "Derivation of the market demand curve from individual demand curves"
        learning_outcomes:
          - "Construct a market demand schedule and curve by horizontal summation of individual schedules"
      - id: isc-12-economics-ch01-t05
        title: "Movement along versus shift of the demand curve (extension, contraction, increase, decrease)"
        learning_outcomes:
          - "Distinguish a change in quantity demanded from a change in demand with diagrams"
          - "Predict the direction of shift of the demand curve for a given change in income, tastes or related prices"
      - id: isc-12-economics-ch01-t06
        title: "Exceptions to the Law of Demand (Giffen goods, Veblen goods, expectations of price change, emergencies)"
        learning_outcomes:
          - "Explain why the demand curve may slope upward for Giffen and prestige goods"
