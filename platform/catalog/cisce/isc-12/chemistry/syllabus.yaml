# ISC Class 12 Chemistry (862), Paper I Theory - ISC 2027 examination (Class XII portion only).
# Source: platform/catalog/sources/cisce.md#isc-2027-chemistry. Topic wording is our own summary of the official scope.
subject_id: isc-12-chemistry
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-chemistry, isc-2027-regulations, cisce-circular-specimen-papers-2027, isc-2027-specimen-papers]
exam_notes: >-
  Paper I Theory: 3 hours, 70 marks. Paper II Practical: 3 hours, 15 marks, plus Project Work 10 marks and
  Practical File 5 marks, assessed by a locally appointed Visiting Examiner (total 30). The practical paper has three
  questions: volumetric analysis (redox titrations with potassium manganate(VII) against ammonium iron(II) sulphate or
  oxalic acid, including percentage purity and water of crystallisation); one or more of rate of reaction, identification
  of functional groups (glycerol, formaldehyde, acetone, benzoic acid, aniline), tests for carbohydrates and proteins,
  pH experiments and a simple voltaic cell; and qualitative analysis of a single salt (one anion, one cation).
  SOYL covers Paper I only. The ISC 2027 specimen paper (Paper I, 3 hours plus 15 minutes reading time) has 21 compulsory
  questions in four sections: A - 14 one-mark subparts including MCQs (14), B - ten 2-mark questions (20), C - seven
  3-mark questions (21), D - three 5-mark questions (15), with internal choice in two questions each in B, C and D;
  balanced equations and full working for numericals are expected. The October 2026 circular sets about 50% of marks
  on higher-order skills (apply, analyse, evaluate, create).
  The official weightage table groups the ten units into three branches (Physical 25, Inorganic 14, Organic 31), so the
  units below are those branches. Both old (IA-VIIA, 0) and IUPAC (1-18) group numbering are accepted.
  CISCE lists topics under ten units, not textbook chapters: SOYL groups them into 22 teachable chapters in syllabus order.
units:
  - { name: "Physical Chemistry (Units 1-3: Solutions, Electrochemistry, Chemical Kinetics)", marks: 25 }
  - { name: "Inorganic Chemistry (Units 4-5: d- and f-Block Elements, Coordination Compounds)", marks: 14 }
  - { name: "Organic Chemistry (Units 6-10: Haloalkanes and Haloarenes to Biomolecules)", marks: 31 }
