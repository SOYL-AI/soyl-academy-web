# ISC Class 12 Home Science (864), Paper I Theory - ISC 2027 examination (Class XII portion only).
# Source: platform/catalog/sources/cisce.md#isc-2027-home-science. Topic wording is our own summary of the official scope.
subject_id: isc-12-home-science
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-home-science, isc-2027-regulations]
exam_notes: >-
  Paper I Theory: 3 hours, 70 marks. Paper II Practical: 20 marks in two sessions - a 1-hour Planning Session
  (plan a balanced menu on one of two given options) and a 3-hour Examination Session (cook any two dishes from the
  menu using different cooking methods, display them with a suitable table layout, and design a food label showing
  any six of nutritive content, net content, additives, dates, instructions, MRP, standard marks, veg/non-veg symbol
  and manufacturer details); marks: menu planning 5, cooking 10, table display 2, label designing 3. Project Work
  7 marks (one project, e.g. height-weight survey against norms, traditional weaves of three States, a national
  community programme with two communication aids, or comparing bank fixed-deposit rates) and Practical File 3 marks.
  Practical, project and file are assessed by a locally appointed Visiting Examiner. Practicals during the year
  include menus for special occasions, packed meals and therapeutic diets, label design, and filling bank forms
  (cheques, deposit and withdrawal slips, demand drafts). SOYL covers Paper I only.
  No unit-wise marks weightage is published in the syllabus document, and no ISC 2027 specimen paper is listed for
  this subject. CISCE lists topics with scope notes under seven themes, not textbook chapters: SOYL groups them into
  13 teachable chapters in syllabus order.
