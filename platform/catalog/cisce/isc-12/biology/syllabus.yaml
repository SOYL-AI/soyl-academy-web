  - id: isc-12-biology-ch18
    number: 18
    title: "Biodiversity and its Conservation"
    unit: "Unit 5: Ecology and Environment"
    topics:
      - id: isc-12-biology-ch18-t01
        title: "Biodiversity: genetic, species and ecosystem diversity; global biodiversity and proportions of major taxa"
        learning_outcomes:
          - "Give an example of each level of biodiversity, including Indian examples"
      - id: isc-12-biology-ch18-t02
        title: "Patterns: latitudinal gradients, species-area relationship (graph and equation); rivet popper hypothesis; importance of biodiversity (narrowly utilitarian, broadly utilitarian, ethical)"
        learning_outcomes:
          - "Interpret the species-area curve and the meaning of the slope z"
          - "Explain why the tropics have greater biodiversity"
      - id: isc-12-biology-ch18-t03
        title: "Loss of biodiversity: recent extinctions (dodo, quagga, Steller's sea cow, thylacine, three tiger subspecies); causes - habitat loss, over-exploitation, alien species, coextinction"
        learning_outcomes:
          - "Explain the four major causes of biodiversity loss with examples"
      - id: isc-12-biology-ch18-t04
        title: "In-situ conservation: biosphere reserves, national parks, sanctuaries, sacred groves; hotspots, Ramsar sites, Red Data Book"
        learning_outcomes:
          - "Distinguish biosphere reserves, national parks and sanctuaries"
          - "Explain the purpose of the Red Data Book and biodiversity hotspots"
      - id: isc-12-biology-ch18-t05
        title: "Ex-situ conservation: captive breeding, zoos, botanical gardens, wildlife safaris, seed banks, cryopreservation, tissue culture"
        learning_outcomes:
          - "Compare in-situ and ex-situ conservation with examples"
      - id: isc-12-biology-ch18-t06
        title: "International conventions: the Earth Summit and the World Summit (place, year, agenda)"
        learning_outcomes:
          - "State the place, year and main agenda of the Earth Summit and the World Summit"
