    unit: "Unit 4: Biotechnology and its Applications"
    topics:
      - id: isc-12-biology-ch15-t01
        title: "Agriculture: micropropagation and somatic hybridisation; GM crops tolerant to cold, drought, salt and heat"
        learning_outcomes:
          - "Explain how micropropagation and somatic hybridisation help crop improvement"
      - id: isc-12-biology-ch15-t02
        title: "Pest-resistant crops (Bt crops; RNAi against Meloidogyne incognita); nutritionally enhanced crops (golden rice)"
        learning_outcomes:
          - "Explain how Bt toxin kills insect larvae but not the plant"
          - "Explain how RNA interference protects tobacco from nematodes"
      - id: isc-12-biology-ch15-t03
        title: "Medicine: genetically engineered insulin, vaccine production, stem cells and their applications"
        learning_outcomes:
          - "Describe how human insulin is produced in bacteria"
          - "Define stem cells and give applications of stem cell technology"
      - id: isc-12-biology-ch15-t04
        title: "Gene therapy (SCID); molecular diagnosis by PCR, ELISA and DNA/RNA probes"
        learning_outcomes:
          - "Outline gene therapy for adenosine deaminase deficiency"
          - "Explain why PCR allows early detection of infections"
      - id: isc-12-biology-ch15-t05
        title: "Transgenic animals: bioactive products (alpha-1-antitrypsin, alpha-lactalbumin), vaccine and chemical safety testing, study of diseases"
        learning_outcomes:
          - "Give uses of transgenic animals with examples"
      - id: isc-12-biology-ch15-t06
        title: "Biosafety and ethics: role of GEAC; biopiracy (basmati, turmeric) and biopatents"
        learning_outcomes:
          - "Explain the role of GEAC"
          - "Discuss biopiracy using the basmati and turmeric cases"
    removed_topics:
      - "Technical details of ELISA"
    literature_texts: []
  - id: isc-12-biology-ch16
    number: 16
    title: "Organisms and Populations"
    unit: "Unit 5: Ecology and Environment"
    topics:
      - id: isc-12-biology-ch16-t01
        title: "Population attributes: density and its measurement, natality, mortality, immigration, emigration, sex ratio, age pyramids, carrying capacity"
        learning_outcomes:
          - "Calculate birth and death rates from population data"
          - "Interpret expanding, stable and declining age pyramids"
      - id: isc-12-biology-ch16-t02
        title: "Population growth: exponential and logistic models with equations and graphs"
        learning_outcomes:
          - "Compare J-shaped and S-shaped growth curves and their equations"
          - "Explain the role of carrying capacity in logistic growth"
      - id: isc-12-biology-ch16-t03
        title: "Life history variation and reproductive fitness"
        learning_outcomes:
          - "Explain with examples how organisms balance number and size of offspring"
      - id: isc-12-biology-ch16-t04
        title: "Mutualism and competition (interspecific, interference, competitive release, Gause's competitive exclusion principle)"
        learning_outcomes:
          - "State Gause's principle and explain resource partitioning"
      - id: isc-12-biology-ch16-t05
        title: "Predation and anti-predator adaptations; parasitism (ecto-, endo- and brood parasites); commensalism; amensalism"
        learning_outcomes:
          - "Classify an interaction from the effect on each species (+, - or 0)"
          - "Give examples of adaptations of prey to avoid predators"
    removed_topics: []
    literature_texts: []
  - id: isc-12-biology-ch17
    number: 17
    title: "Ecosystem"
    unit: "Unit 5: Ecology and Environment"
    topics:
      - id: isc-12-biology-ch17-t01
        title: "Definition and types of ecosystems; biotic and abiotic components; structure and function of a pond ecosystem"
        learning_outcomes:
          - "Describe the components of a pond ecosystem and their roles"
      - id: isc-12-biology-ch17-t02
        title: "Productivity: GPP, NPP and secondary productivity; PAR; standing crop and standing state"
        learning_outcomes:
          - "Calculate NPP from GPP and respiration losses"
          - "Distinguish standing crop from standing state"
      - id: isc-12-biology-ch17-t03
        title: "Decomposition: fragmentation, leaching, catabolism, humification and mineralisation; factors affecting rate"
        learning_outcomes:
          - "Describe the steps of decomposition and predict how temperature and moisture affect its rate"
      - id: isc-12-biology-ch17-t04
        title: "Energy flow: grazing and detritus food chains, food webs, trophic levels, 10% law"
        learning_outcomes:
          - "Apply the 10% law to calculate energy at successive trophic levels"
      - id: isc-12-biology-ch17-t05
        title: "Ecological pyramids of number, biomass and energy"
        learning_outcomes:
          - "Draw upright and inverted pyramids with examples and explain why the energy pyramid is always upright"
