# ISC Class 12 Biology (863), Paper I Theory - ISC 2027 examination (Class XII portion only).
# Source: platform/catalog/sources/cisce.md#isc-2027-biology. Topic wording is our own summary of the official scope.
subject_id: isc-12-biology
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-biology, isc-2027-regulations, cisce-circular-specimen-papers-2027, isc-2027-specimen-papers]
exam_notes: >-
  Paper I Theory: 3 hours, 70 marks. Paper II Practical: 3 hours, 15 marks, plus Project Work 10 marks and
  Practical File 5 marks, assessed by a locally appointed Visiting Examiner (total 30). Practical work covers floral
  dissection, floral formula and floral diagram of one of seven families (Malvaceae, Papilionaceae, Solanaceae,
  Liliaceae/Amaryllidaceae, Cruciferae, Compositae, Gramineae), simple physiological experiments (stomata, soil comparison,
  amylase action at different temperatures and pH, DNA isolation from plant material), slide preparation and timed
  spotting. SOYL covers Paper I only. All structures are taught with labelled diagrams, and diagrams are drawn in pencil.
  The ISC 2027 specimen paper (Paper I, 3 hours plus 15 minutes reading time) has 18 compulsory questions in four
  sections: A - one-mark objective subparts including MCQs (20), B - seven 2-mark questions (14), C - seven 3-mark
  questions (21), D - three 5-mark questions (15), with internal choice in two questions each in B, C and D.
  The October 2026 circular sets about 50% of marks on higher-order skills (apply, analyse, evaluate, create).
  CISCE lists topics under five units, not textbook chapters: SOYL groups them into 18 teachable chapters in syllabus order.
units:
  - { name: "Unit 1: Reproduction", marks: 16 }
  - { name: "Unit 2: Genetics and Evolution", marks: 15 }
  - { name: "Unit 3: Biology and Human Welfare", marks: 14 }
  - { name: "Unit 4: Biotechnology and its Applications", marks: 10 }
  - { name: "Unit 5: Ecology and Environment", marks: 15 }
