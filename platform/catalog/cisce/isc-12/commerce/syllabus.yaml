# ISC Class 12 Commerce (code 857) - ISC 2027 examination.
# Source: platform/catalog/sources/cisce.md#isc-2027-commerce. Topic wording is our own summary of the official scope.
subject_id: isc-12-commerce
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-commerce, isc-2027-regulations]
exam_notes: >-
  Paper I Theory: 3 hours, 80 marks. Published unit weightage for Class XII: Business Environment 7, Financing 20,
  Management 33, Marketing 20. Paper II Project Work (20 marks): two projects of 10 marks each on any theory topic
  (overall format 1, content 4, findings 2, viva-voce 3), preferably handwritten, assessed by the teacher and a Visiting
  Examiner; suggested projects include comparing marketing strategies, consumer court cases, bank account procedures,
  fixed deposit rates, a simulated share portfolio, NIFTY/SENSEX sector tracking and company recruitment practices.
  CISCE lists topics under four units, not chapters: SOYL groups them into teachable chapters in syllabus order.
  From the ISC 2028 cohort this subject is renamed Business Studies (857).
units:
  - { name: "1. Business Environment", marks: 7 }
  - { name: "2. Financing", marks: 20 }
  - { name: "3. Management", marks: 33 }
  - { name: "4. Marketing", marks: 20 }
