# ISC Class 12 Biotechnology (878), Paper I Theory - ISC 2027 examination (Class XII portion only).
# Source: platform/catalog/sources/cisce.md#isc-2027-biotechnology. Topic wording is our own summary of the official scope.
subject_id: isc-12-biotechnology
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-biotechnology, isc-2027-regulations]
exam_notes: >-
  Paper I Theory: 3 hours, 70 marks. Paper II Practical: 3 hours, 15 marks, plus Project Work 10 marks and Practical
  File 5 marks, assessed by a locally appointed Visiting Examiner (total 30). Prescribed experiments include paper
  chromatography of leaf pigments, preparing phosphate, acetate and borate buffers, preparing and sterilising LB and
  plant tissue culture media, plates and slants, inoculating Lactobacillus, Gram staining, effect of temperature and
  substrate concentration on salivary amylase (Km by graph), isolating DNA from banana, DNA estimation by the DPA
  method, Bradford protein assay, Evans blue viability test, isolating casein from milk, detecting metanil yellow in
  turmeric, haemocytometer counting and saponification. The project is one study on an aspect of biotechnology (for
  example effluent analysis, vaccine development, ELISA diagnosis, DNA fingerprinting, stem cells, bioinformatics,
  ELSI of GMOs or biopiracy). SOYL covers Paper I only. The syllabus also lists 37 abbreviations (BAC, BLAST, CTAB,
  ddNTP, EST, FACS, HGP, PCR, RFLP, SNP, STS, VNTR, YAC and others) whose full forms candidates must know; they are
  folded into the relevant topics below. No unit-wise marks weightage is published, and no ISC 2027 specimen paper is
  listed for this subject. CISCE lists topics under four units with scope notes, not textbook chapters: SOYL groups
  them into 15 teachable chapters in syllabus order.
units:
  - { name: "1. Molecular Biology", marks: null }
  - { name: "2. Genetic Engineering", marks: null }
  - { name: "3. Cell Culture Technology", marks: null }
  - { name: "4. Bioinformatics", marks: null }
