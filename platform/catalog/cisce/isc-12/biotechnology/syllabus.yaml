          - "Use Chargaff's rules to calculate base percentages in a DNA sample"
      - id: isc-12-biotechnology-ch01-t03
        title: "RNA: types (mRNA, tRNA, rRNA), structure and functions; clover-leaf model of tRNA and brief L-shaped model"
        learning_outcomes:
