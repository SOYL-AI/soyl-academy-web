# ISC Class 12 Persian (Classical Language elective, code 839) - ISC 2027 examination.
# Prescribed book: title as transliterated by CISCE. Titles are in English with transliterated Persian terms.
subject_id: isc-12-persian-classical
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-classical-languages, isc-2027-prescribed-books, isc-2027-regulations]
exam_notes: >-
  Paper I Theory: one paper of 3 hours, 80 marks, containing: (a) questions on grammar; (b) unseen translation from English into
  Persian of short prose sentences and a continuous prose passage; (c) translation from the prescribed book, with no choice of
  passages; (d) short-answer questions on the subject matter of the prescribed book. CISCE does not publish marks per part.
  Prescribed book (Appendix I): Farsi Va Dastoor, available from Anjuman Tarrqie Urdu (no author named). Paper II Project Work
  (20 marks): Listening (5) and Speaking (5) assessed by the subject teacher - an unseen passage or poem read aloud twice with
  objective questions, and a three-minute presentation (which may include reading out a corrected version of a grammatically incorrect
  passage of 150-200 words); Writing (10) assessed by a Visiting Examiner - one assignment of about 250 words on a text studied. CISCE
  sets no question paper for project work. CISCE has not bifurcated this syllabus: the ISC 2027 paper is set on the entire Classes
  XI-XII syllabus, so nothing is removed for Class XI. CISCE does not list the grammar items for Persian; the grammar chapters below
  follow the standard school grammar of Persian as taught in India (terms such as Mazi Mutlaq, Muzare, Amr) - this breakdown is SOYL's,
  not CISCE's. SOYL did not have the contents of Farsi Va Dastoor, so the prescribed-book chapter is skill-based rather than lesson by
  lesson. Titles are in English / CISCE transliteration; Persian-script titles to be added in language review. CISCE lists topics not
  chapters; SOYL grouped them into teachable chapters in syllabus order.
units:
  - { name: "(a) Grammar", marks: null }
  - { name: "(b) Unseen translation from English into Persian", marks: null }
  - { name: "(c) and (d) Prescribed book: translation and short-answer questions", marks: null }
chapters:
  - id: isc-12-persian-classical-ch01
    number: 1
    title: "Nouns, izafat and number"
    unit: "(a) Grammar"
    topics:
      - id: isc-12-persian-classical-ch01-t01
        title: "The Persian alphabet: the four extra letters (pe, che, zhe, gaf) and joining forms"
        learning_outcomes:
          - "Write the Persian alphabet, including pe, che, zhe and gaf, and join letters correctly in words"
      - id: isc-12-persian-classical-ch01-t02
        title: "Plurals with -ha and -an, and Arabic broken plurals used in Persian"
        learning_outcomes:
          - "Form the plural of nouns with -ha or -an according to the type of noun"
          - "Recognise common Arabic broken plurals in Persian texts"
      - id: isc-12-persian-classical-ch01-t03
        title: "Indefiniteness: ya-e-wahdat and yek"
        learning_outcomes:
          - "Make a noun indefinite with the suffix -i or with yek and translate the result"
      - id: isc-12-persian-classical-ch01-t04
        title: "Izafat: noun + adjective and noun + noun"
        learning_outcomes:
          - "Link a noun to its adjective or possessor with the izafat and read the construction aloud correctly"
    removed_topics: []
    literature_texts: []
  - id: isc-12-persian-classical-ch02
    number: 2
    title: "Pronouns, adjectives and numerals"
    unit: "(a) Grammar"
    topics:
      - id: isc-12-persian-classical-ch02-t01
        title: "Personal pronouns (man, tu, u, ma, shuma, ishan) and attached pronouns (-am, -at, -ash, -eman, -etan, -eshan)"
        learning_outcomes:
          - "Use separate and attached pronouns to show the subject, possessor and object"
      - id: isc-12-persian-classical-ch02-t02
        title: "Demonstratives (in, an) and reflexive khud"
        learning_outcomes:
          - "Use in, an and khud correctly with nouns and verbs"
      - id: isc-12-persian-classical-ch02-t03
        title: "Comparative and superlative: -tar and -tarin"
        learning_outcomes:
          - "Compare people or things with -tar az and form the superlative with -tarin"
      - id: isc-12-persian-classical-ch02-t04
        title: "Cardinal and ordinal numbers"
        learning_outcomes:
          - "Write cardinal and ordinal numbers and use them with nouns"
    removed_topics: []
    literature_texts: []
  - id: isc-12-persian-classical-ch03
    number: 3
    title: "Verbs (1): the infinitive, stems and past tenses"
    unit: "(a) Grammar"
    topics:
      - id: isc-12-persian-classical-ch03-t01
        title: "Masdar (infinitive), past stem and present stem"
        learning_outcomes:
