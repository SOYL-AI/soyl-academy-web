# ISC Class 12 Sociology (854) - ISC 2027 examination, CLASS XII portion only.
# Source: platform/catalog/sources/cisce.md#isc-2027-sociology. Topic wording is our own summary of the official scope.
subject_id: isc-12-sociology
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-sociology, isc-2027-regulations, isc-2027-specimen-papers]
exam_notes: >-
  Paper I Theory: 3 hours, 70 marks, on the seven Class XII topics below.
  Paper II Practical (Project) Work: 30 marks - two studies of 15 marks each on any chapter of the theory syllabus,
  assessed by the teacher (5 marks per study: process, understanding and analysis, presentation within 2000 words)
  and a Visiting Examiner appointed locally and approved by CISCE (10 marks per study: technique and presentation,
  analysis and evaluation, viva). CISCE suggests studies such as kinship systems, marriage customs, the changing
  Indian family, communalism, consumerism and modernisation, status of women, social movements, sustainable development,
  reservation and the Mandal Commission, and the rising middle class; this project work is not part of the chapters below.
  CISCE lists topics with scope notes, not textbook chapters: SOYL groups them into 12 teachable chapters in syllabus order.
  No unit-wise marks weightage is published for ISC Sociology.
units:
  - { name: "1. Social Institutions", marks: null }
  - { name: "2. Religion and Society", marks: null }
  - { name: "3. Political Organization", marks: null }
  - { name: "4. Economic Organisation", marks: null }
  - { name: "5. Tribal India - Past, Present and Future", marks: null }
  - { name: "6. Social Stratification", marks: null }
  - { name: "7. Social Change and Development", marks: null }
