# ISC Class 12 Music: Western Music (874), Paper 1 Theory - ISC 2027 examination.
# Source: platform/catalog/sources/cisce.md#isc-2027-music. The syllabus is printed for Classes XI and XII together
# (no class split). Theory paper only; the aural practical is described in exam_notes. Topic wording is our own summary.
subject_id: isc-12-western-music
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-music, isc-2027-regulations]
exam_notes: >-
  Prerequisite: Grade 5 Theory and Grade 6 Practical of the Associated Board of the Royal Schools of Music, Trinity
  College of Music or London College of Music. Paper 1 Theory: 3 hours, 70 marks, in two sections - A Harmony and
  melody (four-part harmony, harmonisation, figured and unfigured bass, melody writing, analysis) and B Prescribed
  Works (Beethoven's Symphony No. 2 and one of three optional works). Paper 2 Practical: 30 marks (practical
  examination 20, Visiting Practical Examiner's evaluation of aural skills, written presentation and confidence 5,
  teacher's evaluation of the year's work 5): six aural tests - rhythm dictation on a monotone (simple time only),
  melodic dictation in a major or minor key, naming two diatonic intervals, recognising perfect, imperfect, plagal
  and interrupted cadences, recognising primary chords in root position and first and second inversion, and naming
  modulations to the dominant, subdominant or relative key. The aural tests are not taught as chapters here, though
  the harmony chapters cover the same theory. The subject may not be taken with Hindustani or Carnatic Music. The
  syllabus is printed for Classes XI and XII together with no class split, so all of it is covered here for the
  ISC 2027 examination. The source prints the Beethoven symphony as 'No. 2 in major op 36' (the key is D major) and
  misspells Erlkoenig and Franck. CISCE lists content by section, not chapters: SOYL groups it into teachable chapters
  in syllabus order. No section-wise marks weightage is published.
units:
  - { name: "Section A: Harmony and Melody", marks: null }
  - { name: "Section B: Prescribed Works", marks: null }
