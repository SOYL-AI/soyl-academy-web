# ISC Class 12 Physics (861), Paper I Theory - ISC 2027 examination (Class XII portion only).
# Source: platform/catalog/sources/cisce.md#isc-2027-physics. Topic wording is our own summary of the official scope.
subject_id: isc-12-physics
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-physics, isc-2027-regulations, cisce-circular-specimen-papers-2027, isc-2027-specimen-papers]
exam_notes: >-
  Paper I Theory: 3 hours, 70 marks. Paper II Practical: 3 hours, 15 marks, plus Project Work 10 marks and
  Practical File 5 marks, assessed by a locally appointed Visiting Examiner (total 30). Practical experiments come
  mainly from ray optics (removing parallax, u-v methods for lenses and mirrors) and current electricity (metre bridge,
  potentiometer, Ohm's law); the practical paper always includes one graph, and short questions test the theory behind
  each experiment. The project may be theoretical, a working model or investigatory. SOYL covers Paper I only.
  SI units throughout; numerical problems are set from every topic unless a topic is marked qualitative or excluded.
  The ISC 2027 specimen paper (Paper I, 3 hours plus 15 minutes reading time) has 20 compulsory questions in four
  sections: A - 14 one-mark subparts including MCQs (14), B - seven 2-mark questions (14), C - nine 3-mark questions (27),
  D - three 5-mark questions (15), with internal choice in two questions each in B, C and D; a simple non-programmable
  scientific calculator is allowed. The October 2026 circular sets about 50% of marks on higher-order skills
  (apply, analyse, evaluate, create).
  The official weightage table gives one combined figure for Electrostatics with Current Electricity (14) and for
  Magnetic Effects with Electromagnetic Induction and AC (16), so those pairs are grouped as single units below.
  CISCE lists topics under nine units, not textbook chapters: SOYL groups them into 21 teachable chapters in syllabus order.
units:
  - { name: "Units 1-2: Electrostatics and Current Electricity", marks: 14 }
  - { name: "Units 3-4: Magnetic Effects of Current and Magnetism; Electromagnetic Induction and Alternating Currents", marks: 16 }
  - { name: "Unit 5: Electromagnetic Waves", marks: 2 }
  - { name: "Unit 6: Optics", marks: 18 }
  - { name: "Unit 7: Dual Nature of Radiation and Matter", marks: 7 }
  - { name: "Unit 8: Atoms and Nuclei", marks: 6 }
  - { name: "Unit 9: Electronic Devices", marks: 7 }
