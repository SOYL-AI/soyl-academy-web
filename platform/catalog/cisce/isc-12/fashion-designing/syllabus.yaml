# ISC Class 12 Fashion Designing (865), Paper I Theory - ISC 2027 examination (Class XII portion only).
# Source: platform/catalog/sources/cisce.md#isc-2027-fashion-designing. Topic wording is our own summary of the official scope.
subject_id: isc-12-fashion-designing
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-fashion-designing, isc-2027-regulations]
exam_notes: >-
  Paper I Theory: 3 hours, 70 marks, in two sections - Section A Textiles (topics 1-5) and Section B Fashion and
  Apparel (topics 6-9). Paper II Practical Work: 30 marks - a journal of the year's work evaluated by the teacher (5)
  and by a Visiting Examiner (5), plus a 3-hour practical examination evaluated by the Visiting Examiner (20) on
  fibre identification (microscope and burning tests), simple dyeing, tie and dye, leaf and vegetable printing,
  macrame knots, laundering and finishing of cotton, silk, wool and synthetic garments, and renovation, darning and
  patchwork. Year-long practical work also includes weave samples, fabric swatches and newspaper clippings of textile
  innovations. SOYL covers Paper I only; sketching of sari drapes and costumes is part of the theory paper.
  The European fashion history topics cover only the periods named in the syllabus (1901-1920, 1941-1950, 1961-1980
  and 2001 to date), each studied with reference to women's silhouettes, fabric and garment innovations, and
  headgear and hairstyles. No section-wise marks weightage is published, and no ISC 2027 specimen paper is listed for
  this subject. CISCE lists topics with scope notes, not textbook chapters: SOYL groups them into 10 teachable
  chapters in syllabus order.
