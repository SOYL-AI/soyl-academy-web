# ISC Class 12 History (851) - ISC 2027 examination, CLASS XII portion only.
# Source: platform/catalog/sources/cisce.md#isc-2027-history. Topic wording is our own summary of the official scope.
subject_id: isc-12-history
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-history, isc-2027-regulations]
exam_notes: >-
  Two papers: Paper I Theory of 3 hours, 80 marks, and Paper II Project Work, 20 marks. The theory syllabus has
  Section A Indian History (1939-1986: independence, democracy, foreign policy, women's rights) and Section B World
  History (Second World War, decolonisation, Cold War, protest movements, Arab-Israeli conflict); the syllabus does not
  publish section-wise or topic-wise marks. Paper II is one project on a 20th-21st century (to 2012) theme, written up
  as an 800-1500 word essay (introduction, main body, conclusion, bibliography, optional appendix); 10 marks from the
  teacher (process 3, understanding and analysis 4, presentation 3) and 10 from a Visiting Examiner (technique and
  presentation 4, analysis and evaluation 3, viva 3). CISCE lists eleven topics, not textbook chapters: SOYL splits the
  larger ones into 18 teachable chapters in syllabus order. The Class XI portion is in isc-11-history.
units:
  - { name: "Section A: Indian History", marks: null }
  - { name: "Section B: World History", marks: null }
