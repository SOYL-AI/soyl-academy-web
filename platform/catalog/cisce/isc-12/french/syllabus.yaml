      - id: isc-12-french-ch05-t02
        title: "Explaining words, phrases and sentences in context"
        learning_outcomes:
          - "Explain the meaning of a word, phrase or sentence from the passage in simple French, using a synonym or paraphrase"
      - id: isc-12-french-ch05-t03
        title: "Answering comprehension questions in French in one's own words"
        learning_outcomes:
          - "Answer questions in complete French sentences without copying long stretches of the passage"
      - id: isc-12-french-ch05-t04
        title: "Writing a résumé in French of part of the passage"
        learning_outcomes:
          - "Summarise a section of the passage in French within a word limit, keeping only the essential points"
