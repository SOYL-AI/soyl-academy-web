# ISC Class 12 French (Modern Foreign Language elective, code 828) - ISC 2027 examination.
# Literature: titles and authors only. Students read the texts in their own editions.
subject_id: isc-12-french
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-mfl, isc-2027-prescribed-books, isc-2027-regulations]
exam_notes: >-
  Paper I Theory: one paper of 3 hours, 80 marks, in four parts: (1) a short composition in French from a choice of subjects;
  (2) a French passage for unprepared translation into English; (3) an unseen French passage with questions - candidates may be
  asked to summarise part of it in French, explain individual words, phrases or sentences, and answer comprehension questions
  (not every question type is set every year); (4) two questions on one or two of the prescribed textbooks.
  CISCE does not publish marks per part. Paper II Project Work (20 marks): Listening (5) and Speaking (5) assessed by the subject
  teacher - an unseen passage or poem read aloud twice with objective questions, and a three-minute individual presentation followed
  by discussion; Writing (10) assessed by a Visiting Examiner - one assignment of about 250 words on any aspect of the language or
  literature studied in Class XII (e.g. summary, book or film review, alternative ending, theme analysis). CISCE sets no question paper
  for project work. CISCE has not bifurcated this syllabus: the ISC 2027 paper is set on the entire Classes XI-XII syllabus and all four
  prescribed books, so nothing is removed here. The syllabus does not list grammar items; the two grammar chapters below cover the
  structures needed for composition, translation and reading the prescribed nineteenth- and twentieth-century texts - this breakdown is
  SOYL's, not CISCE's. SOYL covers all four prescribed books so a student can choose which to answer on. CISCE lists topics not
  chapters; SOYL grouped them into teachable chapters in syllabus order.
units:
  - { name: "1. Composition", marks: null }
  - { name: "2. Unprepared translation into English", marks: null }
  - { name: "3. Unseen passage", marks: null }
  - { name: "4. Prescribed textbooks", marks: null }
chapters:
  - id: isc-12-french-ch01
    number: 1
    title: "Composition (Rédaction)"
    unit: "1. Composition"
    topics:
      - id: isc-12-french-ch01-t01
        title: "Planning a composition: plan, introduction, développement, conclusion and connecteurs logiques"
        learning_outcomes:
          - "Draw up a plan for a given subject and write a composition in French with a clear introduction, developed paragraphs and a conclusion"
          - "Link ideas with connecteurs such as d'abord, en outre, par contre, pourtant, en effet, bref"
      - id: isc-12-french-ch01-t02
        title: "Descriptive and narrative compositions"
        learning_outcomes:
          - "Describe a person, place or event vividly using a range of adjectives and the imparfait for background"
          - "Narrate a real or imagined experience, sequencing events with the passé composé, imparfait and plus-que-parfait"
      - id: isc-12-french-ch01-t03
        title: "Argumentative and opinion compositions: pour et contre"
        learning_outcomes:
          - "Present arguments for and against a statement and reach a reasoned conclusion"
          - "Express and justify an opinion with expressions such as à mon avis, il me semble que, je ne pense pas que + subjonctif"
      - id: isc-12-french-ch01-t04
        title: "Subjects from contemporary life: environment, technology, education, festivals, travel, youth"
        learning_outcomes:
          - "Use topic vocabulary accurately to write on contemporary issues, including examples from Indian life"
      - id: isc-12-french-ch01-t05
        title: "Accuracy and style: agreement, accents, register, avoiding anglicisms; revising one's draft"
        learning_outcomes:
          - "Find and correct errors of agreement, accents and tense in one's own composition"
          - "Vary sentence structure and vocabulary to avoid repetition"
    removed_topics: []
    literature_texts: []
  - id: isc-12-french-ch02
    number: 2
    title: "Grammaire avancée (1): les temps et les modes"
    unit: null
    topics:
      - id: isc-12-french-ch02-t01
        title: "Passé simple: recognising and understanding it in literary narrative"
        learning_outcomes:
          - "Identify passé simple forms of regular and common irregular verbs (fut, eut, fit, vint, prit) and give their infinitive and meaning"
          - "Explain why literary narrative uses the passé simple where speech uses the passé composé"
      - id: isc-12-french-ch02-t02
        title: "Plus-que-parfait and futur antérieur"
        learning_outcomes:
          - "Form the plus-que-parfait and futur antérieur and use them to show which of two actions came first"
      - id: isc-12-french-ch02-t03
        title: "Conditionnel présent et passé; phrases avec si (three patterns)"
        learning_outcomes:
          - "Form the conditionnel présent and passé"
          - "Complete si-clauses with the correct tense sequence for real, unlikely and impossible conditions"
      - id: isc-12-french-ch02-t04
        title: "Subjonctif présent: after il faut que, wishes, emotions, doubt and conjunctions (bien que, pour que, avant que)"
        learning_outcomes:
          - "Form the subjonctif présent of regular and common irregular verbs (être, avoir, aller, faire, pouvoir, savoir)"
          - "Decide whether a clause needs the subjonctif or the indicatif and justify the choice"
      - id: isc-12-french-ch02-t05
        title: "Participe présent, gérondif (en + -ant) and infinitif passé"
        learning_outcomes:
          - "Use the gérondif to express simultaneity, manner or cause"
          - "Replace a clause with après avoir / après être + past participle"
    removed_topics: []
    literature_texts: []
  - id: isc-12-french-ch03
    number: 3
    title: "Grammaire avancée (2): la phrase complexe"
    unit: null
    topics:
      - id: isc-12-french-ch03-t01
        title: "Pronoms relatifs: qui, que, dont, où and lequel / auquel / duquel"
        learning_outcomes:
          - "Join two sentences with the correct simple or compound relative pronoun, including after a preposition"
      - id: isc-12-french-ch03-t02
        title: "Double object pronouns and their order (me le, le lui, lui en, y en)"
        learning_outcomes:
          - "Replace two complements with pronouns in the correct order, in statements, negatives and the imperative"
      - id: isc-12-french-ch03-t03
        title: "Discours indirect et concordance des temps"
        learning_outcomes:
          - "Convert direct speech to reported speech, changing pronouns, tenses and time expressions correctly"
      - id: isc-12-french-ch03-t04
        title: "Voix passive (être + participe passé, par / de) and alternatives (on, se faire)"
        learning_outcomes:
          - "Transform active sentences into the passive and back, keeping the tense"
          - "Recognise when French prefers on or a pronominal verb to the passive"
      - id: isc-12-french-ch03-t05
        title: "Expressing cause, consequence, purpose and opposition (parce que, puisque, donc, si bien que, afin que, bien que, alors que)"
        learning_outcomes:
          - "Join ideas with a connector of cause, consequence, purpose or opposition and the mood it requires"
    removed_topics: []
    literature_texts: []
  - id: isc-12-french-ch04
    number: 4
    title: "Unprepared translation into English (Version)"
    unit: "2. Unprepared translation into English"
    topics:
      - id: isc-12-french-ch04-t01
        title: "Reading the whole passage for meaning before translating"
        learning_outcomes:
          - "State the gist of a French passage and mark difficult words and structures before translating"
      - id: isc-12-french-ch04-t02
        title: "Rendering French tenses and moods in English (passé simple, imparfait, subjonctif, conditionnel)"
        learning_outcomes:
          - "Choose the English tense or modal that best conveys a French tense or mood in context (e.g. imparfait as 'used to' or 'was ...ing')"
      - id: isc-12-french-ch04-t03
        title: "Idioms, set expressions and faux amis"
        learning_outcomes:
          - "Translate idioms by their natural English equivalent rather than word for word"
          - "Avoid false friends such as actuellement, sensible, librairie, assister à"
      - id: isc-12-french-ch04-t04
        title: "Producing fluent, accurate English and checking the translation"
        learning_outcomes:
          - "Write a complete English version that omits nothing and reads naturally, then check it sentence by sentence against the original"
    removed_topics: []
    literature_texts: []
  - id: isc-12-french-ch05
