# ISC Class 12 English Language (English 801, Paper 1: English Language) - ISC 2027 examination.
# Source: platform/catalog/sources/cisce.md#isc-2027-english. Topic wording is our own summary of the official scope.
subject_id: isc-12-english-language
academic_year: "2026-27"
source_status: verified
