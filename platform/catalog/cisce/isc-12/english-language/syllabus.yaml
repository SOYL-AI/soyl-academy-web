exam_notes: >-
  English (801) is compulsory and has two components, English Language and Literature in English, each with its own
  theory paper of 80 marks and project work of 20 marks; this file is English Language (it may not be taken with Modern English).
  Theory paper: 3 hours, 80 marks, all four questions compulsory. Question 1: one composition (400-450 words) from a
  choice of six (narrative, descriptive, reflective, argumentative/persuasive, expository, original short story).
  Question 2: (a) directed writing of 250-300 words using all given points (feature article, book review, blog,
  newspaper report, statement of purpose) and (b) a proposal in the CISCE format (introduction/heading, objectives,
  list of measures, concluding statement). Question 3: short items on transformation of sentences, phrasal verbs and
  verbs/tenses (number and type vary from year to year). Question 4: a passage of about 700 words with vocabulary,
  understanding and inference questions plus a summary that must be written in grid form (no abbreviations or contractions).
  Project work (20 marks, Class XII): Listening (5) and Speaking (5) assessed by the teacher - an unseen passage of about
  500 words read aloud twice with objective questions, and a three-minute presentation plus discussion; Writing (10)
  assessed by a Visiting Examiner - a piece of about 500 words such as a brochure, product or process description,
  description of a sporting event, autobiographical experience or review of a television serial. No question paper is set
  for project work. The paper pattern is the same in Classes XI and XII. CISCE describes question types, not chapters:
  SOYL groups the skills into teachable chapters in the order of the paper. No question-wise marks are published in the
  syllabus, so units carry no marks.
