# ISC Class 12 Tibetan (Modern Foreign Language elective, code 835) - ISC 2027 examination.
# CISCE Appendix I lists no prescribed textbooks for Tibetan, so Part 4 of the paper is two translation passages.
# Titles are in English; Tibetan grammatical particles are given in Wylie transliteration (no Tibetan script).
subject_id: isc-12-tibetan
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-mfl, isc-2027-prescribed-books, isc-2027-regulations]
exam_notes: >-
  Paper I Theory: one paper of 3 hours, 80 marks, in four parts: (1) a short composition in Tibetan from a choice of subjects;
  (2) a Tibetan passage for unprepared translation into English; (3) an unseen Tibetan passage with questions - candidates may be
  asked to summarise part of it in Tibetan, explain individual words, phrases or sentences, and answer comprehension questions
  (not every question type is set every year); (4) questions on prescribed textbooks - but CISCE Appendix I (ISC 2027) prescribes
  no textbooks for Tibetan, so under the syllabus rule for languages without texts Part 4 consists of (a) one passage for translation
  from Tibetan into English and (b) one passage for translation from English into Tibetan. The syllabus asks schools to consult CISCE
  in time about prescribed textbooks. CISCE does not publish marks per part. Paper II Project Work (20 marks): Listening (5) and
  Speaking (5) assessed by the subject teacher - an unseen passage or poem read aloud twice with objective questions, and a
  three-minute individual presentation followed by discussion; Writing (10) assessed by a Visiting Examiner - one assignment of about
  250 words on any aspect of the language studied in Class XII. CISCE sets no question paper for project work. CISCE has not bifurcated
  this syllabus: the ISC 2027 paper is set on the entire Classes XI-XII syllabus, so nothing is removed here. The syllabus does not
  list grammar items; the two grammar chapters below cover the structures needed for composition and two-way translation - this
  breakdown is SOYL's, not CISCE's. Titles are in English with Wylie transliteration; Tibetan-script titles to be added in language
  review. CISCE lists topics not chapters; SOYL grouped them into teachable chapters in syllabus order.
units:
  - { name: "1. Composition", marks: null }
  - { name: "2. Unprepared translation into English", marks: null }
  - { name: "3. Unseen passage", marks: null }
  - { name: "4. Translation (no textbooks prescribed)", marks: null }
chapters:
  - id: isc-12-tibetan-ch01
    number: 1
    title: "Composition"
    unit: "1. Composition"
    topics:
      - id: isc-12-tibetan-ch01-t01
        title: "Planning a short composition: outline, paragraphs and connecting particles"
        learning_outcomes:
          - "Draw up an outline and write a short composition in Tibetan with a clear introduction, body and conclusion"
      - id: isc-12-tibetan-ch01-t02
        title: "Descriptive and narrative compositions"
        learning_outcomes:
          - "Describe a person, place or festival such as Losar in well-formed Tibetan sentences"
          - "Narrate a past experience in order, using past verb stems and connecting particles"
      - id: isc-12-tibetan-ch01-t03
        title: "Expressing and supporting an opinion on a given subject"
        learning_outcomes:
          - "State an opinion on a subject and support it with two or three reasons"
      - id: isc-12-tibetan-ch01-t04
        title: "Subjects from everyday and community life: family, school, festivals, environment, culture and education"
        learning_outcomes:
          - "Use topic vocabulary accurately, including Tibetan and Indian examples"
      - id: isc-12-tibetan-ch01-t05
        title: "Accuracy and register: spelling, the tsheg and shad, honorific and ordinary forms"
        learning_outcomes:
          - "Proof-read one's composition for spelling errors and correct punctuation with the tsheg and shad"
          - "Use honorific forms consistently when writing about elders, teachers and respected persons"
    removed_topics: []
    literature_texts: []
  - id: isc-12-tibetan-ch02
    number: 2
    title: "Grammar (1): spelling and case particles"
    unit: null
    topics:
      - id: isc-12-tibetan-ch02-t01
        title: "Syllable structure: root letter, prefix, superscript, subscript, vowel sign, suffix and second suffix"
        learning_outcomes:
          - "Identify the root letter and the other components of a written Tibetan syllable"
          - "Spell words correctly from dictation, including stacked letters"
      - id: isc-12-tibetan-ch02-t02
        title: "Genitive particles (kyi, gyi, gi, 'i, yi) and their choice after each suffix"
        learning_outcomes:
          - "Choose the correct form of the genitive particle according to the final letter of the preceding syllable"
      - id: isc-12-tibetan-ch02-t03
        title: "Agentive (instrumental) particles (kyis, gyis, gis, 'is, yis) with transitive verbs"
        learning_outcomes:
          - "Mark the agent of a transitive verb with the correct agentive particle"
      - id: isc-12-tibetan-ch02-t04
        title: "La-don particles (su, ra, ru, tu, du, na, la): object, purpose, location and time"
        learning_outcomes:
          - "Select the correct la-don particle for its function and for the preceding letter"
      - id: isc-12-tibetan-ch02-t05
        title: "Ablative particles (nas, las) and the remaining cases"
        learning_outcomes:
          - "Use nas and las to express source, origin and comparison"
    removed_topics: []
    literature_texts: []
  - id: isc-12-tibetan-ch03
    number: 3
    title: "Grammar (2): verbs, honorifics and sentence connection"
    unit: null
    topics:
      - id: isc-12-tibetan-ch03-t01
        title: "Verb stems: present, past, future and imperative"
        learning_outcomes:
          - "Give the four stems of common verbs and use the right stem for the time of the action"
      - id: isc-12-tibetan-ch03-t02
        title: "Linking and existential verbs: yin, red, yod, 'dug and their uses"
        learning_outcomes:
          - "Choose between the linking verbs yin/red and the existential verbs yod/'dug according to meaning and the speaker's knowledge"
      - id: isc-12-tibetan-ch03-t03
        title: "Honorific vocabulary (zhe sa): nouns and verbs"
        learning_outcomes:
          - "Replace ordinary nouns and verbs with their honorific equivalents in sentences about respected persons"
      - id: isc-12-tibetan-ch03-t04
        title: "Connecting particles: nas, te / de / ste, cing / zhing / shing, kyang / yang / 'ang"
        learning_outcomes:
          - "Join clauses with the connecting particle that shows sequence, continuation or contrast, in the correct form"
      - id: isc-12-tibetan-ch03-t05
        title: "Negation and questions: ma, mi, med, min; question particles"
        learning_outcomes:
          - "Make sentences negative with the correct negative particle and form yes-no and question-word questions"
    removed_topics: []
    literature_texts: []
  - id: isc-12-tibetan-ch04
