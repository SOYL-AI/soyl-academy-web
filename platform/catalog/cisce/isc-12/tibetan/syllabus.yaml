        title: "Reading for meaning: finding the verb at the end and working back through the particles"
        learning_outcomes:
          - "Identify the main verb, agent and object of a Tibetan sentence from its particles before translating"
      - id: isc-12-tibetan-ch04-t02
        title: "Reordering verb-final Tibetan sentences into natural English"
        learning_outcomes:
          - "Turn long Tibetan sentences joined by connecting particles into clear English sentences"
      - id: isc-12-tibetan-ch04-t03
        title: "Honorifics, cultural and religious terms"
        learning_outcomes:
