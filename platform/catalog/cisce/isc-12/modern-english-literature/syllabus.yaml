# ISC Class 12 Modern English: Literature in English (Modern English 891, component 2: Prescribed Texts) - ISC 2027 examination.
# Source: platform/catalog/sources/cisce.md#isc-2027-modern-english and #isc-2027-prescribed-books.
# Literature: titles and authors only. Students read the texts in their own textbook; topic wording is our own.
subject_id: isc-12-modern-english-literature
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-modern-english, isc-2027-prescribed-books, isc-2027-specimen-papers, isc-2027-regulations]
exam_notes: >-
  Modern English (891) is the compulsory alternative to English (801); Literature in English is its second component,
  with a theory paper of 3 hours and 80 marks plus project work of 20 marks. Questions are set on Drama, Prose (short
  stories) and Poetry: drama and prose questions are central to the text and test understanding, appreciation, analysis
  and synthesis in the candidate's own words; poetry questions test content, personal response and appreciation of
  stylistic and literary features. The ISC 2027 (Class XII) paper is set ONLY on the Class XII portion listed here:
  Pygmalion Acts III-V, five stories from Perspectives and five poems from Reflections; the Class XI portion is in
  isc-11-modern-english-literature. The ISC 2027 specimen paper has Section A (20 marks: ten 1-mark multiple-choice
  questions and five 2-mark short answers of 40-50 words across all three texts) and Section B (60 marks: one 20-mark
  question each on Drama, Prose and Poetry, each with two 5-mark answers of 80-100 words and a 10-mark answer of
  150-200 words with internal choice). Project work (20 marks, Class XII): one written assignment of 1000-1500 words
  titled as a question (introduction, main body with sub-headings, conclusion) on a text not used in the Class XI project;
  10 marks teacher, 10 marks Visiting Examiner; no question paper is set. No section-wise marks are published in the
  syllabus, so units carry no marks. SOYL splits the drama into one chapter per act and gives each prescribed story and
  poem its own topic.
units:
  - { name: "I. Drama", marks: null }
  - { name: "II. Prose (Short Stories)", marks: null }
  - { name: "III. Poetry", marks: null }
chapters:
  - id: isc-12-modern-english-literature-ch01
    number: 1
    title: "Pygmalion: Act III"
    unit: "I. Drama"
    topics:
      - id: isc-12-modern-english-literature-ch01-t01
        title: "Shaw, the Pygmalion myth and the situation at the start of Act III"
        learning_outcomes:
          - "Explain the classical myth behind the play's title and how Shaw adapts it"
          - "Recall the bet between Higgins and Pickering and Eliza's progress up to this point"
      - id: isc-12-modern-english-literature-ch01-t02
        title: "Eliza at Mrs Higgins's 'at home': correct pronunciation but unguarded conversation"
        learning_outcomes:
          - "Describe Eliza's behaviour and conversation with the Eynsford Hill family and assess how far her training has progressed"
          - "Explain the comedy created by the contrast between her refined accent and the content of her talk"
      - id: isc-12-modern-english-literature-ch01-t03
        title: "Freddy and Clara: the effect of Eliza on the Eynsford Hills"
        learning_outcomes:
          - "Explain Freddy's infatuation and Clara's imitation of Eliza's 'new small talk' as social satire"
      - id: isc-12-modern-english-literature-ch01-t04
        title: "Mrs Higgins's warning: the problem of what is to be done with Eliza afterwards"
        learning_outcomes:
          - "Analyse Mrs Higgins's concerns and what they reveal about Higgins's and Pickering's thoughtlessness"
          - "Compare Higgins's manners with Pickering's courtesy in this act"
    removed_topics:
      - "Acts I and II (Class XI portion; see isc-11-modern-english-literature)"
    literature_texts:
      - { title: "Pygmalion (Act III)", author: "George Bernard Shaw" }
  - id: isc-12-modern-english-literature-ch02
    number: 2
    title: "Pygmalion: Act IV"
    unit: "I. Drama"
    topics:
      - id: isc-12-modern-english-literature-ch02-t01
        title: "Return from the ambassador's party: Higgins and Pickering celebrate, Eliza is ignored"
        learning_outcomes:
          - "Describe how the two men discuss the evening and why their words hurt Eliza"
      - id: isc-12-modern-english-literature-ch02-t02
        title: "The confrontation: the slippers, Eliza's anger and her question about her future"
        learning_outcomes:
          - "Explain why Eliza throws the slippers at Higgins and what her outburst reveals"
          - "Analyse Eliza's fear about what will become of her now that the experiment is over"
      - id: isc-12-modern-english-literature-ch02-t03
        title: "The returned ring, the quarrel and Freddy waiting outside"
        learning_outcomes:
          - "Explain the significance of Eliza returning the ring and of Higgins's loss of temper"
          - "Discuss how the act shifts the play from comedy towards a questioning of class and gender"
    removed_topics: []
    literature_texts:
      - { title: "Pygmalion (Act IV)", author: "George Bernard Shaw" }
  - id: isc-12-modern-english-literature-ch03
    number: 3
    title: "Pygmalion: Act V"
    unit: "I. Drama"
    topics:
      - id: isc-12-modern-english-literature-ch03-t01
        title: "Doolittle's transformation: an unexpected fortune and 'middle class morality'"
        learning_outcomes:
          - "Explain how Doolittle's sudden wealth has changed his life and why he blames Higgins"
          - "Discuss Shaw's satire of middle-class respectability through Doolittle"
      - id: isc-12-modern-english-literature-ch03-t02
        title: "Eliza's account of her education: the importance of how one is treated"
        learning_outcomes:
          - "Analyse Eliza's claim that Pickering's courtesy taught her more than Higgins's lessons"
          - "Explain the difference between the manners of Higgins and Pickering as Eliza describes it"
      - id: isc-12-modern-english-literature-ch03-t03
        title: "The final confrontation between Eliza and Higgins: independence and equality"
        learning_outcomes:
          - "Trace how Eliza asserts her independence and gains Higgins's grudging respect"
          - "Evaluate the open ending and Shaw's later prose sequel explaining why Eliza marries Freddy"
      - id: isc-12-modern-english-literature-ch03-t04
        title: "The play as a whole: class, language, identity and the 'creator' and his creation"
        learning_outcomes:
          - "Discuss Shaw's views on class and speech as markers of social identity"
          - "Evaluate the characters of Higgins, Eliza and Pickering across the play"
    removed_topics: []
    literature_texts:
      - { title: "Pygmalion (Act V)", author: "George Bernard Shaw" }
  - id: isc-12-modern-english-literature-ch04
    number: 4
    title: "Perspectives: Short Stories (Class XII portion)"
    unit: "II. Prose (Short Stories)"
    topics:
      - id: isc-12-modern-english-literature-ch04-t01
        title: "The Doll's House (Katherine Mansfield): class prejudice seen through children"
        learning_outcomes:
          - "Describe the doll's house and the feelings it arouses in the Burnell children"
          - "Analyse how the treatment of the Kelvey sisters exposes adult snobbery and Kezia's kindness"
          - "Explain the symbolic importance of the little lamp"
      - id: isc-12-modern-english-literature-ch04-t02
        title: "Death by Scrabble (Charlie Fish): a game that seems to shape reality"
        learning_outcomes:
          - "Examine what the game reveals about the resentful relationship between husband and wife"
          - "Trace how the words played appear to come true and explain the effect of the twist ending"
      - id: isc-12-modern-english-literature-ch04-t03
        title: "The Dreamer (Saki): a dreamy nephew, a day at the sales and a comic mix-up"
        learning_outcomes:
          - "Describe Cyprian's appearance and manner and what they suggest about him"
          - "Explain how Saki's irony mocks the aunt's fondness for bargain sales"
      - id: isc-12-modern-english-literature-ch04-t04
        title: "Games at Twilight (Anita Desai): Ravi's hide-and-seek and the hurt of being forgotten"
        learning_outcomes:
          - "Describe Ravi's thoughts, fears and fantasies while hiding in the shed"
          - "Analyse the ending and what it reveals about a child's need for recognition"
      - id: isc-12-modern-english-literature-ch04-t05
        title: "The Father-thing (Philip K. Dick): a boy discovers his father has been replaced"
        learning_outcomes:
          - "Summarise how Charles realises that the man at home is not his father and how he fights back"
          - "Discuss the story's use of science fiction to explore childhood fear and the familiar becoming strange"
    removed_topics:
      - "Class XI stories of Perspectives: Lawley Road, The Landlady, Most Beautiful, Dream-Children: A Reverie, Ratan Tata: A Life - Settling in at Cornell (see isc-11-modern-english-literature)"
    literature_texts:
