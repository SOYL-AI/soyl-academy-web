      - { title: "The Dreamer", author: "Saki" }
      - { title: "Games at Twilight", author: "Anita Desai" }
      - { title: "The Father-thing", author: "Philip K. Dick" }
  - id: isc-12-modern-english-literature-ch05
    number: 5
    title: "Reflections: Poems (Class XII portion)"
    unit: "III. Poetry"
    topics:
      - id: isc-12-modern-english-literature-ch05-t01
        title: "My Grandmother's House (Kamala Das): memory, love and loss"
        learning_outcomes:
          - "Describe the speaker's memories of the house and what happened to it after the grandmother's death"
          - "Analyse the contrast between the warmth of the past and the speaker's present emptiness"
      - id: isc-12-modern-english-literature-ch05-t02
        title: "Refugee Blues (W.H. Auden): the plight of Jewish refugees in 1939"
        learning_outcomes:
          - "Explain how the poem presents loss of home, identity and dignity and the indifference of others"
          - "Analyse the blues form, the refrain and the contrasts the speaker draws"
      - id: isc-12-modern-english-literature-ch05-t03
        title: "Urban (Nissim Ezekiel): the confined city mind and the longing for nature"
        learning_outcomes:
          - "Explain how the poem creates a sense of claustrophobia in the city"
          - "Describe what the speaker longs for and why it remains out of reach"
      - id: isc-12-modern-english-literature-ch05-t04
        title: "Ode to Tomatoes (Pablo Neruda): celebrating the everyday"
        learning_outcomes:
          - "Describe how the tomatoes are said to take over the kitchen and the effect of this image"
          - "Identify features of the ode and the use of personification and hyperbole"
      - id: isc-12-modern-english-literature-ch05-t05
        title: "The Black Santa (Allison Joseph): race, representation and a familiar tradition"
        learning_outcomes:
          - "Explain how the poem overturns the traditional image of Santa Claus"
          - "Discuss the themes of identity, representation and belonging in the poem"
