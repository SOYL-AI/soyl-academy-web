        title: "Concept of IQ: mental age, chronological age and the IQ formula"
        learning_outcomes:
          - "Define mental age, chronological age and intelligence quotient and write the IQ formula"
      - id: isc-12-psychology-ch02-t02
        title: "Individual test: Wechsler Adult Intelligence Scale-III (verbal and performance tests, administration, scoring)"
        learning_outcomes:
          - "Describe the aim and structure of WAIS-III with its six verbal and five performance tests"
          - "Explain how Full Scale, Verbal Scale and Performance Scale IQ are obtained"
      - id: isc-12-psychology-ch02-t03
        title: "Group test: Raven's Progressive Matrices (Standard, Coloured and Advanced)"
        learning_outcomes:
          - "Describe the aim, format and administration of Raven's Progressive Matrices"
          - "Distinguish the Standard, Coloured and Advanced versions by the groups they are meant for"
      - id: isc-12-psychology-ch02-t04
        title: "Levels of intelligence from gifted to profound intellectual disability, with IQ ranges and characteristics"
        learning_outcomes:
          - "Give the IQ range of each level of intelligence"
          - "Describe characteristics of the mild, moderate, severe and profound levels and the positive and negative traits of gifted persons"
      - id: isc-12-psychology-ch02-t05
        title: "Emotional intelligence and emotional quotient (EQ)"
        learning_outcomes:
          - "Define emotional intelligence and EQ"
          - "Describe five characteristics of emotionally intelligent persons"
      - id: isc-12-psychology-ch02-t06
        title: "Aptitude, achievement and interest: meaning and assessment; the General Aptitude Test Battery"
        learning_outcomes:
          - "Distinguish aptitude, achievement and interest and give a reason for assessing each"
          - "Name the nine tests of the GATB and state when aptitude needs to be assessed"
    removed_topics:
      - "IQ calculations are not required (definitions and the formula only)"
    literature_texts: []
