# ISC Class 12 Psychology (855) - ISC 2027 examination, CLASS XII portion only.
# Source: platform/catalog/sources/cisce.md#isc-2027-psychology. Topic wording is our own summary of the official scope.
subject_id: isc-12-psychology
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-psychology, isc-2027-regulations, isc-2027-specimen-papers]
exam_notes: >-
  Paper I Theory: 3 hours, 70 marks, on the eight Class XII topics below.
  Paper II Project Work: 30 marks, assessed by the teacher and a Visiting Examiner appointed locally and approved by CISCE;
  no question paper is set by CISCE. Candidates complete two studies chosen from (A) Statistics - group differences in
  examination results using mean, standard deviation, z scores and the normal curve, with a bar diagram;
  (B) Attitudes - inter-group differences on a self-made 5-point scale plus a short structured interview;
  (C) Stress - causes and effects of stress among school students using two checklists. Each study (15 marks) is
  reported as aim, basic concept, method (sample, procedure, statistical treatment), results and discussion, conclusion;
  marks per study: basic concept 3, method 4, results and discussion 4, viva 4.
  CISCE lists topics with scope notes, not textbook chapters: SOYL groups them into 14 teachable chapters in syllabus order.
  No unit-wise marks weightage is published for ISC Psychology.
units:
  - { name: "1. Intelligence and Ability", marks: null }
  - { name: "2. Personality", marks: null }
  - { name: "3. Lifespan Development", marks: null }
  - { name: "4. Stress and Stress Management", marks: null }
  - { name: "5. Psychological Disorders and Psychotherapy", marks: null }
  - { name: "6. Social Thought and Social Behaviour", marks: null }
  - { name: "7. Attitudes", marks: null }
  - { name: "8. Psychology in relation to the Environment and Social Concerns", marks: null }
chapters:
  - id: isc-12-psychology-ch01
    number: 1
    title: "Theories of Intelligence"
    unit: "1. Intelligence and Ability"
    topics:
      - id: isc-12-psychology-ch01-t01
        title: "Meaning of intelligence; David Wechsler's definition"
        learning_outcomes:
          - "State Wechsler's definition of intelligence and explain its key terms"
      - id: isc-12-psychology-ch01-t02
        title: "Spearman's two-factor theory (g and s) and Thurstone's seven primary mental abilities"
        learning_outcomes:
          - "Describe the characteristics of the g and s factors"
          - "List Thurstone's seven primary mental abilities"
          - "State one criticism each of Spearman's and Thurstone's theories"
      - id: isc-12-psychology-ch01-t03
        title: "Cattell's fluid and crystallised intelligence; Guilford's Structure of Intellect model"
        learning_outcomes:
          - "Distinguish fluid from crystallised intelligence with examples"
          - "Explain how Guilford's six operations, six products and five contents give 180 factors, and state one criticism"
      - id: isc-12-psychology-ch01-t04
        title: "Sternberg's triarchic theory: analytical, experiential and contextual intelligence and their sub-theories"
        learning_outcomes:
          - "Explain the three parts of the triarchic theory and name the sub-theories of each"
      - id: isc-12-psychology-ch01-t05
        title: "Gardner's theory of multiple intelligences"
        learning_outcomes:
          - "Name and illustrate the eight intelligences proposed by Gardner"
          - "State one criticism of the theory of multiple intelligences"
    removed_topics: []
    literature_texts: []
  - id: isc-12-psychology-ch02
