# ISC Class 12 Geography (853) - ISC 2027 examination, CLASS XII portion only (theory paper).
# Source: platform/catalog/sources/cisce.md#isc-2027-geography. Topic wording is our own summary of the official scope.
subject_id: isc-12-geography
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-geography, isc-2027-regulations, isc-2027-specimen-papers]
exam_notes: >-
  Two papers: Paper I Theory of 3 hours, 70 marks ("India in the World's Context"), and Paper II Practical Work and
  Project Work, 30 marks. Paper I includes a question on map work (identify, locate and label items from the official
  map list for topics 1-6) and candidates must draw and interpret sketch maps of India's locational setting, relief,
  climate, population, industries and transport; these are covered here as theory chapters. No topic-wise marks
  weightage is published. Paper II is assessed by the teacher and a Visiting Examiner with no CISCE question paper:
  practical file (sessional record) 10, project report 10, viva voce 10. Practical work is any two of: drawing scales
  (linear, graphic, representative fraction); cross-sections/profiles of contour features using vertical exaggeration;
  location references of Survey of India maps; reading and interpreting two Survey of India topographical sheets;
  elements of visual interpretation of remote sensing images (GIS); and plane-table or GPS survey plans of a small area.
  The project is one local field survey (agricultural land use, household survey of 30-60 households, amenity study,
  a manufacturing unit or self-employed person, or a multipurpose river valley project). Practical and project work
  are not built as chapters. CISCE lists topics, not textbook chapters: SOYL groups them into 27 teachable chapters in
  syllabus order. Census-based figures should use the latest census as the syllabus directs. The Class XI portion is
  in isc-11-geography.
