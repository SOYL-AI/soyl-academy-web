# ISC Class 12 Applied Mathematics (885), Paper I Theory - ISC 2027 examination (Class XII portion only).
# Source: platform/catalog/sources/cisce.md#isc-2027-applied-mathematics. Topic wording is our own summary of the official scope.
subject_id: isc-12-applied-mathematics
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-applied-mathematics, isc-2027-regulations, isc-2027-specimen-papers, cisce-circular-specimen-papers-2027]
exam_notes: >-
  Paper I Theory: 3 hours, 80 marks. Paper II Project Work: 20 marks - two projects, each marked out of 10 (overall
  format 1, content 4, findings 2, viva-voce 3), assessed by the subject teacher and a locally appointed Visiting
  Examiner; CISCE sets no question paper. Suggested projects include graphing one-one, onto and inverse functions,
  inverse trigonometric graphs as mirror images about y = x, consistency of linear systems shown graphically, and
  illustrating increasing and decreasing functions, points of inflexion and local maxima and minima. SOYL covers
  Paper I only. Applied Mathematics is meant for Humanities, Commerce, Economics and Bioscience students and may not
  be combined with Mathematics (ISC regulations).
  The ISC 2027 specimen paper (3 hours plus 15 minutes reading time) has 20 compulsory questions in four sections:
  A - twenty 1-mark subparts including MCQs (20), B - seven 2-mark questions (14), C - seven 3-mark questions (21),
  D - five 5-mark questions (25), with internal choice in three questions each of B, C and D; mathematical tables and
  graph paper are provided, many questions use business and everyday Indian contexts, and the published unit
  weightage is strictly followed. The October 2026 circular sets about 50% of marks on higher-order skills (apply,
  analyse, evaluate, create). CISCE lists topics under seven weighted units, not textbook chapters: SOYL groups them
  into 15 teachable chapters in syllabus order.
units:
  - { name: "Unit 1: Relations and Functions", marks: 6 }
  - { name: "Unit 2: Algebra", marks: 10 }
  - { name: "Unit 3: Calculus", marks: 25 }
  - { name: "Unit 4: Probability", marks: 14 }
  - { name: "Unit 5: Linear Programming", marks: 5 }
  - { name: "Unit 6: Financial Mathematics", marks: 14 }
  - { name: "Unit 7: Index Numbers and Moving Averages", marks: 6 }
