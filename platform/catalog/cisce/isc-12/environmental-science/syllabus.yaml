# ISC Class 12 Environmental Science (877), Paper I Theory - ISC 2027 examination (Class XII portion only).
# Source: platform/catalog/sources/cisce.md#isc-2027-environmental-science. Topic wording is our own summary of the official scope.
subject_id: isc-12-environmental-science
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-environmental-science, isc-2027-regulations]
exam_notes: >-
  Paper I Theory: 3 hours, 70 marks, with the syllabus in three sections - Section A (human beings and nature,
  population and conservation ecology, monitoring pollution), Section B (third world development, sustainable
  agriculture) and Section C (environmental and natural resource economics, international relations and the
  environment). Paper II Practical/Project Work: 30 marks, done under the teacher's guidance and evaluated by a
  locally appointed Visiting Examiner with relevant expertise; CISCE sets no question paper. The project takes one of
  five forms: a solution proposal for a local environmental problem using primary and secondary data, an environmental
  impact assessment, monitoring an aspect of the local environment for at least six months, at least one month of
  field work or training with an environmental organisation, or a quadrat study of plant density and population.
  SOYL covers Paper I only. No section-wise marks weightage is published, and no ISC 2027 specimen paper is listed for
  this subject. CISCE lists topics under seven numbered themes with scope notes, not textbook chapters: SOYL groups
  them into 18 teachable chapters in syllabus order.
