          - "Hatch adjacent parts of an assembly in different directions or spacings"
      - id: isc-12-geometrical-mechanical-drawing-ch01-t04
        title: "Conventions in sectioning: parts not sectioned along their axis (shafts, bolts, nuts, keys, pins, ribs, webs)"
