# ISC Class 12 Geometrical and Mechanical Drawing (869) - ISC 2027 examination (Class XII portion only).
# Source: platform/catalog/sources/cisce.md#isc-2027-geometrical-mechanical-drawing. Topic wording is our own summary.
# Drawing-based subject: chapters teach the machine-drawing conventions, standard proportions and construction
# details that working and assembly drawings need; students practise the drawings with instruments on A2 sheets.
subject_id: isc-12-geometrical-mechanical-drawing
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-geometrical-mechanical-drawing, isc-2027-regulations]
exam_notes: >-
  Paper I Theory (Drawing - Engineering): 3 hours, 80 marks; candidates answer all questions, preparing working
  drawings and assemblies from dimensioned sketches. Drawing board, tee-square and set-squares are required (a
  parallel-motion board or drafting machine is permitted); A2 paper is used; IS:696-1972 (Code of Practice for
  General Engineering Drawing) is followed, and candidates must know both First and Third Angle projection.
  Paper II Project Work, 20 marks, assessed by the subject teacher and a locally appointed Visiting Examiner: three
  A2 project sheets (at least one from Section A Orthographic Projections - front, top and side views in First or
  Third Angle - and one from Section B Assembly Drawings - full sectional front view and top view of given machine
  parts, omitting hidden lines), each 5 marks for size/completeness, line quality, neatness, accuracy and title
  block (teacher and Visiting Examiner marks averaged, 15), plus a 5-mark viva-voce by the Visiting Examiner on the
  sheets. The drawing sheets themselves are practical work and are not taught as chapters here.
  The subject may not be taken with Geometrical and Building Drawing. Class XI plane and solid geometry (scales,
  engineering curves, projections, sections and developments, isometric and oblique projection) is in
  isc-11-geometrical-mechanical-drawing and is assumed background. CISCE lists items (a) to (h), not chapters: SOYL
  opens with drawing-practice chapters and then groups the items into teachable chapters in syllabus order. No
  item-wise marks weightage is published.
