          - "Lay out an A2 sheet with border, title block and parts list in standard positions"
          - "Choose the correct line type for visible edges, hidden edges, centre lines, section lines and dimension lines"
      - id: isc-12-geometrical-mechanical-drawing-ch01-t02
        title: "First Angle and Third Angle projection: arrangement of views and the projection symbol"
        learning_outcomes:
          - "Arrange the front view, top view and side views correctly in First Angle and in Third Angle projection"
          - "Identify the method of projection of a given drawing from its symbol or view arrangement"
      - id: isc-12-geometrical-mechanical-drawing-ch01-t03
        title: "Sectional views: full and half sections, cutting-plane lines, hatching and hatching of adjacent parts"
        learning_outcomes:
