# ISC Class 12 Political Science (852) - ISC 2027 examination, CLASS XII portion only.
# Source: platform/catalog/sources/cisce.md#isc-2027-political-science. Topic wording is our own summary of the official scope.
subject_id: isc-12-political-science
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-political-science, isc-2027-regulations, isc-2027-specimen-papers]
exam_notes: >-
  Two papers: Paper I Theory of 3 hours, 80 marks, and Paper II Project Work, 20 marks. The theory syllabus has
  Section A Constitution and Government (forms of government, constitutions, franchise and representation, and the
  legislature, executive and judiciary compared for India, the USA and the UK) and Section B Indian Democracy
  (Indian Constitution, Fundamental Rights and Directive Principles, local self-government, challenges to democracy);
  no section-wise or topic-wise marks are published. Paper II is one project (case study, survey, research project,
  contemporary issue or review) of up to 2000 words that must go beyond the syllabus; 10 marks from the teacher
  (process 3, understanding and analysis 4, presentation 3) and 10 from a Visiting Examiner (technique and
  presentation 4, analysis and evaluation 3, viva 3). CISCE lists ten topics, not textbook chapters: SOYL keeps them in
  syllabus order and splits Fundamental Rights and Directive Principles into two chapters (11 chapters).
  The Class XI portion is in isc-11-political-science.
units:
  - { name: "Section A: Constitution and Government", marks: null }
  - { name: "Section B: Indian Democracy", marks: null }
