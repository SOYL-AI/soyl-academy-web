# ISC Class 12 Sanskrit (Classical Language elective, code 838) - ISC 2027 examination.
# Prescribed books: titles and authors only. Students read the texts in their own editions.
subject_id: isc-12-sanskrit-classical
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-classical-languages, isc-2027-prescribed-books, isc-2027-regulations]
exam_notes: >-
  Paper I Theory: one paper of 3 hours, 80 marks, containing: (a) questions on grammar; (b) unseen translation from English into
  Sanskrit of short prose sentences and a continuous prose passage; (c) translation from the prescribed books, with no choice of
  passages; (d) short-answer questions on the subject matter of the prescribed books. CISCE does not publish marks per part.
  Prescribed books (Appendix I): Chandrapid Katha by Pandit V. Anantacharya (Ram Narayana Lal Beni Madhava, Allahabad) - a prose
  retelling of the story of Chandrapida from Banabhatta's Kadambari; and Raghuvamsa of Kalidasa, Canto I (text with English
  translation and notes by M.R. Kale, Motilal Banarsidass). Paper II Project Work (20 marks): Listening (5) and Speaking (5) assessed
  by the subject teacher - an unseen passage or poem read aloud twice with objective questions, and a three-minute presentation (which
  may include reading out a corrected version of a grammatically incorrect passage of 150-200 words); Writing (10) assessed by a
  Visiting Examiner - one assignment of about 250 words on a text studied. CISCE sets no question paper for project work. CISCE has not
  bifurcated this syllabus: the ISC 2027 paper is set on the entire Classes XI-XII syllabus, so nothing is removed for Class XI.
  CISCE does not list the grammar items for this paper; SOYL's grammar chapters (sandhi, declensions, verb forms including the lit
  forms common in Raghuvamsa, karaka and voice, compounds and suffixes) are SOYL's breakdown, not CISCE's. CISCE lists topics not
  chapters; SOYL grouped them into teachable chapters in syllabus order.
