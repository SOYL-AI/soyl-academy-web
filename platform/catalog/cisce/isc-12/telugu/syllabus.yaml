# ISC Class 12 Telugu (Indian Language elective, code 815) - ISC 2027 examination.
# Literature: titles and authors only (CONTEXT section 8). Students read the texts in their own textbook.
subject_id: isc-12-telugu
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-indian-languages, isc-2027-prescribed-books, cisce-circular-2026-27-33-indian-languages, isc-2027-regulations]
exam_notes: >-
  Paper I Theory: one paper of 3 hours, 80 marks, in two sections. Section A Language (40 marks, three compulsory
  questions): a composition of about 400 words in Telugu from a choice of six topics; an unseen passage of about 300
  words with questions and/or a summary with a heading (testing the ability to summarise and/or expand an idea); and
  functional grammar (correction of sentences and use of words/idioms in sentences, with correct agreement of number,
  gender, case, tense and voice). Section B Prescribed Textbooks (40 marks): answer four questions from any three of
  the prescribed books. Prescribed texts are bifurcated (Circular 2026-27/33): the ISC 2027 paper is set only on the
  Class XII portion listed here; the Class XI portion (isc-11-telugu) is listed under each chapter's removed_topics.
  Paper II Project Work (20 marks): Listening (5) and Speaking (5) assessed by the teacher; Writing (10) assessed by a
  Visiting Examiner - one assignment of 1000-1500 words on a literature text not used in the Class XI project. CISCE
  lists topics, not chapters: SOYL grouped them into teachable chapters in syllabus order. CISCE does not publish
  question-wise marks within Section A and describes composition and grammar only generically: the composition types
  and grammar breakdown below are SOYL's, adapted to the grammar of the language. SOYL covers all four prescribed
  books so a student can pick any three. Titles are in English / CISCE transliteration; native-script titles to be
  added in language review.
units:
  - { name: "Section A: Language", marks: 40 }
  - { name: "Section B: Prescribed Textbooks", marks: 40 }
chapters:
  - id: isc-12-telugu-ch01
    number: 1
    title: "Composition writing (about 400 words)"
    unit: "Section A: Language"
    topics:
      - id: isc-12-telugu-ch01-t01
        title: "Planning a composition: choosing a topic, outline, introduction, body and conclusion"
        learning_outcomes:
          - "Choose a suitable topic from a choice of six and prepare an outline before writing"
          - "Write a well-organised composition of about 400 words in Telugu, divided into paragraphs"
      - id: isc-12-telugu-ch01-t02
        title: "Descriptive and narrative compositions"
        learning_outcomes:
          - "Describe an experience, journey, place or event in Telugu vividly and in a logical sequence"
      - id: isc-12-telugu-ch01-t03
        title: "Reflective and argumentative compositions: for and against, and conclusion"
        learning_outcomes:
          - "Present a point of view on a social or current issue in Telugu, supported by reasons and examples"
          - "Weigh opposing arguments fairly and write a balanced conclusion"
      - id: isc-12-telugu-ch01-t04
        title: "Story writing from a given sentence, proverb or outline"
        learning_outcomes:
          - "Write an original story in Telugu that develops a given opening line, proverb or outline to a meaningful end"
      - id: isc-12-telugu-ch01-t05
        title: "Language and style: word choice, idioms, spelling and punctuation"
        learning_outcomes:
          - "Use vocabulary and idiomatic expressions suited to the topic"
          - "Proofread a composition and correct its errors of spelling and punctuation in Telugu"
    removed_topics: []
    literature_texts: []
  - id: isc-12-telugu-ch02
    number: 2
    title: "Comprehension: unseen passage (about 300 words) and summary"
    unit: "Section A: Language"
    topics:
      - id: isc-12-telugu-ch02-t01
        title: "Identifying the main idea and supporting points of a passage"
        learning_outcomes:
          - "State the central idea of an unseen Telugu passage of about 300 words in your own words"
      - id: isc-12-telugu-ch02-t02
        title: "Answering questions on the passage in your own words"
        learning_outcomes:
          - "Answer factual and inferential questions accurately without copying lines from the passage"
          - "Explain the meaning of difficult words and phrases from their context"
      - id: isc-12-telugu-ch02-t03
        title: "Writing a summary with a heading"
        learning_outcomes:
          - "Write a summary of the passage in about one-third of its length and give it a suitable heading"
      - id: isc-12-telugu-ch02-t04
        title: "Expanding an idea given in the passage"
        learning_outcomes:
          - "Expand a statement or idea from the passage into a paragraph with examples"
    removed_topics: []
    literature_texts: []
