# ISC Class 12 Engineering Science (867), Paper I Theory - ISC 2027 examination (Class XII portion only).
# Source: platform/catalog/sources/cisce.md#isc-2027-engineering-science. Topic wording is our own summary of the official scope.
subject_id: isc-12-engineering-science
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-engineering-science, isc-2027-regulations]
exam_notes: >-
  Paper I Theory: 3 hours, 80 marks. All questions are set in SI units (abbreviations as in the BIS guide to SI
  units), and examiners look for evidence that principles have been studied practically. Engineering Science may not
  be taken with Physics. Paper II Project Work: 20 marks - two projects on any theory topics, each marked out of 10
  (title and introduction 1, content 3, presentation and originality 2, conclusion 1, viva-voce 3); the teacher and a
  locally appointed Visiting Examiner each mark the written part out of 7 and the average is taken, and the viva is
  conducted only by the Visiting Examiner. CISCE sets no question paper for projects. Suggested projects include energy
  of a simple pendulum, work by constant and varying forces, stress-strain curves, friction of household surfaces,
  identifying simple machines at home, analysing a year of electricity bills, a local transformer and power
  distribution, and assembling a household circuit with bulbs, switches and a fuse. SOYL covers Paper I only.
  No topic-wise marks weightage is published, and no ISC 2027 specimen paper is listed for this subject.
  CISCE lists 13 numbered topics, not textbook chapters: SOYL groups them into 12 teachable chapters in syllabus order
  (topics 2 and 3 on friction form one chapter).
