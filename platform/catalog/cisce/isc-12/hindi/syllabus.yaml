# ISC Class 12 Hindi (Indian Language elective, code 805) - ISC 2027 examination.
# Literature: titles and authors only (CONTEXT section 8). Students read the texts in their own textbook.
subject_id: isc-12-hindi
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-indian-languages, isc-2027-prescribed-books, cisce-circular-2026-27-33-indian-languages, isc-2027-regulations]
exam_notes: >-
  Paper I Theory: one paper of 3 hours, 80 marks, in two sections. Section A Language (40 marks, three compulsory
  questions): a composition of about 400 words from a choice of six topics; an unseen passage of about 300 words with
  questions and/or a summary with a heading (testing the ability to summarise and/or expand an idea); and functional grammar
  (correction of sentences and use of words/idioms in sentences, with correct agreement of number, gender, case, tense and voice).
  Section B Prescribed Textbooks (40 marks): answer four questions from any three of the four prescribed books.
  Prescribed texts are bifurcated (Circular 2026-27/33): the ISC 2027 paper is set only on the Class XII portion listed
  here (Class XI portion is in isc-11-hindi). Recommended for background work: Vyakaran Manjusha (I.U.P.).
  Paper II Project Work (20 marks): Listening (5) and Speaking (5) assessed by the teacher; Writing (10) assessed by a
  Visiting Examiner - one assignment of 1000-1500 words on a literature text not used in the Class XI project.
  CISCE does not publish question-wise marks within Section A, and describes composition and grammar only generically:
  the composition types and grammar breakdown below are SOYL's, based on the item types commonly set in ISC Hindi papers.
  SOYL covers all four prescribed books so a student can pick any three.
units:
