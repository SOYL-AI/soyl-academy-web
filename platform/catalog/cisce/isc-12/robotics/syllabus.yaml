# ISC Class 12 Robotics (884), Paper I Theory - ISC 2027 examination (Class XII portion only).
# Source: platform/catalog/sources/cisce.md#isc-2027-robotics. Topic wording is our own summary of the official scope.
subject_id: isc-12-robotics
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-robotics, isc-2027-regulations, isc-2027-specimen-papers, cisce-circular-specimen-papers-2027]
exam_notes: >-
  Paper I Theory: 3 hours, 70 marks; key Class XI concepts are a prerequisite. Paper II Practical: 30 marks - a
  3-hour practical examination (15) in which the candidate attempts one of three problem statements, spending
  90 minutes on an algorithm or flowchart, circuit or block diagram and handwritten program and 90 minutes building,
  coding and executing it on the computer and hardware for the Visiting Examiner, plus the Practical File (15:
  internal evaluation 10, Visiting Examiner 5). About 25 assignments are done during the year (15 programming, 10
  hands-on case studies), for example building a simple robot from basic materials and sensors, simulating a robot in
  ROS and Gazebo, designing an agricultural robot, planning Industry 4.0 automation, proposing a space mission, and
  maze-navigation or obstacle-avoidance challenges. SOYL covers Paper I only. Robotics may not be combined with
  Artificial Intelligence (ISC regulations).
  The ISC 2027 specimen paper (3 hours plus 15 minutes reading time) has 12 compulsory questions in three sections:
  A - fourteen 1-mark subparts including MCQs (14), B - seven 4-mark short-answer questions (28), C - four 7-mark
  long-answer questions (28), with internal choice in three questions of B and two of C; many questions ask for the
  working principle, components and advantages of a named robot or for designing a robot for a scenario.
  The October 2026 circular sets about 50% of marks on higher-order skills (apply, analyse, evaluate, create).
  CISCE lists topics under five weighted units, not textbook chapters: SOYL groups them into 6 teachable chapters in
  syllabus order.
units:
  - { name: "Unit 1: Introduction", marks: 12 }
  - { name: "Unit 2: Robotics in Healthcare", marks: 16 }
