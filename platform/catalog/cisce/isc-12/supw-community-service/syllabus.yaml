# ISC Class 12 Socially Useful Productive Work and Community Service (SUPW) - ISC 2027 certificate requirement.
# Source: platform/catalog/sources/cisce.md#isc-2027-supw. Topic wording is our own summary; SUPW is mainly practical work.
subject_id: isc-12-supw-community-service
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-supw, isc-2027-regulations]
exam_notes: >-
  No written board paper. SUPW (work practice in a craft) and Community Service (work in the home, school and outside
  that benefits the community) are assessed internally by the school in each of Classes XI and XII, marked out of 100;
  each year the candidate takes one craft and one service, and may add topics from the optional Contemporary Studies
  component. SUPW is assessed on preparation 10, organisation 20, skills 40, research 20 and interest 10; community
  service on preparation 10, organisation 20, skills 40, resourcefulness 20 and interest 10, entered on a record card
  (and, for day scholars, a parent-kept diary of 20-30 minutes of daily home and neighbourhood service). Contemporary
  Studies is assessed by participation in class discussion. Heads of schools submit grades A (Very Good) to E
  (Unsatisfactory, fail) online through the CISCE CAREERS portal. About 150 hours a year (15% of working time) are
  recommended. The hands-on craft and service work itself is practical and is not listed as chapters. SOYL covers the
  planning knowledge in chapters 1-2 and the Class XII Contemporary Studies topics in chapters 3-6 (the Class XI list
  is in isc-11-supw-community-service). The document gives no weightage for Contemporary Studies.
units:
  - { name: "SUPW and Community Service: Work Practice", marks: null }
  - { name: "Contemporary Studies (optional, Class XII)", marks: null }
chapters:
