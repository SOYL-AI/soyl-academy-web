    title: "Planning SUPW and Community Service Programmes"
    unit: "SUPW and Community Service: Work Practice"
    topics:
      - id: isc-12-supw-community-service-ch01-t01
        title: "Objectives of SUPW: positive attitudes to work, community service, co-operation, scientific outlook and nation building"
        learning_outcomes:
