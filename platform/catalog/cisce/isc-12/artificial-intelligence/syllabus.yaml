# ISC Class 12 Artificial Intelligence (883), Paper I Theory - ISC 2027 examination (Class XII portion only).
# Source: platform/catalog/sources/cisce.md#isc-2027-artificial-intelligence. Topic wording is our own summary of the official scope.
subject_id: isc-12-artificial-intelligence
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-artificial-intelligence, isc-2027-regulations, isc-2027-specimen-papers, cisce-circular-specimen-papers-2027]
exam_notes: >-
  Paper I Theory: 3 hours, 70 marks; key Class XI concepts are a prerequisite. Paper II Practical: 30 marks -
  a 3-hour practical examination (15) in which the candidate attempts one of three problem statements, spending
  90 minutes writing an algorithm and handwritten program and 90 minutes coding and executing it (algorithm 3,
  documented Python program 7, printout 2, output 3), plus the Practical File (15: internal evaluation 10, Visiting
  Examiner 5). About 25 assignments are done during the year (15 programming, 10 hands-on case studies), for example
  tokenisation and NER with NLTK or spaCy, probability distributions and hypothesis tests, linear regression with
  NumPy, a neural network with forward and backward propagation, and an attendance system with OpenCV. Tools named
  are Python, NumPy, Pandas, Matplotlib, Scikit-learn, TensorFlow/Keras or PyTorch, OpenCV and NLTK/spaCy.
  SOYL covers Paper I only. AI may not be combined with Robotics (ISC regulations).
  The ISC 2027 specimen paper (3 hours plus 15 minutes reading time) has 12 compulsory questions in three sections:
  A - fourteen 1-mark subparts including MCQs (14), B - seven 4-mark short-answer questions (28), C - four 7-mark
  long-answer questions (28), with internal choice in three questions of B and two of C; many questions are
  scenario-based. The October 2026 circular sets about 50% of marks on higher-order skills (apply, analyse,
  evaluate, create). CISCE lists topics under five weighted units, not textbook chapters: SOYL groups them into
  7 teachable chapters in syllabus order.
units:
  - { name: "Unit 1: Applications of AI", marks: 10 }
  - { name: "Unit 2: Different Paradigms of AI - Neural Networks, Machine Learning, Deep Learning", marks: 15 }
  - { name: "Unit 3: Practical Implications of ANN", marks: 15 }
  - { name: "Unit 4: Practical Implications of Machine Learning", marks: 20 }
  - { name: "Unit 5: Introduction to Computer Vision", marks: 10 }
