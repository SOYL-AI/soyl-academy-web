# ISC Class 12 Literature in English (English 801, Paper 2: Prescribed Texts) - ISC 2027 examination.
# Literature: titles and authors only (CONTEXT section 8). Students read the texts in their own textbook.
subject_id: isc-12-literature-in-english
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-english, isc-2027-prescribed-books]
exam_notes: >-
  English (801) is compulsory; Literature in English is its second component, with a theory paper of 3 hours and 80 marks
  plus project work of 20 marks. Questions are set on Drama, Prose (short stories) and Poetry. Drama and prose questions are
  central to the text and test understanding, appreciation, analysis and synthesis in the candidate's own words; poetry
  questions on a poem or group of poems test content, personal response and appreciation of stylistic and literary features.
  The ISC 2027 (Class XII) paper is set ONLY on the Class XII portion listed here: Macbeth Acts III-V, five stories from
  Prism and five poems from Rhapsody (both Evergreen Publications); the Class XI portion is in isc-11-literature-in-english.
  Project work (20 marks): one written assignment of 1000-1500 words with a question as its title (introduction, main body
  with sub-headings, conclusion), on a text not used in the Class XI project; 10 marks teacher, 10 marks Visiting Examiner.
  No question-wise or section-wise marks are published, so units carry no marks. SOYL splits the drama into one chapter
  per act and gives each prescribed story and poem its own topic.
units:
  - { name: "I. Drama", marks: null }
  - { name: "II. Prose (Short Stories)", marks: null }
  - { name: "III. Poetry", marks: null }
chapters:
  - id: isc-12-literature-in-english-ch01
    number: 1
    title: "Macbeth: Act III"
    unit: "I. Drama"
    topics:
      - id: isc-12-literature-in-english-ch01-t01
        title: "Act III, scenes 1-2: Banquo's suspicions, the hiring of the murderers and Macbeth's growing isolation"
        learning_outcomes:
          - "Explain why Macbeth now sees Banquo and Fleance as a threat after the witches' prophecy"
          - "Compare Macbeth's and Lady Macbeth's states of mind in these scenes and how their relationship has changed"
      - id: isc-12-literature-in-english-ch01-t02
        title: "Act III, scene 3: the murder of Banquo and Fleance's escape"
        learning_outcomes:
          - "Explain the dramatic significance of Fleance's escape for the prophecy about Banquo's descendants"
      - id: isc-12-literature-in-english-ch01-t03
        title: "Act III, scene 4: the banquet and the appearance of Banquo's ghost"
        learning_outcomes:
          - "Analyse how the banquet scene reveals Macbeth's guilt and loss of control in public"
          - "Evaluate Lady Macbeth's attempts to cover for her husband before the lords"
      - id: isc-12-literature-in-english-ch01-t04
        title: "Act III, scenes 5-6: Hecate and the witches; Lennox's guarded suspicion and news of Macduff"
        learning_outcomes:
          - "Explain how irony in Lennox's conversation shows the nobles' growing distrust of Macbeth"
          - "Describe how the opposition to Macbeth begins to gather in England"
      - id: isc-12-literature-in-english-ch01-t05
        title: "Act III review: Macbeth as tyrant, the theme of fear and insecurity, and dramatic irony"
        learning_outcomes:
          - "Trace how Macbeth moves from reluctant murderer to tyrant acting alone"
          - "Identify examples of dramatic irony and imagery of darkness and blood in Act III"
    removed_topics:
      - "Acts I and II (Class XI portion; see isc-11-literature-in-english)"
    literature_texts:
      - { title: "Macbeth (Act III)", author: "William Shakespeare" }
  - id: isc-12-literature-in-english-ch02
    number: 2
    title: "Macbeth: Act IV"
    unit: "I. Drama"
    topics:
      - id: isc-12-literature-in-english-ch02-t01
        title: "Act IV, scene 1: the witches' apparitions and the show of kings"
        learning_outcomes:
          - "Explain each apparition's message and how Macbeth misreads it as a guarantee of safety"
          - "Discuss the role of equivocation and false security in Macbeth's downfall"
      - id: isc-12-literature-in-english-ch02-t02
        title: "Act IV, scene 2: the murder of Lady Macduff and her son"
        learning_outcomes:
          - "Analyse how this scene shows the senseless cruelty of Macbeth's rule"
          - "Describe the characters of Lady Macduff and her son from their conversation"
      - id: isc-12-literature-in-english-ch02-t03
        title: "Act IV, scene 3: Malcolm tests Macduff; the English king's healing touch; news of the massacre"
        learning_outcomes:
          - "Explain why Malcolm tests Macduff's loyalty and what the test reveals about both men"
          - "Contrast the qualities of a true king described in this scene with Macbeth's rule"
          - "Analyse Macduff's response to the news of his family's murder as a model of grief and resolve"
      - id: isc-12-literature-in-english-ch02-t04
        title: "Act IV review: kingship, loyalty and the turning of the tide against Macbeth"
        learning_outcomes:
          - "Summarise how the forces against Macbeth are assembled by the end of Act IV"
    removed_topics: []
    literature_texts:
      - { title: "Macbeth (Act IV)", author: "William Shakespeare" }
  - id: isc-12-literature-in-english-ch03
    number: 3
    title: "Macbeth: Act V"
    unit: "I. Drama"
    topics:
      - id: isc-12-literature-in-english-ch03-t01
        title: "Act V, scene 1: Lady Macbeth's sleepwalking"
        learning_outcomes:
          - "Explain how the sleepwalking scene reveals Lady Macbeth's guilt and mental collapse"
          - "Compare Lady Macbeth here with her earlier self in Act I"
      - id: isc-12-literature-in-english-ch03-t02
        title: "Act V, scenes 2-4: the rebels gather; Macbeth in Dunsinane; Birnam Wood moves"
        learning_outcomes:
          - "Describe how the Scottish lords and Malcolm's army close in on Macbeth"
          - "Explain how the camouflage with branches fulfils the apparition's prophecy"
      - id: isc-12-literature-in-english-ch03-t03
        title: "Act V, scene 5: the news of the queen's death and Macbeth's reflection on the meaninglessness of life"
        learning_outcomes:
          - "Analyse Macbeth's response to his wife's death and what it shows about his despair"
      - id: isc-12-literature-in-english-ch03-t04
        title: "Act V, scene 6 to the end: the final battle, Macduff's birth, Macbeth's death and Malcolm's accession"
        learning_outcomes:
          - "Explain how the last prophecy is fulfilled and how Macbeth faces his end"
          - "Discuss how Malcolm's closing speech restores order to Scotland"
      - id: isc-12-literature-in-english-ch03-t05
        title: "The play as a whole: ambition, fate and free will, appearance and reality, guilt; Macbeth as a tragic hero"
        learning_outcomes:
          - "Evaluate Macbeth as a tragic hero, identifying his flaw and the stages of his fall"
          - "Analyse major themes and recurring imagery (blood, sleep, darkness, clothing) across Acts III-V"
    removed_topics: []
    literature_texts:
      - { title: "Macbeth (Act V)", author: "William Shakespeare" }
  - id: isc-12-literature-in-english-ch04
    number: 4
    title: "Prism: Short Stories (Class XII portion)"
    unit: "II. Prose (Short Stories)"
    topics:
      - id: isc-12-literature-in-english-ch04-t01
        title: "Atithi / Guest (Rabindranath Tagore): the restless boy Tarapada and the pull of freedom"
        learning_outcomes:
          - "Summarise Tarapada's stay with Motilal Babu's family and his final departure"
          - "Analyse Tarapada's character and his bond with nature and the open road"
          - "Discuss Charu's changing feelings towards Tarapada and the irony of the ending"
      - id: isc-12-literature-in-english-ch04-t02
        title: "The Cookie Lady (Philip K. Dick): a boy, an old woman and the theft of youth"
        learning_outcomes:
          - "Outline the story's plot and explain how the supernatural element is gradually revealed"
          - "Discuss themes of loneliness, ageing and exploitation in the story"
      - id: isc-12-literature-in-english-ch04-t03
        title: "There Will Come Soft Rains (Ray Bradbury): an automated house after nuclear destruction"
        learning_outcomes:
          - "Explain how the house's routine highlights the absence of its human occupants"
          - "Analyse the story's message about technology, war and nature and the role of the poem recited in it"
      - id: isc-12-literature-in-english-ch04-t04
        title: "Indigo (Satyajit Ray): a night in a dak bungalow and an encounter with the colonial past"
        learning_outcomes:
          - "Narrate the main events of the narrator's experience and explain how suspense is built"
          - "Explain the historical background of indigo planting in Bengal that the story draws on"
      - id: isc-12-literature-in-english-ch04-t05
        title: "The Medicine Bag (Virginia Driving Hawk Sneve): heritage, identity and a great-grandfather's gift"
        learning_outcomes:
          - "Trace how Martin's embarrassment about his great-grandfather turns into pride and acceptance"
          - "Explain the significance of the medicine bag for Sioux tradition and family identity"
    removed_topics:
      - "Class XI stories of Prism: A Living God, Advice to Youth, The Paper Menagerie, The Great Automatic Grammatizator, Thank You, Ma'am (see isc-11-literature-in-english)"
    literature_texts:
      - { title: "Atithi / Guest", author: "Rabindranath Tagore" }
      - { title: "The Cookie Lady", author: "Philip K. Dick" }
      - { title: "There Will Come Soft Rains", author: "Ray Bradbury" }
      - { title: "Indigo", author: "Satyajit Ray" }
      - { title: "The Medicine Bag", author: "Virginia Driving Hawk Sneve" }
  - id: isc-12-literature-in-english-ch05
    number: 5
    title: "Rhapsody: Poems (Class XII portion)"
    unit: "III. Poetry"
    topics:
      - id: isc-12-literature-in-english-ch05-t01
        title: "Telephone Conversation (Wole Soyinka): racial prejudice exposed through satire"
        learning_outcomes:
          - "Explain the situation of the poem and how the conversation reveals the landlady's prejudice"
          - "Analyse the speaker's use of irony, humour and colour imagery"
      - id: isc-12-literature-in-english-ch05-t02
        title: "Tithonus (Alfred, Lord Tennyson): immortality without youth in a dramatic monologue"
        learning_outcomes:
          - "Summarise the myth behind the poem and the speaker's plea to the goddess of the dawn"
          - "Analyse the features of the dramatic monologue and the poem's contrast of mortality and immortality"
      - id: isc-12-literature-in-english-ch05-t03
        title: "Beethoven (Shane Koyczan): spoken-word tribute to creativity in the face of deafness"
        learning_outcomes:
          - "Explain how the poem presents Beethoven's struggle with hearing loss and his determination to compose"
          - "Identify features of spoken-word poetry such as repetition, direct address and rhythm"
      - id: isc-12-literature-in-english-ch05-t04
        title: "Small Towns and the River (Mamang Dai): life, death and the river in Arunachal Pradesh"
        learning_outcomes:
          - "Contrast the poem's images of small towns with those of the ever-flowing river"
          - "Explain the poem's view of death, ritual and continuity rooted in tribal belief"
      - id: isc-12-literature-in-english-ch05-t05
        title: "Death be not Proud (John Donne): a Holy Sonnet that defies death"
        learning_outcomes:
          - "Paraphrase the argument the speaker makes to diminish the power of death"
          - "Identify apostrophe, personification and paradox and explain the sonnet's structure"
    removed_topics:
      - "Class XI poems of Rhapsody: Abhisara: The Tryst, Why I Like the Hospital, Sonnet 116, Death of a Naturalist, Strange Meeting (see isc-11-literature-in-english)"
    literature_texts:
