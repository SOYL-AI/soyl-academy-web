exam_notes: >-
  Modern English (891) is the compulsory alternative to English (801) and may not be taken with it. It has two components,
  English Language and Literature in English, each with a theory paper of 80 marks and project work of 20 marks; this file
  is English Language (Literature is isc-12-modern-english-literature). Theory paper: 3 hours, 80 marks, all four questions
  compulsory. Question 1: one composition of 400-450 words chosen from six topics (narrative, descriptive, reflective,
  argumentative/persuasive, expository, original short story), marked for quality of language and organisation.
  Question 2: (a) directed writing of 250-300 words using all the given information and points (feature article, book
  review, blog, newspaper report, statement of purpose), testing amplifying, describing and re-stating, with format;
  (b) a proposal on a given situation in the CISCE format (introduction/heading, objectives, list of measures, concluding
  statement), also marked for linguistic ability. Question 3: compulsory short items on transformation of sentences,
  phrasal verbs and verbs/tenses (number and type vary each year). Question 4: a passage of about 700 words with questions
  on vocabulary, content, inference and analysis, and a summary of all or part of it within a word limit, written in
  grid form without abbreviations or contractions. Project work (20 marks, Class XII): Listening (5) and Speaking (5)
  assessed internally - an unseen passage of about 500 words read aloud twice with objective questions, and an individual
  presentation of about three minutes followed by discussion; Writing (10) assessed by a Visiting Examiner - a piece of
  about 500 words such as a brochure, product or process description, sporting-event description, autobiographical
  experience or television-serial review. No question paper is set for project work. The paper pattern is the same in
  Classes XI and XII. CISCE describes question types, not chapters: SOYL groups the skills into teachable chapters in the
  order of the paper. No question-wise marks are published in the syllabus, so units carry no marks.
