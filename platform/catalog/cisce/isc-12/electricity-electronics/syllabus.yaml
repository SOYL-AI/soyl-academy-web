# ISC Class 12 Electricity and Electronics (866), Paper I Theory - ISC 2027 examination (Class XII portion only).
# Source: platform/catalog/sources/cisce.md#isc-2027-electricity-electronics. Topic wording is our own summary of the official scope.
subject_id: isc-12-electricity-electronics
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-electricity-electronics, isc-2027-regulations]
exam_notes: >-
  Paper I Theory: 3 hours, 80 marks. Paper II Project Work: 20 marks - two projects on any theory topics, each
  marked out of 10 (title and introduction 1, content 3, presentation and originality 2, conclusion 1, viva-voce 3).
  The teacher and a locally appointed Visiting Examiner each mark the written part out of 7 and the average is
  taken; the viva is conducted only by the Visiting Examiner. CISCE sets no question paper for the project.
  Suggested projects include laboratory tools and meters, cable types, reading resistor and capacitor codes, switches
  and circuit protection, diode and Zener V-I characteristics, rectifiers, DC machines, microphones and loudspeakers,
  CRO, and working models such as a logic-gate traffic signal, FM receiver, water-level indicator or fire alarm.
  SOYL covers Paper I only. Simple numerical problems are set on DC machines, rectifiers, Zener regulators, triode
  parameters and transistor gains. No topic-wise marks weightage is published in the syllabus document, and no
  ISC 2027 specimen paper is listed for this subject. CISCE lists 14 numbered topics with scope notes, not textbook
  chapters: SOYL groups them into 15 teachable chapters in syllabus order (DC machines split into generator and motor).
