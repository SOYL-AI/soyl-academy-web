# ISC Class 12 Mathematics (860), Paper I Theory - ISC 2027 examination (Class XII portion only).
# Source: platform/catalog/sources/cisce.md#isc-2027-mathematics. Topic wording is our own summary of the official scope.
subject_id: isc-12-mathematics
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-mathematics, isc-2027-regulations, cisce-circular-specimen-papers-2027, isc-2027-specimen-papers]
exam_notes: >-
  Paper I Theory: 3 hours, 80 marks. Paper II Project Work: 20 marks - two projects of 10 marks each (format 1,
  content 4, findings 2, viva-voce 3), assessed by the subject teacher and a locally appointed Visiting Examiner;
  CISCE sets no question paper for project work. SOYL covers Paper I only. May not be taken with Applied Mathematics.
  The ISC 2027 syllabus publishes a single list of seven units for Class XII, all compulsory: there is no longer a
  Section A plus a choice between Section B and Section C as in older ISC papers, and Vectors, Three-dimensional Geometry
  and Linear Programming are now regular units. The ISC 2027 specimen paper (3 hours plus 15 minutes reading time) has
  20 compulsory questions in four sections: A - 1-mark questions including MCQs (20), B - 2-mark questions (14),
  C - 3-mark questions (21), D - 5-mark questions (25), with internal choice in three questions in each of Sections B, C and D;
  mathematical tables and graph paper are provided. The October 2026 circular sets about 50% of marks on higher-order
  skills (apply, analyse, evaluate, create).
  CISCE lists topics under seven units, not textbook chapters: SOYL groups them into 17 teachable chapters in syllabus order.
units:
  - { name: "Unit 1: Relations and Functions", marks: 10 }
  - { name: "Unit 2: Algebra", marks: 10 }
  - { name: "Unit 3: Calculus", marks: 35 }
  - { name: "Unit 4: Vector Algebra", marks: 5 }
  - { name: "Unit 5: Three-Dimensional Geometry", marks: 6 }
  - { name: "Unit 6: Linear Programming", marks: 5 }
  - { name: "Unit 7: Probability", marks: 9 }
