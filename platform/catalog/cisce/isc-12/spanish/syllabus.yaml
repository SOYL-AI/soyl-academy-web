    topics:
      - id: isc-12-spanish-ch06-t01
        title: "Building accurate sentences: articles, gender, agreement and word order"
        learning_outcomes:
          - "Translate English sentences into Spanish with correct articles, gender and agreement"
      - id: isc-12-spanish-ch06-t02
        title: "Choosing tense and mood: past tenses, subjunctive, conditional"
        learning_outcomes:
