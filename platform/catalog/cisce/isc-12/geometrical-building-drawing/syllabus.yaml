# ISC Class 12 Geometrical and Building Drawing (870) - ISC 2027 examination (Class XII portion only).
# Source: platform/catalog/sources/cisce.md#isc-2027-geometrical-building-drawing. Topic wording is our own summary.
# Drawing-based subject: chapters teach building construction details, drawing conventions and sketching knowledge;
# students practise the drawings with instruments and free-hand on A2 paper.
subject_id: isc-12-geometrical-building-drawing
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-geometrical-building-drawing, isc-2027-regulations]
exam_notes: >-
  Paper I Theory (Building Drawing): 3 hours, 80 marks; candidates answer all questions. The course is based on the
  form and construction of simple buildings and their parts - small single- and two-storey dwelling houses, garages,
  sheds and green houses - drawn in First or Third Angle orthographic projection with sectional views, plus simple
  working drawings from free-hand sketches and free-hand orthographic and pictorial sketches of building details and
  tools. Drawing board, tee-square and set-squares are required (parallel-motion board or drafting machine permitted);
  A2 paper is used (folded drawing paper is provided); IS:962-1972 (Code of Practice for Architectural and Building
  Drawings) is followed, and the use of models is encouraged.
  Paper II Project Work, 20 marks, assessed by the subject teacher and a locally appointed Visiting Examiner: two
  projects on topics covered in theory, each 10 marks (teacher and Visiting Examiner marks out of 7 averaged, plus a
  3-mark viva by the Visiting Examiner). Suggested projects: a scale study model (small residence, staircase, roof
  types), a market survey of building materials, a site or desktop study, ten free-hand sketches of buildings and
  details, two manual working drawings with line weights, a research study (contemporary, sustainable, traditional,
  Art Deco or Brutalist architecture) or a precedent study of an Indian architect. Criteria differ for theory-based,
  model-based and sketching-based projects. Project work is practical and is not taught as chapters here.
  The subject may not be taken with Geometrical and Mechanical Drawing. Class XI plane and solid geometry is in
  isc-11-geometrical-building-drawing and is assumed background. CISCE gives a short descriptive scope, not chapters:
  SOYL groups it into teachable chapters in syllabus order. No topic-wise marks weightage is published.
