      - id: isc-12-arabic-classical-ch03-t02
        title: "Mudaf wa Mudaf Ilaihi: forming the construct phrase"
        learning_outcomes:
          - "Form a construct phrase, dropping al- and tanwin from the mudaf and putting the mudaf ilaihi in the genitive"
      - id: isc-12-arabic-classical-ch03-t03
        title: "Construct phrases with suffixed pronouns and with an adjective"
        learning_outcomes:
          - "Add an adjective to a construct phrase and make it agree with the right noun"
      - id: isc-12-arabic-classical-ch03-t04
        title: "Telling apart a noun-adjective phrase, a construct phrase and a nominal sentence"
        learning_outcomes:
          - "Classify pairs such as al-baytu al-kabiru, baytu al-mudarrisi and al-baytu kabirun and translate each correctly"
    removed_topics: []
    literature_texts: []
