# ISC Class 12 Arabic (Classical Language elective, code 837) - ISC 2027 examination.
# Prescribed books: titles and authors only, as transliterated by CISCE. Titles are in English with transliterated Arabic terms.
subject_id: isc-12-arabic-classical
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-classical-languages, isc-2027-prescribed-books, isc-2027-regulations]
exam_notes: >-
  Paper I Theory: one paper of 3 hours, 80 marks, containing: (a) questions on grammar - articles, suffixed pronouns, relative
  pronouns, Sifat wa Mausuf, Mudaf wa Mudaf Ilaihi, the nominal sentence, cases of the noun and simple forms of the verb;
  (b) unseen translation from English into Arabic of short prose sentences and a continuous prose passage; (c) translation from
  the prescribed books, with no choice of passages; (d) short-answer questions on the subject matter of the prescribed books;
  (e) composition - reproducing descriptive and narrative passages from the text in simple Arabic. CISCE does not publish marks per
  part. Prescribed books (Appendix I): Durus Al-Lughatal-Arabiyya Part 1 (complete) and Part 2 (lessons 1-15) by Dr. V. Abdur Rahim
  (Islamic Foundation Trust, Chennai). The syllabus text also says the prescribed books will include about 150 pages of selections of
  classical and modern Arabic prose and poetry; Appendix I names only the Durus books, so SOYL follows Appendix I. Paper II Project Work
  (20 marks): Listening (5) and Speaking (5) assessed by the subject teacher - an unseen passage or poem read aloud twice with objective
  questions, and a three-minute presentation (which may include reading out a corrected version of a grammatically incorrect passage of
  150-200 words); Writing (10) assessed by a Visiting Examiner - one assignment of about 250 words on a text studied. CISCE sets no
  question paper for project work. CISCE has not bifurcated this syllabus: the ISC 2027 paper is set on the entire Classes XI-XII
  syllabus, so nothing is removed for Class XI. Titles are in English / CISCE transliteration; Arabic-script titles to be added in
  language review. CISCE lists topics not chapters; SOYL grouped them into teachable chapters in syllabus order.
units:
  - { name: "(a) Grammar", marks: null }
  - { name: "(b) Unseen translation from English into Arabic", marks: null }
  - { name: "(c) and (d) Prescribed books: translation and short-answer questions", marks: null }
  - { name: "(e) Composition", marks: null }
chapters:
  - id: isc-12-arabic-classical-ch01
    number: 1
    title: "Articles and the noun"
    unit: "(a) Grammar"
    topics:
      - id: isc-12-arabic-classical-ch01-t01
        title: "The definite article al- and the indefinite noun with tanwin"
        learning_outcomes:
          - "Make a noun definite with al- and indefinite with tanwin, and explain the difference in meaning"
      - id: isc-12-arabic-classical-ch01-t02
        title: "Sun and moon letters (al-huruf al-shamsiyya wa al-qamariyya)"
        learning_outcomes:
          - "Sort nouns by sun or moon letter and pronounce the article correctly with each"
      - id: isc-12-arabic-classical-ch01-t03
        title: "Gender of nouns: masculine and feminine (ta marbuta)"
        learning_outcomes:
          - "Identify the gender of a noun and form the feminine of adjectives and nouns of profession with ta marbuta"
      - id: isc-12-arabic-classical-ch01-t04
        title: "Number: singular, dual, sound plurals and common broken plurals"
        learning_outcomes:
          - "Form the dual and the sound masculine and feminine plurals, and give the broken plural of common nouns from the prescribed lessons"
    removed_topics: []
    literature_texts: []
  - id: isc-12-arabic-classical-ch02
    number: 2
    title: "Pronouns: separate, suffixed, demonstrative and relative"
    unit: "(a) Grammar"
    topics:
      - id: isc-12-arabic-classical-ch02-t01
        title: "Separate personal pronouns (ana, anta, anti, huwa, hiya, nahnu, antum, hum)"
        learning_outcomes:
          - "Use the separate pronouns as subjects of nominal sentences"
      - id: isc-12-arabic-classical-ch02-t02
        title: "Suffixed pronouns on nouns, prepositions and verbs (kitabuhu, minka, ra'aytuhu)"
        learning_outcomes:
          - "Attach the correct suffixed pronoun to show possession, the object of a preposition or the object of a verb"
      - id: isc-12-arabic-classical-ch02-t03
        title: "Demonstratives: hadha, hadhihi, dhalika, tilka, ha'ula'i, ula'ika"
        learning_outcomes:
          - "Choose the demonstrative that agrees with the noun in gender, number and nearness"
      - id: isc-12-arabic-classical-ch02-t04
        title: "Relative pronouns: alladhi, allati, alladhina, allati / allawati; man and ma"
        learning_outcomes:
          - "Join two sentences with the relative pronoun that agrees with its antecedent"
          - "Explain that a relative pronoun is used only after a definite antecedent"
    removed_topics: []
    literature_texts: []
  - id: isc-12-arabic-classical-ch03
    number: 3
    title: "Noun phrases: Sifat wa Mausuf and Mudaf wa Mudaf Ilaihi"
    unit: "(a) Grammar"
    topics:
      - id: isc-12-arabic-classical-ch03-t01
        title: "Sifat wa Mausuf: agreement of the adjective in gender, number, definiteness and case"
        learning_outcomes:
