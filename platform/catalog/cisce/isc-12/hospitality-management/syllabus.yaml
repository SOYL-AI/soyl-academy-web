# ISC Class 12 Hospitality Management (880) - ISC 2027 examination, CLASS XII portion only.
# Source: platform/catalog/sources/cisce.md#isc-2027-hospitality-management. Topic wording is our own summary of the official scope.
subject_id: isc-12-hospitality-management
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-hospitality-management, isc-2027-regulations]
exam_notes: >-
  Paper I Theory: 3 hours, 70 marks, on the five Class XII topics below. Paper II Practical Work: 30 marks, evaluated by a
  Visiting Examiner appointed locally and approved by CISCE - a 3-hour practical examination (20 marks: two classical cuts
  of vegetables such as julienne, jardiniere, macedoine or chiffonade with their uses, 4; cold cooking - a salad, chaat or
  sandwich for a given number of people with garnish, plating and a standard-recipe ingredient list, 8; a table layout for
  two for an Indian meal in an a la carte or table d'hote restaurant with correct placement of cutlery, glassware and
  crockery, occasion-appropriate napkin folds and a labelled drawing, 8), one creative project on any aspect of
  hospitality management (7) and the practical file kept through the year (3). Practical work through the year covers
  knife skills, nutritional calculation, menu planning and food costing, cold cooking and induction cooking, restaurant
  mise en place, table layouts, service conventions and F&B standard operating procedures. This practical work is not part
  of the chapters below and no question paper is set for the project. CISCE lists topics with scope notes, not textbook
  chapters: SOYL groups them into 8 teachable chapters in syllabus order, giving each operational area its own chapter.
  No unit-wise marks weightage is published for ISC Hospitality Management.
