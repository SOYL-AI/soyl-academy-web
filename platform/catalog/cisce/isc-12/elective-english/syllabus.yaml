# ISC Class 12 Elective English (850) - ISC 2027 examination, CLASS XII portion only.
# Source: platform/catalog/sources/cisce.md#isc-2027-elective-english and #isc-2027-prescribed-books.
# Literature: titles and authors only. Students read the texts in their own copies; topic wording is our own.
subject_id: isc-12-elective-english
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-elective-english, isc-2027-prescribed-books, isc-2027-specimen-papers, isc-2027-regulations]
exam_notes: >-
  Elective English (850) is an optional elective, separate from compulsory English. Paper I Theory: 3 hours, 80 marks,
  compulsorily covering Prose (novel), Drama and Poetry; candidates choose ONE of the two prescribed novels (The Book Thief
  or The Namesake) and ONE of the two prescribed plays (An Enemy of the People or Tughlaq), while all prescribed poems in
  Fireflies are compulsory. Questions may be character-based, incident-based, broad, theme-based or call for critical
  evaluation; credit is given for textual detail and personal response. The ISC 2027 specimen paper has Section A
  (10 marks, multiple-choice on the chosen novel, chosen play and the poems), Section B (10 marks, five 2-mark short
  answers) and Section C (60 marks, one 20-mark question each on the novel, the play and poetry, each either an essay or
  two 10-mark short notes). Paper II Project Work (20 marks, Class XII): one written assignment of 1000-1500 words on ONE
  Class XII text, titled as a question (introduction, methods, results, conclusion, bibliography); 10 marks teacher,
  10 marks Visiting Examiner; no question paper is set. CISCE lists texts and areas of study, not chapters: SOYL gives each
  novel and play its own chapter (author, plot, characters, themes, devices, personal response) and each prescribed poet
  a chapter with one topic per poem, after a chapter on poetic forms, devices and critical appreciation. No section-wise
  marks are published in the syllabus, so units carry no marks.
units:
  - { name: "I. Prose (Novel)", marks: null }
  - { name: "II. Drama", marks: null }
  - { name: "III. Poetry", marks: null }
chapters:
  - id: isc-12-elective-english-ch01
    number: 1
    title: "Novel (Option 1): The Book Thief - Markus Zusak"
    unit: "I. Prose (Novel)"
    topics:
      - id: isc-12-elective-english-ch01-t01
        title: "Markus Zusak's life and the novel's background in Nazi Germany during the Second World War"
        learning_outcomes:
          - "Outline the events of Zusak's life and family history that shaped the novel"
          - "Explain how the setting of a small German town under Nazi rule frames the story"
      - id: isc-12-elective-english-ch01-t02
        title: "Death as narrator: structure, foreshadowing and the use of colour"
        learning_outcomes:
          - "Evaluate the effect of having Death narrate the story, including early revelations of what will happen"
          - "Identify narrative devices such as bolded asides, lists and colour imagery and explain their purpose"
      - id: isc-12-elective-english-ch01-t03
        title: "Plot and key incidents: Liesel's arrival on Himmel Street, the stolen books and the bombing"
        learning_outcomes:
          - "Summarise the main incidents of the novel in sequence and explain the significance of each stolen book"
          - "Explain how the ending brings together the novel's main strands"
      - id: isc-12-elective-english-ch01-t04
        title: "Characters and relationships: Liesel, Hans and Rosa Hubermann, Rudy Steiner, Max Vandenburg and Ilsa Hermann"
        learning_outcomes:
          - "Evaluate the character of Liesel and trace her growth from an illiterate child to a writer"
          - "Analyse the relationships between Liesel and Hans, Rudy and Max and what each teaches her"
          - "Explain the consequences of Hans's act of kindness towards a Jewish prisoner"
      - id: isc-12-elective-english-ch01-t05
        title: "Themes and motifs: the power of words, mortality, kindness amid cruelty, stealing and sharing"
        learning_outcomes:
          - "Discuss how words are shown both as tools of Nazi propaganda and as sources of comfort and resistance"
          - "Trace recurring motifs such as books, the accordion, snow and the colour of the sky"
      - id: isc-12-elective-english-ch01-t06
        title: "Humour, pathos and tragedy; personal response and relevance to contemporary society"
        learning_outcomes:
          - "Identify moments of humour and pathos and explain how they balance the novel's tragic events"
          - "Present a reasoned personal response to the novel and its relevance today"
    removed_topics:
      - "Class XI novels: Animal Farm (George Orwell) or From Heaven Lake (Vikram Seth) (see isc-11-elective-english)"
    literature_texts:
      - { title: "The Book Thief", author: "Markus Zusak" }
  - id: isc-12-elective-english-ch02
    number: 2
    title: "Novel (Option 2): The Namesake - Jhumpa Lahiri"
    unit: "I. Prose (Novel)"
    topics:
      - id: isc-12-elective-english-ch02-t01
        title: "Jhumpa Lahiri's life and the Bengali immigrant experience in America"
        learning_outcomes:
          - "Relate Lahiri's own background as the child of Bengali immigrants to the concerns of the novel"
      - id: isc-12-elective-english-ch02-t02
        title: "Plot and key incidents: from Ashoke's train accident and Gogol's naming to Ashima's final departure"
        learning_outcomes:
          - "Summarise the main events across the novel's three decades in sequence"
          - "Explain why the train accident and Ashoke's choice of the name Gogol are central to the story"
      - id: isc-12-elective-english-ch02-t03
        title: "Characters and relationships: Gogol, Ashoke, Ashima, Sonia, Maxine and Moushumi"
        learning_outcomes:
          - "Evaluate Gogol's character and his changing attitude to his name, family and heritage"
          - "Analyse Ashima's loneliness and growing independence as an immigrant wife and mother"
          - "Compare Gogol's relationships with Maxine and Moushumi and what they reveal about him"
      - id: isc-12-elective-english-ch02-t04
        title: "Themes and motifs: names and identity, belonging, generational conflict, loss and memory"
        learning_outcomes:
          - "Discuss how the novel uses naming customs (pet name and good name) to explore identity"
          - "Explain the significance of recurring motifs such as trains, journeys, gatherings and the book of Gogol's stories"
      - id: isc-12-elective-english-ch02-t05
        title: "Narrative style: third-person narration, present tense, shifting viewpoints and the passage of time"
        learning_outcomes:
          - "Analyse how the shifting point of view between Ashima and Gogol shapes the reader's sympathy"
          - "Identify stylistic and narrative devices and comment on their effect"
      - id: isc-12-elective-english-ch02-t06
        title: "Pathos and irony; personal response and relevance to contemporary society"
        learning_outcomes:
          - "Present a reasoned personal response to the novel and relate its concerns to migration today"
    removed_topics: []
    literature_texts:
      - { title: "The Namesake", author: "Jhumpa Lahiri" }
  - id: isc-12-elective-english-ch03
    number: 3
    title: "Drama (Option 1): An Enemy of the People - Henrik Ibsen"
    unit: "II. Drama"
    topics:
      - id: isc-12-elective-english-ch03-t01
        title: "Henrik Ibsen's life and the realist 'problem play' in nineteenth-century Norway"
        learning_outcomes:
          - "Outline the main events of Ibsen's life and his place in modern realist drama"
          - "Explain the features of a social problem play with reference to this text"
      - id: isc-12-elective-english-ch03-t02
        title: "Acts I-II: the discovery of contaminated Baths and the first clash between the Stockmann brothers"
        learning_outcomes:
          - "Summarise how Dr Stockmann's discovery is first welcomed and then opposed"
          - "Explain the conflicting interests of the Mayor, the newspaper men and the householders"
      - id: isc-12-elective-english-ch03-t03
        title: "Acts III-V: the newspaper's betrayal, the public meeting and Dr Stockmann's isolation"
        learning_outcomes:
          - "Describe how the press and the 'compact majority' turn against Dr Stockmann"
          - "Analyse the significance of the public meeting and of the final act's resolution"
      - id: isc-12-elective-english-ch03-t04
        title: "Characters: Dr Thomas Stockmann, Peter Stockmann, Hovstad, Aslaksen, Morten Kiil, Petra and Mrs Stockmann"
        learning_outcomes:
          - "Evaluate Dr Stockmann as an idealist, considering both his courage and his arrogance"
          - "Contrast the two Stockmann brothers as representatives of truth and expediency"
      - id: isc-12-elective-english-ch03-t05
        title: "Themes: truth versus public opinion, the individual against the majority, corruption, environment and democracy"
        learning_outcomes:
          - "Discuss the play's view of majority rule and whether it remains relevant today"
          - "Relate the polluted Baths to present-day environmental and public-health controversies"
      - id: isc-12-elective-english-ch03-t06
        title: "Dramatic devices: irony, satire, symbolism and personal response to the play"
        learning_outcomes:
          - "Identify examples of irony and satire and explain their effect on the audience"
          - "Present a reasoned personal assessment of the play"
    removed_topics:
      - "Class XI plays: Twelve Angry Men (Reginald Rose) or The Importance of Being Earnest (Oscar Wilde) (see isc-11-elective-english)"
    literature_texts:
      - { title: "An Enemy of the People", author: "Henrik Ibsen" }
  - id: isc-12-elective-english-ch04
    number: 4
    title: "Drama (Option 2): Tughlaq - Girish Karnad"
    unit: "II. Drama"
    topics:
      - id: isc-12-elective-english-ch04-t01
        title: "Girish Karnad's life and his use of history and myth in modern Indian drama"
        learning_outcomes:
          - "Outline Karnad's life and work as a playwright writing in Kannada and English"
          - "Explain why Karnad turned to the reign of a fourteenth-century sultan to comment on his own times"
      - id: isc-12-elective-english-ch04-t02
        title: "Plot and key incidents: the Sultan's reforms, the shift of capital to Daulatabad and the copper currency"
        learning_outcomes:
          - "Summarise the main incidents of the play scene by scene"
          - "Explain how each of the Sultan's idealistic schemes ends in failure and suffering"
      - id: isc-12-elective-english-ch04-t03
        title: "Muhammad bin Tughlaq: idealist and tyrant, scholar and murderer"
        learning_outcomes:
          - "Evaluate the contradictions in the Sultan's character and the reasons for his downfall"
          - "Analyse how the Sultan uses religion and prayer for political ends"
      - id: isc-12-elective-english-ch04-t04
        title: "Other characters: Barani, Najib, the Step-mother, Sheikh Imam-ud-din, Aziz and Aazam"
        learning_outcomes:
          - "Contrast Barani the historian and Najib the politician as the Sultan's advisers"
          - "Explain how Aziz exploits the Sultan's policies and why he is a mirror of the Sultan"
      - id: isc-12-elective-english-ch04-t05
        title: "Themes: idealism and disillusionment, power and politics, religion, and the play as political allegory"
        learning_outcomes:
          - "Discuss the play's relevance to post-independence Indian politics and to contemporary society"
      - id: isc-12-elective-english-ch04-t06
        title: "Dramatic devices: irony, humour, symbolism (the chess game, the python, the prayer) and personal response"
        learning_outcomes:
          - "Identify examples of irony and dark humour and explain how they shape the play's tragic effect"
          - "Present a reasoned personal assessment of the play"
    removed_topics: []
    literature_texts:
      - { title: "Tughlaq", author: "Girish Karnad" }
  - id: isc-12-elective-english-ch05
    number: 5
    title: "Studying Poetry: Forms, Literary Devices and Critical Appreciation"
    unit: "III. Poetry"
    topics:
      - id: isc-12-elective-english-ch05-t01
        title: "Types of poems: lyric, Petrarchan and Shakespearean sonnet, ballad, elegy, blank verse and free verse"
        learning_outcomes:
          - "Identify the form of a poem from its structure, rhyme and metre and state its characteristics"
          - "Distinguish the Petrarchan from the Shakespearean sonnet by rhyme scheme and argument"
      - id: isc-12-elective-english-ch05-t02
        title: "Types of poems: narrative, pastoral, romantic poetry and the dramatic monologue"
        learning_outcomes:
          - "Describe the features of a dramatic monologue and recognise them in prescribed poems"
      - id: isc-12-elective-english-ch05-t03
        title: "Literary devices (1): simile, metaphor, personification, apostrophe, imagery and symbolism"
        learning_outcomes:
          - "Recognise each device in an extract and explain the effect it creates"
      - id: isc-12-elective-english-ch05-t04
        title: "Literary devices (2): alliteration, assonance, onomatopoeia, repetition and enjambment"
        learning_outcomes:
          - "Explain how sound devices and line breaks contribute to meaning and mood"
      - id: isc-12-elective-english-ch05-t05
        title: "Literary devices (3): irony, pun, contrast, climax and anti-climax, hyperbole, oxymoron and litotes"
        learning_outcomes:
          - "Distinguish closely related devices (e.g. hyperbole and litotes, climax and anti-climax) with examples"
      - id: isc-12-elective-english-ch05-t06
        title: "Writing a critical appreciation: poet's life, type, setting, theme, mood, levels of meaning, rhyme scheme, devices and personal response"
        learning_outcomes:
          - "Write a structured critical appreciation of a prescribed poem covering all the required components"
          - "Support every point with close reference to the poem rather than general statements"
    removed_topics:
      - "Class XI Fireflies poets: John Milton, Percy Bysshe Shelley, Thomas Hardy, W.B. Yeats, Wilfred Owen, Dylan Thomas, Carol Ann Duffy (see isc-11-elective-english)"
    literature_texts: []
  - id: isc-12-elective-english-ch06
    number: 6
    title: "Fireflies: T.S. Eliot"
    unit: "III. Poetry"
    topics:
      - id: isc-12-elective-english-ch06-t01
        title: "T.S. Eliot: American-born English poet, Modernism and his style"
        learning_outcomes:
          - "Outline Eliot's life and explain features of his Modernist style such as fragmentation and allusion"
      - id: isc-12-elective-english-ch06-t02
        title: "The Love Song of J. Alfred Prufrock: a dramatic monologue of indecision and alienation"
        learning_outcomes:
          - "Explain the speaker's situation and his inability to act or to declare himself"
          - "Analyse the imagery of the city, fog and time and the use of allusion and irony"
      - id: isc-12-elective-english-ch06-t03
        title: "Preludes: images of urban decay and the search for meaning"
        learning_outcomes:
          - "Describe how the four sections present the city at different times of day"
          - "Analyse how imagery conveys alienation and spiritual emptiness in modern urban life"
      - id: isc-12-elective-english-ch06-t04
        title: "Journey of the Magi: a wise man's memory of a hard journey, birth and death"
        learning_outcomes:
          - "Summarise the speaker's account of the journey and its aftermath"
          - "Explain the theme of painful spiritual rebirth and the link to Eliot's own conversion"
    removed_topics: []
    literature_texts:
      - { title: "The Love Song of J. Alfred Prufrock", author: "T.S. Eliot" }
      - { title: "Preludes", author: "T.S. Eliot" }
      - { title: "Journey of the Magi", author: "T.S. Eliot" }
  - id: isc-12-elective-english-ch07
    number: 7
    title: "Fireflies: Maya Angelou"
    unit: "III. Poetry"
    topics:
      - id: isc-12-elective-english-ch07-t01
        title: "Maya Angelou: life, the African-American experience and her poetic voice"
        learning_outcomes:
          - "Relate events of Angelou's life and the civil rights movement to the concerns of her poems"
      - id: isc-12-elective-english-ch07-t02
        title: "The Mothering Blackness: return, forgiveness and the protective embrace of Black heritage"
        learning_outcomes:
          - "Explain the situation of the daughter who returns home and the mother's response"
          - "Explain the biblical allusion in the poem and its purpose"
      - id: isc-12-elective-english-ch07-t03
        title: "Still I Rise: defiance, dignity and resilience against oppression"
        learning_outcomes:
          - "Analyse how imagery of natural forces conveys the speaker's unstoppable resilience"
          - "Explain the effect of repetition, rhetorical questions and the shift in form towards the end"
      - id: isc-12-elective-english-ch07-t04
        title: "Awaking in New York: the city at dawn"
        learning_outcomes:
          - "Describe the picture of the waking city and the mood the short poem creates"
    removed_topics: []
    literature_texts:
      - { title: "The Mothering Blackness", author: "Maya Angelou" }
      - { title: "Still I Rise", author: "Maya Angelou" }
