  - id: isc-12-elective-english-ch08
    number: 8
    title: "Fireflies: Sylvia Plath"
    unit: "III. Poetry"
    topics:
      - id: isc-12-elective-english-ch08-t01
        title: "Sylvia Plath: life, confessional poetry and her style"
        learning_outcomes:
          - "Explain the term confessional poetry and the autobiographical element in Plath's work"
      - id: isc-12-elective-english-ch08-t02
        title: "Mirror: an object's view of a woman growing old"
        learning_outcomes:
          - "Explain how the mirror (and later the lake) is personified as a truthful speaker"
          - "Interpret the closing image and the poem's view of ageing and identity"
      - id: isc-12-elective-english-ch08-t03
        title: "Tulips: a hospital patient's longing for peace and the intrusion of life"
        learning_outcomes:
          - "Contrast the imagery of whiteness and stillness with the vivid red tulips"
          - "Analyse how the speaker's attitude to the flowers changes through the poem"
      - id: isc-12-elective-english-ch08-t04
        title: "Pursuit: the panther as a metaphor for desire, fear and danger"
        learning_outcomes:
          - "Analyse the panther metaphor and how the pursuit creates tension and helplessness"
    removed_topics: []
    literature_texts:
      - { title: "Mirror", author: "Sylvia Plath" }
      - { title: "Tulips", author: "Sylvia Plath" }
