    title: "Fireflies: Gieve Patel"
    unit: "III. Poetry"
    topics:
      - id: isc-12-elective-english-ch09-t01
        title: "Gieve Patel: physician, painter and poet; his place in Indian English poetry"
        learning_outcomes:
