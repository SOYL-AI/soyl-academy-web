# ISC Class 12 Urdu (Indian Language elective, code 816) - ISC 2027 examination.
# Literature: titles and authors only (CONTEXT section 8). Students read the texts in their own textbook.
subject_id: isc-12-urdu
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-indian-languages, isc-2027-prescribed-books, cisce-circular-2026-27-33-indian-languages, isc-2027-regulations]
exam_notes: >-
  Paper I Theory: one paper of 3 hours, 80 marks, in two sections. Section A Language (40 marks, three compulsory
  questions): a composition of about 400 words in Urdu from a choice of six topics; an unseen passage of about 300
  words with questions and/or a summary with a heading (testing the ability to summarise and/or expand an idea); and
  functional grammar (correction of sentences and use of words/idioms in sentences, with correct agreement of number,
  gender, case, tense and voice). Section B Prescribed Textbooks (40 marks): answer four questions from any three of
  the prescribed books. Prescribed texts are bifurcated (Circular 2026-27/33): the ISC 2027 paper is set only on the
  Class XII portion listed here; the Class XI portion (isc-11-urdu) is listed under each chapter's removed_topics.
  Paper II Project Work (20 marks): Listening (5) and Speaking (5) assessed by the teacher; Writing (10) assessed by a
  Visiting Examiner - one assignment of 1000-1500 words on a literature text not used in the Class XI project. CISCE
  lists topics, not chapters: SOYL grouped them into teachable chapters in syllabus order. CISCE does not publish
  question-wise marks within Section A and describes composition and grammar only generically: the composition types
  and grammar breakdown below are SOYL's, adapted to the grammar of the language. SOYL covers all four prescribed
  books so a student can pick any three. Titles are in English / CISCE transliteration; native-script titles to be
  added in language review.
units:
  - { name: "Section A: Language", marks: 40 }
  - { name: "Section B: Prescribed Textbooks", marks: 40 }
chapters:
  - id: isc-12-urdu-ch01
    number: 1
    title: "Composition writing (about 400 words)"
    unit: "Section A: Language"
    topics:
      - id: isc-12-urdu-ch01-t01
        title: "Planning a composition: choosing a topic, outline, introduction, body and conclusion"
        learning_outcomes:
          - "Choose a suitable topic from a choice of six and prepare an outline before writing"
          - "Write a well-organised composition of about 400 words in Urdu, divided into paragraphs"
      - id: isc-12-urdu-ch01-t02
        title: "Descriptive and narrative compositions"
        learning_outcomes:
          - "Describe an experience, journey, place or event in Urdu vividly and in a logical sequence"
      - id: isc-12-urdu-ch01-t03
        title: "Reflective and argumentative compositions: for and against, and conclusion"
        learning_outcomes:
          - "Present a point of view on a social or current issue in Urdu, supported by reasons and examples"
          - "Weigh opposing arguments fairly and write a balanced conclusion"
      - id: isc-12-urdu-ch01-t04
        title: "Story writing from a given sentence, proverb or outline"
        learning_outcomes:
          - "Write an original story in Urdu that develops a given opening line, proverb or outline to a meaningful end"
      - id: isc-12-urdu-ch01-t05
        title: "Language and style: word choice, idioms, spelling and punctuation"
        learning_outcomes:
          - "Use vocabulary and idiomatic expressions suited to the topic"
          - "Proofread a composition and correct its errors of spelling and punctuation in Urdu"
    removed_topics: []
    literature_texts: []
  - id: isc-12-urdu-ch02
    number: 2
    title: "Comprehension: unseen passage (about 300 words) and summary"
    unit: "Section A: Language"
    topics:
      - id: isc-12-urdu-ch02-t01
        title: "Identifying the main idea and supporting points of a passage"
        learning_outcomes:
          - "State the central idea of an unseen Urdu passage of about 300 words in your own words"
      - id: isc-12-urdu-ch02-t02
        title: "Answering questions on the passage in your own words"
        learning_outcomes:
          - "Answer factual and inferential questions accurately without copying lines from the passage"
          - "Explain the meaning of difficult words and phrases from their context"
      - id: isc-12-urdu-ch02-t03
        title: "Writing a summary with a heading"
        learning_outcomes:
          - "Write a summary of the passage in about one-third of its length and give it a suitable heading"
      - id: isc-12-urdu-ch02-t04
        title: "Expanding an idea given in the passage"
        learning_outcomes:
          - "Expand a statement or idea from the passage into a paragraph with examples"
    removed_topics: []
    literature_texts: []
  - id: isc-12-urdu-ch03
    number: 3
    title: "Grammar: correction of sentences"
    unit: "Section A: Language"
    topics:
      - id: isc-12-urdu-ch03-t01
        title: "Agreement of the verb with subject or object in gender and number, including sentences with 'ne'"
        learning_outcomes:
          - "Correct verbs that do not agree in gender and number with the subject or, in 'ne' sentences, with the object"
          - "Use masculine and feminine, singular and plural forms consistently in a sentence"
      - id: isc-12-urdu-ch03-t02
        title: "Postpositions (ka, ko, se, mein, par) and case forms"
        learning_outcomes:
          - "Identify a wrong case marker or postposition in a sentence and replace it with the correct form"
      - id: isc-12-urdu-ch03-t03
        title: "Errors of tense and voice"
        learning_outcomes:
          - "Remove inconsistencies of tense within a sentence"
          - "Rewrite sentences correctly in the active and passive voice"
      - id: isc-12-urdu-ch03-t04
        title: "Errors of word order, redundancy, wrong word choice and spelling"
        learning_outcomes:
          - "Rewrite a faulty sentence correctly by fixing word order, removing redundant words and correcting spelling"
      - id: isc-12-urdu-ch03-t05
        title: "Errors of izafat and of spelling (similar letters and nuqta)"
        learning_outcomes:
          - "Correct errors in the use of izafat and in the spelling of words with similar-sounding letters"
    removed_topics: []
    literature_texts: []
  - id: isc-12-urdu-ch04
    number: 4
    title: "Grammar: using words and idioms in sentences"
    unit: "Section A: Language"
    topics:
      - id: isc-12-urdu-ch04-t01
        title: "Idioms: meaning and use in sentences"
        learning_outcomes:
          - "Give the meaning of a Urdu idiom and use it in a sentence that makes the meaning clear"
      - id: isc-12-urdu-ch04-t02
        title: "Proverbs: meaning and use"
        learning_outcomes:
          - "Distinguish a proverb from an idiom and use a proverb aptly in context"
      - id: isc-12-urdu-ch04-t03
        title: "Using given words correctly in sentences: similar-sounding words with different meanings"
        learning_outcomes:
          - "Bring out the difference in meaning between similar-sounding words by using each in a sentence"
          - "Use a given word in a sentence in its correct form"
    removed_topics: []
    literature_texts: []
  - id: isc-12-urdu-ch05
    number: 5
    title: "Novel: Moorti (Tarannum Riyaz), pages 21-45"
    unit: "Section B: Prescribed Textbooks"
    topics:
      - id: isc-12-urdu-ch05-t01
        title: "From the graveyard incident in Kashmir onwards: events and development of the story"
        learning_outcomes:
          - "Narrate the main events of this part of the novel in sequence in your own words"
          - "Explain how this part develops the central conflict and the characters"
      - id: isc-12-urdu-ch05-t02
        title: "The closing part of the novel: climax and ending"
        learning_outcomes:
          - "Narrate the final events of the novel in your own words"
          - "Explain how the ending resolves the central character's story"
      - id: isc-12-urdu-ch05-t03
        title: "Character sketches of the main characters"
        learning_outcomes:
          - "Write a character sketch of a main character, supported by incidents from the prescribed portion"
          - "Compare two characters and their responses to the central conflict"
      - id: isc-12-urdu-ch05-t04
        title: "Themes, setting and message"
        learning_outcomes:
          - "Identify the main themes of the prescribed portion and relate them to the setting and social background of the novel"
      - id: isc-12-urdu-ch05-t05
        title: "Title, narrative technique and language"
        learning_outcomes:
          - "Explain the significance of the title with reference to the prescribed portion"
          - "Comment on the author's narrative style and use of language with examples"
    removed_topics:
      - "Moorti pages 1-20 (from the beginning to the museum incident in Kashmir) (Class XI portion; see isc-11-urdu)"
    literature_texts:
      - { title: "Moorti (pages 21 to 45)", author: "Tarannum Riyaz" }
