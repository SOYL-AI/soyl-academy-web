      - id: isc-12-accounts-ch04-t05
        title: "Amount due to retiring partner; retiring partner's loan account and deceased partner's executor's account"
        learning_outcomes:
          - "Calculate the amount payable to a retiring partner or a deceased partner's executor"
          - "Prepare a loan account with instalments and interest accrued and due or accrued but not due"
      - id: isc-12-accounts-ch04-t06
        title: "Balance Sheet of the reconstituted firm after retirement or death (horizontal format)"
        learning_outcomes:
          - "Prepare the capital accounts and Balance Sheet of the firm after retirement or death"
