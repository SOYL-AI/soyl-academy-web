        title: "Treatment of goodwill (including hidden goodwill), revaluation and accumulated profits/losses"
        learning_outcomes:
          - "Adjust the retiring or deceased partner's share of goodwill through the gaining partners' accounts"
          - "Prepare a Revaluation Account and distribute reserves and accumulated losses on retirement or death"
      - id: isc-12-accounts-ch04-t03
        title: "Deceased partner's share of profit till the date of death (time or turnover basis)"
        learning_outcomes:
          - "Calculate the share of profit up to death on a time or turnover basis"
          - "Record it through Profit and Loss Suspense Account or the gaining partners' accounts as appropriate"
      - id: isc-12-accounts-ch04-t04
        title: "Adjustment of capitals of continuing partners and payment by bringing in cash"
