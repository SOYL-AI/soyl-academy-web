# ISC Class 12 Accounts (syllabus titled Accountancy, code 858) - ISC 2027 examination.
# Source: platform/catalog/sources/cisce.md#isc-2027-accounts. Topic wording is our own summary of the official scope.
subject_id: isc-12-accounts
academic_year: "2026-27"
source_status: verified
sources: [isc-2027-accounts, isc-2027-regulations]
exam_notes: >-
  Paper I Theory: 3 hours, 80 marks, in three sections. Section A (60 marks, compulsory): Partnership Accounts and Joint
  Stock Company Accounts. Candidates then attempt EITHER Section B Management Accounting (20 marks) OR Section C
  Computerised Accounting (20 marks). Published weightage table: Section A - Partnership Accounts 11 + 15 + 8 (8 for
  Dissolution; 11 and 15 shared across Fundamentals, Goodwill, Admission and Retirement/Death), Issue of Shares 11, Issue
  and Redemption of Debentures 8, Final Accounts of Companies 7; Section B - Financial Statement Analysis 4, Cash Flow
  Statement 8, Ratio Analysis 8; Section C - Electronic Spreadsheet 10, DBMS 10. The table uses merged rows and the
  extracted text does not show the row spans of the 11- and 15-mark partnership rows unambiguously (most likely
  Fundamentals + Goodwill = 11 and Admission + Retirement/Death = 15), so SOYL records unit 1 as one unit of 34 marks. Paper II Project Work (20 marks): two projects of 10 marks each from any theory topic (format 1, content 4,
  findings 2, viva-voce 3), assessed by the teacher and a Visiting Examiner. CISCE lists units and sub-topics, not
  chapters: SOYL groups them into teachable chapters in syllabus order. Balance sheets on reconstitution are prepared in
  horizontal format; company balance sheets follow Schedule III Part I of the Companies Act, 2013.
units:
  - { name: "1. Partnership Accounts", marks: 34 }
  - { name: "2. Joint Stock Company Accounts", marks: 26 }
  - { name: "3. Financial Statement Analysis (Section B)", marks: 4 }
  - { name: "4. Cash Flow Statement (Section B)", marks: 8 }
  - { name: "5. Ratio Analysis (Section B)", marks: 8 }
  - { name: "6. Accounting Application of Electronic Spreadsheet (Section C)", marks: 10 }
  - { name: "7. Database Management System (Section C)", marks: 10 }
chapters:
  - id: isc-12-accounts-ch01
    number: 1
    title: "Fundamentals of Partnership"
    unit: "1. Partnership Accounts"
    topics:
      - id: isc-12-accounts-ch01-t01
        title: "Partnership: definition, meaning and features; Indian Partnership Act, 1932 provisions on books of account"
        learning_outcomes:
          - "State the essential features of a partnership with reference to the Indian Partnership Act, 1932"
      - id: isc-12-accounts-ch01-t02
        title: "Partnership deed: meaning, importance and rules applicable in its absence"
        learning_outcomes:
          - "List the usual contents of a partnership deed and explain why it is important"
          - "Apply the Act's rules on profit sharing, interest on capital, drawings and loans when the deed is silent"
      - id: isc-12-accounts-ch01-t03
        title: "Partners' capital accounts (fixed and fluctuating) and current accounts"
        learning_outcomes:
          - "Prepare partners' capital accounts under the fixed and fluctuating capital methods"
          - "Prepare partners' current accounts with interest on current account balances (debit and credit)"
      - id: isc-12-accounts-ch01-t04
        title: "Profit and Loss Appropriation Account: interest on capital, salary, commission, transfer to reserve and division of profit"
        learning_outcomes:
          - "Prepare a Profit and Loss Appropriation Account from given terms of the partnership deed"
          - "Calculate a partner's or manager's commission on correct trading profit, before or after charging the commission"
      - id: isc-12-accounts-ch01-t05
        title: "Interest on drawings; charges against profit (interest on partner's loan, rent to a partner)"
        learning_outcomes:
          - "Calculate interest on drawings by the product method and the average-period method"
          - "Distinguish charges against profit (interest on loan, rent to a partner) from appropriations and record them correctly"
      - id: isc-12-accounts-ch01-t06
        title: "Guarantee of profits to a partner"
        learning_outcomes:
          - "Record the deficiency in a guaranteed minimum profit borne by one or more partners in an agreed ratio"
      - id: isc-12-accounts-ch01-t07
        title: "Past adjustments: interest on capital, interest on drawings, salary and profit-sharing ratio"
        learning_outcomes:
          - "Pass a single adjustment journal entry to rectify past omissions or errors using a working table"
          - "Prepare partners' adjusted capital or current accounts after past adjustments"
    removed_topics:
      - "Admission of a manager as a partner is excluded from past adjustments and guarantee of profits"
    literature_texts: []
  - id: isc-12-accounts-ch02
    number: 2
    title: "Goodwill: Nature and Valuation"
    unit: "1. Partnership Accounts"
    topics:
      - id: isc-12-accounts-ch02-t01
        title: "Goodwill: meaning, nature and features; factors affecting its value"
        learning_outcomes:
          - "Explain goodwill as an intangible asset and list the factors that increase or decrease its value"
      - id: isc-12-accounts-ch02-t02
        title: "Average profit method: simple and weighted average"
        learning_outcomes:
          - "Value goodwill as a number of years' purchase of simple average profit after normalising past profits"
          - "Calculate weighted average profit when later years carry greater weights"
      - id: isc-12-accounts-ch02-t03
        title: "Super profit method"
        learning_outcomes:
          - "Calculate normal profit from capital employed and the normal rate of return, and find super profit"
          - "Value goodwill as a number of years' purchase of super profit"
      - id: isc-12-accounts-ch02-t04
        title: "Capitalisation method: capitalisation of average profit and of super profit"
        learning_outcomes:
          - "Value goodwill by capitalising average profit and deducting actual capital employed"
          - "Value goodwill by capitalising super profit at the normal rate of return"
      - id: isc-12-accounts-ch02-t05
        title: "Capital employed (net assets) for goodwill valuation"
        learning_outcomes:
          - "Compute capital employed as total assets (excluding purchased goodwill, non-trade investments and fictitious assets) less outside liabilities"
    removed_topics: []
    literature_texts: []
  - id: isc-12-accounts-ch03
    number: 3
    title: "Reconstitution of Partnership: Admission of a Partner"
    unit: "1. Partnership Accounts"
    topics:
      - id: isc-12-accounts-ch03-t01
        title: "New profit-sharing ratio, sacrificing ratio and gaining ratio on admission"
        learning_outcomes:
          - "Calculate the new profit-sharing ratio and sacrificing ratio when a new partner is admitted"
      - id: isc-12-accounts-ch03-t02
        title: "Treatment of goodwill on admission (AS-26): premium paid privately, retained, withdrawn, or not brought in cash"
        learning_outcomes:
          - "Pass journal entries for premium for goodwill brought in cash or kind, retained or withdrawn by old partners"
          - "Adjust the incoming partner's share of goodwill through his current account when he cannot bring it in cash"
      - id: isc-12-accounts-ch03-t03
        title: "Hidden goodwill and goodwill already appearing in the books"
        learning_outcomes:
          - "Calculate hidden goodwill from the incoming partner's capital and share of profit"
          - "Write off existing goodwill among old partners in the old ratio"
      - id: isc-12-accounts-ch03-t04
        title: "Revaluation Account on admission"
        learning_outcomes:
          - "Prepare a Revaluation Account and distribute the profit or loss among old partners"
      - id: isc-12-accounts-ch03-t05
        title: "Accumulated profits, reserves and losses on admission (including a single adjustment entry)"
        learning_outcomes:
          - "Distribute general reserve, workmen compensation reserve, investment fluctuation reserve, contingency reserve, P&L balance and deferred revenue expenditure among old partners"
          - "Record the transfer through a single gaining-sacrificing adjustment entry when reserves are to be left undisturbed"
      - id: isc-12-accounts-ch03-t06
        title: "Adjustment of capitals on admission and the new Balance Sheet (horizontal format)"
        learning_outcomes:
          - "Adjust old partners' capitals on the basis of the new partner's capital, and vice versa"
          - "Prepare partners' capital accounts and the Balance Sheet of the reconstituted firm"
      - id: isc-12-accounts-ch03-t07
        title: "Change in profit-sharing ratio among existing partners"
        learning_outcomes:
          - "Pass adjustment entries for goodwill, revaluation and accumulated profits when existing partners change their ratio"
    removed_topics:
      - "Memorandum revaluation account"
      - "Joint life policy and individual life policies"
      - "Admission of a partner during an accounting year"
    literature_texts: []
  - id: isc-12-accounts-ch04
    number: 4
    title: "Reconstitution of Partnership: Retirement and Death of a Partner"
