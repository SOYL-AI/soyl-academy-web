notes: >-
  SOYL default for any ISC Class 12 subject without its own chapter-test blueprint (CONTEXT section 9); not an official CISCE paper.
  Same four-section shape as the ISC 2027 specimen papers (sources/cisce.md isc-2027-specimen-860-mathematics, -861-physics,
  -862-chemistry, -863-biology): 1-mark objective items including assertion-reason, then 2-, 3- and 5-mark questions with internal choice
  in one question of each of Sections B, C and D. One chapter, 40 marks in 100 minutes (about the board pace of 70 marks in 3 hours).
