notes: >-
  SOYL default for any ISC Class 12 subject without its own unit-test blueprint (CONTEXT section 9); not an official CISCE paper.
  A 60-mark cut of the ISC 2027 specimen layout (sources/cisce.md isc-2027-specimen-860-mathematics, -861-physics, -862-chemistry,
  -863-biology): Section A of 1-mark objective items including assertion-reason, then 2-, 3- and 5-mark questions with internal choice in
  B, C and D, 150 minutes at about board pace. No chapter scopes, so it fills from whichever chapters the series planner groups into a
  unit test.
