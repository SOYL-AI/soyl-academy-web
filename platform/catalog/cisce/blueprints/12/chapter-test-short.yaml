sections:
  - id: A
    title: Section A - Objective (5 marks)
    instructions: Answer all questions. Multiple-choice and assertion-reason items carry 1 mark each.
    items:
      - {type: mcq, count: 4, marks_each: 1}
      - {type: assertion-reason, count: 1, marks_each: 1}
  - id: B
    title: Section B - Short answer (4 marks)
    instructions: Answer both questions. Internal choice in the second question.
    items:
      - {type: short, count: 1, marks_each: 2}
      - {type: short, count: 2, marks_each: 2, internal_choice: {attempt: 1, of: 2}}
  - id: C
    title: Section C - Short answer (6 marks)
    instructions: Answer both questions. Internal choice in the second question.
    items:
      - {type: short, count: 1, marks_each: 3}
      - {type: short, count: 2, marks_each: 3, internal_choice: {attempt: 1, of: 2}}
  - id: D
    title: Section D - Long answer (5 marks)
    instructions: Answer the question. It is set in parts (for example 2 + 3 marks), which may include a stimulus, a diagram or a calculation.
    items:
      - {type: long, count: 1, marks_each: 5}
source_status: unverified
source: lead-default
notes: >-
  SOYL default for any ISC Class 12 subject without its own chapter-test blueprint (CONTEXT section 9: a generic blueprint per board and
  subject, stored as editable config); not an official CISCE paper. It follows the four-section shape shared by the ISC 2027 specimen
  papers for Physics, Chemistry, Biology and Mathematics (sources/cisce.md isc-2027-specimen-860-mathematics, -861-physics,
  -862-chemistry, -863-biology): Section A of 1-mark objective items including assertion-reason, Section B of 2-mark questions, Section C
  of 3-mark questions and Section D of 5-mark questions set in parts, with internal choice in some questions of B, C and D. One chapter,
  20 marks in 50 minutes (about the board pace of 70 marks in 3 hours).
