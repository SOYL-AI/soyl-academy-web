notes: >-
  SOYL default for any ICSE Class 10 subject without its own chapter-test blueprint (CONTEXT section 9: a generic blueprint per board and
  subject, stored as editable config); not an official CISCE paper. It follows the shape every ICSE 2027 specimen paper shares
  (sources/cisce.md icse-2027-specimen-papers): a compulsory Section A that opens with 1-mark objective items and short answers, then a
  Section B of 10-mark structured questions with a choice. One chapter, 20 marks in 30 minutes (the board pace of 80 marks in 2 hours).
  The ten core subjects have their own chapter tests in icse-10/<subject>/blueprints/.
