# ICSE Class 8 Computer Studies - CISCE Curriculum for Upper Primary Classes VI-VIII (2016), Computer Studies, Class VIII part only.
# Source: platform/catalog/sources/cisce.md#cisce-upper-primary-curriculum (Computer Studies, Class VIII, Topics 1-6).
# Topic wording is our own summary of the official key concepts and learning outcomes.
subject_id: icse-8-computer-studies
academic_year: "2026-27"
source_status: verified
sources: [cisce-upper-primary-curriculum]
exam_notes: >-
  No board examination in Class 8. CISCE publishes a recommended theme-based curriculum (Curriculum for Upper Primary
  Classes VI-VIII, RDCD, 2016) with learning outcomes per class; it prescribes no textbooks, no paper pattern and no
  marks weightage. Schools choose their own textbooks and set their own unit tests and term examinations; the curriculum
  asks for continuous assessment through oral and written work, projects, activities and portfolios as well as tests.
  The Class VIII Computer Studies curriculum has six topics (operating systems and GUI, spreadsheet functions and
  charts, algorithms and flowcharts, program coding, app development, networks), each with learning outcomes and key
  concepts; SOYL grouped them into 10 teachable chapters in curriculum order. Program coding may be taught in any
  programming language chosen by the school, and apps may be built with any free app-development tool; schools assess
  hands-on work through practical tasks, projects, quizzes and worksheets as well as written tests.
