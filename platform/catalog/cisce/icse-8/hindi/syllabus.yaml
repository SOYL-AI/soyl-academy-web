# Source: platform/catalog/sources/cisce.md#cisce-upper-primary-curriculum (Hindi, Class VIII, Themes 1-3).
# Topic wording is our own summary of the official learning outcomes and suggested content.
subject_id: icse-8-hindi
academic_year: "2026-27"
source_status: verified
sources: [cisce-upper-primary-curriculum]
exam_notes: >-
  No board examination in Class 8. CISCE publishes a recommended theme-based curriculum (Curriculum for Upper Primary
  Classes VI-VIII, RDCD, 2016) with learning outcomes per class; it prescribes no textbooks, no paper pattern and no
  marks weightage. Schools choose their own textbooks and set their own unit tests and term examinations; the curriculum
  asks for continuous assessment through oral and written work, projects, activities and portfolios as well as tests.
  Hindi is the second language in the CISCE curriculum. The Hindi section sets out three themes for Class VIII -
  Listening and Speaking, Reading and Writing, and Grammar and Language - each with learning outcomes, suggested content
  and teaching processes; it names no prescribed texts, so this file has no literature texts. SOYL grouped the themes
  into 16 teachable chapters in curriculum order. The Hindi pages of the source PDF use mixed Unicode and legacy fonts;
  SOYL read them from the PDF text layer and checked unclear words against the page image. The curriculum suggests
  essays of about 200 words in Class VIII and adds voice, indeclinables, compound and causative verbs, sentence types by
  structure, notices, reports and headlines to the Class VII work.
units:
