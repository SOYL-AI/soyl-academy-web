# ICSE Class 8 Performing Arts - CISCE Curriculum: Performing Arts (Classes VI-VIII), Class VIII part.
# Source: platform/catalog/sources/cisce.md#cisce-performing-arts-vi-viii.
# Theory only (music, dance and theatre concepts, forms and terminology); topic wording is our own summary.
subject_id: icse-8-performing-arts
academic_year: "2026-27"
source_status: verified
sources: [cisce-performing-arts-vi-viii]
exam_notes: >-
  No board examination in Class 8: schools assess Performing Arts internally through observation, participation,
  presentations and performances, and choose their own resources. The CISCE curriculum covers Music, Dance and
  Theatre through eight themes, each revisited in Classes VI-VIII: Sound, Voice and Speech; Space; Rhythm; Body
  Movement; Composition; Art Vocabulary; Performance; and Art Appreciation. SOYL covers the knowledge side of the
  Class VIII themes (concepts, forms, terminology and appreciation) as 9 chapters in curriculum order (Sound,
  Voice and Speech split into voice/speech and music). Practical work - pranayama and voice exercises, radio
  plays, paper theatre, singing ragas and songs, dance dramas, choreography, yogasanas, beatboxing, stagecraft,
  full performances and visits - is practical and not covered as lessons. No marks weightage is published.
