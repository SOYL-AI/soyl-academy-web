# ICSE Class 8 English - CISCE Curriculum for Upper Primary Classes VI-VIII (2016), English, Class VIII part only.
# Source: platform/catalog/sources/cisce.md#cisce-upper-primary-curriculum (English, Class VIII: four skill strands).
# Topic wording is our own summary of the official learning outcomes and suggested content.
subject_id: icse-8-english
academic_year: "2026-27"
source_status: verified
sources: [cisce-upper-primary-curriculum]
exam_notes: >-
  No board examination in Class 8. CISCE publishes a recommended theme-based curriculum (Curriculum for Upper Primary
  Classes VI-VIII, RDCD, 2016) with learning outcomes per class; it prescribes no textbooks, no paper pattern and no
  marks weightage. Schools choose their own textbooks and set their own unit tests and term examinations; the curriculum
  asks for continuous assessment through oral and written work, projects, activities and portfolios as well as tests.
  English is taught as the first language, with language and literature together; CISCE prescribes no literature texts
  at this stage. The curriculum sets out four strands for Class VIII - Listening and Speaking, Reading, Writing, and
  Grammar and Vocabulary in Context - each with learning outcomes and suggested content; SOYL grouped them into 14
  teachable chapters in curriculum order. The curriculum gives a suggested (not prescribed) reading list for Class VIII,
  e.g. The Hobbit (J.R.R. Tolkien), A Wizard of Earthsea (Ursula Le Guin), Watership Down (Richard Adams), To Kill a
  Mockingbird (Harper Lee), The Boy in the Striped Pyjamas (John Boyne), A Tale of Two Cities and David Copperfield
  (Charles Dickens), The Old Man and the Sea (Ernest Hemingway), The Pearl (John Steinbeck), Sherlock Holmes stories
  (Arthur Conan Doyle), P.G. Wodehouse and the Ramayana/Mahabharata retold by C. Rajagopalachari; teachers may choose
  any age-appropriate books, so SOYL covers reading skills rather than particular texts.
units:
  - { name: "Listening and Speaking", marks: null }
  - { name: "Reading", marks: null }
  - { name: "Writing", marks: null }
  - { name: "Grammar and Vocabulary in Context", marks: null }
