# ICSE Class 8 History & Civics - CISCE Upper Primary curriculum (Classes VI-VIII), Class VIII part.
# Source: platform/catalog/sources/cisce.md#cisce-upper-primary-curriculum (HCG section, Class VIII: The Modern World + Civics);
# RDCD History and Civics resource used only to sharpen scope. Topic wording is our own summary of the official key concepts.
subject_id: icse-8-history-civics
academic_year: "2026-27"
source_status: verified
sources: [cisce-upper-primary-curriculum, cisce-upper-primary-history-civics-resource]
exam_notes: >-
  No board examination in Class 8: schools set their own unit tests and term examinations and choose their own
  textbooks (CISCE does not prescribe books below Class IX). History & Civics is taught as part of History, Civics
  and Geography (HCG). The CISCE curriculum is theme-based, with key concepts and learning outcomes per theme:
  Class VIII History covers The Modern World in eight themes (A Period of Transition, The Growth of Nationalism,
  India in the 18th Century, Traders to Rulers, British Policies and Impacts, The Great Uprising of 1857,
  Socio-Religious Reforms, India's Struggle for Freedom) and Civics covers two themes (the three organs of the
  Indian Government; the United Nations). SOYL grouped these themes into 16 teachable chapters in curriculum
  order; the freedom struggle is split into three chapters following the curriculum's Phase 1 and Phase 2. Several
  key concepts are marked "brief" in the curriculum; these limits are noted in the topic titles and
  removed_topics. No marks weightage is published.
units:
  - { name: "History: The Modern World", marks: null }
  - { name: "Civics", marks: null }
