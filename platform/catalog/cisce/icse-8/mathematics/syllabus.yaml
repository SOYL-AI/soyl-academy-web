    topics:
      - id: icse-8-mathematics-ch02-t01
        title: "Integers as exponents: writing repeated multiplication and division"
        learning_outcomes:
          - "Write repeated multiplication and division using integral (including zero and negative) exponents"
          - "Evaluate powers with zero and negative exponents"
      - id: icse-8-mathematics-ch02-t02
        title: "Laws of exponents with integral powers"
        learning_outcomes:
          - "Describe and verify the laws of exponents with integral powers using patterns"
      - id: icse-8-mathematics-ch02-t03
        title: "Simplifying expressions using the laws of exponents"
        learning_outcomes:
          - "Simplify and evaluate numerical expressions involving integral powers"
          - "Solve simple equations such as 2^x = 1/8 by comparing powers"
    removed_topics: []
    literature_texts: []
  - id: icse-8-mathematics-ch03
    number: 3
    title: "Squares, Square Roots, Cubes and Cube Roots"
    unit: "Theme 1: Number System"
    topics:
      - id: icse-8-mathematics-ch03-t01
        title: "Square numbers and their patterns"
        learning_outcomes:
          - "Find squares of numbers and identify perfect squares from their properties and patterns"
      - id: icse-8-mathematics-ch03-t02
        title: "Square roots by prime factorisation"
        learning_outcomes:
          - "Find the square root of a perfect square by prime factorisation"
      - id: icse-8-mathematics-ch03-t03
        title: "Square roots by the division method (up to 4 digits, up to 2 decimal places)"
        learning_outcomes:
          - "Find square roots of whole numbers and decimals by the long-division method"
      - id: icse-8-mathematics-ch03-t04
        title: "Estimating square roots"
        learning_outcomes:
          - "Estimate the square root of a non-perfect square to the nearest whole number"
      - id: icse-8-mathematics-ch03-t05
        title: "Cubes and cube roots by prime factorisation (numbers up to 3 digits)"
        learning_outcomes:
          - "Find cubes of numbers and identify perfect cubes"
          - "Find the cube root of a perfect cube by prime factorisation"
      - id: icse-8-mathematics-ch03-t06
        title: "Estimating cube roots"
        learning_outcomes:
          - "Estimate the cube root of a number by locating it between consecutive perfect cubes"
    removed_topics:
      - "Square roots of numbers with more than 4 digits or more than 2 decimal places"
