# ICSE Class 8 Mathematics - CISCE Curriculum for Upper Primary Classes VI-VIII (2016), Mathematics, Class VIII part only.
# Source: platform/catalog/sources/cisce.md#cisce-upper-primary-curriculum (Mathematics, Class VIII, Themes 1-6).
# Topic wording is our own summary of the official key concepts and learning outcomes.
subject_id: icse-8-mathematics
academic_year: "2026-27"
source_status: verified
sources: [cisce-upper-primary-curriculum]
exam_notes: >-
  No board examination in Class 8. CISCE publishes a recommended theme-based curriculum (Curriculum for Upper Primary
  Classes VI-VIII, RDCD, 2016) with learning outcomes per class; it prescribes no textbooks, no paper pattern and no
  marks weightage. Schools choose their own textbooks and set their own unit tests and term examinations; the curriculum
  asks for continuous assessment through oral and written work, projects, activities and portfolios as well as tests.
  The Class VIII curriculum has six themes (Number System, Ratio and Proportion, Algebra, Geometry, Mensuration, Data
  Handling), each with learning outcomes and key concepts; SOYL grouped them into 16 teachable chapters in curriculum
  order. The Geometry learning outcomes add the Cartesian plane and reading linear graphs, included here as a chapter.
  The Algebra introduction also mentions systems of two linear equations, but these are not in the Class VIII key
  concepts or learning outcomes, so SOYL does not include them.
units:
  - { name: "Theme 1: Number System", marks: null }
  - { name: "Theme 2: Ratio and Proportion", marks: null }
  - { name: "Theme 3: Algebra", marks: null }
  - { name: "Theme 4: Geometry", marks: null }
  - { name: "Theme 5: Mensuration", marks: null }
  - { name: "Theme 6: Data Handling", marks: null }
chapters:
  - id: icse-8-mathematics-ch01
    number: 1
    title: "Rational Numbers"
    unit: "Theme 1: Number System"
    topics:
      - id: icse-8-mathematics-ch01-t01
        title: "Properties of rational numbers in general form: closure, commutativity, associativity, distributivity"
        learning_outcomes:
          - "State and verify the properties of operations on rational numbers using general forms such as a/b + c/d"
          - "Use the properties to simplify calculations"
      - id: icse-8-mathematics-ch01-t02
        title: "Identity and inverse elements for rational numbers"
        learning_outcomes:
          - "Identify the additive and multiplicative identity and inverse of a rational number"
      - id: icse-8-mathematics-ch01-t03
        title: "Representing rational numbers on the number line"
        learning_outcomes:
          - "Mark rational numbers accurately on a number line"
      - id: icse-8-mathematics-ch01-t04
        title: "Rational numbers between two rational numbers"
        learning_outcomes:
          - "Find rational numbers between two given rational numbers, for example by taking their mean"
          - "Explain why there are infinitely many rational numbers between any two rational numbers"
      - id: icse-8-mathematics-ch01-t05
        title: "Word problems on rational numbers"
        learning_outcomes:
          - "Solve multi-step word problems, including problems on area, using rational numbers"
    removed_topics: []
    literature_texts: []
  - id: icse-8-mathematics-ch02
