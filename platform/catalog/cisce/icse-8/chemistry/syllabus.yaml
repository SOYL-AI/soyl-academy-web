# ICSE Class 8 Chemistry - CISCE Curriculum for Upper Primary Classes VI-VIII (2016), Class VIII part only.
# Source: platform/catalog/sources/cisce.md#cisce-upper-primary-curriculum (Chemistry, Class VIII, Themes 1-9);
# scope sharpened with #cisce-upper-primary-chemistry-resource. Topic wording is our own summary of the official themes.
subject_id: icse-8-chemistry
academic_year: "2026-27"
source_status: verified
sources: [cisce-upper-primary-curriculum, cisce-upper-primary-chemistry-resource]
exam_notes: >-
  No board examination in Class 8. CISCE publishes a recommended theme-based curriculum (Chemistry taught as a separate
  science from Class VI) with learning outcomes per class; it prescribes no textbooks, no paper pattern and no marks
  weightage. Schools choose their own textbooks and set their own unit tests, term examinations and practical/activity
  assessment (laboratory demonstrations and simple experiments such as preparing hydrogen and carbon dioxide).
  The Class VIII curriculum has nine themes; SOYL grouped them into 15 teachable chapters in curriculum order.
  Students move from word equations (Class VII) to formulae derived from valency and balanced chemical equations.
units:
  - { name: "Theme 1: Matter", marks: null }
  - { name: "Theme 2: Physical and Chemical Changes", marks: null }
  - { name: "Theme 3: Elements, Compounds and Mixtures", marks: null }
  - { name: "Theme 4: Atomic Structure", marks: null }
  - { name: "Theme 5: Language of Chemistry", marks: null }
  - { name: "Theme 6: Chemical Reactions", marks: null }
  - { name: "Theme 7: Hydrogen", marks: null }
  - { name: "Theme 8: Water", marks: null }
  - { name: "Theme 9: Carbon and its Compounds", marks: null }
chapters:
  - id: icse-8-chemistry-ch01
    number: 1
    title: "Matter: Kinetic Theory and Conservation of Mass"
    unit: "Theme 1: Matter"
    topics:
      - id: icse-8-chemistry-ch01-t01
        title: "Main postulates of the kinetic molecular theory of matter"
        learning_outcomes:
          - "State the main postulates of the kinetic theory of matter"
      - id: icse-8-chemistry-ch01-t02
        title: "Inter-particle space, inter-particle attraction and collisions in solids, liquids and gases"
        learning_outcomes:
          - "Compare solids, liquids and gases by inter-particle space and inter-particle attraction"
      - id: icse-8-chemistry-ch01-t03
        title: "Explaining change of state using inter-particle space, attraction and collision"
        learning_outcomes:
          - "Explain melting and boiling as the weakening of inter-particle attraction when particles gain energy"
          - "Explain condensation and freezing when particles lose energy"
      - id: icse-8-chemistry-ch01-t04
        title: "Law of conservation of mass: statement and demonstration (barium chloride and sodium sulphate)"
        learning_outcomes:
          - "State the law of conservation of mass"
          - "Describe an experiment showing that total mass stays the same in a chemical change"
          - "Explain why the mass of atmospheric oxygen must be counted when a substance burns"
    removed_topics: []
    literature_texts: []
  - id: icse-8-chemistry-ch02
    number: 2
    title: "Physical and Chemical Changes"
    unit: "Theme 2: Physical and Chemical Changes"
    topics:
      - id: icse-8-chemistry-ch02-t01
        title: "Review: physical changes (no new substance) and chemical changes (new substance with new properties)"
        learning_outcomes:
          - "Differentiate physical and chemical changes with examples learnt earlier"
      - id: icse-8-chemistry-ch02-t02
        title: "Other ways of classifying changes: slow/fast, reversible/irreversible, periodic/non-periodic"
        learning_outcomes:
          - "Classify given changes as slow or fast, reversible or irreversible, periodic or non-periodic"
      - id: icse-8-chemistry-ch02-t03
        title: "Classifying everyday changes: curd from milk, rotting of eggs, rusting, melting of ice, sublimation of camphor"
        learning_outcomes:
          - "Classify a list of everyday changes as physical or chemical and justify each choice"
          - "Perform simple activities to show well-known physical and chemical changes"
    removed_topics: []
    literature_texts: []
