      - id: icse-8-chemistry-ch03-t02
        title: "Separating a solid-solid mixture with one soluble component (calcium carbonate and sodium chloride)"
        learning_outcomes:
          - "Separate chalk and common salt by dissolving, filtration and evaporation"
      - id: icse-8-chemistry-ch03-t03
        title: "Separating immiscible liquids (kerosene and water)"
        learning_outcomes:
          - "Separate kerosene from water with a separating funnel"
      - id: icse-8-chemistry-ch03-t04
        title: "Principle behind each separation technique"
        learning_outcomes:
          - "Explain the property difference that each separation technique uses"
    removed_topics: []
    literature_texts: []
