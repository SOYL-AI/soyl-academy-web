        title: "Displacement reactions (zinc displacing copper from copper sulphate)"
        learning_outcomes:
          - "Explain displacement using zinc and copper sulphate solution"
      - id: icse-8-chemistry-ch07-t05
        title: "Double displacement reactions (sodium chloride and silver nitrate)"
        learning_outcomes:
          - "Identify double displacement reactions in which ions are exchanged and a precipitate may form"
      - id: icse-8-chemistry-ch07-t06
        title: "Exothermic and endothermic reactions; neutralisation of an acid by a base"
        learning_outcomes:
          - "Classify neutralisation as exothermic and dissolving ammonium chloride in water as endothermic"
          - "Identify the type of a given chemical reaction"
