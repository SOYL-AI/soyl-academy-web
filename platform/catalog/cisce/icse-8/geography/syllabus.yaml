# ICSE Class 8 Geography - CISCE Upper Primary curriculum (Classes VI-VIII), Class VIII part.
# Source: platform/catalog/sources/cisce.md#cisce-upper-primary-curriculum (HCG section, Geography, Class VIII);
# RDCD Geography resource used only to sharpen scope. Topic wording is our own summary of the official key concepts.
subject_id: icse-8-geography
academic_year: "2026-27"
source_status: verified
sources: [cisce-upper-primary-curriculum, cisce-upper-primary-geography-resource]
exam_notes: >-
  No board examination in Class 8: schools set their own unit tests and term examinations and choose their own
  textbooks (CISCE does not prescribe books below Class IX). Geography is taught as part of History, Civics and
  Geography (HCG). The CISCE curriculum is theme-based, with key concepts and learning outcomes per theme; Class
  VIII has eight themes (Representation of Geographical Features, Population Dynamics, Migration, Urbanisation,
  Natural and Man-made Disasters, Asia: The Largest Continent, India: Geographical Features, India: Human
  Resources). SOYL grouped these into 10 teachable chapters in curriculum order. Toposheet interpretation
  (contours, slopes, landforms, settlement patterns) and map work on Asia and India are assessed within the
  themes; disaster preparedness drills are practical activities. No marks weightage is published.
units: []
