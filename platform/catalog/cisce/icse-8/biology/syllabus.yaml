      - id: icse-8-biology-ch05-t02
        title: "Main organs of the male reproductive system"
        learning_outcomes:
          - "Name the main organs of the male reproductive system and state their functions"
      - id: icse-8-biology-ch05-t03
        title: "Main organs of the female reproductive system"
        learning_outcomes:
          - "Name the main organs of the female reproductive system and state their functions"
    removed_topics: []
    literature_texts: []
  - id: icse-8-biology-ch06
    number: 6
    title: "Ecosystems and their Components"
    unit: "Theme 3: Ecosystems"
