      - id: icse-8-biology-ch07-t03
        title: "One-way flow of energy and cycling of nutrients"
        learning_outcomes:
          - "Explain that energy flows in one direction from the sun through producers and consumers to decomposers"
      - id: icse-8-biology-ch07-t04
        title: "Interdependence: symbiosis, parasitism and predation"
        learning_outcomes:
          - "Describe symbiosis, parasitism and predation with one example each"
