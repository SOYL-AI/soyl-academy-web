# ICSE Class 8 Biology - CISCE Curriculum for Upper Primary Classes VI-VIII (2016), Class VIII part only.
# Source: platform/catalog/sources/cisce.md#cisce-upper-primary-curriculum (Biology, Class VIII, Themes 1-6);
# scope sharpened with #cisce-upper-primary-biology-resource. Topic wording is our own summary of the official themes.
subject_id: icse-8-biology
academic_year: "2026-27"
source_status: verified
sources: [cisce-upper-primary-curriculum, cisce-upper-primary-biology-resource]
exam_notes: >-
  No board examination in Class 8. CISCE publishes a recommended theme-based curriculum (Biology taught as a separate
  science from Class VI) with learning outcomes per class; it prescribes no textbooks, no paper pattern and no marks
  weightage. Schools choose their own textbooks and set their own unit tests, term examinations and practical/activity
  assessment (experiments on osmosis and transpiration, flower dissection, labelled diagrams, field visits, projects).
  The Class VIII curriculum has six themes; SOYL grouped them into 15 teachable chapters in curriculum order.
units:
  - { name: "Theme 1: Transport of Food and Minerals in Plants", marks: null }
  - { name: "Theme 2: Reproduction in Plants and Animals", marks: null }
  - { name: "Theme 3: Ecosystems", marks: null }
  - { name: "Theme 4: Human Body - Endocrine, Circulatory and Nervous Systems", marks: null }
  - { name: "Theme 5: Health and Hygiene", marks: null }
  - { name: "Theme 6: Food Production", marks: null }
chapters:
  - id: icse-8-biology-ch01
    number: 1
    title: "Transport in Plants"
    unit: "Theme 1: Transport of Food and Minerals in Plants"
    topics:
      - id: icse-8-biology-ch01-t01
        title: "Need for a transport system; diffusion in unicellular and simple plants (Chlamydomonas, Spirogyra)"
        learning_outcomes:
          - "Explain why simple plants manage with diffusion while large plants need a vascular system"
      - id: icse-8-biology-ch01-t02
        title: "Diffusion: definition and examples"
        learning_outcomes:
          - "Define diffusion and demonstrate it with a simple experiment"
      - id: icse-8-biology-ch01-t03
        title: "Osmosis and the semipermeable membrane; potato osmoscope"
        learning_outcomes:
          - "Define osmosis and semipermeable membrane"
          - "Describe and draw the potato osmoscope experiment and explain its result"
      - id: icse-8-biology-ch01-t04
        title: "Root pressure and active transport"
        learning_outcomes:
          - "Define root pressure and active transport"
          - "Distinguish active transport from diffusion"
      - id: icse-8-biology-ch01-t05
        title: "Xylem and phloem: structure and function"
        learning_outcomes:
          - "Describe the structure and function of xylem and phloem"
          - "Locate xylem and phloem in a transverse section of a stem"
          - "Explain the coloured-water experiment with a white-flowered twig"
    removed_topics: []
    literature_texts: []
  - id: icse-8-biology-ch02
    number: 2
    title: "Transpiration and Mineral Nutrition"
    unit: "Theme 1: Transport of Food and Minerals in Plants"
    topics:
      - id: icse-8-biology-ch02-t01
        title: "Transpiration: definition, importance and role in xylem transport"
        learning_outcomes:
          - "Define transpiration and explain its role in pulling water up the xylem"
          - "Demonstrate transpiration by covering a potted plant with a transparent bag"
      - id: icse-8-biology-ch02-t02
        title: "Factors affecting the rate of transpiration"
        learning_outcomes:
          - "Predict how light, temperature, humidity and wind change the rate of transpiration"
      - id: icse-8-biology-ch02-t03
        title: "Macronutrients and micronutrients needed by plants"
        learning_outcomes:
          - "Classify mineral nutrients as macronutrients or micronutrients by the quantity needed"
      - id: icse-8-biology-ch02-t04
        title: "Deficiency symptoms and diseases caused by lack of essential nutrients (three examples)"
        learning_outcomes:
          - "Relate three mineral deficiencies to their symptoms in plants"
    removed_topics: []
    literature_texts: []
  - id: icse-8-biology-ch03
    number: 3
    title: "Asexual Reproduction"
    unit: "Theme 2: Reproduction in Plants and Animals"
    topics:
      - id: icse-8-biology-ch03-t01
        title: "Reproduction for continuity of species; asexual and sexual reproduction"
        learning_outcomes:
          - "Distinguish asexual from sexual reproduction"
      - id: icse-8-biology-ch03-t02
        title: "Binary fission, budding (yeast, Hydra), fragmentation and spore formation"
        learning_outcomes:
          - "Describe each method with a suitable example and diagram"
      - id: icse-8-biology-ch03-t03
        title: "Natural vegetative propagation (potato, Bryophyllum, grass, money plant)"
        learning_outcomes:
          - "Explain how plants such as potato and Bryophyllum multiply vegetatively"
      - id: icse-8-biology-ch03-t04
        title: "Artificial propagation: cuttings and budding (rose, jasmine); tissue culture"
        learning_outcomes:
          - "Describe how gardeners multiply roses by cuttings and budding"
          - "Outline the basic process of tissue culture and its economic importance"
      - id: icse-8-biology-ch03-t05
        title: "Advantages and disadvantages of vegetative propagation"
        learning_outcomes:
          - "List advantages and disadvantages of vegetative propagation"
    removed_topics: []
    literature_texts: []
  - id: icse-8-biology-ch04
    number: 4
    title: "Sexual Reproduction in Plants"
    unit: "Theme 2: Reproduction in Plants and Animals"
    topics:
      - id: icse-8-biology-ch04-t01
        title: "Parts of a typical flower: four whorls, their structure and function"
        learning_outcomes:
          - "Identify the four whorls in a dissected bisexual flower (mustard, china rose)"
          - "State the function of each whorl"
      - id: icse-8-biology-ch04-t02
        title: "Pollination: self-pollination and cross-pollination"
        learning_outcomes:
          - "Distinguish self-pollination from cross-pollination"
      - id: icse-8-biology-ch04-t03
        title: "Agents of pollination: insect, wind and water; three characteristics of flowers of each kind"
        learning_outcomes:
          - "State three characteristics each of insect-, wind- and water-pollinated flowers with examples"
          - "Relate bees and butterflies visiting flowers to pollination"
      - id: icse-8-biology-ch04-t04
        title: "Fertilisation in brief (flow chart) and formation of fruit and seed"
        learning_outcomes:
          - "Draw a flow chart from pollination to fertilisation to fruit formation"
      - id: icse-8-biology-ch04-t05
        title: "Artificial pollination (emasculation and bagging)"
        learning_outcomes:
          - "Explain why and how plant breeders carry out artificial pollination"
    removed_topics: []
    literature_texts: []
  - id: icse-8-biology-ch05
    number: 5
