      - id: icse-8-biology-ch06-t04
        title: "Forest ecosystem: flora and fauna"
        learning_outcomes:
          - "Relate the flora and fauna of a forest ecosystem to one another"
          - "Identify producers, consumers, decomposers and abiotic factors on a visit to a garden or forest"
    removed_topics:
      - "Ecosystems other than the forest ecosystem (only the forest ecosystem is taught)"
    literature_texts: []
  - id: icse-8-biology-ch07
