# ICSE Class 8 Physical Education - CISCE Curriculum: Physical Education (Classes VI-VIII), Class VIII part.
# Source: platform/catalog/sources/cisce.md#cisce-physical-education-vi-viii.
# Theory only (fitness concepts, health awareness, rules and techniques of games, safety); topic wording is our own summary.
subject_id: icse-8-physical-education
academic_year: "2026-27"
source_status: verified
sources: [cisce-physical-education-vi-viii]
exam_notes: >-
  No board examination in Class 8: Physical Education is assessed by schools through participation and performance
  in activities. The CISCE curriculum has two themes common to Classes VI-VIII - Physical Fitness Components
  (speed, agility, flexibility, coordination, balance, endurance, strength) and Games/Sports Skills (any two games
  or sports chosen by the school from a list such as football, basketball, volleyball, hockey, cricket, kabaddi,
  kho-kho, athletics, gymnastics, swimming, combat sports and racquet games) - plus awareness of diet, nutrition,
  hygiene and safety. Class-wise differences lie in the suggested activities. SOYL covers the knowledge side as 11
  chapters: fitness concepts illustrated by the Class VIII activities (100 m and 1000 m runs, sit-and-reach,
  plank, pull-ups, vertical jump, etc.), swimming strokes, health awareness, classification and rules of games,
  and the techniques and rules of the games used in the Class VIII activities (handball, volleyball, kho-kho,
  cricket, table tennis, boxing). Actual drills, fitness activities and game play are practical and not covered as
  lessons. No marks weightage is published.
