notes: >-
  SOYL default modelled on the CBSE board pattern (CONTEXT section 9: "use a generic blueprint per board and subject, stored as editable

  config"); not an official CBSE paper. Item types and marks follow the 2026-27 CBSE board style (MCQ/assertion-reason 1, short 2-3, long 5,

  case-based 4, about one-third internal choice) so practice transfers to the board paper. Unit test: the chapters of one syllabus unit (for
  Classes 10 and 12 also used for the three half-syllabus tests of the

  board test series, CONTEXT section 10), 50 marks in 2 hours.
