notes: >-
  SOYL default modelled on the CBSE board pattern (CONTEXT section 9: "use a generic blueprint per board and subject, stored as editable

  config"); not an official CBSE paper. Item types and marks follow the 2026-27 CBSE board style (MCQ/assertion-reason 1, short 2-3, long 5,

  case-based 4, about one-third internal choice) so practice transfers to the board paper. Half-yearly exam on the first half of the
  syllabus: 80 marks in 3 hours (+ 20 internal assessment in the CBSE scheme), the same layout as the CBSE Class X board

  paper family (20 x 1, 6 x 2, 7 x 3, 3 x 4 case-based, 3 x 5). Subjects whose theory paper is 70 marks (Class 11 sciences etc.) have their
  own

  override where one exists; otherwise the assembler scales this pattern.
