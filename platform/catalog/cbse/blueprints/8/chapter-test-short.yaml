notes: >-
  SOYL default modelled on the CBSE board pattern (CONTEXT section 9: "use a generic blueprint per board and subject, stored as editable

  config"); not an official CBSE paper. Item types and marks follow the 2026-27 CBSE board style (MCQ/assertion-reason 1, short 2-3, long 5,

  case-based 4, about one-third internal choice) so practice transfers to the board paper. Chapter test (short): one chapter, 20 marks in 40
  minutes, aligned with the CBSE 10 Science exemplar chapter tests

  (platform/content-templates/exemplars/science/cbse-10-science-ch01/tests.json). For Classes 7-8 the assembler may replace the
  assertion-reason item with an MCQ.
