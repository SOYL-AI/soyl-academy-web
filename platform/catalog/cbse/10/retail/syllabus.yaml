# CBSE Class 10 Retail (401), 2026-27 skill subject (job role: Store Operations Assistant). Theory component only (theory 50 + practical 50).
# Part A Employability Skills from the CBSE Employability Skills (Class X) curriculum; Part B from the subject curriculum.
subject_id: cbse-10-retail
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-retail-401-2026-27
  - cbse-x-employability-skills-2026-27
  - cbse-skill-curriculum-2026-27
