exam_notes: >-
  Theory 30 marks (2 hours) + practical 50 + internal assessment 20. Theory paper (CBSE 2026-27 SQP): Section A 8 MCQs x 1; Section B 5
  short answers x 2, each with an internal choice; Section C 2 long answers x 6, each with an internal choice (includes notation writing).
  Practical (vilambit and drut khayal, devotional song, raga recognition, theka recitation) is assessed outside the theory paper and is
  marked board_assessed: false here. Two board exams for Class 10: this subject is examined only in the February main exam; it can be taken
  in the May second exam only under the compartment category (improvement in May is limited to Science, Mathematics, Social Science and
  languages; notification of 14-02-2026).
