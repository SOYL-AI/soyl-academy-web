# CBSE Class 10 Limboo (025), 2026-27. Sections, marks, grammar items and lessons as printed in the CBSE 2026-27 Limboo
# Class IX-X syllabus (Class X pages). Books are the Government of Sikkim Limboo textbooks (CBSE names sections, not books).
# CBSE prints every Limboo term and lesson title only in Roman transliteration; titles here keep CBSE's romanisation
# (the script CBSE actually uses) because SOYL could not verify native-script (Limbu / Sirijanga) spellings. Native-script titles
# are to be added in language review (see the M1 languages handoff). Lesson titles only; no text is reproduced (CONTEXT §8).
