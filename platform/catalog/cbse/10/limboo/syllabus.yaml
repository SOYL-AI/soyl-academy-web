exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (periodic assessment 5, multiple assessment 5, portfolio 5, subject
  enrichment 5). Course structure: reading 15, writing 15, grammar 20, literature 30. Question-wise: A unseen
  comprehension 10 (four passages, attempt two, five MCQs each on understanding, reasoning and HOTS); B grammar 14 (8
  MCQs and 3 short answers of 2 marks); C seen comprehension 5 (one of two textbook paragraphs, MCQs); D literature -
  Patila Sung short answers 5x2, Kheda Sung short answers, Sammila Sung MCQs, Sodhungenbarey Sewading Khaunha MCQs; E
  writing - letter 5, essay 5, translation 5, writing about an author 5. CBSE's summary is 38 MCQ, 22 descriptive and 20
  essay-type marks. Two board exams for Class 10: February main (compulsory) and an optional May second exam for
  improvement in up to three of Science, Mathematics, Social Science and languages.
units:
  - name: Reading (unseen and seen comprehension)
    marks: 15
  - name: Writing
    marks: 15
  - name: Grammar
    marks: 20
  - name: Literature
    marks: 30
