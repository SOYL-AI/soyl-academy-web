# CBSE Class 10 Electronics and Hardware (420), 2026-27 skill subject (job role: Field Technician - Other Home Appliances). Theory component only (theory 50 + practical 50).
# Part A Employability Skills from the CBSE Employability Skills (Class X) curriculum; Part B from the subject curriculum.
subject_id: cbse-10-electronics-and-hardware
academic_year: "2026-27"
source_status: verified
