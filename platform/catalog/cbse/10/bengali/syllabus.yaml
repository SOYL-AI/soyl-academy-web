# CBSE Class 10 Bengali (005), 2026-27. Sections, marks, grammar items, writing tasks and every prescribed lesson
# (CBSE prints titles and authors in Roman transliteration; Bengali-script spellings are SOYL's) from the CBSE 2026-27
# Bengali IX-X syllabus. Textbook: Sahitya Sanchayan Bangla (Pratham Bhasha) Dasam Shreni (WBBSE / West Bengal Text Book
# Corporation); supplementary reader Galpaguchchha (pathya sanskaran, Rabindranath Tagore, Visva-Bharati); grammar:
# Saraswati Bangla Byakaran O Rachana and Ucchatara Bangla Byakaran (IX-X). Titles and authors only; no text reproduced.
