exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (periodic tests 5, multiple assessment 5, portfolio 5, subject enrichment 5). Part A
  (MCQ, 25%): two unseen passages of 150-200 words, each with four direct questions and one grammar-based question (sandhi, antonym,
  synonym, sadhu-chalit) 2x5=10; prose MCQs 5; supplementary reader MCQs 5. Part B (subjective): grammar 20 - sandhi (consonant and visarga)
  6x1, samas (dvandva, karmadharaya, avyayibhava) 5x1, sentence transformation (simple, complex, compound) 5x1, sadhu to chalit conversion
  4x1; prose 2 + 3 + (2+3); poetry 5 + 2 + 3; supplementary reader 2 + 2x3; creative writing 12 - letter to the editor (120-150 words) 6 and
  paragraph (150-180 words) 6. Word limits: 5 marks 120-130 words, 3 marks 50-60, 2 marks 25-30. Internal choice only in Part B (grammar 5
  marks, one 2-mark prose, one 5-mark poetry, one 2-mark supplementary question, both writing tasks). Two board exams for Class 10: February
  main (compulsory) and an optional May second exam for improvement in up to three of Science, Mathematics, Social Science and languages.
