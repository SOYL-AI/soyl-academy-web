# CBSE Class 10 Physical Activity Trainer (418), 2026-27 skill subject (job role: Early Years Physical Activity Facilitator). Theory component only (theory 50 + practical 50).
# Part A Employability Skills from the CBSE Employability Skills (Class X) curriculum; Part B from the subject curriculum.
subject_id: cbse-10-physical-activity-trainer
academic_year: "2026-27"
