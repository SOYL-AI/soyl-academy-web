# CBSE Class 10 Telugu (Telangana) (089), 2026-27. Sections, marks, grammar items (with CBSE's closed lists of
# technical terms, idioms and proverbs), writing tasks and every prescribed lesson as listed (in Roman transliteration,
# without authors) in the CBSE 2026-27 Telugu (Telangana) IX-X syllabus. Textbook: Vennela - V, Telugu Vachakam
# (Government of Telangana, new edition, republished 2025). Telugu-script titles are SOYL's rendering of CBSE's
# transliteration. Titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-10-telugu-telangana
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-telugu-telangana-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
exam_notes: >-
  Theory 80 marks (3 hours), 18 questions + internal assessment 20 (periodic test best of two 5, multiple assessments 5, portfolio 5,
  subject enrichment 5). Section A Reading 10: two unseen prose passages, 5 MCQs each. Section B Writing 10: letter to parents or friends 6;
  diary entry or dialogue writing 4. Section C Grammar 30 (all MCQ): Sanskrit sandhis (savarna dirgha, guna, vriddhi, yanadesha) 4, samasalu
  (dvandva, dvigu, bahuvrihi) 4, vibhaktulu 4, synonyms only from Vennela-V pages 102-103 4, technical terms (paribhashika padalu) from
  CBSE's list of 16 4, prakriyalu 2, idioms from CBSE's list of 16 2, proverbs from CBSE's list of 14 2, seen prose passage 4. Section D
  Literature 30: long answer 6, 4 very short answers x 1, short answers 2x2 + 2x2, long answers 4 + 2x4. Verse completion and meaning (padya
  purana, bhavalu) are set only from the lesson Neeti Parimalalu. Two board exams for Class 10: February main (compulsory) and an optional
  May second exam for improvement in up to three of Science, Mathematics, Social Science and languages.
