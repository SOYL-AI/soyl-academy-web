exam_notes: >-
  Theory 70 marks (3 hours) + practical/project 30 (chart or project 20, viva 10). Theory paper (CBSE 2026-27 SQP): 30 questions; Q1-18
  objective 1 mark each (MCQ incl. assertion-reason, with two internal choices); Q19-22 3 marks (60-80 words); Q23-26 4 marks (80-100
  words); Q27-30 6 marks (100-150 words, two with internal choice); several are text/case-based. Two board exams for Class 10: this subject
  is examined only in the February main exam; it can be taken in the May second exam only under the compartment category (improvement in May
  is limited to Science, Mathematics, Social Science and languages; notification of 14-02-2026).
