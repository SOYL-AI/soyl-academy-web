      - id: cbse-10-english-communicative-ch04-t02
        title: Themes and message
        learning_outcomes:
          - Explain the boys' sacrifice and the theme of hidden nobility
      - id: cbse-10-english-communicative-ch04-t03
        title: "Exam practice: extract-based and long-answer responses"
        learning_outcomes:
          - Answer extract-based and short-answer questions with textual evidence
