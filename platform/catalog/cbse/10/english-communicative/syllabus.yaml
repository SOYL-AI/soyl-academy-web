        title: Short application (leave, change of section, bus timings)
        learning_outcomes:
          - Write a 50-word application in the correct format
      - id: cbse-10-english-communicative-ch02-t02
        title: Factual description of a person or object
        learning_outcomes:
          - Write a 100-word factual description using appropriate vocabulary
      - id: cbse-10-english-communicative-ch02-t03
        title: Formal letter (up to 120 words)
        learning_outcomes:
          - Write a formal letter on a Main Course Book theme
      - id: cbse-10-english-communicative-ch02-t04
        title: Article from verbal cues (up to 150 words)
        learning_outcomes:
          - Write a structured article from cues
    removed_topics: []
