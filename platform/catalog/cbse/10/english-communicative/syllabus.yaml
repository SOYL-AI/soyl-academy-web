# CBSE Class 10 English Communicative (101), 2026-27. Paper pattern verified from the CBSE syllabus. The CBSE document names
# only the books (Interact in English Main Course Book, Literature Reader, Workbook — revised editions); the Literature Reader
# contents below are from the revised CBSE edition as known to the architect — verify against the book. Titles and authors only.
subject_id: cbse-10-english-communicative
academic_year: "2026-27"
source_status: unverified
sources:
  - cbse-x-english-communicative-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
  - cbse-sqp-x-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (incl. listening and speaking 5). Reading 22 (two unseen passages, up to 750 words,
  continuous and non-continuous); Writing 22 (application up to 50 words 3, factual description up to 100 words 4, formal letter up to 120
  words 7, article up to 150 words 8); Grammar 10 (gap filling 3, editing/omission 4, reordering or transformation 3); Literature 26
  (extracts 4x2, short answers 5x2, long answer 150 words 8). Two board exams for Class 10: February main (compulsory) and optional May
  second exam for improvement.
units:
  - name: "Section A: Reading Skills"
    marks: 22
  - name: "Section B: Writing Skills"
    marks: 22
  - name: "Section C: Grammar"
    marks: 10
  - name: "Section D: Literature Reader (Interact in English)"
    marks: 26
chapters:
  - id: cbse-10-english-communicative-ch01
    number: 1
    title: Reading Comprehension
    unit: "Section A: Reading Skills"
    topics:
      - id: cbse-10-english-communicative-ch01-t01
        title: Continuous text passages
        learning_outcomes:
          - Answer comprehension and inference questions on unseen prose
      - id: cbse-10-english-communicative-ch01-t02
        title: "Non-continuous texts: lists, tables, messages, conversations"
        learning_outcomes:
          - Extract and interpret information from non-continuous texts
    removed_topics: []
    literature_texts: []
