exam_notes: >-
  Theory 50 marks (2 hours) + practical 50 (lab test 20, report file and viva 20, project 10). Networking 15, HTML 25, Cyber ethics 10.
  Cannot be taken with Information Technology (402). Two board exams for Class 10: this subject can be taken in the May second exam only
  under compartment (improvement is limited to Science, Mathematics, Social Science and languages).
