exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (as for all Class X languages). Section A Reading 15: comprehension
  of a seen and an unseen passage extracted from stories, notes and biographies (lessons 6-7). Section B Writing 25:
  composition and letter writing - purchasing, invitation, letter to a newspaper editor (lessons 8-9) 8; descriptive
  essay, e.g. festivals or journey scenes (lessons 10-12) 12; translation from English into Tibetan 5. Section C Grammar
  15: Sum cu pa (lessons 1-3) and mNgon brjod (lessons 4-5). Section D Literature 25: prose - Sherting and Sa skya legs
  bshad (lessons 13-15) 10; poetry - poetic style and the body of a poem, verse of 10-12 syllables (lessons 16-17) 10;
  rapid reading - My Land and My People (lessons 18-19) 5. Two board exams for Class 10: February main (compulsory) and
  an optional May second exam for improvement in up to three of Science, Mathematics, Social Science and languages.
