# CBSE Class 10 Tibetan (017), 2026-27. Sections, marks, topics and textbook lesson numbers as printed in the CBSE
# 2026-27 Tibetan Class IX-X syllabus (Class X course structure). Prescribed book: New Tibetan Textbook (printed by Sherig
# Parkhang / TCRPC; CBSE prints "for class IX" on both pages). CBSE names topics in Wylie-style romanisation; the Tibetan
# spellings are SOYL renderings to be checked in language review. Lesson titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-10-tibetan
academic_year: "2026-27"
source_status: verified
