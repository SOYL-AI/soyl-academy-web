  - cbse-sqp-x-kannada-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (listening - questionnaire on stories, speeches or audio-visual clips; speaking - pick
  and speak and prepared elocution of 2-3 minutes; project work such as a neighbourhood survey, role play, case study or interview).
  Sample-paper pattern: Section A Reading 20 - two unseen passages (one on a Karnataka context) 5x1 each, a prose and a poetry extract from
  the textbook 5x1 each. Section B 20 - grammar MCQs 10x1, grammar as directed 5x1, supplementary reader 5x1. Section C Writing 12 - letter
  (job application or official letter), report (varadi) and essay (prabandha), 4 each. Section D Textbook 28 - two-sentence answers 4x2, 5-6
  sentence answers 2x3, explanation with context 2x3, prose and poetry answers in 8-10 sentences 4 each. Two board exams for Class 10:
  February main (compulsory) and an optional May second exam for improvement in up to three of Science, Mathematics, Social Science and
  languages.
