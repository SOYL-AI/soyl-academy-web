# CBSE Class 10 Kannada (015), 2026-27. Every prescribed lesson (in Roman transliteration, without authors), the
# 20 grammar items and the writing tasks as listed in the CBSE 2026-27 Kannada Class X syllabus. The syllabus prints no
# section marks; units and marks follow the CBSE 2026-27 Class X Kannada sample paper. Textbook: Siri Kannada 10, Prathama
# Bhasha Kannada Pathyapustaka, Parts 1-2 (Parishkrutha 2024, Karnataka Pathya Pustaka Sangha, Bengaluru); the
# non-detailed (pathya pooraka) lessons are in the same book. Kannada-script titles are SOYL's rendering of CBSE's
# transliteration. Titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-10-kannada
academic_year: "2026-27"
