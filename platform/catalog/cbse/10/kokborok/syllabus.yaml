exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (periodic test 10, subject enrichment 5, notebook 5). A Reading 10:
  two passages, each with four direct short questions and one grammar question (sandhi - khorang manju, sentence making,
  opposite words). B Writing 10: letter writing (koktun bwlai swimung) 5 and paragraph writing (kokbwkhal swimung) 5. C
  Grammar 10 very short answers: wakhwlai, kok bwtangni dal beremtei swlaimung, kokthai manju, kok biphiring. D
  Literature 50: prose 20 (10 MCQs, one reference-to-context and one explanation question of 5), poetry 20 (same
  pattern), supplementary reader 10 (two long answers of 5). Question design by competency: remembering 25%,
  understanding 25%, applying 18.75%, analysing/evaluating/creating 31.25%. CBSE's course-structure table gives reading
  15, writing 10, grammar 20, literature 35. Two board exams for Class 10: February main (compulsory) and an optional
  May second exam for improvement in up to three of Science, Mathematics, Social Science and languages.
units:
  - name: A - Reading
    marks: 10
  - name: B - Writing skills
    marks: 10
  - name: C - Grammar
    marks: 10
  - name: D - Literature (textbook and supplementary reader)
    marks: 50
