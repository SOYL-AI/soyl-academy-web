# CBSE Class 10 Kokborok (091), 2026-27. Sections, marks, grammar items and lessons (titles and authors) as printed in the
# CBSE 2026-27 Kokborok Class IX-X syllabus (Class X examination structure). Books (Kokborok Tei Kubuni Borok Bangthaya
# Bosongni Kok Dagikhung): Rwng Kwchar Kokrwbai Bwchap (textbook), Kothoma Bwsa (supplementary reader), Maidamik Kokborok
# Kokma Tei Swimung (grammar). CBSE writes Kokborok in Roman script. Unit marks follow the examination structure; the
# course-structure table gives 15/10/20/35. Lesson titles and authors only; no text is reproduced (CONTEXT §8).
