  - name: C - Prose and poetry (Chukpryom Pundor, Chukdong Pundor)
    marks: 25
  - name: D-I - Sung Norjut
    marks: 15
  - name: D-II - Writing skills
    marks: 12
  - name: D-III - Understanding skills
    marks: 3
