# CBSE Class 10 Lepcha (026), 2026-27. Sections, marks, grammar items and lessons as printed in the CBSE 2026-27 Lepcha
# Class IX-X syllabus (Class X pages). Reference books (Education Department, Government of Sikkim): Mutanchi Ringthyum un
# Ringchuktoam (grammar), Chukdong Pundor (poems), Chukpryom Pundor (prose), Sung Norjut (stories). CBSE prints lesson
# titles in a legacy Lepcha font that does not extract as Unicode, with a Roman transliteration beside each.
# CBSE prints every Lepcha term and lesson title only in Roman transliteration; titles here keep CBSE's romanisation
# (the script CBSE actually uses) because SOYL could not verify native-script (Lepcha / Rong) spellings. Native-script titles
# are to be added in language review (see the M1 languages handoff). Lesson titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-10-lepcha
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-lepcha-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (periodic assessment 5, multiple assessment 5, portfolio 5, subject
  enrichment 5). A Unseen comprehension 10: four unseen passages, attempt two, five MCQs each on understanding,
  reasoning and HOTS. B Grammar 15 (Mutanchi Rong Ringthyum). C Prose and poetry 25 (13 lessons). D-I Sung Norjut 15
  (three stories). D-II Writing 12: essay, translation, formal or informal letter. D-III Understanding skills 3:
  introduction to poets and authors. CBSE's course-structure table on the previous page gives reading 10, writing 15,
  grammar 15, literature 40. Two board exams for Class 10: February main (compulsory) and an optional May second exam
  for improvement in up to three of Science, Mathematics, Social Science and languages.
