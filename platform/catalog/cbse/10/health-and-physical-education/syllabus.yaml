    number: 1
    title: Games and Sports
    unit: "Strand 1: Games/Sports"
    board_assessed: false
    topics:
      - id: cbse-10-health-and-physical-education-ch01-t01
        title: "Athletics or swimming: events, rules and technique"
        learning_outcomes:
          - Explain rules and basic technique of a chosen athletic event or swimming
      - id: cbse-10-health-and-physical-education-ch01-t02
        title: "Team games and individual games: rules, skills, strategies and tactics"
        learning_outcomes:
          - Describe skills, strategies and tactics in a chosen game
      - id: cbse-10-health-and-physical-education-ch01-t03
        title: Adventure sports and indigenous games
        learning_outcomes:
          - Describe safety and rules of an adventure sport or indigenous game
      - id: cbse-10-health-and-physical-education-ch01-t04
        title: Self-improvement in performance
        learning_outcomes:
          - Identify own strengths and areas to practise
