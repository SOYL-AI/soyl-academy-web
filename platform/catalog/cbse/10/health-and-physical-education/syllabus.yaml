# CBSE Class 10 Health and Physical Education, 2026-27. School-assessed (no board exam); Work Experience/SEWA is a strand of HPE at Class X.
subject_id: cbse-10-health-and-physical-education
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-hpe-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  No CBSE board exam: assessed by the school (internal / formative assessment only), so every chapter is board_assessed: false. HPE has four
  strands: Games/Sports 50 marks (90 periods), Health and Fitness 25 (50 periods), SEWA 25 (50 periods), Health and Activity Card (no marks,
  10 periods); graded internally. The platform covers the knowledge/theory parts only.
units:
  - name: "Strand 1: Games/Sports"
    marks: 50
  - name: "Strand 2: Health and Fitness"
    marks: 25
  - name: "Strand 3: SEWA"
    marks: 25
  - name: "Strand 4: Health and Activity Card"
    marks: null
chapters:
