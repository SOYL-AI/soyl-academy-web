# CBSE Class 10 Bhutia (095), 2026-27. Sections, marks, topics and lessons as printed in the CBSE 2026-27 Bhutia Class X
# syllabus. CBSE prints every Bhutia term in romanisation; the Tibetan-script (Sikkimese Bhutia) spellings here are SOYL
# renderings to be checked in language review, and the CBSE romanisation is kept in title_en. Items whose meaning SOYL could
# not identify with confidence (thoe-ten, gong-su, kyab-su, se-so) are kept only in romanisation inside title_en or outcomes.
# Books are the Sikkim Government Bhutia textbooks (CBSE does not name them). No text is reproduced (CONTEXT §8).
subject_id: cbse-10-bhutia
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-bhutia-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (periodic test 10, subject enrichment 5, class work and activities
  5). Part A objective: A Reading and comprehension 10 (two unseen passages, 5 MCQs each); B Applied grammar 5 MCQs; C
  Literature (tshig-lug) 5 MCQs. Part B descriptive: D Writing 15 - composition 5, letter 5, translation from English
  into Bhutia 5; E Textbook 45 - grammar short answers 2x5; tshig-lug, poem and rapid reader short answers 2x5; verses
  (tshig chey thamchey) long answer 5 and very short answers 5x1; Denzong chagrab (history of Sikkim) short answers 2x5
  and very short answers 5x1. Two board exams for Class 10: February main (compulsory) and an optional May second exam
  for improvement in up to three of Science, Mathematics, Social Science and languages.
