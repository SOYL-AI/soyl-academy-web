# CBSE Class 10 Health Care (413), 2026-27 skill subject (job role: General Duty Assistant). Theory component only (theory 50 + practical 50).
# Part A Employability Skills from the CBSE Employability Skills (Class X) curriculum; Part B from the subject curriculum.
subject_id: cbse-10-health-care
academic_year: "2026-27"
source_status: verified
