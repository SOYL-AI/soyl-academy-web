# CBSE Class 10 Gujarati (010), 2026-27. Every prescribed poem and prose lesson with its form and writer, grammar
# and writing items as printed in Gujarati in the CBSE 2026-27 Gujarati curriculum (Class X table), and the Class X
# blueprint. Textbook: Gujarati (Dwitiya Bhasha) Class X, ed. 2017 (Gujarat Rajya Shala Pathya Pustak Mandal,
# Gandhinagar). Unlisted book lessons are not prescribed. Titles and authors only; no text is reproduced (CONTEXT §8).
