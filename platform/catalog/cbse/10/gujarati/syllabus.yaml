exam_notes: >-
  Paper 80 marks (3 hours) + internal assessment 20 (periodic written test 5, best two of three; multiple assessment - listening and
  speaking 5; portfolio 5; subject enrichment 5). Part A (34): unseen prose passage 5 MCQ + 5 very short answers (10); literature - 4 of 6
  poetry and 4 of 6 prose very short answers (8); applied grammar 16 (idioms from the textbook 4, one word for a group of words 4, synonyms
  and antonyms from the textbook 4, correcting sentences and postpositions (anug-namyogi) 4; all MCQ, 4 of 5). Part B (46): poetry -
  comprehension of a textbook extract 5x1, two of the 2-mark answers, one 3-mark detailed answer; prose - six very short answers on the
  supplementary reader, 3x2 short answers, 2x3 detailed answers (literature total 30); writing 16 - paragraph of at least 120 words on a
  contemporary issue 5 (1 of 2), story from given points 6, official letter (application, complaint) or advertisement 5. Letters and
  advertisements are set on cleanliness, health, education, rules of public places and environment. Two board exams for Class 10: February
  main (compulsory) and an optional May second exam for improvement in up to three of Science, Mathematics, Social Science and languages.
