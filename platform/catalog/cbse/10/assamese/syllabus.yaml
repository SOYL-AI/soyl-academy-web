# CBSE Class 10 Assamese (014), 2026-27. Sections, marks, writing tasks, grammar items and every prescribed lesson
# with its writer or poet (in Roman transliteration) from the CBSE 2026-27 Assamese syllabus, Class X. Books: Asamiya
# Sahitya Chayanika (Assam State Textbook Production and Publication Corporation, Guwahati) and Rachana Bichitra
# (Dharma Singha Deka, Assam Book Depot, Guwahati). Assamese-script titles are SOYL's rendering of CBSE's
# transliteration. Titles and authors only; no text is reproduced (CONTEXT §8).
