exam_notes: >-
  Paper 80 marks (3 hours) + internal assessment 20 (periodic test 10, subject enrichment activity 5, notebook keeping 5). Section A Reading
  15: one unseen passage of at least 500 words with six 1-mark and three 2-mark questions and three 1-mark grammar questions. Section B
  Writing 25: four long tasks x 5 and five 1-mark sentences using idiomatic phrases (jatuwa khanda bakya). Section C Grammar 20 (very short
  answers). Section D Textbook: prose 10 and poetry 10, each one long answer 4, one short answer 2 and four very short answers x 1. Writing
  in Class X: story or idealistic (adarshamulak) essay, report on a school function, proverbs nos. 11-20, personal or official letter,
  idiomatic phrases with ga, ghar, chaku, mukh, dat. Grammar: sandhi (visarga and Assamese) 4, prefixes 2, postpositions 2, sentence
  transformation 4, synonyms 2, antonyms 2, roots 2, tense 2. Two board exams for Class 10: February main (compulsory) and an optional May
  second exam for improvement in up to three of Science, Mathematics, Social Science and languages.
