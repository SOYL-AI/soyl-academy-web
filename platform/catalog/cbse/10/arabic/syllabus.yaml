# CBSE Class 10 Arabic (016), 2026-27. Sections, marks, writing tasks, grammar items and the prescribed lesson numbers as
# printed in the CBSE 2026-27 Arabic Class IX-X syllabus (Class X page and examination structure). Prescribed textbook:
# Minhaj al-Ta'lim al-Thanawi (Class X), CBSE / Shiksha Kendra. CBSE lists the prescribed lessons by NUMBER only (prose
# 1-3, 5-7, 9-13, 15-17, 19-20; poems 4, 8, 14, 18), so the two textbook chapters carry placeholder topics until the book's
# contents page is supplied (see the M1 languages handoff). No text is reproduced (CONTEXT §8).
subject_id: cbse-10-arabic
academic_year: "2026-27"
source_status: verified
