exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (handwriting 5, reading a short passage without diacritical marks 5,
  Arabic speaking 5, oral applied grammar 5). Section A Reading 10: three unseen passages of simple Arabic (about 80 words),
  attempt any two, ten 1-mark MCQs. Section B Writing 10: a short paragraph of about 50 words on a given topic or a letter
  in Arabic 4; use of words in sentences 2 (2 of 4); fill in the blanks 2 (2 of 4); correction of sentences 2 (2 of 4).
  Section C Grammar and translation 20: define and illustrate a grammar topic 5 (1 of 3); choose the correct answer 5 (5 of
  8); translate Arabic sentences into English, Hindi or Urdu 5 (5 of 8); translate English sentences into Arabic 5 (5 of
  8). Section D Literature 40: prose - translation of passages of about 50 words 2x5 (2 of 3), questions on a given passage
  4x2 (4 of 6), MCQs 4x1 (4 of 6); poetry - explanation of four given verses with reference to the context 15, central idea
  of one poem 3 (1 of 3). Two board exams for Class 10: February main (compulsory) and an optional May second exam for
  improvement in up to three of Science, Mathematics, Social Science and languages.
