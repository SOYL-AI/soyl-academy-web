# CBSE Class 10 Front Office Operations (410), 2026-27 skill subject. Theory component only (theory 50 + practical 50).
# Part A Employability Skills from the CBSE Employability Skills (Class X) curriculum; Part B from the subject curriculum.
subject_id: cbse-10-front-office-operations
academic_year: "2026-27"
source_status: verified
