notes: >-
  Theory paper only (50 marks, 2 hours); practical 50 is assessed separately. Pattern from the CBSE skill-subject sample paper for 409
  (blueprint page + paper): Part A Employability Skills 10 (objective any 4 of 6 x 1; short answer any 3 of 5 x 2) and Part B Subject Skills
  40 (objective: four blocks of 6, attempt any 5 in each = 20 x 1; short answer any 4 of 6 x 2 in 20-30 words; long answer any 3 of 5 x 4 in
  50-80 words). No negative marking. FORMAT MAPPING: the 1-mark objective blocks mix MCQ, fill-in-the-blank, true/false, one-word and
  matching items; all are modelled as type mcq (the assembler may substitute fill-blank / true-false / match items of 1 mark). "Any k of n"
  choice is modelled as internal_choice {attempt: k, of: n} on one item group.
