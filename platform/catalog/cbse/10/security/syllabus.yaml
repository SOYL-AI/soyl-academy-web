exam_notes: >-
  Theory 50 marks (2 hours) + practical 50. Theory paper: Part A Employability Skills 10 (objective: any 4 of 6 x 1; short answer: any 3 of
  5 x 2) and Part B subject skills 40 (objective: 4 blocks of 6, attempt 5 each = 20 x 1; short answer any 4 of 6 x 2 in 20-30 words; long
  answer any 3 of 5 x 4 in 50-80 words), per the CBSE skill sample paper. Part B units 6 (First Aid Practices, Advanced) and 7 (Work
  Integrated Learning) carry no theory marks and are assessed in practical work only (board_assessed: false). Two board exams for Class 10:
  this subject is examined only in the February main exam; it can be taken in the May second exam only under the compartment category
  (improvement in May is limited to Science, Mathematics, Social Science and languages; notification of 14-02-2026).
