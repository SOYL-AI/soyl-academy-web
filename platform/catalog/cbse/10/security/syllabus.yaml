# CBSE Class 10 Security (403), 2026-27 skill subject (job role: Unarmed Security Guard). Theory component only (theory 50 + practical 50).
# Part A Employability Skills from the CBSE Employability Skills (Class X) curriculum; Part B from the subject curriculum.
