# CBSE Class 10 Foundation Skills for Sciences (Pharmaceutical and Biotechnology) (421), 2026-27 skill subject. Theory component only (theory 50 + practical 50).
# Part A Employability Skills from the CBSE Employability Skills (Class X) curriculum; Part B from the subject curriculum.
