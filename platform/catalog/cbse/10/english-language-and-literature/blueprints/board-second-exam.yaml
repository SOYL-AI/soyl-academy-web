notes: >-
  Second (May) board exam: CBSE has published no separate sample paper or design for the second exam; the 14-02-2026 notification makes it
  an improvement / compartment exam on the same subject, so this blueprint repeats the February pattern on the full syllabus (assumption,
  re-check when CBSE publishes a second-exam SQP).

  11 questions in three sections. FORMAT MAPPING: unseen reading passages are modelled as case-based (one passage, ~10 objective and

  short sub-questions); textbook extracts as source-based; the 10-of-12 grammar tasks (gap filling, editing, transformation, some with
  options)

  as 1-mark fill-blank; the formal letter (Q4) and the analytical paragraph (Q5, on a chart/graph/cue - needs an image asset or a table)
  as 5-mark 'writing' items (contract v2: format, word_limit and a rubric that sums to the marks). The rubric splits in the section
  instructions are from the 2026-27 marking scheme.

  No competency weights are published for English. Theory 80 + internal assessment 20 (incl. listening and speaking).
