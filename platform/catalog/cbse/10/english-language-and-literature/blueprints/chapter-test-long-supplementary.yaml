  chapter-level 2-mark recall answers (30-40 words), as in chapter-test-long.yaml. 36 marks in 80 minutes. A chapter bank of 12 three-mark,
  8 long and 4 two-mark answers fills this and the short test without sharing a question. Selected through `scope` (a chapter list), which
  overrides the subject's chapter-test-long for those chapters only.
