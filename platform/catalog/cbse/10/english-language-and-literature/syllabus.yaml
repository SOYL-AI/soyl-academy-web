# CBSE Class 10 English Language and Literature (184), 2026-27.
# Literature chapters list text title and author only; the platform never reproduces the text (CONTEXT §8).
# Order: reading, grammar, writing, then First Flight (prose, play, poems) and Footprints without Feet in textbook order.
# Words and Expressions – II workbook Units 1-4 and 7-11 support grammar/writing practice.
subject_id: cbse-10-english-language-and-literature
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-english-ll-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
  - cbse-sqp-x-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (incl. assessment of listening and speaking 5). Section A reading 20 (discursive
  passage 400-450 words, 10; case-based factual passage with visual input 200-250 words, 10). Section B grammar 10 (10 of 12 items: gap
  filling, editing, transformation) and writing 10 (formal letter 100-120 words, 5; analytical paragraph on map/chart/graph/cues 100-120
  words, 5). Section C literature 40: two reference-to-context extracts 5+5, First Flight short answers 4x3, Footprints short answers 2x3,
  one long answer each from First Flight and Footprints 6+6 (100-120 words). Two board exams for Class 10: February main (compulsory) and
  optional May second exam for improvement.
units:
  - name: "Section A: Reading Skills"
    marks: 20
  - name: "Section B: Writing Skills and Grammar"
    marks: 20
  - name: "Section C: Literature – First Flight"
    marks: null
  - name: "Section C: Literature – Footprints without Feet"
    marks: null
chapters:
  - id: cbse-10-english-language-and-literature-ch01
    number: 1
    title: "Reading Comprehension: Unseen Passages"
    unit: "Section A: Reading Skills"
    topics:
      - id: cbse-10-english-language-and-literature-ch01-t01
        title: Discursive passage (400-450 words)
        learning_outcomes:
          - Identify the writer's argument, tone and supporting points in a discursive passage
          - Answer inference, evaluation and vocabulary questions in 30-40 words
      - id: cbse-10-english-language-and-literature-ch01-t02
        title: Case-based factual passage with visual input (200-250 words)
        learning_outcomes:
          - Interpret statistical data, tables or charts linked to a factual passage
          - Draw conclusions supported by both text and data
      - id: cbse-10-english-language-and-literature-ch01-t03
        title: Vocabulary in context
        learning_outcomes:
          - Infer word meaning from context and choose synonyms/antonyms used in the passage
    removed_topics: []
    literature_texts: []
