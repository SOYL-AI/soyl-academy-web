        title: Determiners
        learning_outcomes:
          - Choose correct determiners (articles, quantifiers, demonstratives) in context
      - id: cbse-10-english-language-and-literature-ch02-t02
        title: Tenses
        learning_outcomes:
          - Use present, past and future tense forms correctly in gap-filling and editing tasks
      - id: cbse-10-english-language-and-literature-ch02-t03
        title: Modals
        learning_outcomes:
          - Select modals to express ability, permission, obligation, possibility and advice
      - id: cbse-10-english-language-and-literature-ch02-t04
        title: Subject-verb concord
        learning_outcomes:
          - Make verbs agree with singular, plural, collective and compound subjects
      - id: cbse-10-english-language-and-literature-ch02-t05
        title: "Reported speech: commands, requests, statements and questions"
        learning_outcomes:
          - Convert direct speech into reported speech with correct tense, pronoun and time-word changes
      - id: cbse-10-english-language-and-literature-ch02-t06
        title: Editing and omission tasks
        learning_outcomes:
          - Detect and correct errors of grammar, spelling and punctuation in a short passage
