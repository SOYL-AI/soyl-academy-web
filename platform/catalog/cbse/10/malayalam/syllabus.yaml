exam_notes: >-
  Paper 80 marks (3 hours) + internal assessment 20 (pen-paper tests, art-integrated projects, portfolio, subject enrichment). Section A
  Reading 15: two unseen passages with 8 and 7 very short answer questions. Section B Creative writing 14: essay of about 200 words on
  social issues, family or school life (one of two) 5; letter (application, letter to the editor, commercial correspondence) 5; newspaper
  report of a simple event 4. Section C Grammar 15: transformation of sentences based on the textbook 4x2 (very short answers); vocabulary
  building 7 MCQs. Section D Literature 36: 9 MCQ-type annotation and short questions x 2 (5 poetry, 4 prose); prose 3 of 4 short answers of
  about 100 words x 3; poetry 3 of 4 x 3. 50% competency-based questions; about 33% internal choice. Two board exams for Class 10: February
  main (compulsory) and an optional May second exam for improvement in up to three of Science, Mathematics, Social Science and languages.
