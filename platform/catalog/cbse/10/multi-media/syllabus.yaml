      - id: cbse-10-multi-media-ch02-t02
        title: "Stress management techniques: exercise, yoga, meditation, holidays and nature walks"
        learning_outcomes:
          - Describe and practise suitable stress-management techniques
      - id: cbse-10-multi-media-ch02-t03
        title: Working independently
        learning_outcomes:
          - Explain the importance of working independently and plan and execute a task without help
      - id: cbse-10-multi-media-ch02-t04
        title: Self-awareness, self-motivation and self-regulation
        learning_outcomes:
          - Distinguish types of self-awareness
          - Explain self-motivation and self-regulation with examples and set personal goals
