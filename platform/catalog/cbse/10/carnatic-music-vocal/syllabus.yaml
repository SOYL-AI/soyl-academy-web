        title: "Structure of the 72-melakarta scheme: chakras and their names"
        learning_outcomes:
          - Explain the division into 12 chakras of six ragas each
      - id: cbse-10-carnatic-music-vocal-ch02-t02
        title: Suddha and prati madhyama melas
        learning_outcomes:
          - Distinguish suddha madhyama and prati madhyama melakartas
      - id: cbse-10-carnatic-music-vocal-ch02-t03
        title: Finding a mela from its number (katapayadi formula)
        learning_outcomes:
