# CBSE Class 10 Carnatic Music (Vocal) (031), 2026-27. Theory component only; practical units listed with board_assessed: false.
subject_id: cbse-10-carnatic-music-vocal
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-carnatic-vocal-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
  - cbse-sqp-x-2026-27
exam_notes: >-
  Theory 30 marks (2 hours) + practical 50 + internal assessment 20. Theory paper (CBSE 2026-27 SQP): Section A 8 MCQs x 1; Section B 5
  short answers x 2, each with an internal choice; Section C 2 long answers x 6, each with an internal choice (includes notation writing).
  Practical (alankaras, varnam, kriti rendition, kalpana swaras, tanpura tuning) is assessed outside the theory paper and is marked
  board_assessed: false here. Two board exams for Class 10: this subject is examined only in the February main exam; it can be taken in the
  May second exam only under the compartment category (improvement in May is limited to Science, Mathematics, Social Science and languages;
  notification of 14-02-2026).
units:
  - name: Theory
    marks: 30
  - name: Practical (school/external practical exam)
    marks: 50
chapters:
  - id: cbse-10-carnatic-music-vocal-ch01
    number: 1
    title: Raga Classification
    unit: Theory
    topics:
      - id: cbse-10-carnatic-music-vocal-ch01-t01
        title: Janaka (melakarta) and janya ragas
        learning_outcomes:
          - Distinguish janaka and janya ragas with examples
      - id: cbse-10-carnatic-music-vocal-ch01-t02
        title: Upanga, bhashanga, varja and vakra ragas
        learning_outcomes:
          - Classify a given raga as upanga or bhashanga, varja or vakra
      - id: cbse-10-carnatic-music-vocal-ch01-t03
        title: Audava, shadava and sampurna ragas
        learning_outcomes:
          - Identify the number of swaras in the arohana and avarohana of a raga
    removed_topics: []
