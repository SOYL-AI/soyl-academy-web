# CBSE Class 10 Nepali (024), 2026-27. Sections, marks, grammar items, prescribed lessons with authors, writers for
# Prativa Parichaya and writing tasks as printed in the CBSE 2026-27 Nepali syllabus (Class X table). Books: Sahitya Sudha and
# the rapid reader Katha Bimba (Janapaksha Prakashan, Gangtok); grammar and composition: Nepali Madhyamik Vyakaran ra
# Rachana (Red Panda Partner Consultancy, Gangtok). CBSE prints titles in Roman transliteration; the Devanagari spellings
# are ours and title_en keeps CBSE's Roman form so a native-speaker check can confirm them. No text is reproduced (CONTEXT §8).
subject_id: cbse-10-nepali
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-nepali-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
exam_notes: >-
  Total 100 = theory 80 (3 hours) + internal assessment 20 (periodic assessment 5, multiple assessment 5, reading and
  speaking skills 5, subject enrichment 5). Part A (MCQ): two unseen passages of about 200 words, one prose and one
  poetry, 5+5; applied grammar 10. Part B (descriptive): applied grammar 6 (short answer); Sahitya Sudha prose 14 and
  poetry 12 (short answer); rapid reader Katha Bimba 10; Prativa Parichaya 4; writing and composition 14 (essay - one of
  two topics, letter or application - one of two, and translation from English to Nepali; long answer). Two board exams
  for Class 10: February main (compulsory) and an optional May second exam for improvement in up to three of Science,
  Mathematics, Social Science and languages.
