# CBSE Class 10 Elements of Book Keeping and Accountancy (254), 2026-27. Theory 70 + project 30. Alternative to Elements of Business (154).
subject_id: cbse-10-elements-of-book-keeping-and-accountancy
academic_year: "2026-27"
source_status: verified
