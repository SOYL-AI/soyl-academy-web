exam_notes: >-
  Theory 70 marks (3 hours) + project 30 (two projects of 15). Theory paper (CBSE 2026-27 SQP): 30 questions; Q1-18 objective 1 mark each
  (MCQ incl. assertion-reason, six with internal choice); Q19-22 3 marks; Q23-26 4 marks; Q27-30 6 marks; internal choice in one question of
  each constructed-response group. Numerical/accounting answers (journal entries, BRS, final accounts, statement of affairs). Two board
  exams for Class 10: this subject is examined only in the February main exam; it can be taken in the May second exam only under the
  compartment category (improvement in May is limited to Science, Mathematics, Social Science and languages; notification of 14-02-2026).
