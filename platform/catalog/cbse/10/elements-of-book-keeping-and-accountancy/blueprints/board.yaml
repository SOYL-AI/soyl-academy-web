notes: >-
  Theory 70 + project 30. 30 questions: Q1-18 objective 1 mark (two assertion-reason; internal choice in six), Q19-22 3 marks (choice in
  one), Q23-26 4 marks (choice in one), Q27-30 6 marks (choice in one). FORMAT MAPPING: most constructed answers are accounting formats --
  journal entries, asset accounts, bank reconciliation statements, trading and P&L accounts, balance sheets and statements of affairs --
  modelled as short/long; they need a tabular (ledger/statement) answer type with row-level step marks. Some 1-mark items are computational
  MCQs (depreciation, book value).
