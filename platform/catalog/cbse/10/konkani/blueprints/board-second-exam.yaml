notes: >-
  Second (May) board exam: CBSE has published no separate sample paper or design for the second exam; the 14-02-2026 notification makes it
  an improvement / compartment exam on the same subject, so this blueprint repeats the February pattern on the full syllabus (assumption,
  re-check when CBSE publishes a second-exam SQP).

  Konkani (168) theory paper, 80 marks, 3 hours. CBSE publishes no 2026-27 sample paper for this language, so the pattern is built from the
  question-paper design / assessment scheme in the CBSE 2026-27 syllabus (unverified: question order and choices are SOYL assumptions). CBSE
  design: A reading comprehension of two unseen passages (prose and poetry) 10, B grammar 20 and writing 20, C textbook (prose, poetry,
  story) 30. The CBSE design gives section totals only; the item split inside each section is a SOYL estimate in the usual CBSE
  language-paper style.

  FORMAT MAPPING (languages): unseen passages -> case-based; textbook extracts/passages -> source-based; 1-mark grammar

  and vocabulary items -> short (fill-blank, mcq, match or true-false where the paper clearly uses gap-fill, options, matching or
  true/false);

  writing tasks (letter, essay, paragraph, notice, dialogue, story, e-mail) and translation passages -> long or short by marks - the
  contract

  has no writing/translation type with a rubric. "Answer any n" choices inside one question are modelled as internal_choice only where the

  number offered is printed; otherwise only the attempted items are listed. Visually impaired substitute items are not modelled.
