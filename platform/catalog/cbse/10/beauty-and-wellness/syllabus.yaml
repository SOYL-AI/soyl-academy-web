# CBSE Class 10 Beauty and Wellness (407), 2026-27 skill subject (job role: Assistant Beauty Therapist). Theory component only (theory 50 + practical 50).
# Part A Employability Skills from the CBSE Employability Skills (Class X) curriculum; Part B from the subject curriculum.
