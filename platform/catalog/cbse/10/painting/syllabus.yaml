# CBSE Class 10 Painting (049), 2026-27. Theory 30 + practical 50 + internal assessment 20; platform covers theory.
subject_id: cbse-10-painting
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-painting-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
  - cbse-sqp-x-2026-27
exam_notes: >-
  Theory 30 marks (2 hours) + practical 50 (3 hours; painting composition from memory) + internal assessment 20 (periodic tests 10,
  portfolio 10). Theory paper (CBSE 2026-27 SQP): Section A 8 MCQs x 1; Section B 5 short answers x 2 (about 100 words), each with an
  internal choice; Section C 3 long answers x 6 (about 200 words), attempt any 2; some questions are based on an image of an artwork. Unit I
  Fundamentals of Visual Arts 15; Unit II Story of Indian Art 15. Two board exams for Class 10: this subject is examined only in the
  February main exam; it can be taken in the May second exam only under the compartment category (improvement in May is limited to Science,
  Mathematics, Social Science and languages; notification of 14-02-2026).
