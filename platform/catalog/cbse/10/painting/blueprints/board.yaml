notes: >-
  Theory paper only (30 marks, 2 hours); practical 50 (painting composition, 3 hours) and internal assessment 20 are assessed separately. 9
  questions: Section A one question with 8 MCQ parts x 1; Section B 5 short answers x 2 (about 100 words), each with an internal choice;
  Section C 3 long answers x 6 (about 200 words), attempt any 2. FORMAT MAPPING: several questions are based on an image of a painting,
  sculpture or monument (picture-based appreciation); the question needs an image asset of a public-domain artwork. No drawing is asked in
  the theory paper.
