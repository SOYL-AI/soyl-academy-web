# CBSE Class 10 National Cadet Corps (076), 2026-27. Theory 70 + practical 30; drill/practical not covered.
# Part II is wing-specific: a student studies the common subjects plus ONE wing (Army, Navy or Air).
subject_id: cbse-10-ncc
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-ncc-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
  - cbse-sqp-x-2026-27
exam_notes: >-
  Theory 70 marks (3 hours) + practical 30. Part I Common Subjects 49 (Section A 11 x 1 objective incl. assertion-reason and match; Section
  B 7 x 2 and 4 x 4 short answers with internal choice; Section C one 2-mark extract-based and one 6-mark source-based question). Part II
  Special Subjects 21 for the chosen wing (Section D 5 x 1 MCQ; Section E 2- and 4-mark answers with some choice; Section F one 4-mark
  case-based question). Word limits: 2 marks 35 words, 4 marks 80 words, 6 marks 150 words. The paper is bilingual (English and Hindi). Two
  board exams for Class 10: this subject is examined only in the February main exam; it can be taken in the May second exam only under the
  compartment category (improvement in May is limited to Science, Mathematics, Social Science and languages; notification of 14-02-2026).
