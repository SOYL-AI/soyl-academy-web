notes: >-
  Theory paper only (70 marks, 3 hours); practical 30 separately. Part I Common Subjects 49 (compulsory) and Part II Special Subjects 21 for
  the chosen wing (Army, Navy or Air; the SQP prints all three, the candidate attempts one). Word limits: 2 marks 35 words, 4 marks 80
  words, 6 marks 150 words. Section C has a 2-mark extract-based question and a 6-mark source-based question made of six 1-mark MCQs. Part
  II Section E: the number of internal choices differs by wing (Army 2, Navy 3, Air 2); modelled as one choice pair. FORMAT MAPPING: wing
  selection is not expressible in the Blueprint schema -- sections D-F apply to whichever wing the student chose; the test assembler must
  filter Part II questions by the wing chapters (Army / Navy / Air units in the syllabus). The paper is bilingual (English/Hindi).
