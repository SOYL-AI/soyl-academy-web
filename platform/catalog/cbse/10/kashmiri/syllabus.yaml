exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (periodic tests on textual questions, grammar and vocabulary 10; notebook 5; subject
  enrichment - listening to short narrations and speaking through elocution, conversation, recitation and narration 5). Unseen
  comprehension: one of four unseen paragraphs of about 200 words, five MCQs. Grammar: application of suffix and prefix words, tenses,
  gender and number. Main course book: seen prose and poem passages of 100-150 words with five MCQs each; notes on poets and writers,
  summaries, genres, textual questions, fill in the blanks and book work. Creative writing: essay, story and letter. Two board exams for
  Class 10: February main (compulsory) and an optional May second exam for improvement in up to three of Science, Mathematics, Social
  Science and languages.
