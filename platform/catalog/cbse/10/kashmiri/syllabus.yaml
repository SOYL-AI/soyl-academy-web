# CBSE Class 10 Kashmiri (097), 2026-27. Sections, grammar items, writing tasks and the four prescribed lessons
# (printed in Kashmiri by CBSE) from the CBSE 2026-27 Kashmiri IX-X syllabus, Class X. Prescribed book: Kashir Kitab
# (2010), J&K Board of School Education, Class X. CBSE prints no marks per section, so units carry no marks. Chapter and
# topic labels other than lesson titles are SOYL's and need review by a Kashmiri speaker. Titles only; no text reproduced.
