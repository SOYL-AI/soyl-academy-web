# CBSE Class 10 Marathi (009), 2026-27. Sections, marks (blueprint), grammar items, writing tasks and every
# prescribed lesson with its writer or poet, as printed in Marathi in the CBSE 2026-27 Marathi IX-X curriculum. Textbook:
# Aksharbharati Iyatta Dahavi (Maharashtra State Bureau of Textbook Production and Curriculum Research, Pune). Lesson
# numbers 11-14 of the book are not prescribed. Lesson 1 is for reading only (not examined). Titles and authors only; no
# text is reproduced (CONTEXT §8).
subject_id: cbse-10-marathi
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-marathi-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
exam_notes: >-
  Paper 80 marks (3 hours) + internal assessment 20 (notebook records, homework and classwork, periodic test, subject enrichment /
  portfolio). Section A Reading 15: one unseen prose passage of 150-200 words (5 MCQs of 6, 3 very short answers of 4) and one unseen poem
  of 10-12 lines (4 MCQs of 5, 3 very short answers of 5). Section B Grammar 20: parts of speech 4, identify and change tense 3, kinds of
  sentences 3, number 2, gender 2, synonyms 2, antonyms 2, compounds 2 (number, gender, synonyms and antonyms are textbook-based). Section C
  Textbook 30: prose - one-sentence answers 3, fill in the blanks 3, one short answer of 30-40 words 3, idioms (vakprachar) matching 5;
  poetry - one-sentence answers 4, fill in the blanks 4, explanation with reference to context 3; supplementary reader - one-sentence
  answers 5 of 7. Section D Writing 15: essay (autobiographical, imaginative or descriptive, 120-150 words) or story from given points
  (title and moral required) 5; formal letter (demand or complaint, envelope required) 5; advertisement writing 5. Two board exams for Class
  10: February main (compulsory) and an optional May second exam for improvement in up to three of Science, Mathematics, Social Science and
  languages.
