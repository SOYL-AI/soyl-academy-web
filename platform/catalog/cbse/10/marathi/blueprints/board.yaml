notes: >-
  Marathi (009) theory paper, 80 marks, 3 hours, from the CBSE 2026-27 sample question paper and marking scheme. Unseen prose and poem 15,
  grammar 20, textbook prose 14, poetry 11, supplementary 5, writing 15; "any n" choices throughout; CBSE tags competency-based items (CBQ).

  FORMAT MAPPING (languages): unseen passages -> case-based; textbook extracts/passages -> source-based; 1-mark grammar

  and vocabulary items -> short (fill-blank, mcq, match or true-false where the paper clearly uses gap-fill, options, matching or
  true/false);

  writing tasks (letter, essay, paragraph, notice, dialogue, story, e-mail, report, précis) and translation passages -> 'writing' items
  (contract v2: format, word_limit and a rubric that sums to the marks); sentence-level translation and usage items stay 1-mark short. "Answer any n" choices inside one question are modelled as internal_choice only where the

  number offered is printed; otherwise only the attempted items are listed. Visually impaired substitute items are not modelled.
