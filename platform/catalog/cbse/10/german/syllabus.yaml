    topics:
      - id: cbse-10-german-ch05-t01
        title: Relativpronomen mit Präpositionen
        title_en: Relative pronouns with prepositions
        learning_outcomes:
          - Join sentences with a preposition + relative pronoun in the correct case
      - id: cbse-10-german-ch05-t02
        title: Relativpronomen „wo" und „was"
        title_en: Relative pronouns wo and was
        learning_outcomes:
          - Use wo after places and was after alles, nichts, etwas and whole clauses
    removed_topics: []
    literature_texts: []
  - id: cbse-10-german-ch06
