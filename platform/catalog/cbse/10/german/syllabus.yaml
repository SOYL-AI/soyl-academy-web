# CBSE Class 10 German (020), 2026-27. Sections, marks, grammar items and the lesson-wise situations, speech intentions and
# structures as printed in the CBSE 2026-27 German Class IX-X syllabus (Class X pages). Prescribed textbook: Beste Freunde
# B1.1, lessons 6-9 (Hueber, published in India by Goyal Publishers). CBSE names each lesson by its situation/topic in
# English; chapter titles here are those topics rendered in German, not the book's own lesson headings. No text is
# reproduced (CONTEXT §8).
subject_id: cbse-10-german
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-german-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (periodic tests and dictations 5, listening comprehension 5, speaking
  activities such as role play, presentations and recitation 5, regularity and quality of class and home work 5). Section
  A Reading 15: two unseen comprehension passages (10 + 5). Section B Writing 10: an e-mail of about 50 words based on a
  stimulus 5, and a dialogue or SMS based on a stimulus 5. Section C Applied grammar 40: past tense 8, adjective endings
  with and without articles (nominative, accusative) 8, relative pronouns with prepositions and wo/was 8, prepositions of
  place and direction 8, conjunctions als, ob, weil, obwohl 4, comparative and superlative 4. Section D Textbook 15: two
  seen passages to complete with given vocabulary (5 + 5) and one seen comprehension 5. The past perfect (lesson 8) and
  the clause with nachdem (lesson 9) are taught but not tested in the grammar section. Two board exams for Class 10:
  February main (compulsory) and an optional May second exam for improvement in up to three of Science, Mathematics,
  Social Science and languages.
units:
  - name: "Teil A: Leseverstehen"
    marks: 15
  - name: "Teil B: Schreiben"
    marks: 10
  - name: "Teil C: Angewandte Grammatik"
    marks: 40
  - name: "Teil D: Lehrbuch (Beste Freunde B1.1, Lektionen 6-9)"
    marks: 15
chapters:
  - id: cbse-10-german-ch01
    number: 1
    title: Leseverstehen
    title_en: Reading comprehension (unseen passages)
    unit: "Teil A: Leseverstehen"
    topics:
      - id: cbse-10-german-ch01-t01
        title: Unbekannte Texte (Zeitungsartikel, Internettexte, Blogeinträge, Anzeigen)
        title_en: Unseen texts (newspaper extracts, internet texts, blog entries, advertisements)
        learning_outcomes:
          - Read an authentic German text and find the main points and specific details
          - Use reading strategies (context, word families, cognates) to work out unknown words
      - id: cbse-10-german-ch01-t02
        title: Persönliche Nachrichten verstehen (E-Mail, SMS)
        title_en: Understanding personal messages (e-mail, SMS)
        learning_outcomes:
          - Read e-mails and SMS messages and answer questions or respond to them
    removed_topics: []
    literature_texts: []
  - id: cbse-10-german-ch02
    number: 2
    title: Schreiben
    title_en: Writing
    unit: "Teil B: Schreiben"
    topics:
      - id: cbse-10-german-ch02-t01
        title: Eine E-Mail schreiben (ca. 50 Wörter)
        title_en: Writing a semi-formal or informal e-mail (about 50 words) from a stimulus
        learning_outcomes:
          - Write an informal or semi-formal e-mail with greeting, complete sentences and closing that covers every given point
      - id: cbse-10-german-ch02-t02
        title: Einen Dialog oder eine SMS schreiben
        title_en: Writing a dialogue or an SMS from a stimulus
        learning_outcomes:
          - Write a short dialogue or SMS suited to the situation and the person addressed
    removed_topics: []
    literature_texts: []
  - id: cbse-10-german-ch03
    number: 3
    title: Das Präteritum
    title_en: Simple past tense
    unit: "Teil C: Angewandte Grammatik"
    topics:
      - id: cbse-10-german-ch03-t01
        title: Präteritum der regelmäßigen und unregelmäßigen Verben
        title_en: Simple past of regular and irregular verbs
        learning_outcomes:
          - Form the Präteritum of weak, strong and mixed verbs and use it to report events
      - id: cbse-10-german-ch03-t02
        title: Präteritum von sein, haben und den Modalverben
        title_en: Simple past of sein, haben and the modal verbs
        learning_outcomes:
          - Use war, hatte and the past forms of the modal verbs in written narration
    removed_topics: []
    literature_texts: []
  - id: cbse-10-german-ch04
    number: 4
    title: Adjektivdeklination und Komparation
    title_en: Adjective endings and degrees of comparison
    unit: "Teil C: Angewandte Grammatik"
    topics:
      - id: cbse-10-german-ch04-t01
        title: Adjektivendungen mit bestimmtem und unbestimmtem Artikel (Nominativ, Akkusativ)
        title_en: Adjective endings after definite and indefinite articles (nominative, accusative)
        learning_outcomes:
          - Add the correct adjective endings after der/die/das and ein/eine in the nominative and accusative
      - id: cbse-10-german-ch04-t02
        title: Adjektivendungen ohne Artikel (Nominativ, Akkusativ)
        title_en: Adjective endings without an article (nominative, accusative)
        learning_outcomes:
