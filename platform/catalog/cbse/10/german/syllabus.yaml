    title_en: Prepositions and conjunctions
    unit: "Teil C: Angewandte Grammatik"
    topics:
      - id: cbse-10-german-ch06-t01
        title: Lokale und direktionale Präpositionen (um, über + Akkusativ, gegenüber + Dativ)
        title_en: Prepositions of place and direction (um, über + accusative, gegenüber + dative)
        learning_outcomes:
          - Use prepositions of place and direction with the correct case to describe a route or position
      - id: cbse-10-german-ch06-t02
        title: Konjunktionen als, ob, weil, obwohl
        title_en: Conjunctions als, ob, weil and obwohl
        learning_outcomes:
