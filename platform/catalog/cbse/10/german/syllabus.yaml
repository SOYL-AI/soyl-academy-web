      - id: cbse-10-german-ch04-t03
        title: Komparativ und Superlativ
        title_en: Comparative and superlative
        learning_outcomes:
          - Form comparative and superlative forms, including irregular ones, and compare with als and wie
    removed_topics: []
    literature_texts: []
