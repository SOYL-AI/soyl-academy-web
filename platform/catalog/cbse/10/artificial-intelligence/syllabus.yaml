# CBSE Class 10 Artificial Intelligence (417), 2026-27, skill subject. Theory component only; units marked "assessed through practicals" are kept for completeness.
subject_id: cbse-10-artificial-intelligence
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-ai-417-2026-27
  - cbse-skill-curriculum-2026-27
exam_notes: >-
  Theory 50 (Part A Employability Skills 10, Part B subject theory 40) + practical/project 50. Statistical Data and Advance Python are
  assessed through practicals; Computer Vision and NLP have theory and practical parts. Two board exams for Class 10: this subject can be
  taken in the May second exam only under compartment (improvement is limited to Science, Mathematics, Social Science and languages).
units:
