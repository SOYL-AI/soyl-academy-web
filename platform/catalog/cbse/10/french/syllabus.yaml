        title: La lettre informelle (80 mots)
        title_en: Informal letter (about 80 words) on the themes of lessons 2-8 and 10
        learning_outcomes:
          - Write an informal letter in French with the correct layout, greeting, closing and register
          - Use vocabulary and structures from the textbook themes (studies, work, reading, media, health, environment)
      - id: cbse-10-french-ch02-t02
        title: Le message (30-35 mots)
        title_en: Writing a message (30-35 words)
        learning_outcomes:
          - Write a short message that gives or asks for information clearly
      - id: cbse-10-french-ch02-t03
        title: Remettre un dialogue dans l'ordre
