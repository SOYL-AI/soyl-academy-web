    literature_texts: []
  - id: cbse-10-french-ch03
    number: 3
    title: Les verbes et les temps
    title_en: Verbs and tenses
    unit: "Section C : Grammaire"
    topics:
      - id: cbse-10-french-ch03-t01
        title: "Révision : présent, impératif, futur proche, passé composé, imparfait"
        title_en: "Revision of Class IX tenses: present, imperative, near future, passé composé, imperfect"
        learning_outcomes:
          - Conjugate regular, irregular and pronominal verbs correctly in the tenses learnt in Class IX
      - id: cbse-10-french-ch03-t02
        title: Le plus-que-parfait
        title_en: Pluperfect
        learning_outcomes:
          - Form the plus-que-parfait and use it for an action completed before another past action
      - id: cbse-10-french-ch03-t03
        title: Le futur simple et le futur antérieur
        title_en: Simple future and future perfect
        learning_outcomes:
          - Form the futur simple and futur antérieur and use them in time clauses (quand, dès que, après que)
      - id: cbse-10-french-ch03-t04
        title: Le conditionnel présent
        title_en: Present conditional
        learning_outcomes:
          - Form the conditionnel présent and use it for polite requests, wishes and hypotheses with si + imparfait
      - id: cbse-10-french-ch03-t05
        title: Le subjonctif
        title_en: Subjunctive
        learning_outcomes:
          - Form the present subjunctive and use it after expressions of necessity, wish, emotion and doubt
