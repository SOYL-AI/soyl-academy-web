        title: Texte inconnu (150-200 mots) avec image ou données
        title_en: Unseen factual or descriptive passage (150-200 words) with a picture or data
        learning_outcomes:
          - Read an unseen French passage and answer short-answer and true/false questions on it
          - Interpret information given in a picture, table or chart linked to the passage
      - id: cbse-10-french-ch01-t02
        title: "Recherche de vocabulaire : noms, verbes, contraires, synonymes, adjectifs"
        title_en: "Vocabulary search: noun and verb forms, opposites, synonyms, adjectives"
        learning_outcomes:
          - Find noun and verb forms, opposites, synonyms and adjectives in a passage
    removed_topics: []
