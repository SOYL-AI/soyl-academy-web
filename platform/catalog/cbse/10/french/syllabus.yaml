# CBSE Class 10 French (018), 2026-27. Sections, marks, writing tasks, grammar items and textbook lessons as printed in the
# CBSE 2026-27 French Class IX-X syllabus (Class X pages). Prescribed textbook: Entre Jeunes, Class X (CBSE), lessons 2-8
# and 10. Texts marked "Pour aller plus loin" and "Je découvre" are not tested. Lesson titles only; no text is reproduced
# (CONTEXT §8).
subject_id: cbse-10-french
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-french-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (subject enrichment activity (ASL) 5, portfolio 5, periodic tests 5,
  multiple assessments 5). Section A Comprehension 10: one unseen factual/descriptive prose passage of 150-200 words with a
  picture or data, short answers, true/false and vocabulary search (noun and verb forms, opposites, synonyms, adjectives).
  Section B Writing 20: one long composition (informal letter of about 80 words on the themes of lessons 2-8 and 10, 10
  marks, 1 of 3) and two short compositions of 30-35 words (message, rearranging a dialogue, completing a story; 5 marks
  each, 2 of 3). Section C Grammar 30: six questions of 5 marks; verbs is compulsory plus any five of the remaining eight
  topics (5 of 7 items per question). Section D Culture and civilisation 20: short answers 5x2 on lessons 2-8 and 10,
  plus two of true/false, match the following and fill in the blanks (5 marks each). Listening and speaking are practised
  in class and through art-integrated projects (role play, skit). Two board exams for Class 10: February main
  (compulsory) and an optional May second exam for improvement in up to three of Science, Mathematics, Social Science and
  languages.
units:
  - name: "Section A : Compréhension écrite"
    marks: 10
  - name: "Section B : Expression écrite"
    marks: 20
  - name: "Section C : Grammaire"
    marks: 30
  - name: "Section D : Culture et civilisation"
    marks: 20
chapters:
