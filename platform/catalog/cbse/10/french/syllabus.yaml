        learning_outcomes:
          - Replace nouns with the correct object pronoun, y or en and place it correctly in the sentence
      - id: cbse-10-french-ch04-t02
        title: Les pronoms relatifs simples et composés
        title_en: Simple and compound relative pronouns
        learning_outcomes:
          - Join sentences using qui, que, où, dont and lequel, laquelle, auquel, duquel and their forms
      - id: cbse-10-french-ch04-t03
        title: Les adjectifs et pronoms possessifs
        title_en: Possessive adjectives and pronouns
        learning_outcomes:
          - Use possessive adjectives and pronouns (le mien, la tienne...) agreeing in gender and number
      - id: cbse-10-french-ch04-t04
        title: Les adjectifs et pronoms démonstratifs (simples et composés)
        title_en: Demonstrative adjectives and pronouns (simple and compound)
        learning_outcomes:
          - Use ce, cet, cette, ces and celui, celle, ceux, celles (with -ci/-là) correctly
