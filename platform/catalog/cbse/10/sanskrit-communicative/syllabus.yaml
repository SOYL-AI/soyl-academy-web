        title: अशुद्धिसंशोधनम् (वचन-लिङ्ग-पुरुष-लकारदृष्ट्या)
        title_en: Error correction
        learning_outcomes:
          - वाक्येषु वचन-लिङ्ग-पुरुष-लकारसम्बद्धाः अशुद्धीः अभिज्ञाय संशोधयितुं शक्नुवन्ति
