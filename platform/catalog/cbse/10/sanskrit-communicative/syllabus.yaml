exam_notes: >-
  वार्षिकं मूल्याङ्कनम् 80 अङ्काः (3 hours) + आन्तरिकमूल्याङ्कनम् 20 (periodic test 5, multiple assessment 5, portfolio 5,
  language enrichment activities - listening/speaking and writing - 5). Section A unseen passage 10 (one prose passage of 80-100
  words: one-word answers 2x1, full-sentence answers 2x2, title 1, language tasks 3x1 MCQ). Section B creative writing 15 (formal
  or informal letter by filling blanks from a word box 10x1/2; picture description or paragraph 5x1; dialogue or story completion
  from a word box 10x1/2). Section C applied grammar 25 (sandhi 4, samasa 4, pratyaya 4, vachya in lat lakara 3, time in words 3,
  avyaya 4, error correction 3). Section D textbook comprehension 30 (prose, verse and drama extracts 5 each, question formation
  5, anvaya or bhavartha with blanks 2, contextual meaning MCQ 4, lesson-based story completion 4). Grammar items should be chosen
  from Manika Part 2 where possible, otherwise from the Manika workbook. Two board exams for Class 10: February main (compulsory)
  and an optional May second exam for improvement in up to three of Science, Mathematics, Social Science and languages.
