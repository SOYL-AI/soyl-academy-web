          - >-
            परसवर्णं, तुगागमं, वर्गीयप्रथमवर्णस्य तृतीयवर्णे परिवर्तनं, विसर्गस्य उत्व-रत्व-लोप-स्/श्/ष् परिवर्तनं च अवगन्तुं
            शक्नुवन्ति
      - id: cbse-10-sanskrit-communicative-ch03-t02
        title: 'समासः: तत्पुरुषः (विभक्तिः, नञ्, उपपदः), द्वन्द्वः, अव्ययीभावः (अनु, उप, सह, निर्, प्रति, यथा)'
        title_en: 'Compounds: tatpurusha, dvandva, avyayibhava'
        learning_outcomes:
          - वाक्येषु समस्तपदानां विग्रहं विग्रहपदानां समासं च कर्तुं शक्नुवन्ति
      - id: cbse-10-sanskrit-communicative-ch03-t03
        title: 'प्रत्ययाः: कृत् (तव्यत्, अनीयर्), तद्धित (मतुप्, ठक्, त्व, तल्), स्त्री (टाप्, ङीप्)'
        title_en: 'Suffixes: krit, taddhita and feminine'
        learning_outcomes:
          - प्रकृति-प्रत्ययविभागं संयोजनं च कर्तुं शक्नुवन्ति
