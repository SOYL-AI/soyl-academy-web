# CBSE Class 10 Sanskrit Communicative (119), 2026-27. Sections, marks, grammar items and the eleven prescribed lessons as
# printed in the CBSE 2026-27 Sanskrit (Sampreshanatmakam) syllabus. Textbooks: Manika Part 2 (textbook) and Manika
# Abhyasapustakam Part 2 (workbook), both published by CBSE. Lessons 10 and 11 are for internal assessment only
# (board_assessed: false). CBSE names lessons only, not their sources or authors. No text is reproduced (CONTEXT §8).
subject_id: cbse-10-sanskrit-communicative
academic_year: "2026-27"
