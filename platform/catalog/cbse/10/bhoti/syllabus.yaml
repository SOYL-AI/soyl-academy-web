exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (pen-and-paper tests 5, multiple assessment 5, portfolio 5,
  listening and speaking 5). Section A Reading 10: comprehension of an unseen passage extracted from stories, notes or
  biographies and a seen passage from any lesson of the textbook's poetry section. Section B Writing 11: formal letter
  writing to government and private organisations (lesson 16) and an essay on an unseen topic. Section C Grammar 25:
  lesson 15, dKa' gnad gsal ba'i me long - from the invocation (mchod brjod) to the application of the prefixes, and
  from the divisions of the suffix signs to the end. Section D Textbook 34: prose lessons 1-8 and poetry lessons 9-14.
  Two board exams for Class 10: February main (compulsory) and an optional May second exam for improvement in up to
  three of Science, Mathematics, Social Science and languages.
