# CBSE Class 10 Bhoti (088), 2026-27. Sections, marks, topics and textbook lesson numbers as printed in the CBSE 2026-27
# Bhoti Class IX-X syllabus (Class X course structure, in Bhoti and English). Prescribed book: Bhoti Textbook Class X
# (Directorate of School Education, UT of Ladakh). CBSE gives prose lessons 1-8 and poetry lessons 9-14 by NUMBER only, so
# those two chapters carry placeholder topics until the book contents page is supplied. No text is reproduced (CONTEXT §8).
