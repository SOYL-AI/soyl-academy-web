# CBSE Class 10 Sindhi (008), 2026-27. Sections, marks, grammar items, writing tasks and every prescribed lesson
# (titles as printed by CBSE in Devanagari Sindhi) from the CBSE 2026-27 Sindhi syllabus, Class X. Books: NIOS Secondary
# Course 238 Sindhi; biography Shahidan Jo Sartaj - Bhagat Kanwar Ram (Salamatrai Ochiram Gurbani, Rajasthan Sindhi
# Academy); grammar: Nutan Sindhi Grammar (Usha Saraswat) and Sindhi Vyakaran (Gangaram Israni). The CBSE document uses
# Devanagari script, not the Arabic script listed in subjects.yaml. Titles only; no text is reproduced (CONTEXT §8).
