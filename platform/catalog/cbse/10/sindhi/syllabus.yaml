exam_notes: >-
  Paper 80 marks (3 hours) + internal assessment 20 (as for all Class IX-X languages). Unseen prose passage 5 MCQs; unseen poem 5 MCQs;
  literature MCQs on prose, poetry and grammar 10; grammar 10; main course book (prose and poetry lessons) 30; supplementary book 6;
  creative writing 14 - essay of 300 words 6, letter or report 4, dialogue or advertisement 4. Unseen and MCQ items test understanding,
  reasoning, analysis and higher-order thinking. Class X grammar: tense, conjunction, interjection, synonyms, antonyms, punctuation, idioms
  and proverbs. Two board exams for Class 10: February main (compulsory) and an optional May second exam for improvement in up to three of
  Science, Mathematics, Social Science and languages.
