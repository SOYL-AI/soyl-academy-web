  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (project 5, listening and speaking 5, periodic test 5, copy 5).
  Part A (MCQ): reading comprehension 10 - one unseen prose passage and one unseen poem of about 200 words, five MCQs
  each; applied grammar 10 MCQs (Dumu, Muyangkap). Part B (descriptive): applied grammar 3x2 (Chhepkhip, Aai
  Dumu-o-saam); prose 24 (6x2 and 4x3 short answers); poetry 16 (2x2 and 4x3 short answers); writing 14 - letter 5 and
  essay of 120 words 5 (with choice of topics), translation 4. Two board exams for Class 10: February main (compulsory)
  and an optional May second exam for improvement in up to three of Science, Mathematics, Social Science and languages.
units:
  - name: Reading comprehension
    marks: 10
  - name: Applied grammar
    marks: 16
  - name: Literature - prose (Yaangchhapchhang)
    marks: 24
  - name: Literature - poetry (Yaangchhamchhang)
    marks: 16
  - name: Writing
    marks: 14
