# CBSE Class 10 Spanish (096), 2026-27. Sections, marks, grammar items, lexicon, culture topics and the prescribed
# authors and works as printed in the CBSE 2026-27 Spanish Class IX-X syllabus (Class X pages and the IX-X examination
# structure). CBSE prescribes no lesson list: Aula Internacional 1 continues, with relevant chapters of Aula Internacional 2
# (Difusión) for reference, so chapters follow the syllabus sections. Literature: author biographies and two best-known
# works each, titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-10-spanish
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-spanish-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (periodic tests, best 2 of 3, 10; notebook 5; subject enrichment
  activity on listening and speaking 5). All questions and answers are in Spanish. Section A Reading 15: two unseen short
  texts or dialogues, one with 5 MCQ or true/false items (1 mark each) and one with 5 short-answer questions (2 marks
  each). Section B Written expression 15: one composition of about 100-120 words from a choice of two on a visual or
  verbal stimulus 10, and one short text or dialogue of up to 50 words 5. Section C Applied grammar 35: conjugation of
  regular and irregular verbs 5, matching synonyms/antonyms or definitions 5, relating pictures with descriptions 5,
  completing a text with the correct verb forms 10, and completing sentences with the correct option (MCQ) 10. Section D
  Culture, civilisation and literature 15: five short answers on the prescribed authors and works (2 marks each) and five
  MCQ or true/false items on culture and civilisation. Two board exams for Class 10: February main (compulsory) and an
  optional May second exam for improvement in up to three of Science, Mathematics, Social Science and languages.
units:
  - name: "Sección A: Comprensión lectora"
    marks: 15
  - name: "Sección B: Expresión escrita"
    marks: 15
  - name: "Sección C: Gramática aplicada"
    marks: 35
  - name: "Sección D: Cultura, civilización y literatura"
    marks: 15
chapters:
  - id: cbse-10-spanish-ch01
    number: 1
    title: Comprensión lectora
    title_en: Reading comprehension (unseen texts and dialogues)
    unit: "Sección A: Comprensión lectora"
    topics:
      - id: cbse-10-spanish-ch01-t01
        title: Identificar el argumento lógico de un texto sencillo
        title_en: Identifying the logical argument of a simple text
        learning_outcomes:
          - Read a short unseen Spanish text or dialogue and answer MCQ and true/false questions on it
      - id: cbse-10-spanish-ch01-t02
        title: Ideas implícitas e información clave de textos, imágenes y gráficos
        title_en: Implicit ideas and key points from texts, visuals and graphics
        learning_outcomes:
          - Answer short-answer questions in Spanish that require inference and extraction of key points
    removed_topics: []
    literature_texts: []
  - id: cbse-10-spanish-ch02
    number: 2
    title: Expresión escrita
    title_en: Written expression
    unit: "Sección B: Expresión escrita"
    topics:
      - id: cbse-10-spanish-ch02-t01
        title: Composición (100-120 palabras) sobre la vida cotidiana
        title_en: Composition of 100-120 words on everyday life (family, friends, festivals, cultural events, the city)
        learning_outcomes:
          - Write a composition from a visual or verbal stimulus with sentences in a logical sequence
          - Use the grammar of the syllabus and language suited to the purpose and reader
      - id: cbse-10-spanish-ch02-t02
        title: Texto breve o diálogo (máximo 50 palabras)
        title_en: Short text or dialogue (up to 50 words)
        learning_outcomes:
          - Write a short message, note or dialogue on an everyday situation
    removed_topics: []
    literature_texts: []
  - id: cbse-10-spanish-ch03
    number: 3
    title: Los tiempos del pasado
    title_en: Past tenses
    unit: "Sección C: Gramática aplicada"
    topics:
      - id: cbse-10-spanish-ch03-t01
        title: Pretérito perfecto
        title_en: Present perfect (pretérito perfecto)
        learning_outcomes:
          - Form the pretérito perfecto and use it for recent actions and life experiences
      - id: cbse-10-spanish-ch03-t02
        title: Pretérito indefinido
        title_en: Simple past (pretérito indefinido)
        learning_outcomes:
          - Conjugate regular and common irregular verbs in the pretérito indefinido and narrate completed past events
      - id: cbse-10-spanish-ch03-t03
        title: Pretérito imperfecto
        title_en: Imperfect (pretérito imperfecto)
        learning_outcomes:
          - Use the imperfecto to describe people and things in the past and habitual past actions
      - id: cbse-10-spanish-ch03-t04
        title: Contraste entre perfecto, indefinido e imperfecto
        title_en: Contrast between the three past tenses
        learning_outcomes:
          - Choose the correct past tense in a text and justify the choice
      - id: cbse-10-spanish-ch03-t05
        title: Conjugación de verbos regulares e irregulares
        title_en: Conjugation of regular and irregular verbs
        learning_outcomes:
          - Conjugate regular, stem-changing and irregular verbs in the tenses of Classes IX and X
    removed_topics: []
    literature_texts: []
  - id: cbse-10-spanish-ch04
    number: 4
    title: Pronombres y verbos reflexivos
    title_en: Pronouns and reflexive verbs
    unit: "Sección C: Gramática aplicada"
    topics:
      - id: cbse-10-spanish-ch04-t01
        title: Verbos reflexivos y «se» impersonal
        title_en: Reflexive verbs and impersonal se
        learning_outcomes:
          - Use reflexive verbs and impersonal se in everyday sentences
      - id: cbse-10-spanish-ch04-t02
        title: Pronombres de objeto directo e indirecto
        title_en: Direct and indirect object pronouns
        learning_outcomes:
          - Replace nouns with direct and indirect object pronouns and place them correctly
      - id: cbse-10-spanish-ch04-t03
        title: Imperativo negativo (singular y plural) con pronombres
        title_en: Negative commands (singular and plural) with object pronouns
        learning_outcomes:
          - Give negative instructions and prohibitions with the correct form and pronoun position
    removed_topics: []
    literature_texts: []
  - id: cbse-10-spanish-ch05
    number: 5
    title: Perífrasis y expresiones verbales
    title_en: Verb phrases and expressions
    unit: "Sección C: Gramática aplicada"
    topics:
      - id: cbse-10-spanish-ch05-t01
        title: "Obligación y permiso: deber, tener que, hay que + infinitivo; ¿se puede + infinitivo?; ¿me das...?"
        title_en: "Obligation and permission: deber, tener que, hay que + infinitive; se puede; me das"
        learning_outcomes:
          - Express obligation, ask for and give or refuse permission, and ask for a favour
      - id: cbse-10-spanish-ch05-t02
        title: El verbo doler y «tener dolor de» + sustantivo
        title_en: The verb doler and tener dolor de + noun
        learning_outcomes:
          - Describe pain, symptoms and illnesses using doler and tener dolor de
      - id: cbse-10-spanish-ch05-t03
        title: "Opinión y planes: pensar y creer; pensar + infinitivo; haber que + infinitivo"
        title_en: "Opinions and plans: pensar and creer; pensar + infinitive; haber que + infinitive"
        learning_outcomes:
          - Give an opinion with pienso que / creo que and talk about plans and what has to be done
      - id: cbse-10-spanish-ch05-t04
        title: Idea del modo subjuntivo y el condicional simple
        title_en: Introduction to the subjunctive mood and the simple conditional
        learning_outcomes:
          - Recognise the subjunctive in common expressions and use the simple conditional for hypotheses and advice
    removed_topics: []
    literature_texts: []
  - id: cbse-10-spanish-ch06
    number: 6
    title: Comparación, conectores y preposiciones
    title_en: Comparison, connectors and prepositions
    unit: "Sección C: Gramática aplicada"
    topics:
      - id: cbse-10-spanish-ch06-t01
        title: Comparación de igualdad, superioridad e inferioridad
        title_en: Comparisons of equality, superiority and inferiority (revision)
        learning_outcomes:
          - Compare people, places and things now and before
      - id: cbse-10-spanish-ch06-t02
        title: "Conectores: además, es que, por eso"
        title_en: "Connectors: además, es que, por eso"
        learning_outcomes:
          - Add information, give a cause and state a consequence with the right connector
      - id: cbse-10-spanish-ch06-t03
        title: Por y para; muy y mucho
        title_en: Por versus para; muy versus mucho
        learning_outcomes:
          - Choose correctly between por and para and between muy and mucho
    removed_topics: []
    literature_texts: []
  - id: cbse-10-spanish-ch07
    number: 7
    title: Léxico y funciones comunicativas
    title_en: Vocabulary and communicative functions
    unit: "Sección C: Gramática aplicada"
    topics:
      - id: cbse-10-spanish-ch07-t01
        title: Viajes, turismo, paisajes y tiempo meteorológico
        title_en: Travel, tourism, landscapes and weather
        learning_outcomes:
          - Use vocabulary on holidays, travel, tourist places, hotels and weather to talk about experiences
      - id: cbse-10-spanish-ch07-t02
        title: Compras, ropa, moda y regalos
        title_en: Shopping, clothes, fashion and gifts
        learning_outcomes:
          - Name shops, clothes, materials and gift items and match words to pictures or definitions
      - id: cbse-10-spanish-ch07-t03
        title: Ciudad, señales de tráfico, salud y celebraciones
        title_en: The city, traffic signs, health and celebrations
        learning_outcomes:
          - Use vocabulary of street services, traffic signs, health problems, medicines and celebrations
      - id: cbse-10-spanish-ch07-t04
        title: Sinónimos, antónimos y descripción de personas y estados de ánimo
        title_en: Synonyms, antonyms and describing people and feelings
        learning_outcomes:
          - Match synonyms, antonyms and definitions and describe physical appearance, character and moods
    removed_topics: []
    literature_texts: []
  - id: cbse-10-spanish-ch08
    number: 8
    title: Cultura y civilización del mundo hispano
    title_en: Culture and civilisation of the Spanish-speaking world
    unit: "Sección D: Cultura, civilización y literatura"
    topics:
      - id: cbse-10-spanish-ch08-t01
        title: España y los países de Hispanoamérica de la Clase IX
        title_en: Spain and the Class IX countries (Mexico, Costa Rica, El Salvador, Panama, Cuba, Argentina, Bolivia, Chile, Ecuador, Paraguay)
        learning_outcomes:
          - Recall key events, festivals, monuments, cuisine, tourist spots, famous people and geography of these countries
      - id: cbse-10-spanish-ch08-t02
        title: Guatemala, Honduras, Nicaragua, República Dominicana, Puerto Rico, Colombia, Perú, Uruguay y Venezuela
        title_en: Countries added in Class X
        learning_outcomes:
          - Recall key events, festivals, monuments, cuisine, tourist spots, famous people and geography of the Class X countries
      - id: cbse-10-spanish-ch08-t03
        title: La sociedad hispana actual
        title_en: Hispanic society today
        learning_outcomes:
          - Describe shop hours, social events (weddings, births), major cultural prizes and Spain's system of government
    removed_topics: []
    literature_texts: []
