notes: >-
  SOYL default modelled on the CBSE board pattern (CONTEXT section 9: "use a generic blueprint per board and subject, stored as editable

  config"); not an official CBSE paper. Item types and marks follow the 2026-27 CBSE board style (MCQ/assertion-reason 1, short 2-3, long 5,

  case-based 4, about one-third internal choice) so practice transfers to the board paper. Subject-family override (languages) of the class
  default in platform/catalog/cbse/blueprints/<class>/. Built for literature chapters: extract-based (source-based) questions, short answers
  and a long answer;

  for grammar or writing chapters the assembler substitutes items of the same marks from that chapter (1-mark grammar items for a 5-mark
  extract

  group, writing tasks for long answers). Answers are written in the subject's language.
