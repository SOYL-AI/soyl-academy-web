notes: >-
  Second (May) board exam: CBSE has published no separate sample paper or design for the second exam; the 14-02-2026 notification makes it
  an improvement / compartment exam on the same subject, so this blueprint repeats the February pattern on the full syllabus (assumption,
  re-check when CBSE publishes a second-exam SQP).

  18 questions in four sections (क अपठितावबोधनम् 10, ख रचनात्मककार्यम् 15, ग अनुप्रयुक्तव्याकरणम् 25, घ पठितावबोधनम् 30). Marks per question
  are

  from the CBSE 2026-27 Sanskrit question-paper design table (blueprint in the syllabus PDF); the SQP PDF uses a legacy Devanagari font that
  does

  not extract, so internal choices other than the printed अथवा in Q2 (formal/informal letter) and Q3 (picture description/paragraph) and Q16

  (अन्वय/भावार्थ) could not be confirmed. FORMAT MAPPING: unseen passage -> case-based; letter completed from a मञ्जूषा (10 x 1/2) -> 5-mark

  long writing task; translation -> 1-mark short; grammar items typed बहुविकल्पात्मक in CBSE's design -> mcq, लघूत्तरात्मक -> short;

  textbook prose/verse/drama extracts -> source-based; story sequencing (8 x 1/2) has no ordering type and is modelled as one 4-mark short
  item

  (an 'ordering' type would make it auto-gradable). All answers are written in Sanskrit. Theory 80 + internal assessment 20.
