        learning_outcomes:
          - पाठस्य स्रोतः (आधुनिककविता (हरिदत्तशर्मा)) विधा च वक्तुं शक्नुवन्ति
      - id: cbse-10-sanskrit-ch04-t02
        title: पाठस्य सारः भावार्थश्च
        title_en: Summary and meaning
        learning_outcomes:
          - नगरजीवनस्य प्रदूषणं प्रकृतेः शुद्धतायाः आवश्यकतां च वर्णयितुं शक्नुवन्ति
          - पाठस्य मुख्यभावं हिन्दीभाषायाम् आङ्ग्लभाषायां वा अपि स्पष्टीकर्तुं शक्नुवन्ति
      - id: cbse-10-sanskrit-ch04-t03
        title: भाषिककार्यम्
        title_en: Language work on the lesson
        learning_outcomes:
