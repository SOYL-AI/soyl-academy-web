chapters:
  - id: cbse-10-sanskrit-ch01
    number: 1
    title: अपठितावबोधनम्
    title_en: Unseen passage comprehension
    unit: "क खण्डः: अपठितावबोधनम्"
    topics:
      - id: cbse-10-sanskrit-ch01-t01
        title: अपठितः गद्यांशः (80-100 शब्दाः)
        title_en: Unseen prose passage (80-100 words)
        learning_outcomes:
          - सरलकथां वर्णनं वा पठित्वा एकपदेन पूर्णवाक्येन च उत्तराणि लेखितुं शक्नुवन्ति
          - गद्यांशस्य उचितं शीर्षकं लेखितुं शक्नुवन्ति
      - id: cbse-10-sanskrit-ch01-t02
        title: अनुच्छेदाधारितं भाषिककार्यम्
        title_en: Language tasks on the passage
        learning_outcomes:
          - कर्तृ-क्रियापदचयनं, कर्तृ-क्रिया-अन्वितिं, विशेषण-विशेष्यचयनं, पर्याय-विलोमपदचयनं च कर्तुं शक्नुवन्ति
    removed_topics: []
    literature_texts: []
  - id: cbse-10-sanskrit-ch02
    number: 2
    title: रचनात्मककार्यम्
    title_en: Creative writing
    unit: "ख खण्डः: रचनात्मककार्यम्"
    topics:
      - id: cbse-10-sanskrit-ch02-t01
        title: औपचारिकम् अनौपचारिकं च पत्रलेखनम्
        title_en: Formal and informal letter writing
        learning_outcomes:
          - >-
            मञ्जूषायाः सहायतया औपचारिकम् (प्रधानाचार्याय, नगरनिगमाय, पत्रालयविभागाय) अनौपचारिकं (कुशलक्षेम-वर्धापन-निमन्त्रणपत्रम्) च पत्रं
            पूरयितुं शक्नुवन्ति
      - id: cbse-10-sanskrit-ch02-t02
        title: चित्राधारितं वर्णनम् अथवा अनुच्छेदलेखनम्
        title_en: Picture description or paragraph writing
        learning_outcomes:
          - मञ्जूषायाः सहायतया चित्रं वर्णयितुं अनुच्छेदं वा लेखितुं शक्नुवन्ति
      - id: cbse-10-sanskrit-ch02-t03
        title: अनुवादः (हिन्दी/आङ्ग्ल → संस्कृतम्)
        title_en: Translation of five sentences into Sanskrit
        learning_outcomes:
          - हिन्दीभाषायाम् आङ्ग्लभाषायां वा लिखितानि पञ्च वाक्यानि संस्कृतभाषायाम् अनूदितुं शक्नुवन्ति
    removed_topics: []
    literature_texts: []
  - id: cbse-10-sanskrit-ch03
    number: 3
    title: अनुप्रयुक्तव्याकरणम्
    title_en: Applied grammar
    unit: "ग खण्डः: अनुप्रयुक्तव्याकरणम्"
    topics:
      - id: cbse-10-sanskrit-ch03-t01
        title: "सन्धिः: स्वरसन्धिः (यण्, अयादि, पूर्वरूप), व्यञ्जनसन्धिः, विसर्गसन्धिः"
        title_en: "Sandhi: vowel, consonant and visarga"
        learning_outcomes:
          - निर्दिष्टसन्धीनां सन्धिं विच्छेदं च कर्तुं शक्नुवन्ति
          - वर्गीयप्रथमवर्णस्य तृतीय-पञ्चमवर्णे परिवर्तनं विसर्गस्य उत्व-रत्व-लोप-स्/श्/ष् परिवर्तनं च व्याख्यातुं शक्नुवन्ति
      - id: cbse-10-sanskrit-ch03-t02
        title: "समासः: तत्पुरुषः, कर्मधारयः, बहुव्रीहिः, अव्ययीभावः, द्वन्द्वः"
        title_en: Compounds (samasa)
        learning_outcomes:
          - वाक्येषु समस्तपदानां विग्रहं विग्रहपदानां समासं च कर्तुं शक्नुवन्ति
      - id: cbse-10-sanskrit-ch03-t03
        title: "प्रत्ययाः: कृत् (तव्यत्, अनीयर्, क्त, क्तवतु), तद्धित (मतुप्, ठक्, त्व, तल्), स्त्री (टाप्, ङीप्)"
        title_en: Suffixes (pratyaya)
        learning_outcomes:
          - प्रकृति-प्रत्ययविभागं संयोजनं च कर्तुं शक्नुवन्ति
      - id: cbse-10-sanskrit-ch03-t04
        title: वाच्यपरिवर्तनम् (लट्लकारे कर्तृ-कर्म-भाववाच्यम्)
        title_en: Change of voice (present tense only)
        learning_outcomes:
          - लट्लकारे कर्तृवाच्यात् कर्मवाच्ये भाववाच्ये च परिवर्तनं कर्तुं शक्नुवन्ति
      - id: cbse-10-sanskrit-ch03-t05
        title: समयलेखनम् (सामान्य-सपाद-सार्ध-पादोन)
        title_en: Telling time in words
        learning_outcomes:
          - अङ्कानां स्थाने संस्कृतशब्दैः समयं लेखितुं शक्नुवन्ति
      - id: cbse-10-sanskrit-ch03-t06
        title: अव्ययपदानि
        title_en: Indeclinables (avyaya)
        learning_outcomes:
          - उच्चैः, श्वः, ह्यः, अद्य, यदा-तदा, यावत्-तावत् इत्यादीनि अव्ययानि वाक्येषु प्रयोक्तुं शक्नुवन्ति
      - id: cbse-10-sanskrit-ch03-t07
        title: अशुद्धिसंशोधनम् (वचन-लिङ्ग-पुरुष-लकार-विभक्तिदृष्ट्या)
        title_en: Error correction
        learning_outcomes:
          - वाक्येषु अशुद्धीः अभिज्ञाय संशोधयितुं शक्नुवन्ति
    removed_topics: []
    literature_texts: []
