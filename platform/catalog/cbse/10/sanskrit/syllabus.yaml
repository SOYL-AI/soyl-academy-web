exam_notes: >-
  वार्षिकं मूल्याङ्कनम् 80 अङ्काः (3 hours) + आन्तरिकमूल्याङ्कनम् 20 (periodic test 5, multiple assessment 5, portfolio 5, subject
  enrichment 5). Section A unseen passage 10; Section B creative writing 15 (letter 5, picture description or paragraph 5, translation of
  five sentences 5); Section C applied grammar 25 (sandhi 4, samasa 4, pratyaya 4, vachya 3, samaya 4, avyaya 3, error correction 3);
  Section D textbook comprehension 30 (prose, verse and drama extracts 5 each, question formation 4, anvaya/bhavartha 4, story sequencing 4,
  contextual meaning 3). Two board exams for Class 10: February main (compulsory) and optional May second exam for improvement.
