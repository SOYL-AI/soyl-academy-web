          - सर्वनामस्थाने संज्ञाप्रयोगं कर्तुं शक्नुवन्ति
      - id: cbse-10-sanskrit-ch04-t04
        title: प्रश्नोत्तराणि अभ्यासश्च
        title_en: Question practice
        learning_outcomes:
          - एकपदेन पूर्णवाक्येन च प्रश्नानाम् उत्तराणि संस्कृतेन लेखितुं शक्नुवन्ति
          - रेखाङ्कितपदानि आधृत्य प्रश्ननिर्माणं कर्तुं शक्नुवन्ति
