# CBSE Class 10 Sanskrit (122), 2026-27. Lessons and grammar items as printed in the CBSE 2026-27 syllabus
# (Shemushi Part 2, revised edition; grammar from Abhyasvan Bhav Part 2 and Vyakaranavithi). Lesson 9 is not prescribed.
# Source attributions of lessons are from the NCERT book and are informational. No text is reproduced.
subject_id: cbse-10-sanskrit
