# CBSE Class 10 Japanese (094), 2026-27. Parts, marks, grammar patterns, kanji range and writing topics as printed in the
# CBSE 2026-27 Japanese Class IX-X syllabus (Class X pages). Prescribed books: Minna no Nihongo, Indian edition 1-2
# (textbook cum workbook, grammar notes, audio; Goyal Publishers, 2nd edition 2018), lessons 13-20, and the Nihongo
# Challenge Kanji book, chapters 6-10 (kanji 51-100, JLPT N5). CBSE lists the grammar of lessons 13-20 as one list, so
# chapters group it by verb form; reading passages relate to lessons 13-19. No text is reproduced (CONTEXT §8).
subject_id: cbse-10-japanese
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-japanese-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (periodic tests on grammar, vocabulary, kanji and script 10; notebook
  5; subject enrichment activity on listening and speaking 5). Part A, objective and MCQ (40, about 33% choice): grammar
  20 (desire, verb conjugation, particles, te-kudasai, te-mo ii, te wa ikemasen, te imasu, shirimasen and the te-form 6;
  adjective -kute/-de and V-te kara 4; dekimasu, hobby = V-dictionary form koto desu, mae ni, V-ta koto ga arimasu,
  -ku/-ni narimasu and plain forms 7; question words and adverbs 3) and kanji 20 (kanji to hiragana 10, hiragana to kanji
  10). Part B, descriptive (40, about 33% choice): reading 20 (3-4 unseen passages, notices or conversations related to
  lessons 13-19 with short answers 10, vocabulary search 5, true/false 5) and writing 20 (a composition of 300-350
  characters, an Instagram post of about six sentences in plain form, and completing dialogues or passages). Writing is
  marked for logical cohesion and for grammar and vocabulary; no marks are deducted for spelling. Two board exams for
  Class 10: February main (compulsory) and an optional May second exam for improvement in up to three of Science,
  Mathematics, Social Science and languages.
units:
  - name: "パートA：文法"
    marks: 20
  - name: "パートA：漢字"
    marks: 20
  - name: "パートB：読解"
    marks: 20
  - name: "パートB：作文"
    marks: 20
chapters:
  - id: cbse-10-japanese-ch01
    number: 1
    title: 希望と移動の表現
    title_en: Expressing wants and movement
    unit: "パートA：文法"
    topics:
      - id: cbse-10-japanese-ch01-t01
        title: ～が ほしいです・Vたいです
        title_en: Wanting something (hoshii) and wanting to do something (-tai)
        learning_outcomes:
          - Say what one wants and wants to do with hoshii and the -tai form, and ask others about their wishes
      - id: cbse-10-japanese-ch01-t02
        title: Nへ Vに いきます・かえります・きます
        title_en: Going, returning and coming somewhere for a purpose
        learning_outcomes:
          - State the place and purpose of going, coming or returning with the particles e and ni
      - id: cbse-10-japanese-ch01-t03
        title: どこか・なにか
        title_en: Indefinite words dokoka and nanika
        learning_outcomes:
          - Use dokoka and nanika in questions and answers about places and things
    removed_topics: []
    literature_texts: []
  - id: cbse-10-japanese-ch02
    number: 2
    title: て形
    title_en: The te-form
    unit: "パートA：文法"
    topics:
      - id: cbse-10-japanese-ch02-t01
        title: て形の作り方・Vてください
        title_en: Forming the te-form of the three verb groups; making requests with -te kudasai
        learning_outcomes:
          - Convert group I, II and III verbs into the te-form and make polite requests
      - id: cbse-10-japanese-ch02-t02
        title: Vています（進行・状態）・しりません
        title_en: -te imasu for actions in progress and states; shirimasen
        learning_outcomes:
          - Describe ongoing actions and resulting states, and answer with shitte imasu / shirimasen
      - id: cbse-10-japanese-ch02-t03
        title: Vても いいです・Vては いけません
        title_en: Seeking and granting permission; prohibition
        learning_outcomes:
          - Ask for, grant and refuse permission and state what must not be done
      - id: cbse-10-japanese-ch02-t04
        title: 形容詞 -くて／-で・Vてから
        title_en: Joining adjectives (-kute / -de) and sequencing actions with -te kara
        learning_outcomes:
          - Join adjectives and nouns in a sentence and describe one action happening after another
    removed_topics: []
    literature_texts: []
  - id: cbse-10-japanese-ch03
    number: 3
    title: ない形
    title_en: The nai-form
    unit: "パートA：文法"
    topics:
      - id: cbse-10-japanese-ch03-t01
        title: ない形の作り方・Vないで ください
        title_en: Forming the nai-form; asking someone not to do something
        learning_outcomes:
          - Form the nai-form of all verb groups and make negative requests (please don't)
      - id: cbse-10-japanese-ch03-t02
        title: Vなければ なりません・Vなくても いいです
        title_en: Must do and need not do
        learning_outcomes:
          - Express obligation and lack of obligation in everyday situations
    removed_topics: []
    literature_texts: []
  - id: cbse-10-japanese-ch04
    number: 4
    title: 辞書形と可能
    title_en: The dictionary form and ability
    unit: "パートA：文法"
    topics:
      - id: cbse-10-japanese-ch04-t01
        title: 辞書形・Vことが できます・Nが できます
        title_en: Dictionary form; expressing ability with koto ga dekimasu
        learning_outcomes:
          - Form the dictionary form and say what one can and cannot do
      - id: cbse-10-japanese-ch04-t02
        title: しゅみは Vことです／Nです・Vまえに
        title_en: Talking about hobbies; doing something before another action (mae ni)
        learning_outcomes:
          - Describe one's hobby and order actions with V-dictionary form / N no / time + mae ni
    removed_topics: []
    literature_texts: []
  - id: cbse-10-japanese-ch05
    number: 5
    title: た形
    title_en: The ta-form
    unit: "パートA：文法"
    topics:
      - id: cbse-10-japanese-ch05-t01
        title: た形の作り方・Vた ことが あります
        title_en: Forming the ta-form; talking about experiences
        learning_outcomes:
          - Form the ta-form and say whether one has had a particular experience
      - id: cbse-10-japanese-ch05-t02
        title: Vたり Vたり します
        title_en: Listing representative actions with -tari -tari shimasu
        learning_outcomes:
          - Describe a few of the things one does or did using -tari -tari shimasu
      - id: cbse-10-japanese-ch05-t03
        title: い形容詞 -く なります・な形容詞／N に なります
        title_en: Describing change (-ku / -ni narimasu)
        learning_outcomes:
          - Describe changes in people, things and weather with -ku narimasu and ni narimasu
    removed_topics: []
    literature_texts: []
  - id: cbse-10-japanese-ch06
    number: 6
    title: 普通形・疑問詞・副詞
    title_en: Plain forms, question words and adverbs
    unit: "パートA：文法"
    topics:
      - id: cbse-10-japanese-ch06-t01
        title: 普通形（来る・来ない・おいしい・きれいだ・たんじょうびだった など）
        title_en: Plain (casual) forms of verbs, adjectives and nouns
        learning_outcomes:
          - Convert polite sentences into plain style and use plain style in casual conversation and posts
      - id: cbse-10-japanese-ch06-t02
        title: 疑問詞と副詞
        title_en: Question words and adverbs of lessons 13-20
        learning_outcomes:
          - Choose the correct question word or adverb to complete a sentence or dialogue
      - id: cbse-10-japanese-ch06-t03
        title: 助詞
        title_en: Particles of lessons 13-20
        learning_outcomes:
          - Fill in the correct particle in sentences using the lesson 13-20 patterns
    removed_topics: []
    literature_texts: []
  - id: cbse-10-japanese-ch07
    number: 7
    title: 漢字（日本語チャレンジ 第6～10章、漢字51～100）
    title_en: Kanji (Nihongo Challenge Kanji book chapters 6-10, kanji 51-100, N5)
    unit: "パートA：漢字"
    topics:
      - id: cbse-10-japanese-ch07-t01
        title: 漢字を ひらがなで 書く
        title_en: Writing the readings of kanji words in hiragana
        learning_outcomes:
          - Read all words (kotoba) listed for kanji 51-100 and write their readings in hiragana
      - id: cbse-10-japanese-ch07-t02
        title: ひらがなを 漢字で 書く
        title_en: Writing hiragana words in kanji
        learning_outcomes:
          - Write the listed words in kanji with correct strokes and okurigana
    removed_topics: []
    literature_texts: []
  - id: cbse-10-japanese-ch08
    number: 8
    title: 読解
    title_en: Reading comprehension (unseen passages)
    unit: "パートB：読解"
    topics:
      - id: cbse-10-japanese-ch08-t01
        title: 短い文章・会話・物語・お知らせ（第13～19課）
        title_en: Short passages, conversations, stories and notices related to lessons 13-19
        learning_outcomes:
          - Read 3-4 unseen texts and answer short-answer questions on them
      - id: cbse-10-japanese-ch08-t02
        title: 語彙・文型の確認、正誤問題
        title_en: Vocabulary search, matching and true/false items
        learning_outcomes:
          - Find grammar patterns, adverbs and vocabulary in a passage and judge statements as true or false
    removed_topics: []
    literature_texts: []
  - id: cbse-10-japanese-ch09
    number: 9
    title: 作文
    title_en: Writing
    unit: "パートB：作文"
    topics:
      - id: cbse-10-japanese-ch09-t01
        title: 作文（300～350字）：わたしの しゅみ、インドか日本の場所の紹介
        title_en: "Composition (300-350 characters): my hobby; describing a place in India or Japan"
        learning_outcomes:
          - Write a cohesive composition of 300-350 characters with correct grammar and vocabulary
      - id: cbse-10-japanese-ch09-t02
        title: 作文：さいきん みた えいが、レストランで たべた にほんりょうり
        title_en: "Composition: a film I saw recently; Japanese food I ate at a restaurant"
        learning_outcomes:
          - Narrate a recent experience in the past tense with reasons and opinions
      - id: cbse-10-japanese-ch09-t03
        title: インスタグラムの投稿（普通形、6文）
        title_en: Instagram post or chat with a friend in plain form (about six sentences)
        learning_outcomes:
          - Write a short casual post or chat in plain style on a given topic
      - id: cbse-10-japanese-ch09-t04
        title: 会話・文章の完成
        title_en: Completing dialogues and passages with suitable words
        learning_outcomes:
          - Complete a conversation or passage with appropriate words and patterns from the syllabus
    removed_topics: []
    literature_texts: []
