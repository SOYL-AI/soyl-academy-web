# CBSE Class 10 Persian (023), 2026-27. Sections, marks, grammar items, prescribed books and lesson titles as printed in
# the CBSE 2026-27 Persian Class IX-X syllabus (Class X page). CBSE prints the lesson titles in transliteration; the Persian
# spellings here are SOYL transliterations back into Perso-Arabic script (to be checked in language review). Books: Farsi wa
# Dastoor (Book I) by Dr Zahra Khanlari (Idarah-e-Adabiyat-e-Delli) and Amoozish-e-Zaban-e-Farsi (Kitab-e-Sewum), Book III
# (Iran Culture House, New Delhi). Lesson titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-10-persian
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-persian-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (writing project 5 - appreciation of a Persian poem or prose, good
  handwriting, grammar chart; oral test on a topic from the prescribed text 5; eloquence test 10 - debate, group
  discussion, reading and recitation of Persian texts). Section A Reading 10: unseen passage of simple Persian. Section
  B Writing 10: paragraph of 50 words 6; letter or application 4. Section C Grammar and translation 20: grammar 10
  (noun, pronoun, adjective, past/present/future tenses, masadir and muzare with their meanings in Urdu, Hindi or
  English); translation 10 (simple Persian sentences into English, Hindi or Urdu and vice versa). Section D Literature
  (prose and poetry) 40 from the two prescribed books. Two board exams for Class 10: February main (compulsory) and an
  optional May second exam for improvement in up to three of Science, Mathematics, Social Science and languages.
units:
  - name: 'بخش الف: خواندن'
    marks: 10
  - name: 'بخش ب: نوشتن'
    marks: 10
  - name: 'بخش ج: دستور زبان و ترجمه'
    marks: 20
  - name: 'بخش د: ادبیات (نثر و شعر)'
    marks: 40
chapters:
  - id: cbse-10-persian-ch01
    number: 1
    title: درک مطلب
    title_en: Reading comprehension (unseen passage)
    unit: 'بخش الف: خواندن'
    topics:
      - id: cbse-10-persian-ch01-t01
        title: متن ناخوانده به فارسی ساده
        title_en: Unseen passage in simple Persian
        learning_outcomes:
          - Read an unseen passage in simple Persian and answer questions on its content
          - Infer the meaning of new words from context
      - id: cbse-10-persian-ch01-t02
        title: ایدهٔ اصلی و جزئیات
        title_en: Main idea and details
        learning_outcomes:
          - Identify the main idea of the passage and locate specific details
    removed_topics: []
    literature_texts: []
