        title_en: Translating Persian sentences into English, Hindi or Urdu
        learning_outcomes:
          - Translate simple Persian sentences accurately into English, Hindi or Urdu
      - id: cbse-10-persian-ch04-t02
        title: ترجمهٔ جمله‌ها به فارسی
        title_en: Translating English, Hindi or Urdu sentences into Persian
        learning_outcomes:
          - Translate simple sentences from English, Hindi or Urdu into correct Persian
    removed_topics: []
