        title: بندنویسی (۵۰ واژه)
        title_en: Paragraph writing (50 words)
        learning_outcomes:
          - Write a paragraph of about 50 words in Persian on a familiar topic with correct word order
      - id: cbse-10-persian-ch02-t02
        title: نامه و درخواست
        title_en: Letter and application writing
        learning_outcomes:
          - Write a letter or application in Persian in the correct format and tone
    removed_topics: []
    literature_texts: []
  - id: cbse-10-persian-ch03
    number: 3
    title: دستور زبان
    title_en: Grammar
    unit: 'بخش ج: دستور زبان و ترجمه'
    topics:
      - id: cbse-10-persian-ch03-t01
        title: اسم
        title_en: Noun (ism)
        learning_outcomes:
          - Identify nouns and form their plurals in Persian sentences
      - id: cbse-10-persian-ch03-t02
        title: ضمیر
        title_en: Pronoun (zamir)
        learning_outcomes:
          - Use personal and attached pronouns correctly
      - id: cbse-10-persian-ch03-t03
        title: صفت
        title_en: Adjective (sifat)
        learning_outcomes:
          - Use adjectives with the ezafe construction and form comparatives
      - id: cbse-10-persian-ch03-t04
        title: 'زمان‌ها: ماضی، حال و مستقبل'
        title_en: 'Tenses: past, present and future'
        learning_outcomes:
          - Conjugate verbs in the past, present and future tenses for all persons
      - id: cbse-10-persian-ch03-t05
        title: مصادر و مضارع با معنی
        title_en: Infinitives (masadir) and present stems (muzare) with meanings
        learning_outcomes:
          - Give the present stem of common Persian infinitives and their meanings in Urdu, Hindi or English
    removed_topics: []
    literature_texts: []
  - id: cbse-10-persian-ch04
    number: 4
    title: ترجمه
    title_en: Translation
    unit: 'بخش ج: دستور زبان و ترجمه'
    topics:
