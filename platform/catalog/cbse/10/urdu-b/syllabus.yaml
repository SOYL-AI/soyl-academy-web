# CBSE Class 10 Urdu Course B (303), 2026-27. Sections, marks, writing tasks, grammar items and the named writers and
# poets as printed in the CBSE 2026-27 Urdu Course B syllabus (2 pages, Urdu). Textbook: Jaan Pehchaan Part 5 (Class X)
# and Urdu Qawaid aur Insha. CBSE names the book but not its lessons and excludes none, so the textbook chapter carries
# placeholder topics until the contents page is supplied (see the M1 languages handoff). Literature: titles and authors
# only; no text is reproduced (CONTEXT §8).
subject_id: cbse-10-urdu-b
academic_year: "2026-27"
source_status: verified
