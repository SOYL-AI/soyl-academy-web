exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (periodic tests, multiple assessment, portfolio, subject enrichment,
  5 each, as for all Class X languages). Section A Reading and comprehension 20: one unseen prose passage (100-150 words)
  and one unseen poetic extract (two stanzas or five couplets), 5 marks each (one-mark items, one-sentence answers, with
  internal choice); one seen prose and one seen poetic extract from the textbook, 5 marks each. Section B Writing 25:
  essay of about 250 words on a familiar topic 10; application (fee concession, change of section, permission to attend
  a function, leave) or letter (personal to family and friends; official on village, society, health and other civic
  issues) 5; notes of about 100 words on the textbook prose lessons and their writers 5x1 and on the poems and poets
  5x1. Section C Grammar 20: eight two-mark questions on tenses, active and passive verbs, proper and common nouns,
  punctuation, antonyms and synonyms, singular and plural, prefixes and suffixes, gender (1x16) and use of words,
  idioms and sayings in sentences (1x4). Section D Literature 15: prose 8 (three 2-mark and two 1-mark questions) and
  poetry 7 (two 2-mark and three 1-mark questions), short answers that may be value based. Two board exams for Class 10:
  February main (compulsory) and an optional May second exam for improvement in up to three of Science, Mathematics,
  Social Science and languages.
