  - cbse-x-punjabi-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
exam_notes: >-
  Written exam 80 marks (3 hours) + internal assessment 20 (activities/assignments). I Reading 10: unseen prose passage of 200-250 words
  with 6 MCQs (6x1) and an unseen poem extract with four questions (4x1). II Grammar 12 (MCQ and short answer, internal choice): compound
  words (samasi shabad) 2x1, words with many meanings 2x1, adverbs 2x1, prefixes and suffixes (word formation) 2x1, idioms from the textbook
  list (letters ka to jha) used in sentences 4x1. III Writing 18: essay of about 200 words on a thought-based or general topic, one of three
  with hints, 8; personal or formal letter, one of two with hints, 6; description of a picture/photograph/scene in about 50 words 4. IV
  Textbooks 40: very short 1-mark questions - MCQs on stories and prose 5x1, MCQs on poems and one-act plays 5x1, one-or-two-word answers on
  stories and prose 4x1; short 2-mark questions on stories, one-act plays and prose in 25-30 words 7x2; long 4-mark questions on poems and
  prose in 50-60 words 2x4 and on the one-act plays 1x4 (all with internal choice). Two board exams for Class 10: February main (compulsory)
  and an optional May second exam for improvement in up to three of Science, Mathematics, Social Science and languages.
