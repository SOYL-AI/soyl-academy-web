        title_en: Unseen prose passage (200-250 words, 6 MCQs)
        learning_outcomes:
          - Read an unseen Punjabi prose passage and answer multiple-choice questions on facts, inferences and vocabulary
          - Identify the main idea and a suitable title for the passage
      - id: cbse-10-punjabi-ch01-t02
        title: ਅਣਡਿੱਠੀ ਕਾਵਿ-ਟੁਕੜੀ
        title_en: Unseen poem extract (4 questions)
        learning_outcomes:
          - Answer questions on the meaning, mood and message of an unseen poem extract
          - Explain figurative words and images in simple Punjabi
