# CBSE Class 10 Punjabi (004), 2026-27. Sections, marks, grammar items, writing tasks and every prescribed lesson
# (title and author) as printed in the CBSE 2026-27 Punjabi IX-X syllabus. Textbooks: Sahit Mala 10 (poetry and prose) and
# Vangi 10 (stories and one-act plays), both published by the Punjab School Education Board (www.pseb.ac.in).
# Literature: titles and authors only; no text is reproduced (CONTEXT §8).
subject_id: cbse-10-punjabi
academic_year: "2026-27"
source_status: verified
