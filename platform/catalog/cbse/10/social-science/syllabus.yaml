      - id: cbse-10-social-science-ch02-t02
        title: "Differing strands within the movement"
        learning_outcomes:
          - "Compare how towns, peasants, tribal groups and plantation workers understood and joined Non-Cooperation"
      - id: cbse-10-social-science-ch02-t03
        title: "Towards Civil Disobedience"
        learning_outcomes:
