      - id: cbse-10-social-science-ch02-t04
        title: "The sense of collective belonging"
        learning_outcomes:
          - "Analyse how history, folklore, songs, images and symbols created a sense of nationhood"
      - id: cbse-10-social-science-ch02-t05
        title: "Map work: Indian National Movement"
        learning_outcomes:
