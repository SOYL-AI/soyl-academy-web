# CBSE Class 10 Social Science (087), 2026-27. Four NCERT books, in the CBSE syllabus order:
# History (India and the Contemporary World – II), Geography (Contemporary India – II),
# Political Science (Democratic Politics – II), Economics (Understanding Economic Development).
# Chapters are numbered continuously across the four books (ch01-ch21); `unit` names the book.
# Parts that CBSE assesses only internally carry `board_assessed: false` (extension field, see handoff).
subject_id: cbse-10-social-science
academic_year: "2026-27"
source_status: verified
sources: [cbse-x-social-science-2026-27, cbse-secondary-curriculum-2026-27, cbse-two-board-exams-x-2026, cbse-sqp-x-2026-27, ncert-textbooks-secondary]
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (periodic assessment 5, multiple assessment via
  interdisciplinary project 5, subject enrichment project on Consumer Rights / Social Issues / Sustainable
  Development 5, portfolio 5). Board paper: 20 MCQs x1 (incl. assertion-reason), 4 x 2 marks, 5 x 3 marks,
  3 case-based x 4 marks, 4 x 5 marks, map 5 marks (History 2 + Geography 3). Competency mix: remembering/
  understanding 30%, applying 13.25%, analysing/evaluating/creating 50%, map skill 6.25%. History "The Making of
  a Global World" is examined only for subtopics 1-1.3; "The Age of Industrialisation" is periodic assessment only;
  Geography "Lifelines of National Economy" is examined for map work only; Economics "Globalisation" is examined
  only for "What is Globalisation?" and "Factors that have enabled Globalisation". Disaster Management
  (CBSE "Together, towards a safer India – III") is internal only. Two board exams for Class 10: main exam in
  February (compulsory) and optional second exam in May for improvement; the better score counts.
units:
  - name: "History: India and the Contemporary World – II"
    marks: 20
  - name: "Geography: Contemporary India – II"
    marks: 20
  - name: "Political Science: Democratic Politics – II"
    marks: 20
  - name: "Economics: Understanding Economic Development"
    marks: 20
chapters:
  # ---------------- History ----------------
  - id: cbse-10-social-science-ch01
    number: 1
    title: "The Rise of Nationalism in Europe"
    unit: "History: India and the Contemporary World – II"
    topics:
      - id: cbse-10-social-science-ch01-t01
        title: "The French Revolution and the idea of the nation"
        learning_outcomes:
          - "Explain how the French Revolution created a sense of collective identity and how the Napoleonic Code spread these ideas"
      - id: cbse-10-social-science-ch01-t02
        title: "The making of nationalism in Europe: liberalism, conservatism and the 1830s-1848 revolutions"
        learning_outcomes:
          - "Describe the aims of the liberal middle classes and the conservative order after 1815"
          - "Explain the significance of the 1848 revolutions and the role of romanticism, language and folk culture"
      - id: cbse-10-social-science-ch01-t03
        title: "The making of Germany and Italy; the strange case of Britain"
        learning_outcomes:
          - "Sequence the unification of Germany under Prussia and of Italy, naming the key actors"
          - "Explain how the British nation-state was formed differently"
      - id: cbse-10-social-science-ch01-t04
        title: "Visualising the nation; nationalism and imperialism"
        learning_outcomes:
          - "Interpret allegories such as Marianne and Germania"
          - "Analyse how Balkan nationalism and imperial rivalry led towards the First World War"
    removed_topics: []
    literature_texts: []
