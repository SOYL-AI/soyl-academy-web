paper_type: unit-test
academic_year: "2026-27"
duration_min: 120
total_marks: 50
mark_shares: {}
scope: unit
sections:
  - id: A
    title: Section A - Objective (1 mark each)
    instructions: Multiple-choice and assertion-reason questions.
    items:
      - {type: mcq, count: 8, marks_each: 1}
      - {type: assertion-reason, count: 2, marks_each: 1}
  - id: B
    title: Section B - Very short answer (2 marks)
    instructions: Internal choice in two questions.
    items:
      - {type: short, count: 3, marks_each: 2}
      - {type: short, count: 4, marks_each: 2, internal_choice: {attempt: 1, of: 2}}
  - id: C
    title: Section C - Short answer (3 marks)
    instructions: Internal choice in two questions.
    items:
      - {type: short, count: 2, marks_each: 3}
      - {type: short, count: 4, marks_each: 3, internal_choice: {attempt: 1, of: 2}}
  - id: D
    title: Section D - Long answer (5 marks)
    instructions: Internal choice in both questions.
    items:
      - {type: long, count: 4, marks_each: 5, internal_choice: {attempt: 1, of: 2}}
  - id: E
    title: Section E - Source-based (4 marks each)
    instructions: Read each source and answer all parts; internal choice in one sub-part.
    items:
      - {type: source-based, count: 2, marks_each: 4}
source_status: unverified
source: lead-default
notes: >-
  SOYL default modelled on the CBSE board pattern (CONTEXT section 9: "use a generic blueprint per board and subject, stored as editable

  config"); not an official CBSE paper. Item types and marks follow the 2026-27 CBSE board style (MCQ/assertion-reason 1, short 2-3, long 5,

  case-based 4, about one-third internal choice) so practice transfers to the board paper. Subject-family override (humanities) of the class
  default in platform/catalog/cbse/blueprints/<class>/. Source-based questions replace case-based ones, as in the CBSE board papers for
  these subjects. Map work

  (SST, History, Geography) is set only in chapters with map items: the assembler may replace a 2-mark short answer with two 1-mark map
  items.
