notes: >-
  Second (May) board exam: CBSE has published no separate sample paper or design for the second exam; the 14-02-2026 notification makes it
  an improvement / compartment exam on the same subject, so this blueprint repeats the February pattern on the full syllabus (assumption,
  re-check when CBSE publishes a second-exam SQP).

  38 questions in four discipline sections of 20 marks (2026-27 SQP layout). Across the paper: 20 x 1 (MCQ incl. 3 assertion-reason,
  statement-

  combination and chronology items), 4 x 2 VSA (<= 40 words), 5 x 3 SA (<= 60 words), 3 x 4 case-based (three sub-questions, <= 100 words),

  4 x 5 LA (<= 120 words, each with an A/B choice; SA Q6 also has a choice) and map work 5 (History Q9 = 2, Geography Q19 = 3).

  FORMAT MAPPING (assessment-designer, 2026-10-27): map work is one contract-v2 'map' question per section on one outline map of India:
  History Q9 = map, 2 marks (two places), scoped to Nationalism in India (ch02), the only History chapter on the CBSE map list;
  Geography Q19 = map, 3 marks (three features). The History case-based question is set as 'source-based' (a source with three
  sub-questions, as in the SQP). Each section is scoped to its discipline's chapters (section 'chapters'), and full mocks carry the
  syllabus unit marks (20 each) exactly.

  Picture/cartoon-based MCQs need image assets. Visually impaired candidates get substitute items (not modelled). Competency weights from
  the

  CBSE syllabus: remembering/understanding 30%, applying 13.25% + map skill 6.25% (folded into application), analysing/evaluating/creating
  50%

  (the CBSE table totals 99.5%). Theory 80 + internal assessment 20.
