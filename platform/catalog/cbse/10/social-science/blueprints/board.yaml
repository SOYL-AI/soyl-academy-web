notes: >-
  38 questions in four discipline sections of 20 marks (2026-27 SQP layout). Across the paper: 20 x 1 (MCQ incl. 3 assertion-reason,
  statement-

  combination and chronology items), 4 x 2 VSA (<= 40 words), 5 x 3 SA (<= 60 words), 3 x 4 case-based (three sub-questions, <= 100 words),

  4 x 5 LA (<= 120 words, each with an A/B choice; SA Q6 also has a choice) and map work 5 (History Q9 = 2, Geography Q19 = 3).

  FORMAT MAPPING: map work has no QuestionType; it is modelled as 1-mark 'short' items (one per place to identify/locate) in the History and

  Geography sections - the assembler must keep them together as one map question on one outline map of India (a 'map' type would fix this).

  Picture/cartoon-based MCQs need image assets. Visually impaired candidates get substitute items (not modelled). Competency weights from
  the

  CBSE syllabus: remembering/understanding 30%, applying 13.25% + map skill 6.25% (folded into application), analysing/evaluating/creating
  50%

  (the CBSE table totals 99.5%). Theory 80 + internal assessment 20.
