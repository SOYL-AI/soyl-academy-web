exam_notes: >-
  Theory 80 marks (3 hours), 14 questions + internal assessment 20 (periodic tests, best two of three 5; portfolio 5; subject enrichment -
  quiz, book review or books-and-authors chart, art-integrated activity 5; multiple assessment - listening and speaking, group work, field
  work, audio-visual presentation 5). Section A Reading 10: unseen prose passage of 130-150 words, 5x2. Section B Writing 12: essay on a
  contemporary issue 1 of 3 x 6; letter to the editor of a newspaper 1 of 2 x 6. Section C Grammar 10: prosody (chhanda) 1 of 2 x 4,
  transformation of sentences 2 of 3 x 1, idioms 2 of 3 x 1, correction of common errors in words 2 of 3 x 1. Section D Literature 48:
  explanation from prose 1 of 2 x 5, prose short answers 3 of 5 x 2, prose MCQs 10x1; explanation from poetry 1 of 2 x 5, poetry short
  answers 3 of 5 x 2, poetry MCQs 10x1; non-detailed short answers 6 of 8 x 1. Two board exams for Class 10: February main (compulsory) and
  an optional May second exam for improvement in up to three of Science, Mathematics, Social Science and languages.
