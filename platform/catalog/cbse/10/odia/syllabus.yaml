# CBSE Class 10 Odia (013), 2026-27. Sections, marks, design of the question paper, grammar items, writing tasks
# and every prescribed lesson (in Roman transliteration, without authors) from the CBSE 2026-27 Odia IX-X syllabus,
# Class X. Books: Sahitya Sindhu (Class X, revised 2024) and Madhyamika Byakarana (Class X, revised 2024), Board of
# Secondary Education, Odisha. Book lesson numbers 8 and 13 are not prescribed. CBSE does not say which lessons form the
# non-detailed section; SOYL assumes the short stories and one-act plays. Odia-script titles are SOYL's rendering of
# CBSE's transliteration. Titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-10-odia
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-odia-2026-27
