# CBSE Class 10 Russian (021), 2026-27. Sections, marks, essay topics, grammar items and prescribed text numbers as printed
# in the CBSE 2026-27 Russian Class IX-X syllabus (Class X page). Prescribed books: "Russian for Children" (Russkii Yazyk),
# Book IV, by M. N. Vityutnev and others (Moscow, 1989 edition) and "Russian in Exercises" by S. Khavronina and
# A. Shirochenskaya (Progress Publishers, 2nd edition). CBSE lists the prescribed texts only by number (2, 6, 8, 11, 15,
# 18, 19, 21, 23, 25, 26, 28, 29), so the textbook chapter carries a placeholder topic until the book's contents page is
# supplied. No text is reproduced (CONTEXT §8).
subject_id: cbse-10-russian
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-russian-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (listening and speaking, including interpreting short texts between
  Russian and English, 10; a small project on Russian culture and civilisation such as cinema, climate, sports, songs or
  poetry 5; a written account of the experience of learning Russian 5). Section A Reading comprehension 10: an unseen
  Russian passage with 4-5 questions answered in Russian. Section B Composition 15: an essay of 100-150 words on one of the
  listed topics. Section C Applied grammar 40: cases with and without prepositions as used in the prescribed texts,
  adjectives in all cases, the relative pronoun который in different cases, verb aspects with past and future tenses, and
  translation of simple sentences Russian-English and English-Russian. Section D Literature 15: five questions answered in
  Russian on the prescribed texts. Two board exams for Class 10: February main (compulsory) and an optional May second
  exam for improvement in up to three of Science, Mathematics, Social Science and languages.
units:
  - name: "Раздел A: Чтение и понимание текста"
    marks: 10
  - name: "Раздел B: Сочинение"
    marks: 15
  - name: "Раздел C: Практическая грамматика"
    marks: 40
  - name: "Раздел D: Литература"
    marks: 15
