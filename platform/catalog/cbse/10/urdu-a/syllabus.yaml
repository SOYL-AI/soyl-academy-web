# CBSE Class 10 Urdu Course A (003), 2026-27. Sections, marks, writing tasks, grammar items, named authors/poets and
# excluded lessons as printed in the CBSE 2026-27 Urdu Course A syllabus (3 pages, Urdu). Textbooks: Nawa-e-Urdu (Class X),
# supplementary reader Gulzar-e-Urdu (Class X) and Urdu Qawaid aur Insha. CBSE lists only the EXCLUDED lessons, not the
# full contents of either book, so the two textbook chapters carry placeholder topics until the NCERT contents pages are
# supplied (see the M1 languages handoff). Literature: titles and authors only; no text is reproduced (CONTEXT §8).
subject_id: cbse-10-urdu-a
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-urdu-a-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
  - ncert-textbooks-secondary
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (periodic tests, multiple assessment, portfolio, subject enrichment,
  5 each, as for all Class X languages). Section A Reading and comprehension 20: one unseen prose passage (100-150 words)
  and one unseen poetic extract (two stanzas or five couplets), 5 marks each (one-mark items, one-sentence answers, with
  internal choice); one seen prose and one seen poetic extract from the textbook, 5 marks each. Section B Writing 25:
  essay of 250-300 words on a social issue 10; application (complaint, invitation, permission) or letter (personal,
  business) 4; notes of about 100 words on the textbook prose lessons and their writers 4x1, on the textbook poems and
  poets 3x1, and on the supplementary-reader poems 4x1. Section C Grammar 20: verbs and their kinds 5, figures of speech
  (ilm-e-bayan and ilm-e-badi) 5, idioms and proverbs 5, punctuation 2, poetic terms 3. Section D Literature 15:
  short-answer questions on textbook prose 2x2, textbook poetry 2x2 and supplementary reader 2x2 (may be value based),
  and a note on one of three literary genres 3. Two board exams for Class 10: February main (compulsory) and an optional
  May second exam for improvement in up to three of Science, Mathematics, Social Science and languages.
