notes: >-
  Urdu Course A (003) theory paper, 80 marks, 3 hours, from the CBSE 2026-27 sample question paper and marking scheme. Section totals are
  printed in the SQP instructions (A reading and comprehension 20, B writing 25, C functional grammar 20, D literature 15). The Urdu
  (Nastaliq) text extracts out of order, so the question-level split is a SOYL estimate from the legible "(n x m)" markers; internal choices
  in C and D are modelled where the printed marks exceed the section total.

  FORMAT MAPPING (languages): unseen passages -> case-based; textbook extracts/passages -> source-based; 1-mark grammar

  and vocabulary items -> short (fill-blank, mcq, match or true-false where the paper clearly uses gap-fill, options, matching or
  true/false);

  writing tasks (letter, essay, paragraph, notice, dialogue, story, e-mail) and translation passages -> long or short by marks - the
  contract

  has no writing/translation type with a rubric. "Answer any n" choices inside one question are modelled as internal_choice only where the

  number offered is printed; otherwise only the attempted items are listed. Visually impaired substitute items are not modelled.
