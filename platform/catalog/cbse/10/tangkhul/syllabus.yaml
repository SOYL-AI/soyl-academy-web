# CBSE Class 10 Tangkhul (093), 2026-27. Sections, topics, lessons and removed portions as printed in the CBSE 2026-27
# Tangkhul syllabus (Class X page). Books (Tangkhul Literature Society): Tangkhul Tuitam Kathara, Tangkhul Grammar and
# Composition, Tangkhul Rapid Reader. CBSE gives NO marks for the sections, so units carry null marks and there is no board
# blueprint yet. Tangkhul is written in Roman script. Lesson titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-10-tangkhul
