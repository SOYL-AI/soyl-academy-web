  - cbse-x-tangkhul-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (assignment 10, speaking and listening 10). CBSE lists the sections
  (composition, grammar, literature) without marks or question types. Removed from the 2026-27 syllabus: grammar adverb
  and tense; prose Chanrei Phamkok sakhamatha, Suisa Rungsung, Wortam Ramyao; poetry Na Mirin, Tangkhul Avaram; rapid
  reader Manipurwui luikhava. Two board exams for Class 10: February main (compulsory) and an optional May second exam
  for improvement in up to three of Science, Mathematics, Social Science and languages.
