# CBSE Class 10 Mizo (098), 2026-27. Sections, marks, grammar items and lessons (titles and authors) as printed in the
# CBSE 2026-27 Mizo Class IX-X syllabus (Class X pages). Prescribed textbook: Tlawng, published by the Expert Committee on
# Mizo Language (CBSE), revised edition 2022. Mizo is written in Roman script. Lesson titles and authors only; no text is
# reproduced (CONTEXT §8). Mizo headings for the language sections (reading, grammar, composition) are SOYL wording.
subject_id: cbse-10-mizo
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-mizo-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (as for all Class X languages). Section A Reading 15: one unseen
  passage of at least 500 words with six 2-mark questions and three 1-mark grammar questions. Section B Grammar 15:
  phrases and idioms (thu chi hrang hrang) 5x1, punctuation 3x1, mood 3x1, and 2x2 short answers on "Mizo Tawng Hman Dik
  lo Thenkhat" (Rozama Chawngthu). Section C Composition 25: dialogue writing 6, vocabulary enrichment from other
  languages 5x1, essay 10, precis of an unseen passage 2x2. Section D Literature 25 (Tlawng): poetry - 1 long answer of
  4, 2 short answers of 2, 4 objective items; prose - 1 long answer of 4, 3 short answers of 2, 3 objective items. Two
  board exams for Class 10: February main (compulsory) and an optional May second exam for improvement in up to three of
  Science, Mathematics, Social Science and languages.
units:
  - name: Section A - Reading comprehension
    marks: 15
  - name: Section B - Grammar
    marks: 15
  - name: Section C - Composition
    marks: 25
  - name: Section D - Literature (Tlawng)
    marks: 25
