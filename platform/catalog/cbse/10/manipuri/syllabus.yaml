# CBSE Class 10 Manipuri (011), 2026-27. Sections, marks, writing and grammar items and every prescribed lesson
# with its author, as printed (in Roman script) in the CBSE 2026-27 Manipuri IX-X syllabus, Class X. Books: Manipuri
# Nachom (Class X, prose and poetry), supplementary reader Manipuri Nongin, grammar Anouba Manipuri Lonmit Amasung
# Lonjan (Class IX-X), Board of Secondary Education / Council of Higher Secondary Education, Manipur. Content is verified
# against CBSE; status is unverified only because the Meitei Mayek spellings of titles are SOYL's transliterations and
# need review by a Manipuri speaker. Titles and authors only; no text is reproduced (CONTEXT §8).
