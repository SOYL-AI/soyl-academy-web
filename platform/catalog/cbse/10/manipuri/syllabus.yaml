exam_notes: >-
  Paper 80 marks (3 hours) + internal assessment 20 (speaking and listening 10; assignments, notebook and project work 10). Section A
  Reading 15: three unseen passages based on the supplementary reader or any Manipuri textbook. Section B Writing 25: essay 7, letter 5,
  amplification 6, application or notice 4, phrases and idioms 3 (amplification and the sub-skill are based on Anouba Manipuri Lonmit
  Amasung Lonjan, Class IX-X). Section C Grammar 20. Section D Literature: prose 10, poetry 10. Question forms: 5 essay/long answers (26
  marks), 3 SA-I (9), 7 SA-II (14), 6 VSA (6), 25 MCQs (25). Objectives: knowledge 15, comprehension 40, expression 25. Internal choice may
  be given in long answers. Difficulty: difficult 30%, average 50%, easy 20%. Two board exams for Class 10: February main (compulsory) and
  an optional May second exam for improvement in up to three of Science, Mathematics, Social Science and languages.
