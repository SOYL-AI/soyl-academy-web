# CBSE Class 10 Design Thinking and Innovation (422), 2026-27 skill subject. Theory component only (theory 50 + practical 50).
# Part A Employability Skills from the CBSE Employability Skills (Class X) curriculum; Part B from the subject curriculum.
# UNVERIFIED topics: the 2026-27 CBSE document gives only the six Part B unit names and marks; topics follow the CBSE/NID Design Thinking and Innovation workbooks as known to the architect.
subject_id: cbse-10-design-thinking
academic_year: "2026-27"
source_status: unverified
sources:
  - cbse-x-dti-422-2026-27
  - cbse-x-employability-skills-2026-27
  - cbse-skill-curriculum-2026-27
  - cbse-two-board-exams-x-2026
exam_notes: >-
  Theory 50 marks (2 hours) + practical 50. Theory paper: Part A Employability Skills 10 (objective: any 4 of 6 x 1; short answer: any 3 of
  5 x 2) and Part B subject skills 40 (objective: 4 blocks of 6, attempt 5 each = 20 x 1; short answer any 4 of 6 x 2 in 20-30 words; long
  answer any 3 of 6 x 4 in 50-80 words), per the CBSE skill sample paper. Two board exams for Class 10: this subject is examined only in the
  February main exam; it can be taken in the May second exam only under the compartment category (improvement in May is limited to Science,
  Mathematics, Social Science and languages; notification of 14-02-2026).
units:
  - name: "Part A: Employability Skills"
    marks: 10
  - name: "Part B Unit 1: Fundamentals of Communication Skills"
    marks: 6
  - name: "Part B Unit 2: Fundamentals of Story Creation"
    marks: 7
  - name: "Part B Unit 3: Introduction to Creativity"
    marks: 7
  - name: "Part B Unit 4: Fundamentals of Animation"
    marks: 6
  - name: "Part B Unit 5: Fundamentals of Sustainability and Design"
    marks: 7
  - name: "Part B Unit 6: Introduction to Prototyping Methods"
    marks: 7
chapters:
  - id: cbse-10-design-thinking-ch01
    number: 1
    title: "Employability Skills: Communication Skills – II"
    unit: "Part A: Employability Skills"
    topics:
      - id: cbse-10-design-thinking-ch01-t01
        title: "Methods of communication: verbal, non-verbal and visual"
        learning_outcomes:
          - Compare the pros and cons of written, verbal and non-verbal communication
          - List do's and don'ts to avoid common body-language mistakes
      - id: cbse-10-design-thinking-ch01-t02
        title: "Communication cycle and feedback: descriptive and specific feedback"
        learning_outcomes:
          - Explain the communication cycle and why feedback matters
          - Frame descriptive and specific (rather than non-specific) feedback sentences
      - id: cbse-10-design-thinking-ch01-t03
        title: Barriers to effective communication and measures to overcome them
        learning_outcomes:
          - Classify physical, linguistic, interpersonal and organisational barriers
          - Suggest measures to overcome a given barrier
      - id: cbse-10-design-thinking-ch01-t04
        title: "Principles of communication: the 7 Cs"
        learning_outcomes:
          - Apply the 7 Cs (clear, concise, concrete, correct, coherent, complete, courteous) to rewrite a message
      - id: cbse-10-design-thinking-ch01-t05
        title: "Basic writing skills: sentences, phrases, parts of speech, articles and paragraphs"
        learning_outcomes:
          - Identify kinds and parts of sentences and parts of speech
          - Construct a well-organised paragraph on a work-related topic
    removed_topics: []
    literature_texts: []
