# CBSE Class 10 Sherpa (134), 2026-27. Sections, topics and lessons as printed in the CBSE 2026-27 Sherpa Class IX-X
# syllabus (Class X pages). Books (Education Department, Government of Sikkim): Sherpai Sumtak Tang Tri-Tsom (writing and
# grammar); Sherpai Ked-Deb, Sherpai Molwa and Sherpai Leg-Shyed (literature and poetry). CBSE prints every Sherpa term in
# romanisation; the Tibetan-script spellings here are SOYL renderings to be checked in language review (romanisation kept
# in title_en). Unit marks follow CBSE's course-structure table (reading 24, writing 15, grammar 16, literature 25); the
# question-wise table on the same page does not add up to these, see exam_notes. No text is reproduced (CONTEXT §8).
subject_id: cbse-10-sherpa
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-sherpa-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (periodic assessment, speaking and listening, multiple assessment).
  Course structure: reading comprehension 24, writing 15, grammar 16, literature 25. Question-wise table: Part A (MCQ) -
  four unseen passages of about 200 words, attempt one prose and one poetry (5+5); applied grammar MCQs 10. Part B
  (descriptive) - applied grammar short answers 6 (composition, letter, translation, proverbs and honorifics);
  literature short answers on Sherpai Ked prose 14, Sherpai Leg-Shyed poetry 12, rapid reader 10 and further Ked-Deb
  lessons 4; writing - essay of at least 200 words on a contemporary issue (1 of 2) 14, letter (1 of 2) and translation
  from English into Sherpa (long answers). The two tables are inconsistent; follow the board sample paper when
  published. Two board exams for Class 10: February main (compulsory) and an optional May second exam for improvement in
  up to three of Science, Mathematics, Social Science and languages.
