exam_notes: >-
  सैद्धांतिक 80 अंक (3 घंटे) + आंतरिक मूल्यांकन 20 (सामयिक आकलन 5, बहुविध आकलन 5, पोर्टफ़ोलियो 5, श्रवण एवं वाचन 5)। खंड क अपठित बोध 14
  (गद्यांश ~250 शब्द 7, काव्यांश ~120 शब्द 7); खंड ख व्याकरण 16 (20 में से 16 प्रश्न); खंड ग पाठ्यपुस्तक 30 (क्षितिज गद्य 11, काव्य 11,
  कृतिका 8); खंड घ रचनात्मक लेखन 20 (अनुच्छेद ~120 शब्द 6, पत्र ~100 शब्द 5, स्ववृत्त या ई-मेल ~80 शब्द 5, विज्ञापन या संदेश ~40 शब्द 4)।
  कक्षा 10 के लिए दो बोर्ड परीक्षाएँ: फ़रवरी में मुख्य परीक्षा (अनिवार्य) और मई में वैकल्पिक दूसरी परीक्षा (सुधार हेतु)। Two board exams:
  February main (compulsory) and optional May second exam for improvement.
