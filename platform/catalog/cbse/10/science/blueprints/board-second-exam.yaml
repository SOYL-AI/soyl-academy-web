notes: >-
  Second (May) board exam: CBSE has published no separate sample paper or design for the second exam; the 14-02-2026 notification makes it
  an improvement / compartment exam on the same subject, so this blueprint repeats the February pattern on the full syllabus (assumption,
  re-check when CBSE publishes a second-exam SQP).

  39 questions in three discipline sections (2026-27 SQP layout: Biology 30, Chemistry 25, Physics 25 marks). Across the paper:

  20 x 1 (16 MCQ + 4 assertion-reason), 6 x 2 (VSA), 7 x 3 (SA), 3 x 4 (case-based, internal choice inside one sub-part), 3 x 5 (LA, all
  with

  A/B choice). Competency weights from the CBSE 2026-27 question paper design: knowledge and understanding 50%, application 30%,

  formulate/analyse/evaluate/create 20%; ~33% internal choice. Theory 80 + internal assessment 20. Numericals (lens, power, resistance)

  appear inside 2/3/5-mark constructed-response items and are mapped to short/long, not numerical (they need working and step marks).

  Visually impaired candidates get substitute questions for diagram-based items (not modelled).
