      - id: cbse-10-science-ch05-t05
        title: "Transportation in human beings"
        learning_outcomes:
          - "Describe the structure of the human heart and double circulation"
          - "Explain the roles of blood, lymph, blood vessels and platelets"
      - id: cbse-10-science-ch05-t06
        title: "Transportation in plants"
        learning_outcomes:
          - "Explain transport of water by xylem (transpiration pull) and of food by phloem (translocation)"
      - id: cbse-10-science-ch05-t07
        title: "Excretion in human beings and plants"
        learning_outcomes:
          - "Describe the structure and function of the nephron and the principle of dialysis"
          - "List ways in which plants get rid of wastes"
