# CBSE Class 10 Science (086), 2026-27.
# Chapter numbers ch01-ch13 follow the rationalised NCERT textbook "Science – Textbook for Class X".
# ch14-ch15 are CBSE "Reading Material" topics that are taught and assessed only formatively
# (internal assessment / portfolio), never in the board theory paper. They carry `board_assessed: false`
# (an extension field; see the curriculum-cbse handoff). Topic-level formative-only items are flagged the same way.
subject_id: cbse-10-science
academic_year: "2026-27"
source_status: verified
sources: [cbse-x-science-2026-27, cbse-secondary-curriculum-2026-27, cbse-two-board-exams-x-2026, cbse-sqp-x-2026-27, ncert-textbooks-secondary]
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (periodic assessment 5, multiple assessment 5,
  portfolio 5, subject enrichment / practical work 5). Paper competency mix: knowledge and understanding 50%,
  application 30%, formulate/analyse/evaluate/create 20%. Question types: VSA incl. objective and
  assertion-reasoning, SA, LA, source/case/passage-based and integrated questions; about 33% internal choice.
  Two board exams for Class 10 from 2026: main exam in February (compulsory) and an optional second exam
  in May for improvement; the better score counts. Periodic Classification of Elements, Evolution, and
  Motor / Electromagnetic Induction / Electric Generator are in the syllabus but assessed only formatively.
  Information in NCERT text boxes is not assessed in the year-end examination. 14 listed practicals are
  done alongside theory (assessed internally).
units:
  - name: "Unit I: Chemical Substances – Nature and Behaviour"
    marks: 25
  - name: "Unit II: World of Living"
    marks: 25
  - name: "Unit III: Natural Phenomena"
    marks: 12
  - name: "Unit IV: Effects of Current"
    marks: 13
  - name: "Unit V: Natural Resources"
    marks: 5
chapters:
  - id: cbse-10-science-ch01
    number: 1
    title: "Chemical Reactions and Equations"
    unit: "Unit I: Chemical Substances – Nature and Behaviour"
    topics:
      - id: cbse-10-science-ch01-t01
        title: "Chemical reactions and their observable signs"
        learning_outcomes:
          - "Identify a chemical change from evidence such as gas evolution, colour change, precipitate or temperature change"
          - "Distinguish a chemical change from a physical change with an everyday example"
      - id: cbse-10-science-ch01-t02
        title: "Writing and balancing chemical equations"
        learning_outcomes:
          - "Convert a word equation into a skeletal chemical equation"
          - "Balance a chemical equation by the hit-and-trial method and add state symbols and reaction conditions"
      - id: cbse-10-science-ch01-t03
        title: "Combination and decomposition reactions"
        learning_outcomes:
          - "Classify a reaction as combination or decomposition from its equation"
          - "Identify thermal, electrolytic and photolytic decomposition and give one example of each"
      - id: cbse-10-science-ch01-t04
        title: "Displacement, double displacement and precipitation reactions"
        learning_outcomes:
          - "Predict whether a displacement reaction occurs using relative reactivity of metals"
          - "Recognise a precipitation reaction and name the insoluble product formed"
      - id: cbse-10-science-ch01-t05
        title: "Exothermic and endothermic reactions"
        learning_outcomes:
          - "Classify reactions as exothermic or endothermic from energy changes, including respiration and decomposition examples"
      - id: cbse-10-science-ch01-t06
        title: "Oxidation and reduction (redox) reactions"
        learning_outcomes:
          - "Define oxidation and reduction in terms of gain or loss of oxygen and hydrogen"
          - "Identify the substance oxidised, the substance reduced, the oxidising agent and the reducing agent in a given reaction"
      - id: cbse-10-science-ch01-t07
        title: "Effects of oxidation in everyday life: corrosion and rancidity"
        learning_outcomes:
          - "Explain corrosion and rancidity as oxidation processes and suggest ways to prevent each"
    removed_topics: []
    literature_texts: []
  - id: cbse-10-science-ch02
    number: 2
    title: "Acids, Bases and Salts"
    unit: "Unit I: Chemical Substances – Nature and Behaviour"
    topics:
      - id: cbse-10-science-ch02-t01
        title: "Acids and bases: definitions and indicators"
        learning_outcomes:
          - "Define acids and bases in terms of furnishing H+ and OH- ions in water"
          - "Identify acids and bases using litmus, natural indicators and olfactory indicators"
      - id: cbse-10-science-ch02-t02
        title: "Chemical properties of acids and bases"
        learning_outcomes:
          - "Write equations for reactions of acids and bases with metals, metal carbonates and hydrogencarbonates"
          - "Explain neutralisation and the reaction of metal oxides and non-metal oxides with acids and bases"
      - id: cbse-10-science-ch02-t03
        title: "Acids and bases in water solution; dilution"
        learning_outcomes:
          - "Explain why acids conduct electricity in aqueous solution and why dilution must be done by adding acid to water"
      - id: cbse-10-science-ch02-t04
        title: "Strength of acids and bases: the pH scale"
        learning_outcomes:
          - "Interpret pH values to compare strength of acids and bases (logarithmic definition not required)"
          - "Use universal indicator results to place solutions on the pH scale"
      - id: cbse-10-science-ch02-t05
        title: "Importance of pH in everyday life"
        learning_outcomes:
          - "Explain the role of pH in digestion, tooth decay, soil, plants and animals, and self-defence by animals and plants"
      - id: cbse-10-science-ch02-t06
        title: "Salts: families, pH of salts and water of crystallisation"
        learning_outcomes:
          - "Name the parent acid and base of a salt and predict whether its solution is acidic, basic or neutral"
          - "Explain water of crystallisation using copper sulphate and gypsum"
      - id: cbse-10-science-ch02-t07
        title: "Chemicals from common salt: sodium hydroxide, bleaching powder, baking soda, washing soda, plaster of Paris"
        learning_outcomes:
          - "Describe the preparation of sodium hydroxide (chlor-alkali process), bleaching powder, baking soda and washing soda with equations"
          - "State the uses of each chemical and explain how plaster of Paris sets with water"
    removed_topics: []
    literature_texts: []
  - id: cbse-10-science-ch03
    number: 3
    title: "Metals and Non-metals"
    unit: "Unit I: Chemical Substances – Nature and Behaviour"
    topics:
      - id: cbse-10-science-ch03-t01
        title: "Physical properties of metals and non-metals"
        learning_outcomes:
          - "Compare metals and non-metals for lustre, hardness, malleability, ductility, conductivity and sonority, noting exceptions"
      - id: cbse-10-science-ch03-t02
        title: "Chemical properties of metals"
        learning_outcomes:
          - "Write equations for reactions of metals with oxygen, water, acids and salt solutions"
          - "Identify amphoteric oxides and explain why some metals react with water only as steam"
      - id: cbse-10-science-ch03-t03
        title: "The reactivity series"
        learning_outcomes:
          - "Arrange metals in order of reactivity from displacement-reaction evidence"
      - id: cbse-10-science-ch03-t04
        title: "Formation and properties of ionic compounds"
        learning_outcomes:
          - "Show the formation of ionic compounds such as NaCl and MgCl2 by electron-dot structures"
          - "Explain the melting point, solubility and conductivity of ionic compounds"
      - id: cbse-10-science-ch03-t05
        title: "Basic metallurgical processes"
        learning_outcomes:
          - "Outline concentration of ore, roasting, calcination and reduction for metals of low, medium and high reactivity"
          - "Describe electrolytic refining of copper with a labelled diagram"
      - id: cbse-10-science-ch03-t06
        title: "Corrosion and its prevention; alloys"
        learning_outcomes:
          - "Explain conditions needed for rusting and describe galvanisation, painting and alloying as prevention methods"
    removed_topics: []
    literature_texts: []
  - id: cbse-10-science-ch04
    number: 4
    title: "Carbon and its Compounds"
    unit: "Unit I: Chemical Substances – Nature and Behaviour"
    topics:
      - id: cbse-10-science-ch04-t01
        title: "Covalent bonding in carbon compounds"
        learning_outcomes:
          - "Draw electron-dot structures of simple molecules such as H2, O2, N2, CH4 and CO2"
          - "Explain the low melting points and poor conductivity of covalent compounds"
      - id: cbse-10-science-ch04-t02
        title: "Versatile nature of carbon: catenation and tetravalency"
        learning_outcomes:
          - "Explain why carbon forms a very large number of compounds"
      - id: cbse-10-science-ch04-t03
        title: "Saturated and unsaturated hydrocarbons; chains, branches and rings"
        learning_outcomes:
          - "Distinguish alkanes, alkenes and alkynes and draw structures of straight-chain, branched and cyclic compounds"
      - id: cbse-10-science-ch04-t04
        title: "Functional groups, homologous series and nomenclature"
        learning_outcomes:
          - "Identify halogen, alcohol, aldehyde, ketone and carboxylic acid functional groups"
          - "Name carbon compounds with up to six carbon atoms and state the features of a homologous series"
      - id: cbse-10-science-ch04-t05
        title: "Chemical properties: combustion, oxidation, addition and substitution"
        learning_outcomes:
          - "Write equations for combustion, oxidation of alcohols, hydrogenation and substitution by chlorine"
      - id: cbse-10-science-ch04-t06
        title: "Ethanol and ethanoic acid"
        learning_outcomes:
          - "State the properties and uses of ethanol and ethanoic acid, including esterification"
      - id: cbse-10-science-ch04-t07
        title: "Soaps and detergents"
        learning_outcomes:
          - "Explain micelle formation and the cleansing action of soap"
          - "Compare the action of soaps and detergents in hard water"
    removed_topics: []
    literature_texts: []
  - id: cbse-10-science-ch05
