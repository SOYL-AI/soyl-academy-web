exam_notes: >-
  सैद्धांतिक 80 अंक (3 घंटे) + आंतरिक मूल्यांकन 20 (सामयिक आकलन 5, बहुविध आकलन 5, पोर्टफ़ोलियो 5, श्रवण एवं वाचन 5)। खंड क दो अपठित गद्यांश
  (~200 शब्द) 7+7; खंड ख व्याकरण 16 (पदबंध, वाक्य रूपांतरण, समास, मुहावरे — प्रत्येक में 5 में से 4); खंड ग स्पर्श गद्य 11, काव्य 11, संचयन
  6; खंड घ रचनात्मक लेखन 22 (अनुच्छेद 5, औपचारिक पत्र 5, सूचना 4, विज्ञापन 3, ई-मेल या लघुकथा 5)। कक्षा 10 के लिए दो बोर्ड परीक्षाएँ: फ़रवरी
  में मुख्य परीक्षा (अनिवार्य) और मई में वैकल्पिक दूसरी परीक्षा (सुधार हेतु)। Two board exams: February main (compulsory) and optional May
  second exam for improvement.
