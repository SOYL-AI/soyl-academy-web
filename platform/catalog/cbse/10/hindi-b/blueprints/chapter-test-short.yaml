notes: >-
  SOYL default modelled on the CBSE board pattern (CONTEXT section 9: "use a generic blueprint per board and subject, stored as editable
  config"); not an official CBSE paper. Marks follow the 2026-27 Hindi B board paper's textbook section (खंड ग): a 5-mark पठित गद्यांश/काव्यांश with
  5 MCQs (source-based, Q7/Q9), 2-mark answers in 25-30 words, three of four (Q8/Q10), and 3-mark संचयन answers in 50-60 words, two of
  three (Q11), plus 1-mark objective items. The paper has no 4-mark or longer textbook answer. Same section shape as the Hindi A chapter
  tests (exemplar cbse-10-hindi-a-ch10). Built for literature chapters (स्पर्श, संचयन); grammar and writing chapters have their own design.
