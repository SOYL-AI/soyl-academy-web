notes: >-
  Mathematics Basic (241) paper. 38 questions, 5 sections, no overall choice. Theory 80 + internal assessment 20 (pen-paper test and
  multiple assessment 10, portfolio 5, lab practical 5).

  Numerical problems are constructed-response items with step marks, mapped to short/long (not the auto-graded numerical type).
  Constructions and

  graph work are not set in the 2026-27 SQP. Visually impaired candidates get substitute items (not modelled). Standard (041) and Basic
  (241) share

  one syllabus (subject cbse-10-mathematics); the blueprint contract has no variant field, so the two papers are separate files (board.yaml
  = Standard,

  board-basic.yaml = Basic). CBSE: Basic remains available to the 2026-27 Class X cohort only. Same section layout as Standard but easier
  items. Competency weights from the CBSE design table: remembering/understanding 60 marks (75%), applying 12 (15%),
  analysing/evaluating/creating 8 (10%).
