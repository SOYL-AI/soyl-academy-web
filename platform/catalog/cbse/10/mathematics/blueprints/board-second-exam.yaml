notes: >-
  Second (May) board exam: CBSE has published no separate sample paper or design for the second exam; the 14-02-2026 notification makes it
  an improvement / compartment exam on the same subject, so this blueprint repeats the February pattern on the full syllabus (assumption,
  re-check when CBSE publishes a second-exam SQP).

  Mathematics Standard (041) paper. 38 questions, 5 sections, no overall choice. Theory 80 + internal assessment 20 (pen-paper test and
  multiple assessment 10, portfolio 5, lab practical 5).

  Numerical problems are constructed-response items with step marks, mapped to short/long (not the auto-graded numerical type).
  Constructions and

  graph work are not set in the 2026-27 SQP. Visually impaired candidates get substitute items (not modelled). Standard (041) and Basic
  (241) share

  one syllabus (subject cbse-10-mathematics); the two papers are separate files with a
  'variant' (board*.yaml = Standard 041, board*-basic.yaml = Basic 241; Subject.variants in subjects.yaml). CBSE: Basic remains available to the 2026-27 Class X cohort only. Competency weights from the CBSE design
  table: remembering/understanding 43 marks (54%), applying 19 (24%), analysing/evaluating/creating 18 (22%).
