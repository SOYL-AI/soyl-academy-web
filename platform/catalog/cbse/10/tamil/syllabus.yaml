exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20. MCQ 25 marks, descriptive 55. Section A Reading 10: unseen passage 1 (language,
  literature, history or science) 5 MCQs; unseen passage 2, 5 short answers. Section B Grammar 12 (all MCQ): give example 3, fill up 3,
  grammar note (ilakkana kurippu) 3, do as directed 3. Section C Main course book 31: Thirukkural fill-ups 3x1, poetry comprehension 5x1
  MCQ, poetry short answers 4x2, prose long answers 3x5. Section D Non-detail 10: one long answer (1x10, choice of three). Section E
  Creative writing 17: picture description 3, official or informal letter 8 (choice of two), essay 6 (choice of three). Two board exams for
  Class 10: February main (compulsory) and an optional May second exam for improvement in up to three of Science, Mathematics, Social
  Science and languages.
