# CBSE Class 10 Tamil (006), 2026-27. Sections, marks, grammar items and every prescribed lesson as listed (in Roman
# transliteration, without authors) in the CBSE 2026-27 Tamil IX-X syllabus, Iyal 1-7. Textbook: Tamil Textbook Class X,
# revised edition 2025 (SCERT Tamil Nadu; Tamil Nadu Textbook and Educational Services Corporation). Tamil-script titles
# are SOYL's rendering of CBSE's transliteration. Titles only; no text is reproduced (CONTEXT §8).
