chapters:
  - id: cbse-10-apparel-ch01
    number: 1
    title: "Employability Skills: Communication Skills – II"
    unit: "Part A: Employability Skills"
    topics:
      - id: cbse-10-apparel-ch01-t01
        title: "Methods of communication: verbal, non-verbal and visual"
        learning_outcomes:
          - Compare the pros and cons of written, verbal and non-verbal communication
          - List do's and don'ts to avoid common body-language mistakes
      - id: cbse-10-apparel-ch01-t02
        title: "Communication cycle and feedback: descriptive and specific feedback"
        learning_outcomes:
          - Explain the communication cycle and why feedback matters
          - Frame descriptive and specific (rather than non-specific) feedback sentences
      - id: cbse-10-apparel-ch01-t03
        title: Barriers to effective communication and measures to overcome them
        learning_outcomes:
          - Classify physical, linguistic, interpersonal and organisational barriers
          - Suggest measures to overcome a given barrier
      - id: cbse-10-apparel-ch01-t04
        title: "Principles of communication: the 7 Cs"
        learning_outcomes:
          - Apply the 7 Cs (clear, concise, concrete, correct, coherent, complete, courteous) to rewrite a message
      - id: cbse-10-apparel-ch01-t05
        title: "Basic writing skills: sentences, phrases, parts of speech, articles and paragraphs"
        learning_outcomes:
          - Identify kinds and parts of sentences and parts of speech
          - Construct a well-organised paragraph on a work-related topic
