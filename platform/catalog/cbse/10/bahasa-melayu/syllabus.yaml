# CBSE Class 10 Bahasa Melayu (099), 2026-27. Sections, marks, grammar items and literature texts as printed in the CBSE
# 2026-27 Bahasa Melayu Class IX-X syllabus (Class X page). Grammar book: Buku Teks Bahasa Melayu Tingkatan 3; literature:
# Bintang Hati - Antologi Teks Komponen Sastera Bahasa Melayu Tingkatan 3 (both Kementerian Pendidikan Malaysia).
# Text titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-10-bahasa-melayu
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-bahasa-melayu-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (as for all Class X languages). Section A Reading 15: three unseen
  passages totalling 400 words (max 100 words each), 15 one-mark MCQs. Section B Writing 20: summary of one unseen
  passage in at most 80 words 10; one essay of at most 250 words or a formal letter 10. Section C Grammar 20: twenty
  one-mark items on sentence arrangement, the grammar items and idioms/proverbs. Section D Literature 25: traditional
  poem and modern poems (MCQ 5x1, short answers 3x2 and 1x3), traditional prose (long answer 6), short stories (MCQ
  5x1). Two board exams for Class 10: February main (compulsory) and an optional May second exam for improvement in up
  to three of Science, Mathematics, Social Science and languages.
units:
  - name: 'Bahagian A: Pemahaman'
    marks: 15
  - name: 'Bahagian B: Penulisan'
    marks: 20
  - name: 'Bahagian C: Tatabahasa'
    marks: 20
  - name: 'Bahagian D: Kesusasteraan'
    marks: 25
