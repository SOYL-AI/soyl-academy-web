# CBSE Class 10 Gurung (132), 2026-27. Sections, marks, grammar items and lessons as printed in the CBSE 2026-27 Gurung
# Class IX-X syllabus (Class X pages). Prescribed books (ASG(T)BA): Tamu Hyarkuhyi, compiled by Rup Raj Gurung; Tamu Kuhyi
# Ngina Khey and Tamu Hringang, compiled by Meg Raj Gurung and Padma Gurung.
# CBSE prints every Gurung term and lesson title only in Roman transliteration; titles here keep CBSE's romanisation
# (the script CBSE actually uses) because SOYL could not verify native-script (Devanagari or Khema) spellings. Native-script titles
# are to be added in language review (see the M1 languages handoff). Lesson titles only; no text is reproduced (CONTEXT §8).
