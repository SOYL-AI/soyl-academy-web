  - cbse-two-board-exams-x-2026
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (periodic test, project work, home assignment, subject enrichment,
  copy submission). Course structure: reading 10, writing 15, applied grammar 16, literature (prose, introduction of
  literary figures, poetry) 39. Part A: two unseen passages, five MCQs each (10); grammar 10 MCQs. Part B: applied
  grammar 3x2; prose 3x2, 3x3, 2x4 and 1x5 (28); poetry 4x2 and 1x3 (11); creative writing - essay of 110-115 words 5,
  letter 5, translation from English into Gurung 5. Two board exams for Class 10: February main (compulsory) and an
  optional May second exam for improvement in up to three of Science, Mathematics, Social Science and languages.
