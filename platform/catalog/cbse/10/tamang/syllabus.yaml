# CBSE Class 10 Tamang (133), 2026-27. Sections, marks, grammar items and lessons as printed in the CBSE 2026-27 Tamang
# Class X syllabus. CBSE does not name the textbook (Government of Sikkim Tamang textbook).
# CBSE prints every Tamang term and lesson title only in Roman transliteration; titles here keep CBSE's romanisation
# (the script CBSE actually uses) because SOYL could not verify native-script (Devanagari or Tibetan) spellings. Native-script titles
# are to be added in language review (see the M1 languages handoff). Lesson titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-10-tamang
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-tamang-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20. Section A Reading 10: unseen passage (MCQ) 5 and seen passage from
  the prescribed book (MCQ) 5. Section B Literature/textbook 40: MCQ 15, short answers 17, long answers 8 on ten
  lessons. Section C Grammar 15 (MCQ). Section D Writing 15: essay of at least 300 words on contemporary issues 5,
  letter 5, translation 5 (choice of topics). Two board exams for Class 10: February main (compulsory) and an optional
  May second exam for improvement in up to three of Science, Mathematics, Social Science and languages.
units:
  - name: Section A - Reading
    marks: 10
  - name: Section B - Literature / textbook
    marks: 40
  - name: Section C - Grammar
    marks: 15
  - name: Section D - Writing
    marks: 15
