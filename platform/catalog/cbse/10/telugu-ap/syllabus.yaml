# CBSE Class 10 Telugu (Andhra Pradesh) (007), 2026-27. Sections, marks, grammar items, writing tasks and every
# prescribed lesson as listed (in Roman transliteration, without authors) in the CBSE 2026-27 Telugu (A.P.) IX-X syllabus.
# Textbook: Telugu Parimalam, Telugu Vachakam Class X (Government of Andhra Pradesh, new edition 2024); non-detail text
# Ramayanam (six kandas) in the same book. Telugu-script titles are SOYL's rendering of CBSE's transliteration. Titles
# only; no text is reproduced (CONTEXT §8).
subject_id: cbse-10-telugu-ap
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-x-telugu-ap-2026-27
  - cbse-secondary-curriculum-2026-27
  - cbse-two-board-exams-x-2026
exam_notes: >-
  Theory 80 marks (3 hours), 24 questions + internal assessment 20 (periodic test 5, multiple assessments 5, notebooks 5, subject enrichment
  5). Section A Reading 10: unseen prose passage (aparichita gadyamsam), 5 x 2-mark MCQ / very short items. Section B Writing 13: lekha
  rachana (letter / report writing) 5, essay (vyasa rachana) 8. Section C Grammar 20 (MCQ, internally divided): Telugu sandhulu 4x1,
  chandassu 4x1, samasalu 2x1, alankaralu 2x1, jatiyalu 4x1, sametalu 2x1, paryaya padalu 2x1. Section D Literature 37: one 2-mark short
  answer, 4 short answers x 3, 4 long answers x 4 and long answers of 7 and 8 marks on prose, poetry and the Ramayanam non-detail text. Two
  board exams for Class 10: February main (compulsory) and an optional May second exam for improvement in up to three of Science,
  Mathematics, Social Science and languages.
