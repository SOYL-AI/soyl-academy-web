exam_notes: >-
  Total 100 = theory 60 + practical 40 (project 10, viva 5, practical file 15, skill demonstration 10). Part A Employability Skills 10
  marks, Part B subject-specific skills 50 marks (the 2026-27 syllabus gives no unit-wise marks for Part B). Theory paper 60 marks, 3 hours:
  Section A objective 30 (Employability Skills 4 of 6 + subject 26 from 5 questions with internal choice); Section B subjective 30
  (Employability Skills 3 of 5 x 2; subject 3 of 5 x 2, 2 of 3 x 3, 3 of 5 x 4). Single board exam (February-March 2027). UNVERIFIED topics:
  the 2026-27 CBSE document gives Class XII unit titles only, with Part B 50 marks in total and no unit-wise marks; topics follow the
  Logistics Sector Skill Council job role (Land Transportation Associate) as known. subjects.yaml marks this subject theory_only, but the
  2026-27 document gives theory 60 + practical 40.
