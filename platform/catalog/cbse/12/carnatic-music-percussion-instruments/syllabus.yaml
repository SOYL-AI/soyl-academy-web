exam_notes: >-
  Theory 30 marks (2 hours) + practical 50 + internal assessment/project 20. Theory paper (CBSE 2026-27 SQP): Section A 8 MCQs x 1; Section
  B 5 short answers x 2, each with an internal choice; Section C 2 long answers x 6, each with an internal choice (raga lakshana, notation,
  composer or grantha essays). Practical (mohra and korvai in Khanda jati Ata and Triputa, accompaniment, gumki, tani avartanam in Misra and
  Khanda Chapu) is examined by an external examiner and is marked board_assessed: false here. Single board exam (February-March 2027).
