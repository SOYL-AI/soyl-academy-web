notes: >-
  Theory paper only (70 marks, 3 hours); project 30 is assessed separately. 34 questions: A Q1-18 MCQs x 1 (most are short business
  situations; Q5 and Q11 are assertion-reason); B Q19-24 short answer I x 2 (choice in three); C Q25-29 short answer II x 3 (choice in two);
  D Q30-34 long answer x 5 (Q30-32 are built on a business case passage; choice in Q33 and Q34). Competency weights from the CBSE 2026-27
  design: remembering/understanding 20 marks (28.5%), applying 30 (43%), analysing/evaluating/creating 20 (28.5%). FORMAT MAPPING:
  situation-based MCQs are plain mcq with a short stem; the passage-based 5-mark questions are modelled as case-based.
