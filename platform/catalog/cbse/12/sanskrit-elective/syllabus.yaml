# CBSE Class 12 Sanskrit Elective (022), 2026-27. Sections, marks, grammar items, metres and figures of speech, the
# prescribed lessons of Shashwati Part 2 (NCERT) and the chapters of Sanskrit Sahitya Parichay as printed in the CBSE
# 2026-27 Sanskrit (Aichchhikam) XI-XII syllabus (Class XII pages). Lesson 6 of Shashwati Part 2 is not prescribed. Source
# attributions of lessons are given only where well established and are informational. No text is reproduced (CONTEXT §8).
subject_id: cbse-12-sanskrit-elective
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-sanskrit-elective-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  वार्षिकं मूल्याङ्कनम् 80 अङ्काः (3 hours) + आन्तरिकमूल्याङ्कनम् 20 (periodic test 5, multiple assessment 5, portfolio 5,
  listening-speaking and writing enrichment activities 5). Section A unseen passage 10 (100-120 words). Section B creative writing
  10 (letter from cues 5; paragraph from cues or translation into Sanskrit 5). Section C applied grammar 15 (sandhi 3, pratyaya 3
  MCQ, avyaya 3, karaka-upapada vibhakti from read passages 3, analysis of simple compounds from read passages 3 MCQ). Section
  D(i) textbook comprehension 25 (prose, verse and drama extracts 5 each; question formation on underlined words 4; anvaya of a
  verse 3; bhavartha or character sketch 3). Section D(ii) history of Sanskrit literature 10 (mahakavya and historical kavya 3;
  gadyakavya and champu 3; drama 4, MCQ). Section E metres and figures of speech 10 (metres with examples 3, identifying the metre
  of a verse 2; figures of speech with definitions and examples 3, identifying them in verses 2). Books: Shashwati Part 2 (NCERT),
  Sanskrit Sahitya Parichay (NCERT); reference: Vyakaranasaurabham, Higher Sanskrit Grammar (M. R. Kale), Rachananuvadakaumudi
  (Kapildev Dwivedi).
