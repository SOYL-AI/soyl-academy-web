chapters:
  - id: cbse-12-information-technology-ch01
    number: 1
    title: "Employability Skills: Communication Skills – IV"
    unit: "Part A Unit 1: Communication Skills – IV"
    topics:
      - id: cbse-12-information-technology-ch01-t01
        title: Active listening at the workplace
        learning_outcomes:
          - Explain why active listening matters at work and list the barriers to it
          - Describe the steps of active listening and apply them in a role play
      - id: cbse-12-information-technology-ch01-t02
        title: Sentences and phrases; kinds and parts of a sentence
        learning_outcomes:
          - Distinguish a phrase from a sentence and classify sentences as declarative, interrogative, imperative or exclamatory
          - Identify the subject, predicate and object in a sentence
      - id: cbse-12-information-technology-ch01-t03
        title: Parts of speech and articles
        learning_outcomes:
          - Identify nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections in workplace sentences
          - Use the articles a, an and the correctly
      - id: cbse-12-information-technology-ch01-t04
        title: Constructing a paragraph
        learning_outcomes:
          - Write a well-organised paragraph with a topic sentence, supporting sentences and a conclusion on a subject-related theme
    removed_topics: []
    literature_texts: []
  - id: cbse-12-information-technology-ch02
    number: 2
    title: "Employability Skills: Self-Management Skills – IV"
    unit: "Part A Unit 2: Self-Management Skills – IV"
    topics:
      - id: cbse-12-information-technology-ch02-t01
        title: Motivation and self-motivation
        learning_outcomes:
          - Explain internal and external motivation and list personal needs and desires that drive motivation
      - id: cbse-12-information-technology-ch02-t02
        title: Sources of motivation and a positive outlook
        learning_outcomes:
          - Identify sources of inspiration (people, books, music, activities) and techniques to stay positive and focused on goals
      - id: cbse-12-information-technology-ch02-t03
        title: "Personality: meaning, influence and traits"
        learning_outcomes:
          - Define personality and explain how it influences others at work
          - Describe the five basic personality traits (openness, conscientiousness, extraversion, agreeableness, neuroticism)
      - id: cbse-12-information-technology-ch02-t04
        title: Personality disorders and how to overcome them
        learning_outcomes:
          - >-
            Describe common personality disorders (paranoid, antisocial, schizoid, borderline, narcissistic, avoidant, dependent, obsessive)
            and the clusters they belong to
          - Suggest steps to seek help and overcome personality problems
    removed_topics: []
    literature_texts: []
  - id: cbse-12-information-technology-ch03
    number: 3
    title: "Employability Skills: ICT Skills – IV"
    unit: "Part A Unit 3: ICT Skills – IV"
    topics:
      - id: cbse-12-information-technology-ch03-t01
        title: "Spreadsheet basics: workbook, worksheet and data entry"
        learning_outcomes:
          - Name common spreadsheet applications and create, open and save a workbook
          - Enter text and numbers, resize fonts and apply styles
      - id: cbse-12-information-technology-ch03-t02
        title: Editing and organising spreadsheet data
        learning_outcomes:
          - Copy and move cell data, sort data and apply filters to a table
      - id: cbse-12-information-technology-ch03-t03
        title: Formulas, functions, protection and printing
        learning_outcomes:
          - Use elementary formulas and functions such as SUM, AVERAGE, MIN and MAX
          - Protect a spreadsheet with a password, print it and save it in different formats
      - id: cbse-12-information-technology-ch03-t04
        title: Creating a presentation
        learning_outcomes:
          - Name presentation software packages and list features of a good presentation
          - Create a presentation and add or delete slides
      - id: cbse-12-information-technology-ch03-t05
        title: Editing and formatting presentations
        learning_outcomes:
          - Enter, edit and format text, insert clipart and images, choose slide layouts, and save and print a presentation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-information-technology-ch04
    number: 4
    title: "Employability Skills: Entrepreneurial Skills – IV"
    unit: "Part A Unit 4: Entrepreneurial Skills – IV"
    topics:
      - id: cbse-12-information-technology-ch04-t01
        title: Barriers to becoming an entrepreneur
        learning_outcomes:
          - Classify barriers to entrepreneurship (environmental, personal, financial, social) with examples and ways to overcome them
      - id: cbse-12-information-technology-ch04-t02
        title: Behavioural and entrepreneurial competencies
        learning_outcomes:
          - >-
            Describe competencies such as adaptability, decisiveness, initiative, perseverance, interpersonal and organisational skills,
            stress management and valuing service and diversity
      - id: cbse-12-information-technology-ch04-t03
        title: Entrepreneurial competencies in particular
        learning_outcomes:
          - >-
            Explain self-confidence, seeing and acting on opportunities, concern for quality, goal setting, risk taking, problem solving,
            systematic planning, information seeking, persistence, negotiating and team building
      - id: cbse-12-information-technology-ch04-t04
        title: Self-assessment of entrepreneurial behaviour
        learning_outcomes:
          - Rate oneself on behavioural competencies and prepare a personal competency profile
          - Relate competencies to stories of successful Indian entrepreneurs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-information-technology-ch05
    number: 5
    title: "Employability Skills: Green Skills – IV"
    unit: "Part A Unit 5: Green Skills – IV"
    topics:
      - id: cbse-12-information-technology-ch05-t01
        title: Green jobs in homes, gardening, transport and energy conservation
        learning_outcomes:
          - Explain the role of green jobs in toxin-free homes, organic gardening, public transport and energy conservation
      - id: cbse-12-information-technology-ch05-t02
        title: Green jobs in water, renewable energy and waste
        learning_outcomes:
          - Describe green jobs in water conservation, solar and wind power, and waste reduction, reuse and recycling
      - id: cbse-12-information-technology-ch05-t03
        title: Green jobs in tourism, construction and appropriate technology
        learning_outcomes:
          - Give examples of green jobs in green tourism, building and construction and appropriate technology
      - id: cbse-12-information-technology-ch05-t04
        title: Role of green jobs in protecting the environment
        learning_outcomes:
          - >-
            Explain how green jobs improve energy and raw-material use, limit greenhouse-gas emissions, minimise waste and pollution,
            restore ecosystems and support adaptation to climate change
    removed_topics: []
    literature_texts: []
  - id: cbse-12-information-technology-ch06
    number: 6
    title: Database Concepts – RDBMS Tool
    unit: "Part B Unit 1: Database Concepts – RDBMS Tool"
    topics:
      - id: cbse-12-information-technology-ch06-t01
        title: Basics of RDBMS
        learning_outcomes:
          - Explain relations, tuples, attributes, domain, primary, candidate, alternate and foreign keys
          - State advantages of a DBMS such as program-data independence
      - id: cbse-12-information-technology-ch06-t02
        title: Creating and opening a database; creating and populating tables
        learning_outcomes:
          - Write SQL CREATE DATABASE, USE, CREATE TABLE and INSERT statements with data types and constraints
      - id: cbse-12-information-technology-ch06-t03
        title: Modifying table content and structure
        learning_outcomes:
          - Use UPDATE, DELETE and ALTER TABLE statements to change data and structure
      - id: cbse-12-information-technology-ch06-t04
        title: Querying, ordering and grouping
        learning_outcomes:
          - Write SELECT queries with WHERE, ORDER BY, GROUP BY, HAVING and aggregate functions
      - id: cbse-12-information-technology-ch06-t05
        title: Operating with multiple tables
        learning_outcomes:
          - Write join queries on two related tables using common keys
    removed_topics: []
    literature_texts: []
  - id: cbse-12-information-technology-ch07
    number: 7
    title: Operating Web-Based Applications
    unit: "Part B Unit 2: Operating Web-Based Applications"
    topics:
      - id: cbse-12-information-technology-ch07-t01
        title: Online reservation systems and e-governance
        learning_outcomes:
          - Describe how online reservation and e-governance portals work and their benefits and risks
      - id: cbse-12-information-technology-ch07-t02
        title: Online shopping, bill payments, tutorials and tests
        learning_outcomes:
          - Explain the steps and safety precautions in online shopping, bill payment and online learning services
      - id: cbse-12-information-technology-ch07-t03
        title: Project management for web-based application development
        learning_outcomes:
          - Describe the phases and essentials of a web application project
      - id: cbse-12-information-technology-ch07-t04
        title: "Case studies: online game, quiz and bill calculator"
        learning_outcomes:
          - Outline the design of simple web applications such as an online quiz or bill calculator
    removed_topics: []
    literature_texts: []
  - id: cbse-12-information-technology-ch08
    number: 8
    title: Fundamentals of Java Programming
    unit: "Part B Unit 3: Fundamentals of Java Programming"
    topics:
      - id: cbse-12-information-technology-ch08-t01
        title: Introduction to Java and object-oriented programming
        learning_outcomes:
          - Explain the Java platform, NetBeans IDE and OOP concepts of class, object, encapsulation and inheritance
      - id: cbse-12-information-technology-ch08-t02
        title: Java language elements and operators
        learning_outcomes:
          - Use variables, primitive data types and arithmetic, relational, logical and assignment operators
      - id: cbse-12-information-technology-ch08-t03
        title: Control flow
        learning_outcomes:
          - Write programs with if, if-else, switch, for, while and do-while statements
          - Predict the output of code segments with loops and conditions
      - id: cbse-12-information-technology-ch08-t04
        title: Arrays and string manipulation
        learning_outcomes:
          - Declare and process one-dimensional arrays and use String methods
      - id: cbse-12-information-technology-ch08-t05
        title: Class design and wrapper classes
        learning_outcomes:
          - Define classes with fields, constructors and methods, and use wrapper classes for type conversion
      - id: cbse-12-information-technology-ch08-t06
        title: Exception handling, assertions and threads
        learning_outcomes:
          - Handle exceptions with try-catch-finally, use assertions, and explain threads and multithreading
    removed_topics: []
    literature_texts: []
  - id: cbse-12-information-technology-ch09
    number: 9
    title: Work Integrated Learning IT – DMA
    unit: "Part B Unit 4: Work Integrated Learning IT – DMA"
    topics:
      - id: cbse-12-information-technology-ch09-t01
        title: Identification of work areas
        learning_outcomes:
          - Identify job roles and work areas for a domestic data entry/data management assistant
      - id: cbse-12-information-technology-ch09-t02
        title: Work experience and workplace practices
        learning_outcomes:
          - Describe tasks, tools and good practices observed during work-integrated learning
      - id: cbse-12-information-technology-ch09-t03
        title: Professional ethics in IT work
        learning_outcomes:
          - Explain data confidentiality, accuracy and professional conduct expected in IT jobs
    removed_topics: []
    literature_texts: []
