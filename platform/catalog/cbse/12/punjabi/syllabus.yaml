# CBSE Class 12 Punjabi (104), 2026-27. Sections, marks, writing and grammar items and every prescribed poem, story
# and culture essay with its author, as printed in Punjabi in the CBSE 2026-27 Punjabi XI-XII syllabus, Class XII.
# Textbook: Lazmi Punjabi 12 (Punjab School Education Board, Sahibzada Ajit Singh Nagar; also on www.pseb.ac.in).
# Titles and authors only; no text is reproduced (CONTEXT §8).
