exam_notes: >-
  Board theory 80 marks (3 hours) + internal assessment 20 (project 10; listening- and speaking-based activities 10, with viva). Language
  36: advanced reading - an information-rich unseen passage with 8 MCQs (8); effective writing 15 - official/business letter 8 and a
  paragraph of 125-150 words on a given topic 7 (both with choice); applied grammar 13 - one-word substitution (vak-vatandra) 3x1 and
  idioms/proverbs (akhaan/akhautaan) used to explain a situation 5x2, both from Lazmi Punjabi 12. Literature 44: poetry 12 - explanation
  with context of one of two extracts 3+5 and 4 MCQs; stories 19 - theme, character sketch or critical summary (125-150 words) 6, 5 MCQs, 4
  short answers (25-30 words) x 2; Punjabi culture 13 - 5 MCQs and 2 short answers (70-80 words) x 4.
