# CBSE Class 12 Bhoti (188), 2026-27. Sections, marks, topics and textbook lesson numbers as printed in the CBSE 2026-27
# Bhoti Classes XI-XII syllabus (Class XII course structure, in Bhoti and English). Prescribed book: Bhoti Textbook
# Class XII (Directorate of School Education, UT of Ladakh). CBSE gives most literature lessons by NUMBER only, so those
# chapters carry placeholder topics until the book contents page is supplied. No text is reproduced (CONTEXT §8).
subject_id: cbse-12-bhoti
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-bhoti-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (pen-and-paper tests 5, multiple assessment 5, portfolio 5,
  listening and speaking 5). Section A Reading 10: an unseen passage from stories, notes or biographies and a seen
  passage from the textbook poetry section. Section B Writing 15: minutes of a meeting and notice (lesson 16); essay of
  250-300 words on an unseen topic. Section C Grammar 25: rtags 'jug gi tshig 'grel (lessons 1 and 7); synonyms of
  numbers (lesson 3). Section D Literature 30: prose lessons 2, 6, 8, 9, 11, 12, 13, 14 and 15; poetry - similes
  (lessons 5 and 10) and the poem of lesson 4. Board examination in Class XII.
