      - id: cbse-12-data-science-ch06-t02
        title: Ethical guidelines and data privacy
        learning_outcomes:
          - Explain ethical use of data, consent, bias and privacy
      - id: cbse-12-data-science-ch06-t03
        title: Data protection laws
