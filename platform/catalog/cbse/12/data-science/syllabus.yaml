# CBSE Class 12 Data Science (844), 2026-27 skill subject. Built from the CBSE 2026-27 skill curriculum; theory component only (practical work is listed in exam_notes).
subject_id: cbse-12-data-science
academic_year: "2026-27"
source_status: unverified
sources:
  - cbse-xii-data-science-844-2026-27
  - cbse-skill-curriculum-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - cbse-sqp-xii-2026-27
exam_notes: >-
  Total 100 = theory 50 + practical 50 (practical file/portfolio with two final projects 20, practical examination 20, viva 10). Part A
  Employability Skills 10 marks, Part B subject-specific skills 40 marks. Theory paper 50 marks, 2 hours: Section A objective 24
  (Employability Skills 4 of 6 + subject 4 questions, any 5 of 6 each); Section B subjective 26 (Employability Skills 3 of 5 x 2; subject 4
  of 6 x 2, 3 of 5 x 4). Single board exam (February-March 2027). UNVERIFIED topics: the 2026-27 CBSE document lists only unit titles and
  marks; topics follow the CBSE Data Science Class XII textbook as known and the concepts tested in the 2025-26 SQP (data governance and
  privacy, mode/mean and outliers, decision trees, linear regression, MAE, K-means clustering).
