exam_notes: >-
  Total 100 = theory 60 + practical 40 (project 10, viva 10, practical file 10, skill demonstration 10). Part A Employability Skills 10
  marks, Part B subject-specific skills 50 marks. Theory paper 60 marks, 3 hours: Section A objective 30 (Employability Skills 4 of 6 +
  subject 26 from 5 questions with internal choice); Section B subjective 30 (Employability Skills 3 of 5 x 2; subject 3 of 5 x 2, 2 of 3 x
  3, 3 of 5 x 4). Single board exam (February-March 2027).
