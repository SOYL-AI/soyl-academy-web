    number: 10
    title: Emerging Trends in Marketing
    unit: "Part B Unit 5: Emerging Trends in Marketing"
    topics:
      - id: cbse-12-marketing-ch10-t01
        title: Services marketing
        learning_outcomes:
          - Explain characteristics of services, types of services and service quality
      - id: cbse-12-marketing-ch10-t02
        title: Online marketing
        learning_outcomes:
          - Explain the meaning, advantages and disadvantages of online marketing
      - id: cbse-12-marketing-ch10-t03
        title: Social media marketing
        learning_outcomes:
          - Identify social media platforms and evaluate social media marketing for a product
