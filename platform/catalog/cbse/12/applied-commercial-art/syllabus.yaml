# CBSE Class 12 Applied Art (Commercial Art) (052), 2026-27. Theory (History of Indian Art) is identical to Painting (049); practical chapters are listed with board_assessed: false.
subject_id: cbse-12-applied-commercial-art
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-fine-arts-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - cbse-sqp-xii-2026-27
exam_notes: >-
  Theory 30 marks (2 hours), History of Indian Art: Unit 1 Indian miniature painting 15, Unit 2 Bengal School, National Flag and modern
  trends 15 (the theory syllabus is the same as Painting 049, as CBSE states). Theory paper (2026-27 SQP): Section A 8 MCQs x 1 (incl. 2
  assertion-reason); Section B 5 short answers x 2 (about 100 words), each with an internal choice; Section C 3 long answers x 6 (about 200
  words), attempt any two. Practical 70 (6 hours): illustration 25, poster 25, portfolio 20. Single board exam (February-March 2027).
