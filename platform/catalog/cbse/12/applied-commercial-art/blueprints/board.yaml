notes: >-
  Theory paper only (30 marks, 2 hours; History of Indian Art, same syllabus for Painting, Graphics, Sculpture and Applied Art); practical
  70 is assessed separately. Section A 8 x 1 (6 MCQ + 2 assertion-reason); Section B 5 x 2 (about 100 words), each with an A/B internal
  choice; Section C 3 x 6 (about 200 words), attempt any two. FORMAT MAPPING: many items show a reproduction of a prescribed artwork and ask
  the candidate to identify, describe or appreciate it; these need an image asset (licensed reproduction or original description) and are
  modelled as mcq/short/long.
