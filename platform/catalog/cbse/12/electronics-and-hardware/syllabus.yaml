# CBSE Class 12 Electronics and Hardware (847), 2026-27 skill subject. Built from the CBSE 2026-27 skill curriculum; theory component only (practical work is listed in exam_notes).
subject_id: cbse-12-electronics-and-hardware
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-elha-847-2026-27
  - cbse-skill-curriculum-2026-27
  - cbse-senior-secondary-curriculum-2026-27
