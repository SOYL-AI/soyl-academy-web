chapters:
  - id: cbse-12-electronics-and-hardware-ch01
    number: 1
    title: "Employability Skills: Communication Skills – IV"
    unit: "Part A Unit 1: Communication Skills – IV"
    topics:
      - id: cbse-12-electronics-and-hardware-ch01-t01
        title: Active listening at the workplace
        learning_outcomes:
          - Explain why active listening matters at work and list the barriers to it
          - Describe the steps of active listening and apply them in a role play
      - id: cbse-12-electronics-and-hardware-ch01-t02
        title: Sentences and phrases; kinds and parts of a sentence
        learning_outcomes:
          - Distinguish a phrase from a sentence and classify sentences as declarative, interrogative, imperative or exclamatory
          - Identify the subject, predicate and object in a sentence
      - id: cbse-12-electronics-and-hardware-ch01-t03
        title: Parts of speech and articles
        learning_outcomes:
          - Identify nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections in workplace sentences
          - Use the articles a, an and the correctly
      - id: cbse-12-electronics-and-hardware-ch01-t04
        title: Constructing a paragraph
        learning_outcomes:
          - Write a well-organised paragraph with a topic sentence, supporting sentences and a conclusion on a subject-related theme
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electronics-and-hardware-ch02
    number: 2
    title: "Employability Skills: Self-Management Skills – IV"
    unit: "Part A Unit 2: Self-Management Skills – IV"
    topics:
      - id: cbse-12-electronics-and-hardware-ch02-t01
        title: Motivation and self-motivation
        learning_outcomes:
          - Explain internal and external motivation and list personal needs and desires that drive motivation
      - id: cbse-12-electronics-and-hardware-ch02-t02
        title: Sources of motivation and a positive outlook
        learning_outcomes:
          - Identify sources of inspiration (people, books, music, activities) and techniques to stay positive and focused on goals
      - id: cbse-12-electronics-and-hardware-ch02-t03
        title: "Personality: meaning, influence and traits"
        learning_outcomes:
          - Define personality and explain how it influences others at work
          - Describe the five basic personality traits (openness, conscientiousness, extraversion, agreeableness, neuroticism)
      - id: cbse-12-electronics-and-hardware-ch02-t04
        title: Personality disorders and how to overcome them
        learning_outcomes:
          - >-
            Describe common personality disorders (paranoid, antisocial, schizoid, borderline, narcissistic, avoidant, dependent, obsessive)
            and the clusters they belong to
          - Suggest steps to seek help and overcome personality problems
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electronics-and-hardware-ch03
    number: 3
    title: "Employability Skills: ICT Skills – IV"
    unit: "Part A Unit 3: ICT Skills – IV"
    topics:
      - id: cbse-12-electronics-and-hardware-ch03-t01
        title: "Spreadsheet basics: workbook, worksheet and data entry"
        learning_outcomes:
          - Name common spreadsheet applications and create, open and save a workbook
          - Enter text and numbers, resize fonts and apply styles
      - id: cbse-12-electronics-and-hardware-ch03-t02
        title: Editing and organising spreadsheet data
        learning_outcomes:
          - Copy and move cell data, sort data and apply filters to a table
      - id: cbse-12-electronics-and-hardware-ch03-t03
        title: Formulas, functions, protection and printing
        learning_outcomes:
          - Use elementary formulas and functions such as SUM, AVERAGE, MIN and MAX
          - Protect a spreadsheet with a password, print it and save it in different formats
      - id: cbse-12-electronics-and-hardware-ch03-t04
        title: Creating a presentation
        learning_outcomes:
          - Name presentation software packages and list features of a good presentation
          - Create a presentation and add or delete slides
      - id: cbse-12-electronics-and-hardware-ch03-t05
        title: Editing and formatting presentations
        learning_outcomes:
          - Enter, edit and format text, insert clipart and images, choose slide layouts, and save and print a presentation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electronics-and-hardware-ch04
    number: 4
    title: "Employability Skills: Entrepreneurial Skills – IV"
    unit: "Part A Unit 4: Entrepreneurial Skills – IV"
    topics:
      - id: cbse-12-electronics-and-hardware-ch04-t01
        title: Barriers to becoming an entrepreneur
        learning_outcomes:
          - Classify barriers to entrepreneurship (environmental, personal, financial, social) with examples and ways to overcome them
      - id: cbse-12-electronics-and-hardware-ch04-t02
        title: Behavioural and entrepreneurial competencies
        learning_outcomes:
          - >-
            Describe competencies such as adaptability, decisiveness, initiative, perseverance, interpersonal and organisational skills,
            stress management and valuing service and diversity
      - id: cbse-12-electronics-and-hardware-ch04-t03
        title: Entrepreneurial competencies in particular
        learning_outcomes:
          - >-
            Explain self-confidence, seeing and acting on opportunities, concern for quality, goal setting, risk taking, problem solving,
            systematic planning, information seeking, persistence, negotiating and team building
      - id: cbse-12-electronics-and-hardware-ch04-t04
        title: Self-assessment of entrepreneurial behaviour
        learning_outcomes:
          - Rate oneself on behavioural competencies and prepare a personal competency profile
          - Relate competencies to stories of successful Indian entrepreneurs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electronics-and-hardware-ch05
    number: 5
    title: "Employability Skills: Green Skills – IV"
    unit: "Part A Unit 5: Green Skills – IV"
    topics:
      - id: cbse-12-electronics-and-hardware-ch05-t01
        title: Green jobs in homes, gardening, transport and energy conservation
        learning_outcomes:
          - Explain the role of green jobs in toxin-free homes, organic gardening, public transport and energy conservation
      - id: cbse-12-electronics-and-hardware-ch05-t02
        title: Green jobs in water, renewable energy and waste
        learning_outcomes:
          - Describe green jobs in water conservation, solar and wind power, and waste reduction, reuse and recycling
      - id: cbse-12-electronics-and-hardware-ch05-t03
        title: Green jobs in tourism, construction and appropriate technology
        learning_outcomes:
          - Give examples of green jobs in green tourism, building and construction and appropriate technology
      - id: cbse-12-electronics-and-hardware-ch05-t04
        title: Role of green jobs in protecting the environment
        learning_outcomes:
          - >-
            Explain how green jobs improve energy and raw-material use, limit greenhouse-gas emissions, minimise waste and pollution,
            restore ecosystems and support adaptation to climate change
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electronics-and-hardware-ch06
    number: 6
    title: Computer Network Essentials
    unit: "Part B Unit 1: Computer Network Essentials"
    topics:
      - id: cbse-12-electronics-and-hardware-ch06-t01
        title: Networking concepts and the OSI model
        learning_outcomes:
          - Explain computer networking and the seven layers of the OSI model
      - id: cbse-12-electronics-and-hardware-ch06-t02
        title: "Protocols: TCP, IP, UDP and FTP"
        learning_outcomes:
          - Describe common protocols and their purposes
      - id: cbse-12-electronics-and-hardware-ch06-t03
        title: Network technologies and inter-networks
        learning_outcomes:
          - Distinguish peer-to-peer and client-server networks and internet, intranet and extranet
      - id: cbse-12-electronics-and-hardware-ch06-t04
        title: Data transmission modes
        learning_outcomes:
          - Distinguish simplex, half-duplex and full-duplex transmission
      - id: cbse-12-electronics-and-hardware-ch06-t05
        title: Network devices and peripherals
        learning_outcomes:
          - Identify nodes, modems, RJ45 connectors, NICs and network devices and configure a NIC
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electronics-and-hardware-ch07
    number: 7
    title: Installation and Configuration of Windows Server
    unit: "Part B Unit 2: Installation and Configuration of Windows Server"
    topics:
      - id: cbse-12-electronics-and-hardware-ch07-t01
        title: Installing and deploying Windows Server
        learning_outcomes:
          - Describe installation, partitioning and post-installation configuration of Windows Server
      - id: cbse-12-electronics-and-hardware-ch07-t02
        title: Managing Windows Server and PowerShell
        learning_outcomes:
          - Use management tools and basic PowerShell commands to administer a server
      - id: cbse-12-electronics-and-hardware-ch07-t03
        title: Active Directory Domain Services
        learning_outcomes:
          - Explain AD DS structure and the purpose and installation of domain controllers
      - id: cbse-12-electronics-and-hardware-ch07-t04
        title: Managing AD DS objects
        learning_outcomes:
          - Create and manage users, groups and computers in Active Directory
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electronics-and-hardware-ch08
    number: 8
    title: Installation and Configuration of Linux Server
    unit: "Part B Unit 3: Installation and Configuration of Linux Server"
    topics:
      - id: cbse-12-electronics-and-hardware-ch08-t01
        title: Installing Linux server
        learning_outcomes:
          - Describe installation, partitioning and post-installation configuration of a Linux server
      - id: cbse-12-electronics-and-hardware-ch08-t02
        title: Managing Linux server from the terminal
        learning_outcomes:
          - Use the terminal as superuser and basic administration commands
      - id: cbse-12-electronics-and-hardware-ch08-t03
        title: Linux file structure, users and permissions
        learning_outcomes:
          - Describe the Linux directory structure and set read, write and execute permissions for users and groups
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electronics-and-hardware-ch09
    number: 9
    title: IT Security Fundamentals
    unit: "Part B Unit 4: IT Security Fundamentals"
    topics:
      - id: cbse-12-electronics-and-hardware-ch09-t01
        title: IT security concepts and data threats
        learning_outcomes:
          - Explain viruses, malware, DoS attacks, Trojans, worms, phishing and man-in-the-middle attacks
      - id: cbse-12-electronics-and-hardware-ch09-t02
        title: Value of information; personal and file security
        learning_outcomes:
          - Explain the value of information and methods of personal and file security
      - id: cbse-12-electronics-and-hardware-ch09-t03
        title: "Vulnerabilities: ports, services and code"
        learning_outcomes:
          - Identify vulnerabilities in ports, services and code
      - id: cbse-12-electronics-and-hardware-ch09-t04
        title: Antivirus software
        learning_outcomes:
          - Install, update and configure antivirus software and scan and remove viruses
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electronics-and-hardware-ch10
    number: 10
    title: Basics of ITIL v3
    unit: "Part B Unit 5: Basics of ITIL v3"
    topics:
      - id: cbse-12-electronics-and-hardware-ch10-t01
        title: Concept and core structure of ITIL
        learning_outcomes:
          - Define ITIL and describe its business perspective and core structure
      - id: cbse-12-electronics-and-hardware-ch10-t02
        title: Services and service management
        learning_outcomes:
          - Distinguish internal and external customers and services and explain IT service management and its stakeholders
      - id: cbse-12-electronics-and-hardware-ch10-t03
        title: ITIL service lifecycle
        learning_outcomes:
          - Describe the five stages of the service lifecycle and CSFs, KPIs and SLAs
