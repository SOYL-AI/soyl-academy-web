exam_notes: >-
  Total 100 = theory 80 (3 hours) + internal assessment 20. Part A (MCQ): grammar 12 (chhanda - introduction,
  importance, elements, gana, and the anushtup, totak, shikharini and shlesh metres; alankar - introduction, importance,
  kinds, upama and atishayokti); Ritu Vichar (Basanta and Hemanta cantos only, seen extract) 8. Part B (short answer):
  novel Juneli Rekha (seen extract) 10; Prativa Parichaya 6; Katha Sangraha 12; Nibandha Sangraha 8; Ekanki Sangraha 8;
  history of Nepali literature (introduction to the Nepali language; the Nepali novel) 6; essay 5 and letter 5 (long
  answer).
