chapters:
  - id: cbse-12-financial-markets-management-ch01
    number: 1
    title: "Employability Skills: Communication Skills – IV"
    unit: "Part A Unit 1: Communication Skills – IV"
    topics:
      - id: cbse-12-financial-markets-management-ch01-t01
        title: Active listening at the workplace
        learning_outcomes:
          - Explain why active listening matters at work and list the barriers to it
          - Describe the steps of active listening and apply them in a role play
      - id: cbse-12-financial-markets-management-ch01-t02
        title: Sentences and phrases; kinds and parts of a sentence
        learning_outcomes:
          - Distinguish a phrase from a sentence and classify sentences as declarative, interrogative, imperative or exclamatory
          - Identify the subject, predicate and object in a sentence
      - id: cbse-12-financial-markets-management-ch01-t03
        title: Parts of speech and articles
        learning_outcomes:
          - Identify nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections in workplace sentences
          - Use the articles a, an and the correctly
      - id: cbse-12-financial-markets-management-ch01-t04
        title: Constructing a paragraph
        learning_outcomes:
          - Write a well-organised paragraph with a topic sentence, supporting sentences and a conclusion on a subject-related theme
    removed_topics: []
    literature_texts: []
  - id: cbse-12-financial-markets-management-ch02
    number: 2
    title: "Employability Skills: Self-Management Skills – IV"
    unit: "Part A Unit 2: Self-Management Skills – IV"
    topics:
      - id: cbse-12-financial-markets-management-ch02-t01
        title: Motivation and self-motivation
        learning_outcomes:
          - Explain internal and external motivation and list personal needs and desires that drive motivation
      - id: cbse-12-financial-markets-management-ch02-t02
        title: Sources of motivation and a positive outlook
        learning_outcomes:
          - Identify sources of inspiration (people, books, music, activities) and techniques to stay positive and focused on goals
      - id: cbse-12-financial-markets-management-ch02-t03
        title: "Personality: meaning, influence and traits"
        learning_outcomes:
          - Define personality and explain how it influences others at work
          - Describe the five basic personality traits (openness, conscientiousness, extraversion, agreeableness, neuroticism)
      - id: cbse-12-financial-markets-management-ch02-t04
        title: Personality disorders and how to overcome them
        learning_outcomes:
          - >-
            Describe common personality disorders (paranoid, antisocial, schizoid, borderline, narcissistic, avoidant, dependent, obsessive)
            and the clusters they belong to
          - Suggest steps to seek help and overcome personality problems
    removed_topics: []
    literature_texts: []
  - id: cbse-12-financial-markets-management-ch03
    number: 3
    title: "Employability Skills: ICT Skills – IV"
    unit: "Part A Unit 3: ICT Skills – IV"
    topics:
      - id: cbse-12-financial-markets-management-ch03-t01
        title: "Spreadsheet basics: workbook, worksheet and data entry"
        learning_outcomes:
          - Name common spreadsheet applications and create, open and save a workbook
          - Enter text and numbers, resize fonts and apply styles
      - id: cbse-12-financial-markets-management-ch03-t02
        title: Editing and organising spreadsheet data
        learning_outcomes:
          - Copy and move cell data, sort data and apply filters to a table
      - id: cbse-12-financial-markets-management-ch03-t03
        title: Formulas, functions, protection and printing
        learning_outcomes:
          - Use elementary formulas and functions such as SUM, AVERAGE, MIN and MAX
          - Protect a spreadsheet with a password, print it and save it in different formats
      - id: cbse-12-financial-markets-management-ch03-t04
        title: Creating a presentation
        learning_outcomes:
          - Name presentation software packages and list features of a good presentation
          - Create a presentation and add or delete slides
      - id: cbse-12-financial-markets-management-ch03-t05
        title: Editing and formatting presentations
        learning_outcomes:
          - Enter, edit and format text, insert clipart and images, choose slide layouts, and save and print a presentation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-financial-markets-management-ch04
    number: 4
    title: "Employability Skills: Entrepreneurial Skills – IV"
    unit: "Part A Unit 4: Entrepreneurial Skills – IV"
    topics:
      - id: cbse-12-financial-markets-management-ch04-t01
        title: Barriers to becoming an entrepreneur
        learning_outcomes:
          - Classify barriers to entrepreneurship (environmental, personal, financial, social) with examples and ways to overcome them
      - id: cbse-12-financial-markets-management-ch04-t02
        title: Behavioural and entrepreneurial competencies
        learning_outcomes:
          - >-
            Describe competencies such as adaptability, decisiveness, initiative, perseverance, interpersonal and organisational skills,
            stress management and valuing service and diversity
      - id: cbse-12-financial-markets-management-ch04-t03
        title: Entrepreneurial competencies in particular
        learning_outcomes:
          - >-
            Explain self-confidence, seeing and acting on opportunities, concern for quality, goal setting, risk taking, problem solving,
            systematic planning, information seeking, persistence, negotiating and team building
      - id: cbse-12-financial-markets-management-ch04-t04
        title: Self-assessment of entrepreneurial behaviour
        learning_outcomes:
          - Rate oneself on behavioural competencies and prepare a personal competency profile
          - Relate competencies to stories of successful Indian entrepreneurs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-financial-markets-management-ch05
    number: 5
    title: "Employability Skills: Green Skills – IV"
    unit: "Part A Unit 5: Green Skills – IV"
    topics:
      - id: cbse-12-financial-markets-management-ch05-t01
        title: Green jobs in homes, gardening, transport and energy conservation
        learning_outcomes:
          - Explain the role of green jobs in toxin-free homes, organic gardening, public transport and energy conservation
      - id: cbse-12-financial-markets-management-ch05-t02
        title: Green jobs in water, renewable energy and waste
        learning_outcomes:
          - Describe green jobs in water conservation, solar and wind power, and waste reduction, reuse and recycling
      - id: cbse-12-financial-markets-management-ch05-t03
        title: Green jobs in tourism, construction and appropriate technology
        learning_outcomes:
          - Give examples of green jobs in green tourism, building and construction and appropriate technology
      - id: cbse-12-financial-markets-management-ch05-t04
        title: Role of green jobs in protecting the environment
        learning_outcomes:
          - >-
            Explain how green jobs improve energy and raw-material use, limit greenhouse-gas emissions, minimise waste and pollution,
            restore ecosystems and support adaptation to climate change
    removed_topics: []
    literature_texts: []
  - id: cbse-12-financial-markets-management-ch06
    number: 6
    title: Introduction to Indian Securities Market and Trading Membership
    unit: "Part B Unit 1: Introduction to Indian Securities Market and Trading Membership"
    topics:
      - id: cbse-12-financial-markets-management-ch06-t01
        title: Market segments, products and participants
        learning_outcomes:
          - Distinguish primary and secondary markets and identify products and participants of the securities market
      - id: cbse-12-financial-markets-management-ch06-t02
        title: Key indicators of the securities market
        learning_outcomes:
          - Explain index, market capitalisation, market-capitalisation ratio, turnover and turnover ratio
      - id: cbse-12-financial-markets-management-ch06-t03
        title: Reforms in Indian securities markets
        learning_outcomes:
          - >-
            Describe reforms such as SEBI, screen-based trading, dematerialisation, demutualisation, clearing corporations, ASBA and India
            VIX
      - id: cbse-12-financial-markets-management-ch06-t04
        title: Stock brokers and NSE membership
        learning_outcomes:
          - Explain eligibility and admission for NSE trading membership, surrender, suspension, expulsion and declaration of defaulter
      - id: cbse-12-financial-markets-management-ch06-t05
        title: Authorised persons and broker-client relations
        learning_outcomes:
          - Compare authorised persons and sub-brokers and list client registration documents
    removed_topics: []
    literature_texts: []
  - id: cbse-12-financial-markets-management-ch07
    number: 7
    title: Trading
    unit: "Part B Unit 2: Trading"
    topics:
      - id: cbse-12-financial-markets-management-ch07-t01
        title: NEAT trading system and market types
        learning_outcomes:
          - Describe the NEAT system, market types, user hierarchy and market phases
      - id: cbse-12-financial-markets-management-ch07-t02
        title: NEAT inquiry screens
        learning_outcomes:
          - Explain market watch, snap quote, outstanding orders, order status, market movement and other inquiry screens
      - id: cbse-12-financial-markets-management-ch07-t03
        title: Order management
        learning_outcomes:
          - Explain order entry, modification, cancellation and order matching rules
      - id: cbse-12-financial-markets-management-ch07-t04
        title: Internet broking, co-location and wireless trading
        learning_outcomes:
          - Describe the working process of internet broking, co-location and WAP-based trading
    removed_topics: []
    literature_texts: []
  - id: cbse-12-financial-markets-management-ch08
    number: 8
    title: Clearing and Settlement, Legal Framework
    unit: "Part B Unit 3: Clearing and Settlement, Legal Framework"
    topics:
      - id: cbse-12-financial-markets-management-ch08-t01
        title: Clearing and settlement process
        learning_outcomes:
          - Explain the transaction cycle, settlement agencies, clearing and settlement processes and the settlement cycle
      - id: cbse-12-financial-markets-management-ch08-t02
        title: Securities and funds settlement; shortages handling
        learning_outcomes:
          - Describe securities and funds pay-in and pay-out, valuation prices and close-out procedures
      - id: cbse-12-financial-markets-management-ch08-t03
        title: Risk management
        learning_outcomes:
          - >-
            Explain capital adequacy, margins, online and offline exposure monitoring, circuit breakers and the settlement guarantee
            mechanism
      - id: cbse-12-financial-markets-management-ch08-t04
        title: Legal framework of the securities market
        learning_outcomes:
          - Outline the roles of the SEBI Act, Securities Contracts (Regulation) Act, Depositories Act and Companies Act, and the ISIN
    removed_topics: []
    literature_texts: []
  - id: cbse-12-financial-markets-management-ch09
    number: 9
    title: Financial Statement Analysis
    unit: "Part B Unit 4: Financial Statement Analysis"
    topics:
      - id: cbse-12-financial-markets-management-ch09-t01
        title: Simple interest, compound interest and time value of money
        learning_outcomes:
          - Calculate simple and compound interest and explain the time value of money
      - id: cbse-12-financial-markets-management-ch09-t02
        title: Systematic analysis of a company
        learning_outcomes:
          - Describe the steps to analyse a company from its financial statements
      - id: cbse-12-financial-markets-management-ch09-t03
        title: Ratio analysis
        learning_outcomes:
          - Calculate and interpret liquidity, profitability, leverage and valuation ratios such as EPS and P/E
    removed_topics: []
    literature_texts: []
  - id: cbse-12-financial-markets-management-ch10
    number: 10
    title: Introduction to Derivatives
    unit: "Part B Unit 5: Introduction to Derivatives"
    topics:
      - id: cbse-12-financial-markets-management-ch10-t01
        title: Derivative contracts and their history
        learning_outcomes:
          - Define derivatives and distinguish forwards, futures, options and swaps
      - id: cbse-12-financial-markets-management-ch10-t02
        title: Participants and economic functions of derivative markets
        learning_outcomes:
          - Identify hedgers, speculators and arbitrageurs and explain the economic role of derivatives
      - id: cbse-12-financial-markets-management-ch10-t03
        title: Interest rates and the stock index
        learning_outcomes:
          - Explain interest rates and the construction, attributes and economic significance of a stock index
    removed_topics: []
    literature_texts: []
  - id: cbse-12-financial-markets-management-ch11
    number: 11
    title: Futures and Option Contracts, Mechanism and Pricing
    unit: "Part B Unit 6: Futures and Option Contracts, Mechanism and Pricing"
    topics:
      - id: cbse-12-financial-markets-management-ch11-t01
        title: Forward contracts and their limitations
        learning_outcomes:
          - Explain forward contracts and why their limitations led to futures
      - id: cbse-12-financial-markets-management-ch11-t02
        title: Futures terminology and payoffs
        learning_outcomes:
          - Distinguish futures from forwards, define spot price, basis, contract size and expiry, and draw futures payoffs
      - id: cbse-12-financial-markets-management-ch11-t03
        title: Pricing index and stock futures
        learning_outcomes:
          - Price index and stock futures using the cost-of-carry model, with dividend amount or yield
      - id: cbse-12-financial-markets-management-ch11-t04
        title: "Options: terminology, payoffs and pricing basics"
        learning_outcomes:
          - Define calls, puts, strike price, premium and moneyness and describe option payoffs for buyers and sellers
    removed_topics: []
    literature_texts: []
