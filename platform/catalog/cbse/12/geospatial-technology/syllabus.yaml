chapters:
  - id: cbse-12-geospatial-technology-ch01
    number: 1
    title: "Employability Skills: Communication Skills – IV"
    unit: "Part A Unit 1: Communication Skills – IV"
    topics:
      - id: cbse-12-geospatial-technology-ch01-t01
        title: Active listening at the workplace
        learning_outcomes:
          - Explain why active listening matters at work and list the barriers to it
          - Describe the steps of active listening and apply them in a role play
      - id: cbse-12-geospatial-technology-ch01-t02
        title: Sentences and phrases; kinds and parts of a sentence
        learning_outcomes:
          - Distinguish a phrase from a sentence and classify sentences as declarative, interrogative, imperative or exclamatory
          - Identify the subject, predicate and object in a sentence
      - id: cbse-12-geospatial-technology-ch01-t03
        title: Parts of speech and articles
        learning_outcomes:
          - Identify nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections in workplace sentences
          - Use the articles a, an and the correctly
      - id: cbse-12-geospatial-technology-ch01-t04
        title: Constructing a paragraph
        learning_outcomes:
          - Write a well-organised paragraph with a topic sentence, supporting sentences and a conclusion on a subject-related theme
    removed_topics: []
    literature_texts: []
  - id: cbse-12-geospatial-technology-ch02
    number: 2
    title: "Employability Skills: Self-Management Skills – IV"
    unit: "Part A Unit 2: Self-Management Skills – IV"
    topics:
      - id: cbse-12-geospatial-technology-ch02-t01
        title: Motivation and self-motivation
        learning_outcomes:
          - Explain internal and external motivation and list personal needs and desires that drive motivation
      - id: cbse-12-geospatial-technology-ch02-t02
        title: Sources of motivation and a positive outlook
        learning_outcomes:
          - Identify sources of inspiration (people, books, music, activities) and techniques to stay positive and focused on goals
      - id: cbse-12-geospatial-technology-ch02-t03
        title: "Personality: meaning, influence and traits"
        learning_outcomes:
          - Define personality and explain how it influences others at work
          - Describe the five basic personality traits (openness, conscientiousness, extraversion, agreeableness, neuroticism)
      - id: cbse-12-geospatial-technology-ch02-t04
        title: Personality disorders and how to overcome them
        learning_outcomes:
          - >-
            Describe common personality disorders (paranoid, antisocial, schizoid, borderline, narcissistic, avoidant, dependent, obsessive)
            and the clusters they belong to
          - Suggest steps to seek help and overcome personality problems
    removed_topics: []
    literature_texts: []
  - id: cbse-12-geospatial-technology-ch03
    number: 3
    title: "Employability Skills: ICT Skills – IV"
    unit: "Part A Unit 3: ICT Skills – IV"
    topics:
      - id: cbse-12-geospatial-technology-ch03-t01
        title: "Spreadsheet basics: workbook, worksheet and data entry"
        learning_outcomes:
          - Name common spreadsheet applications and create, open and save a workbook
          - Enter text and numbers, resize fonts and apply styles
      - id: cbse-12-geospatial-technology-ch03-t02
        title: Editing and organising spreadsheet data
        learning_outcomes:
          - Copy and move cell data, sort data and apply filters to a table
      - id: cbse-12-geospatial-technology-ch03-t03
        title: Formulas, functions, protection and printing
        learning_outcomes:
          - Use elementary formulas and functions such as SUM, AVERAGE, MIN and MAX
          - Protect a spreadsheet with a password, print it and save it in different formats
      - id: cbse-12-geospatial-technology-ch03-t04
        title: Creating a presentation
        learning_outcomes:
          - Name presentation software packages and list features of a good presentation
          - Create a presentation and add or delete slides
      - id: cbse-12-geospatial-technology-ch03-t05
        title: Editing and formatting presentations
        learning_outcomes:
          - Enter, edit and format text, insert clipart and images, choose slide layouts, and save and print a presentation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-geospatial-technology-ch04
    number: 4
    title: "Employability Skills: Entrepreneurial Skills – IV"
    unit: "Part A Unit 4: Entrepreneurial Skills – IV"
    topics:
      - id: cbse-12-geospatial-technology-ch04-t01
        title: Barriers to becoming an entrepreneur
        learning_outcomes:
          - Classify barriers to entrepreneurship (environmental, personal, financial, social) with examples and ways to overcome them
      - id: cbse-12-geospatial-technology-ch04-t02
        title: Behavioural and entrepreneurial competencies
        learning_outcomes:
          - >-
            Describe competencies such as adaptability, decisiveness, initiative, perseverance, interpersonal and organisational skills,
            stress management and valuing service and diversity
      - id: cbse-12-geospatial-technology-ch04-t03
        title: Entrepreneurial competencies in particular
        learning_outcomes:
          - >-
            Explain self-confidence, seeing and acting on opportunities, concern for quality, goal setting, risk taking, problem solving,
            systematic planning, information seeking, persistence, negotiating and team building
      - id: cbse-12-geospatial-technology-ch04-t04
        title: Self-assessment of entrepreneurial behaviour
        learning_outcomes:
          - Rate oneself on behavioural competencies and prepare a personal competency profile
          - Relate competencies to stories of successful Indian entrepreneurs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-geospatial-technology-ch05
    number: 5
    title: "Employability Skills: Green Skills – IV"
    unit: "Part A Unit 5: Green Skills – IV"
    topics:
      - id: cbse-12-geospatial-technology-ch05-t01
        title: Green jobs in homes, gardening, transport and energy conservation
        learning_outcomes:
          - Explain the role of green jobs in toxin-free homes, organic gardening, public transport and energy conservation
      - id: cbse-12-geospatial-technology-ch05-t02
        title: Green jobs in water, renewable energy and waste
        learning_outcomes:
          - Describe green jobs in water conservation, solar and wind power, and waste reduction, reuse and recycling
      - id: cbse-12-geospatial-technology-ch05-t03
        title: Green jobs in tourism, construction and appropriate technology
        learning_outcomes:
          - Give examples of green jobs in green tourism, building and construction and appropriate technology
      - id: cbse-12-geospatial-technology-ch05-t04
        title: Role of green jobs in protecting the environment
        learning_outcomes:
          - >-
            Explain how green jobs improve energy and raw-material use, limit greenhouse-gas emissions, minimise waste and pollution,
            restore ecosystems and support adaptation to climate change
    removed_topics: []
    literature_texts: []
  - id: cbse-12-geospatial-technology-ch06
    number: 6
    title: Remote Sensing (RS)
    unit: "Part B Unit 1: Remote Sensing (RS)"
    topics:
      - id: cbse-12-geospatial-technology-ch06-t01
        title: Electromagnetic spectrum and stages of remote sensing
        learning_outcomes:
          - Explain the electromagnetic spectrum, stages of remote sensing, Wien's displacement law and interactions of solar radiation
      - id: cbse-12-geospatial-technology-ch06-t02
        title: Spectral reflectance signatures and resolution
        learning_outcomes:
          - >-
            Compare spectral signatures of soil, vegetation, water and rock and explain spatial, spectral, radiometric and temporal
            resolution
      - id: cbse-12-geospatial-technology-ch06-t03
        title: Digital image processing
        learning_outcomes:
          - Describe image restoration, enhancement, classification, band ratioing, NDVI and PVI
      - id: cbse-12-geospatial-technology-ch06-t04
        title: Visual interpretation of satellite data and aerial photos
        learning_outcomes:
          - Use tone, shape, size, pattern, texture, shadow and association to interpret images and aerial photographs
      - id: cbse-12-geospatial-technology-ch06-t05
        title: Advanced remote sensing technologies
        learning_outcomes:
          - Explain hyperspectral, thermal and microwave remote sensing and the benefits of remote sensing
    removed_topics: []
    literature_texts: []
  - id: cbse-12-geospatial-technology-ch07
    number: 7
    title: Geographic Information System (GIS)
    unit: "Part B Unit 2: Geographic Information System (GIS)"
    topics:
      - id: cbse-12-geospatial-technology-ch07-t01
        title: Spatial and non-spatial data; GIS functions and data structures
        learning_outcomes:
          - Distinguish spatial and attribute data and raster and vector data structures
      - id: cbse-12-geospatial-technology-ch07-t02
        title: Data input to GIS
        learning_outcomes:
          - Describe digitisation, data transfer and keyboard entry and linking of spatial and attribute data
      - id: cbse-12-geospatial-technology-ch07-t03
        title: GIS data editing and topology
        learning_outcomes:
          - Explain topology building, topological and location errors and edge matching
      - id: cbse-12-geospatial-technology-ch07-t04
        title: Attribute data management and spatial analysis
        learning_outcomes:
          - Describe attribute queries, overlay analysis and thematic mapping
      - id: cbse-12-geospatial-technology-ch07-t05
        title: Map projections and coordinate systems
        learning_outcomes:
          - Explain projections, coordinate systems, UTM, datum and WGS84
      - id: cbse-12-geospatial-technology-ch07-t06
        title: Digital cartography and benefits of GIS
        learning_outcomes:
          - Describe digital cartography and the advantages of GIS
    removed_topics: []
    literature_texts: []
  - id: cbse-12-geospatial-technology-ch08
    number: 8
    title: Global Positioning System (GPS)
    unit: "Part B Unit 3: Global Positioning System (GPS)"
    topics:
      - id: cbse-12-geospatial-technology-ch08-t01
        title: History and segments of GPS
        learning_outcomes:
          - Describe the history and the space, control and user segments of GPS
      - id: cbse-12-geospatial-technology-ch08-t02
        title: GPS accuracy and errors
        learning_outcomes:
          - Explain sources of GPS error such as clock offset and dilution of precision
      - id: cbse-12-geospatial-technology-ch08-t03
        title: Types of GPS and global navigation systems
        learning_outcomes:
          - Compare DGPS, recreational, mapping and survey GPS and NAVSTAR, GLONASS and Galileo
      - id: cbse-12-geospatial-technology-ch08-t04
        title: Uses and limitations of GPS
        learning_outcomes:
          - Describe GPS uses in survey, mapping, height and location and vehicle tracking and its limitations
    removed_topics: []
    literature_texts: []
  - id: cbse-12-geospatial-technology-ch09
    number: 9
    title: Trends in Geospatial Technology
    unit: "Part B Unit 4: Trends in Geospatial Technology"
    topics:
      - id: cbse-12-geospatial-technology-ch09-t01
        title: Trends in remote sensing
        learning_outcomes:
          - Describe recent trends in remote sensing technology and applications
      - id: cbse-12-geospatial-technology-ch09-t02
        title: Trends in GIS
        learning_outcomes:
          - Explain web-based, enterprise, mobile, 3D and open GIS
      - id: cbse-12-geospatial-technology-ch09-t03
        title: Evolution of positioning technology
        learning_outcomes:
          - Trace navigation from the stone age to the satellite age and latest developments
    removed_topics: []
    literature_texts: []
  - id: cbse-12-geospatial-technology-ch10
    number: 10
    title: Applications of Geospatial Technology
    unit: "Part B Unit 5: Applications of Geospatial Technology"
    topics:
      - id: cbse-12-geospatial-technology-ch10-t01
        title: Watershed and flood studies
        learning_outcomes:
          - Explain the use of geospatial technology in watershed management and flood mapping
      - id: cbse-12-geospatial-technology-ch10-t02
        title: Health and utility studies
        learning_outcomes:
          - Describe geospatial applications in public health and utility management
      - id: cbse-12-geospatial-technology-ch10-t03
        title: Security, urban infrastructure and disaster relief
        learning_outcomes:
          - Describe geospatial applications in defence, urban planning and disaster relief management
    removed_topics: []
    literature_texts: []
