exam_notes: >-
  Theory 30 marks (2 hours) + practical 70. Theory paper (CBSE 2026-27 SQP): Section A 8 MCQs x 1; Section B 5 short answers x 2, each with
  an internal choice; Section C 2 long answers x 6, each with an internal choice. The practical (adavus, jatiswaram in Rupaka, padam or
  keertanam, tillana in Adi, hasta viniyoga, sapta talas) is marked board_assessed: false here. The CBSE dance document's page headers still
  say 2025-26, but it is the 2026-27 file (each page is stamped 2026-27). Single board exam (February-March 2027).
