      - id: cbse-12-french-ch04-t03
        title: La négation
        title_en: Negation
        learning_outcomes:
          - Use ne...pas, ne...jamais, ne...plus, ne...rien, ne...personne and ne...que correctly
      - id: cbse-12-french-ch04-t04
        title: Les phrases en désordre
        title_en: Jumbled sentences
