# CBSE Class 12 French (118), 2026-27. Sections, marks, writing tasks, grammar items and the prescribed lessons as
# printed in the CBSE 2026-27 French Classes XI-XII syllabus. Prescribed book: Cours de Langue et de Civilisation
# Françaises II by G. Mauger, lessons 18-23. CBSE lists the lessons by NUMBER only, so the culture
# chapter carries a placeholder topic until the lesson titles are supplied. No text is reproduced (CONTEXT §8).
subject_id: cbse-12-french
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-french-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (ASL 10 - listening 5, speaking 5; project work 10 on a French or
  francophone writer, a francophone country, French cuisine or a French region). The paper has 33% internal choice.
  Section A Comprehension 20: a seen passage from the prescribed book with short answers 10 and an unseen
  factual/descriptive passage with a picture or data 10 (true/false or one-word answers, vocabulary search). Section B
  Writing 20: story from an outline (about 120 words) 10 and informal letter (about 80 words) 10. Section C Grammar 25:
  five questions of 5 marks - tenses compulsory plus any four of relative pronouns, personal pronouns, direct and
  reported speech, interrogatives, prepositions, negation and jumbled sentences, tested through gap filling,
  transformation and correction. Section D Culture 15 (lessons 18-23): short answers 5x2 and fill in the blanks 5x1.
  Board examination in Class XII.
units:
  - name: 'Section A : Compréhension écrite'
    marks: 20
  - name: 'Section B : Expression écrite'
    marks: 20
  - name: 'Section C : Grammaire'
    marks: 25
  - name: 'Section D : Culture et civilisation'
    marks: 15
chapters:
  - id: cbse-12-french-ch01
    number: 1
    title: Compréhension écrite
    title_en: Reading comprehension
    unit: 'Section A : Compréhension écrite'
    topics:
      - id: cbse-12-french-ch01-t01
        title: Texte du manuel
        title_en: Seen passage from the prescribed book
        learning_outcomes:
          - Answer short questions on a passage from the prescribed lessons
      - id: cbse-12-french-ch01-t02
        title: Texte inconnu avec image ou données
        title_en: Unseen factual or descriptive passage with a picture or data
        learning_outcomes:
          - Read an unseen passage and answer true/false and one-word questions
          - Find nouns, verbs, opposites, synonyms and expressions in the passage
    removed_topics: []
    literature_texts: []
  - id: cbse-12-french-ch02
    number: 2
    title: Expression écrite
    title_en: Writing
    unit: 'Section B : Expression écrite'
    topics:
      - id: cbse-12-french-ch02-t01
        title: Rédaction d'une histoire à partir d'un canevas (120 mots)
        title_en: Story from an outline (about 120 words)
        learning_outcomes:
          - Develop a given outline into a coherent story of about 120 words using past tenses
      - id: cbse-12-french-ch02-t02
        title: La lettre informelle (80 mots)
        title_en: Informal letter (about 80 words)
        learning_outcomes:
          - Write an informal letter with date, salutation, body and closing
    removed_topics: []
    literature_texts: []
  - id: cbse-12-french-ch03
    number: 3
    title: 'Grammaire : pronoms et prépositions'
    title_en: 'Grammar: pronouns and prepositions'
    unit: 'Section C : Grammaire'
    topics:
      - id: cbse-12-french-ch03-t01
        title: Les pronoms personnels
        title_en: Personal pronouns
        learning_outcomes:
          - Replace nouns with subject, direct and indirect object pronouns, y and en in the correct order
      - id: cbse-12-french-ch03-t02
        title: Les pronoms relatifs simples et composés
        title_en: Relative pronouns (simple and compound)
        learning_outcomes:
          - Join sentences with qui, que, dont, où and lequel/auquel/duquel
      - id: cbse-12-french-ch03-t03
        title: Les adjectifs et pronoms interrogatifs
        title_en: Interrogative adjectives and pronouns
        learning_outcomes:
          - Form questions with quel, lequel and interrogative pronouns
      - id: cbse-12-french-ch03-t04
        title: Les prépositions
        title_en: Prepositions
        learning_outcomes:
          - Use prepositions of place, time and manner correctly
    removed_topics: []
