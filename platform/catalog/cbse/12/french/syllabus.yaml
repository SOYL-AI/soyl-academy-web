        title_en: Tenses (excluding passé simple and passé antérieur)
        learning_outcomes:
          - >-
            Conjugate verbs in the present, passé composé, imparfait, plus-que-parfait, futur, conditionnel and
            subjonctif as required
      - id: cbse-12-french-ch04-t02
        title: Le discours direct et indirect
        title_en: Direct and reported speech
        learning_outcomes:
