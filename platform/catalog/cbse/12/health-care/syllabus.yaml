chapters:
  - id: cbse-12-health-care-ch01
    number: 1
    title: "Employability Skills: Communication Skills – IV"
    unit: "Part A Unit 1: Communication Skills – IV"
    topics:
      - id: cbse-12-health-care-ch01-t01
        title: Active listening at the workplace
        learning_outcomes:
          - Explain why active listening matters at work and list the barriers to it
          - Describe the steps of active listening and apply them in a role play
      - id: cbse-12-health-care-ch01-t02
        title: Sentences and phrases; kinds and parts of a sentence
        learning_outcomes:
          - Distinguish a phrase from a sentence and classify sentences as declarative, interrogative, imperative or exclamatory
          - Identify the subject, predicate and object in a sentence
      - id: cbse-12-health-care-ch01-t03
        title: Parts of speech and articles
        learning_outcomes:
          - Identify nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections in workplace sentences
          - Use the articles a, an and the correctly
      - id: cbse-12-health-care-ch01-t04
        title: Constructing a paragraph
        learning_outcomes:
          - Write a well-organised paragraph with a topic sentence, supporting sentences and a conclusion on a subject-related theme
    removed_topics: []
    literature_texts: []
  - id: cbse-12-health-care-ch02
    number: 2
    title: "Employability Skills: Self-Management Skills – IV"
    unit: "Part A Unit 2: Self-Management Skills – IV"
    topics:
      - id: cbse-12-health-care-ch02-t01
        title: Motivation and self-motivation
        learning_outcomes:
          - Explain internal and external motivation and list personal needs and desires that drive motivation
      - id: cbse-12-health-care-ch02-t02
        title: Sources of motivation and a positive outlook
        learning_outcomes:
          - Identify sources of inspiration (people, books, music, activities) and techniques to stay positive and focused on goals
      - id: cbse-12-health-care-ch02-t03
        title: "Personality: meaning, influence and traits"
        learning_outcomes:
          - Define personality and explain how it influences others at work
          - Describe the five basic personality traits (openness, conscientiousness, extraversion, agreeableness, neuroticism)
      - id: cbse-12-health-care-ch02-t04
        title: Personality disorders and how to overcome them
        learning_outcomes:
          - >-
            Describe common personality disorders (paranoid, antisocial, schizoid, borderline, narcissistic, avoidant, dependent, obsessive)
            and the clusters they belong to
          - Suggest steps to seek help and overcome personality problems
    removed_topics: []
    literature_texts: []
  - id: cbse-12-health-care-ch03
    number: 3
    title: "Employability Skills: ICT Skills – IV"
    unit: "Part A Unit 3: ICT Skills – IV"
    topics:
      - id: cbse-12-health-care-ch03-t01
        title: "Spreadsheet basics: workbook, worksheet and data entry"
        learning_outcomes:
          - Name common spreadsheet applications and create, open and save a workbook
          - Enter text and numbers, resize fonts and apply styles
      - id: cbse-12-health-care-ch03-t02
        title: Editing and organising spreadsheet data
        learning_outcomes:
          - Copy and move cell data, sort data and apply filters to a table
      - id: cbse-12-health-care-ch03-t03
        title: Formulas, functions, protection and printing
        learning_outcomes:
          - Use elementary formulas and functions such as SUM, AVERAGE, MIN and MAX
          - Protect a spreadsheet with a password, print it and save it in different formats
      - id: cbse-12-health-care-ch03-t04
        title: Creating a presentation
        learning_outcomes:
          - Name presentation software packages and list features of a good presentation
          - Create a presentation and add or delete slides
      - id: cbse-12-health-care-ch03-t05
        title: Editing and formatting presentations
        learning_outcomes:
          - Enter, edit and format text, insert clipart and images, choose slide layouts, and save and print a presentation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-health-care-ch04
    number: 4
    title: "Employability Skills: Entrepreneurial Skills – IV"
    unit: "Part A Unit 4: Entrepreneurial Skills – IV"
    topics:
      - id: cbse-12-health-care-ch04-t01
        title: Barriers to becoming an entrepreneur
        learning_outcomes:
          - Classify barriers to entrepreneurship (environmental, personal, financial, social) with examples and ways to overcome them
      - id: cbse-12-health-care-ch04-t02
        title: Behavioural and entrepreneurial competencies
        learning_outcomes:
          - >-
            Describe competencies such as adaptability, decisiveness, initiative, perseverance, interpersonal and organisational skills,
            stress management and valuing service and diversity
      - id: cbse-12-health-care-ch04-t03
        title: Entrepreneurial competencies in particular
        learning_outcomes:
          - >-
            Explain self-confidence, seeing and acting on opportunities, concern for quality, goal setting, risk taking, problem solving,
            systematic planning, information seeking, persistence, negotiating and team building
      - id: cbse-12-health-care-ch04-t04
        title: Self-assessment of entrepreneurial behaviour
        learning_outcomes:
          - Rate oneself on behavioural competencies and prepare a personal competency profile
          - Relate competencies to stories of successful Indian entrepreneurs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-health-care-ch05
    number: 5
    title: "Employability Skills: Green Skills – IV"
    unit: "Part A Unit 5: Green Skills – IV"
    topics:
      - id: cbse-12-health-care-ch05-t01
        title: Green jobs in homes, gardening, transport and energy conservation
        learning_outcomes:
          - Explain the role of green jobs in toxin-free homes, organic gardening, public transport and energy conservation
      - id: cbse-12-health-care-ch05-t02
        title: Green jobs in water, renewable energy and waste
        learning_outcomes:
          - Describe green jobs in water conservation, solar and wind power, and waste reduction, reuse and recycling
      - id: cbse-12-health-care-ch05-t03
        title: Green jobs in tourism, construction and appropriate technology
        learning_outcomes:
          - Give examples of green jobs in green tourism, building and construction and appropriate technology
      - id: cbse-12-health-care-ch05-t04
        title: Role of green jobs in protecting the environment
        learning_outcomes:
          - >-
            Explain how green jobs improve energy and raw-material use, limit greenhouse-gas emissions, minimise waste and pollution,
            restore ecosystems and support adaptation to climate change
    removed_topics: []
    literature_texts: []
  - id: cbse-12-health-care-ch06
    number: 6
    title: Medical Records and Documentation
    unit: "Part B Unit 1: Medical Records and Documentation"
    topics:
      - id: cbse-12-health-care-ch06-t01
        title: Purpose and principles of documentation
        learning_outcomes:
          - Explain why patient documentation is kept and state the principles of good documentation
      - id: cbse-12-health-care-ch06-t02
        title: Content of medical documentation and types of entries
        learning_outcomes:
          - Identify the contents of a medical record and the types of entries made
      - id: cbse-12-health-care-ch06-t03
        title: Source-oriented and problem-oriented medical records
        learning_outcomes:
          - Distinguish source-oriented and problem-oriented records and describe documentation formats
      - id: cbse-12-health-care-ch06-t04
        title: Maintaining records and the role of the GDA
        learning_outcomes:
          - Describe how records are maintained and kept confidential and the role of the general duty assistant
    removed_topics: []
    literature_texts: []
  - id: cbse-12-health-care-ch07
    number: 7
    title: Role of General Duty Assistant in Elderly Care and Child Care
    unit: "Part B Unit 2: Role of General Duty Assistant in Elderly Care and Child Care"
    topics:
      - id: cbse-12-health-care-ch07-t01
        title: "Ageing: myths and facts"
        learning_outcomes:
          - Distinguish myths and facts about ageing and elderly people
      - id: cbse-12-health-care-ch07-t02
        title: Age-related changes and basic needs of the elderly
        learning_outcomes:
          - Describe physical changes with age and the physical, emotional and social needs of elderly people
      - id: cbse-12-health-care-ch07-t03
        title: Common problems of the elderly and their care
        learning_outcomes:
          - Explain care for common problems such as falls, incontinence, poor vision and memory loss
      - id: cbse-12-health-care-ch07-t04
        title: Growth, development and safety of children
        learning_outcomes:
          - Describe stages of child growth and development and measures to keep children safe
      - id: cbse-12-health-care-ch07-t05
        title: Nutrition and adolescent disorders; vital signs
        learning_outcomes:
          - >-
            Explain nutritional care of children, common adolescent disorders, and measurement of pulse, respiration, blood pressure and
            temperature
    removed_topics: []
    literature_texts: []
  - id: cbse-12-health-care-ch08
    number: 8
    title: Bio-medical Waste Management
    unit: "Part B Unit 3: Bio-medical Waste Management"
    topics:
      - id: cbse-12-health-care-ch08-t01
        title: Sources of bio-medical waste
        learning_outcomes:
          - Identify sources and categories of bio-medical waste in hospitals
      - id: cbse-12-health-care-ch08-t02
        title: Segregation, colour coding, transport and disposal
        learning_outcomes:
          - Explain colour-coded segregation, safe transport and disposal of bio-medical waste
      - id: cbse-12-health-care-ch08-t03
        title: Role of hospital staff in waste management
        learning_outcomes:
          - Describe the responsibilities of different hospital staff in bio-medical waste management
      - id: cbse-12-health-care-ch08-t04
        title: Antisepsis, disinfection and sterilisation
        learning_outcomes:
          - Differentiate antiseptics, disinfectants and sterilisation and physical and chemical agents used
    removed_topics: []
    literature_texts: []
  - id: cbse-12-health-care-ch09
    number: 9
    title: Operation Theatre
    unit: "Part B Unit 4: Operation Theatre"
    topics:
      - id: cbse-12-health-care-ch09-t01
        title: Zones and areas of the operation theatre complex
        learning_outcomes:
          - Describe the aims of OT planning and its protective, clean, sterile and disposal zones
      - id: cbse-12-health-care-ch09-t02
        title: Organisation, equipment and staff of the operation theatre
        learning_outcomes:
          - Identify OT equipment and the duties of OT staff
      - id: cbse-12-health-care-ch09-t03
        title: Pre-operative preparation of the patient
        learning_outcomes:
          - Describe the role of the GDA in preparing a patient for surgery
      - id: cbse-12-health-care-ch09-t04
        title: Post-operative care
        learning_outcomes:
          - Describe post-operative care, including gradual reintroduction of diet
    removed_topics: []
    literature_texts: []
  - id: cbse-12-health-care-ch10
    number: 10
    title: Role of General Duty Assistant in Disaster Management and Emergency Response
    unit: "Part B Unit 5: Role of General Duty Assistant in Disaster Management and Emergency Response"
    topics:
      - id: cbse-12-health-care-ch10-t01
        title: Disaster management cycle and the Disaster Management Act 2005
        learning_outcomes:
          - Explain the goals, cycle and phases of disaster management and the main provisions of the 2005 Act
      - id: cbse-12-health-care-ch10-t02
        title: Role of the emergency response team
        learning_outcomes:
          - Describe the roles and responsibilities of an emergency response team
      - id: cbse-12-health-care-ch10-t03
        title: Classification and causes of fire
        learning_outcomes:
          - Classify fires and identify their causes
      - id: cbse-12-health-care-ch10-t04
        title: Fire fighting, prevention and drills
        learning_outcomes:
          - Explain methods of extinguishing fire, fire-prevention procedures and the benefits of drills
    removed_topics: []
    literature_texts: []
  - id: cbse-12-health-care-ch11
    number: 11
    title: Self-Management and Career Scope
    unit: "Part B Unit 6: Self-Management and Career Scope"
    topics:
      - id: cbse-12-health-care-ch11-t01
        title: Goal setting and learning approaches
        learning_outcomes:
          - Apply steps of goal setting and describe learning approaches in higher education
      - id: cbse-12-health-care-ch11-t02
        title: Personal development and self-management as an employee
        learning_outcomes:
          - Explain personal development and self-management at the workplace
      - id: cbse-12-health-care-ch11-t03
        title: Time management and critical thinking
        learning_outcomes:
          - Prepare a time log or to-do list and apply critical thinking to solve a problem
      - id: cbse-12-health-care-ch11-t04
        title: Stress management
        learning_outcomes:
          - Identify stressors and stress-related illness and apply stress-management skills
