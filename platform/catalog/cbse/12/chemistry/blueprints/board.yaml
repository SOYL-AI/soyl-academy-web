notes: >-
  33 questions, five sections (16 x 1, 5 x 2, 7 x 3, 2 x 4 case-based, 3 x 5). The 2026-27 SQP puts four assertion-reason items

  (Q13-16) inside the 16 objective questions. Internal choice: one Section B question, one Section C question, sub-parts of both case-based

  questions, all three Section E questions (CBSE design: ~33% internal choice in all sections). Competency weights from the design table:

  remembering/understanding 28, applying 21, analysing/evaluating/creating 21. Log tables and calculators not allowed. Reaction-completion,

  name-reaction and conversion items are mapped to short (written equations; no structured chemical-equation answer type exists). Visually
  impaired candidates get substitute questions for items with visual input (not modelled).
