chapters:
  - id: cbse-12-beauty-and-wellness-ch01
    number: 1
    title: "Employability Skills: Communication Skills – IV"
    unit: "Part A Unit 1: Communication Skills – IV"
    topics:
      - id: cbse-12-beauty-and-wellness-ch01-t01
        title: Active listening at the workplace
        learning_outcomes:
          - Explain why active listening matters at work and list the barriers to it
          - Describe the steps of active listening and apply them in a role play
      - id: cbse-12-beauty-and-wellness-ch01-t02
        title: Sentences and phrases; kinds and parts of a sentence
        learning_outcomes:
          - Distinguish a phrase from a sentence and classify sentences as declarative, interrogative, imperative or exclamatory
          - Identify the subject, predicate and object in a sentence
      - id: cbse-12-beauty-and-wellness-ch01-t03
        title: Parts of speech and articles
        learning_outcomes:
          - Identify nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections in workplace sentences
          - Use the articles a, an and the correctly
      - id: cbse-12-beauty-and-wellness-ch01-t04
        title: Constructing a paragraph
        learning_outcomes:
          - Write a well-organised paragraph with a topic sentence, supporting sentences and a conclusion on a subject-related theme
    removed_topics: []
    literature_texts: []
  - id: cbse-12-beauty-and-wellness-ch02
    number: 2
    title: "Employability Skills: Self-Management Skills – IV"
    unit: "Part A Unit 2: Self-Management Skills – IV"
    topics:
      - id: cbse-12-beauty-and-wellness-ch02-t01
        title: Motivation and self-motivation
        learning_outcomes:
          - Explain internal and external motivation and list personal needs and desires that drive motivation
      - id: cbse-12-beauty-and-wellness-ch02-t02
        title: Sources of motivation and a positive outlook
        learning_outcomes:
          - Identify sources of inspiration (people, books, music, activities) and techniques to stay positive and focused on goals
      - id: cbse-12-beauty-and-wellness-ch02-t03
        title: "Personality: meaning, influence and traits"
        learning_outcomes:
          - Define personality and explain how it influences others at work
          - Describe the five basic personality traits (openness, conscientiousness, extraversion, agreeableness, neuroticism)
      - id: cbse-12-beauty-and-wellness-ch02-t04
        title: Personality disorders and how to overcome them
        learning_outcomes:
          - >-
            Describe common personality disorders (paranoid, antisocial, schizoid, borderline, narcissistic, avoidant, dependent, obsessive)
            and the clusters they belong to
          - Suggest steps to seek help and overcome personality problems
    removed_topics: []
    literature_texts: []
  - id: cbse-12-beauty-and-wellness-ch03
    number: 3
    title: "Employability Skills: ICT Skills – IV"
    unit: "Part A Unit 3: ICT Skills – IV"
    topics:
      - id: cbse-12-beauty-and-wellness-ch03-t01
        title: "Spreadsheet basics: workbook, worksheet and data entry"
        learning_outcomes:
          - Name common spreadsheet applications and create, open and save a workbook
          - Enter text and numbers, resize fonts and apply styles
      - id: cbse-12-beauty-and-wellness-ch03-t02
        title: Editing and organising spreadsheet data
        learning_outcomes:
          - Copy and move cell data, sort data and apply filters to a table
      - id: cbse-12-beauty-and-wellness-ch03-t03
        title: Formulas, functions, protection and printing
        learning_outcomes:
          - Use elementary formulas and functions such as SUM, AVERAGE, MIN and MAX
          - Protect a spreadsheet with a password, print it and save it in different formats
      - id: cbse-12-beauty-and-wellness-ch03-t04
        title: Creating a presentation
        learning_outcomes:
          - Name presentation software packages and list features of a good presentation
          - Create a presentation and add or delete slides
      - id: cbse-12-beauty-and-wellness-ch03-t05
        title: Editing and formatting presentations
        learning_outcomes:
          - Enter, edit and format text, insert clipart and images, choose slide layouts, and save and print a presentation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-beauty-and-wellness-ch04
    number: 4
    title: "Employability Skills: Entrepreneurial Skills – IV"
    unit: "Part A Unit 4: Entrepreneurial Skills – IV"
    topics:
      - id: cbse-12-beauty-and-wellness-ch04-t01
        title: Barriers to becoming an entrepreneur
        learning_outcomes:
          - Classify barriers to entrepreneurship (environmental, personal, financial, social) with examples and ways to overcome them
      - id: cbse-12-beauty-and-wellness-ch04-t02
        title: Behavioural and entrepreneurial competencies
        learning_outcomes:
          - >-
            Describe competencies such as adaptability, decisiveness, initiative, perseverance, interpersonal and organisational skills,
            stress management and valuing service and diversity
      - id: cbse-12-beauty-and-wellness-ch04-t03
        title: Entrepreneurial competencies in particular
        learning_outcomes:
          - >-
            Explain self-confidence, seeing and acting on opportunities, concern for quality, goal setting, risk taking, problem solving,
            systematic planning, information seeking, persistence, negotiating and team building
      - id: cbse-12-beauty-and-wellness-ch04-t04
        title: Self-assessment of entrepreneurial behaviour
        learning_outcomes:
          - Rate oneself on behavioural competencies and prepare a personal competency profile
          - Relate competencies to stories of successful Indian entrepreneurs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-beauty-and-wellness-ch05
    number: 5
    title: "Employability Skills: Green Skills – IV"
    unit: "Part A Unit 5: Green Skills – IV"
    topics:
      - id: cbse-12-beauty-and-wellness-ch05-t01
        title: Green jobs in homes, gardening, transport and energy conservation
        learning_outcomes:
          - Explain the role of green jobs in toxin-free homes, organic gardening, public transport and energy conservation
      - id: cbse-12-beauty-and-wellness-ch05-t02
        title: Green jobs in water, renewable energy and waste
        learning_outcomes:
          - Describe green jobs in water conservation, solar and wind power, and waste reduction, reuse and recycling
      - id: cbse-12-beauty-and-wellness-ch05-t03
        title: Green jobs in tourism, construction and appropriate technology
        learning_outcomes:
          - Give examples of green jobs in green tourism, building and construction and appropriate technology
      - id: cbse-12-beauty-and-wellness-ch05-t04
        title: Role of green jobs in protecting the environment
        learning_outcomes:
          - >-
            Explain how green jobs improve energy and raw-material use, limit greenhouse-gas emissions, minimise waste and pollution,
            restore ecosystems and support adaptation to climate change
    removed_topics: []
    literature_texts: []
  - id: cbse-12-beauty-and-wellness-ch06
    number: 6
    title: Make-up Services
    unit: "Part B Units 1-2: Make-up and Facial Beauty Services"
    topics:
      - id: cbse-12-beauty-and-wellness-ch06-t01
        title: Skin types and skin tones
        learning_outcomes:
          - Identify oily, dry, normal and combination skin and fair, dark, pink, yellow and pale skin tones
      - id: cbse-12-beauty-and-wellness-ch06-t02
        title: Make-up products and their selection
        learning_outcomes:
          - Select foundation, powder, blusher, eye and lip products to suit the client and occasion
      - id: cbse-12-beauty-and-wellness-ch06-t03
        title: Colour wheel, highlighting and contouring
        learning_outcomes:
          - Use the colour wheel to choose make-up shades and explain highlighting and contouring
      - id: cbse-12-beauty-and-wellness-ch06-t04
        title: Day, party, evening and bridal make-up
        learning_outcomes:
          - Describe the steps and differences of day, party, evening and bridal make-up
      - id: cbse-12-beauty-and-wellness-ch06-t05
        title: Bindi designs and costume draping
        learning_outcomes:
          - Describe basic bindi designs and draping of costumes for make-up looks
    removed_topics: []
    literature_texts: []
  - id: cbse-12-beauty-and-wellness-ch07
    number: 7
    title: Facial Beauty Services
    unit: "Part B Units 1-2: Make-up and Facial Beauty Services"
    topics:
      - id: cbse-12-beauty-and-wellness-ch07-t01
        title: Electrical and electronic facial equipment
        learning_outcomes:
          - >-
            Identify the brush machine, facial steamer, high-frequency, galvanic, faradic, vacuum suction, micro-current and
            microdermabrasion equipment and their uses
      - id: cbse-12-beauty-and-wellness-ch07-t02
        title: Contraindications and safe operation
        learning_outcomes:
          - Identify contraindications for each machine and operate equipment per manufacturer instructions
      - id: cbse-12-beauty-and-wellness-ch07-t03
        title: Facial service procedure and product selection
        learning_outcomes:
          - Select skincare products and machines according to the client service plan and carry out a facial
      - id: cbse-12-beauty-and-wellness-ch07-t04
        title: After-care and homecare advice
        learning_outcomes:
          - Give after-procedure care, homecare and product recommendations to clients
    removed_topics: []
    literature_texts: []
  - id: cbse-12-beauty-and-wellness-ch08
    number: 8
    title: Salon Reception Duties
    unit: "Part B Units 3-4: Reception Duties and Positive Impression at the Workplace"
    topics:
      - id: cbse-12-beauty-and-wellness-ch08-t01
        title: Customer satisfaction and its business importance
        learning_outcomes:
          - Explain why customer satisfaction drives salon business and professional success
      - id: cbse-12-beauty-and-wellness-ch08-t02
        title: Booking appointments and computerised booking systems
        learning_outcomes:
          - List information needed to book an appointment and describe computerised booking procedures
      - id: cbse-12-beauty-and-wellness-ch08-t03
        title: Managing waiting clients and customer-service principles
        learning_outcomes:
          - Suggest ways to manage clients while they wait and respect their privacy and modesty
      - id: cbse-12-beauty-and-wellness-ch08-t04
        title: Data protection at the salon
        learning_outcomes:
          - Explain the importance of protecting client data and relevant good practices
    removed_topics: []
    literature_texts: []
  - id: cbse-12-beauty-and-wellness-ch09
    number: 9
    title: Create a Positive Impression at the Workplace
    unit: "Part B Units 3-4: Reception Duties and Positive Impression at the Workplace"
    topics:
      - id: cbse-12-beauty-and-wellness-ch09-t01
        title: Client consultation techniques
        learning_outcomes:
          - Use effective consultation techniques to identify treatment objectives
      - id: cbse-12-beauty-and-wellness-ch09-t02
        title: Communicating with clients
        learning_outcomes:
          - Apply effective communication techniques, including telephone communication, when dealing with clients
      - id: cbse-12-beauty-and-wellness-ch09-t03
        title: Professional etiquette and grooming
        learning_outcomes:
          - Describe professional etiquette and personal presentation expected in the beauty industry
