# CBSE Class 12 Bengali (105), 2026-27. Sections, marks, question-paper structure, grammar
# items, writing tasks and every prescribed lesson with its author (CBSE prints titles and authors in Roman
# transliteration; Bengali-script spellings are SOYL's), from the CBSE 2026-27 Bengali XI-XII syllabus, Class
# XII. Books: Sahityanushilan - Bangla 'Ka', Class XII (Paschimbanga Uchcha
# Madhyamik Siksha Sansad) and Uchchataro Bangla Byakoron (Nabam o Dasham shreni), Bamandeb Chakraborty (Akshay
# Malancha). Titles and authors only; no text is reproduced (CONTEXT §8).
subject_id: cbse-12-bengali
academic_year: "2026-27"
source_status: verified
