exam_notes: >-
  Board theory 80 marks (3 hours) + internal assessment 20 (project with file and viva 10 - translation, interview, dramatisation,
  self-composed story, field trip or short film, one in Class XI and another in XII; listening 5; speaking 5). Part A (MCQ, 25%): two unseen
  passages of about 200 words, each with four direct questions and one grammar question (sandhi, synonyms, antonyms, sadhu-chalit) 2x5;
  literature MCQs 10 (drama 5, supplementary reader 5). Part B (subjective): grammar 15 - phonology (dhwanitattwa: apinihiti, abhishruti,
  swarasangati, swarabhakti; definition with examples) 2+3, semantics (shabdarthatattwa: expansion, contraction, elevation and degradation
  of meaning) 2+3, proverbs and idioms - sentence making from the 50 selected in CBSE Annexure 1, 5x1; literature 33 - prose 2+3, 2, 3;
  poetry 5 and 3; translated international poem 1+3; drama 2+3; supplementary reader 1+3 and 2; creative writing 12 - report reading (a
  120-word report: headline, main topic in three sentences and one direct question) 6 and a non-classified advertisement within 50 words 6.
  Word limits: 5 marks 120-130 words, 3 marks 50-60, 2 marks 25-30.
