notes: >-
  Theory (drawing) paper only (70 marks, 3 hours); practical 30 is assessed separately. 25 questions. Section A Q1-14 MCQs x 1. Section B
  Q15-18 and Q19-22 are two case-based sets of four 1-mark MCQs each (based on an isometric drawing and on a passage about fasteners); Q23
  is an assembly drawing (A) OR a dis-assembly drawing (B) of 27 marks (views 13+8 or 8+7+3+3, plus 6 for title, scale, projection symbol
  and dimensions). Section C Q24 isometric scale (4) + isometric projection of a solid or combination of solids (9) = 13; Q25 machine-part
  drawing (thread profile OR bolt/nut) 8 marks with A/B choice. FORMAT MAPPING: Q23-Q25 are instrument drawings on a drawing sheet
  (orthographic, sectional and isometric views to scale), not text answers; modelled as long, but they need a drawing-response type
  (uploaded sheet or CAD file) with a rubric-based marking scheme (views, sectioning, dimensions, title block). Case sets are modelled as
  case-based items of 4 marks whose children are 1-mark MCQs.
