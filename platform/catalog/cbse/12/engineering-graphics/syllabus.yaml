# CBSE Class 12 Engineering Graphics (046), 2026-27. Theory (drawing paper) 70 + practical 30; the practical is listed with board_assessed: false.
subject_id: cbse-12-engineering-graphics
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-engineering-graphics-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - cbse-sqp-xii-2026-27
exam_notes: >-
  Theory 70 marks (3 hours, a drawing paper; first-angle projection, SP 46:2003) + practical 30 (3 hours). Unit I Isometric projections of
  solids 25, Unit II Machine drawing 45. Paper (2026-27 SQP): Section A 14 MCQs x 1; Section B two case-based sets of four 1-mark MCQs
  (Q15-18, Q19-22) and one assembly OR dis-assembly drawing of 27 marks (Q23 A/B: half-sectional front view, top/side view, title, scale,
  projection symbol and six dimensions); Section C an isometric projection of 13 marks (isometric scale + solid/combination of solids) and a
  machine-part drawing of 8 marks with A/B choice (thread profile or bolt/nut/washer). Internal choice in Unit II per syllabus (between two
  machine parts; between assembly and dis-assembly). Single board exam (February-March 2027).
units:
  - name: "Unit I: Isometric Projections of Solids"
    marks: 25
  - name: "Unit II: Machine Drawing"
    marks: 45
  - name: Practical
    marks: 30
