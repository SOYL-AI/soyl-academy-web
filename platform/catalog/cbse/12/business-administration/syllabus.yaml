    topics:
      - id: cbse-12-business-administration-ch07-t01
        title: "Nature of management: art, science and profession"
        learning_outcomes:
          - Evaluate management as an art, a science and a profession
      - id: cbse-12-business-administration-ch07-t02
        title: Approaches to management
        learning_outcomes:
          - Explain the classical, scientific and neo-classical approaches to management
      - id: cbse-12-business-administration-ch07-t03
        title: Taylor's scientific management
        learning_outcomes:
          - Explain Taylor's principles and techniques of scientific management
      - id: cbse-12-business-administration-ch07-t04
        title: Fayol's principles of management
        learning_outcomes:
          - Explain Fayol's 14 principles with workplace examples
    removed_topics: []
    literature_texts: []
