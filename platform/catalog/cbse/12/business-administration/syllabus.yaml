  - id: cbse-12-business-administration-ch09
    number: 9
    title: Communication
    unit: "Part B Unit 4: Communication"
    topics:
      - id: cbse-12-business-administration-ch09-t01
        title: Meaning, methods and significance of communication
        learning_outcomes:
          - Define communication, its methods and significance in organisations
      - id: cbse-12-business-administration-ch09-t02
        title: Types of communication
        learning_outcomes:
          - Distinguish verbal and non-verbal, formal and informal and visual communication
      - id: cbse-12-business-administration-ch09-t03
        title: Effective communication and its barriers
        learning_outcomes:
          - Describe features of effective communication and language, emotional, physical, systemic and attitudinal barriers
    removed_topics: []
    literature_texts: []
  - id: cbse-12-business-administration-ch10
