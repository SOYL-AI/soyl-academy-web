      - id: cbse-12-business-administration-ch12-t02
        title: Kinds of social responsibility
        learning_outcomes:
          - Distinguish economic, legal, ethical and philanthropic responsibilities
      - id: cbse-12-business-administration-ch12-t03
        title: Responsibility towards stakeholders
        learning_outcomes:
          - Explain social responsibility towards employees, customers, investors, suppliers, government and society
      - id: cbse-12-business-administration-ch12-t04
        title: Corporate social responsibility
        learning_outcomes:
          - Explain CSR and its potential business benefits
