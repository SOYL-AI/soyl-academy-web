    topics:
      - id: cbse-12-business-administration-ch11-t01
        title: Meaning and importance of leadership
        learning_outcomes:
          - Define leadership and explain its significance
      - id: cbse-12-business-administration-ch11-t02
        title: Types of leaders and qualities of a good leader
        learning_outcomes:
          - Classify leaders and list qualities of a good leader
      - id: cbse-12-business-administration-ch11-t03
        title: Leadership styles
        learning_outcomes:
          - Compare autocratic, democratic and laissez-faire leadership styles
