    topics:
      - id: cbse-12-business-administration-ch13-t01
        title: Meaning and importance of information technology
        learning_outcomes:
          - Explain IT and its relevance to business today
      - id: cbse-12-business-administration-ch13-t02
        title: IT in functional areas of business
        learning_outcomes:
          - Describe uses of IT in marketing, finance, production and human resources
      - id: cbse-12-business-administration-ch13-t03
        title: "E-business: meaning, scope, merits and demerits"
        learning_outcomes:
          - Explain the scope of e-business and evaluate its merits and demerits
