    title: Functions of Management
    unit: "Part B Unit 3: Functions of Management"
    topics:
      - id: cbse-12-business-administration-ch08-t01
        title: Planning
        learning_outcomes:
          - Explain the meaning, importance, types and process of planning
      - id: cbse-12-business-administration-ch08-t02
        title: Organising
        learning_outcomes:
          - Explain organising as a process and as a structure and types of organisation
      - id: cbse-12-business-administration-ch08-t03
        title: Staffing
        learning_outcomes:
          - Explain the meaning, importance and process of staffing
      - id: cbse-12-business-administration-ch08-t04
        title: Directing
        learning_outcomes:
          - Explain the meaning, importance and elements of directing
      - id: cbse-12-business-administration-ch08-t05
        title: Controlling and its relationship with planning
        learning_outcomes:
          - Explain controlling and how planning and controlling are related
      - id: cbse-12-business-administration-ch08-t06
        title: "Coordination: the essence of management"
        learning_outcomes:
          - Explain why coordination is the essence of management
