    unit: "Part B Unit 5: Motivation"
    topics:
      - id: cbse-12-business-administration-ch10-t01
        title: Meaning, characteristics and significance of motivation
        learning_outcomes:
          - Explain motivation and its importance
      - id: cbse-12-business-administration-ch10-t02
        title: Content theories of motivation
        learning_outcomes:
          - Explain Maslow's need hierarchy, Herzberg's two-factor and ERG theories
      - id: cbse-12-business-administration-ch10-t03
        title: Process and reinforcement theories
        learning_outcomes:
          - Explain expectancy, equity and reinforcement theories
      - id: cbse-12-business-administration-ch10-t04
        title: "Behavioural theories: Theory X, Y and Z"
        learning_outcomes:
          - Compare McGregor's Theory X and Y and Ouchi's Theory Z
      - id: cbse-12-business-administration-ch10-t05
        title: Methods of motivation
        learning_outcomes:
          - Distinguish financial and non-financial incentives, job enlargement and job enrichment, and motivation and inspiration
