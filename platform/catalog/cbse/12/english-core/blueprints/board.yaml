notes: |-
  13 questions in three sections: A Reading 22 (Q1 unseen discursive passage 12, Q2 factual/data passage with visual input 10),
  B Creative Writing 18 (Q3 notice up to 50 words 4, Q4 formal/informal invitation or reply 4, Q5 letter 120-150 words 5, Q6 article/report
  120-150 words 5; each A or B), C Literature 40 (Q7 Flamingo poetry extract 6, Q8 Vistas prose extract 4, Q9 Flamingo prose extract 6 -
  each choose one of two extracts; Q10 any 5 of 6 short answers 40-50 words; Q11 any 2 of 3 (Vistas) 40-50 words; Q12 and Q13 one of two
  long answers 120-150 words, Flamingo and Vistas). The design table lists competencies per section without percentages, so mark_shares
  is empty. FORMAT MAPPING: writing tasks (notice, invitation, letter, article, report) have no QuestionType; mapped to long (4-5 marks,
  with format/content/expression rubric in the marking scheme). Reading passages are case-based (MCQ, short-answer and vocabulary
  children); literature extracts are source-based.
