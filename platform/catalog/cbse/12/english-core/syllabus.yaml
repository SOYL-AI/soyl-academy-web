    number: 1
    title: "Reading Comprehension: Unseen Passages"
    unit: "Section A: Reading Skills"
    topics:
      - id: cbse-12-english-core-ch01-t01
        title: "Unseen passage: factual, descriptive or literary"
        learning_outcomes:
          - Answer comprehension, inference and vocabulary questions on an unseen passage
          - Write 40-50 word answers that interpret and evaluate the writer's view
      - id: cbse-12-english-core-ch01-t02
        title: Case-based factual passage with verbal/visual input
        learning_outcomes:
          - Interpret statistical data and charts alongside text and draw evidence-based conclusions
