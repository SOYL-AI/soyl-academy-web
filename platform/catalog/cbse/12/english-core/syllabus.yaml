    number: 2
    title: Creative Writing Skills
    unit: "Section B: Creative Writing Skills"
    topics:
      - id: cbse-12-english-core-ch02-t01
        title: Notice writing (up to 50 words)
        learning_outcomes:
          - Write a notice with correct format, essential details and concise language
      - id: cbse-12-english-core-ch02-t02
        title: Formal and informal invitations and replies (up to 50 words)
        learning_outcomes:
          - Draft an invitation and an acceptance/refusal in the appropriate register and format
      - id: cbse-12-english-core-ch02-t03
        title: "Letter writing: job application with resume; letter to the editor"
        learning_outcomes:
          - Write a 120-150 word letter with correct format, organisation and tone
          - Prepare a resume suited to a stated job
      - id: cbse-12-english-core-ch02-t04
        title: Article and report writing (120-150 words)
        learning_outcomes:
          - Write a descriptive or analytical article with a title and logical organisation
          - Write a report of an event with headline, byline and factual sequence
