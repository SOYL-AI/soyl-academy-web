# CBSE Class 12 English Core (301), 2026-27. Texts as listed in the CBSE 2026-27 syllabus (Flamingo, Vistas). Titles and authors only.
subject_id: cbse-12-english-core
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-english-core-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - cbse-sqp-xii-2026-27
  - cbse-sqp-notification-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (listening 5, speaking 5, project 10). Section A reading 22 (unseen passage 12 +
  case-based factual passage with visual input 10; combined 700-750 words). Section B creative writing 18 (notice up to 50 words 4;
  formal/informal invitation and reply up to 50 words 4; letter — job application with resume or letter to the editor, 120-150 words 5;
  article or report 120-150 words 5). Section C literature 40 (Flamingo poetry extract 6, Vistas prose extract 4, Flamingo prose extract 6,
  Flamingo short answers 5x2, Vistas short answers 2x2, one long answer each from Flamingo and Vistas 5+5, 120-150 words). Single board exam
  (February-March 2027).
units:
  - name: "Section A: Reading Skills"
    marks: 22
  - name: "Section B: Creative Writing Skills"
    marks: 18
  - name: "Section C: Literature – Flamingo"
    marks: null
  - name: "Section C: Supplementary Reader – Vistas"
    marks: null
chapters:
