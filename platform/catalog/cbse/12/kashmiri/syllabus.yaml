# CBSE Class 12 Kashmiri (197), 2026-27. Sections, grammar items, writing tasks and the six prescribed lessons
# (printed in Kashmiri by CBSE) from the CBSE 2026-27 Kashmiri XI-XII syllabus, Class XII. Prescribed book: Kashir Kitab
# (2008), J&K Board of School Education, Class XII. CBSE prints no marks per section. Lesson titles are transcribed from
# the CBSE scan and other labels are SOYL's; both need review by a Kashmiri speaker. Titles only; no text reproduced.
subject_id: cbse-12-kashmiri
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-kashmiri-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Board theory 80 marks (3 hours) + internal assessment 20 (periodic tests on textual questions, grammar and vocabulary 10; notebook 5;
  subject enrichment - listening to short narrations and speaking through elocution, conversation, recitation and narration 5). Unseen
  reading: two of four unseen paragraphs of about 200 words, five MCQs each. Grammar: usage of words, conjunctions, adjectives. Main course
  book: seen prose and poem passages of 100-150 words with five MCQs each; poets and writers, poem summaries, fill in the blanks, textual
  questions, book work, genres of poetry. Creative writing: essay, report, story and letter.
