# CBSE Class 12 Bodo (192), 2026-27. Sections, marks, writing tasks, grammar items, prescribed poems (khanthai), prose
# lessons (raithai) with authors and the value-education lessons as printed (in Devanagari) in the CBSE 2026-27 Bodo
# syllabus (Class XII table). Textbook: Sujunai Bijab, Gojousin Gejerari Naithi Bosorni Thakhay (Assam State Text Book Production and Publication Corporation, 2016). Grammar references: Gonang Raokhanthi (Kamal Kumar Brahma),
# Gojou Raokhanthi (Madhuram Boro), Phoraysalini Raokhanthi (Swarna Prabha Chainary). Lesson and author names are copied from
# CBSE; title_en values are SOYL romanisations, and the Bodo labels of the reading/writing/grammar chapters and the English
# glosses of grammar terms marked "to be verified" need a Bodo speaker's check. No text is reproduced (CONTEXT §8).
subject_id: cbse-12-bodo
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-bodo-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20. Section A reading comprehension 10 (an unseen literary or other
  relevant passage of about 150 words and an unseen poem of 15-20 lines); Section B writing 10; Section C grammar 10;
  Section D literature 40 (prescribed raithai/prose lessons and khanthai/poems); Adolescence Education and Value
  Education 10 (these lessons take the place of a supplementary reader). Internal assessment 20: periodic test/term
  evaluation 10, understanding and writing 5, assignment 5.
units:
  - name: 'Section A: Reading Comprehension'
    marks: 10
  - name: 'Section B: Writing Skills'
    marks: 10
  - name: 'Section C: Grammar'
    marks: 10
  - name: 'Section D: Literature'
    marks: 40
  - name: Adolescence Education and Value Education
    marks: 10
chapters:
  - id: cbse-12-bodo-ch01
    number: 1
    title: आयदा फरायनाय आरो बुजिनाय
    title_en: Reading comprehension (unseen passages)
    unit: 'Section A: Reading Comprehension'
    topics:
      - id: cbse-12-bodo-ch01-t01
        title: थुनलाइयारि आयदा एबा जायखिजाया जुक्तिगोनां आयदा
        title_en: Literary or other relevant unseen passage (about 150 words)
        learning_outcomes:
          - Read an unseen Bodo passage of about 150 words and answer questions on its content, inference and vocabulary
      - id: cbse-12-bodo-ch01-t02
        title: 15-20 सारिनि दोंसे खन्थाइ
        title_en: Unseen poem of 15-20 lines
        learning_outcomes:
          - Read an unseen Bodo poem of 15-20 lines and answer questions on its meaning, mood and message
    removed_topics: []
    literature_texts: []
  - id: cbse-12-bodo-ch02
    number: 2
    title: लिरनाय
    title_en: Writing skills
    unit: 'Section B: Writing Skills'
    topics:
      - id: cbse-12-bodo-ch02-t01
        title: सोरनोबा माबा मोनसे मिथिहोहरनो थाखाय रादाब मोनसे जथाइनाय
        title_en: News report to inform people about an event
        learning_outcomes:
          - Write a news report in Bodo giving the key facts of an event
      - id: cbse-12-bodo-ch02-t02
        title: मिथिसार बिलाइ लिरनाय एबा मोनसे जुक्तिनि मददाव एबा बेरेखायै बिबुंथि जथाइनाय
        title_en: Notice writing, or a description from given points
        learning_outcomes:
          - Write a notice, or a short description developed from the given points
      - id: cbse-12-bodo-ch02-t03
        title: बबेबा मोनसे रादाब बिलाइनि सुजुगिरिनिसिम गांसे लाइजाम लिरनाय
        title_en: Letter to a newspaper editor or authority about a local problem
        learning_outcomes:
          - Write a formal letter about a problem in a village, town or area and request action
      - id: cbse-12-bodo-ch02-t04
        title: जायखिजाया मोनसे बाथ्राफावखौ बेखेवना लिरनाय
        title_en: Explanation of a given passage
        learning_outcomes:
          - Explain a given line or passage with reference to the context
    removed_topics: []
    literature_texts: []
