notes: >-
  Pattern from CBSE's Class XII Artificial Intelligence SQP 2025-26 (CBSE notification 132/2026: no change in question-paper design for
  2026-27). Theory 50 marks; practical 50 marks is school/external practical, not modelled.

  Employability Skills questions (sections A-ES, B-ES) are drawn only from Part A chapters; sections A and B only from Part B chapters.

  Section A objective parts mix MCQ, fill-in-the-blank, true/false, one-word and match items within one "answer any n of m" question; all
  are mapped to mcq (the dominant form) - the assembler may substitute fill-blank/true-false/match at 1 mark.

  Python/ML output and computation questions (e.g. evaluation metrics, data-storytelling) are constructed answers; mapped to short/long.
  Note: the existing M0 syllabus file lists Level-II Employability Skills topics; Class XII is Level IV (active listening,
  spreadsheets/presentations, personality, entrepreneurial competencies, green jobs).
