# CBSE Class 12 Multi-Media (821), 2026-27 skill subject. Built from the CBSE 2026-27 skill curriculum; theory component only (practical work is listed in exam_notes).
subject_id: cbse-12-multi-media
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-multimedia-821-2026-27
  - cbse-skill-curriculum-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - cbse-sqp-xii-2026-27
exam_notes: >-
  Total 100 = theory 50 + practical 50 (practical examination 15, written test 10, viva 10, project/field visit/practical file/portfolio 10,
  viva on project 5). Part A Employability Skills 10 marks, Part B subject-specific skills 40 marks. Theory paper 50 marks, 2 hours: Section
  A objective 24 (Employability Skills 4 of 6 + subject 4 questions, any 5 of 6 each); Section B subjective 26 (Employability Skills 3 of 5
  x 2; subject 4 of 6 x 2, 3 of 5 x 4). Single board exam (February-March 2027).
