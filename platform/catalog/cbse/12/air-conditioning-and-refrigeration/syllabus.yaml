# CBSE Class 12 Air-Conditioning and Refrigeration (827), 2026-27 skill subject. Built from the CBSE 2026-27 skill curriculum; theory component only (practical work is listed in exam_notes).
subject_id: cbse-12-air-conditioning-and-refrigeration
