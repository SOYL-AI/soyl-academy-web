exam_notes: >-
  Total 100 = theory 60 + practical 40 (practical examination 15, written test 10, viva 5, project/field visit/practical file/portfolio 10).
  Part A Employability Skills 10 marks, Part B subject-specific skills 50 marks. Theory paper 60 marks, 3 hours: Section A objective 30
  (Employability Skills 4 of 6 + subject 26 from 5 questions with internal choice); Section B subjective 30 (Employability Skills 3 of 5 x
  2; subject 3 of 5 x 2, 2 of 3 x 3, 3 of 5 x 4). Single board exam (February-March 2027). The 2026-27 syllabus marks many topics "to be
  assessed through practical only" (all of Units 1, 4 and 6, air distribution, refrigerant controls, evaporators, ice-cream manufacture);
  these are board_assessed: false even though the units carry theory marks, so the theory paper effectively draws on heat transfer,
  condensers, refrigerants and commercial applications. Inconsistency recorded for review.
