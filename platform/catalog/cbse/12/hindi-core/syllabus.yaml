exam_notes: >-
  सैद्धांतिक 80 अंक (3 घंटे) + आंतरिक 20 (श्रवण तथा वाचन 10, परियोजना 10)। खंड क अपठित बोध 18 (गद्यांश ~250 शब्द 10, पद्यांश ~100 शब्द 8);
  खंड ख अभिव्यक्ति और माध्यम (पाठ 3, 4, 5, 11, 12, 13) 22 (रचनात्मक लेखन ~120 शब्द 6; 2x4 लघु ~40 शब्द और 4x2 ~80 शब्द); खंड ग आरोह-वितान 40
  (काव्यांश बहुविकल्पी 5, काव्य खंड 3x2 + 2x2, गद्यांश बहुविकल्पी 5, गद्य खंड 3x2 + 2x2, वितान 5x2)। Single board exam (February-March
  2027).
