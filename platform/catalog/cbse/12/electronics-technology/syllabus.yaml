chapters:
  - id: cbse-12-electronics-technology-ch01
    number: 1
    title: "Employability Skills: Communication Skills – IV"
    unit: "Part A Unit 1: Communication Skills – IV"
    topics:
      - id: cbse-12-electronics-technology-ch01-t01
        title: Active listening at the workplace
        learning_outcomes:
          - Explain why active listening matters at work and list the barriers to it
          - Describe the steps of active listening and apply them in a role play
      - id: cbse-12-electronics-technology-ch01-t02
        title: Sentences and phrases; kinds and parts of a sentence
        learning_outcomes:
          - Distinguish a phrase from a sentence and classify sentences as declarative, interrogative, imperative or exclamatory
          - Identify the subject, predicate and object in a sentence
      - id: cbse-12-electronics-technology-ch01-t03
        title: Parts of speech and articles
        learning_outcomes:
          - Identify nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections in workplace sentences
          - Use the articles a, an and the correctly
      - id: cbse-12-electronics-technology-ch01-t04
        title: Constructing a paragraph
        learning_outcomes:
          - Write a well-organised paragraph with a topic sentence, supporting sentences and a conclusion on a subject-related theme
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electronics-technology-ch02
    number: 2
    title: "Employability Skills: Self-Management Skills – IV"
    unit: "Part A Unit 2: Self-Management Skills – IV"
    topics:
      - id: cbse-12-electronics-technology-ch02-t01
        title: Motivation and self-motivation
        learning_outcomes:
          - Explain internal and external motivation and list personal needs and desires that drive motivation
      - id: cbse-12-electronics-technology-ch02-t02
        title: Sources of motivation and a positive outlook
        learning_outcomes:
          - Identify sources of inspiration (people, books, music, activities) and techniques to stay positive and focused on goals
      - id: cbse-12-electronics-technology-ch02-t03
        title: "Personality: meaning, influence and traits"
        learning_outcomes:
          - Define personality and explain how it influences others at work
          - Describe the five basic personality traits (openness, conscientiousness, extraversion, agreeableness, neuroticism)
      - id: cbse-12-electronics-technology-ch02-t04
        title: Personality disorders and how to overcome them
        learning_outcomes:
          - >-
            Describe common personality disorders (paranoid, antisocial, schizoid, borderline, narcissistic, avoidant, dependent, obsessive)
            and the clusters they belong to
          - Suggest steps to seek help and overcome personality problems
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electronics-technology-ch03
    number: 3
    title: "Employability Skills: ICT Skills – IV"
    unit: "Part A Unit 3: ICT Skills – IV"
    topics:
      - id: cbse-12-electronics-technology-ch03-t01
        title: "Spreadsheet basics: workbook, worksheet and data entry"
        learning_outcomes:
          - Name common spreadsheet applications and create, open and save a workbook
          - Enter text and numbers, resize fonts and apply styles
      - id: cbse-12-electronics-technology-ch03-t02
        title: Editing and organising spreadsheet data
        learning_outcomes:
          - Copy and move cell data, sort data and apply filters to a table
      - id: cbse-12-electronics-technology-ch03-t03
        title: Formulas, functions, protection and printing
        learning_outcomes:
          - Use elementary formulas and functions such as SUM, AVERAGE, MIN and MAX
          - Protect a spreadsheet with a password, print it and save it in different formats
      - id: cbse-12-electronics-technology-ch03-t04
        title: Creating a presentation
        learning_outcomes:
          - Name presentation software packages and list features of a good presentation
          - Create a presentation and add or delete slides
      - id: cbse-12-electronics-technology-ch03-t05
        title: Editing and formatting presentations
        learning_outcomes:
          - Enter, edit and format text, insert clipart and images, choose slide layouts, and save and print a presentation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electronics-technology-ch04
    number: 4
    title: "Employability Skills: Entrepreneurial Skills – IV"
    unit: "Part A Unit 4: Entrepreneurial Skills – IV"
    topics:
      - id: cbse-12-electronics-technology-ch04-t01
        title: Barriers to becoming an entrepreneur
        learning_outcomes:
          - Classify barriers to entrepreneurship (environmental, personal, financial, social) with examples and ways to overcome them
      - id: cbse-12-electronics-technology-ch04-t02
        title: Behavioural and entrepreneurial competencies
        learning_outcomes:
          - >-
            Describe competencies such as adaptability, decisiveness, initiative, perseverance, interpersonal and organisational skills,
            stress management and valuing service and diversity
      - id: cbse-12-electronics-technology-ch04-t03
        title: Entrepreneurial competencies in particular
        learning_outcomes:
          - >-
            Explain self-confidence, seeing and acting on opportunities, concern for quality, goal setting, risk taking, problem solving,
            systematic planning, information seeking, persistence, negotiating and team building
      - id: cbse-12-electronics-technology-ch04-t04
        title: Self-assessment of entrepreneurial behaviour
        learning_outcomes:
          - Rate oneself on behavioural competencies and prepare a personal competency profile
          - Relate competencies to stories of successful Indian entrepreneurs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electronics-technology-ch05
    number: 5
    title: "Employability Skills: Green Skills – IV"
    unit: "Part A Unit 5: Green Skills – IV"
    topics:
      - id: cbse-12-electronics-technology-ch05-t01
        title: Green jobs in homes, gardening, transport and energy conservation
        learning_outcomes:
          - Explain the role of green jobs in toxin-free homes, organic gardening, public transport and energy conservation
      - id: cbse-12-electronics-technology-ch05-t02
        title: Green jobs in water, renewable energy and waste
        learning_outcomes:
          - Describe green jobs in water conservation, solar and wind power, and waste reduction, reuse and recycling
      - id: cbse-12-electronics-technology-ch05-t03
        title: Green jobs in tourism, construction and appropriate technology
        learning_outcomes:
          - Give examples of green jobs in green tourism, building and construction and appropriate technology
      - id: cbse-12-electronics-technology-ch05-t04
        title: Role of green jobs in protecting the environment
        learning_outcomes:
          - >-
            Explain how green jobs improve energy and raw-material use, limit greenhouse-gas emissions, minimise waste and pollution,
            restore ecosystems and support adaptation to climate change
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electronics-technology-ch06
    number: 6
    title: Basic Occupational Safety and Precautions
    unit: "Part B Unit 1: Basic Occupational Safety and Precautions"
    topics:
      - id: cbse-12-electronics-technology-ch06-t01
        title: Workshop safety rules and safety signs
        learning_outcomes:
          - State general workshop safety rules and identify safety signs and personal protective equipment
      - id: cbse-12-electronics-technology-ch06-t02
        title: Electrical safety and electric shock
        learning_outcomes:
          - Explain causes of electric shock and precautions while working on electronic equipment
      - id: cbse-12-electronics-technology-ch06-t03
        title: First aid and rescue
        learning_outcomes:
          - Describe first aid for shock and burns and safe rescue from a live conductor
      - id: cbse-12-electronics-technology-ch06-t04
        title: Fire safety and handling of components
        learning_outcomes:
          - Describe fire-safety measures and safe handling of tools, components and ESD-sensitive devices
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electronics-technology-ch07
    number: 7
    title: Microphones and Loudspeakers
    unit: "Part B Unit 2: Microphones and Loudspeakers"
    topics:
      - id: cbse-12-electronics-technology-ch07-t01
        title: Types of microphones
        learning_outcomes:
          - >-
            Explain the construction, working and frequency response of carbon, variable-reactance, capacitor, piezo-electric and
            moving-coil microphones
      - id: cbse-12-electronics-technology-ch07-t02
        title: "Sound: frequency range, intensity and dynamic range"
        learning_outcomes:
          - Relate frequency ranges of musical instruments to intensity and dynamic range
      - id: cbse-12-electronics-technology-ch07-t03
        title: Moving-coil loudspeaker
        learning_outcomes:
          - Explain the construction, impedance and power rating of a moving-coil loudspeaker
      - id: cbse-12-electronics-technology-ch07-t04
        title: Woofer, tweeter, squawker and enclosures
        learning_outcomes:
          - Compare woofers, tweeters and squawkers and explain loudspeaker enclosures
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electronics-technology-ch08
    number: 8
    title: Recorders
    unit: "Part B Unit 3: Recorders"
    topics:
      - id: cbse-12-electronics-technology-ch08-t01
        title: Analog and digital sound recording; disk recording
        learning_outcomes:
          - Distinguish analog and digital recording and explain disk recording and reproduction with a block diagram
      - id: cbse-12-electronics-technology-ch08-t02
        title: Magnetic recording and the tape recorder
        learning_outcomes:
          - Explain magnetic recording and playback, the need for bias and the tape recorder block diagram
      - id: cbse-12-electronics-technology-ch08-t03
        title: Optical recording and CD/DVD players
        learning_outcomes:
          - Explain optical recording, CD/DVD manufacture and the CD/DVD player system with advantages and disadvantages
      - id: cbse-12-electronics-technology-ch08-t04
        title: Fault finding in recorders
        learning_outcomes:
          - Apply steps of fault finding and analysis to recorders
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electronics-technology-ch09
    number: 9
    title: TV System
    unit: "Part B Unit 4: TV System"
    topics:
      - id: cbse-12-electronics-technology-ch09-t01
        title: TV transmitter and receiver
        learning_outcomes:
          - Explain the TV transmitter and receiver with block diagrams
      - id: cbse-12-electronics-technology-ch09-t02
        title: TV receiver stages
        learning_outcomes:
          - Describe the tuner, video IF, sound stage, picture tube, sync and deflection circuits and remote control
      - id: cbse-12-electronics-technology-ch09-t03
        title: Bandwidth, blanking, sync pulses and modulation; colour TV
        learning_outcomes:
          - Explain bandwidth, blanking and synchronising pulses, modulation scheme and colour transmission
      - id: cbse-12-electronics-technology-ch09-t04
        title: Cable TV systems
        learning_outcomes:
          - Explain head-end processors, trunk and cable distribution and scrambling
      - id: cbse-12-electronics-technology-ch09-t05
        title: LCD, LED and HD TV; fault finding
        learning_outcomes:
          - Introduce LCD, LED and high-definition TV and apply fault-finding steps
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electronics-technology-ch10
    number: 10
    title: Modern Appliances
    unit: "Part B Unit 5: Modern Appliances"
    topics:
      - id: cbse-12-electronics-technology-ch10-t01
        title: Microwave oven
        learning_outcomes:
          - Explain the working principle and block diagram of a microwave oven
      - id: cbse-12-electronics-technology-ch10-t02
        title: Telephone and fax machine
        learning_outcomes:
          - Explain the working of a telephone and a fax machine with block diagrams
      - id: cbse-12-electronics-technology-ch10-t03
        title: Printers and scanners
        learning_outcomes:
          - Explain the working of printers and scanners with block diagrams
      - id: cbse-12-electronics-technology-ch10-t04
        title: Fault finding in modern appliances
        learning_outcomes:
          - Apply steps of fault finding and analysis to modern appliances
    removed_topics: []
    literature_texts: []
