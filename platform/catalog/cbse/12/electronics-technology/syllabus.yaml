# CBSE Class 12 Electronics Technology (820), 2026-27 skill subject. Built from the CBSE 2026-27 skill curriculum; theory component only (practical work is listed in exam_notes).
subject_id: cbse-12-electronics-technology
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-electronics-820-2026-27
  - cbse-skill-curriculum-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - cbse-sqp-xii-2026-27
exam_notes: >-
  Total 100 = theory 60 + practical 40 (practical examination 15, written test 10, viva 5, project/field visit/practical file/portfolio 10).
  Part A Employability Skills 10 marks, Part B subject-specific skills 50 marks. Theory paper 60 marks, 3 hours: Section A objective 30
  (Employability Skills 4 of 6 + subject 26 from 5 questions with internal choice); Section B subjective 30 (Employability Skills 3 of 5 x
  2; subject 3 of 5 x 2, 2 of 3 x 3, 3 of 5 x 4). Single board exam (February-March 2027). The 2026-27 syllabus lists Unit 1 (Basic
  Occupational Safety and Precautions, 15 marks) by title only; its topics here follow standard workshop-safety content.
