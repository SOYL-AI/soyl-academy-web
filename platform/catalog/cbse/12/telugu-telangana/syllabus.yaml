# CBSE Class 12 Telugu (Telangana) (189), 2026-27. Every prescribed lesson (with its number in the book), the
# poets for the history of literature, grammar items, writing tasks and marks weightage, as printed in Telugu in the CBSE
# 2026-27 Telugu (Telangana) Class XII curriculum design. Books: Shubhodayam (main course book) and Yatracharana
# (non-detailed), Telugu Akademi, Government of Telangana, 2021; reference books Andhra Vangmaya Charitra (D. V.
# Avadhani) and Telugu Sahitya Charitra (Dwa. Na. Sastry). Unlisted book lessons are not prescribed. Titles only; no text
# is reproduced (CONTEXT §8).
subject_id: cbse-12-telugu-telangana
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-telugu-telangana-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Board theory 80 marks (3 hours) + internal assessment 20 (periodic tests - class, slip, pre-mid, mid and post-mid tests 5; portfolio -
  classwork, homework, oral tests, group work, leadership 5; subject enrichment - listening, speaking, debates, language use, compositions
  5; multiple assessment - art-integrated work, projects, role play, charts, PPTs, quizzes, discussions 5). Weightage printed by CBSE (IC =
  internal choice): poetry - Sri Krishna Rayabaram 2 + 10 (IC), Bhagiratha Prayatnam 6, Kokila O Kokila 6 + 2 (IC); prose - Mitralabham 2 +
  4, Telangana Sahiti Vikasam 2 + 4, Srujanasheelata 3; non-detailed travelogue 8; history of literature 10; prosody 4; figures of speech 4;
  creative writing - dialogue 4, translation 4, unseen and seen passages 10. Long-answer questions are set as seen prose passages from the
  prose lessons and seen verses (with word meanings) from the poetry lessons.
