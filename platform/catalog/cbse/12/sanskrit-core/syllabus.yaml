# CBSE Class 12 Sanskrit Core (322), 2026-27. Sections, marks, grammar items, the prescribed lessons of Bhaswati Part 2
# (NCERT) and the chapters of Sanskrit Sahitya Parichay as printed in the CBSE 2026-27 Sanskrit (Kendrikam) XI-XII
# syllabus (Class XII pages). Lesson 7 of Bhaswati Part 2 is not prescribed. Source attributions of lessons are given only
# where well established and are informational. No text is reproduced (CONTEXT §8).
subject_id: cbse-12-sanskrit-core
academic_year: "2026-27"
source_status: verified
sources:
