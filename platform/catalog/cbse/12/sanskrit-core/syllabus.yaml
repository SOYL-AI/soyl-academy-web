exam_notes: >-
  वार्षिकं मूल्याङ्कनम् 80 अङ्काः (3 hours) + आन्तरिकमूल्याङ्कनम् 20 (periodic test 5, multiple assessment 5, portfolio 5,
  listening-speaking and writing enrichment activities 5). Section A unseen passage 10 (100-120 words: one-word 2x1, full-sentence
  2x2, title 1, language tasks 3x1 MCQ). Section B creative writing 15 (letter or application by filling blanks 10x1/2;
  picture-based sentences or paragraph of 25-30 words 5; short-story completion 10x1/2 or one side of a dialogue 5x1). Section C
  applied grammar 20 (lesson-based sandhi 4, lesson-based samasa 4, pratyaya 4 MCQ, upapada-vibhakti 4 MCQ, vachya in lat and lrit
  4). Section D(i) textbook comprehension 25 (prose, verse and drama extracts 5 each; bhavartha gap-filling or choosing the right
  bhavartha 3; anvaya gap-filling 3; matching sentence parts or contextual meanings 4). Section D(ii) history of Sanskrit
  literature 10 (sources and authors of Bhaswati lessons 3; mahakavya, gadyakavya and champukavya 3; main features of natya 4).
  Books: Bhaswati Part 2 (NCERT), Vyakaranasaurabham, Rachananuvadakaumudi (Kapildev Dwivedi), Sanskrit Sahitya Parichay and
  Vedaparijat (NCERT).
