exam_notes: >-
  Theory 80 marks (3 hours) + project 20 (project 15, viva 5). Indian Society 40 (Demographic Structure 10, Social Institutions 10, Social
  Inequality and Exclusion 10, Cultural Diversity 10); Social Change and Development 40 (Structural Change 5, Cultural Change 5, Rural
  Society 10, Industrial Society 10, Social Movements 10). Units 1 and 7 are non-evaluative. Single board exam (February-March 2027).
