exam_notes: >-
  Total 100 = theory 50 + practical 50 (practical file 15, practical examination and viva 20, project/field visit/portfolio and viva 15).
  Part A Employability Skills 10 marks, Part B subject-specific skills 40 marks. Theory paper 50 marks, 2 hours: Section A objective 24
  (Employability Skills 4 of 6 + subject 4 questions, any 5 of 6 each); Section B subjective 26 (Employability Skills 3 of 5 x 2; subject 4
  of 6 x 2, 3 of 5 x 4). Single board exam (February-March 2027). UNVERIFIED topics: the 2026-27 CBSE document lists unit titles and marks
  only (5 marks each); topics are inferred from the titles and the design-thinking process.
