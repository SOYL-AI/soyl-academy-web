      - id: cbse-12-design-thinking-and-innovation-ch10-t02
        title: "Empathy tools: interviews, empathy maps and personas"
        learning_outcomes:
          - Use interviews, empathy maps and personas to understand users
      - id: cbse-12-design-thinking-and-innovation-ch10-t03
