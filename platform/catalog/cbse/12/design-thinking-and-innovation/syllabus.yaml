    topics:
      - id: cbse-12-design-thinking-and-innovation-ch07-t01
        title: Understanding personal space and user needs
        learning_outcomes:
          - Identify user needs in personal spaces such as a study corner or bedroom
      - id: cbse-12-design-thinking-and-innovation-ch07-t02
        title: Ergonomics and anthropometry
        learning_outcomes:
          - Apply basic ergonomics and body measurements to personal products and spaces
      - id: cbse-12-design-thinking-and-innovation-ch07-t03
        title: Designing a personal-space solution
        learning_outcomes:
          - Develop and evaluate a design for a personal-space problem
