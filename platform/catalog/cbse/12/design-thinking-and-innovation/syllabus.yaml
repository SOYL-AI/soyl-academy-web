    topics:
      - id: cbse-12-design-thinking-and-innovation-ch08-t01
        title: Social spaces and shared needs
        learning_outcomes:
          - Identify needs of groups in shared spaces such as classrooms and community centres
      - id: cbse-12-design-thinking-and-innovation-ch08-t02
        title: Inclusive and universal design
        learning_outcomes:
          - Apply principles of inclusive and universal design
      - id: cbse-12-design-thinking-and-innovation-ch08-t03
        title: Designing for a social space
        learning_outcomes:
          - Develop a design that improves a shared social space
    removed_topics: []
    literature_texts: []
  - id: cbse-12-design-thinking-and-innovation-ch09
    number: 9
    title: Design for Public Space
    unit: "Part B Unit 4: Design for Public Space"
    topics:
      - id: cbse-12-design-thinking-and-innovation-ch09-t01
        title: Public spaces and stakeholders
        learning_outcomes:
          - Identify stakeholders and problems in public spaces such as parks, bus stops and markets
      - id: cbse-12-design-thinking-and-innovation-ch09-t02
        title: Safety, accessibility and sustainability
        learning_outcomes:
          - Evaluate public-space designs for safety, accessibility and sustainability
      - id: cbse-12-design-thinking-and-innovation-ch09-t03
        title: Designing for a public space
        learning_outcomes:
          - Propose a design intervention for a public space
