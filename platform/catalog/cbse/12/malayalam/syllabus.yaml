# CBSE Class 12 Malayalam (112), 2026-27. Sections, marks, writing and grammar items
# and every prescribed lesson (in Roman transliteration, with its page number in the book, without authors) from the
# CBSE 2026-27 Malayalam XI-XII syllabus, Class XII. Book: Higher Secondary Malayalam Plus Two, 2015 edition (SCERT Kerala, Government of
# Kerala). Malayalam-script titles are SOYL's rendering of CBSE's transliteration. Titles only; no text is reproduced
# (CONTEXT §8).
subject_id: cbse-12-malayalam
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-malayalam-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Board theory 80 marks (3 hours) + internal assessment 20 (pen-paper tests, art-integrated projects, portfolio, subject enrichment).
  Section A Reading 10: one unseen passage, 10 of 12 very short answers. Section B Creative writing 18: essay of about 300 words (one of
  two) 6; letter (application, letter to the editor, commercial correspondence) 6; simple paraphrasing 2; sentence making with idioms and
  proverbs and sentence correction 4x1. Section C Literature (with grammar) 52: 10 MCQs x 2 on prose and poetry; prose 4 of 5 short answers
  x 4; poetry 4 of 5 x 4. 50% competency-based questions; about 33% internal choice.
