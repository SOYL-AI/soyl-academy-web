# CBSE Class 12 Carnatic Music (Vocal) (031), 2026-27. Theory component only; the practical is listed with board_assessed: false.
subject_id: cbse-12-carnatic-music-vocal
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-carnatic-vocal-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - cbse-sqp-xii-2026-27
exam_notes: >-
  Theory 30 marks (2 hours) + practical 50 + internal assessment/project 20. Theory paper (CBSE 2026-27 SQP): Section A 8 MCQs x 1; Section
  B 5 short answers x 2, each with an internal choice; Section C 2 long answers x 6, each with an internal choice (raga lakshana, notation,
  composer or grantha essays). Practical (tambura tuning, Ata tala varnam, kritis with manodharma, post-pallavi items, raga and tala
  knowledge, pallavi) is examined by an external examiner and is marked board_assessed: false here. Single board exam (February-March 2027).
units:
