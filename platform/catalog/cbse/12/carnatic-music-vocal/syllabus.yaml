        title: "Brihaddesi of Matanga: first use of the term raga"
        learning_outcomes:
          - State the period and author of Brihaddesi and its contribution to the concept of raga
      - id: cbse-12-carnatic-music-vocal-ch01-t02
        title: "Svaramelakalanidhi and Raga Vibodha: mela classification"
        learning_outcomes:
          - Explain how Ramamatya and Somanatha grouped ragas under melas
      - id: cbse-12-carnatic-music-vocal-ch01-t03
        title: "Sangita Sampradaya Pradarsini: Subbarama Dikshitar and the Dikshitar tradition"
        learning_outcomes:
          - Describe the content and importance of Sangita Sampradaya Pradarsini
      - id: cbse-12-carnatic-music-vocal-ch01-t04
        title: Sangita Saramrita of Tulaja
        learning_outcomes:
          - Outline the raga lakshanas and other topics discussed in Sangita Saramrita
