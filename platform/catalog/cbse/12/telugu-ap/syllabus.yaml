# CBSE Class 12 Telugu (Andhra Pradesh) (107), 2026-27. Sections, marks, grammar items, writing tasks, every
# prescribed lesson (in Roman transliteration, without authors) and the poets for the history of literature, from the
# CBSE 2026-27 Telugu (A.P.) XI-XII syllabus, Class XII. Books: Intermediate Telugu II year 'Gnanapeetham' text and
# 'Nandini' Telugu upavachakam (Intermediate Vidya Mandali, Andhra Pradesh, June 2019); reference books for the history
# of literature: Andhra Vangmaya Charitra (D. V. Avadhani), Telugu Sahitya Sameeksha Vol. II (G. Nagaiah), Telugu Sahitya
# Charitra (Dwa. Na. Sastry). Telugu-script titles are SOYL's rendering of CBSE's transliteration. Titles only; no text
# is reproduced (CONTEXT §8).
subject_id: cbse-12-telugu-ap
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-telugu-ap-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Board theory 80 marks (3 hours) + internal assessment 20 (periodic tests 10, notebooks 5, subject enrichment - verse recitation, short
  speech, book review or quiz 5). Section A Reading 12: unseen prose passage. Section B Grammar 12: prosody and figures of speech. Section C
  Writing 11: general essay and translation of an English passage into Telugu. Section D Literature and history of Telugu literature 45:
  prose and poetry from the Gnanapeetham text, non-detailed stories from Nandini, and the history of literature from the Prabandha age to
  the modern age.
