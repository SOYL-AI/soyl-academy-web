chapters:
  - id: cbse-12-fashion-studies-ch01
    number: 1
    title: "Employability Skills: Communication Skills – IV"
    unit: "Part A Unit 1: Communication Skills – IV"
    topics:
      - id: cbse-12-fashion-studies-ch01-t01
        title: Active listening at the workplace
        learning_outcomes:
          - Explain why active listening matters at work and list the barriers to it
          - Describe the steps of active listening and apply them in a role play
      - id: cbse-12-fashion-studies-ch01-t02
        title: Sentences and phrases; kinds and parts of a sentence
        learning_outcomes:
          - Distinguish a phrase from a sentence and classify sentences as declarative, interrogative, imperative or exclamatory
          - Identify the subject, predicate and object in a sentence
      - id: cbse-12-fashion-studies-ch01-t03
        title: Parts of speech and articles
        learning_outcomes:
          - Identify nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections in workplace sentences
          - Use the articles a, an and the correctly
      - id: cbse-12-fashion-studies-ch01-t04
        title: Constructing a paragraph
        learning_outcomes:
          - Write a well-organised paragraph with a topic sentence, supporting sentences and a conclusion on a subject-related theme
    removed_topics: []
    literature_texts: []
  - id: cbse-12-fashion-studies-ch02
    number: 2
    title: "Employability Skills: Self-Management Skills – IV"
    unit: "Part A Unit 2: Self-Management Skills – IV"
    topics:
      - id: cbse-12-fashion-studies-ch02-t01
        title: Motivation and self-motivation
        learning_outcomes:
          - Explain internal and external motivation and list personal needs and desires that drive motivation
      - id: cbse-12-fashion-studies-ch02-t02
        title: Sources of motivation and a positive outlook
        learning_outcomes:
          - Identify sources of inspiration (people, books, music, activities) and techniques to stay positive and focused on goals
      - id: cbse-12-fashion-studies-ch02-t03
        title: "Personality: meaning, influence and traits"
        learning_outcomes:
          - Define personality and explain how it influences others at work
          - Describe the five basic personality traits (openness, conscientiousness, extraversion, agreeableness, neuroticism)
      - id: cbse-12-fashion-studies-ch02-t04
        title: Personality disorders and how to overcome them
        learning_outcomes:
          - >-
            Describe common personality disorders (paranoid, antisocial, schizoid, borderline, narcissistic, avoidant, dependent, obsessive)
            and the clusters they belong to
          - Suggest steps to seek help and overcome personality problems
    removed_topics: []
    literature_texts: []
  - id: cbse-12-fashion-studies-ch03
    number: 3
    title: "Employability Skills: ICT Skills – IV"
    unit: "Part A Unit 3: ICT Skills – IV"
    topics:
      - id: cbse-12-fashion-studies-ch03-t01
        title: "Spreadsheet basics: workbook, worksheet and data entry"
        learning_outcomes:
          - Name common spreadsheet applications and create, open and save a workbook
          - Enter text and numbers, resize fonts and apply styles
      - id: cbse-12-fashion-studies-ch03-t02
        title: Editing and organising spreadsheet data
        learning_outcomes:
          - Copy and move cell data, sort data and apply filters to a table
      - id: cbse-12-fashion-studies-ch03-t03
        title: Formulas, functions, protection and printing
        learning_outcomes:
          - Use elementary formulas and functions such as SUM, AVERAGE, MIN and MAX
          - Protect a spreadsheet with a password, print it and save it in different formats
      - id: cbse-12-fashion-studies-ch03-t04
        title: Creating a presentation
        learning_outcomes:
          - Name presentation software packages and list features of a good presentation
          - Create a presentation and add or delete slides
      - id: cbse-12-fashion-studies-ch03-t05
        title: Editing and formatting presentations
        learning_outcomes:
          - Enter, edit and format text, insert clipart and images, choose slide layouts, and save and print a presentation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-fashion-studies-ch04
    number: 4
    title: "Employability Skills: Entrepreneurial Skills – IV"
    unit: "Part A Unit 4: Entrepreneurial Skills – IV"
    topics:
      - id: cbse-12-fashion-studies-ch04-t01
        title: Barriers to becoming an entrepreneur
        learning_outcomes:
          - Classify barriers to entrepreneurship (environmental, personal, financial, social) with examples and ways to overcome them
      - id: cbse-12-fashion-studies-ch04-t02
        title: Behavioural and entrepreneurial competencies
        learning_outcomes:
          - >-
            Describe competencies such as adaptability, decisiveness, initiative, perseverance, interpersonal and organisational skills,
            stress management and valuing service and diversity
      - id: cbse-12-fashion-studies-ch04-t03
        title: Entrepreneurial competencies in particular
        learning_outcomes:
          - >-
            Explain self-confidence, seeing and acting on opportunities, concern for quality, goal setting, risk taking, problem solving,
            systematic planning, information seeking, persistence, negotiating and team building
      - id: cbse-12-fashion-studies-ch04-t04
        title: Self-assessment of entrepreneurial behaviour
        learning_outcomes:
          - Rate oneself on behavioural competencies and prepare a personal competency profile
          - Relate competencies to stories of successful Indian entrepreneurs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-fashion-studies-ch05
    number: 5
    title: "Employability Skills: Green Skills – IV"
    unit: "Part A Unit 5: Green Skills – IV"
    topics:
      - id: cbse-12-fashion-studies-ch05-t01
        title: Green jobs in homes, gardening, transport and energy conservation
        learning_outcomes:
          - Explain the role of green jobs in toxin-free homes, organic gardening, public transport and energy conservation
      - id: cbse-12-fashion-studies-ch05-t02
        title: Green jobs in water, renewable energy and waste
        learning_outcomes:
          - Describe green jobs in water conservation, solar and wind power, and waste reduction, reuse and recycling
      - id: cbse-12-fashion-studies-ch05-t03
        title: Green jobs in tourism, construction and appropriate technology
        learning_outcomes:
          - Give examples of green jobs in green tourism, building and construction and appropriate technology
      - id: cbse-12-fashion-studies-ch05-t04
        title: Role of green jobs in protecting the environment
        learning_outcomes:
          - >-
            Explain how green jobs improve energy and raw-material use, limit greenhouse-gas emissions, minimise waste and pollution,
            restore ecosystems and support adaptation to climate change
    removed_topics: []
    literature_texts: []
  - id: cbse-12-fashion-studies-ch06
    number: 6
    title: History of Fashion
    unit: "Part B Unit 1: History of Fashion"
    topics:
      - id: cbse-12-fashion-studies-ch06-t01
        title: Sources of fashion history and factors affecting clothing
        learning_outcomes:
          - Identify sources of costume history and explain protection, ritual, identification and adornment as reasons for clothing
      - id: cbse-12-fashion-studies-ch06-t02
        title: Draped costumes of ancient civilisations
        learning_outcomes:
          - Compare draped costumes of India, Sumer, Babylon, Assyria, Egypt, Greece and Rome
      - id: cbse-12-fashion-studies-ch06-t03
        title: Industrial Revolution and fashion
        learning_outcomes:
          - Explain mechanical inventions of the Industrial Revolution and their influence on India
      - id: cbse-12-fashion-studies-ch06-t04
        title: Twentieth-century Indian fashion and films
        learning_outcomes:
          - Trace the evolution of modern Indian fashion and the influence of films
    removed_topics: []
    literature_texts: []
  - id: cbse-12-fashion-studies-ch07
    number: 7
    title: Basic Pattern Development
    unit: "Part B Unit 2: Basic Pattern Development"
    topics:
      - id: cbse-12-fashion-studies-ch07-t01
        title: Pattern-making terminology, symbols and tools
        learning_outcomes:
          - Use pattern-making terms, symbols, abbreviations and tools
      - id: cbse-12-fashion-studies-ch07-t02
        title: Body measurements, sizes and fit
        learning_outcomes:
          - Measure the body and dress form, use size charts and evaluate fit and balance
      - id: cbse-12-fashion-studies-ch07-t03
        title: Basic bodice block and dart manipulation
        learning_outcomes:
          - Develop a basic and sleeveless bodice block, neckline variations and dart manipulation
      - id: cbse-12-fashion-studies-ch07-t04
        title: Skirt blocks
        learning_outcomes:
          - Develop a basic skirt block with one or two darts and an A-line skirt
      - id: cbse-12-fashion-studies-ch07-t05
        title: Collar development
        learning_outcomes:
          - Explain principles of flat, roll and stand collars
    removed_topics: []
    literature_texts: []
  - id: cbse-12-fashion-studies-ch08
    number: 8
    title: Elements of Fashion
    unit: "Part B Unit 3: Elements of Fashion"
    topics:
      - id: cbse-12-fashion-studies-ch08-t01
        title: "Understanding fashion: haute couture, ready-to-wear and mass fashion"
        learning_outcomes:
          - Distinguish haute couture, high fashion, ready-to-wear and mass-produced garments and custom-made clothing
      - id: cbse-12-fashion-studies-ch08-t02
        title: Fashion capitals
        learning_outcomes:
          - Identify global fashion capitals and their significance
      - id: cbse-12-fashion-studies-ch08-t03
        title: Menswear categories
        learning_outcomes:
          - "Describe categories and design elements of menswear: shirts, trousers, shorts and suits"
      - id: cbse-12-fashion-studies-ch08-t04
        title: Women's and children's wear
        learning_outcomes:
          - Describe categories of women's wear including Indian wear, and children's wear
      - id: cbse-12-fashion-studies-ch08-t05
        title: Trims used in apparel
        learning_outcomes:
          - Identify trims and their uses in apparel
    removed_topics: []
    literature_texts: []
  - id: cbse-12-fashion-studies-ch09
    number: 9
    title: Basics of Garment Making
    unit: "Part B Unit 4: Basics of Garment Making"
    topics:
      - id: cbse-12-fashion-studies-ch09-t01
        title: Fabric types and underlying fabrics
        learning_outcomes:
          - Differentiate natural, synthetic and blended fabrics and select underlining, interfacing, lining and interlining
      - id: cbse-12-fashion-studies-ch09-t02
        title: Cutting preliminaries
        learning_outcomes:
          - Explain fabric preparation, grain line, preshrinking, identifying the right side, pinning and marking
      - id: cbse-12-fashion-studies-ch09-t03
        title: Plackets
        learning_outcomes:
          - Describe continuous, simple shirt and faced shirt plackets
      - id: cbse-12-fashion-studies-ch09-t04
        title: Neckline finishes and bias strips
        learning_outcomes:
          - Explain neckline facings and preparation of bias strips
      - id: cbse-12-fashion-studies-ch09-t05
        title: Piping, bias facing and shaped facing (practical)
        board_assessed: false
        learning_outcomes:
          - Finish necklines with piping, bias facing and shaped facing
