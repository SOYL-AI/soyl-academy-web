# CBSE Class 12 Odia (113), 2026-27. Sections, marks, design of the question
# paper, grammar items, writing tasks and every prescribed lesson (in Roman transliteration, without authors) from the
# CBSE 2026-27 Odia XI-XII syllabus, Class XII. Book: Sahitya Jyoti Part II (Class XII, revised 2022), The Odisha State Bureau of
# Textbook Preparation and Production, Bhubaneswar. The short stories form the non-detailed section. Odia-script titles are SOYL's rendering of CBSE's
# transliteration. Titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-12-odia
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-odia-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Board theory 80 marks (3 hours), 14 questions + internal assessment 20 (listening 5, speaking 5 - assessed on relevance, fluency,
  pronunciation and language; project 10). Section A Reading 10: unseen prose passage of 130-150 words, 5x2. Section B Writing 12: essay on
  a contemporary issue 1 of 3 x 6; official letter 1 of 2 x 6. Section C Grammar 10: antonyms 3 of 4 x 1, correction of common errors in
  words 3 of 4 x 1, similar words with different meanings 2 of 3 x 1, one-word substitution 2 of 3 x 1. Section D Literature 48: explanation
  from prose 1 of 2 x 5, prose short answers 3 of 5 x 2, prose MCQs 10x1; explanation from poetry 1 of 2 x 5, poetry short answers 3 of 5 x
  2, poetry MCQs 10x1; non-detailed (short stories) short answers 3 of 5 x 2.
