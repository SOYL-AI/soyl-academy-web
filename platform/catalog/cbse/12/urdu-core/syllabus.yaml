# CBSE Class 12 Urdu Core (303), 2026-27. Sections, marks, writing tasks and deleted lessons as printed in the CBSE 2026-27
# Urdu Core Classes XI-XII syllabus (Class XII table). Textbook: Nai Awaaz (Urdu Core, Class XII, NCERT 2011) and Urdu Qawaid
# (NCERT). CBSE lists only the DELETED lessons (in Roman script; the Urdu spellings in removed_topics are ours), not the full
# contents of Nai Awaaz, so the textbook chapters carry placeholder topics until the NCERT contents page is supplied.
# Literature: titles and authors only; no text is reproduced (CONTEXT §8).
subject_id: cbse-12-urdu-core
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-urdu-core-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  Theory 80 marks (3 hours) + 20 internal (listening and speaking 10, project 10). Section A Comprehension and writing
  45: two unseen factual passages of about 150 words with five questions each 5+5; essay (internal choice) 10; letter -
  personal, business or official connected with daily life, or an application (internal choice) 8; precis writing 7;
  sentence making with idiomatic phrases 10. Section B Nai Awaaz 35: prose 20 (one extract with short comprehension
  questions 7, one essay-type question of about 100 words on content or theme with internal choice 5, four short-answer
  questions 8) and poetry 15 (one essay-type question of about 100 words on theme or content, or a value-based question
  5; five very short questions on characters, events or analysis from an extract 5; five one-word textbook-based
  objective questions 5). The paper includes value-based questions worth up to five marks.
units:
  - name: 'حصہ الف: عبارت فہمی اور تحریر'
    marks: 45
  - name: 'حصہ ب: نئی آواز (درسی کتاب)'
    marks: 35
  - name: 'حصہ ج: سماعت و گفتگو اور پروجیکٹ (داخلی)'
    marks: 20
chapters:
  - id: cbse-12-urdu-core-ch01
    number: 1
    title: غیر درسی اقتباسات
    title_en: Unseen passages
    unit: 'حصہ الف: عبارت فہمی اور تحریر'
    topics:
      - id: cbse-12-urdu-core-ch01-t01
        title: دو غیر درسی واقعاتی اقتباسات (تقریباً 150 الفاظ)
        title_en: Two unseen factual passages (about 150 words each)
        learning_outcomes:
          - Read unseen factual passages in Urdu and answer five questions on each, including inference and vocabulary
          - Identify the main point and supporting details of a passage
    removed_topics: []
    literature_texts: []
  - id: cbse-12-urdu-core-ch02
    number: 2
    title: مضمون نگاری
    title_en: Essay writing
    unit: 'حصہ الف: عبارت فہمی اور تحریر'
    topics:
      - id: cbse-12-urdu-core-ch02-t01
        title: مضمون کی ترتیب اور خاکہ
        title_en: Planning and organising an essay
        learning_outcomes:
          - >-
            Prepare an outline and develop an expository or argumentative essay with an introduction, body and
            conclusion
      - id: cbse-12-urdu-core-ch02-t02
        title: سماجی، ادبی اور عصری موضوعات پر مضمون
        title_en: Essays on social, literary and current topics
        learning_outcomes:
          - Write an essay that explains or argues a case with examples, in correct and idiomatic Urdu
    removed_topics: []
    literature_texts: []
  - id: cbse-12-urdu-core-ch03
    number: 3
    title: خطوط اور درخواست نگاری
    title_en: Letters and applications
    unit: 'حصہ الف: عبارت فہمی اور تحریر'
    topics:
      - id: cbse-12-urdu-core-ch03-t01
        title: نجی خطوط
        title_en: Personal letters
        learning_outcomes:
          - Write a personal letter with suitable forms of address, tone and closing
      - id: cbse-12-urdu-core-ch03-t02
        title: کاروباری اور دفتری خطوط
        title_en: Business and official letters connected with daily life
        learning_outcomes:
          - Write business and official letters in the correct format with a clear purpose and polite tone
      - id: cbse-12-urdu-core-ch03-t03
        title: درخواست نگاری
        title_en: Application writing
        learning_outcomes:
          - Write an application with subject, request and proper closing
    removed_topics: []
    literature_texts: []
  - id: cbse-12-urdu-core-ch04
    number: 4
    title: تلخیص نگاری
    title_en: Precis writing
    unit: 'حصہ الف: عبارت فہمی اور تحریر'
    topics:
      - id: cbse-12-urdu-core-ch04-t01
        title: تلخیص کے اصول
        title_en: Principles of precis writing
        learning_outcomes:
          - Identify the essential ideas of a passage and reduce it to about one-third of its length in their own words
          - Give a suitable title to the precis
    removed_topics: []
    literature_texts: []
  - id: cbse-12-urdu-core-ch05
    number: 5
    title: محاورات کی مدد سے جملہ سازی
    title_en: Sentence making with idiomatic phrases
    unit: 'حصہ الف: عبارت فہمی اور تحریر'
    topics:
      - id: cbse-12-urdu-core-ch05-t01
        title: محاورات کے معنی اور جملوں میں استعمال
        title_en: Meanings of idioms and their use in sentences
        learning_outcomes:
          - Explain the meaning of common Urdu idioms and use each in a sentence that shows the meaning clearly
    removed_topics: []
    literature_texts: []
  - id: cbse-12-urdu-core-ch06
    number: 6
    title: 'درسی کتاب: نئی آواز'
    title_en: 'Prescribed textbook: Nai Awaaz (Urdu Core, Class XII)'
    unit: 'حصہ ب: نئی آواز (درسی کتاب)'
    topics:
      - id: cbse-12-urdu-core-ch06-t01
        title: نثری اسباق (فہرست درکار)
        title_en: Prose lessons (lesson list pending NCERT contents page)
        learning_outcomes:
          - Answer comprehension questions on an extract from a prescribed prose lesson
          - Write an answer of about 100 words on the content or theme of a lesson and short answers on its details
      - id: cbse-12-urdu-core-ch06-t02
        title: شعری اسباق (فہرست درکار)
        title_en: Poems (lesson list pending NCERT contents page)
        learning_outcomes:
          - Write an answer of about 100 words on the theme or content of a prescribed poem, or a value-based answer
          - Answer one-word and one-sentence questions on characters, events and ideas in a poetic extract
    removed_topics:
      - جاپان
      - بڑے بول کا سر نیچا
      - ایک گدھے کی سرگزشت
      - رباعیات
      - پھول مالا
    literature_texts: []
  - id: cbse-12-urdu-core-ch07
    number: 7
    title: سماعت و گفتگو کی مہارت اور پروجیکٹ
    title_en: Listening and speaking skills and project work (internal assessment)
    unit: 'حصہ ج: سماعت و گفتگو اور پروجیکٹ (داخلی)'
    topics:
      - id: cbse-12-urdu-core-ch07-t01
        title: سماعت کی مہارت
        title_en: Listening skills
        learning_outcomes:
          - Listen to news bulletins, lectures and talks in Urdu and extract the relevant information
          - Take part in formal group discussions on textbook and current topics and report on them
        board_assessed: false
      - id: cbse-12-urdu-core-ch07-t02
        title: گفتگو کی مہارت
        title_en: Speaking skills
        learning_outcomes:
          - >-
            Take part in debates, poem recitation, programme anchoring, story telling, role play and picture narration
            in Urdu
          - Speak with interactive competence, fluency, correct pronunciation and accurate vocabulary
        board_assessed: false
      - id: cbse-12-urdu-core-ch07-t03
        title: پروجیکٹ ورک
        title_en: Project work
        learning_outcomes:
          - >-
            Prepare a project of up to 1000 words on a literary or social theme (for example a review of the textbook or
            a poem, history of Urdu literature, environment, cyber safety) with pictures and data
          - Present the project and answer viva questions on it
        board_assessed: false
    removed_topics: []
    literature_texts: []
    board_assessed: false
