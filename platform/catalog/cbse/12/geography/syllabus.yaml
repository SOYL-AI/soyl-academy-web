# CBSE Class 12 Geography (029), 2026-27. Two theory books (35 marks each incl. 5 map) + practical (30). Practical book not modelled beyond a theory chapter on data and spatial technology.
subject_id: cbse-12-geography
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-geography-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - cbse-sqp-xii-2026-27
  - cbse-sqp-notification-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  Theory 70 marks (3 hours) + practical 30 (data and processing 18, spatial information technology 7, record and viva 5). Fundamentals of
  Human Geography 35 (incl. world map 5); India: People and Economy 35 (incl. India map 5). Single board exam (February-March 2027).
units:
