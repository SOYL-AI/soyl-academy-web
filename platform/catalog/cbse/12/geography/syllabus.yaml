      - id: cbse-12-geography-ch01-t01
        title: Nature of human geography; naturalisation of humans and humanisation of nature
        learning_outcomes:
          - Explain environmental determinism and possibilism and neo-determinism
      - id: cbse-12-geography-ch01-t02
        title: Approaches and schools of thought
        learning_outcomes:
          - Describe systematic and regional approaches and welfare, radical and behavioural schools
      - id: cbse-12-geography-ch01-t03
        title: Fields and sub-fields of human geography
        learning_outcomes:
          - Relate sub-fields of human geography to other social sciences
