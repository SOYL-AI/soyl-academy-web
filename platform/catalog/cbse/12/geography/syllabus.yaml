    marks: 3
  - name: "Fundamentals of Human Geography – Unit II: People"
    marks: 8
  - name: "Fundamentals of Human Geography – Units III-IV: Human Activities; Transport, Communication and Trade"
    marks: 19
  - name: Fundamentals of Human Geography – Map work (world)
    marks: 5
  - name: "India: People and Economy – Unit I: People"
    marks: 5
  - name: "India: People and Economy – Unit II: Human Settlements"
    marks: 3
  - name: "India: People and Economy – Unit III: Resources and Development"
    marks: 10
  - name: "India: People and Economy – Unit IV: Transport, Communication and International Trade"
    marks: 7
  - name: "India: People and Economy – Unit V: Geographical Perspective on Selected Issues"
    marks: 5
  - name: "India: People and Economy – Map work (India)"
    marks: 5
