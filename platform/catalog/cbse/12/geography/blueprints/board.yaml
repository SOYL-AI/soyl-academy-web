notes: >-
  30 questions: A 17 x 1 MCQ (one assertion-reason, one match-the-column coded MCQ), B 2 x 3 source-based (map/graph/text source),

  C 4 x 3 SA (80-100 words; one internal choice), D 5 x 5 LA (120-150 words; internal choice in four), E 2 x 5 map (world map Q29, India

  map Q30; each "any five of seven" features, 1 mark each). Book weightage 35 + 35 (each includes its 5-mark map). Competency weights

  (design table): remembering/understanding 41%, application 37%, analysing/evaluating/creating 22%. FORMAT MAPPING: map questions have no

  QuestionType; each is modelled as 7 one-mark short items with choice 5 of 7 (assembler must draw them as one map question on one outline

  map). Source-based items using a map or graph need an image asset. Visually impaired candidates get substitute questions for items with
  visual input (not modelled).
