# CBSE Class 12 Russian (121), 2026-27. Sections and marks as printed in the CBSE 2026-27 Russian Classes XI-XII
# syllabus (Class XII page). Prescribed book: "Russkii Yazyk" - Russian for Children, a textbook for foreign
# students by M. N. Vityutnev and others, Book VI, lessons 1-15. CBSE names neither the lesson titles nor the grammar
# topics (grammar is "based on the lessons"), so the grammar and textbook chapters carry placeholder topics until the
# book's contents page is supplied. No text is reproduced (CONTEXT §8).
subject_id: cbse-12-russian
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-russian-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (listening and speaking, including interpreting short texts between
  Russian and English, 10; a small project on Russian culture and civilisation - cinema, climate, sports, songs or
  poetry - 5; a write-up in Russian or English on their experience of learning Russian 5). Section A Applied grammar 40,
  based on the lessons of the prescribed book. Section B Reading 10: an unseen passage of 150-200 words with 4-5 short
  questions answered in Russian. Section C Composition 10: an essay of 150-200 words on everyday life. Section D
  Textbook 10: questions on the texts of lessons 1-15 answered in Russian. Section E Translation 10: unseen text or
  sentences from Russian into English and from English into Russian. Board examination in Class XII.
units:
  - name: 'Раздел A: Грамматика'
    marks: 40
  - name: 'Раздел B: Чтение'
    marks: 10
  - name: 'Раздел C: Сочинение'
    marks: 10
  - name: 'Раздел D: Тексты учебника'
    marks: 10
  - name: 'Раздел E: Перевод'
    marks: 10
