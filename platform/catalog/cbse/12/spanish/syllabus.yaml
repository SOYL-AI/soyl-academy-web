# CBSE Class 12 Spanish (196), 2026-27. Sections, marks, grammar items, culture and literature content as printed in the
# CBSE 2026-27 Spanish Classes XI-XII syllabus (Class XII pages). Prescribed textbook: Aula Internacional 3
# (Jaime Corpas et al., Difusión) - "relevant chapters", no lesson list; reference books: en acción 2, Compañeros 3, En directo.
# Literary works are named as CBSE names them (titles and authors only); no text is reproduced (CONTEXT §8).
subject_id: cbse-12-spanish
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-spanish-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (periodic tests, best 2 of 3, 10; notebook 5; subject enrichment -
  listening and speaking - 5). Section A Applied grammar 35: revision of Class XI morphology and syntax; expressing
  intention and opinion (quiero / voy a intentar / pienso / tengo la intención de + infinitive, ir a + infinitive, ¿le
  importaría...?, ¿podría...?, creo que + indicative); the present subjunctive in independent and conditional clauses
  and after expressions of wish, necessity, emotion, doubt, fear and probability; gerund and participle; active and
  passive voice and uses of se. Section B Reading comprehension 15: unseen passages with short questions answered in
  Spanish. Section C Composition 15: two short compositions on life and its surroundings, one of 90-100 words and one of
  150-180 words. Section D Culture, civilisation and literature 15: pre-colonial (Aztec, Maya, Inca) and post-colonial
  Latin America (independence, Mexican and Cuban revolutions), Latin American customs and traditions, and literary
  figures - Octavio Paz and Rubén Darío in addition to the Class XI authors. Board examination in Class XII.
units:
  - name: 'Sección A: Gramática aplicada'
    marks: 35
  - name: 'Sección B: Comprensión lectora'
    marks: 15
  - name: 'Sección C: Composición y expresión escrita'
    marks: 15
  - name: 'Sección D: Cultura, civilización y literatura'
    marks: 15
chapters:
  - id: cbse-12-spanish-ch01
    number: 1
    title: Expresar intenciones, planes y opiniones
    title_en: Expressing intentions, plans and opinions
    unit: 'Sección A: Gramática aplicada'
    topics:
      - id: cbse-12-spanish-ch01-t01
        title: Repaso de la morfología y sintaxis de la clase XI
        title_en: Revision of Class XI morphology and syntax
        learning_outcomes:
          - Apply the Class XI grammar accurately in new sentences
      - id: cbse-12-spanish-ch01-t02
        title: Quiero / voy a intentar / pienso / tengo la intención de + infinitivo
        title_en: 'Expressing intention: quiero, voy a intentar, pienso, tengo la intención de + infinitive; ir a + infinitive'
        learning_outcomes:
          - Express plans and intentions with periphrastic verb constructions
      - id: cbse-12-spanish-ch01-t03
        title: ¿Le importaría...? ¿Podría...? Yo creo que / opino que + indicativo
        title_en: Polite requests and opinions with indicative
        learning_outcomes:
          - Make polite requests and give opinions with creo que / opino que + indicative
    removed_topics: []
    literature_texts: []
  - id: cbse-12-spanish-ch02
    number: 2
    title: El presente de subjuntivo
    title_en: The present subjunctive
    unit: 'Sección A: Gramática aplicada'
    topics:
      - id: cbse-12-spanish-ch02-t01
        title: Quiero que, es necesario/importante/mejor que + subjuntivo
        title_en: 'Wishes and necessity: querer que, es necesario/importante/mejor que + subjunctive'
        learning_outcomes:
          - Use the present subjunctive after expressions of wish and necessity
      - id: cbse-12-spanish-ch02-t02
        title: ¡Qué lástima/pena/suerte que...! (No) me gusta que + subjuntivo
        title_en: 'Emotions and likes: qué lástima/pena/suerte que, me gusta que + subjunctive'
        learning_outcomes:
          - Express feelings and reactions with the present subjunctive
      - id: cbse-12-spanish-ch02-t03
        title: Siempre que, en caso de que, dudo que, temo que + subjuntivo
        title_en: 'Conditions, doubt and fear: siempre que, en caso de que, dudo que, temo que + subjunctive'
        learning_outcomes:
          - Use the subjunctive in conditional clauses and after expressions of doubt and fear
      - id: cbse-12-spanish-ch02-t04
        title: A lo mejor, igual, seguramente; puede que / es posible que + subjuntivo
        title_en: 'Probability: a lo mejor, igual, seguramente; puede que, es posible que + subjunctive'
        learning_outcomes:
          - Express degrees of probability choosing indicative or subjunctive correctly
    removed_topics: []
    literature_texts: []
