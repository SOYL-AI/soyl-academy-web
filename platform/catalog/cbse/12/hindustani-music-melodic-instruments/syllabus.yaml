exam_notes: >-
  Theory 30 marks (2 hours) + practical 70. CBSE theory units 1-5 carry 6 marks each; questions are set with internal choice across the
  whole syllabus. Theory paper (CBSE 2026-27 SQP): Section A 8 MCQs x 1 (includes match-the-list and two-statement items); Section B 5 short
  answers x 2, each with an internal choice; Section C 2 long answers x 6, each with an internal choice (notation of compositions/talas,
  raga description). Practical (razakhani and masitkhani gats in Bhairav, Bageshri and Malkauns, alap-jor-jhala with meend, composition in
  Ektal or Jhaptal, theka recitation, instrument tuning) is marked board_assessed: false here. Single board exam (February-March 2027).
