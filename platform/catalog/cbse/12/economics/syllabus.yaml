# CBSE Class 12 Economics (030), 2026-27. Eight CBSE units; Part B Unit 7 is split into its four NCERT chapters. Per-unit marks in exam_notes.
subject_id: cbse-12-economics
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-economics-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - cbse-sqp-xii-2026-27
  - cbse-sqp-notification-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  Theory 80 marks (3 hours) + project 20. Part A Macroeconomics 40 (National Income 10, Money and Banking 6, Income and Employment 12,
  Government Budget 6, Balance of Payments 6). Part B Indian Economic Development 40 (Development Experience and Reforms 12, Current
  Challenges 20, Comparison with Neighbours 8). Competency mix: remembering/understanding 40%, applying 30%, analysing/evaluating/creating
  30%. Single board exam (February-March 2027).
units:
  - name: "Part A: Introductory Macroeconomics"
    marks: 40
  - name: "Part B: Indian Economic Development"
    marks: 40
chapters:
  - id: cbse-12-economics-ch01
    number: 1
    title: National Income and Related Aggregates
    unit: "Part A: Introductory Macroeconomics"
    topics:
      - id: cbse-12-economics-ch01-t01
        title: What is macroeconomics? Basic concepts
        learning_outcomes:
          - Distinguish consumption and capital goods, final and intermediate goods, stocks and flows, gross investment and depreciation
      - id: cbse-12-economics-ch01-t02
        title: Circular flow of income (two-sector model)
        learning_outcomes:
          - Explain the two-sector circular flow of income
      - id: cbse-12-economics-ch01-t03
        title: Methods of calculating national income
        learning_outcomes:
          - Calculate national income by value added, expenditure and income methods
      - id: cbse-12-economics-ch01-t04
        title: "Aggregates: GNP, NNP, GDP, NDP at market price and factor cost"
        learning_outcomes:
          - Convert between national income aggregates
      - id: cbse-12-economics-ch01-t05
        title: Real and nominal GDP, GDP deflator, GDP and welfare
        learning_outcomes:
          - Calculate the GDP deflator and explain why GDP is an imperfect welfare index
    removed_topics: []
    literature_texts: []
