        title: "Money: meaning, functions and supply of money"
        learning_outcomes:
          - Explain functions of money and components of money supply
      - id: cbse-12-economics-ch02-t02
        title: Money creation by commercial banks
        learning_outcomes:
          - Explain the credit multiplier using the reserve ratio
      - id: cbse-12-economics-ch02-t03
        title: Central bank and its functions (RBI)
        learning_outcomes:
          - >-
            Explain RBI functions and credit control by bank rate, CRR, SLR, repo, reverse repo, open market operations and margin
            requirements
    removed_topics: []
    literature_texts: []
