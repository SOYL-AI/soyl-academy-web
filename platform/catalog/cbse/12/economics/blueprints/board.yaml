notes: >-
  34 questions in two sections of 40: A Macroeconomics (Q1-17), B Indian Economic Development (Q18-34). Paper-wide: 20 x 1 MCQ,

  4 x 3, 6 x 4, 4 x 6. Internal choice in 2026-27 SQP: Q11, Q13, Q17 (Section A) and Q29, Q32, Q33 (Section B). Text-based items: Q16 (6

  marks, Section A) and Q28 (3 marks) and Q34 (6 marks, Section B) are mapped to case-based. Competency weights (design table):

  remembering/understanding 40%, applying 30%, analysing/evaluating/creating 30%. FORMAT MAPPING: match-the-column (Q19) and

  chronological-ordering items are coded-option MCQs (mcq); diagram/graph-reading items (e.g. Q6) and cartoon-based items (Q12) need image

  assets; national-income/multiplier numericals are mapped to short/long with working. Visually impaired candidates get substitute questions
  for items with visual input (not modelled).
