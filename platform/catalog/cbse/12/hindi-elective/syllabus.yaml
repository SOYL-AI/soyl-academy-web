exam_notes: >-
  सैद्धांतिक 80 अंक (3 घंटे) + आंतरिक 20 (श्रवण तथा वाचन 10, परियोजना 10)। खंड क अपठित बोध 18 (गद्यांश 10, पद्यांश 8); खंड ख अभिव्यक्ति और
  माध्यम 22 (पाठ 3-5 पर 5 + 6, नए और अप्रत्याशित विषय पर ~100 शब्द 5, पाठ 6-8 पर 3x2); खंड ग अंतरा-अंतराल 40 (काव्यांश बहुविकल्पी 5, काव्य
  खंड 2x2, सप्रसंग व्याख्या 6, गद्यांश बहुविकल्पी 5, गद्य खंड 2x2, सप्रसंग व्याख्या 6, अंतराल 5x2)। Single board exam (February-March 2027).
