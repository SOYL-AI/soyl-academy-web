chapters:
  - id: cbse-12-mass-media-studies-ch01
    number: 1
    title: "Employability Skills: Communication Skills – IV"
    unit: "Part A Unit 1: Communication Skills – IV"
    topics:
      - id: cbse-12-mass-media-studies-ch01-t01
        title: Active listening at the workplace
        learning_outcomes:
          - Explain why active listening matters at work and list the barriers to it
          - Describe the steps of active listening and apply them in a role play
      - id: cbse-12-mass-media-studies-ch01-t02
        title: Sentences and phrases; kinds and parts of a sentence
        learning_outcomes:
          - Distinguish a phrase from a sentence and classify sentences as declarative, interrogative, imperative or exclamatory
          - Identify the subject, predicate and object in a sentence
      - id: cbse-12-mass-media-studies-ch01-t03
        title: Parts of speech and articles
        learning_outcomes:
          - Identify nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections in workplace sentences
          - Use the articles a, an and the correctly
      - id: cbse-12-mass-media-studies-ch01-t04
        title: Constructing a paragraph
        learning_outcomes:
          - Write a well-organised paragraph with a topic sentence, supporting sentences and a conclusion on a subject-related theme
    removed_topics: []
    literature_texts: []
  - id: cbse-12-mass-media-studies-ch02
    number: 2
    title: "Employability Skills: Self-Management Skills – IV"
    unit: "Part A Unit 2: Self-Management Skills – IV"
    topics:
      - id: cbse-12-mass-media-studies-ch02-t01
        title: Motivation and self-motivation
        learning_outcomes:
          - Explain internal and external motivation and list personal needs and desires that drive motivation
      - id: cbse-12-mass-media-studies-ch02-t02
        title: Sources of motivation and a positive outlook
        learning_outcomes:
          - Identify sources of inspiration (people, books, music, activities) and techniques to stay positive and focused on goals
      - id: cbse-12-mass-media-studies-ch02-t03
        title: "Personality: meaning, influence and traits"
        learning_outcomes:
          - Define personality and explain how it influences others at work
          - Describe the five basic personality traits (openness, conscientiousness, extraversion, agreeableness, neuroticism)
      - id: cbse-12-mass-media-studies-ch02-t04
        title: Personality disorders and how to overcome them
        learning_outcomes:
          - >-
            Describe common personality disorders (paranoid, antisocial, schizoid, borderline, narcissistic, avoidant, dependent, obsessive)
            and the clusters they belong to
          - Suggest steps to seek help and overcome personality problems
    removed_topics: []
    literature_texts: []
  - id: cbse-12-mass-media-studies-ch03
    number: 3
    title: "Employability Skills: ICT Skills – IV"
    unit: "Part A Unit 3: ICT Skills – IV"
    topics:
      - id: cbse-12-mass-media-studies-ch03-t01
        title: "Spreadsheet basics: workbook, worksheet and data entry"
        learning_outcomes:
          - Name common spreadsheet applications and create, open and save a workbook
          - Enter text and numbers, resize fonts and apply styles
      - id: cbse-12-mass-media-studies-ch03-t02
        title: Editing and organising spreadsheet data
        learning_outcomes:
          - Copy and move cell data, sort data and apply filters to a table
      - id: cbse-12-mass-media-studies-ch03-t03
        title: Formulas, functions, protection and printing
        learning_outcomes:
          - Use elementary formulas and functions such as SUM, AVERAGE, MIN and MAX
          - Protect a spreadsheet with a password, print it and save it in different formats
      - id: cbse-12-mass-media-studies-ch03-t04
        title: Creating a presentation
        learning_outcomes:
          - Name presentation software packages and list features of a good presentation
          - Create a presentation and add or delete slides
      - id: cbse-12-mass-media-studies-ch03-t05
        title: Editing and formatting presentations
        learning_outcomes:
          - Enter, edit and format text, insert clipart and images, choose slide layouts, and save and print a presentation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-mass-media-studies-ch04
    number: 4
    title: "Employability Skills: Entrepreneurial Skills – IV"
    unit: "Part A Unit 4: Entrepreneurial Skills – IV"
    topics:
      - id: cbse-12-mass-media-studies-ch04-t01
        title: Barriers to becoming an entrepreneur
        learning_outcomes:
          - Classify barriers to entrepreneurship (environmental, personal, financial, social) with examples and ways to overcome them
      - id: cbse-12-mass-media-studies-ch04-t02
        title: Behavioural and entrepreneurial competencies
        learning_outcomes:
          - >-
            Describe competencies such as adaptability, decisiveness, initiative, perseverance, interpersonal and organisational skills,
            stress management and valuing service and diversity
      - id: cbse-12-mass-media-studies-ch04-t03
        title: Entrepreneurial competencies in particular
        learning_outcomes:
          - >-
            Explain self-confidence, seeing and acting on opportunities, concern for quality, goal setting, risk taking, problem solving,
            systematic planning, information seeking, persistence, negotiating and team building
      - id: cbse-12-mass-media-studies-ch04-t04
        title: Self-assessment of entrepreneurial behaviour
        learning_outcomes:
          - Rate oneself on behavioural competencies and prepare a personal competency profile
          - Relate competencies to stories of successful Indian entrepreneurs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-mass-media-studies-ch05
    number: 5
    title: "Employability Skills: Green Skills – IV"
    unit: "Part A Unit 5: Green Skills – IV"
    topics:
      - id: cbse-12-mass-media-studies-ch05-t01
        title: Green jobs in homes, gardening, transport and energy conservation
        learning_outcomes:
          - Explain the role of green jobs in toxin-free homes, organic gardening, public transport and energy conservation
      - id: cbse-12-mass-media-studies-ch05-t02
        title: Green jobs in water, renewable energy and waste
        learning_outcomes:
          - Describe green jobs in water conservation, solar and wind power, and waste reduction, reuse and recycling
      - id: cbse-12-mass-media-studies-ch05-t03
        title: Green jobs in tourism, construction and appropriate technology
        learning_outcomes:
          - Give examples of green jobs in green tourism, building and construction and appropriate technology
      - id: cbse-12-mass-media-studies-ch05-t04
        title: Role of green jobs in protecting the environment
        learning_outcomes:
          - >-
            Explain how green jobs improve energy and raw-material use, limit greenhouse-gas emissions, minimise waste and pollution,
            restore ecosystems and support adaptation to climate change
    removed_topics: []
    literature_texts: []
  - id: cbse-12-mass-media-studies-ch06
    number: 6
    title: Selling, Marketing and Exhibiting a Product through Advertising
    unit: "Part B Unit 1: Selling, Marketing and Exhibiting a Product through Advertising"
    topics:
      - id: cbse-12-mass-media-studies-ch06-t01
        title: Advertising concept and process
        learning_outcomes:
          - Explain how product, specifications, targeting and buyers shape an advertising campaign
      - id: cbse-12-mass-media-studies-ch06-t02
        title: Functions of advertising
        learning_outcomes:
          - Explain how advertising promotes products, drives sales, builds brand identity and creates buzz
      - id: cbse-12-mass-media-studies-ch06-t03
        title: Types of advertising
        learning_outcomes:
          - >-
            Compare print, out-of-home, broadcast and digital advertising, in-film promotion, celebrity endorsement, cross-promotion,
            merchandise, games and covert advertising
      - id: cbse-12-mass-media-studies-ch06-t04
        title: Forms of advertising
        learning_outcomes:
          - >-
            Distinguish product, institutional, public-service, advocacy, comparative, co-operative, direct-mail, point-of-purchase and
            informational advertising
    removed_topics: []
    literature_texts: []
  - id: cbse-12-mass-media-studies-ch07
    number: 7
    title: Introduction to the Production Process
    unit: "Part B Unit 2: Introduction to the Production Process"
    topics:
      - id: cbse-12-mass-media-studies-ch07-t01
        title: Film production stages
        learning_outcomes:
          - Describe pre-shooting, shooting and post-shooting stages of film production
      - id: cbse-12-mass-media-studies-ch07-t02
        title: Television production stages
        learning_outcomes:
          - Describe pre-shooting, shooting and post-shooting stages of TV production
      - id: cbse-12-mass-media-studies-ch07-t03
        title: Print production
        learning_outcomes:
          - Describe planning, writing, editing and designing in print production
      - id: cbse-12-mass-media-studies-ch07-t04
        title: Radio production
        learning_outcomes:
          - Describe planning, recording, editing and transmission in radio
      - id: cbse-12-mass-media-studies-ch07-t05
        title: Internet content production
        learning_outcomes:
          - Describe planning, creating and delivering content on the internet
    removed_topics: []
    literature_texts: []
  - id: cbse-12-mass-media-studies-ch08
    number: 8
    title: New Media
    unit: "Part B Unit 3: New Media"
    topics:
      - id: cbse-12-mass-media-studies-ch08-t01
        title: Earlier models of mass communication
        learning_outcomes:
          - Describe the few-to-many broadcast model and its large organisations, infrastructure and revenues
      - id: cbse-12-mass-media-studies-ch08-t02
        title: "Convergence: the internet as the meeting point of media"
        learning_outcomes:
          - Explain media convergence and how the internet empowers individuals to publish
      - id: cbse-12-mass-media-studies-ch08-t03
        title: Socio-political implications of the new information order
        learning_outcomes:
          - Evaluate the speed of opinion formation, multiple sources and the effects on democracy
      - id: cbse-12-mass-media-studies-ch08-t04
        title: Emerging trends in mass communication
        learning_outcomes:
          - Identify emerging trends in mass communication
    removed_topics: []
    literature_texts: []
  - id: cbse-12-mass-media-studies-ch09
    number: 9
    title: Creative Contributions of the Key People
    unit: "Part B Unit 4: Creative Contributions of the Key People"
    topics:
      - id: cbse-12-mass-media-studies-ch09-t01
        title: Key people in film and television
        learning_outcomes:
          - >-
            Describe the contributions of the writer, director, producer, actor, cinematographer, audiographer, editor, art director and
            music composer
      - id: cbse-12-mass-media-studies-ch09-t02
        title: Key people in print
        learning_outcomes:
          - Describe the roles of the reporter, sub-editor and editor
      - id: cbse-12-mass-media-studies-ch09-t03
        title: Key people in radio
        learning_outcomes:
          - Describe the roles of the artist, speaker, interviewer, recordist, programme producer and station director
      - id: cbse-12-mass-media-studies-ch09-t04
        title: Key people in internet media
        learning_outcomes:
          - Describe the roles of the writer, conceptualiser, editor and designer
    removed_topics: []
    literature_texts: []
