# CBSE Class 12 Mass Media Studies (835), 2026-27 skill subject. Built from the CBSE 2026-27 skill curriculum; theory component only (practical work is listed in exam_notes).
subject_id: cbse-12-mass-media-studies
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-mass-media-835-2026-27
  - cbse-skill-curriculum-2026-27
