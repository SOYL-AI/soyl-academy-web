exam_notes: >-
  Total 100 = theory 60 + practical 40 (practical examination 15, written test 10, viva 5, project/field visit/practical file/portfolio 10;
  practical jobs: unseen dictation of 400 words at 80 w.p.m. for 5 minutes with transcription on computer, and a business letter dictated at
  60 w.p.m.). Part A Employability Skills 10 marks, Part B subject-specific skills 50 marks. Theory paper 60 marks, 3 hours: Section A
  objective 30 (Employability Skills 4 of 6 + subject 26 from 5 questions with internal choice); Section B subjective 30 (Employability
  Skills 3 of 5 x 2; subject 3 of 5 x 2, 2 of 3 x 3, 3 of 5 x 4). Single board exam (February-March 2027). Units 6 (dictation and
  transcription) and 7 (business letters and transcription) carry no theory marks ("no theory question") and are marked board_assessed:
  false.
