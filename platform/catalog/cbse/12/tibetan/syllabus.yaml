# CBSE Class 12 Tibetan (117), 2026-27. Sections, marks, topics and textbook lesson numbers as printed in the CBSE
# 2026-27 Tibetan Classes XI-XII syllabus (Class XII course structure). Prescribed book: New Tibetan Textbook
# (printed by Sherig Parkhang / TCRPC; CBSE prints "for class XI" on both pages). CBSE names texts in Wylie-style
# romanisation; the Tibetan spellings are SOYL renderings to be checked in language review. No text is reproduced.
subject_id: cbse-12-tibetan
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-tibetan-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (assignment 10, speaking and listening 10; rapid-reading practice,
  fortnightly homework and monthly group discussion). Section A Grammar 15: rtags 'jug - classification and application
  of root and prefix letters; tenses (lessons 1-5). Section B Reading 10: a seen and an unseen passage from stories,
  notes and biographies (lesson 6). Section C Writing 20: report and bonafide letter (lessons 7-8) 10; techniques for
  writing prose and short stories (lessons 9-11) 10. Section D Literature 35: prose - the tale of the birds and the
  monkeys and Legs bshad blo gsar mig 'byed (lessons 12-15) 10; poetry - metaphor, abbreviated expression and
  exaggeration from Tshig rgyan rig pa'i sgo 'byed (lessons 16-18) 10; drama - Ri dvags kyi gtam nges 'byung gi pho nya
  by Rigzin Jigme Lingpa (lesson 19) 5; rapid reading - My Land and My People (lessons 20-24) 10. Board examination in
  Class XII.
