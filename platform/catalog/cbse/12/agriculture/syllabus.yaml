chapters:
  - id: cbse-12-agriculture-ch01
    number: 1
    title: "Employability Skills: Communication Skills – IV"
    unit: "Part A Unit 1: Communication Skills – IV"
    topics:
      - id: cbse-12-agriculture-ch01-t01
        title: Active listening at the workplace
        learning_outcomes:
          - Explain why active listening matters at work and list the barriers to it
          - Describe the steps of active listening and apply them in a role play
      - id: cbse-12-agriculture-ch01-t02
        title: Sentences and phrases; kinds and parts of a sentence
        learning_outcomes:
          - Distinguish a phrase from a sentence and classify sentences as declarative, interrogative, imperative or exclamatory
          - Identify the subject, predicate and object in a sentence
      - id: cbse-12-agriculture-ch01-t03
        title: Parts of speech and articles
        learning_outcomes:
          - Identify nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections in workplace sentences
          - Use the articles a, an and the correctly
      - id: cbse-12-agriculture-ch01-t04
        title: Constructing a paragraph
        learning_outcomes:
          - Write a well-organised paragraph with a topic sentence, supporting sentences and a conclusion on a subject-related theme
    removed_topics: []
    literature_texts: []
  - id: cbse-12-agriculture-ch02
    number: 2
    title: "Employability Skills: Self-Management Skills – IV"
    unit: "Part A Unit 2: Self-Management Skills – IV"
    topics:
      - id: cbse-12-agriculture-ch02-t01
        title: Motivation and self-motivation
        learning_outcomes:
          - Explain internal and external motivation and list personal needs and desires that drive motivation
      - id: cbse-12-agriculture-ch02-t02
        title: Sources of motivation and a positive outlook
        learning_outcomes:
          - Identify sources of inspiration (people, books, music, activities) and techniques to stay positive and focused on goals
      - id: cbse-12-agriculture-ch02-t03
        title: "Personality: meaning, influence and traits"
        learning_outcomes:
          - Define personality and explain how it influences others at work
          - Describe the five basic personality traits (openness, conscientiousness, extraversion, agreeableness, neuroticism)
      - id: cbse-12-agriculture-ch02-t04
        title: Personality disorders and how to overcome them
        learning_outcomes:
          - >-
            Describe common personality disorders (paranoid, antisocial, schizoid, borderline, narcissistic, avoidant, dependent, obsessive)
            and the clusters they belong to
          - Suggest steps to seek help and overcome personality problems
    removed_topics: []
    literature_texts: []
  - id: cbse-12-agriculture-ch03
    number: 3
    title: "Employability Skills: ICT Skills – IV"
    unit: "Part A Unit 3: ICT Skills – IV"
    topics:
      - id: cbse-12-agriculture-ch03-t01
        title: "Spreadsheet basics: workbook, worksheet and data entry"
        learning_outcomes:
          - Name common spreadsheet applications and create, open and save a workbook
          - Enter text and numbers, resize fonts and apply styles
      - id: cbse-12-agriculture-ch03-t02
        title: Editing and organising spreadsheet data
        learning_outcomes:
          - Copy and move cell data, sort data and apply filters to a table
      - id: cbse-12-agriculture-ch03-t03
        title: Formulas, functions, protection and printing
        learning_outcomes:
          - Use elementary formulas and functions such as SUM, AVERAGE, MIN and MAX
          - Protect a spreadsheet with a password, print it and save it in different formats
      - id: cbse-12-agriculture-ch03-t04
        title: Creating a presentation
        learning_outcomes:
          - Name presentation software packages and list features of a good presentation
          - Create a presentation and add or delete slides
      - id: cbse-12-agriculture-ch03-t05
        title: Editing and formatting presentations
        learning_outcomes:
          - Enter, edit and format text, insert clipart and images, choose slide layouts, and save and print a presentation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-agriculture-ch04
    number: 4
    title: "Employability Skills: Entrepreneurial Skills – IV"
    unit: "Part A Unit 4: Entrepreneurial Skills – IV"
    topics:
      - id: cbse-12-agriculture-ch04-t01
        title: Barriers to becoming an entrepreneur
        learning_outcomes:
          - Classify barriers to entrepreneurship (environmental, personal, financial, social) with examples and ways to overcome them
      - id: cbse-12-agriculture-ch04-t02
        title: Behavioural and entrepreneurial competencies
        learning_outcomes:
          - >-
            Describe competencies such as adaptability, decisiveness, initiative, perseverance, interpersonal and organisational skills,
            stress management and valuing service and diversity
      - id: cbse-12-agriculture-ch04-t03
        title: Entrepreneurial competencies in particular
        learning_outcomes:
          - >-
            Explain self-confidence, seeing and acting on opportunities, concern for quality, goal setting, risk taking, problem solving,
            systematic planning, information seeking, persistence, negotiating and team building
      - id: cbse-12-agriculture-ch04-t04
        title: Self-assessment of entrepreneurial behaviour
        learning_outcomes:
          - Rate oneself on behavioural competencies and prepare a personal competency profile
          - Relate competencies to stories of successful Indian entrepreneurs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-agriculture-ch05
    number: 5
    title: "Employability Skills: Green Skills – IV"
    unit: "Part A Unit 5: Green Skills – IV"
    topics:
      - id: cbse-12-agriculture-ch05-t01
        title: Green jobs in homes, gardening, transport and energy conservation
        learning_outcomes:
          - Explain the role of green jobs in toxin-free homes, organic gardening, public transport and energy conservation
      - id: cbse-12-agriculture-ch05-t02
        title: Green jobs in water, renewable energy and waste
        learning_outcomes:
          - Describe green jobs in water conservation, solar and wind power, and waste reduction, reuse and recycling
      - id: cbse-12-agriculture-ch05-t03
        title: Green jobs in tourism, construction and appropriate technology
        learning_outcomes:
          - Give examples of green jobs in green tourism, building and construction and appropriate technology
      - id: cbse-12-agriculture-ch05-t04
        title: Role of green jobs in protecting the environment
        learning_outcomes:
          - >-
            Explain how green jobs improve energy and raw-material use, limit greenhouse-gas emissions, minimise waste and pollution,
            restore ecosystems and support adaptation to climate change
    removed_topics: []
    literature_texts: []
  - id: cbse-12-agriculture-ch06
    number: 6
    title: Advanced Crop Production
    unit: "Part B Section I: Advanced Crop Production and Organic Farming"
    topics:
      - id: cbse-12-agriculture-ch06-t01
        title: Food production and nutritional security
        learning_outcomes:
          - Explain the importance of food and horticultural crop production for the economy and nutritional security
      - id: cbse-12-agriculture-ch06-t02
        title: Soil fertility, productivity and essential plant nutrients
        learning_outcomes:
          - Distinguish soil fertility from productivity and classify essential plant nutrients into macro- and micronutrients
      - id: cbse-12-agriculture-ch06-t03
        title: Functions and deficiency symptoms of plant nutrients
        learning_outcomes:
          - Describe the roles of essential nutrients and identify deficiency symptoms such as nitrogen chlorosis
      - id: cbse-12-agriculture-ch06-t04
        title: Soil sampling, soil pH and organic carbon
        learning_outcomes:
          - Describe the procedure of soil sampling and processing and the importance of soil pH and organic carbon
      - id: cbse-12-agriculture-ch06-t05
        title: Manures, fertilisers, bio-fertilisers and integrated nutrient management
        learning_outcomes:
          - Compare manures, fertilisers and bio-fertilisers, their methods of application and the concept of INM
      - id: cbse-12-agriculture-ch06-t06
        title: Irrigation methods and precision irrigation
        learning_outcomes:
          - Explain soil-moisture availability and compare surface, drip and sprinkler irrigation
      - id: cbse-12-agriculture-ch06-t07
        title: Insect pest and disease management
        learning_outcomes:
          - Compare chemical, biological and mechanical pest control and explain integrated pest management
    removed_topics: []
    literature_texts: []
  - id: cbse-12-agriculture-ch07
    number: 7
    title: Organic Farming
    unit: "Part B Section I: Advanced Crop Production and Organic Farming"
    topics:
      - id: cbse-12-agriculture-ch07-t01
        title: Concept, history and importance of organic farming
        learning_outcomes:
          - Define organic farming and explain its principles and benefits
      - id: cbse-12-agriculture-ch07-t02
        title: Status of organic farming in India
        learning_outcomes:
          - Describe the present status of organic farming, organically grown foods and its contribution to the economy
      - id: cbse-12-agriculture-ch07-t03
        title: Government schemes for organic farming and kitchen gardening
        learning_outcomes:
          - Identify government schemes promoting organic farming and plan a kitchen garden
    removed_topics: []
    literature_texts: []
  - id: cbse-12-agriculture-ch08
    number: 8
    title: Post-Harvest Management
    unit: "Part B Section II: Post-Harvest Management, Food Processing and Value Addition"
    topics:
      - id: cbse-12-agriculture-ch08-t01
        title: Post-harvest handling of fruits, vegetables and flowers
        learning_outcomes:
          - Explain harvesting, grading, packing, storage and transport practices that reduce post-harvest losses of perishables
      - id: cbse-12-agriculture-ch08-t02
        title: Post-harvest management of cereals, pulses and oilseeds
        learning_outcomes:
          - Describe drying, cleaning and safe storage of grains and oilseeds
      - id: cbse-12-agriculture-ch08-t03
        title: Status of food processing and government schemes for the food sector
        learning_outcomes:
          - Describe the status of food processing in India and schemes such as Mega Food Parks
    removed_topics: []
    literature_texts: []
  - id: cbse-12-agriculture-ch09
    number: 9
    title: Food Processing and Value Addition
    unit: "Part B Section II: Post-Harvest Management, Food Processing and Value Addition"
    topics:
      - id: cbse-12-agriculture-ch09-t01
        title: Principles and methods of food processing and preservation
        learning_outcomes:
          - >-
            State the principles of food preservation and compare methods such as drying, canning, freezing and use of sugar, salt and
            chemicals
      - id: cbse-12-agriculture-ch09-t02
        title: Value-added products from fruits, vegetables, cereals and oilseeds
        learning_outcomes:
          - Describe preparation of jam, jelly, ketchup, murabba, pickle and marmalade and common problems in jelly making
          - Distinguish cereal products made by puffing and flaking
      - id: cbse-12-agriculture-ch09-t03
        title: Packaging, quality standards and marketing
        learning_outcomes:
          - Explain packaging, quality standards and domestic and export marketing of processed foods
      - id: cbse-12-agriculture-ch09-t04
        title: Processed flower products
        learning_outcomes:
          - Describe flower harvesting, processed flower products, packaging and marketing
      - id: cbse-12-agriculture-ch09-t05
        title: Safe food and food regulations
        learning_outcomes:
          - Explain the concept of safe food and the role of FSSAI and food laws
    removed_topics: []
    literature_texts: []
  - id: cbse-12-agriculture-ch10
    number: 10
    title: Subsidiary Enterprises in Agriculture
    unit: "Part B Section III: Subsidiary Enterprises of Agriculture"
    topics:
      - id: cbse-12-agriculture-ch10-t01
        title: Agriculture-based subsidiary enterprises
        learning_outcomes:
          - Explain the socio-economic importance of subsidiary enterprises based on agriculture and horticulture
      - id: cbse-12-agriculture-ch10-t02
        title: Mushroom cultivation
        learning_outcomes:
          - Describe the nutritional value of mushrooms and the steps of mushroom production
      - id: cbse-12-agriculture-ch10-t03
        title: Beekeeping
        learning_outcomes:
          - Explain beekeeping and the uses of honey, wax and royal jelly
      - id: cbse-12-agriculture-ch10-t04
        title: Landscaping, lawns and avenue gardens
        learning_outcomes:
          - Describe the development and maintenance of lawns and avenue gardens
      - id: cbse-12-agriculture-ch10-t05
        title: Bio-pesticides, compost and vermicompost
        learning_outcomes:
          - Describe the preparation of plant-based bio-pesticides, compost and vermicompost
      - id: cbse-12-agriculture-ch10-t06
        title: Nurseries and marketing of saplings
        learning_outcomes:
          - Explain how to set up a nursery, market saplings and use government support schemes
    removed_topics: []
    literature_texts: []
