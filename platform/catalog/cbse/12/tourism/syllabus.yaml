    topics:
      - id: cbse-12-tourism-ch11-t01
        title: Types of cost and the concept of tour costing
        learning_outcomes:
          - Define fixed and variable, direct and indirect costs used in tour costing
      - id: cbse-12-tourism-ch11-t02
        title: Components of tour cost and the cost sheet
        learning_outcomes:
          - Prepare a cost sheet for a package tour from its components
      - id: cbse-12-tourism-ch11-t03
        title: Pricing a package tour and pricing strategies
        learning_outcomes:
          - Price a package tour and compare traditional and recent pricing strategies
    removed_topics: []
    literature_texts: []
