    topics:
      - id: cbse-12-tourism-ch10-t01
        title: Types and components of tour packages
        learning_outcomes:
          - Classify tour packages and identify their components
      - id: cbse-12-tourism-ch10-t02
        title: Customised, tailor-made and group inclusive tours
        learning_outcomes:
          - Explain how tailor-made packages and group inclusive tours are developed
      - id: cbse-12-tourism-ch10-t03
        title: Tour formulation and brochure design
        learning_outcomes:
          - Describe the tour design process and create a promotional tour brochure
      - id: cbse-12-tourism-ch10-t04
        title: Tour programming
        learning_outcomes:
          - Explain the role of tour programming in adding value to a package
