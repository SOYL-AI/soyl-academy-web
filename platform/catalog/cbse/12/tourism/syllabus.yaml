        learning_outcomes:
          - Identify Ministry of Tourism schemes and policies that support travel businesses
      - id: cbse-12-tourism-ch12-t04
        title: Professional bodies and their activities
        learning_outcomes:
          - Describe the roles, functions and objectives of national and international bodies such as TAAI, IATO, IATA and UNWTO
