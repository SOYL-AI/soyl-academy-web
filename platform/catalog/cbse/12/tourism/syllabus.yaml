    title: Transport Network
    unit: "Part B Unit 3: Transport Network"
    topics:
      - id: cbse-12-tourism-ch08-t01
        title: Transport and tourism
        learning_outcomes:
          - Explain the importance of transport in tourism and the relationship between them
      - id: cbse-12-tourism-ch08-t02
        title: Air transport
        learning_outcomes:
          - Describe the evolution and categories of air transport
      - id: cbse-12-tourism-ch08-t03
        title: Rail and road transport
        learning_outcomes:
          - Explain the importance and challenges of rail transport, national highway development phases, car rental and coach travel
      - id: cbse-12-tourism-ch08-t04
        title: Shipping, cruises and mass transportation
        learning_outcomes:
          - Describe cruise tourism, major cruise lines, Indian waterways and the significance of mass transport
    removed_topics: []
    literature_texts: []
  - id: cbse-12-tourism-ch09
    number: 9
    title: Itinerary Planning
    unit: "Part B Unit 4: Itinerary Planning"
    topics:
      - id: cbse-12-tourism-ch09-t01
        title: Meaning and features of an itinerary
        learning_outcomes:
          - Define an itinerary and list its features
      - id: cbse-12-tourism-ch09-t02
        title: Types of itineraries and planning procedure
        learning_outcomes:
          - Explain types of itineraries, prerequisites, step-by-step planning and dos and don'ts
      - id: cbse-12-tourism-ch09-t03
        title: Package or inclusive tours
        learning_outcomes:
          - Explain what a package tour includes
    removed_topics: []
    literature_texts: []
