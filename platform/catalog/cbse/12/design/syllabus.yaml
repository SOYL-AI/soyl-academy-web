    number: 7
    title: Design Tools and Techniques
    unit: "Part B Unit 2: Design Tools and Techniques"
    topics:
      - id: cbse-12-design-ch07-t01
        title: Basic materials and their properties
        learning_outcomes:
          - Categorise basic materials, their forms, sources and properties
      - id: cbse-12-design-ch07-t02
        title: Working on basic materials
        learning_outcomes:
          - Describe tools and methods for working with basic materials
      - id: cbse-12-design-ch07-t03
        title: Production processes in textile and wood industries
        learning_outcomes:
          - Describe basic production processes in the textile and wood industries
      - id: cbse-12-design-ch07-t04
        title: Production processes in metal and plastic industries
        learning_outcomes:
          - Describe basic production processes in the metal and plastic industries
    removed_topics: []
    literature_texts: []
  - id: cbse-12-design-ch08
