    title: Occupational Health and Safety
    unit: "Part B Unit 3: Occupational Health and Safety"
    topics:
      - id: cbse-12-design-ch08-t01
        title: Health and safety responsibilities in metal and plastic industries
        learning_outcomes:
          - Explain safety and health responsibilities of employers and workers
      - id: cbse-12-design-ch08-t02
        title: Safety inspection
        learning_outcomes:
          - Explain the role of safety inspections in industry
      - id: cbse-12-design-ch08-t03
        title: Hazard identification, risk assessment and control
        learning_outcomes:
          - Identify hazards and apply risk assessment and control measures
      - id: cbse-12-design-ch08-t04
        title: Dealing with emergencies
        learning_outcomes:
          - Describe emergency procedures in workshops and factories
    removed_topics: []
    literature_texts: []
  - id: cbse-12-design-ch09
    number: 9
    title: Practical Workshop
    unit: "Part B Unit 4: Practical Workshop"
    topics:
      - id: cbse-12-design-ch09-t01
        title: "Knowledge workshop: environmentally friendly design and design history"
        learning_outcomes:
          - Document environmentally friendly design and critique a past design movement or a complex product interface
      - id: cbse-12-design-ch09-t02
        title: Design concept workshops
        learning_outcomes:
          - Develop design concepts for the differently abled, sustainability and interface design
      - id: cbse-12-design-ch09-t03
        title: Product design workshop
        learning_outcomes:
          - Design products for children, senior citizens and from waste
      - id: cbse-12-design-ch09-t04
        title: Digital workshop
        learning_outcomes:
          - Use basic design software (Photoshop, Illustrator, InDesign) to digitise and prepare images
