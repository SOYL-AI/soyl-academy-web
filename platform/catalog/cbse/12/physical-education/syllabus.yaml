    topics:
      - id: cbse-12-physical-education-ch03-t01
        title: Obesity, diabetes, asthma, hypertension and back pain
        learning_outcomes:
          - State the procedure, benefits and contraindications of asanas for each lifestyle disease
    removed_topics: []
    literature_texts: []
  - id: cbse-12-physical-education-ch04
    number: 4
    title: Physical Education and Sports for CWSN
    unit: "Unit 4: Physical Education and Sports for CWSN"
    topics:
      - id: cbse-12-physical-education-ch04-t01
        title: Organisations promoting disability sports
        learning_outcomes:
          - Describe Special Olympics, Paralympics and Deaflympics
      - id: cbse-12-physical-education-ch04-t02
        title: Advantages of physical activity for CWSN; strategies
        learning_outcomes:
          - Explain strategies to make physical activity accessible
    removed_topics: []
    literature_texts: []
  - id: cbse-12-physical-education-ch05
    number: 5
    title: Sports and Nutrition
    unit: "Unit 5: Sports and Nutrition"
    topics:
      - id: cbse-12-physical-education-ch05-t01
        title: Concept of a balanced diet and nutrition
        learning_outcomes:
          - Explain macro- and micronutrients and a balanced diet
      - id: cbse-12-physical-education-ch05-t02
        title: Nutritive and non-nutritive components of diet
        learning_outcomes:
          - Distinguish nutritive and non-nutritive components
      - id: cbse-12-physical-education-ch05-t03
        title: Eating for weight control; food supplements
        learning_outcomes:
          - Explain healthy weight control and pitfalls of dieting and supplements
      - id: cbse-12-physical-education-ch05-t04
        title: "Importance of diet in sports: pre-, during and post-competition"
        learning_outcomes:
