chapters:
  - id: cbse-12-physical-education-ch01
    number: 1
    title: Management of Sporting Events
    unit: "Unit 1: Management of Sporting Events"
    topics:
      - id: cbse-12-physical-education-ch01-t01
        title: Functions of sports event management
        learning_outcomes:
          - Explain planning, organising, staffing, directing and controlling of events
      - id: cbse-12-physical-education-ch01-t02
        title: Committees and their responsibilities
        learning_outcomes:
          - List pre-, during- and post-event committees and their roles
      - id: cbse-12-physical-education-ch01-t03
        title: "Fixtures: knock-out and league"
        learning_outcomes:
          - Draw knock-out (bye, seeding) and league (cyclic, staircase) fixtures
      - id: cbse-12-physical-education-ch01-t04
        title: Intramural and extramural events; community sports programmes
        learning_outcomes:
          - Plan intramurals and community programmes such as sports day and health runs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-physical-education-ch02
    number: 2
    title: Children and Women in Sports
    unit: "Unit 2: Children and Women in Sports"
    topics:
      - id: cbse-12-physical-education-ch02-t01
        title: Exercise guidelines at different stages of growth
        learning_outcomes:
          - Recommend exercise for different age groups
      - id: cbse-12-physical-education-ch02-t02
        title: Common postural deformities and corrective measures
        learning_outcomes:
          - Identify knock knees, flat foot, round shoulders, lordosis, kyphosis, bow legs and scoliosis and suggest corrective exercises
      - id: cbse-12-physical-education-ch02-t03
        title: Women's participation in sports; special considerations
        learning_outcomes:
          - Explain sports participation of women in India and the female athlete triad
    removed_topics: []
    literature_texts: []
