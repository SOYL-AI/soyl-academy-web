    topics:
      - id: cbse-12-physical-education-ch08-t01
        title: Newton's laws of motion in sports
        learning_outcomes:
          - Apply Newton's laws to sports movements
      - id: cbse-12-physical-education-ch08-t02
        title: Types of levers and their application in sports
        learning_outcomes:
          - Classify levers with sports examples
      - id: cbse-12-physical-education-ch08-t03
        title: Equilibrium and centre of gravity
