exam_notes: >-
  Theory 70 marks (3 hours) + practical 30 (fitness test, sport skill, yoga, record and viva — not covered). Unit marks as printed: 5 (+4
  b*), 7, 6 (+1 b*), 4 (+4 b*), 7, 8, 4 (+4 b*), 10, 7, 9. Single board exam (February-March 2027).
