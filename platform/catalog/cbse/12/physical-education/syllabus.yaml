    topics:
      - id: cbse-12-physical-education-ch06-t01
        title: "Fitness tests: SAI Khelo India fitness test"
        learning_outcomes:
          - Describe and score fitness tests for school students
      - id: cbse-12-physical-education-ch06-t02
        title: Measurement of cardiovascular fitness and BMR; Rikli & Jones senior citizen test
        learning_outcomes:
          - Calculate fitness indices and BMR and describe the senior citizen fitness test
      - id: cbse-12-physical-education-ch06-t03
        title: Johnson–Methney test of motor educability
        learning_outcomes:
          - Describe the procedure and scoring of the Johnson–Methney test
    removed_topics: []
    literature_texts: []
