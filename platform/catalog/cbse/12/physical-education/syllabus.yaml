        title: Physiological factors determining fitness components
        learning_outcomes:
          - Explain physiological factors behind strength, speed, endurance and flexibility
      - id: cbse-12-physical-education-ch07-t02
        title: Effects of exercise on body systems
        learning_outcomes:
          - Explain effects of exercise on muscular, cardiovascular and respiratory systems
      - id: cbse-12-physical-education-ch07-t03
        title: Physiological changes due to ageing
        learning_outcomes:
          - Explain physiological changes due to ageing and the role of exercise
      - id: cbse-12-physical-education-ch07-t04
        title: "Sports injuries: classification, first aid and management"
        learning_outcomes:
          - Classify soft- and hard-tissue injuries and describe first aid (PRICE)
