        title: Personality and its types; motivation
        learning_outcomes:
          - Explain Jung's classification and the Big Five theory of personality and intrinsic and extrinsic motivation in sports
      - id: cbse-12-physical-education-ch09-t02
        title: Exercise adherence; aggression in sports
        learning_outcomes:
          - Explain reasons and strategies for exercise adherence and types of aggression
      - id: cbse-12-physical-education-ch09-t03
        title: Psychological attributes in sports
        learning_outcomes:
          - Explain self-esteem, mental imagery, self-talk and goal setting
