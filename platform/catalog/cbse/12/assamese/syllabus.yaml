# CBSE Class 12 Assamese (114), 2026-27. Sections, marks, writing tasks, grammar items and every
# prescribed lesson with its writer or poet (in Roman transliteration) from the CBSE 2026-27 Assamese XI-XII syllabus,
# Class XII. Books: Sahitya Sourav (Assam State Textbook Production and Publication Corporation,
# Guwahati) and Rachana Bichitra (Dharma Singha Deka, Assam Book Depot, Guwahati). Assamese-script titles are SOYL's
# rendering of CBSE's transliteration. Titles and authors only; no text is reproduced (CONTEXT §8).
subject_id: cbse-12-assamese
