exam_notes: >-
  Board theory 80 marks (3 hours) + internal assessment 20 (assignment 10, speaking and listening 10). Section A Reading 15: one unseen
  passage of at least 500 words with six 2-mark questions and three 1-mark grammar questions. Section B Writing 25: story or essay 5, report
  on a current topic 5, proverbs 5, expansion of an idea (bhab samprasaran) 5, sentences with idiomatic phrases 5x1. Section C Grammar 20:
  five items x 4. Section D Textbook: prose 10 and poetry 10, each one long answer 4, one short answer 2 and four very short answers x 1.
  Class XII: proverbs nos. 31-40; idiomatic phrases with bhat, bat, mati, mat, har; grammar - homophones, echo and imitative words, rules of
  sha and na (shatva and natva vidhi), krit and taddhit suffixes, direct and indirect speech.
