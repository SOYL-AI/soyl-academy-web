notes: >-
  34 questions. Part A (Partnership Firms and Companies, 60) is compulsory; Part B (20) has two options: (i) Analysis of Financial

  Statements and (ii) Computerised Accounting - the Computerised Accounting option still exists in 2026-27 (SQP Q27-34 alternative set).
  This

  blueprint models Part B = Analysis of Financial Statements (the option SOYL covers first); a Computerised Accounting variant has the same

  mark layout (4 x 1, 2 x 3, 1 x 4, 1 x 6) and needs its own blueprint once that option is catalogued. Marks: Q1-16 and Q27-30 one mark,

  Q17-20, Q31-32 three marks, Q21-22, Q33 four marks, Q23-26, Q34 six marks. Internal choice: two 3-mark (Q17, Q31), two 4-mark (Q21/22,

  Q33) and two 6-mark (Part A) questions. Competency weights (design table): remembering/understanding 40%, applying 30%,

  analysing/evaluating/creating 30%. FORMAT MAPPING: journal entries, ledger/capital/revaluation accounts, share-forfeiture entries,

  comparative/common-size statements, ratios and the cash flow statement (AS 3, indirect method) are mapped to short (3 marks) and long

  (4-6 marks) with the format in the model answer; the contract has no tabular/journal answer type with row-level step marks.
