  D (Q32, Q34), one in E (Q37). Programming answers must be in Python. The syllabus document prints no competency table. FORMAT MAPPING:

  write-the-output (1 mark) items are mapped to short (a code-output type with exact-match grading would make them auto-gradable);

  code-writing (Python functions, file handling, stack operations), SQL query-writing and query-output items and the network-design case

  (Section E) are mapped to short/long/case-based by marks - the contract has no code answer type and no table-output type.
