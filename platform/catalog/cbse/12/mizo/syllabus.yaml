    title_en: 'Grammar: prefix and suffix; double and adjectival adverbs; vocabulary enrichment'
    unit: Section A - Grammar
    topics:
      - id: cbse-12-mizo-ch01-t01
        title: Prefix leh suffix
        title_en: Prefix and suffix
        learning_outcomes:
          - Form Mizo words with prefixes and suffixes and explain their meaning
      - id: cbse-12-mizo-ch01-t02
        title: Double adverb leh adjectival adverb
        title_en: Double adverb and adjectival adverb
        learning_outcomes:
          - Identify and use double and adjectival adverbs in sentences
      - id: cbse-12-mizo-ch01-t03
        title: Tawng dang atanga thumal lak
        title_en: Vocabulary enrichment in Mizo from other languages
        learning_outcomes:
          - Give Mizo equivalents of borrowed words and recognise loanwords
