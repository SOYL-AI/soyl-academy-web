# CBSE Class 12 Mizo (198), 2026-27. Sections, marks, grammar items and lessons (titles and authors) as printed in the
# CBSE 2026-27 Mizo Classes XI-XII syllabus (Class XII page). Prescribed textbook: Mawmrang, published by the Expert
# Committee on Mizo Language (CBSE), revised edition 2022. Mizo is written in Roman script; Mizo headings for the language
# sections are SOYL wording. Lesson titles and authors only; no text is reproduced (CONTEXT §8).
subject_id: cbse-12-mizo
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-mizo-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20. Section A Grammar 20 (as printed; items total 15): prefix and
  suffix 2x2, vocabulary enrichment from other languages 7x1, double adverb / adjectival adverb 2x2. Section B Reading
  15: a suitable title 2, summary of text passages 2x4, comment on the style 5. Section C Composition and writing 15:
  idioms and phrases 7x1, a short history of Mizo literature 2x2, reports of events and incidents 2x2. Section D
  Literature 30 (book Mawmrang): poems 10 (reference to context 2x2, substance 4, general 2x1), prose 10 (words and
  phrases 5x1, general 5x2), fiction Chhingpuii 10 (6 objective, one long answer of 4). Board examination in Class XII.
units:
  - name: Section A - Grammar
    marks: 20
  - name: Section B - Reading
    marks: 15
  - name: Section C - Composition and writing
    marks: 15
  - name: Section D - Literature
    marks: 30
chapters:
