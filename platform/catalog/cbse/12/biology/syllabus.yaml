# CBSE Class 12 Biology (044), 2026-27. Chapters 1-13 as numbered in the CBSE syllabus (= rationalised NCERT Biology XII). Environmental Issues is CBSE reading material, formative only.
subject_id: cbse-12-biology
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-biology-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - cbse-sqp-xii-2026-27
  - cbse-sqp-notification-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  Theory 70 marks (3 hours) + practical 30 (major experiment 5, minor experiment 4, slide preparation 5, spotting 7, record and viva 4,
  investigatory project 5). Environmental Issues is formative only. Single board exam (February-March 2027).
units:
  - name: "Unit VI: Reproduction"
    marks: 16
  - name: "Unit VII: Genetics and Evolution"
    marks: 20
  - name: "Unit VIII: Biology and Human Welfare"
    marks: 12
  - name: "Unit IX: Biotechnology and its Applications"
    marks: 12
  - name: "Unit X: Ecology and Environment"
    marks: 10
chapters:
  - id: cbse-12-biology-ch01
    number: 1
    title: Sexual Reproduction in Flowering Plants
    unit: "Unit VI: Reproduction"
    topics:
      - id: cbse-12-biology-ch01-t01
        title: Flower structure; development of male and female gametophytes
        learning_outcomes:
          - Describe microsporogenesis and megasporogenesis and the structure of the embryo sac
      - id: cbse-12-biology-ch01-t02
        title: "Pollination: types, agencies and outbreeding devices"
        learning_outcomes:
          - Compare self- and cross-pollination and wind, water and insect pollination
          - Explain outbreeding devices and pollen–pistil interaction
      - id: cbse-12-biology-ch01-t03
        title: Double fertilisation and post-fertilisation events
        learning_outcomes:
          - Describe double fertilisation and development of endosperm, embryo, seed and fruit
      - id: cbse-12-biology-ch01-t04
        title: Apomixis, parthenocarpy and polyembryony
        learning_outcomes:
          - Explain special modes of reproduction and the significance of seed dispersal and fruit formation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-biology-ch02
    number: 2
    title: Human Reproduction
    unit: "Unit VI: Reproduction"
    topics:
      - id: cbse-12-biology-ch02-t01
        title: Male and female reproductive systems
        learning_outcomes:
          - Label and describe male and female reproductive organs and accessory glands
      - id: cbse-12-biology-ch02-t02
        title: Microscopic anatomy of testis and ovary; gametogenesis
        learning_outcomes:
          - Compare spermatogenesis and oogenesis
      - id: cbse-12-biology-ch02-t03
        title: Menstrual cycle
        learning_outcomes:
          - Explain the phases and hormonal control of the menstrual cycle
      - id: cbse-12-biology-ch02-t04
        title: Fertilisation, embryonic development and implantation
        learning_outcomes:
          - Trace events from fertilisation to blastocyst formation and implantation
      - id: cbse-12-biology-ch02-t05
        title: Pregnancy, placenta, parturition and lactation
        learning_outcomes:
          - Describe placenta formation, parturition and lactation (elementary)
    removed_topics: []
    literature_texts: []
  - id: cbse-12-biology-ch03
    number: 3
    title: Reproductive Health
    unit: "Unit VI: Reproduction"
    topics:
      - id: cbse-12-biology-ch03-t01
        title: Reproductive health and STDs
        learning_outcomes:
          - Explain the need for reproductive health and prevention of sexually transmitted diseases
      - id: cbse-12-biology-ch03-t02
        title: Population stabilisation and birth control
        learning_outcomes:
          - Compare natural, barrier, IUD, oral, injectable and surgical methods of contraception and MTP
      - id: cbse-12-biology-ch03-t03
        title: Amniocentesis; infertility and assisted reproductive technologies
        learning_outcomes:
          - Describe IVF, ZIFT and GIFT (elementary) and the misuse of amniocentesis
    removed_topics: []
    literature_texts: []
  - id: cbse-12-biology-ch04
    number: 4
    title: Principles of Inheritance and Variation
    unit: "Unit VII: Genetics and Evolution"
    topics:
      - id: cbse-12-biology-ch04-t01
        title: Mendelian inheritance
        learning_outcomes:
          - Explain Mendel's laws with monohybrid and dihybrid crosses and test crosses
      - id: cbse-12-biology-ch04-t02
        title: Deviations from Mendelism
        learning_outcomes:
          - Explain incomplete dominance, co-dominance, multiple alleles (ABO blood groups), pleiotropy and polygenic inheritance
      - id: cbse-12-biology-ch04-t03
        title: Chromosomal theory, linkage and crossing over
        learning_outcomes:
          - Explain the chromosome theory and Morgan's experiments on linkage
      - id: cbse-12-biology-ch04-t04
        title: Sex determination
        learning_outcomes:
          - Compare sex determination in humans, birds and honey bees
      - id: cbse-12-biology-ch04-t05
        title: Sex-linked inheritance and pedigree analysis
        learning_outcomes:
          - Analyse inheritance of haemophilia and colour blindness
      - id: cbse-12-biology-ch04-t06
        title: Mendelian and chromosomal disorders
        learning_outcomes:
          - Describe thalassemia, Down's, Turner's and Klinefelter's syndromes
    removed_topics: []
    literature_texts: []
  - id: cbse-12-biology-ch05
    number: 5
    title: Molecular Basis of Inheritance
    unit: "Unit VII: Genetics and Evolution"
    topics:
      - id: cbse-12-biology-ch05-t01
        title: Search for the genetic material; DNA as genetic material
        learning_outcomes:
          - Explain the Griffith, Avery and Hershey–Chase experiments
      - id: cbse-12-biology-ch05-t02
        title: Structure of DNA and RNA; DNA packaging
        learning_outcomes:
          - Describe the double helix and nucleosome packaging
      - id: cbse-12-biology-ch05-t03
        title: DNA replication
        learning_outcomes:
          - Explain semi-conservative replication and the Meselson–Stahl experiment
      - id: cbse-12-biology-ch05-t04
        title: Transcription, genetic code and translation
        learning_outcomes:
          - Explain the central dogma, features of the genetic code and the steps of translation
      - id: cbse-12-biology-ch05-t05
        title: "Regulation of gene expression: lac operon"
        learning_outcomes:
          - Explain induction and repression of the lac operon
      - id: cbse-12-biology-ch05-t06
        title: Human Genome Project and DNA fingerprinting
        learning_outcomes:
          - State the goals of genome projects and the principle and uses of DNA fingerprinting
    removed_topics: []
    literature_texts: []
  - id: cbse-12-biology-ch06
    number: 6
    title: Evolution
    unit: "Unit VII: Genetics and Evolution"
    topics:
      - id: cbse-12-biology-ch06-t01
        title: Origin of life and evidences of evolution
        learning_outcomes:
          - Explain the origin of life and palaeontological, anatomical, embryological and molecular evidence
      - id: cbse-12-biology-ch06-t02
        title: Darwin's theory and the modern synthetic theory
        learning_outcomes:
          - Explain natural selection, variation and adaptive radiation
      - id: cbse-12-biology-ch06-t03
        title: Mechanism of evolution and Hardy–Weinberg principle
        learning_outcomes:
          - Apply the Hardy–Weinberg principle and explain gene flow, genetic drift and types of natural selection
      - id: cbse-12-biology-ch06-t04
        title: Human evolution
        learning_outcomes:
          - Outline the stages of human evolution
    removed_topics: []
    literature_texts: []
  - id: cbse-12-biology-ch07
    number: 7
    title: Human Health and Disease
    unit: "Unit VIII: Biology and Human Welfare"
    topics:
      - id: cbse-12-biology-ch07-t01
        title: Common diseases in humans
        learning_outcomes:
          - >-
            Describe pathogens, symptoms and control of malaria, dengue, chikungunya, filariasis, ascariasis, typhoid, pneumonia, common
            cold, amoebiasis and ringworm
      - id: cbse-12-biology-ch07-t02
        title: Immunity and vaccines
        learning_outcomes:
          - Distinguish innate and acquired immunity and explain vaccination
      - id: cbse-12-biology-ch07-t03
        title: AIDS and cancer
        learning_outcomes:
          - Explain how HIV causes AIDS and the causes, detection and treatment of cancer
      - id: cbse-12-biology-ch07-t04
        title: Drugs and alcohol abuse in adolescence
        learning_outcomes:
          - Explain effects of drug and alcohol abuse and ways of prevention
    removed_topics: []
    literature_texts: []
  - id: cbse-12-biology-ch08
    number: 8
    title: Microbes in Human Welfare
    unit: "Unit VIII: Biology and Human Welfare"
    topics:
      - id: cbse-12-biology-ch08-t01
        title: Microbes in household products and industrial production
        learning_outcomes:
          - Give examples of microbes used for food, beverages, antibiotics, enzymes and bioactive molecules
      - id: cbse-12-biology-ch08-t02
        title: Microbes in sewage treatment and biogas production
        learning_outcomes:
          - Describe primary and secondary sewage treatment and biogas production
      - id: cbse-12-biology-ch08-t03
        title: Microbes as biocontrol agents and biofertilisers
        learning_outcomes:
          - Give examples of biocontrol agents and biofertilisers and explain judicious use of antibiotics
    removed_topics: []
    literature_texts: []
  - id: cbse-12-biology-ch09
    number: 9
    title: "Biotechnology: Principles and Processes"
    unit: "Unit IX: Biotechnology and its Applications"
    topics:
      - id: cbse-12-biology-ch09-t01
        title: Principles of biotechnology and tools of recombinant DNA technology
        learning_outcomes:
          - Explain restriction enzymes, cloning vectors and competent hosts
      - id: cbse-12-biology-ch09-t02
        title: Processes of recombinant DNA technology
        learning_outcomes:
          - Sequence isolation of DNA, PCR, ligation, transformation and downstream processing
    removed_topics: []
    literature_texts: []
  - id: cbse-12-biology-ch10
    number: 10
    title: Biotechnology and its Applications
    unit: "Unit IX: Biotechnology and its Applications"
    topics:
      - id: cbse-12-biology-ch10-t01
        title: "Applications in agriculture: Bt crops and RNAi"
        learning_outcomes:
          - Explain how Bt cotton and RNA interference protect crops
      - id: cbse-12-biology-ch10-t02
        title: Applications in medicine
        learning_outcomes:
          - Explain production of human insulin, gene therapy, stem cell technology and molecular diagnosis
      - id: cbse-12-biology-ch10-t03
        title: Transgenic animals
        learning_outcomes:
          - State uses of transgenic animals
      - id: cbse-12-biology-ch10-t04
        title: "Ethical issues: biosafety, biopiracy and patents"
        learning_outcomes:
          - Discuss biosafety, biopiracy and patent issues with Indian examples
    removed_topics: []
    literature_texts: []
  - id: cbse-12-biology-ch11
    number: 11
    title: Organisms and Populations
    unit: "Unit X: Ecology and Environment"
    topics:
      - id: cbse-12-biology-ch11-t01
        title: Population attributes
        learning_outcomes:
          - Describe birth rate, death rate, age pyramids and population density
      - id: cbse-12-biology-ch11-t02
        title: Population growth
        learning_outcomes:
          - Compare exponential and logistic growth models
      - id: cbse-12-biology-ch11-t03
        title: Population interactions
        learning_outcomes:
          - Explain mutualism, competition, predation and parasitism with examples
    removed_topics: []
    literature_texts: []
  - id: cbse-12-biology-ch12
    number: 12
    title: Ecosystem
    unit: "Unit X: Ecology and Environment"
    topics:
      - id: cbse-12-biology-ch12-t01
        title: Ecosystem structure and function
        learning_outcomes:
          - Describe components and patterns of an ecosystem
      - id: cbse-12-biology-ch12-t02
        title: Productivity and decomposition
        learning_outcomes:
          - Distinguish primary productivity types and explain decomposition steps
      - id: cbse-12-biology-ch12-t03
        title: Energy flow
        learning_outcomes:
          - Trace energy flow through food chains and webs
      - id: cbse-12-biology-ch12-t04
        title: Ecological pyramids
        learning_outcomes:
          - Construct and interpret pyramids of number, biomass and energy
    removed_topics: []
    literature_texts: []
  - id: cbse-12-biology-ch13
    number: 13
    title: Biodiversity and Conservation
    unit: "Unit X: Ecology and Environment"
    topics:
      - id: cbse-12-biology-ch13-t01
        title: "Biodiversity: concept, patterns and importance"
        learning_outcomes:
          - Explain levels and latitudinal patterns of biodiversity and species–area relationships
      - id: cbse-12-biology-ch13-t02
        title: Loss of biodiversity
        learning_outcomes:
          - Explain the causes of biodiversity loss ("evil quartet")
      - id: cbse-12-biology-ch13-t03
        title: Biodiversity conservation
        learning_outcomes:
          - >-
            Compare in-situ and ex-situ conservation: hotspots, biosphere reserves, national parks, sanctuaries, sacred groves, Ramsar sites
            and the Red Data Book
    removed_topics: []
    literature_texts: []
  - id: cbse-12-biology-ch14
    number: 14
    title: Environmental Issues (formative assessment only)
    unit: "Unit X: Ecology and Environment"
    board_assessed: false
    topics:
      - id: cbse-12-biology-ch14-t01
        title: Air and water pollution and their control
        learning_outcomes:
          - Explain sources and control of air and water pollution
      - id: cbse-12-biology-ch14-t02
        title: Solid wastes, agrochemicals and radioactive wastes
        learning_outcomes:
          - Describe effects and management of wastes and agrochemicals
      - id: cbse-12-biology-ch14-t03
        title: Greenhouse effect, global warming and ozone depletion
        learning_outcomes:
          - Explain the greenhouse effect and ozone depletion
      - id: cbse-12-biology-ch14-t04
        title: Degradation by improper resource use and deforestation
        learning_outcomes:
          - Explain consequences of deforestation and resource misuse
    removed_topics: []
    literature_texts: []
removed_topics:
  - Reproduction in Organisms; Strategies for Enhancement in Food Production (deleted from NCERT/CBSE syllabus)
