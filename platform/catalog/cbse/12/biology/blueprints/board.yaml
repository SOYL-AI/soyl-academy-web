notes: >-
  33 questions, five sections (16 x 1, 5 x 2, 7 x 3, 2 x 4 case-based, 3 x 5). Internal choice in the 2026-27 SQP: three Section B

  questions (Q17, Q20, Q21), none in Section C, one sub-part in each case-based question, all three Section E questions. Competency weights

  (design table): knowledge/understanding 50%, application 30%, analyse/evaluate/create 20%. Diagram-labelling and diagram-drawing items are

  mapped to short/long (no image-response type). Environmental Issues is formative only and excluded. Visually impaired candidates get
  substitute questions for items with visual input (not modelled).
