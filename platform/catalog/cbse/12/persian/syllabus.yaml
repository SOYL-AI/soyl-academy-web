    title: درک مطلب
    title_en: Reading comprehension (unseen passage)
    unit: 'بخش الف: درک مطلب'
    topics:
      - id: cbse-12-persian-ch01-t01
        title: متن ناخوانده (۱۵۰ واژه)
        title_en: Unseen passage of 150 words
        learning_outcomes:
          - Answer 3-4 short questions on an unseen Persian passage
          - Explain vocabulary from the passage and give it a suitable heading
    removed_topics: []
    literature_texts: []
