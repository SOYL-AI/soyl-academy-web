# CBSE Class 12 Persian (123), 2026-27. Sections, marks, grammar items, prescribed books and lesson titles as printed in
# the CBSE 2026-27 Persian Classes XI-XII syllabus (Class XII pages). Books: Farsi wa Dastoor Part I, Kitab-e-Awwal
# by Dr Zahra Khanlari (Idarah-e-Adabiyat-e-Delli) and Amoozish-e-Zaban-e-Farsi Book IV by Dr Yadullah Samareh (Al-Hoda;
# Iran Culture House, New Delhi). CBSE prints titles in transliteration; the Persian spellings here are SOYL transliterations
# back into Perso-Arabic script, to be checked in language review. Lesson titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-12-persian
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-persian-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (writing project on poets, writers and historical places 10; oral
  discussion, reading and recitation 5; speech, debate, extempore 5). Section A Reading 10: an unseen passage of 150
  words with 3-4 short questions 7, vocabulary 2, a suitable heading 1. Section B Writing 20: letter or essay 5;
  objective questions on the prescribed textbook 5; summary of a prescribed lesson in Urdu, English, Hindi or Persian
  10. Section C Applied grammar and translation 20: definitions with examples of preposition, verb, adverb, imperative,
  aorist (muzare) and conjugation, ism-e-fa'il and ism-e-maf'ul. Section D Literature (prose and poetry) 30. Board
  examination in Class XII.
units:
  - name: 'بخش الف: درک مطلب'
    marks: 10
  - name: 'بخش ب: مهارت‌های نگارش'
    marks: 20
  - name: 'بخش ج: دستور زبان کاربردی و ترجمه'
    marks: 20
  - name: 'بخش د: ادبیات (نثر و شعر)'
    marks: 30
chapters:
