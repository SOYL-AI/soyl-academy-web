# CBSE Class 12 National Cadet Corps (076), 2026-27. Theory 70 (Part I common 49 + Part II wing-specific 21) + practical 30. Students study one wing (Army, Navy or Air Force).
subject_id: cbse-12-ncc
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-ncc-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - cbse-sqp-xii-2026-27
exam_notes: >-
  Theory 70 marks (3 hours) + practical 30. Part I Common Subjects 49 (Sections A-C, compulsory) and Part II Specialised Subjects 21
  (Sections D-F) for the wing the cadet belongs to; the paper prints all three wings. Word limits: 2 marks 35 words, 4 marks 80 words, 6
  marks 150 words. Air Force units Aero Engines and Air Frames are deleted for 2026-27. Single board exam (February-March 2027).
units:
  - name: "Part I: Common Subjects"
    marks: 49
  - name: "Part II: Specialised Subjects (Army)"
    marks: 21
  - name: "Part II: Specialised Subjects (Navy)"
    marks: 21
  - name: "Part II: Specialised Subjects (Air Force)"
    marks: 21
