notes: >-
  Theory paper only (70 marks, 3 hours); practical 30 is assessed separately. Part I Common Subjects 49 (Sections A-C, compulsory) and Part
  II Specialised Subjects 21 (Sections D-F) for the candidate's wing; the SQP prints Army, Navy and Air Force versions and the candidate
  attempts one. Word limits: 2 marks 35 words, 4 marks 80 words, 6 marks 150 words. Section A: 11 one-mark items (9 MCQ, 1 assertion-reason,
  1 match). Section B: Q2-Q8 2 marks (choice in Q3, Q6, Q8); Q9-Q12 4 marks (choice in Q10, Q12). Section C: Q13 passage-based 2 marks; Q14
  passage-based 6 marks (2+2+2). Part II (Army version): Section D five 1-mark items (one assertion-reason); Section E 2-mark Q16-Q19
  (choice in Q16, Q19) and 4-mark Q20 (with choice); Section F Q21 passage-based 4 marks. FORMAT MAPPING: wing selection is not expressible
  in the Blueprint schema; sections D-F apply to whichever wing the student chose and the assembler must restrict them to that wing's
  chapters. The number of internal choices in Section E differs slightly by wing; the Army version is modelled. Match item modelled as type
  match.
