notes: >-
  Pattern from CBSE's Class XII Taxation SQP 2025-26 (CBSE notification 132/2026: no change in question-paper design for 2026-27). Theory 60
  marks; practical 40 marks is school/external practical, not modelled.

  Employability Skills questions (sections A-ES, B-ES) are drawn only from Part A chapters; sections A and B only from Part B chapters.

  Section A objective parts mix MCQ, fill-in-the-blank, true/false, one-word and match items within one "answer any n of m" question; all
  are mapped to mcq (the dominant form) - the assembler may substitute fill-blank/true-false/match at 1 mark.

  Computation of total income, deductions and tax liability, TDS and advance-tax instalments, and IGST/CGST/SGST calculations are multi-step
  computations in 3-4 mark answers; mapped to short/long (no tax-computation question type).
