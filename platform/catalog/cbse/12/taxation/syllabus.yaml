chapters:
  - id: cbse-12-taxation-ch01
    number: 1
    title: "Employability Skills: Communication Skills – IV"
    unit: "Part A Unit 1: Communication Skills – IV"
    topics:
      - id: cbse-12-taxation-ch01-t01
        title: Active listening at the workplace
        learning_outcomes:
          - Explain why active listening matters at work and list the barriers to it
          - Describe the steps of active listening and apply them in a role play
      - id: cbse-12-taxation-ch01-t02
        title: Sentences and phrases; kinds and parts of a sentence
        learning_outcomes:
          - Distinguish a phrase from a sentence and classify sentences as declarative, interrogative, imperative or exclamatory
          - Identify the subject, predicate and object in a sentence
      - id: cbse-12-taxation-ch01-t03
        title: Parts of speech and articles
        learning_outcomes:
          - Identify nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections in workplace sentences
          - Use the articles a, an and the correctly
      - id: cbse-12-taxation-ch01-t04
        title: Constructing a paragraph
        learning_outcomes:
          - Write a well-organised paragraph with a topic sentence, supporting sentences and a conclusion on a subject-related theme
    removed_topics: []
    literature_texts: []
  - id: cbse-12-taxation-ch02
    number: 2
    title: "Employability Skills: Self-Management Skills – IV"
    unit: "Part A Unit 2: Self-Management Skills – IV"
    topics:
      - id: cbse-12-taxation-ch02-t01
        title: Motivation and self-motivation
        learning_outcomes:
          - Explain internal and external motivation and list personal needs and desires that drive motivation
      - id: cbse-12-taxation-ch02-t02
        title: Sources of motivation and a positive outlook
        learning_outcomes:
          - Identify sources of inspiration (people, books, music, activities) and techniques to stay positive and focused on goals
      - id: cbse-12-taxation-ch02-t03
        title: "Personality: meaning, influence and traits"
        learning_outcomes:
          - Define personality and explain how it influences others at work
          - Describe the five basic personality traits (openness, conscientiousness, extraversion, agreeableness, neuroticism)
      - id: cbse-12-taxation-ch02-t04
        title: Personality disorders and how to overcome them
        learning_outcomes:
          - >-
            Describe common personality disorders (paranoid, antisocial, schizoid, borderline, narcissistic, avoidant, dependent, obsessive)
            and the clusters they belong to
          - Suggest steps to seek help and overcome personality problems
    removed_topics: []
    literature_texts: []
  - id: cbse-12-taxation-ch03
    number: 3
    title: "Employability Skills: ICT Skills – IV"
    unit: "Part A Unit 3: ICT Skills – IV"
    topics:
      - id: cbse-12-taxation-ch03-t01
        title: "Spreadsheet basics: workbook, worksheet and data entry"
        learning_outcomes:
          - Name common spreadsheet applications and create, open and save a workbook
          - Enter text and numbers, resize fonts and apply styles
      - id: cbse-12-taxation-ch03-t02
        title: Editing and organising spreadsheet data
        learning_outcomes:
          - Copy and move cell data, sort data and apply filters to a table
      - id: cbse-12-taxation-ch03-t03
        title: Formulas, functions, protection and printing
        learning_outcomes:
          - Use elementary formulas and functions such as SUM, AVERAGE, MIN and MAX
          - Protect a spreadsheet with a password, print it and save it in different formats
      - id: cbse-12-taxation-ch03-t04
        title: Creating a presentation
        learning_outcomes:
          - Name presentation software packages and list features of a good presentation
          - Create a presentation and add or delete slides
      - id: cbse-12-taxation-ch03-t05
        title: Editing and formatting presentations
        learning_outcomes:
          - Enter, edit and format text, insert clipart and images, choose slide layouts, and save and print a presentation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-taxation-ch04
    number: 4
    title: "Employability Skills: Entrepreneurial Skills – IV"
    unit: "Part A Unit 4: Entrepreneurial Skills – IV"
    topics:
      - id: cbse-12-taxation-ch04-t01
        title: Barriers to becoming an entrepreneur
        learning_outcomes:
          - Classify barriers to entrepreneurship (environmental, personal, financial, social) with examples and ways to overcome them
      - id: cbse-12-taxation-ch04-t02
        title: Behavioural and entrepreneurial competencies
        learning_outcomes:
          - >-
            Describe competencies such as adaptability, decisiveness, initiative, perseverance, interpersonal and organisational skills,
            stress management and valuing service and diversity
      - id: cbse-12-taxation-ch04-t03
        title: Entrepreneurial competencies in particular
        learning_outcomes:
          - >-
            Explain self-confidence, seeing and acting on opportunities, concern for quality, goal setting, risk taking, problem solving,
            systematic planning, information seeking, persistence, negotiating and team building
      - id: cbse-12-taxation-ch04-t04
        title: Self-assessment of entrepreneurial behaviour
        learning_outcomes:
          - Rate oneself on behavioural competencies and prepare a personal competency profile
          - Relate competencies to stories of successful Indian entrepreneurs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-taxation-ch05
    number: 5
    title: "Employability Skills: Green Skills – IV"
    unit: "Part A Unit 5: Green Skills – IV"
    topics:
      - id: cbse-12-taxation-ch05-t01
        title: Green jobs in homes, gardening, transport and energy conservation
        learning_outcomes:
          - Explain the role of green jobs in toxin-free homes, organic gardening, public transport and energy conservation
      - id: cbse-12-taxation-ch05-t02
        title: Green jobs in water, renewable energy and waste
        learning_outcomes:
          - Describe green jobs in water conservation, solar and wind power, and waste reduction, reuse and recycling
      - id: cbse-12-taxation-ch05-t03
        title: Green jobs in tourism, construction and appropriate technology
        learning_outcomes:
          - Give examples of green jobs in green tourism, building and construction and appropriate technology
      - id: cbse-12-taxation-ch05-t04
        title: Role of green jobs in protecting the environment
        learning_outcomes:
          - >-
            Explain how green jobs improve energy and raw-material use, limit greenhouse-gas emissions, minimise waste and pollution,
            restore ecosystems and support adaptation to climate change
    removed_topics: []
    literature_texts: []
  - id: cbse-12-taxation-ch06
    number: 6
    title: Deductions from Gross Total Income
    unit: "Part B Unit 1: Deductions from Gross Total Income"
    topics:
      - id: cbse-12-taxation-ch06-t01
        title: Rules governing deductions
        learning_outcomes:
          - Explain gross total income and the general rules for deductions under Chapter VI-A
      - id: cbse-12-taxation-ch06-t02
        title: Deductions for payments (80C to 80GGC)
        learning_outcomes:
          - Compute deductions for investments, insurance premia, medical insurance, donations and political contributions
      - id: cbse-12-taxation-ch06-t03
        title: Deductions for certain incomes (80-IA to 80P)
        learning_outcomes:
          - Outline deductions in respect of certain incomes of businesses and co-operatives
      - id: cbse-12-taxation-ch06-t04
        title: Other deductions (80QQB, 80RRB, 80TTA, 80U)
        learning_outcomes:
          - Compute deductions for royalty, patents, savings bank interest and disability
    removed_topics: []
    literature_texts: []
  - id: cbse-12-taxation-ch07
    number: 7
    title: Computation of Tax Liability of an Individual
    unit: "Part B Unit 2: Computation of Tax Liability of an Individual"
    topics:
      - id: cbse-12-taxation-ch07-t01
        title: Rules for computing tax liability
        learning_outcomes:
          - Explain the steps from gross total income to total income and tax payable
      - id: cbse-12-taxation-ch07-t02
        title: Tax slabs, rebate and cess
        learning_outcomes:
          - Apply current slab rates, rebate and health and education cess to compute tax
      - id: cbse-12-taxation-ch07-t03
        title: Practical computation problems
        learning_outcomes:
          - Compute total income and tax liability of a salaried or business individual
      - id: cbse-12-taxation-ch07-t04
        title: Comparing tax regimes
        learning_outcomes:
          - Compare tax payable under the old and new regimes for a given case
    removed_topics: []
    literature_texts: []
  - id: cbse-12-taxation-ch08
    number: 8
    title: TDS and Advance Payment of Tax
    unit: "Part B Unit 3: TDS and Advance Payment of Tax"
    topics:
      - id: cbse-12-taxation-ch08-t01
        title: Collection and recovery of income tax
        learning_outcomes:
          - Describe the ways in which income tax is collected and recovered
      - id: cbse-12-taxation-ch08-t02
        title: Tax deducted at source
        learning_outcomes:
          - Explain TDS provisions for different incomes, lower or nil deduction, duties of deductors and rights of taxpayers
      - id: cbse-12-taxation-ch08-t03
        title: Advance tax and presumptive taxation
        learning_outcomes:
          - Calculate advance-tax instalments by due date and explain the presumptive taxation scheme
      - id: cbse-12-taxation-ch08-t04
        title: Role of the assessing officer
        learning_outcomes:
          - Describe the role of the assessing officer in TDS and advance tax
    removed_topics: []
    literature_texts: []
  - id: cbse-12-taxation-ch09
    number: 9
    title: Goods and Services Tax (GST)
    unit: "Part B Unit 4: Goods and Services Tax (GST)"
    topics:
      - id: cbse-12-taxation-ch09-t01
        title: Indirect taxes before GST
        learning_outcomes:
          - Identify indirect taxes subsumed by GST on 1 July 2017
      - id: cbse-12-taxation-ch09-t02
        title: Meaning, objectives and features of GST
        learning_outcomes:
          - Explain the objectives and features of the CGST and SGST Acts
      - id: cbse-12-taxation-ch09-t03
        title: Dual GST and IGST calculation
        learning_outcomes:
          - Calculate CGST, SGST and IGST on intra-state and inter-state supplies
      - id: cbse-12-taxation-ch09-t04
        title: Advantages, challenges and GST returns
        learning_outcomes:
          - Evaluate the advantages and challenges of GST and identify types of GST returns
    removed_topics: []
    literature_texts: []
removed_topics: []
