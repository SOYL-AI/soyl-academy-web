exam_notes: >-
  Total 100 = theory 60 + practical 40 (practical work includes Hindi dictation and transcription on computer; split as per CBSE
  skill-subject practical guidelines). Part A Employability Skills 10 marks, Part B subject-specific skills 50 marks (the 2026-27 syllabus
  gives no unit-wise marks for Part B). Theory paper 60 marks, 3 hours: Section A objective 30 (Employability Skills 4 of 6 + subject 26
  from 5 questions with internal choice); Section B subjective 30 (Employability Skills 3 of 5 x 2; subject 3 of 5 x 2, 2 of 3 x 3, 3 of 5 x
  4). Single board exam (February-March 2027). UNVERIFIED chapter list: the CBSE 2026-27 Class XII Shorthand (Hindi) syllabus PDF is a
  scanned image with no extractable text (no OCR available on the build machine). The six Part B units here are inferred from the six-unit
  Class XII SQP blueprint and its question content, mirroring Shorthand (English) 825; unit-wise marks are unknown. Re-check against the
  PDF.
