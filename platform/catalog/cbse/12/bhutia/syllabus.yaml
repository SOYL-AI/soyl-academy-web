# CBSE Class 12 Bhutia (195), 2026-27. Sections, marks, topics and lessons as printed in the CBSE 2026-27 Bhutia Class
# XII syllabus. CBSE prints every Bhutia term in romanisation; Tibetan-script (Sikkimese Bhutia) spellings are SOYL
# renderings only where SOYL could identify the item with confidence, and are to be checked in language review; all other
# items keep CBSE's romanisation (the script CBSE uses). Books are the Sikkim Government Bhutia textbooks (CBSE does not
# name them). No text is reproduced (CONTEXT §8).
subject_id: cbse-12-bhutia
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-bhutia-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (periodic test 10, subject enrichment 5, class work and activities
  5). Part A objective: A Reading 10 (two unseen passages, 5 MCQs each); B Applied grammar 5 MCQs; C Literature 5 MCQs.
  Part B descriptive: D Writing 15 - composition 5, letter 5, application 5; E Textbook 45 - grammar short answers 2x5;
  poetry/textbook short answers 2x5; verses (tshig chey) long answer 5 and very short answers 5x1; rapid reader Dowa
  Zangmo namthar short answers 2x5 and very short answers 5x1. Board examination in Class XII.
