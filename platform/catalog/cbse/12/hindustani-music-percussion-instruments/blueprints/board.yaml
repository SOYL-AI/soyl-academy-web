notes: >-
  Theory paper only (30 marks, 2 hours); practical 70 assessed separately. 15 questions: Section A 8 MCQs x 1 (includes match-the-list and
  two-statement items); Section B 5 x 2, every question with an A/B internal choice; Section C 2 x 6, each with an A/B internal choice (some
  split 2+2+2 or 3+3). FORMAT MAPPING: 6-mark questions often ask for a composition, tala or theka written in notation (Carnatic or
  Bhatkhande notation, layakari in dugun/tigun/chaugun); modelled as long, but notation writing needs a music-notation answer type and
  human/AI evaluation. Match-the-list items are modelled as mcq (single correct code option).
