exam_notes: >-
  Theory 30 marks (2 hours) + practical 70. Theory paper (CBSE 2026-27 SQP): Section A 8 MCQs x 1; Section B 5 short answers x 2, each with
  an internal choice; Section C 3 long answers x 6, attempt any two. The practical (tatkar in teen taal and jhap taal with dugun and
  chougun, vandana, thaat, aamad, tukda-toda, tihaayi, gatnikas, gatbhav, parhant) is marked board_assessed: false here. The CBSE dance
  document's page headers still say 2025-26, but it is the 2026-27 file (each page is stamped 2026-27). Single board exam (February-March
  2027).
