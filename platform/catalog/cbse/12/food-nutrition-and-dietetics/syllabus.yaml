exam_notes: >-
  Total 100 = theory 60 + practical 40 (viva on project 10, practical file/presentation 15, skill demonstration 15). Part A Employability
  Skills 10 marks, Part B subject-specific skills 50 marks. Theory paper 60 marks, 3 hours: Section A objective 30 (Employability Skills 4
  of 6 + subject 26 from 5 questions with internal choice); Section B subjective 30 (Employability Skills 3 of 5 x 2; subject 3 of 5 x 2, 2
  of 3 x 3, 3 of 5 x 4). Single board exam (February-March 2027). UNVERIFIED topics for Units 1-3: the extracted text of the 2026-27
  syllabus PDF lacks the detailed sub-units for Units 1-3 (only 3.4 celiac disease, lactose intolerance and peptic ulcer survive); their
  topics are inferred from the unit titles and the diseases tested in the 2025-26 SQP (fever and typhoid, diarrhoea, jaundice, obesity,
  diabetes, hypertension, renal and cardiovascular disease, enteral and parenteral feeding). Unit 4 is verified.
