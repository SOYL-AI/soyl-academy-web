chapters:
  - id: cbse-12-food-nutrition-and-dietetics-ch01
    number: 1
    title: "Employability Skills: Communication Skills – IV"
    unit: "Part A Unit 1: Communication Skills – IV"
    topics:
      - id: cbse-12-food-nutrition-and-dietetics-ch01-t01
        title: Active listening at the workplace
        learning_outcomes:
          - Explain why active listening matters at work and list the barriers to it
          - Describe the steps of active listening and apply them in a role play
      - id: cbse-12-food-nutrition-and-dietetics-ch01-t02
        title: Sentences and phrases; kinds and parts of a sentence
        learning_outcomes:
          - Distinguish a phrase from a sentence and classify sentences as declarative, interrogative, imperative or exclamatory
          - Identify the subject, predicate and object in a sentence
      - id: cbse-12-food-nutrition-and-dietetics-ch01-t03
        title: Parts of speech and articles
        learning_outcomes:
          - Identify nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections in workplace sentences
          - Use the articles a, an and the correctly
      - id: cbse-12-food-nutrition-and-dietetics-ch01-t04
        title: Constructing a paragraph
        learning_outcomes:
          - Write a well-organised paragraph with a topic sentence, supporting sentences and a conclusion on a subject-related theme
    removed_topics: []
    literature_texts: []
  - id: cbse-12-food-nutrition-and-dietetics-ch02
    number: 2
    title: "Employability Skills: Self-Management Skills – IV"
    unit: "Part A Unit 2: Self-Management Skills – IV"
    topics:
      - id: cbse-12-food-nutrition-and-dietetics-ch02-t01
        title: Motivation and self-motivation
        learning_outcomes:
          - Explain internal and external motivation and list personal needs and desires that drive motivation
      - id: cbse-12-food-nutrition-and-dietetics-ch02-t02
        title: Sources of motivation and a positive outlook
        learning_outcomes:
          - Identify sources of inspiration (people, books, music, activities) and techniques to stay positive and focused on goals
      - id: cbse-12-food-nutrition-and-dietetics-ch02-t03
        title: "Personality: meaning, influence and traits"
        learning_outcomes:
          - Define personality and explain how it influences others at work
          - Describe the five basic personality traits (openness, conscientiousness, extraversion, agreeableness, neuroticism)
      - id: cbse-12-food-nutrition-and-dietetics-ch02-t04
        title: Personality disorders and how to overcome them
        learning_outcomes:
          - >-
            Describe common personality disorders (paranoid, antisocial, schizoid, borderline, narcissistic, avoidant, dependent, obsessive)
            and the clusters they belong to
          - Suggest steps to seek help and overcome personality problems
    removed_topics: []
    literature_texts: []
  - id: cbse-12-food-nutrition-and-dietetics-ch03
    number: 3
    title: "Employability Skills: ICT Skills – IV"
    unit: "Part A Unit 3: ICT Skills – IV"
    topics:
      - id: cbse-12-food-nutrition-and-dietetics-ch03-t01
        title: "Spreadsheet basics: workbook, worksheet and data entry"
        learning_outcomes:
          - Name common spreadsheet applications and create, open and save a workbook
          - Enter text and numbers, resize fonts and apply styles
      - id: cbse-12-food-nutrition-and-dietetics-ch03-t02
        title: Editing and organising spreadsheet data
        learning_outcomes:
          - Copy and move cell data, sort data and apply filters to a table
      - id: cbse-12-food-nutrition-and-dietetics-ch03-t03
        title: Formulas, functions, protection and printing
        learning_outcomes:
          - Use elementary formulas and functions such as SUM, AVERAGE, MIN and MAX
          - Protect a spreadsheet with a password, print it and save it in different formats
      - id: cbse-12-food-nutrition-and-dietetics-ch03-t04
        title: Creating a presentation
        learning_outcomes:
          - Name presentation software packages and list features of a good presentation
          - Create a presentation and add or delete slides
      - id: cbse-12-food-nutrition-and-dietetics-ch03-t05
        title: Editing and formatting presentations
        learning_outcomes:
          - Enter, edit and format text, insert clipart and images, choose slide layouts, and save and print a presentation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-food-nutrition-and-dietetics-ch04
    number: 4
    title: "Employability Skills: Entrepreneurial Skills – IV"
    unit: "Part A Unit 4: Entrepreneurial Skills – IV"
    topics:
      - id: cbse-12-food-nutrition-and-dietetics-ch04-t01
        title: Barriers to becoming an entrepreneur
        learning_outcomes:
          - Classify barriers to entrepreneurship (environmental, personal, financial, social) with examples and ways to overcome them
      - id: cbse-12-food-nutrition-and-dietetics-ch04-t02
        title: Behavioural and entrepreneurial competencies
        learning_outcomes:
          - >-
            Describe competencies such as adaptability, decisiveness, initiative, perseverance, interpersonal and organisational skills,
            stress management and valuing service and diversity
      - id: cbse-12-food-nutrition-and-dietetics-ch04-t03
        title: Entrepreneurial competencies in particular
        learning_outcomes:
          - >-
            Explain self-confidence, seeing and acting on opportunities, concern for quality, goal setting, risk taking, problem solving,
            systematic planning, information seeking, persistence, negotiating and team building
      - id: cbse-12-food-nutrition-and-dietetics-ch04-t04
        title: Self-assessment of entrepreneurial behaviour
        learning_outcomes:
          - Rate oneself on behavioural competencies and prepare a personal competency profile
          - Relate competencies to stories of successful Indian entrepreneurs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-food-nutrition-and-dietetics-ch05
    number: 5
    title: "Employability Skills: Green Skills – IV"
    unit: "Part A Unit 5: Green Skills – IV"
    topics:
      - id: cbse-12-food-nutrition-and-dietetics-ch05-t01
        title: Green jobs in homes, gardening, transport and energy conservation
        learning_outcomes:
          - Explain the role of green jobs in toxin-free homes, organic gardening, public transport and energy conservation
      - id: cbse-12-food-nutrition-and-dietetics-ch05-t02
        title: Green jobs in water, renewable energy and waste
        learning_outcomes:
          - Describe green jobs in water conservation, solar and wind power, and waste reduction, reuse and recycling
      - id: cbse-12-food-nutrition-and-dietetics-ch05-t03
        title: Green jobs in tourism, construction and appropriate technology
        learning_outcomes:
          - Give examples of green jobs in green tourism, building and construction and appropriate technology
      - id: cbse-12-food-nutrition-and-dietetics-ch05-t04
        title: Role of green jobs in protecting the environment
        learning_outcomes:
          - >-
            Explain how green jobs improve energy and raw-material use, limit greenhouse-gas emissions, minimise waste and pollution,
            restore ecosystems and support adaptation to climate change
    removed_topics: []
    literature_texts: []
  - id: cbse-12-food-nutrition-and-dietetics-ch06
    number: 6
    title: Clinical and Therapeutic Nutrition
    unit: "Part B Unit 1: Clinical and Therapeutic Nutrition"
    topics:
      - id: cbse-12-food-nutrition-and-dietetics-ch06-t01
        title: Role of the dietitian and nutrition care process
        learning_outcomes:
          - Describe the role of a clinical dietitian and the steps of nutritional assessment and care
      - id: cbse-12-food-nutrition-and-dietetics-ch06-t02
        title: Therapeutic modification of the normal diet
        learning_outcomes:
          - Modify a normal diet in consistency, frequency, foodstuffs, nutrients and cooking methods
      - id: cbse-12-food-nutrition-and-dietetics-ch06-t03
        title: "Hospital diets: clear liquid, full liquid, soft and regular"
        learning_outcomes:
          - Distinguish routine hospital diets and their uses
      - id: cbse-12-food-nutrition-and-dietetics-ch06-t04
        title: Enteral and parenteral nutrition
        learning_outcomes:
          - Explain enteral (tube) feeding and parenteral nutrition and when each is used
    removed_topics: []
    literature_texts: []
  - id: cbse-12-food-nutrition-and-dietetics-ch07
    number: 7
    title: Diet in Health and Disease I
    unit: "Part B Unit 2: Diet in Health and Disease I"
    topics:
      - id: cbse-12-food-nutrition-and-dietetics-ch07-t01
        title: Fevers including typhoid
        learning_outcomes:
          - Explain causes, metabolic changes and dietary management of acute and chronic fevers such as typhoid
      - id: cbse-12-food-nutrition-and-dietetics-ch07-t02
        title: Diarrhoea and constipation
        learning_outcomes:
          - Plan dietary management for diarrhoea, including ORS, and for constipation
      - id: cbse-12-food-nutrition-and-dietetics-ch07-t03
        title: "Liver disorders: jaundice and hepatitis"
        learning_outcomes:
          - Explain causes, symptoms and dietary management of jaundice and hepatitis
      - id: cbse-12-food-nutrition-and-dietetics-ch07-t04
        title: "Weight imbalance: obesity and underweight"
        learning_outcomes:
          - Explain causes and health risks of obesity and underweight and plan suitable diets
    removed_topics: []
    literature_texts: []
  - id: cbse-12-food-nutrition-and-dietetics-ch08
    number: 8
    title: Diet in Health and Disease II
    unit: "Part B Unit 3: Diet in Health and Disease II"
    topics:
      - id: cbse-12-food-nutrition-and-dietetics-ch08-t01
        title: Diabetes mellitus
        learning_outcomes:
          - Explain types, symptoms and dietary management of diabetes, including glycaemic index and meal planning
      - id: cbse-12-food-nutrition-and-dietetics-ch08-t02
        title: Hypertension and cardiovascular disease
        learning_outcomes:
          - Plan low-sodium and heart-healthy diets for hypertension and cardiovascular disease
      - id: cbse-12-food-nutrition-and-dietetics-ch08-t03
        title: Renal disorders
        learning_outcomes:
          - Explain dietary modifications in common kidney disorders
      - id: cbse-12-food-nutrition-and-dietetics-ch08-t04
        title: Celiac disease, lactose intolerance and peptic ulcer
        learning_outcomes:
          - Explain causes and dietary management of celiac disease, lactose intolerance and peptic ulcer
    removed_topics: []
    literature_texts: []
  - id: cbse-12-food-nutrition-and-dietetics-ch09
    number: 9
    title: Food Safety and Quality Control
    unit: "Part B Unit 4: Food Safety and Quality Control"
    topics:
      - id: cbse-12-food-nutrition-and-dietetics-ch09-t01
        title: Food hazards and food-borne diseases
        learning_outcomes:
          - Classify physical, chemical and biological hazards and explain causes and prevention of cholera, typhoid and salmonellosis
      - id: cbse-12-food-nutrition-and-dietetics-ch09-t02
        title: Personal, food and environmental hygiene
        learning_outcomes:
          - Describe personal hygiene, food hygiene and sanitation, safe water supply and waste disposal at home
      - id: cbse-12-food-nutrition-and-dietetics-ch09-t03
        title: Food adulteration
        learning_outcomes:
          - Identify common adulterants and their ill effects (metanil yellow, argemone, kesari dal) and simple home tests
      - id: cbse-12-food-nutrition-and-dietetics-ch09-t04
        title: FSSAI Act 2006 and food labels
        learning_outcomes:
          - Explain the FSSAI Act 2006 and read a food label
      - id: cbse-12-food-nutrition-and-dietetics-ch09-t05
        title: HFSS foods and child health
        learning_outcomes:
          - Explain the implications of foods high in fat, salt and sugar for child health
    removed_topics: []
