# CBSE Class 12 Food Nutrition and Dietetics (834), 2026-27 skill subject. Built from the CBSE 2026-27 skill curriculum; theory component only (practical work is listed in exam_notes).
subject_id: cbse-12-food-nutrition-and-dietetics
