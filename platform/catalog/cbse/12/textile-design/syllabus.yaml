chapters:
  - id: cbse-12-textile-design-ch01
    number: 1
    title: "Employability Skills: Communication Skills – IV"
    unit: "Part A Unit 1: Communication Skills – IV"
    topics:
      - id: cbse-12-textile-design-ch01-t01
        title: Active listening at the workplace
        learning_outcomes:
          - Explain why active listening matters at work and list the barriers to it
          - Describe the steps of active listening and apply them in a role play
      - id: cbse-12-textile-design-ch01-t02
        title: Sentences and phrases; kinds and parts of a sentence
        learning_outcomes:
          - Distinguish a phrase from a sentence and classify sentences as declarative, interrogative, imperative or exclamatory
          - Identify the subject, predicate and object in a sentence
      - id: cbse-12-textile-design-ch01-t03
        title: Parts of speech and articles
        learning_outcomes:
          - Identify nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections in workplace sentences
          - Use the articles a, an and the correctly
      - id: cbse-12-textile-design-ch01-t04
        title: Constructing a paragraph
        learning_outcomes:
          - Write a well-organised paragraph with a topic sentence, supporting sentences and a conclusion on a subject-related theme
    removed_topics: []
    literature_texts: []
  - id: cbse-12-textile-design-ch02
    number: 2
    title: "Employability Skills: Self-Management Skills – IV"
    unit: "Part A Unit 2: Self-Management Skills – IV"
    topics:
      - id: cbse-12-textile-design-ch02-t01
        title: Motivation and self-motivation
        learning_outcomes:
          - Explain internal and external motivation and list personal needs and desires that drive motivation
      - id: cbse-12-textile-design-ch02-t02
        title: Sources of motivation and a positive outlook
        learning_outcomes:
          - Identify sources of inspiration (people, books, music, activities) and techniques to stay positive and focused on goals
      - id: cbse-12-textile-design-ch02-t03
        title: "Personality: meaning, influence and traits"
        learning_outcomes:
          - Define personality and explain how it influences others at work
          - Describe the five basic personality traits (openness, conscientiousness, extraversion, agreeableness, neuroticism)
      - id: cbse-12-textile-design-ch02-t04
        title: Personality disorders and how to overcome them
        learning_outcomes:
          - >-
            Describe common personality disorders (paranoid, antisocial, schizoid, borderline, narcissistic, avoidant, dependent, obsessive)
            and the clusters they belong to
          - Suggest steps to seek help and overcome personality problems
    removed_topics: []
    literature_texts: []
  - id: cbse-12-textile-design-ch03
    number: 3
    title: "Employability Skills: ICT Skills – IV"
    unit: "Part A Unit 3: ICT Skills – IV"
    topics:
      - id: cbse-12-textile-design-ch03-t01
        title: "Spreadsheet basics: workbook, worksheet and data entry"
        learning_outcomes:
          - Name common spreadsheet applications and create, open and save a workbook
          - Enter text and numbers, resize fonts and apply styles
      - id: cbse-12-textile-design-ch03-t02
        title: Editing and organising spreadsheet data
        learning_outcomes:
          - Copy and move cell data, sort data and apply filters to a table
      - id: cbse-12-textile-design-ch03-t03
        title: Formulas, functions, protection and printing
        learning_outcomes:
          - Use elementary formulas and functions such as SUM, AVERAGE, MIN and MAX
          - Protect a spreadsheet with a password, print it and save it in different formats
      - id: cbse-12-textile-design-ch03-t04
        title: Creating a presentation
        learning_outcomes:
          - Name presentation software packages and list features of a good presentation
          - Create a presentation and add or delete slides
      - id: cbse-12-textile-design-ch03-t05
        title: Editing and formatting presentations
        learning_outcomes:
          - Enter, edit and format text, insert clipart and images, choose slide layouts, and save and print a presentation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-textile-design-ch04
    number: 4
    title: "Employability Skills: Entrepreneurial Skills – IV"
    unit: "Part A Unit 4: Entrepreneurial Skills – IV"
    topics:
      - id: cbse-12-textile-design-ch04-t01
        title: Barriers to becoming an entrepreneur
        learning_outcomes:
          - Classify barriers to entrepreneurship (environmental, personal, financial, social) with examples and ways to overcome them
      - id: cbse-12-textile-design-ch04-t02
        title: Behavioural and entrepreneurial competencies
        learning_outcomes:
          - >-
            Describe competencies such as adaptability, decisiveness, initiative, perseverance, interpersonal and organisational skills,
            stress management and valuing service and diversity
      - id: cbse-12-textile-design-ch04-t03
        title: Entrepreneurial competencies in particular
        learning_outcomes:
          - >-
            Explain self-confidence, seeing and acting on opportunities, concern for quality, goal setting, risk taking, problem solving,
            systematic planning, information seeking, persistence, negotiating and team building
      - id: cbse-12-textile-design-ch04-t04
        title: Self-assessment of entrepreneurial behaviour
        learning_outcomes:
          - Rate oneself on behavioural competencies and prepare a personal competency profile
          - Relate competencies to stories of successful Indian entrepreneurs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-textile-design-ch05
    number: 5
    title: "Employability Skills: Green Skills – IV"
    unit: "Part A Unit 5: Green Skills – IV"
    topics:
      - id: cbse-12-textile-design-ch05-t01
        title: Green jobs in homes, gardening, transport and energy conservation
        learning_outcomes:
          - Explain the role of green jobs in toxin-free homes, organic gardening, public transport and energy conservation
      - id: cbse-12-textile-design-ch05-t02
        title: Green jobs in water, renewable energy and waste
        learning_outcomes:
          - Describe green jobs in water conservation, solar and wind power, and waste reduction, reuse and recycling
      - id: cbse-12-textile-design-ch05-t03
        title: Green jobs in tourism, construction and appropriate technology
        learning_outcomes:
          - Give examples of green jobs in green tourism, building and construction and appropriate technology
      - id: cbse-12-textile-design-ch05-t04
        title: Role of green jobs in protecting the environment
        learning_outcomes:
          - >-
            Explain how green jobs improve energy and raw-material use, limit greenhouse-gas emissions, minimise waste and pollution,
            restore ecosystems and support adaptation to climate change
    removed_topics: []
    literature_texts: []
  - id: cbse-12-textile-design-ch06
    number: 6
    title: "Introduction to Chemical Processing: Pre-treatments"
    unit: "Part B Units 1-3: Chemical Processing, Dyeing and Printing"
    topics:
      - id: cbse-12-textile-design-ch06-t01
        title: Textile chemical processing and impurities in fibres
        learning_outcomes:
          - Explain chemical processing and identify impurities in natural and synthetic fibres
      - id: cbse-12-textile-design-ch06-t02
        title: Singeing and desizing
        learning_outcomes:
          - Describe singeing and desizing and why they are done
      - id: cbse-12-textile-design-ch06-t03
        title: Scouring, bleaching and mercerising
        learning_outcomes:
          - Describe scouring, bleaching and mercerising and their effects on fabric
    removed_topics: []
    literature_texts: []
  - id: cbse-12-textile-design-ch07
    number: 7
    title: Textile Dyeing
    unit: "Part B Units 1-3: Chemical Processing, Dyeing and Printing"
    topics:
      - id: cbse-12-textile-design-ch07-t01
        title: Traditional resist-dyed textiles of India
        learning_outcomes:
          - Identify tie-and-dye textiles such as bandhani and leheriya from different regions
      - id: cbse-12-textile-design-ch07-t02
        title: Classes of dyes
        learning_outcomes:
          - Explain direct, acid, basic, vat, azoic, sulphur and disperse dyes
      - id: cbse-12-textile-design-ch07-t03
        title: Selecting dyes and dyeing methods
        learning_outcomes:
          - Match dye classes to natural and man-made fibres and select dyeing methods
    removed_topics: []
    literature_texts: []
  - id: cbse-12-textile-design-ch08
    number: 8
    title: Textile Printing
    unit: "Part B Units 1-3: Chemical Processing, Dyeing and Printing"
    topics:
      - id: cbse-12-textile-design-ch08-t01
        title: Methods of printing
        learning_outcomes:
          - Compare hand-block, hand-screen, roller and heat-transfer printing and their limitations
      - id: cbse-12-textile-design-ch08-t02
        title: Regional hand-block printing styles
        learning_outcomes:
          - Identify regional block-printing styles of India
      - id: cbse-12-textile-design-ch08-t03
        title: Styles of printing
        learning_outcomes:
          - Identify direct, discharge, resist, warp, blotch and duplex prints by their features
    removed_topics: []
    literature_texts: []
  - id: cbse-12-textile-design-ch09
    number: 9
    title: Introduction to Print Design and Print Design Techniques
    unit: "Part B Units 4-5: Print Design and Embroidered Textiles"
    topics:
      - id: cbse-12-textile-design-ch09-t01
        title: Colour wheel, layout and repeats
        learning_outcomes:
          - Use the colour wheel and identify layouts and repeats in textile design
      - id: cbse-12-textile-design-ch09-t02
        title: Print categories
        learning_outcomes:
          - Identify geometric, floral, animal, ethnic and dot prints
      - id: cbse-12-textile-design-ch09-t03
        title: Print design techniques
        learning_outcomes:
          - Describe etching, stamping and sponge, dry-brush, stencil and collage techniques
    removed_topics: []
    literature_texts: []
  - id: cbse-12-textile-design-ch10
    number: 10
    title: Embroidered Textiles
    unit: "Part B Units 4-5: Print Design and Embroidered Textiles"
    topics:
      - id: cbse-12-textile-design-ch10-t01
        title: Embroidery for value addition
        learning_outcomes:
          - Explain embroidery as a value-addition technique
      - id: cbse-12-textile-design-ch10-t02
        title: Kashida and phulkari
        learning_outcomes:
          - Describe origin, technique, materials, colours, motifs and layout of kashida of Kashmir and phulkari of Punjab
      - id: cbse-12-textile-design-ch10-t03
        title: Kantha and chikankari
        learning_outcomes:
          - Describe origin, technique, materials, colours, motifs and layout of kantha of West Bengal and chikankari of Uttar Pradesh
