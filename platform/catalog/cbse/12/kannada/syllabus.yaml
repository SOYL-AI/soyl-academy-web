# CBSE Class 12 Kannada (115), 2026-27. Every prescribed poem and prose lesson (in
# Roman transliteration, without authors except the long prose text), the poets for the outline history of Kannada
# literature, grammar items and writing tasks, from the CBSE 2026-27 Kannada XI-XII syllabus, Class XII.
# Books: Sahitya Sampada (textbook) and Pallava (abhyasa pustaka) for the class, Department of Pre-University
# Education, Karnataka; references Kannada Sahitya Charitre and Kannada Sahityada Itihasa (R. S. Mugali, Sahitya
# Akademi). Kannada-script titles are SOYL's rendering of CBSE's transliteration. The syllabus prints no section marks; units follow the CBSE 2026-27 Class XII Kannada sample paper. Titles only; no text is
# reproduced (CONTEXT §8).
subject_id: cbse-12-kannada
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-kannada-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - cbse-sqp-xii-kannada-2026-27
exam_notes: >-
  Board theory 80 marks (3 hours) + internal assessment 20 (listening - questionnaire on stories, speeches or audio-visual clips; speaking -
  pick and speak and prepared elocution of 2-3 minutes; project work such as a neighbourhood survey, role play, case study or interview).
  Sample-paper pattern: Section A Reading 10 - two unseen passages 5x1 each. Section B Grammar 16 - MCQs 10x1 and grammar items 6x1. Section
  C Seen passages 14 - poem extract 5x1, prose extracts 5x1 and 4x1. Section D 40 - textbook questions, the long prose text, history of
  literature, essay and letter.
