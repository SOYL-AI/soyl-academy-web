exam_notes: >-
  No CBSE board exam: assessed by the school (internal assessment, reported as a grade), so every chapter is board_assessed: false. HPE
  strands: Games/Sports 50 marks (90 periods), Health and Fitness 25 (50 periods), SEWA 25 (50 periods, graded separately as Work
  Experience), Health and Activity Card (no marks, 10 periods). Fitness assessment follows the Khelo India battery.
