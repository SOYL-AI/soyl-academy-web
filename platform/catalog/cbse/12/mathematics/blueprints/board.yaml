notes: >-
  38 questions, five sections: A 18 MCQ + 2 assertion-reason (1 mark), B 5 VSA (2), C 6 SA (3), D 4 LA (5), E 3 case-study (4, three

  sub-parts). Internal choice: 2 questions in B, 3 in C, 2 in D and one sub-part in 2 case studies. Competency weights from the design
  table:

  remembering/understanding 44 marks (55%), applying 20 (25%), analysing/evaluating/creating 16 (20%). Calculators not allowed. LPP

  (graphical) and area-by-integration items need a drawn graph; mapped to short/long with the graph in the model answer. Visually impaired
  candidates get substitute questions for items with visual input (not modelled).

  Applied Mathematics (241) is a different paper: see 12/applied-mathematics/blueprints/board.yaml.
