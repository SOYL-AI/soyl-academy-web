# CBSE Class 12 Psychology (037), 2026-27. Seven units = seven NCERT chapters.
subject_id: cbse-12-psychology
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-psychology-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - cbse-sqp-xii-2026-27
  - cbse-sqp-notification-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  Theory 70 marks (3 hours) + practical 30 (practical file and case profile 10, viva 5, two psychological tests 15). Single board exam
  (February-March 2027).
units:
  - name: "Unit I: Variations in Psychological Attributes"
    marks: 13
  - name: "Unit II: Self and Personality"
    marks: 13
  - name: "Unit III: Meeting Life Challenges"
    marks: 9
  - name: "Unit IV: Psychological Disorders"
    marks: 12
  - name: "Unit V: Therapeutic Approaches"
    marks: 9
  - name: "Unit VI: Attitude and Social Cognition"
    marks: 8
  - name: "Unit VII: Social Influence and Group Processes"
    marks: 6
chapters:
  - id: cbse-12-psychology-ch01
    number: 1
    title: Variations in Psychological Attributes
    unit: "Unit I: Variations in Psychological Attributes"
    topics:
      - id: cbse-12-psychology-ch01-t01
        title: Individual differences and assessment of psychological attributes
        learning_outcomes:
          - Explain individual differences and methods of psychological assessment
      - id: cbse-12-psychology-ch01-t02
        title: Theories of intelligence
        learning_outcomes:
          - Compare psychometric theories, the PASS model, Sternberg's triarchic theory and Gardner's multiple intelligences
      - id: cbse-12-psychology-ch01-t03
        title: Individual differences in intelligence; culture and intelligence
        learning_outcomes:
          - Interpret IQ classifications and explain cultural views of intelligence including Indian traditions
      - id: cbse-12-psychology-ch01-t04
        title: Emotional intelligence
        learning_outcomes:
          - Explain the characteristics of emotionally intelligent persons
      - id: cbse-12-psychology-ch01-t05
        title: Aptitude and creativity
        learning_outcomes:
          - Distinguish aptitude, interest and creativity and how they are measured
    removed_topics: []
    literature_texts: []
  - id: cbse-12-psychology-ch02
    number: 2
    title: Self and Personality
    unit: "Unit II: Self and Personality"
    topics:
      - id: cbse-12-psychology-ch02-t01
        title: Concept of self; cognitive and behavioural aspects; culture and self
        learning_outcomes:
          - Explain self-esteem, self-efficacy and self-regulation and cultural views of self
      - id: cbse-12-psychology-ch02-t02
        title: Type and trait approaches
        learning_outcomes:
          - Compare type theories and trait theories (Allport, Cattell, Eysenck, Big Five)
      - id: cbse-12-psychology-ch02-t03
        title: Psychodynamic, behavioural, cultural and humanistic approaches
        learning_outcomes:
          - Explain Freud's theory and post-Freudian, behavioural, cultural and humanistic approaches
      - id: cbse-12-psychology-ch02-t04
        title: Assessment of personality
        learning_outcomes:
          - Compare self-report measures, projective techniques and behavioural analysis
    removed_topics: []
    literature_texts: []
  - id: cbse-12-psychology-ch03
    number: 3
    title: Meeting Life Challenges
    unit: "Unit III: Meeting Life Challenges"
    topics:
      - id: cbse-12-psychology-ch03-t01
        title: Nature, types and sources of stress
        learning_outcomes:
          - Classify stressors and types of stress
      - id: cbse-12-psychology-ch03-t02
        title: Effects of stress on health; General Adaptation Syndrome
        learning_outcomes:
          - Explain GAS and the link between stress and the immune system
      - id: cbse-12-psychology-ch03-t03
        title: Coping with stress and stress-management techniques
        learning_outcomes:
          - Compare coping strategies and techniques such as relaxation and meditation
      - id: cbse-12-psychology-ch03-t04
        title: Promoting positive health and well-being; life skills
        learning_outcomes:
          - Describe life skills and factors of positive health
    removed_topics: []
    literature_texts: []
  - id: cbse-12-psychology-ch04
    number: 4
    title: Psychological Disorders
    unit: "Unit IV: Psychological Disorders"
    topics:
      - id: cbse-12-psychology-ch04-t01
        title: Concepts of abnormality; classification
        learning_outcomes:
          - Explain criteria of abnormality and classification systems (DSM/ICD)
      - id: cbse-12-psychology-ch04-t02
        title: Factors underlying abnormal behaviour
        learning_outcomes:
          - Explain biological, psychological and socio-cultural models
      - id: cbse-12-psychology-ch04-t03
        title: Major psychological disorders
        learning_outcomes:
          - >-
            Describe anxiety, OCD, trauma-related, somatic, dissociative, depressive, bipolar, schizophrenia-spectrum, neurodevelopmental,
            conduct, eating and substance-related disorders
    removed_topics: []
    literature_texts: []
  - id: cbse-12-psychology-ch05
    number: 5
    title: Therapeutic Approaches
    unit: "Unit V: Therapeutic Approaches"
    topics:
      - id: cbse-12-psychology-ch05-t01
        title: Nature and process of psychotherapy; therapeutic relationship
        learning_outcomes:
          - Explain the goals of psychotherapy and the therapeutic relationship
      - id: cbse-12-psychology-ch05-t02
        title: Types of therapies
        learning_outcomes:
          - Compare behaviour, cognitive, humanistic-existential and alternative therapies
      - id: cbse-12-psychology-ch05-t03
        title: Factors in healing, ethics and rehabilitation
        learning_outcomes:
          - Explain factors contributing to healing, ethics in psychotherapy and rehabilitation of the mentally ill
    removed_topics: []
    literature_texts: []
  - id: cbse-12-psychology-ch06
    number: 6
    title: Attitude and Social Cognition
    unit: "Unit VI: Attitude and Social Cognition"
    topics:
      - id: cbse-12-psychology-ch06-t01
        title: Explaining social behaviour; nature and components of attitudes
        learning_outcomes:
          - Explain the ABC components of attitudes
      - id: cbse-12-psychology-ch06-t02
        title: Attitude formation and change; attitude–behaviour relationship
        learning_outcomes:
          - Explain how attitudes form and change
      - id: cbse-12-psychology-ch06-t03
        title: Prejudice, discrimination and strategies for handling prejudice
        learning_outcomes:
          - Explain sources of prejudice and strategies to reduce it
    removed_topics: []
    literature_texts: []
  - id: cbse-12-psychology-ch07
    number: 7
    title: Social Influence and Group Processes
    unit: "Unit VII: Social Influence and Group Processes"
    topics:
      - id: cbse-12-psychology-ch07-t01
        title: Nature, formation and types of groups
        learning_outcomes:
          - Explain why people join groups and stages of group formation
      - id: cbse-12-psychology-ch07-t02
        title: "Influence of groups on behaviour: social loafing and group polarisation"
        learning_outcomes:
          - Explain social loafing and group polarisation with examples
    removed_topics: []
    literature_texts: []
