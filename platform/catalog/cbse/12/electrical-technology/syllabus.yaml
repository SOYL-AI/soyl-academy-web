chapters:
  - id: cbse-12-electrical-technology-ch01
    number: 1
    title: "Employability Skills: Communication Skills – IV"
    unit: "Part A Unit 1: Communication Skills – IV"
    topics:
      - id: cbse-12-electrical-technology-ch01-t01
        title: Active listening at the workplace
        learning_outcomes:
          - Explain why active listening matters at work and list the barriers to it
          - Describe the steps of active listening and apply them in a role play
      - id: cbse-12-electrical-technology-ch01-t02
        title: Sentences and phrases; kinds and parts of a sentence
        learning_outcomes:
          - Distinguish a phrase from a sentence and classify sentences as declarative, interrogative, imperative or exclamatory
          - Identify the subject, predicate and object in a sentence
      - id: cbse-12-electrical-technology-ch01-t03
        title: Parts of speech and articles
        learning_outcomes:
          - Identify nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections in workplace sentences
          - Use the articles a, an and the correctly
      - id: cbse-12-electrical-technology-ch01-t04
        title: Constructing a paragraph
        learning_outcomes:
          - Write a well-organised paragraph with a topic sentence, supporting sentences and a conclusion on a subject-related theme
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electrical-technology-ch02
    number: 2
    title: "Employability Skills: Self-Management Skills – IV"
    unit: "Part A Unit 2: Self-Management Skills – IV"
    topics:
      - id: cbse-12-electrical-technology-ch02-t01
        title: Motivation and self-motivation
        learning_outcomes:
          - Explain internal and external motivation and list personal needs and desires that drive motivation
      - id: cbse-12-electrical-technology-ch02-t02
        title: Sources of motivation and a positive outlook
        learning_outcomes:
          - Identify sources of inspiration (people, books, music, activities) and techniques to stay positive and focused on goals
      - id: cbse-12-electrical-technology-ch02-t03
        title: "Personality: meaning, influence and traits"
        learning_outcomes:
          - Define personality and explain how it influences others at work
          - Describe the five basic personality traits (openness, conscientiousness, extraversion, agreeableness, neuroticism)
      - id: cbse-12-electrical-technology-ch02-t04
        title: Personality disorders and how to overcome them
        learning_outcomes:
          - >-
            Describe common personality disorders (paranoid, antisocial, schizoid, borderline, narcissistic, avoidant, dependent, obsessive)
            and the clusters they belong to
          - Suggest steps to seek help and overcome personality problems
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electrical-technology-ch03
    number: 3
    title: "Employability Skills: ICT Skills – IV"
    unit: "Part A Unit 3: ICT Skills – IV"
    topics:
      - id: cbse-12-electrical-technology-ch03-t01
        title: "Spreadsheet basics: workbook, worksheet and data entry"
        learning_outcomes:
          - Name common spreadsheet applications and create, open and save a workbook
          - Enter text and numbers, resize fonts and apply styles
      - id: cbse-12-electrical-technology-ch03-t02
        title: Editing and organising spreadsheet data
        learning_outcomes:
          - Copy and move cell data, sort data and apply filters to a table
      - id: cbse-12-electrical-technology-ch03-t03
        title: Formulas, functions, protection and printing
        learning_outcomes:
          - Use elementary formulas and functions such as SUM, AVERAGE, MIN and MAX
          - Protect a spreadsheet with a password, print it and save it in different formats
      - id: cbse-12-electrical-technology-ch03-t04
        title: Creating a presentation
        learning_outcomes:
          - Name presentation software packages and list features of a good presentation
          - Create a presentation and add or delete slides
      - id: cbse-12-electrical-technology-ch03-t05
        title: Editing and formatting presentations
        learning_outcomes:
          - Enter, edit and format text, insert clipart and images, choose slide layouts, and save and print a presentation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electrical-technology-ch04
    number: 4
    title: "Employability Skills: Entrepreneurial Skills – IV"
    unit: "Part A Unit 4: Entrepreneurial Skills – IV"
    topics:
      - id: cbse-12-electrical-technology-ch04-t01
        title: Barriers to becoming an entrepreneur
        learning_outcomes:
          - Classify barriers to entrepreneurship (environmental, personal, financial, social) with examples and ways to overcome them
      - id: cbse-12-electrical-technology-ch04-t02
        title: Behavioural and entrepreneurial competencies
        learning_outcomes:
          - >-
            Describe competencies such as adaptability, decisiveness, initiative, perseverance, interpersonal and organisational skills,
            stress management and valuing service and diversity
      - id: cbse-12-electrical-technology-ch04-t03
        title: Entrepreneurial competencies in particular
        learning_outcomes:
          - >-
            Explain self-confidence, seeing and acting on opportunities, concern for quality, goal setting, risk taking, problem solving,
            systematic planning, information seeking, persistence, negotiating and team building
      - id: cbse-12-electrical-technology-ch04-t04
        title: Self-assessment of entrepreneurial behaviour
        learning_outcomes:
          - Rate oneself on behavioural competencies and prepare a personal competency profile
          - Relate competencies to stories of successful Indian entrepreneurs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electrical-technology-ch05
    number: 5
    title: "Employability Skills: Green Skills – IV"
    unit: "Part A Unit 5: Green Skills – IV"
    topics:
      - id: cbse-12-electrical-technology-ch05-t01
        title: Green jobs in homes, gardening, transport and energy conservation
        learning_outcomes:
          - Explain the role of green jobs in toxin-free homes, organic gardening, public transport and energy conservation
      - id: cbse-12-electrical-technology-ch05-t02
        title: Green jobs in water, renewable energy and waste
        learning_outcomes:
          - Describe green jobs in water conservation, solar and wind power, and waste reduction, reuse and recycling
      - id: cbse-12-electrical-technology-ch05-t03
        title: Green jobs in tourism, construction and appropriate technology
        learning_outcomes:
          - Give examples of green jobs in green tourism, building and construction and appropriate technology
      - id: cbse-12-electrical-technology-ch05-t04
        title: Role of green jobs in protecting the environment
        learning_outcomes:
          - >-
            Explain how green jobs improve energy and raw-material use, limit greenhouse-gas emissions, minimise waste and pollution,
            restore ecosystems and support adaptation to climate change
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electrical-technology-ch06
    number: 6
    title: A.C. Circuits
    unit: "Part B Unit 1: A.C. Circuits"
    topics:
      - id: cbse-12-electrical-technology-ch06-t01
        title: Generation and wave shape of A.C. voltage
        learning_outcomes:
          - Explain generation of alternating voltage and its sinusoidal wave shape
      - id: cbse-12-electrical-technology-ch06-t02
        title: A.C. quantities
        learning_outcomes:
          - >-
            Define cycle, frequency, peak, average, instantaneous and RMS values, form factor and crest factor, and calculate them for a
            sine wave
      - id: cbse-12-electrical-technology-ch06-t03
        title: Phase, power and power factor
        learning_outcomes:
          - Explain phase and phase difference, true power and power factor
      - id: cbse-12-electrical-technology-ch06-t04
        title: R-L, R-C and R-L-C series circuits
        learning_outcomes:
          - Calculate impedance, current and power factor in series R-L, R-C and R-L-C circuits and the Q factor at resonance
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electrical-technology-ch07
    number: 7
    title: Single-Phase Transformer
    unit: "Part B Unit 2: Single-Phase Transformer"
    topics:
      - id: cbse-12-electrical-technology-ch07-t01
        title: Types of transformers
        learning_outcomes:
          - Distinguish step-up, step-down, voltage, current and auto-transformers
      - id: cbse-12-electrical-technology-ch07-t02
        title: Construction and working principle
        learning_outcomes:
          - Explain the construction and working principle of a transformer and use the turns ratio
      - id: cbse-12-electrical-technology-ch07-t03
        title: Applications, rewinding and cooling
        learning_outcomes:
          - Describe applications, rewinding and cooling methods of transformers
      - id: cbse-12-electrical-technology-ch07-t04
        title: Safety measures in transformer operation
        learning_outcomes:
          - State operational safety precautions for transformers
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electrical-technology-ch08
    number: 8
    title: D.C. Motors
    unit: "Part B Unit 3: D.C. Motors"
    topics:
      - id: cbse-12-electrical-technology-ch08-t01
        title: Types of D.C. motors
        learning_outcomes:
          - Compare series, shunt, compound and universal motors
      - id: cbse-12-electrical-technology-ch08-t02
        title: Construction, working principle and characteristics
        learning_outcomes:
          - Explain the construction, working and speed-torque characteristics of D.C. motors
      - id: cbse-12-electrical-technology-ch08-t03
        title: Starting and starters; installation
        learning_outcomes:
          - Explain why starters are needed, describe D.C. motor starters and installation
      - id: cbse-12-electrical-technology-ch08-t04
        title: Windings and applications including FHP motors
        learning_outcomes:
          - Describe winding details and applications of D.C. and fractional horse-power motors
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electrical-technology-ch09
    number: 9
    title: Single-Phase A.C. Motors
    unit: "Part B Unit 4: Single-Phase A.C. Motors"
    topics:
      - id: cbse-12-electrical-technology-ch09-t01
        title: Split-phase and repulsion-start induction motors
        learning_outcomes:
          - Explain the construction and working of split-phase and repulsion-start motors
      - id: cbse-12-electrical-technology-ch09-t02
        title: Capacitor and shaded-pole motors
        learning_outcomes:
          - Compare capacitor-start, capacitor-run and shaded-pole motors and their uses
      - id: cbse-12-electrical-technology-ch09-t03
        title: Universal motors and starters
        learning_outcomes:
          - Explain universal motors and starting methods for single-phase motors
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electrical-technology-ch10
    number: 10
    title: Three-Phase Induction Motors
    unit: "Part B Unit 5: Three-Phase Induction Motors"
    topics:
      - id: cbse-12-electrical-technology-ch10-t01
        title: Principle of the three-phase induction motor
        learning_outcomes:
          - Explain the rotating magnetic field and slip
      - id: cbse-12-electrical-technology-ch10-t02
        title: Construction and working
        learning_outcomes:
          - Distinguish squirrel-cage and slip-ring rotors and explain motor working
      - id: cbse-12-electrical-technology-ch10-t03
        title: Starting methods
        learning_outcomes:
          - Describe DOL and star-delta starting of three-phase motors
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electrical-technology-ch11
    number: 11
    title: Measuring Instruments II
    unit: "Part B Unit 6: Measuring Instruments II"
    topics:
      - id: cbse-12-electrical-technology-ch11-t01
        title: Induction-type energy meter
        learning_outcomes:
          - Explain the construction, connection and working of an induction-type energy meter
      - id: cbse-12-electrical-technology-ch11-t02
        title: Analog and digital multimeters
        learning_outcomes:
          - Describe the use of analog and digital multimeters for voltage, current and resistance
      - id: cbse-12-electrical-technology-ch11-t03
        title: Dynamometer-type wattmeter
        learning_outcomes:
          - Explain the circuit connection and application of a dynamometer wattmeter
    removed_topics: []
    literature_texts: []
  - id: cbse-12-electrical-technology-ch12
    number: 12
    title: Electrical Appliances
    unit: "Part B Unit 7: Electrical Appliances"
    topics:
      - id: cbse-12-electrical-technology-ch12-t01
        title: Immersion heater, geyser and thermostat
        learning_outcomes:
          - >-
            Explain construction and working of immersion heaters, geysers and thermostats, common faults, testing, installation and
            precautions
      - id: cbse-12-electrical-technology-ch12-t02
        title: Mixer, grinder and blender
        learning_outcomes:
          - Explain construction and working of mixers and blenders and their common faults and repairs
      - id: cbse-12-electrical-technology-ch12-t03
        title: Room and desert coolers
        learning_outcomes:
          - Describe construction, installation, common faults and repairs of room coolers
      - id: cbse-12-electrical-technology-ch12-t04
        title: Motors used in domestic appliances
        learning_outcomes:
          - Identify split-phase, capacitor, shaded-pole, two-speed, reversible and universal motors in appliances and troubleshoot them
      - id: cbse-12-electrical-technology-ch12-t05
        title: Occupational safety and first aid
        learning_outcomes:
          - >-
            Follow electrical safety practices, safe lifting, rescue from a live wire and artificial respiration (Nelson's arm-lift and
            Schafer's methods)
