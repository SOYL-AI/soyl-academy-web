# CBSE Class 12 English Elective (001), 2026-27. Sections, marks, task types and prescribed texts as listed in the CBSE
# 2026-27 English Elective XI-XII syllabus (Class XII pages): Kaleidoscope (NCERT) and one novel by R. K. Narayan.
# Text titles as printed by CBSE; authors added from the NCERT book where well established. Titles and authors only; no text
# is reproduced (CONTEXT §8). The Seminar (20) is internal assessment (board_assessed: false). CBSE prints "The Wild Swans
# of Coole"; the published title of the poem, "The Wild Swans at Coole", is used.
subject_id: cbse-12-english-elective
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-english-elective-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  Theory 80 marks (3 hours) + Seminar 20 (internal). Section A reading 20: a literary or discursive passage of about 950-1000
  words (12 of 15 objective items), a poem of 10-12 lines (4 of 5) and a case-based factual passage with visual input of 100-120
  words (4 of 5). Section B applied grammar 8 (8 of 10 objective items on transformation of sentences) and creative writing 20
  (three of four long writing tasks of 120-150 words, discursive and interpretative, 5 each; one of two essays on an argumentative
  or discursive topic such as an article, report or speech, 5). Section C textbook 22 (one prose and one poetry extract of two, 6
  each; one short answer of 30-40 words 2; one of 40-50 words 3; one long answer of 120-150 words 5) and fiction 10 (short answers
  of 30-40 words 2 and 40-50 words 3, one long answer of 120-150 words 5; students study one of the two novels). Seminar:
  book/play/story review presentation, poetry reading with interpretation, critical review of a film or play, theatre workshop.
units:
  - name: 'Section A: Reading Comprehension'
    marks: 20
  - name: 'Section B: Applied Grammar'
    marks: 8
  - name: 'Section B: Creative Writing'
    marks: 20
  - name: 'Section C: Textbook - Kaleidoscope'
    marks: 22
  - name: 'Section C: Fiction'
    marks: 10
  - name: Seminar (internal assessment)
    marks: 20
