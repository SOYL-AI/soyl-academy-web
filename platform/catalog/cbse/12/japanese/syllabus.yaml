# CBSE Class 12 Japanese (194), 2026-27. Parts, marks, grammar patterns, kanji range and writing topics as printed in the
# CBSE 2026-27 Japanese Classes XI-XII syllabus (Class XII pages). Prescribed books: Minna no Nihongo (Indian edition,
# Goyal Publishers, 2nd edition 2018) lessons 29-34, Sakura, and Nihongo Challenge Kanji N4-N5 (kanji 151-200). Minna no
# Nihongo lessons are numbered, not titled, so grammar chapters follow the CBSE lesson groups. No text is reproduced.
subject_id: cbse-12-japanese
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-japanese-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (periodic tests on grammar, vocabulary, kanji and script 10;
  notebook 5; subject enrichment - listening, speaking and a project in Japanese on elderly people, India's transport
  system or healthy Indian food - 5). Part A, MCQ and objective (40, 33% choice): grammar of lessons 29-34 and kanji
  151-200 of the N4 list (reading and writing). Part B, descriptive (40, 33% choice): unseen reading passages (short
  stories, articles); guided paragraph of about 400 characters (term 1: how to put out the rubbish - gomi no dashikata;
  term 2: your favourite recipe), marked 2.5 for cohesion and construction, 2.5 for grammar and vocabulary, 2.5 for
  kanji used, with no deduction for spelling; translation from English into Japanese and Japanese into English
  (suggested theme: school life compared with Japan). Board examination in Class XII.
units:
  - name: パートA：文法と漢字
    marks: 40
  - name: パートB：読解・作文・翻訳
    marks: 40
chapters:
  - id: cbse-12-japanese-ch01
    number: 1
    title: 第29課〜第31課の文法
    title_en: Grammar of lessons 29-31 (term 1)
    unit: パートA：文法と漢字
    topics:
      - id: cbse-12-japanese-ch01-t01
        title: 自動詞と他動詞・〜ています
        title_en: Transitive and intransitive verbs; state with -te imasu
        learning_outcomes:
          - Pair transitive and intransitive verbs and describe states
      - id: cbse-12-japanese-ch01-t02
        title: 〜てしまいました・どこかで／どこかに
        title_en: Completion and regret with -te shimaimashita; dokoka de / dokoka ni
        learning_outcomes:
          - Express completion or regret with -te shimau and use indefinite place words
      - id: cbse-12-japanese-ch01-t03
        title: 〜てあります・〜ておきます
        title_en: Resultant state with -te arimasu; doing in advance with -te okimasu
        learning_outcomes:
          - Describe a prepared state and things done in advance
      - id: cbse-12-japanese-ch01-t04
        title: 意向形・つもり・予定
        title_en: Volitional form, tsumori and yotei
        learning_outcomes:
          - Express intention and plans with the volitional form, tsumori and yotei
    removed_topics: []
    literature_texts: []
  - id: cbse-12-japanese-ch02
    number: 2
    title: 第32課〜第34課の文法
    title_en: Grammar of lessons 32-34 (term 2)
    unit: パートA：文法と漢字
    topics:
      - id: cbse-12-japanese-ch02-t01
        title: 〜たほうがいい・〜ないほうがいい
        title_en: Advice with -ta hō ga ii / -nai hō ga ii
        learning_outcomes:
          - Give and respond to advice
      - id: cbse-12-japanese-ch02-t02
        title: でしょう・かもしれません・きっと・たぶん・もしかしたら
        title_en: 'Degrees of certainty: deshō, kamoshiremasen, kitto, tabun, moshikashitara'
        learning_outcomes:
          - Express probability and degrees of certainty
      - id: cbse-12-japanese-ch02-t03
        title: 命令形・禁止形・〜と読みます・〜という意味です
        title_en: Imperative and prohibitive forms; to yomimasu, to iu imi desu, to itte imashita
        learning_outcomes:
          - Read signs with imperative and prohibitive forms and explain their meaning and reported messages
      - id: cbse-12-japanese-ch02-t04
        title: 〜とおりに・〜あとで・〜ないで・数量詞＋で
        title_en: tōri ni, ato de, -naide, quantifier + de
        learning_outcomes:
          - Follow instructions with tōri ni, sequence actions with ato de and use -naide and quantifier + de
