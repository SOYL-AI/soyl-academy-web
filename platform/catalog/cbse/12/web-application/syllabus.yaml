chapters:
  - id: cbse-12-web-application-ch01
    number: 1
    title: "Employability Skills: Communication Skills – IV"
    unit: "Part A Unit 1: Communication Skills – IV"
    topics:
      - id: cbse-12-web-application-ch01-t01
        title: Active listening at the workplace
        learning_outcomes:
          - Explain why active listening matters at work and list the barriers to it
          - Describe the steps of active listening and apply them in a role play
      - id: cbse-12-web-application-ch01-t02
        title: Sentences and phrases; kinds and parts of a sentence
        learning_outcomes:
          - Distinguish a phrase from a sentence and classify sentences as declarative, interrogative, imperative or exclamatory
          - Identify the subject, predicate and object in a sentence
      - id: cbse-12-web-application-ch01-t03
        title: Parts of speech and articles
        learning_outcomes:
          - Identify nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections in workplace sentences
          - Use the articles a, an and the correctly
      - id: cbse-12-web-application-ch01-t04
        title: Constructing a paragraph
        learning_outcomes:
          - Write a well-organised paragraph with a topic sentence, supporting sentences and a conclusion on a subject-related theme
    removed_topics: []
    literature_texts: []
  - id: cbse-12-web-application-ch02
    number: 2
    title: "Employability Skills: Self-Management Skills – IV"
    unit: "Part A Unit 2: Self-Management Skills – IV"
    topics:
      - id: cbse-12-web-application-ch02-t01
        title: Motivation and self-motivation
        learning_outcomes:
          - Explain internal and external motivation and list personal needs and desires that drive motivation
      - id: cbse-12-web-application-ch02-t02
        title: Sources of motivation and a positive outlook
        learning_outcomes:
          - Identify sources of inspiration (people, books, music, activities) and techniques to stay positive and focused on goals
      - id: cbse-12-web-application-ch02-t03
        title: "Personality: meaning, influence and traits"
        learning_outcomes:
          - Define personality and explain how it influences others at work
          - Describe the five basic personality traits (openness, conscientiousness, extraversion, agreeableness, neuroticism)
      - id: cbse-12-web-application-ch02-t04
        title: Personality disorders and how to overcome them
        learning_outcomes:
          - >-
            Describe common personality disorders (paranoid, antisocial, schizoid, borderline, narcissistic, avoidant, dependent, obsessive)
            and the clusters they belong to
          - Suggest steps to seek help and overcome personality problems
    removed_topics: []
    literature_texts: []
  - id: cbse-12-web-application-ch03
    number: 3
    title: "Employability Skills: ICT Skills – IV"
    unit: "Part A Unit 3: ICT Skills – IV"
    topics:
      - id: cbse-12-web-application-ch03-t01
        title: "Spreadsheet basics: workbook, worksheet and data entry"
        learning_outcomes:
          - Name common spreadsheet applications and create, open and save a workbook
          - Enter text and numbers, resize fonts and apply styles
      - id: cbse-12-web-application-ch03-t02
        title: Editing and organising spreadsheet data
        learning_outcomes:
          - Copy and move cell data, sort data and apply filters to a table
      - id: cbse-12-web-application-ch03-t03
        title: Formulas, functions, protection and printing
        learning_outcomes:
          - Use elementary formulas and functions such as SUM, AVERAGE, MIN and MAX
          - Protect a spreadsheet with a password, print it and save it in different formats
      - id: cbse-12-web-application-ch03-t04
        title: Creating a presentation
        learning_outcomes:
          - Name presentation software packages and list features of a good presentation
          - Create a presentation and add or delete slides
      - id: cbse-12-web-application-ch03-t05
        title: Editing and formatting presentations
        learning_outcomes:
          - Enter, edit and format text, insert clipart and images, choose slide layouts, and save and print a presentation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-web-application-ch04
    number: 4
    title: "Employability Skills: Entrepreneurial Skills – IV"
    unit: "Part A Unit 4: Entrepreneurial Skills – IV"
    topics:
      - id: cbse-12-web-application-ch04-t01
        title: Barriers to becoming an entrepreneur
        learning_outcomes:
          - Classify barriers to entrepreneurship (environmental, personal, financial, social) with examples and ways to overcome them
      - id: cbse-12-web-application-ch04-t02
        title: Behavioural and entrepreneurial competencies
        learning_outcomes:
          - >-
            Describe competencies such as adaptability, decisiveness, initiative, perseverance, interpersonal and organisational skills,
            stress management and valuing service and diversity
      - id: cbse-12-web-application-ch04-t03
        title: Entrepreneurial competencies in particular
        learning_outcomes:
          - >-
            Explain self-confidence, seeing and acting on opportunities, concern for quality, goal setting, risk taking, problem solving,
            systematic planning, information seeking, persistence, negotiating and team building
      - id: cbse-12-web-application-ch04-t04
        title: Self-assessment of entrepreneurial behaviour
        learning_outcomes:
          - Rate oneself on behavioural competencies and prepare a personal competency profile
          - Relate competencies to stories of successful Indian entrepreneurs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-web-application-ch05
    number: 5
    title: "Employability Skills: Green Skills – IV"
    unit: "Part A Unit 5: Green Skills – IV"
    topics:
      - id: cbse-12-web-application-ch05-t01
        title: Green jobs in homes, gardening, transport and energy conservation
        learning_outcomes:
          - Explain the role of green jobs in toxin-free homes, organic gardening, public transport and energy conservation
      - id: cbse-12-web-application-ch05-t02
        title: Green jobs in water, renewable energy and waste
        learning_outcomes:
          - Describe green jobs in water conservation, solar and wind power, and waste reduction, reuse and recycling
      - id: cbse-12-web-application-ch05-t03
        title: Green jobs in tourism, construction and appropriate technology
        learning_outcomes:
          - Give examples of green jobs in green tourism, building and construction and appropriate technology
      - id: cbse-12-web-application-ch05-t04
        title: Role of green jobs in protecting the environment
        learning_outcomes:
          - >-
            Explain how green jobs improve energy and raw-material use, limit greenhouse-gas emissions, minimise waste and pollution,
            restore ecosystems and support adaptation to climate change
    removed_topics: []
    literature_texts: []
  - id: cbse-12-web-application-ch06
    number: 6
    title: Emerging Trends
    unit: "Part B Unit 1: Emerging Trends"
    topics:
      - id: cbse-12-web-application-ch06-t01
        title: Internet of Things and Industrial IoT
        learning_outcomes:
          - Explain IoT, its growth, advantages and disadvantages, and give industrial IoT applications
      - id: cbse-12-web-application-ch06-t02
        title: Types and functions of operating systems
        learning_outcomes:
          - Classify operating systems and compare desktop and mobile operating systems
      - id: cbse-12-web-application-ch06-t03
        title: Cloud computing and edge computing
        learning_outcomes:
          - Describe cloud and edge computing, their benefits, limitations and cloud storage providers
      - id: cbse-12-web-application-ch06-t04
        title: Artificial intelligence and machine learning
        learning_outcomes:
          - Explain AI and ML with real-world applications and distinguish between them
      - id: cbse-12-web-application-ch06-t05
        title: Digital marketing and social media etiquette
        learning_outcomes:
          - Describe digital marketing channels and careers
          - Apply social-media etiquette and explain the harm of spreading rumours
    removed_topics: []
    literature_texts: []
  - id: cbse-12-web-application-ch07
    number: 7
    title: JavaScript Part 2
    unit: "Part B Unit 2: JavaScript Part 2"
    topics:
      - id: cbse-12-web-application-ch07-t01
        title: Functions in JavaScript
        learning_outcomes:
          - Define, name, call and return values from functions, and solve problems with user-defined functions
      - id: cbse-12-web-application-ch07-t02
        title: Objects, properties and methods
        learning_outcomes:
          - Create objects with literals and constructors and access their properties and methods
      - id: cbse-12-web-application-ch07-t03
        title: Strings and string methods
        learning_outcomes:
          - Use length, slice, substring, replace, replaceAll, match, toUpperCase, toLowerCase, concat, trim and charAt
      - id: cbse-12-web-application-ch07-t04
        title: Arrays and array methods
        learning_outcomes:
          - Create and access arrays and use push, pop, shift, unshift, join, concat, slice, reverse and sort
      - id: cbse-12-web-application-ch07-t05
        title: Math methods
        learning_outcomes:
          - Use Math.round, ceil, floor, pow, sqrt, min, max and random in programs
      - id: cbse-12-web-application-ch07-t06
        title: Event handling
        learning_outcomes:
          - Handle onclick, onchange, onmouseover, onmouseout, onkeydown and onload events
          - Predict the output of event-driven code
    removed_topics: []
    literature_texts: []
  - id: cbse-12-web-application-ch08
    number: 8
    title: Graphic Designing using Canva and Adobe Express
    unit: "Part B Unit 3: Graphic Designing using Canva and Adobe Express"
    topics:
      - id: cbse-12-web-application-ch08-t01
        title: "Graphic design: importance, elements and principles"
        learning_outcomes:
          - Explain the role of graphic design and identify elements and principles of design
      - id: cbse-12-web-application-ch08-t02
        title: "Working in Canva: editor, templates and posters"
        learning_outcomes:
          - Navigate the Canva editor and create a poster from a template
      - id: cbse-12-web-application-ch08-t03
        title: Video and presentation editing in Canva
        learning_outcomes:
          - Split, cut and trim video, add transitions, animations and audio, and present, share or download designs
      - id: cbse-12-web-application-ch08-t04
        title: Canva and artificial intelligence
        learning_outcomes:
          - Describe AI features in Canva for generating images, text and audio
      - id: cbse-12-web-application-ch08-t05
        title: Designing in Adobe Express
        learning_outcomes:
          - Create template-based and original designs and edit video in Adobe Express
    removed_topics: []
    literature_texts: []
  - id: cbse-12-web-application-ch09
    number: 9
    title: Cyber Safety and Security
    unit: "Part B Unit 4: Cyber Safety and Security"
    topics:
      - id: cbse-12-web-application-ch09-t01
        title: Digital footprints
        learning_outcomes:
          - Distinguish active and passive digital footprints and explain how to manage them
      - id: cbse-12-web-application-ch09-t02
        title: Data privacy and data security
        learning_outcomes:
          - Explain the importance of data privacy, laws that protect data and security measures against unauthorised access
      - id: cbse-12-web-application-ch09-t03
        title: Intellectual property rights
        learning_outcomes:
          - Differentiate plagiarism, copyright, trademark and patent
      - id: cbse-12-web-application-ch09-t04
        title: Cyber crimes and cyber laws in India
        learning_outcomes:
          - Identify hacking, phishing, identity theft and cyberbullying, and outline the IT Act and other Indian cyber laws
