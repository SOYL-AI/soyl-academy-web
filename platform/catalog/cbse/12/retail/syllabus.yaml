chapters:
  - id: cbse-12-retail-ch01
    number: 1
    title: "Employability Skills: Communication Skills – IV"
    unit: "Part A Unit 1: Communication Skills – IV"
    topics:
      - id: cbse-12-retail-ch01-t01
        title: Active listening at the workplace
        learning_outcomes:
          - Explain why active listening matters at work and list the barriers to it
          - Describe the steps of active listening and apply them in a role play
      - id: cbse-12-retail-ch01-t02
        title: Sentences and phrases; kinds and parts of a sentence
        learning_outcomes:
          - Distinguish a phrase from a sentence and classify sentences as declarative, interrogative, imperative or exclamatory
          - Identify the subject, predicate and object in a sentence
      - id: cbse-12-retail-ch01-t03
        title: Parts of speech and articles
        learning_outcomes:
          - Identify nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections in workplace sentences
          - Use the articles a, an and the correctly
      - id: cbse-12-retail-ch01-t04
        title: Constructing a paragraph
        learning_outcomes:
          - Write a well-organised paragraph with a topic sentence, supporting sentences and a conclusion on a subject-related theme
    removed_topics: []
    literature_texts: []
  - id: cbse-12-retail-ch02
    number: 2
    title: "Employability Skills: Self-Management Skills – IV"
    unit: "Part A Unit 2: Self-Management Skills – IV"
    topics:
      - id: cbse-12-retail-ch02-t01
        title: Motivation and self-motivation
        learning_outcomes:
          - Explain internal and external motivation and list personal needs and desires that drive motivation
      - id: cbse-12-retail-ch02-t02
        title: Sources of motivation and a positive outlook
        learning_outcomes:
          - Identify sources of inspiration (people, books, music, activities) and techniques to stay positive and focused on goals
      - id: cbse-12-retail-ch02-t03
        title: "Personality: meaning, influence and traits"
        learning_outcomes:
          - Define personality and explain how it influences others at work
          - Describe the five basic personality traits (openness, conscientiousness, extraversion, agreeableness, neuroticism)
      - id: cbse-12-retail-ch02-t04
        title: Personality disorders and how to overcome them
        learning_outcomes:
          - >-
            Describe common personality disorders (paranoid, antisocial, schizoid, borderline, narcissistic, avoidant, dependent, obsessive)
            and the clusters they belong to
          - Suggest steps to seek help and overcome personality problems
    removed_topics: []
    literature_texts: []
  - id: cbse-12-retail-ch03
    number: 3
    title: "Employability Skills: ICT Skills – IV"
    unit: "Part A Unit 3: ICT Skills – IV"
    topics:
      - id: cbse-12-retail-ch03-t01
        title: "Spreadsheet basics: workbook, worksheet and data entry"
        learning_outcomes:
          - Name common spreadsheet applications and create, open and save a workbook
          - Enter text and numbers, resize fonts and apply styles
      - id: cbse-12-retail-ch03-t02
        title: Editing and organising spreadsheet data
        learning_outcomes:
          - Copy and move cell data, sort data and apply filters to a table
      - id: cbse-12-retail-ch03-t03
        title: Formulas, functions, protection and printing
        learning_outcomes:
          - Use elementary formulas and functions such as SUM, AVERAGE, MIN and MAX
          - Protect a spreadsheet with a password, print it and save it in different formats
      - id: cbse-12-retail-ch03-t04
        title: Creating a presentation
        learning_outcomes:
          - Name presentation software packages and list features of a good presentation
          - Create a presentation and add or delete slides
      - id: cbse-12-retail-ch03-t05
        title: Editing and formatting presentations
        learning_outcomes:
          - Enter, edit and format text, insert clipart and images, choose slide layouts, and save and print a presentation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-retail-ch04
    number: 4
    title: "Employability Skills: Entrepreneurial Skills – IV"
    unit: "Part A Unit 4: Entrepreneurial Skills – IV"
    topics:
      - id: cbse-12-retail-ch04-t01
        title: Barriers to becoming an entrepreneur
        learning_outcomes:
          - Classify barriers to entrepreneurship (environmental, personal, financial, social) with examples and ways to overcome them
      - id: cbse-12-retail-ch04-t02
        title: Behavioural and entrepreneurial competencies
        learning_outcomes:
          - >-
            Describe competencies such as adaptability, decisiveness, initiative, perseverance, interpersonal and organisational skills,
            stress management and valuing service and diversity
      - id: cbse-12-retail-ch04-t03
        title: Entrepreneurial competencies in particular
        learning_outcomes:
          - >-
            Explain self-confidence, seeing and acting on opportunities, concern for quality, goal setting, risk taking, problem solving,
            systematic planning, information seeking, persistence, negotiating and team building
      - id: cbse-12-retail-ch04-t04
        title: Self-assessment of entrepreneurial behaviour
        learning_outcomes:
          - Rate oneself on behavioural competencies and prepare a personal competency profile
          - Relate competencies to stories of successful Indian entrepreneurs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-retail-ch05
    number: 5
    title: "Employability Skills: Green Skills – IV"
    unit: "Part A Unit 5: Green Skills – IV"
    topics:
      - id: cbse-12-retail-ch05-t01
        title: Green jobs in homes, gardening, transport and energy conservation
        learning_outcomes:
          - Explain the role of green jobs in toxin-free homes, organic gardening, public transport and energy conservation
      - id: cbse-12-retail-ch05-t02
        title: Green jobs in water, renewable energy and waste
        learning_outcomes:
          - Describe green jobs in water conservation, solar and wind power, and waste reduction, reuse and recycling
      - id: cbse-12-retail-ch05-t03
        title: Green jobs in tourism, construction and appropriate technology
        learning_outcomes:
          - Give examples of green jobs in green tourism, building and construction and appropriate technology
      - id: cbse-12-retail-ch05-t04
        title: Role of green jobs in protecting the environment
        learning_outcomes:
          - >-
            Explain how green jobs improve energy and raw-material use, limit greenhouse-gas emissions, minimise waste and pollution,
            restore ecosystems and support adaptation to climate change
    removed_topics: []
    literature_texts: []
  - id: cbse-12-retail-ch06
    number: 6
    title: Display of Products and Satisfying Customer Needs
    unit: "Part B Unit 1: Display of Products and Satisfying Customer Needs"
    topics:
      - id: cbse-12-retail-ch06-t01
        title: Organising product display in a retail store
        learning_outcomes:
          - Explain how products are arranged and displayed to attract customers
          - Identify customer needs through observation and questioning
      - id: cbse-12-retail-ch06-t02
        title: Processing the sale and delivery of products
        learning_outcomes:
          - Describe the steps to process a sale and arrange delivery of goods to customers
      - id: cbse-12-retail-ch06-t03
        title: Maintaining store areas and communicating with stakeholders
        learning_outcomes:
          - List cleaning and maintenance routines for store areas
          - Describe effective communication with customers, colleagues and suppliers
      - id: cbse-12-retail-ch06-t04
        title: Duties and responsibilities of a sales supervisor
        learning_outcomes:
          - Identify the functions, duties and responsibilities of a retail sales supervisor
    removed_topics: []
    literature_texts: []
  - id: cbse-12-retail-ch07
    number: 7
    title: Non-Store Retailing
    unit: "Part B Unit 2: Non-Store Retailing"
    topics:
      - id: cbse-12-retail-ch07-t01
        title: E-retailing and its logistics
        learning_outcomes:
          - Explain the meaning, advantages and shortcomings of e-retailing
          - Identify ICT resources and success factors for e-retailing
      - id: cbse-12-retail-ch07-t02
        title: E-marketing
        learning_outcomes:
          - State the importance, advantages and shortcomings of e-marketing
          - Differentiate e-marketing from traditional marketing
      - id: cbse-12-retail-ch07-t03
        title: Telemarketing
        learning_outcomes:
          - Explain the concept, advantages and limitations of telemarketing and the technologies it uses
          - Categorise inbound and outbound telemarketing activities
      - id: cbse-12-retail-ch07-t04
        title: Internet business
        learning_outcomes:
          - Explain the objectives and subsets of internet business and the issues it faces
    removed_topics: []
    literature_texts: []
  - id: cbse-12-retail-ch08
    number: 8
    title: "Retail Point of Sale: An Overview"
    unit: "Part B Unit 3: Retail Point of Sale: An Overview"
    topics:
      - id: cbse-12-retail-ch08-t01
        title: Components of a point-of-sale (POS) system
        learning_outcomes:
          - Identify POS hardware (scanner, card reader, printer, cash drawer) and software components
      - id: cbse-12-retail-ch08-t02
        title: Process of point of sale
        learning_outcomes:
          - Describe the sequence of a POS transaction from scanning to receipt
          - Explain how POS data supports stock and sales records
      - id: cbse-12-retail-ch08-t03
        title: Point-of-sale marketing
        learning_outcomes:
          - Explain POS displays and impulse buying, and evaluate POS marketing techniques
      - id: cbse-12-retail-ch08-t04
        title: Types of POS systems
        learning_outcomes:
          - Compare traditional, mobile and cloud POS systems and their uses in different store formats
    removed_topics: []
    literature_texts: []
  - id: cbse-12-retail-ch09
    number: 9
    title: Billing and Accounting Procedures in Retailing
    unit: "Part B Unit 4: Billing and Accounting Procedures in Retailing"
    topics:
      - id: cbse-12-retail-ch09-t01
        title: Billing procedure and modes of payment
        learning_outcomes:
          - Describe the competencies of billing staff and handle cash, card, UPI and voucher payments
      - id: cbse-12-retail-ch09-t02
        title: Fundamentals of accounting
        learning_outcomes:
          - State the objectives, characteristics, types, principles, advantages and limitations of accounting
      - id: cbse-12-retail-ch09-t03
        title: Journal and ledger
        learning_outcomes:
          - Record retail transactions in a journal and post them to ledger accounts
      - id: cbse-12-retail-ch09-t04
        title: Subsidiary books, cash book and bank reconciliation
        learning_outcomes:
          - Classify subsidiary books, prepare single- and double-column cash books, and explain bank reconciliation
      - id: cbse-12-retail-ch09-t05
        title: Trading account, profit and loss account and balance sheet
        learning_outcomes:
          - Prepare a simple trading account, profit and loss account and balance sheet for a retail store
    removed_topics: []
    literature_texts: []
  - id: cbse-12-retail-ch10
    number: 10
    title: Inventory Handling
    unit: "Part B Unit 5: Inventory Handling"
    topics:
      - id: cbse-12-retail-ch10-t01
        title: Basics of inventory handling
        learning_outcomes:
          - Explain inventory, its types and why it must be controlled in retail
      - id: cbse-12-retail-ch10-t02
        title: Receiving, checking and storing goods
        learning_outcomes:
          - Describe the steps of receiving, inspecting, tagging and storing merchandise
      - id: cbse-12-retail-ch10-t03
        title: Stock movement, stock-taking and records
        learning_outcomes:
          - Explain stock rotation (FIFO), stock-taking and inventory records, and draw a flow chart of inventory handling
    removed_topics: []
