# CBSE Class 12 Retail (801), 2026-27 skill subject. Built from the CBSE 2026-27 skill curriculum; theory component only (practical work is listed in exam_notes).
subject_id: cbse-12-retail
academic_year: "2026-27"
source_status: verified
