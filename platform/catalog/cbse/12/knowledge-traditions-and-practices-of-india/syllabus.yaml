exam_notes: >-
  Theory 70 marks (3 hours assumed; CBSE gives no duration in the syllabus) + internal assessment/projects 30. Board chapters: 1 Agriculture
  10, 4 Education systems 16, 5 Ethics 17, 6 Martial arts 17, 8 Other technologies 10; chapters 2 (Architecture), 3 (Dance) and 7 (Language
  and Grammar) are for internal assessment only. CBSE design: MCQ 16 x 1, short answer 7 x 2, case studies 4 x 5, descriptive answers 4 x 5;
  competencies knowledge/understanding 19, application 17, analysis/synthesis 19, evaluation 15 marks. No SQP is published for KTPI in the
  2026-27 list. Single board exam (February-March 2027).
