chapters:
  - id: cbse-12-office-procedures-and-practices-ch01
    number: 1
    title: "Employability Skills: Communication Skills – IV"
    unit: "Part A Unit 1: Communication Skills – IV"
    topics:
      - id: cbse-12-office-procedures-and-practices-ch01-t01
        title: Active listening at the workplace
        learning_outcomes:
          - Explain why active listening matters at work and list the barriers to it
          - Describe the steps of active listening and apply them in a role play
      - id: cbse-12-office-procedures-and-practices-ch01-t02
        title: Sentences and phrases; kinds and parts of a sentence
        learning_outcomes:
          - Distinguish a phrase from a sentence and classify sentences as declarative, interrogative, imperative or exclamatory
          - Identify the subject, predicate and object in a sentence
      - id: cbse-12-office-procedures-and-practices-ch01-t03
        title: Parts of speech and articles
        learning_outcomes:
          - Identify nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections in workplace sentences
          - Use the articles a, an and the correctly
      - id: cbse-12-office-procedures-and-practices-ch01-t04
        title: Constructing a paragraph
        learning_outcomes:
          - Write a well-organised paragraph with a topic sentence, supporting sentences and a conclusion on a subject-related theme
    removed_topics: []
    literature_texts: []
  - id: cbse-12-office-procedures-and-practices-ch02
    number: 2
    title: "Employability Skills: Self-Management Skills – IV"
    unit: "Part A Unit 2: Self-Management Skills – IV"
    topics:
      - id: cbse-12-office-procedures-and-practices-ch02-t01
        title: Motivation and self-motivation
        learning_outcomes:
          - Explain internal and external motivation and list personal needs and desires that drive motivation
      - id: cbse-12-office-procedures-and-practices-ch02-t02
        title: Sources of motivation and a positive outlook
        learning_outcomes:
          - Identify sources of inspiration (people, books, music, activities) and techniques to stay positive and focused on goals
      - id: cbse-12-office-procedures-and-practices-ch02-t03
        title: "Personality: meaning, influence and traits"
        learning_outcomes:
          - Define personality and explain how it influences others at work
          - Describe the five basic personality traits (openness, conscientiousness, extraversion, agreeableness, neuroticism)
      - id: cbse-12-office-procedures-and-practices-ch02-t04
        title: Personality disorders and how to overcome them
        learning_outcomes:
          - >-
            Describe common personality disorders (paranoid, antisocial, schizoid, borderline, narcissistic, avoidant, dependent, obsessive)
            and the clusters they belong to
          - Suggest steps to seek help and overcome personality problems
    removed_topics: []
    literature_texts: []
  - id: cbse-12-office-procedures-and-practices-ch03
    number: 3
    title: "Employability Skills: ICT Skills – IV"
    unit: "Part A Unit 3: ICT Skills – IV"
    topics:
      - id: cbse-12-office-procedures-and-practices-ch03-t01
        title: "Spreadsheet basics: workbook, worksheet and data entry"
        learning_outcomes:
          - Name common spreadsheet applications and create, open and save a workbook
          - Enter text and numbers, resize fonts and apply styles
      - id: cbse-12-office-procedures-and-practices-ch03-t02
        title: Editing and organising spreadsheet data
        learning_outcomes:
          - Copy and move cell data, sort data and apply filters to a table
      - id: cbse-12-office-procedures-and-practices-ch03-t03
        title: Formulas, functions, protection and printing
        learning_outcomes:
          - Use elementary formulas and functions such as SUM, AVERAGE, MIN and MAX
          - Protect a spreadsheet with a password, print it and save it in different formats
      - id: cbse-12-office-procedures-and-practices-ch03-t04
        title: Creating a presentation
        learning_outcomes:
          - Name presentation software packages and list features of a good presentation
          - Create a presentation and add or delete slides
      - id: cbse-12-office-procedures-and-practices-ch03-t05
        title: Editing and formatting presentations
        learning_outcomes:
          - Enter, edit and format text, insert clipart and images, choose slide layouts, and save and print a presentation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-office-procedures-and-practices-ch04
    number: 4
    title: "Employability Skills: Entrepreneurial Skills – IV"
    unit: "Part A Unit 4: Entrepreneurial Skills – IV"
    topics:
      - id: cbse-12-office-procedures-and-practices-ch04-t01
        title: Barriers to becoming an entrepreneur
        learning_outcomes:
          - Classify barriers to entrepreneurship (environmental, personal, financial, social) with examples and ways to overcome them
      - id: cbse-12-office-procedures-and-practices-ch04-t02
        title: Behavioural and entrepreneurial competencies
        learning_outcomes:
          - >-
            Describe competencies such as adaptability, decisiveness, initiative, perseverance, interpersonal and organisational skills,
            stress management and valuing service and diversity
      - id: cbse-12-office-procedures-and-practices-ch04-t03
        title: Entrepreneurial competencies in particular
        learning_outcomes:
          - >-
            Explain self-confidence, seeing and acting on opportunities, concern for quality, goal setting, risk taking, problem solving,
            systematic planning, information seeking, persistence, negotiating and team building
      - id: cbse-12-office-procedures-and-practices-ch04-t04
        title: Self-assessment of entrepreneurial behaviour
        learning_outcomes:
          - Rate oneself on behavioural competencies and prepare a personal competency profile
          - Relate competencies to stories of successful Indian entrepreneurs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-office-procedures-and-practices-ch05
    number: 5
    title: "Employability Skills: Green Skills – IV"
    unit: "Part A Unit 5: Green Skills – IV"
    topics:
      - id: cbse-12-office-procedures-and-practices-ch05-t01
        title: Green jobs in homes, gardening, transport and energy conservation
        learning_outcomes:
          - Explain the role of green jobs in toxin-free homes, organic gardening, public transport and energy conservation
      - id: cbse-12-office-procedures-and-practices-ch05-t02
        title: Green jobs in water, renewable energy and waste
        learning_outcomes:
          - Describe green jobs in water conservation, solar and wind power, and waste reduction, reuse and recycling
      - id: cbse-12-office-procedures-and-practices-ch05-t03
        title: Green jobs in tourism, construction and appropriate technology
        learning_outcomes:
          - Give examples of green jobs in green tourism, building and construction and appropriate technology
      - id: cbse-12-office-procedures-and-practices-ch05-t04
        title: Role of green jobs in protecting the environment
        learning_outcomes:
          - >-
            Explain how green jobs improve energy and raw-material use, limit greenhouse-gas emissions, minimise waste and pollution,
            restore ecosystems and support adaptation to climate change
    removed_topics: []
    literature_texts: []
  - id: cbse-12-office-procedures-and-practices-ch06
    number: 6
    title: Introduction to Secretarial Practice
    unit: "Part B Unit 1: Introduction to Secretarial Practice"
    topics:
      - id: cbse-12-office-procedures-and-practices-ch06-t01
        title: "Secretary: meaning, importance, types and duties"
        learning_outcomes:
          - Explain the role, types and duties of a secretary in a modern office
      - id: cbse-12-office-procedures-and-practices-ch06-t02
        title: Changing profile, qualifications and qualities of a secretary
        learning_outcomes:
          - Describe the qualifications and personal qualities of an effective secretary and how the role has changed
      - id: cbse-12-office-procedures-and-practices-ch06-t03
        title: Personality development
        learning_outcomes:
          - Identify ways a secretary can develop a professional personality
      - id: cbse-12-office-procedures-and-practices-ch06-t04
        title: Time management and stress management
        learning_outcomes:
          - Apply time-management and stress-management techniques to office work
    removed_topics: []
    literature_texts: []
  - id: cbse-12-office-procedures-and-practices-ch07
    number: 7
    title: Handling the Mail
    unit: "Part B Unit 2: Handling the Mail"
    topics:
      - id: cbse-12-office-procedures-and-practices-ch07-t01
        title: Meaning and types of mail
        learning_outcomes:
          - Classify office mail as inward, outward, inter-office and electronic
      - id: cbse-12-office-procedures-and-practices-ch07-t02
        title: Handling incoming mail
        learning_outcomes:
          - Describe receiving, opening, recording and distributing incoming mail
      - id: cbse-12-office-procedures-and-practices-ch07-t03
        title: Handling outgoing mail and e-mail
        learning_outcomes:
          - Describe the procedure for outgoing post and handling of electronic mail
      - id: cbse-12-office-procedures-and-practices-ch07-t04
        title: Mail-room equipment and postal services
        learning_outcomes:
          - Identify mail-room equipment and describe postal services such as speed post and registered post
    removed_topics: []
    literature_texts: []
  - id: cbse-12-office-procedures-and-practices-ch08
    number: 8
    title: Filing and Indexing
    unit: "Part B Unit 3: Filing and Indexing"
    topics:
      - id: cbse-12-office-procedures-and-practices-ch08-t01
        title: "Filing: meaning, importance and essentials"
        learning_outcomes:
          - Explain the importance and essentials of a good filing system
      - id: cbse-12-office-procedures-and-practices-ch08-t02
        title: Classification and methods of filing
        learning_outcomes:
          - Compare alphabetical, numerical, geographical, subject and chronological classification and horizontal and vertical filing
      - id: cbse-12-office-procedures-and-practices-ch08-t03
        title: E-filing and weeding out of records
        learning_outcomes:
          - Explain e-filing and the procedure for weeding out and destroying old records
      - id: cbse-12-office-procedures-and-practices-ch08-t04
        title: Indexing and filing procedure
        learning_outcomes:
          - Explain the meaning, importance and types of indexing and the steps of the filing procedure
    removed_topics: []
    literature_texts: []
  - id: cbse-12-office-procedures-and-practices-ch09
    number: 9
    title: Arranging Meetings
    unit: "Part B Unit 4: Arranging Meetings"
    topics:
      - id: cbse-12-office-procedures-and-practices-ch09-t01
        title: "Meetings: meaning, importance and types"
        learning_outcomes:
          - Classify meetings and explain their importance
      - id: cbse-12-office-procedures-and-practices-ch09-t02
        title: Requisites of a valid meeting
        learning_outcomes:
          - Explain notice, agenda, quorum, chairman, motions and resolutions, adjournment and minutes
      - id: cbse-12-office-procedures-and-practices-ch09-t03
        title: Secretarial duties before, during and after meetings
        learning_outcomes:
          - List the secretary's duties relating to meetings
      - id: cbse-12-office-procedures-and-practices-ch09-t04
        title: Terms relating to meetings
        learning_outcomes:
          - Define terms such as proxy, point of order, casting vote and sine die
    removed_topics: []
    literature_texts: []
  - id: cbse-12-office-procedures-and-practices-ch10
    number: 10
    title: Travel Arrangements
    unit: "Part B Unit 5: Travel Arrangements"
    topics:
      - id: cbse-12-office-procedures-and-practices-ch10-t01
        title: Modes of travel and reservations
        learning_outcomes:
          - Compare modes of travel and describe rail and air reservations and e-tickets versus paper tickets
      - id: cbse-12-office-procedures-and-practices-ch10-t02
        title: Travel agencies and hotel reservation
        learning_outcomes:
          - Explain the role of travel agencies and the procedure for hotel reservation
      - id: cbse-12-office-procedures-and-practices-ch10-t03
        title: Itinerary and organising travel
        learning_outcomes:
          - Prepare an itinerary and organise travel for an executive
      - id: cbse-12-office-procedures-and-practices-ch10-t04
        title: Tour advance, tour claim and overseas travel
        learning_outcomes:
          - Explain tour advance and tour claim and arrangements for overseas travel
    removed_topics: []
    literature_texts: []
  - id: cbse-12-office-procedures-and-practices-ch11
    number: 11
    title: Banking Services
    unit: "Part B Unit 6: Banking Services"
    topics:
      - id: cbse-12-office-procedures-and-practices-ch11-t01
        title: Services provided by banks
        learning_outcomes:
          - Describe banking services used by offices, such as accounts, cheques, drafts and online transfers
      - id: cbse-12-office-procedures-and-practices-ch11-t02
        title: Terms used in banking transactions
        learning_outcomes:
          - Define common banking terms such as overdraft, crossing, endorsement and KYC
      - id: cbse-12-office-procedures-and-practices-ch11-t03
        title: Office banking procedures
        learning_outcomes:
          - Describe procedures for depositing, withdrawing and reconciling office bank transactions
    removed_topics: []
    literature_texts: []
removed_topics: []
