chapters:
  - id: cbse-12-physical-activity-trainer-ch01
    number: 1
    title: "Employability Skills: Communication Skills – IV"
    unit: "Part A Unit 1: Communication Skills – IV"
    topics:
      - id: cbse-12-physical-activity-trainer-ch01-t01
        title: Active listening at the workplace
        learning_outcomes:
          - Explain why active listening matters at work and list the barriers to it
          - Describe the steps of active listening and apply them in a role play
      - id: cbse-12-physical-activity-trainer-ch01-t02
        title: Sentences and phrases; kinds and parts of a sentence
        learning_outcomes:
          - Distinguish a phrase from a sentence and classify sentences as declarative, interrogative, imperative or exclamatory
          - Identify the subject, predicate and object in a sentence
      - id: cbse-12-physical-activity-trainer-ch01-t03
        title: Parts of speech and articles
        learning_outcomes:
          - Identify nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections in workplace sentences
          - Use the articles a, an and the correctly
      - id: cbse-12-physical-activity-trainer-ch01-t04
        title: Constructing a paragraph
        learning_outcomes:
          - Write a well-organised paragraph with a topic sentence, supporting sentences and a conclusion on a subject-related theme
    removed_topics: []
    literature_texts: []
  - id: cbse-12-physical-activity-trainer-ch02
    number: 2
    title: "Employability Skills: Self-Management Skills – IV"
    unit: "Part A Unit 2: Self-Management Skills – IV"
    topics:
      - id: cbse-12-physical-activity-trainer-ch02-t01
        title: Motivation and self-motivation
        learning_outcomes:
          - Explain internal and external motivation and list personal needs and desires that drive motivation
      - id: cbse-12-physical-activity-trainer-ch02-t02
        title: Sources of motivation and a positive outlook
        learning_outcomes:
          - Identify sources of inspiration (people, books, music, activities) and techniques to stay positive and focused on goals
      - id: cbse-12-physical-activity-trainer-ch02-t03
        title: "Personality: meaning, influence and traits"
        learning_outcomes:
          - Define personality and explain how it influences others at work
          - Describe the five basic personality traits (openness, conscientiousness, extraversion, agreeableness, neuroticism)
      - id: cbse-12-physical-activity-trainer-ch02-t04
        title: Personality disorders and how to overcome them
        learning_outcomes:
          - >-
            Describe common personality disorders (paranoid, antisocial, schizoid, borderline, narcissistic, avoidant, dependent, obsessive)
            and the clusters they belong to
          - Suggest steps to seek help and overcome personality problems
    removed_topics: []
    literature_texts: []
  - id: cbse-12-physical-activity-trainer-ch03
    number: 3
    title: "Employability Skills: ICT Skills – IV"
    unit: "Part A Unit 3: ICT Skills – IV"
    topics:
      - id: cbse-12-physical-activity-trainer-ch03-t01
        title: "Spreadsheet basics: workbook, worksheet and data entry"
        learning_outcomes:
          - Name common spreadsheet applications and create, open and save a workbook
          - Enter text and numbers, resize fonts and apply styles
      - id: cbse-12-physical-activity-trainer-ch03-t02
        title: Editing and organising spreadsheet data
        learning_outcomes:
          - Copy and move cell data, sort data and apply filters to a table
      - id: cbse-12-physical-activity-trainer-ch03-t03
        title: Formulas, functions, protection and printing
        learning_outcomes:
          - Use elementary formulas and functions such as SUM, AVERAGE, MIN and MAX
          - Protect a spreadsheet with a password, print it and save it in different formats
      - id: cbse-12-physical-activity-trainer-ch03-t04
        title: Creating a presentation
        learning_outcomes:
          - Name presentation software packages and list features of a good presentation
          - Create a presentation and add or delete slides
      - id: cbse-12-physical-activity-trainer-ch03-t05
        title: Editing and formatting presentations
        learning_outcomes:
          - Enter, edit and format text, insert clipart and images, choose slide layouts, and save and print a presentation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-physical-activity-trainer-ch04
    number: 4
    title: "Employability Skills: Entrepreneurial Skills – IV"
    unit: "Part A Unit 4: Entrepreneurial Skills – IV"
    topics:
      - id: cbse-12-physical-activity-trainer-ch04-t01
        title: Barriers to becoming an entrepreneur
        learning_outcomes:
          - Classify barriers to entrepreneurship (environmental, personal, financial, social) with examples and ways to overcome them
      - id: cbse-12-physical-activity-trainer-ch04-t02
        title: Behavioural and entrepreneurial competencies
        learning_outcomes:
          - >-
            Describe competencies such as adaptability, decisiveness, initiative, perseverance, interpersonal and organisational skills,
            stress management and valuing service and diversity
      - id: cbse-12-physical-activity-trainer-ch04-t03
        title: Entrepreneurial competencies in particular
        learning_outcomes:
          - >-
            Explain self-confidence, seeing and acting on opportunities, concern for quality, goal setting, risk taking, problem solving,
            systematic planning, information seeking, persistence, negotiating and team building
      - id: cbse-12-physical-activity-trainer-ch04-t04
        title: Self-assessment of entrepreneurial behaviour
        learning_outcomes:
          - Rate oneself on behavioural competencies and prepare a personal competency profile
          - Relate competencies to stories of successful Indian entrepreneurs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-physical-activity-trainer-ch05
    number: 5
    title: "Employability Skills: Green Skills – IV"
    unit: "Part A Unit 5: Green Skills – IV"
    topics:
      - id: cbse-12-physical-activity-trainer-ch05-t01
        title: Green jobs in homes, gardening, transport and energy conservation
        learning_outcomes:
          - Explain the role of green jobs in toxin-free homes, organic gardening, public transport and energy conservation
      - id: cbse-12-physical-activity-trainer-ch05-t02
        title: Green jobs in water, renewable energy and waste
        learning_outcomes:
          - Describe green jobs in water conservation, solar and wind power, and waste reduction, reuse and recycling
      - id: cbse-12-physical-activity-trainer-ch05-t03
        title: Green jobs in tourism, construction and appropriate technology
        learning_outcomes:
          - Give examples of green jobs in green tourism, building and construction and appropriate technology
      - id: cbse-12-physical-activity-trainer-ch05-t04
        title: Role of green jobs in protecting the environment
        learning_outcomes:
          - >-
            Explain how green jobs improve energy and raw-material use, limit greenhouse-gas emissions, minimise waste and pollution,
            restore ecosystems and support adaptation to climate change
    removed_topics: []
    literature_texts: []
  - id: cbse-12-physical-activity-trainer-ch06
    number: 6
    title: Overview of Physical Education and Sports Sector
    unit: "Part B Unit 1: Overview of Physical Education and Sports Sector"
    topics:
      - id: cbse-12-physical-activity-trainer-ch06-t01
        title: Careers in physical education and sports
        learning_outcomes:
          - >-
            Describe job profiles in teaching, coaching, sports management, fitness, equipment management, sports journalism, photography,
            medicine, psychology and nutrition
      - id: cbse-12-physical-activity-trainer-ch06-t02
        title: Physical activity, games, sports and recreation
        learning_outcomes:
          - Differentiate physical activity, games, sports and recreation for different age groups
      - id: cbse-12-physical-activity-trainer-ch06-t03
        title: Life skills through sports
        learning_outcomes:
          - Explain how sports teach teamwork, dealing with failure, hard work, sacrifice, discipline and time management
    removed_topics: []
    literature_texts: []
  - id: cbse-12-physical-activity-trainer-ch07
    number: 7
    title: Assessment of Students
    unit: "Part B Unit 2: Assessment of Students"
    topics:
      - id: cbse-12-physical-activity-trainer-ch07-t01
        title: Meaning and types of assessment
        learning_outcomes:
          - Compare self-assessment, peer assessment, teacher observation and homework
      - id: cbse-12-physical-activity-trainer-ch07-t02
        title: Factors influencing assessment and assessment tools
        learning_outcomes:
          - Identify physical, school and teacher factors and use checklists, rubrics and benchmarks
      - id: cbse-12-physical-activity-trainer-ch07-t03
        title: Types of evaluation
        learning_outcomes:
          - Distinguish formative, summative and diagnostic evaluation
      - id: cbse-12-physical-activity-trainer-ch07-t04
        title: Qualitative and quantitative assessment
        learning_outcomes:
          - Describe the steps of qualitative and quantitative assessment
      - id: cbse-12-physical-activity-trainer-ch07-t05
        title: Organising assessment and quality physical education
        learning_outcomes:
          - Describe elements of the teaching process, ongoing evaluation and key success factors of physical education
    removed_topics: []
    literature_texts: []
  - id: cbse-12-physical-activity-trainer-ch08
    number: 8
    title: Emergency Management
    unit: "Part B Unit 3: Emergency Management"
    topics:
      - id: cbse-12-physical-activity-trainer-ch08-t01
        title: Emergency response
        learning_outcomes:
          - Explain the need for emergency response and plan for it
      - id: cbse-12-physical-activity-trainer-ch08-t02
        title: Common emergencies on the field
        learning_outcomes:
          - Respond to heat stroke, allergies, asthma attacks and sudden cardiac arrest, including CPR
      - id: cbse-12-physical-activity-trainer-ch08-t03
        title: "First aid: DRABC and principles"
        learning_outcomes:
          - Apply the DRABC sequence and the purpose and principles of first aid
      - id: cbse-12-physical-activity-trainer-ch08-t04
        title: Sports injuries and R.I.C.E.
        learning_outcomes:
          - Manage sprains and strains using R.I.C.E. and maintain a first-aid kit
      - id: cbse-12-physical-activity-trainer-ch08-t05
        title: Role of the first responder and area safety inspection
        learning_outcomes:
          - Describe the first responder's responsibilities and safety inspection of play areas
    removed_topics: []
    literature_texts: []
  - id: cbse-12-physical-activity-trainer-ch09
    number: 9
    title: Health and Hygiene in Play Area
    unit: "Part B Unit 4: Health and Hygiene in Play Area"
    topics:
      - id: cbse-12-physical-activity-trainer-ch09-t01
        title: Players' health and hygiene
        learning_outcomes:
          - Explain how to maintain players' health and personal hygiene
      - id: cbse-12-physical-activity-trainer-ch09-t02
        title: General hygiene and sanitation rules
        learning_outcomes:
          - State general hygiene and sanitation rules for sports facilities
      - id: cbse-12-physical-activity-trainer-ch09-t03
        title: Inspection and maintenance of facilities and kits
        learning_outcomes:
          - Distinguish low- and high-frequency inspections and inspect personal items and kits
