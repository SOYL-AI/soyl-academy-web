notes: >-
  SOYL default modelled on the CBSE board pattern (CONTEXT section 9: "use a generic blueprint per board and subject, stored as editable

  config"); not an official CBSE paper. Item types and marks follow the 2026-27 CBSE board style (MCQ/assertion-reason 1, short 2-3, long 5,

  case-based 4, about one-third internal choice) so practice transfers to the board paper. Subject-family override (commerce) of the class
  default in platform/catalog/cbse/blueprints/<class>/. Mirrors the 1/3/4/6-mark structure of the CBSE Class XII Accountancy, Business
  Studies and Economics

  papers. FORMAT MAPPING: journal entries, ledger accounts, statements and computations (Accountancy) and diagrams (Economics) are
  short/long

  items with step marks; a tabular answer type would fit Accountancy better.
