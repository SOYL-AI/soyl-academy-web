# CBSE Class 12 Business Studies (054), 2026-27. 12 units = 12 NCERT chapters. Mark groupings as printed (16/14/20 and 15/15).
subject_id: cbse-12-business-studies
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-business-studies-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - cbse-sqp-xii-2026-27
  - cbse-sqp-notification-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  Theory 80 marks (3 hours) + project 20 (one project). Part A Principles and Functions of Management 50; Part B Business Finance and
  Marketing 30. Case-based questions are a major part of the paper. Single board exam (February-March 2027).
units:
  - name: "Units 1-2: Nature and Significance of Management; Principles of Management"
    marks: 16
  - name: "Units 3-4: Business Environment; Planning"
    marks: 14
  - name: "Units 5-8: Organising; Staffing; Directing; Controlling"
    marks: 20
  - name: "Units 9-10: Financial Management; Financial Markets"
    marks: 15
  - name: "Units 11-12: Marketing Management; Consumer Protection"
    marks: 15
