        title_en: 'Unseen passage 1: multiple-choice questions'
        learning_outcomes:
          - Read an unseen Tamil passage and answer five MCQs
      - id: cbse-12-tamil-ch01-t02
        title: 'காணாப் பகுதி 2: குறுவினாக்கள்'
        title_en: 'Unseen passage 2: short answers'
        learning_outcomes:
          - Answer five short questions on an unseen passage in their own words
    removed_topics: []
    literature_texts: []
  - id: cbse-12-tamil-ch02
    number: 2
    title: பிழை திருத்தம், வல்லினம் மிகும் இடங்கள்
    title_en: Error correction and doubling of hard consonants
    unit: 'பிரிவு ஆ: இலக்கணம்'
    topics:
      - id: cbse-12-tamil-ch02-t01
        title: ல, ள, ழ; ந, ண, ன; ர, ற வேறுபாடுகள்
        title_en: Differences between la/la/zha, na/na/na and ra/ra
        learning_outcomes:
          - Correct spelling errors caused by confusing similar-sounding Tamil letters
      - id: cbse-12-tamil-ch02-t02
        title: வல்லினம் மிகும் இடங்கள்
        title_en: Where hard consonants double (vallinam migum idangal)
        learning_outcomes:
          - Apply the rules for doubling of hard consonants in joined words
    removed_topics: []
    literature_texts: []
  - id: cbse-12-tamil-ch03
    number: 3
    title: வினை வகைகளும் வாக்கிய வகைகளும்
    title_en: Kinds of verbs and sentences
    unit: 'பிரிவு ஆ: இலக்கணம்'
    topics:
      - id: cbse-12-tamil-ch03-t01
        title: தன்வினை, பிறவினை, செய்வினை, செயப்பாட்டுவினை
        title_en: Self and causative verbs; active and passive voice
        learning_outcomes:
          - Give examples of and convert between thanvinai/piravinai and seyvinai/seyappaattuvinai
      - id: cbse-12-tamil-ch03-t02
        title: உடன்பாட்டு வினை, எதிர்மறை வினை, நேர்க்கூற்று, அயற்கூற்று
        title_en: Affirmative and negative; direct and indirect speech
        learning_outcomes:
          - Convert sentences between affirmative and negative forms and between direct and indirect speech
      - id: cbse-12-tamil-ch03-t03
        title: தனிவாக்கியம், தொடர்வாக்கியம், கலவை வாக்கியம்
        title_en: Simple, compound and complex sentences
        learning_outcomes:
          - Identify and form simple, compound and complex sentences
    removed_topics: []
    literature_texts: []
