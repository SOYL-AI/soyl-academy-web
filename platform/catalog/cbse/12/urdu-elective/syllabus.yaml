# CBSE Class 12 Urdu Elective (003), 2026-27. Sections, marks, literary-history areas, figures of speech and deleted lessons
# as printed in the CBSE 2026-27 Urdu Elective Classes XI-XII syllabus (Class XII table). Books: Gulistan-e-Adab (Class XII,
# NCERT), supplementary reader Khayaban-e-Urdu (NCERT); references Urdu Adab ki Tareekh and Urdu Qawaid (NCERT). CBSE lists
# only the DELETED lessons (in Roman script; the Urdu spellings in removed_topics are ours), so the two textbook chapters
# carry placeholder topics until the NCERT contents pages are supplied. Literature: titles and authors only (CONTEXT §8).
subject_id: cbse-12-urdu-elective
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-urdu-elective-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  Theory 80 marks (3 hours) + 20 internal (listening and speaking 10, project 10). Section A Textbooks and supplementary
  reader 50: prose from Gulistan-e-Adab 20 (two short extracts, one unseen and one from a prescribed lesson, with
  objective comprehension questions 5x2; one essay-type question of about 100 words on content or theme with internal
  choice 5; two short-answer questions 5); poetry from Gulistan-e-Adab 20 (two extracts, one unseen and one prescribed,
  with objective questions 5x2; an essay-type question of about 100 words 5; two short-answer questions 5);
  Khayaban-e-Urdu 10 (one of two essay-type questions 4, two of four short-answer questions 6). Section B History of
  Urdu literature 20: three of five long-answer questions 15 on the origin and development of Urdu (Fort William
  College, Delhi and Lucknow schools), the lives and contributions of the textbook authors and poets, and literary
  movements (Sir Syed movement, Progressive movement); five objective questions 5. Section C Figures of speech 10: five
  of eight short-answer questions.
units:
  - name: 'حصہ الف: درسی کتب اور معاون درسی کتاب'
    marks: 50
  - name: 'حصہ ب: تاریخ ادب اردو'
    marks: 20
  - name: 'حصہ ج: صنائع و بدائع'
    marks: 10
  - name: 'حصہ د: سماعت و گفتگو اور پروجیکٹ (داخلی)'
    marks: 20
chapters:
  - id: cbse-12-urdu-elective-ch01
    number: 1
    title: غیر درسی اقتباسات (نثر و نظم)
    title_en: Unseen extracts (prose and poetry)
    unit: 'حصہ الف: درسی کتب اور معاون درسی کتاب'
    topics:
      - id: cbse-12-urdu-elective-ch01-t01
        title: غیر درسی نثری اقتباس
        title_en: Unseen prose extract
        learning_outcomes:
          - >-
            Read an unseen literary prose extract and answer objective comprehension questions on content, style and
            vocabulary
      - id: cbse-12-urdu-elective-ch01-t02
        title: غیر درسی شعری اقتباس
        title_en: Unseen poetic extract
        learning_outcomes:
          - Read unseen verse and answer objective questions on meaning, imagery and poetic devices
    removed_topics: []
    literature_texts: []
  - id: cbse-12-urdu-elective-ch02
    number: 2
    title: 'درسی کتاب: گلستان ادب (حصہ نثر و نظم)'
    title_en: 'Prescribed textbook: Gulistan-e-Adab (Class XII) - prose and poetry'
    unit: 'حصہ الف: درسی کتب اور معاون درسی کتاب'
    topics:
      - id: cbse-12-urdu-elective-ch02-t01
        title: نثری اسباق (فہرست درکار)
        title_en: Prose lessons (lesson list pending NCERT contents page)
        learning_outcomes:
          - Answer objective questions on an extract from a prescribed prose lesson
          - Write an answer of about 100 words on the content or theme of a lesson, and short answers on its details
      - id: cbse-12-urdu-elective-ch02-t02
        title: شعرا اور ان کا کلام (فہرست درکار)
        title_en: Poets and poems (lesson list pending NCERT contents page)
        learning_outcomes:
          - Answer objective questions on an extract from a prescribed poem or ghazal
          - Write an answer of about 100 words on the content or theme of a poem, and short answers on it
    removed_topics:
      - مکتوب غالب حقیر کے نام
      - امراؤ جان (مضمون)
      - بجوکا (افسانہ)
      - میں، وہ (افسانہ)
      - غزل - بانی
      - ملک بے سحر و شام (نظم)
      - یادنگر (نظم)
      - وقت کا ترانہ (نظم)
      - غالب جدید شعرا کی ایک مجلس میں (طنز و مزاح)
    literature_texts: []
  - id: cbse-12-urdu-elective-ch03
    number: 3
    title: 'معاون درسی کتاب: خیابان اردو'
    title_en: 'Supplementary reader: Khayaban-e-Urdu'
    unit: 'حصہ الف: درسی کتب اور معاون درسی کتاب'
    topics:
      - id: cbse-12-urdu-elective-ch03-t01
        title: معاون درسی کتاب کے اسباق (فہرست درکار)
        title_en: Supplementary reader lessons (lesson list pending NCERT contents page)
        learning_outcomes:
          - >-
            Write an essay-type answer and short answers on the novels, plays, essays and stories of the supplementary
            reader
    removed_topics:
      - بیوہ (ناول) - پریم چند
      - یہودی کی لڑکی (ڈراما) - آغا حشر کاشمیری
      - مرحوم کی یاد میں (انشائیہ) - پطرس بخاری
    literature_texts: []
  - id: cbse-12-urdu-elective-ch04
    number: 4
    title: اردو زبان کا آغاز و ارتقا
    title_en: Origin and development of the Urdu language
    unit: 'حصہ ب: تاریخ ادب اردو'
    topics:
      - id: cbse-12-urdu-elective-ch04-t01
        title: اردو زبان کا آغاز اور ارتقا
        title_en: Origin and growth of Urdu
        learning_outcomes:
          - Explain the main theories of the origin of Urdu and trace its early development
      - id: cbse-12-urdu-elective-ch04-t02
        title: فورٹ ولیم کالج
        title_en: Fort William College
        learning_outcomes:
          - Describe the role of Fort William College in the growth of Urdu prose
      - id: cbse-12-urdu-elective-ch04-t03
        title: دبستان دہلی اور دبستان لکھنؤ
        title_en: The Delhi and Lucknow schools of poetry
        learning_outcomes:
          - Compare the features of the Delhi and Lucknow schools and name their leading poets
    removed_topics: []
    literature_texts: []
  - id: cbse-12-urdu-elective-ch05
    number: 5
    title: مصنفین اور شعرا کے حالات زندگی اور ادبی خدمات
    title_en: Lives and contributions of the textbook writers and poets
    unit: 'حصہ ب: تاریخ ادب اردو'
    topics:
      - id: cbse-12-urdu-elective-ch05-t01
        title: نثر نگاروں کے حالات اور خدمات
        title_en: Prose writers of the textbook
        learning_outcomes:
          - Write about the life, major works and literary contribution of the prose writers in the prescribed book
      - id: cbse-12-urdu-elective-ch05-t02
        title: شعرا کے حالات اور خدمات
        title_en: Poets of the textbook
        learning_outcomes:
          - Write about the life, major works and literary contribution of the poets in the prescribed book
    removed_topics: []
    literature_texts: []
  - id: cbse-12-urdu-elective-ch06
    number: 6
    title: ادبی تحریکات
    title_en: Literary movements
    unit: 'حصہ ب: تاریخ ادب اردو'
    topics:
      - id: cbse-12-urdu-elective-ch06-t01
        title: سر سید تحریک
        title_en: The Sir Syed (Aligarh) movement
        learning_outcomes:
          - Explain the aims of the Sir Syed movement and its influence on Urdu prose, journalism and education
      - id: cbse-12-urdu-elective-ch06-t02
        title: ترقی پسند ادبی تحریک
        title_en: The Progressive Writers' movement
        learning_outcomes:
          - Explain the ideas of the Progressive movement and name its leading writers and poets
    removed_topics: []
    literature_texts: []
  - id: cbse-12-urdu-elective-ch07
    number: 7
    title: صنائع و بدائع
    title_en: Figures of speech and poetic terms
    unit: 'حصہ ج: صنائع و بدائع'
    topics:
      - id: cbse-12-urdu-elective-ch07-t01
        title: مطلع، مقطع، حسن مطلع، قافیہ، ردیف
        title_en: Matla, maqta, husn-e-matla, qafiya, radeef
        learning_outcomes:
          - Define these terms and identify them in a ghazal
      - id: cbse-12-urdu-elective-ch07-t02
        title: صنعت تشبیہ، استعارہ، تلمیح
        title_en: Simile, metaphor and allusion
        learning_outcomes:
          - Define tashbeeh, isti'ara and talmeeh and identify them in couplets
      - id: cbse-12-urdu-elective-ch07-t03
        title: صنعت تضاد، صنعت تعلی، حسن تعلیل، مراعاۃ النظیر
        title_en: Antithesis, poetic self-praise, poetic aetiology, congruity
        learning_outcomes:
          - Define tazaad, ta'alli, husn-e-ta'leel and muraat-un-nazeer and identify them in verse
    removed_topics: []
    literature_texts: []
  - id: cbse-12-urdu-elective-ch08
    number: 8
    title: سماعت و گفتگو کی مہارت اور پروجیکٹ
    title_en: Listening and speaking skills and project work (internal assessment)
    unit: 'حصہ د: سماعت و گفتگو اور پروجیکٹ (داخلی)'
    topics:
      - id: cbse-12-urdu-elective-ch08-t01
        title: سماعت کی مہارت
        title_en: Listening skills
        learning_outcomes:
          - Listen to news bulletins, lectures and talks in Urdu and extract the relevant information
          - Take part in formal group discussions on textbook and current topics and report on them
        board_assessed: false
      - id: cbse-12-urdu-elective-ch08-t02
        title: گفتگو کی مہارت
        title_en: Speaking skills
        learning_outcomes:
          - >-
            Take part in debates, poem recitation, programme anchoring, story telling, role play and picture narration
            in Urdu
          - Speak with interactive competence, fluency, correct pronunciation and accurate vocabulary
        board_assessed: false
      - id: cbse-12-urdu-elective-ch08-t03
        title: پروجیکٹ ورک
        title_en: Project work
        learning_outcomes:
          - >-
            Prepare a project of up to 1000 words on a literary or social theme (for example a review of the textbook or
            a poem, history of Urdu literature, environment, cyber safety) with pictures and data
          - Present the project and answer viva questions on it
        board_assessed: false
