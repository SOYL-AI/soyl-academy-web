notes: >-
  Urdu Elective (003) theory paper, 80 marks, 3 hours, from the CBSE 2026-27 sample question paper and marking scheme. 13 questions in three
  sections (printed in the SQP): A textbook and supplementary reader 50, B history of Urdu literature 20, C sanaye o badaye (rhetoric) 10.
  Nastaliq text extracts out of order, so the split inside A and B is estimated from the legible markers.

  FORMAT MAPPING (languages): unseen passages -> case-based; textbook extracts/passages -> source-based; 1-mark grammar

  and vocabulary items -> short (fill-blank, mcq, match or true-false where the paper clearly uses gap-fill, options, matching or
  true/false);

  writing tasks (letter, essay, paragraph, notice, dialogue, story, e-mail, report, précis) and translation passages -> 'writing' items
  (contract v2: format, word_limit and a rubric that sums to the marks); sentence-level translation and usage items stay 1-mark short. (This paper has no writing task.) "Answer any n" choices inside one question are modelled as internal_choice only where the

  number offered is printed; otherwise only the attempted items are listed. Visually impaired substitute items are not modelled.
