exam_notes: >-
  Theory 80 marks (3 hours) + project 20. Part A 40 (End of Bipolarity 6, Centres of Power 6, South Asia 6, International Organisations 6,
  Security 6, Environment 6, Globalisation 4). Part B 40 (Nation-Building 6, One-Party Dominance 4, Planned Development 2, External
  Relations 6, Congress System 4, Crisis of Democratic Order 4, Regional Aspirations 6, Recent Developments 8). Single board exam
  (February-March 2027).
