notes: >-
  SOYL default modelled on the CBSE board pattern (CONTEXT section 9: "use a generic blueprint per board and subject, stored as editable

  config"); not an official CBSE paper. Item types and marks follow the 2026-27 CBSE board style (MCQ/assertion-reason 1, short 2-3, long 5,

  case-based 4, about one-third internal choice) so practice transfers to the board paper. Subject-family override (humanities) of the class
  default in platform/catalog/cbse/blueprints/<class>/. Source-based questions replace case-based ones, as in the CBSE board papers for
  these subjects. Map work

  (SST, History, Geography) is set only in chapters with map items: the assembler may replace a 2-mark short answer with two 1-mark map
  items.
