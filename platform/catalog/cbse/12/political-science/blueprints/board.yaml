notes: >-
  30 questions: A 12 x 1 MCQ (one assertion-reason), B 6 x 2 (50-60 words), C 5 x 4 (100-120 words; internal choice in two), D 3 x 4

  (Q24 cartoon/picture-based, Q25 passage-based, Q26 map-based), E 4 x 6 (170-180 words; internal choice in all four). Book weightage

  40 + 40 (Contemporary World Politics; Politics in India since Independence). Competency weights (design table): knowledge 27.5% +

  understanding 30% (recall+understanding), applying 27.5%, analysing/evaluating/creating 15%. FORMAT MAPPING: the cartoon and passage

  questions have MCQ sub-parts and are mapped to source-based (cartoon needs an image asset); the map question (identify four states on an

  outline map of India, 1 mark each) has no QuestionType and is modelled as four 1-mark short items to be drawn together. Visually impaired
  candidates get substitute questions for items with visual input (not modelled).
