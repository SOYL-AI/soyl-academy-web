# CBSE Class 12 Typography and Computer Application (817), 2026-27 skill subject. Built from the CBSE 2026-27 skill curriculum; theory component only (practical work is listed in exam_notes).
subject_id: cbse-12-typography-and-computer-application
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-typography-817-2026-27
  - cbse-skill-curriculum-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - cbse-sqp-xii-2026-27
exam_notes: >-
  Total 100 = theory 60 + practical 40 (project 10, viva 5, practical file 15, skill demonstration 10; practical includes a 30 w.p.m.
  English typing speed test, a 200-word manuscript with 10 proof corrections or a business letter, an Excel worksheet and a presentation).
  Part A Employability Skills 10 marks, Part B subject-specific skills 50 marks. Theory paper 60 marks, 3 hours: Section A objective 30
  (Employability Skills 4 of 6 + subject 26 from 5 questions with internal choice); Section B subjective 30 (Employability Skills 3 of 5 x
  2; subject 3 of 5 x 2, 2 of 3 x 3, 3 of 5 x 4). Single board exam (February-March 2027).
