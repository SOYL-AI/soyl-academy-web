chapters:
  - id: cbse-12-typography-and-computer-application-ch01
    number: 1
    title: "Employability Skills: Communication Skills – IV"
    unit: "Part A Unit 1: Communication Skills – IV"
    topics:
      - id: cbse-12-typography-and-computer-application-ch01-t01
        title: Active listening at the workplace
        learning_outcomes:
          - Explain why active listening matters at work and list the barriers to it
          - Describe the steps of active listening and apply them in a role play
      - id: cbse-12-typography-and-computer-application-ch01-t02
        title: Sentences and phrases; kinds and parts of a sentence
        learning_outcomes:
          - Distinguish a phrase from a sentence and classify sentences as declarative, interrogative, imperative or exclamatory
          - Identify the subject, predicate and object in a sentence
      - id: cbse-12-typography-and-computer-application-ch01-t03
        title: Parts of speech and articles
        learning_outcomes:
          - Identify nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections in workplace sentences
          - Use the articles a, an and the correctly
      - id: cbse-12-typography-and-computer-application-ch01-t04
        title: Constructing a paragraph
        learning_outcomes:
          - Write a well-organised paragraph with a topic sentence, supporting sentences and a conclusion on a subject-related theme
    removed_topics: []
    literature_texts: []
  - id: cbse-12-typography-and-computer-application-ch02
    number: 2
    title: "Employability Skills: Self-Management Skills – IV"
    unit: "Part A Unit 2: Self-Management Skills – IV"
    topics:
      - id: cbse-12-typography-and-computer-application-ch02-t01
        title: Motivation and self-motivation
        learning_outcomes:
          - Explain internal and external motivation and list personal needs and desires that drive motivation
      - id: cbse-12-typography-and-computer-application-ch02-t02
        title: Sources of motivation and a positive outlook
        learning_outcomes:
          - Identify sources of inspiration (people, books, music, activities) and techniques to stay positive and focused on goals
      - id: cbse-12-typography-and-computer-application-ch02-t03
        title: "Personality: meaning, influence and traits"
        learning_outcomes:
          - Define personality and explain how it influences others at work
          - Describe the five basic personality traits (openness, conscientiousness, extraversion, agreeableness, neuroticism)
      - id: cbse-12-typography-and-computer-application-ch02-t04
        title: Personality disorders and how to overcome them
        learning_outcomes:
          - >-
            Describe common personality disorders (paranoid, antisocial, schizoid, borderline, narcissistic, avoidant, dependent, obsessive)
            and the clusters they belong to
          - Suggest steps to seek help and overcome personality problems
    removed_topics: []
    literature_texts: []
  - id: cbse-12-typography-and-computer-application-ch03
    number: 3
    title: "Employability Skills: ICT Skills – IV"
    unit: "Part A Unit 3: ICT Skills – IV"
    topics:
      - id: cbse-12-typography-and-computer-application-ch03-t01
        title: "Spreadsheet basics: workbook, worksheet and data entry"
        learning_outcomes:
          - Name common spreadsheet applications and create, open and save a workbook
          - Enter text and numbers, resize fonts and apply styles
      - id: cbse-12-typography-and-computer-application-ch03-t02
        title: Editing and organising spreadsheet data
        learning_outcomes:
          - Copy and move cell data, sort data and apply filters to a table
      - id: cbse-12-typography-and-computer-application-ch03-t03
        title: Formulas, functions, protection and printing
        learning_outcomes:
          - Use elementary formulas and functions such as SUM, AVERAGE, MIN and MAX
          - Protect a spreadsheet with a password, print it and save it in different formats
      - id: cbse-12-typography-and-computer-application-ch03-t04
        title: Creating a presentation
        learning_outcomes:
          - Name presentation software packages and list features of a good presentation
          - Create a presentation and add or delete slides
      - id: cbse-12-typography-and-computer-application-ch03-t05
        title: Editing and formatting presentations
        learning_outcomes:
          - Enter, edit and format text, insert clipart and images, choose slide layouts, and save and print a presentation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-typography-and-computer-application-ch04
    number: 4
    title: "Employability Skills: Entrepreneurial Skills – IV"
    unit: "Part A Unit 4: Entrepreneurial Skills – IV"
    topics:
      - id: cbse-12-typography-and-computer-application-ch04-t01
        title: Barriers to becoming an entrepreneur
        learning_outcomes:
          - Classify barriers to entrepreneurship (environmental, personal, financial, social) with examples and ways to overcome them
      - id: cbse-12-typography-and-computer-application-ch04-t02
        title: Behavioural and entrepreneurial competencies
        learning_outcomes:
          - >-
            Describe competencies such as adaptability, decisiveness, initiative, perseverance, interpersonal and organisational skills,
            stress management and valuing service and diversity
      - id: cbse-12-typography-and-computer-application-ch04-t03
        title: Entrepreneurial competencies in particular
        learning_outcomes:
          - >-
            Explain self-confidence, seeing and acting on opportunities, concern for quality, goal setting, risk taking, problem solving,
            systematic planning, information seeking, persistence, negotiating and team building
      - id: cbse-12-typography-and-computer-application-ch04-t04
        title: Self-assessment of entrepreneurial behaviour
        learning_outcomes:
          - Rate oneself on behavioural competencies and prepare a personal competency profile
          - Relate competencies to stories of successful Indian entrepreneurs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-typography-and-computer-application-ch05
    number: 5
    title: "Employability Skills: Green Skills – IV"
    unit: "Part A Unit 5: Green Skills – IV"
    topics:
      - id: cbse-12-typography-and-computer-application-ch05-t01
        title: Green jobs in homes, gardening, transport and energy conservation
        learning_outcomes:
          - Explain the role of green jobs in toxin-free homes, organic gardening, public transport and energy conservation
      - id: cbse-12-typography-and-computer-application-ch05-t02
        title: Green jobs in water, renewable energy and waste
        learning_outcomes:
          - Describe green jobs in water conservation, solar and wind power, and waste reduction, reuse and recycling
      - id: cbse-12-typography-and-computer-application-ch05-t03
        title: Green jobs in tourism, construction and appropriate technology
        learning_outcomes:
          - Give examples of green jobs in green tourism, building and construction and appropriate technology
      - id: cbse-12-typography-and-computer-application-ch05-t04
        title: Role of green jobs in protecting the environment
        learning_outcomes:
          - >-
            Explain how green jobs improve energy and raw-material use, limit greenhouse-gas emissions, minimise waste and pollution,
            restore ecosystems and support adaptation to climate change
    removed_topics: []
    literature_texts: []
  - id: cbse-12-typography-and-computer-application-ch06
    number: 6
    title: Correspondence
    unit: "Part B Unit 1: Correspondence"
    topics:
      - id: cbse-12-typography-and-computer-application-ch06-t01
        title: Business correspondence
        learning_outcomes:
          - Explain the parts and purpose of a business letter
      - id: cbse-12-typography-and-computer-application-ch06-t02
        title: Styles of typing letters
        learning_outcomes:
          - Compare indented, block (fully blocked) and semi-block letter styles
      - id: cbse-12-typography-and-computer-application-ch06-t03
        title: Official correspondence
        learning_outcomes:
          - Distinguish memorandum, office order, demi-official (DO) letter and office note
    removed_topics: []
    literature_texts: []
  - id: cbse-12-typography-and-computer-application-ch07
    number: 7
    title: Manuscript
    unit: "Part B Unit 2: Manuscript"
    topics:
      - id: cbse-12-typography-and-computer-application-ch07-t01
        title: Meaning of a manuscript
        learning_outcomes:
          - Define a manuscript and explain why a fair copy is prepared
      - id: cbse-12-typography-and-computer-application-ch07-t02
        title: Proof-correction signs and symbols
        learning_outcomes:
          - Interpret standard proof-correction signs and apply them to text
      - id: cbse-12-typography-and-computer-application-ch07-t03
        title: Preparing a fair copy
        learning_outcomes:
          - Describe the procedure for preparing a fair copy from a corrected manuscript
    removed_topics: []
    literature_texts: []
  - id: cbse-12-typography-and-computer-application-ch08
    number: 8
    title: Excel
    unit: "Part B Unit 3: Excel"
    topics:
      - id: cbse-12-typography-and-computer-application-ch08-t01
        title: "Starting Excel: window, workbook and worksheet"
        learning_outcomes:
          - Identify parts of the Excel window and create, open, save, print and close a workbook
      - id: cbse-12-typography-and-computer-application-ch08-t02
        title: Editing worksheets
        learning_outcomes:
          - >-
            Select cells and ranges, edit data, add rows, columns and sheets, resize, move and copy, freeze panes, find and replace and use
            AutoFill
      - id: cbse-12-typography-and-computer-application-ch08-t03
        title: Formatting worksheets
        learning_outcomes:
          - Format cells, rows, columns and text, use cell styles, AutoCorrect and Format Painter
      - id: cbse-12-typography-and-computer-application-ch08-t04
        title: Formulas and functions
        learning_outcomes:
          - Create formulas with operators and relative, absolute and mixed references
          - Use SUM, SUMIF, AVERAGE, MAX, MIN, COUNT and COUNTIF
      - id: cbse-12-typography-and-computer-application-ch08-t05
        title: Charts
        learning_outcomes:
          - Identify chart components and create column, bar, area, line and pie charts
    removed_topics: []
    literature_texts: []
  - id: cbse-12-typography-and-computer-application-ch09
    number: 9
    title: PowerPoint
    unit: "Part B Unit 4: PowerPoint"
    topics:
      - id: cbse-12-typography-and-computer-application-ch09-t01
        title: Creating and opening presentations; slide views
        learning_outcomes:
          - Start PowerPoint, create and open presentations and use normal, slide sorter, notes page and slide show views
      - id: cbse-12-typography-and-computer-application-ch09-t02
        title: Working with slides
        learning_outcomes:
          - Add and delete slides, add and format text, WordArt, shapes and images, apply themes, backgrounds and slide master
      - id: cbse-12-typography-and-computer-application-ch09-t03
        title: Objects, animation and slide shows
        learning_outcomes:
          - Apply custom animations and transitions, reorder slides, set slide-show options and rehearse timings
    removed_topics: []
    literature_texts: []
  - id: cbse-12-typography-and-computer-application-ch10
    number: 10
    title: Internet Search
    unit: "Part B Unit 5: Internet Search"
    topics:
      - id: cbse-12-typography-and-computer-application-ch10-t01
        title: Search engines and their types
        learning_outcomes:
          - Explain search engines, their types and popular examples
      - id: cbse-12-typography-and-computer-application-ch10-t02
        title: Finding information through a search engine
        learning_outcomes:
          - Use effective search techniques to find information
      - id: cbse-12-typography-and-computer-application-ch10-t03
        title: E-commerce and e-business
        learning_outcomes:
          - Distinguish types of e-commerce (B2B, B2C, C2C) and e-business
    removed_topics: []
    literature_texts: []
  - id: cbse-12-typography-and-computer-application-ch11
    number: 11
    title: Email
    unit: "Part B Unit 6: Email"
    topics:
      - id: cbse-12-typography-and-computer-application-ch11-t01
        title: Importance of email and email services
        learning_outcomes:
          - Explain the importance of email and common email services
      - id: cbse-12-typography-and-computer-application-ch11-t02
        title: Creating an account, composing and sending mail
        learning_outcomes:
          - Open a Gmail account and compose and send an email with an attachment and formatted text
      - id: cbse-12-typography-and-computer-application-ch11-t03
        title: Managing email
        learning_outcomes:
          - Read, reply to, forward, print and delete mail, add a signature and create folders or labels
    removed_topics: []
    literature_texts: []
  - id: cbse-12-typography-and-computer-application-ch12
    number: 12
    title: Computer Virus
    unit: "Part B Unit 7: Computer Virus"
    topics:
      - id: cbse-12-typography-and-computer-application-ch12-t01
        title: Computer virus versus biological virus
        learning_outcomes:
          - Define a computer virus and compare it with a biological virus
      - id: cbse-12-typography-and-computer-application-ch12-t02
        title: Classification of computer viruses
        learning_outcomes:
          - Classify boot-sector, companion, e-mail, macro and cross-site scripting viruses, logic bombs, worms and Trojan horses
      - id: cbse-12-typography-and-computer-application-ch12-t03
        title: Effects of viruses and protection
        learning_outcomes:
          - Describe effects of viruses, operating-system vulnerability and protection with antivirus software
    removed_topics: []
    literature_texts: []
