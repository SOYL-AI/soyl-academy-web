  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (project 10 - translation, interview, dramatisation, survey or
  self-composed story, one in Class XI and another in Class XII; listening 5; speaking 5). Section A Reading 10: two
  unseen passages of 100-150 words, four direct MCQs and one grammar MCQ each. Section B Grammar 10 MCQs: kokbwtang
  swlaimung, kok saphilmung, kokbiphiring. Section C Composition 15: letter to friends and parents and story writing 5;
  essay 10. Section D Literature 45: prose 10, drama 10, poetry 15, supplementary reader 10 (short answers and
  reference-to-context or explanation long answers). Question design: remembering 25%, understanding 25%, applying
  18.75%, analysing/evaluating/creating 31.25%. Board examination in Class XII.
units:
  - name: Section A - Reading
    marks: 10
  - name: Section B - Grammar
    marks: 10
  - name: Section C - Composition and writing
    marks: 15
  - name: Section D - Literature
    marks: 45
