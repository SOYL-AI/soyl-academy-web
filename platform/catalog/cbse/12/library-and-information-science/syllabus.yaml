chapters:
  - id: cbse-12-library-and-information-science-ch01
    number: 1
    title: "Employability Skills: Communication Skills – IV"
    unit: "Part A Unit 1: Communication Skills – IV"
    topics:
      - id: cbse-12-library-and-information-science-ch01-t01
        title: Active listening at the workplace
        learning_outcomes:
          - Explain why active listening matters at work and list the barriers to it
          - Describe the steps of active listening and apply them in a role play
      - id: cbse-12-library-and-information-science-ch01-t02
        title: Sentences and phrases; kinds and parts of a sentence
        learning_outcomes:
          - Distinguish a phrase from a sentence and classify sentences as declarative, interrogative, imperative or exclamatory
          - Identify the subject, predicate and object in a sentence
      - id: cbse-12-library-and-information-science-ch01-t03
        title: Parts of speech and articles
        learning_outcomes:
          - Identify nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections in workplace sentences
          - Use the articles a, an and the correctly
      - id: cbse-12-library-and-information-science-ch01-t04
        title: Constructing a paragraph
        learning_outcomes:
          - Write a well-organised paragraph with a topic sentence, supporting sentences and a conclusion on a subject-related theme
    removed_topics: []
    literature_texts: []
  - id: cbse-12-library-and-information-science-ch02
    number: 2
    title: "Employability Skills: Self-Management Skills – IV"
    unit: "Part A Unit 2: Self-Management Skills – IV"
    topics:
      - id: cbse-12-library-and-information-science-ch02-t01
        title: Motivation and self-motivation
        learning_outcomes:
          - Explain internal and external motivation and list personal needs and desires that drive motivation
      - id: cbse-12-library-and-information-science-ch02-t02
        title: Sources of motivation and a positive outlook
        learning_outcomes:
          - Identify sources of inspiration (people, books, music, activities) and techniques to stay positive and focused on goals
      - id: cbse-12-library-and-information-science-ch02-t03
        title: "Personality: meaning, influence and traits"
        learning_outcomes:
          - Define personality and explain how it influences others at work
          - Describe the five basic personality traits (openness, conscientiousness, extraversion, agreeableness, neuroticism)
      - id: cbse-12-library-and-information-science-ch02-t04
        title: Personality disorders and how to overcome them
        learning_outcomes:
          - >-
            Describe common personality disorders (paranoid, antisocial, schizoid, borderline, narcissistic, avoidant, dependent, obsessive)
            and the clusters they belong to
          - Suggest steps to seek help and overcome personality problems
    removed_topics: []
    literature_texts: []
  - id: cbse-12-library-and-information-science-ch03
    number: 3
    title: "Employability Skills: ICT Skills – IV"
    unit: "Part A Unit 3: ICT Skills – IV"
    topics:
      - id: cbse-12-library-and-information-science-ch03-t01
        title: "Spreadsheet basics: workbook, worksheet and data entry"
        learning_outcomes:
          - Name common spreadsheet applications and create, open and save a workbook
          - Enter text and numbers, resize fonts and apply styles
      - id: cbse-12-library-and-information-science-ch03-t02
        title: Editing and organising spreadsheet data
        learning_outcomes:
          - Copy and move cell data, sort data and apply filters to a table
      - id: cbse-12-library-and-information-science-ch03-t03
        title: Formulas, functions, protection and printing
        learning_outcomes:
          - Use elementary formulas and functions such as SUM, AVERAGE, MIN and MAX
          - Protect a spreadsheet with a password, print it and save it in different formats
      - id: cbse-12-library-and-information-science-ch03-t04
        title: Creating a presentation
        learning_outcomes:
          - Name presentation software packages and list features of a good presentation
          - Create a presentation and add or delete slides
      - id: cbse-12-library-and-information-science-ch03-t05
        title: Editing and formatting presentations
        learning_outcomes:
          - Enter, edit and format text, insert clipart and images, choose slide layouts, and save and print a presentation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-library-and-information-science-ch04
    number: 4
    title: "Employability Skills: Entrepreneurial Skills – IV"
    unit: "Part A Unit 4: Entrepreneurial Skills – IV"
    topics:
      - id: cbse-12-library-and-information-science-ch04-t01
        title: Barriers to becoming an entrepreneur
        learning_outcomes:
          - Classify barriers to entrepreneurship (environmental, personal, financial, social) with examples and ways to overcome them
      - id: cbse-12-library-and-information-science-ch04-t02
        title: Behavioural and entrepreneurial competencies
        learning_outcomes:
          - >-
            Describe competencies such as adaptability, decisiveness, initiative, perseverance, interpersonal and organisational skills,
            stress management and valuing service and diversity
      - id: cbse-12-library-and-information-science-ch04-t03
        title: Entrepreneurial competencies in particular
        learning_outcomes:
          - >-
            Explain self-confidence, seeing and acting on opportunities, concern for quality, goal setting, risk taking, problem solving,
            systematic planning, information seeking, persistence, negotiating and team building
      - id: cbse-12-library-and-information-science-ch04-t04
        title: Self-assessment of entrepreneurial behaviour
        learning_outcomes:
          - Rate oneself on behavioural competencies and prepare a personal competency profile
          - Relate competencies to stories of successful Indian entrepreneurs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-library-and-information-science-ch05
    number: 5
    title: "Employability Skills: Green Skills – IV"
    unit: "Part A Unit 5: Green Skills – IV"
    topics:
      - id: cbse-12-library-and-information-science-ch05-t01
        title: Green jobs in homes, gardening, transport and energy conservation
        learning_outcomes:
          - Explain the role of green jobs in toxin-free homes, organic gardening, public transport and energy conservation
      - id: cbse-12-library-and-information-science-ch05-t02
        title: Green jobs in water, renewable energy and waste
        learning_outcomes:
          - Describe green jobs in water conservation, solar and wind power, and waste reduction, reuse and recycling
      - id: cbse-12-library-and-information-science-ch05-t03
        title: Green jobs in tourism, construction and appropriate technology
        learning_outcomes:
          - Give examples of green jobs in green tourism, building and construction and appropriate technology
      - id: cbse-12-library-and-information-science-ch05-t04
        title: Role of green jobs in protecting the environment
        learning_outcomes:
          - >-
            Explain how green jobs improve energy and raw-material use, limit greenhouse-gas emissions, minimise waste and pollution,
            restore ecosystems and support adaptation to climate change
    removed_topics: []
    literature_texts: []
  - id: cbse-12-library-and-information-science-ch06
    number: 6
    title: Library Management
    unit: "Part B Unit 1: Library Management"
    topics:
      - id: cbse-12-library-and-information-science-ch06-t01
        title: Collection development policy and selection criteria
        learning_outcomes:
          - Explain collection development for print and e-resources and criteria for selecting documents
      - id: cbse-12-library-and-information-science-ch06-t02
        title: Stack maintenance, stock verification and shelf list
        learning_outcomes:
          - Describe stack maintenance, stock verification and the use of a shelf list
      - id: cbse-12-library-and-information-science-ch06-t03
        title: Human resource management in libraries
        learning_outcomes:
          - Explain the need for HRM, job analysis and staffing patterns in different libraries
      - id: cbse-12-library-and-information-science-ch06-t04
        title: "Financial management: resources and budgeting"
        learning_outcomes:
          - Identify library financial resources and explain budgeting
      - id: cbse-12-library-and-information-science-ch06-t05
        title: Functions of library sections
        learning_outcomes:
          - Describe acquisition, technical processing, circulation, periodicals, binding and preservation and IT support sections
    removed_topics: []
    literature_texts: []
  - id: cbse-12-library-and-information-science-ch07
    number: 7
    title: "Organisation of Library Resources: Advanced"
    unit: "Part B Unit 2: Organisation of Library Resources: Advanced"
    topics:
      - id: cbse-12-library-and-information-science-ch07-t01
        title: PMEST and facet analysis
        learning_outcomes:
          - Explain personality, matter, energy, space and time (PMEST)
      - id: cbse-12-library-and-information-science-ch07-t02
        title: Classification with DDC and Colon Classification
        learning_outcomes:
          - Describe the steps for classifying documents by DDC and CC
      - id: cbse-12-library-and-information-science-ch07-t03
        title: Call number
        learning_outcomes:
          - Explain class number, book number and collection number in a call number
      - id: cbse-12-library-and-information-science-ch07-t04
        title: "Cataloguing: personal and corporate authors"
        learning_outcomes:
          - Distinguish personal and corporate authorship for cataloguing
      - id: cbse-12-library-and-information-science-ch07-t05
        title: Subject headings and MARC 21
        learning_outcomes:
          - Use the Sears List of Subject Headings and keywords and explain MARC 21
    removed_topics: []
    literature_texts: []
  - id: cbse-12-library-and-information-science-ch08
    number: 8
    title: Library and Information Services
    unit: "Part B Unit 3: Library and Information Services"
    topics:
      - id: cbse-12-library-and-information-science-ch08-t01
        title: Types of reference service
        learning_outcomes:
          - Distinguish responsive and anticipatory, and short-range (ready reference) and long-range services
      - id: cbse-12-library-and-information-science-ch08-t02
        title: Modern library and information services
        learning_outcomes:
          - Describe electronic reference services
      - id: cbse-12-library-and-information-science-ch08-t03
        title: Emerging trends in library services
        learning_outcomes:
          - Identify emerging ICT-based library services
    removed_topics: []
    literature_texts: []
  - id: cbse-12-library-and-information-science-ch09
    number: 9
    title: "Computer Applications in Libraries: Advanced"
    unit: "Part B Unit 4: Computer Applications in Libraries: Advanced"
    topics:
      - id: cbse-12-library-and-information-science-ch09-t01
        title: "Library automation software: e-Granthalaya"
        learning_outcomes:
          - Describe features of the proprietary library software e-Granthalaya
      - id: cbse-12-library-and-information-science-ch09-t02
        title: "Open-source library software: Koha"
        learning_outcomes:
          - Describe features of the open-source software Koha
      - id: cbse-12-library-and-information-science-ch09-t03
        title: Social networking tools for libraries
        learning_outcomes:
          - Explain library uses of Facebook, Twitter, RSS, blogs and LinkedIn
    removed_topics: []
    literature_texts: []
  - id: cbse-12-library-and-information-science-ch10
    number: 10
    title: Communication Skills
    unit: "Part B Unit 5: Communication Skills"
    topics:
      - id: cbse-12-library-and-information-science-ch10-t01
        title: Need and importance of communication skills
        learning_outcomes:
          - Explain why communication skills matter for library staff
      - id: cbse-12-library-and-information-science-ch10-t02
        title: Types of communication skills
        learning_outcomes:
          - Classify communication skills
      - id: cbse-12-library-and-information-science-ch10-t03
        title: Interpersonal communication skills
        learning_outcomes:
          - Apply interpersonal skills while serving library users
    removed_topics: []
    literature_texts: []
