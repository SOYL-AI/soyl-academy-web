chapters:
  - id: cbse-12-medical-diagnostics-ch01
    number: 1
    title: "Employability Skills: Communication Skills – IV"
    unit: "Part A Unit 1: Communication Skills – IV"
    topics:
      - id: cbse-12-medical-diagnostics-ch01-t01
        title: Active listening at the workplace
        learning_outcomes:
          - Explain why active listening matters at work and list the barriers to it
          - Describe the steps of active listening and apply them in a role play
      - id: cbse-12-medical-diagnostics-ch01-t02
        title: Sentences and phrases; kinds and parts of a sentence
        learning_outcomes:
          - Distinguish a phrase from a sentence and classify sentences as declarative, interrogative, imperative or exclamatory
          - Identify the subject, predicate and object in a sentence
      - id: cbse-12-medical-diagnostics-ch01-t03
        title: Parts of speech and articles
        learning_outcomes:
          - Identify nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections in workplace sentences
          - Use the articles a, an and the correctly
      - id: cbse-12-medical-diagnostics-ch01-t04
        title: Constructing a paragraph
        learning_outcomes:
          - Write a well-organised paragraph with a topic sentence, supporting sentences and a conclusion on a subject-related theme
    removed_topics: []
    literature_texts: []
  - id: cbse-12-medical-diagnostics-ch02
    number: 2
    title: "Employability Skills: Self-Management Skills – IV"
    unit: "Part A Unit 2: Self-Management Skills – IV"
    topics:
      - id: cbse-12-medical-diagnostics-ch02-t01
        title: Motivation and self-motivation
        learning_outcomes:
          - Explain internal and external motivation and list personal needs and desires that drive motivation
      - id: cbse-12-medical-diagnostics-ch02-t02
        title: Sources of motivation and a positive outlook
        learning_outcomes:
          - Identify sources of inspiration (people, books, music, activities) and techniques to stay positive and focused on goals
      - id: cbse-12-medical-diagnostics-ch02-t03
        title: "Personality: meaning, influence and traits"
        learning_outcomes:
          - Define personality and explain how it influences others at work
          - Describe the five basic personality traits (openness, conscientiousness, extraversion, agreeableness, neuroticism)
      - id: cbse-12-medical-diagnostics-ch02-t04
        title: Personality disorders and how to overcome them
        learning_outcomes:
          - >-
            Describe common personality disorders (paranoid, antisocial, schizoid, borderline, narcissistic, avoidant, dependent, obsessive)
            and the clusters they belong to
          - Suggest steps to seek help and overcome personality problems
    removed_topics: []
    literature_texts: []
  - id: cbse-12-medical-diagnostics-ch03
    number: 3
    title: "Employability Skills: ICT Skills – IV"
    unit: "Part A Unit 3: ICT Skills – IV"
    topics:
      - id: cbse-12-medical-diagnostics-ch03-t01
        title: "Spreadsheet basics: workbook, worksheet and data entry"
        learning_outcomes:
          - Name common spreadsheet applications and create, open and save a workbook
          - Enter text and numbers, resize fonts and apply styles
      - id: cbse-12-medical-diagnostics-ch03-t02
        title: Editing and organising spreadsheet data
        learning_outcomes:
          - Copy and move cell data, sort data and apply filters to a table
      - id: cbse-12-medical-diagnostics-ch03-t03
        title: Formulas, functions, protection and printing
        learning_outcomes:
          - Use elementary formulas and functions such as SUM, AVERAGE, MIN and MAX
          - Protect a spreadsheet with a password, print it and save it in different formats
      - id: cbse-12-medical-diagnostics-ch03-t04
        title: Creating a presentation
        learning_outcomes:
          - Name presentation software packages and list features of a good presentation
          - Create a presentation and add or delete slides
      - id: cbse-12-medical-diagnostics-ch03-t05
        title: Editing and formatting presentations
        learning_outcomes:
          - Enter, edit and format text, insert clipart and images, choose slide layouts, and save and print a presentation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-medical-diagnostics-ch04
    number: 4
    title: "Employability Skills: Entrepreneurial Skills – IV"
    unit: "Part A Unit 4: Entrepreneurial Skills – IV"
    topics:
      - id: cbse-12-medical-diagnostics-ch04-t01
        title: Barriers to becoming an entrepreneur
        learning_outcomes:
          - Classify barriers to entrepreneurship (environmental, personal, financial, social) with examples and ways to overcome them
      - id: cbse-12-medical-diagnostics-ch04-t02
        title: Behavioural and entrepreneurial competencies
        learning_outcomes:
          - >-
            Describe competencies such as adaptability, decisiveness, initiative, perseverance, interpersonal and organisational skills,
            stress management and valuing service and diversity
      - id: cbse-12-medical-diagnostics-ch04-t03
        title: Entrepreneurial competencies in particular
        learning_outcomes:
          - >-
            Explain self-confidence, seeing and acting on opportunities, concern for quality, goal setting, risk taking, problem solving,
            systematic planning, information seeking, persistence, negotiating and team building
      - id: cbse-12-medical-diagnostics-ch04-t04
        title: Self-assessment of entrepreneurial behaviour
        learning_outcomes:
          - Rate oneself on behavioural competencies and prepare a personal competency profile
          - Relate competencies to stories of successful Indian entrepreneurs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-medical-diagnostics-ch05
    number: 5
    title: "Employability Skills: Green Skills – IV"
    unit: "Part A Unit 5: Green Skills – IV"
    topics:
      - id: cbse-12-medical-diagnostics-ch05-t01
        title: Green jobs in homes, gardening, transport and energy conservation
        learning_outcomes:
          - Explain the role of green jobs in toxin-free homes, organic gardening, public transport and energy conservation
      - id: cbse-12-medical-diagnostics-ch05-t02
        title: Green jobs in water, renewable energy and waste
        learning_outcomes:
          - Describe green jobs in water conservation, solar and wind power, and waste reduction, reuse and recycling
      - id: cbse-12-medical-diagnostics-ch05-t03
        title: Green jobs in tourism, construction and appropriate technology
        learning_outcomes:
          - Give examples of green jobs in green tourism, building and construction and appropriate technology
      - id: cbse-12-medical-diagnostics-ch05-t04
        title: Role of green jobs in protecting the environment
        learning_outcomes:
          - >-
            Explain how green jobs improve energy and raw-material use, limit greenhouse-gas emissions, minimise waste and pollution,
            restore ecosystems and support adaptation to climate change
    removed_topics: []
    literature_texts: []
  - id: cbse-12-medical-diagnostics-ch06
    number: 6
    title: Haematology
    unit: "Part B Unit 1: Haematology"
    topics:
      - id: cbse-12-medical-diagnostics-ch06-t01
        title: Haematology laboratory and instruments
        learning_outcomes:
          - Describe the haematology laboratory and uses of the centrifuge, microscope, automated cell counter and coagulation analyser
      - id: cbse-12-medical-diagnostics-ch06-t02
        title: Blood collection and anticoagulants
        learning_outcomes:
          - Explain venepuncture collection and the choice of anticoagulants
      - id: cbse-12-medical-diagnostics-ch06-t03
        title: Blood smear preparation, reagents and staining
        learning_outcomes:
          - Describe preparation of a blood smear, diluting fluids and Leishman staining
      - id: cbse-12-medical-diagnostics-ch06-t04
        title: Quantitative haematology
        learning_outcomes:
          - Explain cell counts with a haemocytometer, haemoglobin estimation, PCV, erythrocyte indices, ESR, LE cell and osmotic fragility
      - id: cbse-12-medical-diagnostics-ch06-t05
        title: Haemopoiesis and anaemia
        learning_outcomes:
          - Explain haemopoiesis and classify anaemias
      - id: cbse-12-medical-diagnostics-ch06-t06
        title: Bone-marrow aspiration and laboratory safety
        learning_outcomes:
          - Describe sites and procedure of bone-marrow aspiration and laboratory safety practices such as hand hygiene and spill management
    removed_topics: []
    literature_texts: []
  - id: cbse-12-medical-diagnostics-ch07
    number: 7
    title: Blood Bank and Transfusion
    unit: "Part B Unit 2: Blood Bank and Transfusion"
    topics:
      - id: cbse-12-medical-diagnostics-ch07-t01
        title: Blood bank materials and equipment
        learning_outcomes:
          - Identify materials and equipment needed in a blood bank
      - id: cbse-12-medical-diagnostics-ch07-t02
        title: Records in a blood bank
        learning_outcomes:
          - Describe the records maintained in a blood bank
      - id: cbse-12-medical-diagnostics-ch07-t03
        title: ABO blood group system
        learning_outcomes:
          - Explain the ABO system and determine blood groups by slide and tube methods
      - id: cbse-12-medical-diagnostics-ch07-t04
        title: Other blood group systems
        learning_outcomes:
          - Explain the Rh and other blood group systems and their practical importance in transfusion
    removed_topics: []
    literature_texts: []
  - id: cbse-12-medical-diagnostics-ch08
    number: 8
    title: Cytopathology
    unit: "Part B Unit 3: Cytopathology"
    topics:
      - id: cbse-12-medical-diagnostics-ch08-t01
        title: Introduction to cytopathology and exfoliative cytology
        learning_outcomes:
          - Define cytopathology and identify common sites for exfoliative cytology
      - id: cbse-12-medical-diagnostics-ch08-t02
        title: FNAC and cell blocks
        learning_outcomes:
          - Describe FNAC equipment and technique and preparation of smears and cell blocks
      - id: cbse-12-medical-diagnostics-ch08-t03
        title: Cytological fixatives and cytospin
        learning_outcomes:
          - Classify fixatives, state their properties and explain cytospin for CSF
      - id: cbse-12-medical-diagnostics-ch08-t04
        title: Staining in cytology
        learning_outcomes:
          - Describe PAP and haematoxylin-and-eosin staining and maintenance of stains and solutions
      - id: cbse-12-medical-diagnostics-ch08-t05
        title: Storage, archiving and laboratory safety
        learning_outcomes:
          - Describe storage and archiving of specimens and safety in the cytology laboratory
    removed_topics: []
    literature_texts: []
removed_topics: []
