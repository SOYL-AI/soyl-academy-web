exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20. Unit marks: I 11 (derived), II 10, III 15, IV 10, V 5, VI 6, VII 15, VIII 8. Cannot be
  taken with Mathematics (041). Single board exam (February-March 2027).
