# CBSE Class 12 Arabic (116), 2026-27. Sections, marks, writing tasks and grammar items as printed in the CBSE 2026-27
# Arabic Classes XI-XII syllabus (Class XII page). Prescribed book: Minhaj al-Ta'lim al-Thanawi al-'Ali lil-Lughat
# al-'Arabiyah (CBSE, Delhi, 2011). CBSE names lessons only by number (for summaries), so the literature
# chapter carries placeholder topics until the book contents page is supplied. No text is reproduced (CONTEXT §8).
subject_id: cbse-12-arabic
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-arabic-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (handwriting 4, reading a short passage without diacritics 4,
  Arabic speaking 4, oral applied grammar 4, project 4). Section A Advanced reading 10: two of three unseen passages of
  150 words, five MCQs each. Section B Writing 15: letter on a given topic (1 address + 4 content) 5; summary of a
  textbook lesson in about 60 words (lessons 1, 2, 4, 6, 7, 8, 9, 13, 14, 19) 5; a longer composition (essay, story or
  incident) of about 100 words 5. Section C Grammar 20: definitions and examples 10 and applied grammar as MCQs 5+5.
  Section D Literature 35: prose - translation of two of three passages of about 50 words 14, six MCQs on a passage 6,
  diacritical marking 5; poetry - explanation of four of six verses with reference to the context 6, four MCQs on given
  verses 4. Board examination in Class XII.
units:
