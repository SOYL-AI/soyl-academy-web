        title: "Gandhi's emergence: Champaran, Kheda and Ahmedabad"
        learning_outcomes:
          - Explain how Gandhi became a national leader
      - id: cbse-12-history-ch11-t02
        title: Non-Cooperation and the Salt Satyagraha
        learning_outcomes:
          - Evaluate the Non-Cooperation and Civil Disobedience movements, the Salt March and dialogues
      - id: cbse-12-history-ch11-t03
        title: Quit India and the last heroic days
        learning_outcomes:
