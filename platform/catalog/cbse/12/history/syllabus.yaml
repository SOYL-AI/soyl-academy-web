    topics:
      - id: cbse-12-history-ch12-t01
        title: A tumultuous time and the making of the Constituent Assembly
        learning_outcomes:
          - Explain the context in which the Constituent Assembly worked
      - id: cbse-12-history-ch12-t02
        title: The dominant voices and the vision of the Constitution
        learning_outcomes:
