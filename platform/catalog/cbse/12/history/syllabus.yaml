# CBSE Class 12 History (027), 2026-27. Twelve themes in three NCERT books, as listed in the CBSE syllabus. Each theme closes with a source-based practice topic (no source text is reproduced).
subject_id: cbse-12-history
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-history-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - cbse-sqp-xii-2026-27
  - cbse-sqp-notification-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  Theory 80 marks (3 hours) + project 20. Part I 25, Part II 25, Part III 25, map work 5. Paper uses MCQs, short answers, long answers,
  source-based questions (one source per part) and map work. Single board exam (February-March 2027).
units:
  - name: Themes in Indian History – Part I
    marks: 25
  - name: Themes in Indian History – Part II
    marks: 25
  - name: Themes in Indian History – Part III
    marks: 25
  - name: Map work
    marks: 5
chapters:
  - id: cbse-12-history-ch01
    number: 1
    title: "Bricks, Beads and Bones: The Harappan Civilisation"
    unit: Themes in Indian History – Part I
    topics:
      - id: cbse-12-history-ch01-t01
        title: Subsistence strategies and mature Harappan settlements
        learning_outcomes:
          - Describe Harappan subsistence, agriculture and town planning at Mohenjodaro
      - id: cbse-12-history-ch01-t02
        title: Social differences, craft production and trade
        learning_outcomes:
          - Infer social differences from burials and artefacts and explain craft production and procurement of materials
      - id: cbse-12-history-ch01-t03
        title: Seals, script and weights; ancient authority
        learning_outcomes:
          - Explain the use of seals, script and weights and debates about Harappan rulers
      - id: cbse-12-history-ch01-t04
        title: The end of the civilisation and its discovery
        learning_outcomes:
          - Evaluate theories about decline and the role of Cunningham, Marshall and later archaeologists
      - id: cbse-12-history-ch01-t05
        title: "Sources: archaeological reports"
        learning_outcomes:
          - Read and interpret a source extract and answer source-based questions
    removed_topics: []
    literature_texts: []
  - id: cbse-12-history-ch02
    number: 2
    title: "Kings, Farmers and Towns: Early States and Economies (c. 600 BCE–600 CE)"
    unit: Themes in Indian History – Part I
    topics:
      - id: cbse-12-history-ch02-t01
        title: Prinsep and Piyadassi; the mahajanapadas
        learning_outcomes:
          - Explain how decipherment of Brahmi and Kharosthi transformed history and describe the sixteen mahajanapadas
      - id: cbse-12-history-ch02-t02
        title: The Mauryan empire and Ashoka's dhamma
        learning_outcomes:
          - Describe Mauryan administration and evaluate Ashoka's dhamma
      - id: cbse-12-history-ch02-t03
        title: New notions of kingship and changing rural society
        learning_outcomes:
          - Explain divine kingship and changes in agrarian society and land grants
      - id: cbse-12-history-ch02-t04
        title: Towns and trade; coins and kings
        learning_outcomes:
          - Describe urban centres, trade networks and the evidence of coins
      - id: cbse-12-history-ch02-t05
        title: "Sources: inscriptions"
        learning_outcomes:
          - Read and interpret a source extract and answer source-based questions
    removed_topics: []
    literature_texts: []
  - id: cbse-12-history-ch03
    number: 3
    title: "Kinship, Caste and Class: Early Societies (c. 600 BCE–600 CE)"
    unit: Themes in Indian History – Part I
    topics:
      - id: cbse-12-history-ch03-t01
        title: The critical edition of the Mahabharata
        learning_outcomes:
          - Explain the critical edition project and its significance
      - id: cbse-12-history-ch03-t02
        title: Kinship, marriage rules and gotra
        learning_outcomes:
          - Analyse patriliny, marriage rules and the status of women
      - id: cbse-12-history-ch03-t03
        title: "Social differences: varna, jati and the Brahmanical ideal"
        learning_outcomes:
          - Compare the ideal varna order with social realities and non-Kshatriya kings
      - id: cbse-12-history-ch03-t04
        title: "Beyond birth: resources, status and the Mahabharata as a dynamic text"
        learning_outcomes:
          - Explain gendered access to property and explain how historians analyse the epic
      - id: cbse-12-history-ch03-t05
        title: "Sources: texts"
        learning_outcomes:
          - Read and interpret a source extract and answer source-based questions
    removed_topics: []
    literature_texts: []
  - id: cbse-12-history-ch04
    number: 4
    title: "Thinkers, Beliefs and Buildings: Cultural Developments (c. 600 BCE–600 CE)"
    unit: Themes in Indian History – Part I
    topics:
      - id: cbse-12-history-ch04-t01
        title: Sanchi and the background of sacrifices and debates
        learning_outcomes:
          - Describe the discovery and preservation of Sanchi and the intellectual ferment of the period
      - id: cbse-12-history-ch04-t02
        title: The Buddha, his teachings and the spread of Buddhism
        learning_outcomes:
          - Explain Buddhist teachings, the sangha and Jaina ideas
      - id: cbse-12-history-ch04-t03
        title: "Stupas: construction and sculpture"
        learning_outcomes:
          - Explain why stupas were built and interpret their sculpture
      - id: cbse-12-history-ch04-t04
        title: "New religious traditions: Mahayana and Puranic Hinduism; temples"
        learning_outcomes:
          - Explain the growth of Mahayana Buddhism, Vaishnavism and Shaivism and early temple architecture
      - id: cbse-12-history-ch04-t05
        title: "Sources: sculpture and architecture"
        learning_outcomes:
          - Read and interpret a source extract and answer source-based questions
    removed_topics: []
    literature_texts: []
  - id: cbse-12-history-ch05
    number: 5
    title: "Through the Eyes of Travellers: Perceptions of Society (c. 10th–17th centuries)"
    unit: Themes in Indian History – Part II
    topics:
      - id: cbse-12-history-ch05-t01
        title: Al-Biruni and the Kitab-ul-Hind
        learning_outcomes:
          - Explain Al-Biruni's observations and the barriers he identified in understanding India
      - id: cbse-12-history-ch05-t02
        title: Ibn Battuta's Rihla
        learning_outcomes:
          - Describe Ibn Battuta's account of cities, communication and slavery
      - id: cbse-12-history-ch05-t03
        title: François Bernier and the "East–West" comparison
        learning_outcomes:
          - Evaluate Bernier's views on land ownership and society and their influence
      - id: cbse-12-history-ch05-t04
        title: Women, slaves and sati in travellers' accounts
        learning_outcomes:
          - Compare accounts of the lives of women and slaves
      - id: cbse-12-history-ch05-t05
        title: "Sources: travellers' accounts"
        learning_outcomes:
          - Read and interpret a source extract and answer source-based questions
    removed_topics: []
    literature_texts: []
  - id: cbse-12-history-ch06
    number: 6
    title: "Bhakti–Sufi Traditions: Changes in Religious Beliefs and Devotional Texts (c. 8th–18th centuries)"
    unit: Themes in Indian History – Part II
    topics:
      - id: cbse-12-history-ch06-t01
        title: A mosaic of religious beliefs; integration of cults
        learning_outcomes:
          - Explain integration of local traditions with Puranic traditions
      - id: cbse-12-history-ch06-t02
        title: "Poems of prayer: Alvars, Nayanars and Virashaivas"
        learning_outcomes:
          - Describe Bhakti movements of south India and their attitude to caste
      - id: cbse-12-history-ch06-t03
        title: Islamic traditions and the growth of Sufism
        learning_outcomes:
          - Explain Sufi silsilas, khanqahs and the Chishti order in India
      - id: cbse-12-history-ch06-t04
        title: "New devotional paths: Kabir, Baba Guru Nanak and Mirabai"
        learning_outcomes:
          - Compare the teachings of Kabir, Guru Nanak and Mirabai
      - id: cbse-12-history-ch06-t05
        title: "Sources: devotional literature"
        learning_outcomes:
          - Read and interpret a source extract and answer source-based questions
    removed_topics: []
    literature_texts: []
  - id: cbse-12-history-ch07
    number: 7
    title: "An Imperial Capital: Vijayanagara (c. 14th–16th centuries)"
    unit: Themes in Indian History – Part II
    topics:
      - id: cbse-12-history-ch07-t01
        title: Discovery of Hampi and the rise of the empire
        learning_outcomes:
          - Explain how Hampi was rediscovered and how the empire developed
      - id: cbse-12-history-ch07-t02
        title: Rayas, nayakas and relations with the Deccan Sultanates
        learning_outcomes:
          - Describe the amara-nayaka system and conflicts and trade
      - id: cbse-12-history-ch07-t03
        title: "The capital and its environs: water resources and fortifications"
        learning_outcomes:
          - Describe the city layout, water management and fortifications
      - id: cbse-12-history-ch07-t04
        title: The royal and sacred centres
        learning_outcomes:
          - Explain the Mahanavami Dibba, Lotus Mahal, Virupaksha and Vitthala temples and their significance
      - id: cbse-12-history-ch07-t05
        title: "Sources: buildings and plans"
        learning_outcomes:
          - Read and interpret a source extract and answer source-based questions
    removed_topics: []
    literature_texts: []
  - id: cbse-12-history-ch08
    number: 8
    title: "Peasants, Zamindars and the State: Agrarian Society and the Mughal Empire (c. 16th–17th centuries)"
    unit: Themes in Indian History – Part II
    topics:
      - id: cbse-12-history-ch08-t01
        title: Peasants and agricultural production; sources such as the Ain-i Akbari
        learning_outcomes:
          - Explain the sources for agrarian history and peasant cultivation
      - id: cbse-12-history-ch08-t02
        title: The village community and women in agrarian society
        learning_outcomes:
          - Describe the panchayat, caste in villages and the role of women
      - id: cbse-12-history-ch08-t03
        title: Forests and tribes; zamindars
        learning_outcomes:
          - Explain the role of zamindars and the changing life of forest dwellers
      - id: cbse-12-history-ch08-t04
        title: Land revenue system and the flow of silver
        learning_outcomes:
          - Explain the Mughal land revenue system and the impact of global trade
      - id: cbse-12-history-ch08-t05
        title: "Sources: chronicles (Ain-i Akbari)"
        learning_outcomes:
          - Read and interpret a source extract and answer source-based questions
    removed_topics: []
    literature_texts: []
