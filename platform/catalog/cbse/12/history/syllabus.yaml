    topics:
      - id: cbse-12-history-ch09-t01
        title: Bengal and the Permanent Settlement
        learning_outcomes:
          - Evaluate the effects of the Permanent Settlement on zamindars and jotedars
      - id: cbse-12-history-ch09-t02
        title: The Paharias and the Santhals
        learning_outcomes:
          - Compare the lives of Paharias and Santhals and explain the Santhal revolt
      - id: cbse-12-history-ch09-t03
        title: The Deccan riots and cotton
        learning_outcomes:
          - Explain the causes of the Deccan riots and the role of the Deccan Riots Commission
      - id: cbse-12-history-ch09-t04
        title: "Sources: official reports"
        learning_outcomes:
          - Read and interpret a source extract and answer source-based questions
