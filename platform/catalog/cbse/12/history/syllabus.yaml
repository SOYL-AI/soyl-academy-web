    unit: Themes in Indian History – Part III
    topics:
      - id: cbse-12-history-ch10-t01
        title: Pattern of the rebellion and its spread
        learning_outcomes:
          - Trace how the revolt spread through military and civil rebellion
      - id: cbse-12-history-ch10-t02
        title: Awadh in revolt
        learning_outcomes:
          - Explain why Awadh became a centre of revolt
      - id: cbse-12-history-ch10-t03
        title: What the rebels wanted; repression
        learning_outcomes:
          - Analyse the rebels' vision of unity and British repression
      - id: cbse-12-history-ch10-t04
        title: Images of the revolt
        learning_outcomes:
          - Interpret British and nationalist representations of 1857
      - id: cbse-12-history-ch10-t05
        title: "Sources: visual representations"
        learning_outcomes:
          - Read and interpret a source extract and answer source-based questions
