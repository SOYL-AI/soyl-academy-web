notes: >-
  34 questions: A 21 x 1 (MCQ incl. 2 assertion-reason), B 6 x 3 (60-80 words), C 3 x 8 (300-350 words), D 3 x 4 source-based (one

  per book part, three sub-questions), E map 5. Internal choice in Sections B (two questions), C (all three) and E (one map item). Book

  weightage: Parts I, II, III 25 each + map 5. Competency weights (design table): knowledge 21 + understanding 18 (recall+understanding),

  applying/analysing 24 + map skills 5 (application), formulating/evaluating/creating 12 (analysis+evaluation). FORMAT MAPPING: map work

  (locate-and-label 3 items, one with an OR alternative, plus identify 2 marked places) has no QuestionType; modelled as five 1-mark short

  items in a dedicated map section (assembler must draw them as one map question on a single outline map of India). Visually impaired
  candidates get substitute questions for items with visual input (not modelled). Visually impaired

  candidates get a recall substitute for the map question.
