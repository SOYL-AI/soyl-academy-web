# CBSE Class 12 Marathi (109), 2026-27. Every prescribed lesson with its writer or poet, the excluded lessons,
# applied-Marathi forms, grammar and writing items and the Class XII blueprint, as printed in the CBSE 2026-27 Marathi
# XI-XII curriculum. Textbook: Marathi Yuvakbharati, Std XII (2020), Maharashtra State Board of Secondary and Higher
# Secondary Education, Pune. The opening lesson is for reading only. Titles and authors only; no text is reproduced
# (CONTEXT §8).
subject_id: cbse-12-marathi
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-marathi-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Board theory 80 marks (3 hours) + internal assessment 20 (speaking - interviews, speeches, discussions, storytelling; reading - dramatic
  and poetry reading; writing - reports, feature writing, essays, stories, poems, advertisements, reviews; presentation - wall magazines,
  brochures, PPTs, collections). Section A Reading 15: unseen prose passage of 250-300 words (MCQ 3x1, short answers 2x2 and 1x3, the last
  based on the summary or the student's own view) and unseen poem (MCQ 2x1, short answers 3x1). Section B Writing 15: essay of 300-325 words
  (autobiographical, descriptive, imaginative or reflective; 1 of 4) 10; demand or complaint letter (1 of 2) 5. Section C Grammar 25:
  synonyms 3, identifying compounds 2x2, voice (kartari, karmani, bhave) 3x2, kinds of sentences - identify or change 3x2, idioms - meaning
  or use, textbook-based 3x2. Section D Literature 25: prose MCQ 2x1, short answers (30-40 words) 2x2, long answers (80-90 words) 2x3;
  poetry MCQ 2x1, short answers 2x2, explanation with reference to context 1x4; applied Marathi (interview, brochure, report, feature; 60-70
  words; 1 of 2) 3. Alankar is excluded.
