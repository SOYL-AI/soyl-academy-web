# CBSE Class 12 Early Childhood Care and Education (842), 2026-27 skill subject. Built from the CBSE 2026-27 skill curriculum; theory component only (practical work is listed in exam_notes).
subject_id: cbse-12-early-childhood-care-and-education
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-ecce-842-2026-27
  - cbse-skill-curriculum-2026-27
