chapters:
  - id: cbse-12-early-childhood-care-and-education-ch01
    number: 1
    title: "Employability Skills: Communication Skills – IV"
    unit: "Part A Unit 1: Communication Skills – IV"
    topics:
      - id: cbse-12-early-childhood-care-and-education-ch01-t01
        title: Active listening at the workplace
        learning_outcomes:
          - Explain why active listening matters at work and list the barriers to it
          - Describe the steps of active listening and apply them in a role play
      - id: cbse-12-early-childhood-care-and-education-ch01-t02
        title: Sentences and phrases; kinds and parts of a sentence
        learning_outcomes:
          - Distinguish a phrase from a sentence and classify sentences as declarative, interrogative, imperative or exclamatory
          - Identify the subject, predicate and object in a sentence
      - id: cbse-12-early-childhood-care-and-education-ch01-t03
        title: Parts of speech and articles
        learning_outcomes:
          - Identify nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections in workplace sentences
          - Use the articles a, an and the correctly
      - id: cbse-12-early-childhood-care-and-education-ch01-t04
        title: Constructing a paragraph
        learning_outcomes:
          - Write a well-organised paragraph with a topic sentence, supporting sentences and a conclusion on a subject-related theme
    removed_topics: []
    literature_texts: []
  - id: cbse-12-early-childhood-care-and-education-ch02
    number: 2
    title: "Employability Skills: Self-Management Skills – IV"
    unit: "Part A Unit 2: Self-Management Skills – IV"
    topics:
      - id: cbse-12-early-childhood-care-and-education-ch02-t01
        title: Motivation and self-motivation
        learning_outcomes:
          - Explain internal and external motivation and list personal needs and desires that drive motivation
      - id: cbse-12-early-childhood-care-and-education-ch02-t02
        title: Sources of motivation and a positive outlook
        learning_outcomes:
          - Identify sources of inspiration (people, books, music, activities) and techniques to stay positive and focused on goals
      - id: cbse-12-early-childhood-care-and-education-ch02-t03
        title: "Personality: meaning, influence and traits"
        learning_outcomes:
          - Define personality and explain how it influences others at work
          - Describe the five basic personality traits (openness, conscientiousness, extraversion, agreeableness, neuroticism)
      - id: cbse-12-early-childhood-care-and-education-ch02-t04
        title: Personality disorders and how to overcome them
        learning_outcomes:
          - >-
            Describe common personality disorders (paranoid, antisocial, schizoid, borderline, narcissistic, avoidant, dependent, obsessive)
            and the clusters they belong to
          - Suggest steps to seek help and overcome personality problems
    removed_topics: []
    literature_texts: []
  - id: cbse-12-early-childhood-care-and-education-ch03
    number: 3
    title: "Employability Skills: ICT Skills – IV"
    unit: "Part A Unit 3: ICT Skills – IV"
    topics:
      - id: cbse-12-early-childhood-care-and-education-ch03-t01
        title: "Spreadsheet basics: workbook, worksheet and data entry"
        learning_outcomes:
          - Name common spreadsheet applications and create, open and save a workbook
          - Enter text and numbers, resize fonts and apply styles
      - id: cbse-12-early-childhood-care-and-education-ch03-t02
        title: Editing and organising spreadsheet data
        learning_outcomes:
          - Copy and move cell data, sort data and apply filters to a table
      - id: cbse-12-early-childhood-care-and-education-ch03-t03
        title: Formulas, functions, protection and printing
        learning_outcomes:
          - Use elementary formulas and functions such as SUM, AVERAGE, MIN and MAX
          - Protect a spreadsheet with a password, print it and save it in different formats
      - id: cbse-12-early-childhood-care-and-education-ch03-t04
        title: Creating a presentation
        learning_outcomes:
          - Name presentation software packages and list features of a good presentation
          - Create a presentation and add or delete slides
      - id: cbse-12-early-childhood-care-and-education-ch03-t05
        title: Editing and formatting presentations
        learning_outcomes:
          - Enter, edit and format text, insert clipart and images, choose slide layouts, and save and print a presentation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-early-childhood-care-and-education-ch04
    number: 4
    title: "Employability Skills: Entrepreneurial Skills – IV"
    unit: "Part A Unit 4: Entrepreneurial Skills – IV"
    topics:
      - id: cbse-12-early-childhood-care-and-education-ch04-t01
        title: Barriers to becoming an entrepreneur
        learning_outcomes:
          - Classify barriers to entrepreneurship (environmental, personal, financial, social) with examples and ways to overcome them
      - id: cbse-12-early-childhood-care-and-education-ch04-t02
        title: Behavioural and entrepreneurial competencies
        learning_outcomes:
          - >-
            Describe competencies such as adaptability, decisiveness, initiative, perseverance, interpersonal and organisational skills,
            stress management and valuing service and diversity
      - id: cbse-12-early-childhood-care-and-education-ch04-t03
        title: Entrepreneurial competencies in particular
        learning_outcomes:
          - >-
            Explain self-confidence, seeing and acting on opportunities, concern for quality, goal setting, risk taking, problem solving,
            systematic planning, information seeking, persistence, negotiating and team building
      - id: cbse-12-early-childhood-care-and-education-ch04-t04
        title: Self-assessment of entrepreneurial behaviour
        learning_outcomes:
          - Rate oneself on behavioural competencies and prepare a personal competency profile
          - Relate competencies to stories of successful Indian entrepreneurs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-early-childhood-care-and-education-ch05
    number: 5
    title: "Employability Skills: Green Skills – IV"
    unit: "Part A Unit 5: Green Skills – IV"
    topics:
      - id: cbse-12-early-childhood-care-and-education-ch05-t01
        title: Green jobs in homes, gardening, transport and energy conservation
        learning_outcomes:
          - Explain the role of green jobs in toxin-free homes, organic gardening, public transport and energy conservation
      - id: cbse-12-early-childhood-care-and-education-ch05-t02
        title: Green jobs in water, renewable energy and waste
        learning_outcomes:
          - Describe green jobs in water conservation, solar and wind power, and waste reduction, reuse and recycling
      - id: cbse-12-early-childhood-care-and-education-ch05-t03
        title: Green jobs in tourism, construction and appropriate technology
        learning_outcomes:
          - Give examples of green jobs in green tourism, building and construction and appropriate technology
      - id: cbse-12-early-childhood-care-and-education-ch05-t04
        title: Role of green jobs in protecting the environment
        learning_outcomes:
          - >-
            Explain how green jobs improve energy and raw-material use, limit greenhouse-gas emissions, minimise waste and pollution,
            restore ecosystems and support adaptation to climate change
    removed_topics: []
    literature_texts: []
  - id: cbse-12-early-childhood-care-and-education-ch06
    number: 6
    title: Foundations of Child Development (3-6 years)
    unit: "Part B Unit 1: Foundations of Child Development (3-6 years)"
    topics:
      - id: cbse-12-early-childhood-care-and-education-ch06-t01
        title: Play, learning and development
        learning_outcomes:
          - Explain the relationship between play, learning and development in the pre-school years
      - id: cbse-12-early-childhood-care-and-education-ch06-t02
        title: Needs of the child
        learning_outcomes:
          - Describe the physical, emotional and social needs of children aged 3-6
      - id: cbse-12-early-childhood-care-and-education-ch06-t03
        title: Sensory, physical and motor milestones
        learning_outcomes:
          - Identify sensory, gross-motor and fine-motor milestones for ages 3-6
      - id: cbse-12-early-childhood-care-and-education-ch06-t04
        title: Cognitive and language development
        learning_outcomes:
          - Describe cognitive and language milestones and signs of delay
      - id: cbse-12-early-childhood-care-and-education-ch06-t05
        title: Socio-emotional development
        learning_outcomes:
          - Describe stages and milestones of socio-emotional development
    removed_topics: []
    literature_texts: []
  - id: cbse-12-early-childhood-care-and-education-ch07
    number: 7
    title: Educational Thought of Key Theorists and Pioneers
    unit: "Part B Unit 2: Educational Thought of Key Theorists and Pioneers"
    topics:
      - id: cbse-12-early-childhood-care-and-education-ch07-t01
        title: Froebel and Montessori
        learning_outcomes:
          - Explain the kindergarten ideas of Froebel and the Montessori method
      - id: cbse-12-early-childhood-care-and-education-ch07-t02
        title: Gandhi, Tagore and Aurobindo
        learning_outcomes:
          - Explain the early-education ideas of Mahatma Gandhi, Rabindranath Tagore and Sri Aurobindo
      - id: cbse-12-early-childhood-care-and-education-ch07-t03
        title: Vygotsky and Malaguzzi
        learning_outcomes:
          - Explain Vygotsky's zone of proximal development and the Reggio Emilia approach
      - id: cbse-12-early-childhood-care-and-education-ch07-t04
        title: Gijubhai Badheka and Tarabai Modak
        learning_outcomes:
          - Describe the contributions of Gijubhai Badheka and Tarabai Modak to Indian pre-school education
    removed_topics: []
    literature_texts: []
  - id: cbse-12-early-childhood-care-and-education-ch08
    number: 8
    title: Developmentally Appropriate Activities for Holistic Development
    unit: "Part B Unit 3: Developmentally Appropriate Activities for Holistic Development"
    topics:
      - id: cbse-12-early-childhood-care-and-education-ch08-t01
        title: Early language and early literacy
        learning_outcomes:
          - Plan activities that build listening, speaking, pre-reading and pre-writing skills
      - id: cbse-12-early-childhood-care-and-education-ch08-t02
        title: Cognition and early numeracy
        learning_outcomes:
          - Plan activities for classification, seriation, number sense and problem solving
      - id: cbse-12-early-childhood-care-and-education-ch08-t03
        title: The world around us
        learning_outcomes:
          - Plan activities that build awareness, empathy and sensitivity to the environment
      - id: cbse-12-early-childhood-care-and-education-ch08-t04
        title: Art and aesthetics
        learning_outcomes:
          - Plan art, music and movement activities for young children
      - id: cbse-12-early-childhood-care-and-education-ch08-t05
        title: Creating an inclusive learning environment
        learning_outcomes:
          - Suggest ways to include children with special needs in the classroom
    removed_topics: []
    literature_texts: []
  - id: cbse-12-early-childhood-care-and-education-ch09
    number: 9
    title: Fostering Socio-emotional Competence
    unit: "Part B Unit 4: Fostering Socio-emotional Competence"
    topics:
      - id: cbse-12-early-childhood-care-and-education-ch09-t01
        title: Making rational conclusions
        learning_outcomes:
          - Plan activities that help children reason and make choices
      - id: cbse-12-early-childhood-care-and-education-ch09-t02
        title: Developing empathy and respect
        learning_outcomes:
          - Suggest ways to build empathy and respect among young children
      - id: cbse-12-early-childhood-care-and-education-ch09-t03
        title: Managing self
        learning_outcomes:
          - Explain how children learn self-regulation and how adults can support it
    removed_topics: []
    literature_texts: []
  - id: cbse-12-early-childhood-care-and-education-ch10
    number: 10
    title: Inside-Outside Learning Environment
    unit: "Part B Unit 5: Inside-Outside Learning Environment"
    topics:
      - id: cbse-12-early-childhood-care-and-education-ch10-t01
        title: Arranging space for learning
        learning_outcomes:
          - Plan indoor activity corners and outdoor play areas
      - id: cbse-12-early-childhood-care-and-education-ch10-t02
        title: Designing a safe environment
        learning_outcomes:
          - Identify safety requirements for pre-school indoor and outdoor spaces
      - id: cbse-12-early-childhood-care-and-education-ch10-t03
        title: A day in the pre-school centre
        learning_outcomes:
          - Plan a balanced daily routine for a pre-school centre
    removed_topics: []
    literature_texts: []
removed_topics: []
