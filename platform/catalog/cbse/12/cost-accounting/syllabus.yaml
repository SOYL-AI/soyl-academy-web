chapters:
  - id: cbse-12-cost-accounting-ch01
    number: 1
    title: "Employability Skills: Communication Skills – IV"
    unit: "Part A Unit 1: Communication Skills – IV"
    topics:
      - id: cbse-12-cost-accounting-ch01-t01
        title: Active listening at the workplace
        learning_outcomes:
          - Explain why active listening matters at work and list the barriers to it
          - Describe the steps of active listening and apply them in a role play
      - id: cbse-12-cost-accounting-ch01-t02
        title: Sentences and phrases; kinds and parts of a sentence
        learning_outcomes:
          - Distinguish a phrase from a sentence and classify sentences as declarative, interrogative, imperative or exclamatory
          - Identify the subject, predicate and object in a sentence
      - id: cbse-12-cost-accounting-ch01-t03
        title: Parts of speech and articles
        learning_outcomes:
          - Identify nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections in workplace sentences
          - Use the articles a, an and the correctly
      - id: cbse-12-cost-accounting-ch01-t04
        title: Constructing a paragraph
        learning_outcomes:
          - Write a well-organised paragraph with a topic sentence, supporting sentences and a conclusion on a subject-related theme
    removed_topics: []
    literature_texts: []
  - id: cbse-12-cost-accounting-ch02
    number: 2
    title: "Employability Skills: Self-Management Skills – IV"
    unit: "Part A Unit 2: Self-Management Skills – IV"
    topics:
      - id: cbse-12-cost-accounting-ch02-t01
        title: Motivation and self-motivation
        learning_outcomes:
          - Explain internal and external motivation and list personal needs and desires that drive motivation
      - id: cbse-12-cost-accounting-ch02-t02
        title: Sources of motivation and a positive outlook
        learning_outcomes:
          - Identify sources of inspiration (people, books, music, activities) and techniques to stay positive and focused on goals
      - id: cbse-12-cost-accounting-ch02-t03
        title: "Personality: meaning, influence and traits"
        learning_outcomes:
          - Define personality and explain how it influences others at work
          - Describe the five basic personality traits (openness, conscientiousness, extraversion, agreeableness, neuroticism)
      - id: cbse-12-cost-accounting-ch02-t04
        title: Personality disorders and how to overcome them
        learning_outcomes:
          - >-
            Describe common personality disorders (paranoid, antisocial, schizoid, borderline, narcissistic, avoidant, dependent, obsessive)
            and the clusters they belong to
          - Suggest steps to seek help and overcome personality problems
    removed_topics: []
    literature_texts: []
  - id: cbse-12-cost-accounting-ch03
    number: 3
    title: "Employability Skills: ICT Skills – IV"
    unit: "Part A Unit 3: ICT Skills – IV"
    topics:
      - id: cbse-12-cost-accounting-ch03-t01
        title: "Spreadsheet basics: workbook, worksheet and data entry"
        learning_outcomes:
          - Name common spreadsheet applications and create, open and save a workbook
          - Enter text and numbers, resize fonts and apply styles
      - id: cbse-12-cost-accounting-ch03-t02
        title: Editing and organising spreadsheet data
        learning_outcomes:
          - Copy and move cell data, sort data and apply filters to a table
      - id: cbse-12-cost-accounting-ch03-t03
        title: Formulas, functions, protection and printing
        learning_outcomes:
          - Use elementary formulas and functions such as SUM, AVERAGE, MIN and MAX
          - Protect a spreadsheet with a password, print it and save it in different formats
      - id: cbse-12-cost-accounting-ch03-t04
        title: Creating a presentation
        learning_outcomes:
          - Name presentation software packages and list features of a good presentation
          - Create a presentation and add or delete slides
      - id: cbse-12-cost-accounting-ch03-t05
        title: Editing and formatting presentations
        learning_outcomes:
          - Enter, edit and format text, insert clipart and images, choose slide layouts, and save and print a presentation
    removed_topics: []
    literature_texts: []
  - id: cbse-12-cost-accounting-ch04
    number: 4
    title: "Employability Skills: Entrepreneurial Skills – IV"
    unit: "Part A Unit 4: Entrepreneurial Skills – IV"
    topics:
      - id: cbse-12-cost-accounting-ch04-t01
        title: Barriers to becoming an entrepreneur
        learning_outcomes:
          - Classify barriers to entrepreneurship (environmental, personal, financial, social) with examples and ways to overcome them
      - id: cbse-12-cost-accounting-ch04-t02
        title: Behavioural and entrepreneurial competencies
        learning_outcomes:
          - >-
            Describe competencies such as adaptability, decisiveness, initiative, perseverance, interpersonal and organisational skills,
            stress management and valuing service and diversity
      - id: cbse-12-cost-accounting-ch04-t03
        title: Entrepreneurial competencies in particular
        learning_outcomes:
          - >-
            Explain self-confidence, seeing and acting on opportunities, concern for quality, goal setting, risk taking, problem solving,
            systematic planning, information seeking, persistence, negotiating and team building
      - id: cbse-12-cost-accounting-ch04-t04
        title: Self-assessment of entrepreneurial behaviour
        learning_outcomes:
          - Rate oneself on behavioural competencies and prepare a personal competency profile
          - Relate competencies to stories of successful Indian entrepreneurs
    removed_topics: []
    literature_texts: []
  - id: cbse-12-cost-accounting-ch05
    number: 5
    title: "Employability Skills: Green Skills – IV"
    unit: "Part A Unit 5: Green Skills – IV"
    topics:
      - id: cbse-12-cost-accounting-ch05-t01
        title: Green jobs in homes, gardening, transport and energy conservation
        learning_outcomes:
          - Explain the role of green jobs in toxin-free homes, organic gardening, public transport and energy conservation
      - id: cbse-12-cost-accounting-ch05-t02
        title: Green jobs in water, renewable energy and waste
        learning_outcomes:
          - Describe green jobs in water conservation, solar and wind power, and waste reduction, reuse and recycling
      - id: cbse-12-cost-accounting-ch05-t03
        title: Green jobs in tourism, construction and appropriate technology
        learning_outcomes:
          - Give examples of green jobs in green tourism, building and construction and appropriate technology
      - id: cbse-12-cost-accounting-ch05-t04
        title: Role of green jobs in protecting the environment
        learning_outcomes:
          - >-
            Explain how green jobs improve energy and raw-material use, limit greenhouse-gas emissions, minimise waste and pollution,
            restore ecosystems and support adaptation to climate change
    removed_topics: []
    literature_texts: []
  - id: cbse-12-cost-accounting-ch06
    number: 6
    title: Single or Output Costing
    unit: "Part B Unit 1: Single or Output Costing"
    topics:
      - id: cbse-12-cost-accounting-ch06-t01
        title: Concept and use of output costing
        learning_outcomes:
          - Explain output costing and the industries that use it
      - id: cbse-12-cost-accounting-ch06-t02
        title: Components of cost; treatment of stock and scrap
        learning_outcomes:
          - Classify elements of cost and treat opening and closing stock and scrap
      - id: cbse-12-cost-accounting-ch06-t03
        title: Cost sheet
        learning_outcomes:
          - Prepare a cost sheet showing prime cost, works cost, cost of production, cost of sales and profit
      - id: cbse-12-cost-accounting-ch06-t04
        title: Production account
        learning_outcomes:
          - Prepare a production account for a single-output firm
    removed_topics: []
    literature_texts: []
  - id: cbse-12-cost-accounting-ch07
    number: 7
    title: Job Costing and Batch Costing
    unit: "Part B Unit 2: Job Costing and Batch Costing"
    topics:
      - id: cbse-12-cost-accounting-ch07-t01
        title: Meaning, objectives, advantages and limitations of job costing
        learning_outcomes:
          - Explain job costing and its merits and limits
      - id: cbse-12-cost-accounting-ch07-t02
        title: Job costing procedure and job cost sheet
        learning_outcomes:
          - Describe the job costing procedure and prepare a job cost sheet
      - id: cbse-12-cost-accounting-ch07-t03
        title: Batch costing and economic batch quantity
        learning_outcomes:
          - Explain batch costing and compute the economic batch quantity
    removed_topics: []
    literature_texts: []
  - id: cbse-12-cost-accounting-ch08
    number: 8
    title: Contract Costing
    unit: "Part B Unit 3: Contract Costing"
    topics:
      - id: cbse-12-cost-accounting-ch08-t01
        title: Concept and features of contract costing
        learning_outcomes:
          - Explain contract costing and the stages of a contract
      - id: cbse-12-cost-accounting-ch08-t02
        title: Expenses attributable to contracts; cost-plus contracts
        learning_outcomes:
          - Identify costs charged to a contract and explain cost-plus contracts
      - id: cbse-12-cost-accounting-ch08-t03
        title: Profit on incomplete contracts and the contract account
        learning_outcomes:
          - Calculate notional profit and the profit transferred on incomplete contracts and prepare a contract account
    removed_topics: []
    literature_texts: []
  - id: cbse-12-cost-accounting-ch09
    number: 9
    title: Process Costing
    unit: "Part B Unit 4: Process Costing"
    topics:
      - id: cbse-12-cost-accounting-ch09-t01
        title: Meaning and application of process costing
        learning_outcomes:
          - Explain process costing and distinguish it from job costing
      - id: cbse-12-cost-accounting-ch09-t02
        title: Process accounts and normal and abnormal losses
        learning_outcomes:
          - Prepare process accounts treating normal loss, abnormal loss and abnormal gain
      - id: cbse-12-cost-accounting-ch09-t03
        title: Joint products and by-products
        learning_outcomes:
          - Distinguish joint products, by-products and co-products and their accounting treatment
    removed_topics: []
    literature_texts: []
  - id: cbse-12-cost-accounting-ch10
    number: 10
    title: Operating Costing or Service Costing
    unit: "Part B Unit 5: Operating Costing or Service Costing"
    topics:
      - id: cbse-12-cost-accounting-ch10-t01
        title: Concept of operating costing and cost units
        learning_outcomes:
          - Explain operating costing and select suitable cost units for services
      - id: cbse-12-cost-accounting-ch10-t02
        title: Transport costing
        learning_outcomes:
          - Classify cost heads, use daily log sheets and compute cost per passenger-km or tonne-km
      - id: cbse-12-cost-accounting-ch10-t03
        title: Power house and canteen costing
        learning_outcomes:
          - Prepare a simple cost sheet for a power house or canteen
    removed_topics: []
    literature_texts: []
