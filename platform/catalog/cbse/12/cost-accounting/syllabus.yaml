    topics:
      - id: cbse-12-cost-accounting-ch11-t01
        title: Need for reconciliation and causes of difference
        learning_outcomes:
          - Explain why cost and financial profits differ
      - id: cbse-12-cost-accounting-ch11-t02
        title: Reconciliation statement
        learning_outcomes:
          - Prepare a statement reconciling cost and financial profit
      - id: cbse-12-cost-accounting-ch11-t03
        title: Memorandum reconciliation account
        learning_outcomes:
          - Prepare a memorandum reconciliation account
