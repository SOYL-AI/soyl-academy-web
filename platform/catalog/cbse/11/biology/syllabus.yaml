# CBSE Class 11 Biology (044), 2026-27. Chapters 1-19 as numbered by CBSE; Digestion and Absorption is CBSE reading material (formative only).
subject_id: cbse-11-biology
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-biology-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  Class 11 has no board exam: school annual examination on the same pattern as Class 12. Theory 70 + practical 30. Units: Diversity 15,
  Structural Organisation 10, Cell 15, Plant Physiology 12, Human Physiology 18.
units:
  - name: "Unit I: Diversity of Living Organisms"
    marks: 15
  - name: "Unit II: Structural Organisation in Plants and Animals"
    marks: 10
  - name: "Unit III: Cell: Structure and Function"
    marks: 15
  - name: "Unit IV: Plant Physiology"
    marks: 12
  - name: "Unit V: Human Physiology"
    marks: 18
