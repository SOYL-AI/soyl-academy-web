        title: Biodiversity and the need for classification; three domains
        learning_outcomes:
          - Explain the need for classification and the three domains of life
      - id: cbse-11-biology-ch01-t02
        title: Taxonomy, systematics and taxonomic hierarchy
        learning_outcomes:
          - Arrange taxonomic categories and explain the species concept
      - id: cbse-11-biology-ch01-t03
        title: Binomial nomenclature
        learning_outcomes:
          - Apply ICBN/ICZN naming rules
