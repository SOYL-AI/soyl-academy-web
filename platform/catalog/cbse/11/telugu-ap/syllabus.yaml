# CBSE Class 11 Telugu (Andhra Pradesh) (107), 2026-27. Sections, marks, grammar items, every prescribed lesson
# (in Roman transliteration, without authors) and the poets for the history of literature, from the CBSE 2026-27 Telugu
# (A.P.) XI-XII syllabus, Class XI. Books: Intermediate First Year Telugu 'Amara Dhamam' (first edition, Intermediate
# Vidya Mandali, Andhra Pradesh, May 2018) and non-detailed text 'Kathanandanam' (May 2018); reference books for the
# history of literature: Andhra Vangmaya Charitra (D. V. Avadhani), Telugu Sahitya Sameeksha Vol. I (G. Nagaiah), Telugu
# Sahitya Charitra (Dwa. Na. Sastry). Telugu-script titles are SOYL's rendering of CBSE's transliteration. Titles only;
# no text is reproduced (CONTEXT §8).
subject_id: cbse-11-telugu-ap
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-telugu-ap-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Class 11 has no board exam; school annual examination 80 marks (3 hours) + internal assessment 20 (periodic tests 10, notebooks 5, subject
  enrichment 5). Section A 20: samasalu 5, chandassu 4, alankaras 4, translation of an English passage of up to 10 sentences into Telugu 7.
  Section B unseen reading 7. Section C essay 8. Section D Language and literature 45: prose - explanation with reference to context 2x3,
  questions 2x4; poetry - meaning of a verse 6, reference to context 2x3, question 4; non-detailed essay question 6; history of literature 9
  (one long answer 6, short answer 3).
