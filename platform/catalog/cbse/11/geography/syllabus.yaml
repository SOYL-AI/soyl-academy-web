exam_notes: >-
  Class 11 has no board exam: school annual examination. Theory 70 + practical 30 (Practical Part I: maps, scale, latitude/longitude/time,
  projections, topographical maps, remote sensing). Physical Geography 35 (3+9+6+8+4 + map 5); India Physical Environment 35 (5+13+12 + map
  5).
