# CBSE Class 11 German (120), 2026-27. Lessons, communicative aims, structures and the assessment scheme as printed in
# the CBSE 2026-27 German Classes XI-XII syllabus (Class XI pages). Prescribed book: Beste Freunde B1.2, Lektionen 10-14
# (Hueber; published in India by Goyal Publishers). German lesson titles are SOYL translations of CBSE's English topic
# names. No text is reproduced (CONTEXT §8).
subject_id: cbse-11-german
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-german-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Annual examination 80 marks (3 hours) + internal assessment 20 (listening 5, speaking activities 5, internet research
  project on German history and culture 10). Section A Reading 15: two unseen comprehension passages (10 and 5). Section
  B Writing 10: e-mail of about 80 words from a stimulus 5 and a dialogue from a stimulus 5. Section C Applied grammar
  40: adjective endings with and without articles; conjunctions entweder ... oder, seitdem, je ... desto, ohne ... zu,
  als, wenn; Konjunktiv II with wenn; reflexive verbs and pronouns; prepositions trotz, innerhalb, außerhalb, von, zu, 8
  marks each. Section D Textbook 15: two passages to complete with given textbook vocabulary (5 each) and a textbook
  comprehension 5. No marks are deducted for grammar or spelling errors in comprehension answers, nor for minor spelling
  errors in writing. Class XI is examined by the school (no board exam).
units:
  - name: 'Teil A: Leseverstehen'
    marks: 15
  - name: 'Teil B: Schreiben'
    marks: 10
  - name: 'Teil C: Angewandte Grammatik'
    marks: 40
  - name: 'Teil D: Lehrbuch (Beste Freunde B1.2, Lektionen 10-14)'
    marks: 15
