# (NCERT) and the chapters of Sanskrit Sahitya Parichay as printed in the CBSE 2026-27 Sanskrit (Kendrikam) XI-XII
# syllabus (Class XI pages). Lessons 3 and 6 of Bhaswati Part 1 are not prescribed. Source attributions of lessons are
# given only where well established and are informational. No text is reproduced (CONTEXT §8).
