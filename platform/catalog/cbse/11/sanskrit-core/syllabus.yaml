exam_notes: >-
  School annual examination (no board exam in Class 11): 80 marks (3 hours) + आन्तरिकमूल्याङ्कनम् 20 (periodic test 5, multiple
  assessment 5, portfolio 5, listening-speaking and writing enrichment activities 5). Section A unseen passage 10 (100-120 words).
  Section B creative writing 15 (letter or application by filling blanks 5; picture-based sentences or paragraph of 25-30 words 5;
  short-story completion or one side of a dialogue 5). Section C applied grammar 20 (sandhi 3, pratyaya 3, shabdarupa 3, dhaturupa
  3, karaka-upapada vibhakti 3, voice in lat and lrit 2, error correction 3). Section D(i) textbook comprehension 25 (prose, verse
  and drama extracts 5 each; bhavartha 3; anvaya 3; matching sentence parts or contextual meanings 4). Section D(ii) history of
  Sanskrit literature 10 (origin and development of Sanskrit and sources and authors of lessons 3; Vedic literature 4; Ramayana,
  Mahabharata and Puranas 3). Books: Bhaswati Part 1 (NCERT), Vyakaranasaurabham, Sanskrit Sahitya Parichay and Vedaparijat
  (NCERT).
