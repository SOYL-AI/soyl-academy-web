# CBSE Class 11 Bhoti (188), 2026-27. Sections, marks, topics and textbook lesson numbers as printed in the CBSE 2026-27
# Bhoti Classes XI-XII syllabus (Class XI course structure, in Bhoti and English). Prescribed book: Bhoti Textbook
# Class XI (Directorate of School Education, UT of Ladakh). CBSE gives most literature lessons by NUMBER only, so those
# chapters carry placeholder topics until the book contents page is supplied. No text is reproduced (CONTEXT §8).
subject_id: cbse-11-bhoti
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-bhoti-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (pen-and-paper tests 5, multiple assessment 5, portfolio 5,
  listening and speaking 5). Section A Reading 10: an unseen passage from stories, notes or biographies and a seen
  passage from the textbook poetry section. Section B Writing 15: invitation and report writing (lessons 6 and 14);
  essay of 250-300 words on an unseen topic. Section C Grammar 25: Sum cu pa'i tshig 'grel (lessons 1 and 7); synonyms
  of nouns (lessons 4 and 10). Section D Literature 30: prose lessons 2, 3, 9, 11, 12, 13; poetry - the poem of lesson 5
  and introduction to poetry part I (lesson 8). Class XI is examined by the school (no board exam).
