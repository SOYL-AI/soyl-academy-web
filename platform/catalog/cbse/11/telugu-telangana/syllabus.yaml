# CBSE Class 11 Telugu (Telangana) (189), 2026-27. Every prescribed lesson (with its number in the book), the
# poets for the history of literature, grammar items, writing tasks and marks weightage, as printed in Telugu in the CBSE
# 2026-27 Telugu (Telangana) Class XI curriculum design. Books: Navodayam (main course book) and its upavachakam
# (non-detailed text). Unlisted book lessons are not prescribed. Titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-11-telugu-telangana
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-telugu-telangana-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Class 11 has no board exam; school annual examination 80 marks (3 hours) + internal assessment 20 (periodic tests - class, slip, pre-mid,
  mid and post-mid tests 5; portfolio - classwork, homework, oral tests, group work, leadership 5; subject enrichment - listening, speaking,
  debates, language use, compositions 5; multiple assessment - art-integrated work, projects, role play, charts, PPTs, quizzes, discussions
  5). Weightage printed by CBSE (IC = internal choice): poetry - Vidyalakshyam 2 + 6 (IC), Mitradharmam 6, Satakasudha 4 (IC) + 2 + 3 (IC);
  prose - Palkuriki Somanathudu 6 (IC), Prachina Sahityamlo Manavatavadam 4, Batukamma Panduga 2 + 4 (IC), Raja Bahaddur Venkatarama Reddy
  Sevatatparata 2 + 4 (IC); non-detailed 8; history of literature 10; sandhis 3, compounds 3, prosody 2, figures of speech 2; creative
  writing - letter 6, translation 6, unseen prose 5, seen prose 5, seen verse 5. Long-answer questions are set as seen prose passages from
  the prose lessons and seen verses (with word meanings) from the poetry lessons.
