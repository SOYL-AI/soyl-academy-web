exam_notes: >-
  School annual exam (Class 11 has no board exam): total 100 = theory 80 (3 hours) + internal assessment 20. Part A
  (MCQ): grammar 10 (general rules of correct spelling; Nepali vocabulary); Muna Madan 10 (two seen extracts, 5 each).
  Part B: history of Nepali literature - the Nepali short story 8; Prativa Parichaya 8; Katha Sangraha 12; Nibandha
  Sangraha 12; Ekanki Sangraha 10 (short answer); essay 5 and letter 5 (long answer).
