# CBSE Class 11 Nepali (124), 2026-27. Sections, marks, grammar items, prescribed texts with authors, writers for
# Prativa Parichaya and writing tasks as printed in the CBSE 2026-27 Nepali Classes XI-XII syllabus (Class XI table). Books:
# Katha Sangraha, Nibandha Sangraha, Ekanki Sangraha, Prativa Parichaya, Muna Madan (Janapaksha Prakashan,
# Gangtok), Nepali Sahityako Aitihasik Parichaya (Dr. Tara Nath Sharma) and Nepali Madhyamik
# Vyakaran ra Rachana. CBSE prints titles in Roman transliteration; the Devanagari spellings are ours and title_en keeps
# CBSE's Roman form for a native-speaker check. No text is reproduced (CONTEXT §8).
