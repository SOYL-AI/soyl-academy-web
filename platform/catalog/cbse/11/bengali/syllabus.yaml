  - cbse-xii-bengali-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Class 11 has no board exam; school annual examination 80 marks (3 hours) + internal assessment 20 (project with file and viva 10 -
  translation, interview, dramatisation, self-composed story, field trip or short film, one in Class XI and another in XII; listening 5;
  speaking 5). Part A (MCQ, 25%): two unseen passages of about 200 words, each with four direct questions and one grammar question (sandhi,
  synonyms, antonyms, sadhu-chalit) 2x5; literature MCQs 10 (drama 5, supplementary reader 5). Part B (subjective): grammar 15 - change of
  voice (bachya paribartan) 5x1, change of narration (ukti paribartan) 5x1, Bengali vocabulary - tatsama, tadbhaba, ardha-tatsama, deshi and
  bideshi (definition and classification) 2+1 and 2; literature 33 - prose 2+3, 2, 3; poetry 5 and 3; translated Indian poem 1+3; drama 2+3;
  supplementary reader 1+3 and 2; creative writing 12 - dialogue writing (at least six pairs) 6 and summary of a 150-180 word prose passage
  6. Word limits: 5 marks 120-130 words, 3 marks 50-60, 2 marks 25-30.
