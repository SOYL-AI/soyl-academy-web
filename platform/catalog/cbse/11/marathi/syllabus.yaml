exam_notes: >-
  Class 11 has no board exam; school annual examination 80 marks + internal assessment 20 (speaking, reading, writing and presentation
  activities). The Class XII blueprint (reading 15, writing 15, grammar 25, literature and applied Marathi 25) is a reasonable model.
  Excluded: Pransai, Ashi Pustake, Shabd, Hasava-Fasavi, Shabdashakti, Kavyagun.
