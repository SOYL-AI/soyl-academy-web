# CBSE Class 11 Marathi (109), 2026-27. Every prescribed lesson with its writer or poet, the excluded lessons,
# applied-Marathi forms and grammar and writing items, as printed in the CBSE 2026-27 Marathi XI-XII curriculum (Class
# XI). Textbook: Marathi Yuvakbharati, Std XI (2019), Maharashtra State Board of Secondary and Higher Secondary Education,
# Pune. The opening poem is for reading only; radio-jockeying is assessed internally only. CBSE prints a blueprint only
# for Class XII, so units carry no marks. Titles and authors only; no text is reproduced (CONTEXT §8).
subject_id: cbse-11-marathi
