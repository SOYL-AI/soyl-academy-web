        title: मूल भाव, संदेश और भाषा-शैली
        title_en: Central idea, message and style
        learning_outcomes:
          - पाठ के मूल भाव और संदेश को उदाहरण सहित स्पष्ट कर सकेंगे
          - लेखक की भाषा-शैली की दो विशेषताएँ पहचान सकेंगे
