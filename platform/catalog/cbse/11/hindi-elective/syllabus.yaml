        title_en: Formal letter, CV and job application
        learning_outcomes:
          - सही प्रारूप में पत्र, स्ववृत्त और आवेदन लिख सकेंगे
      - id: cbse-11-hindi-elective-ch02-t04
        title: "व्यावहारिक लेखन: प्रतिवेदन, प्रेस-विज्ञप्ति, परिपत्र, कार्यसूची, कार्यवृत्त"
        title_en: "Functional writing: report, press release, circular, agenda, minutes"
        learning_outcomes:
          - कार्यालयी प्रारूपों में संक्षिप्त लेखन कर सकेंगे
