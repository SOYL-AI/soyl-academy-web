exam_notes: >-
  Class 11 has no board exam: school annual examination. सैद्धांतिक 80 + आंतरिक 20। खंड क 18; खंड ख 22 (जनसंचार पाठ 1-2 पर 5; दृश्य लेखन
  ~120 शब्द 5; औपचारिक पत्र/स्ववृत्त/आवेदन ~100 शब्द 5; व्यावहारिक लेखन — प्रतिवेदन, प्रेस-विज्ञप्ति, परिपत्र, कार्यसूची, कार्यवृत्त 3; पठित
  पाठों पर 2x2); खंड ग 40 (काव्य 5+4+6, गद्य 5+4+6, अंतराल 10)।
