# CBSE Class 11 Spanish (196), 2026-27. Sections, marks, grammar items, culture and literature content as printed in the
# CBSE 2026-27 Spanish Classes XI-XII syllabus (Class XI pages). Prescribed textbook: Aula Internacional 3
# (Jaime Corpas et al., Difusión) - "relevant chapters", no lesson list; reference books: en acción 2, Compañeros 3, En directo.
# Literary works are named as CBSE names them (titles and authors only); no text is reproduced (CONTEXT §8).
subject_id: cbse-11-spanish
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-spanish-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (periodic tests, best 2 of 3, 10; notebook 5; subject enrichment -
  listening and speaking - 5). Section A Applied grammar 35: revision of articles, nouns, pronouns, gender and number,
  adjectives, adverbs, verb conjugation, possessives and prepositions; ser/estar + adjective, gustar/molestar +
  infinitive, preferir; se + third person; verbs with prepositions; verbal periphrases; preterite, imperfect, present
  perfect and pluperfect; affirmative and negative imperative; direct and indirect speech; common idiomatic expressions;
  future and conditional; present subjunctive versus indicative. Section B Reading comprehension 15: unseen passages
  with short questions answered in Spanish. Section C Composition 15: two short compositions on life and its
  surroundings, one of 90-100 words and one of 150-180 words. Section D Culture, civilisation and literature 15: Spanish
  history (Roman Empire, Moorish rule, the Reconquista and the consolidated kingdom, the Civil War, the transition to
  democracy), Spanish customs and traditions, and literary figures - Calderón de la Barca and Buero Vallejo in addition
  to the Class IX-X authors. Class XI is examined by the school (no board exam).
units:
  - name: 'Sección A: Gramática aplicada'
    marks: 35
  - name: 'Sección B: Comprensión lectora'
    marks: 15
  - name: 'Sección C: Composición y expresión escrita'
    marks: 15
  - name: 'Sección D: Cultura, civilización y literatura'
    marks: 15
chapters:
  - id: cbse-11-spanish-ch01
    number: 1
    title: Repaso de categorías gramaticales
    title_en: Revision of grammatical categories
    unit: 'Sección A: Gramática aplicada'
    topics:
      - id: cbse-11-spanish-ch01-t01
        title: Artículos, sustantivos, pronombres, género y número
        title_en: Articles, nouns, pronouns (personal, demonstrative, interrogative), gender and number
        learning_outcomes:
          - Use articles, nouns and pronouns with correct gender and number agreement
      - id: cbse-11-spanish-ch01-t02
        title: Adjetivos, adverbios, posesivos, preposiciones y verbos auxiliares
        title_en: Adjectives, adverbs, possessives, prepositions, verb conjugation and auxiliary verbs
        learning_outcomes:
          - Use adjectives, adverbs, possessives and prepositions correctly
      - id: cbse-11-spanish-ch01-t03
        title: Ser/estar + adjetivo; gustar, molestar + infinitivo; preferir; se + 3.ª persona
        title_en: 'Uses of the present: ser/estar + adjective, gustar/molestar + infinitive, preferir; se + third person'
        learning_outcomes:
          - Choose between ser and estar and use gustar-type verbs and impersonal se correctly
    removed_topics: []
    literature_texts: []
  - id: cbse-11-spanish-ch02
    number: 2
    title: Verbos con preposición y perífrasis verbales
    title_en: Verbs with prepositions and verbal periphrases
    unit: 'Sección A: Gramática aplicada'
    topics:
      - id: cbse-11-spanish-ch02-t01
        title: Verbos con preposición
        title_en: Verbs with prepositions (acostumbrarse a, interesarse por, pensar en, acordarse de)
        learning_outcomes:
          - Use verbs with their fixed prepositions
      - id: cbse-11-spanish-ch02-t02
        title: 'Perífrasis: empezar a, seguir + gerundio, hay que, se puede, es posible + infinitivo'
        title_en: >-
          Periphrases: empezar a, seguir + gerund, hace falta / hay que / se puede / es posible + infinitive, creo que +
          indicative
        learning_outcomes:
          - Express beginning, continuation, necessity and possibility with verbal periphrases
    removed_topics: []
    literature_texts: []
