# CBSE Class 11 English Elective (001), 2026-27. Sections, marks, task types and prescribed texts as listed in the CBSE
# 2026-27 English Elective XI-XII syllabus (Class XI pages): Woven Words (NCERT), The Old Man and the Sea (Hemingway) and
# Arms and the Man (Shaw). Text titles as printed by CBSE; authors added from the NCERT book where well established.
# Titles and authors only; no text is reproduced (CONTEXT §8). The Seminar (20) is internal assessment (board_assessed: false).
subject_id: cbse-11-english-elective
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-english-elective-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  School annual examination (no board exam in Class 11): theory 80 marks (3 hours) + Seminar 20 (internal). Section A reading 25:
  a literary or discursive passage of about 950-1000 words (12 of 15 objective items), a poem of 10-12 lines (8 of 9) and a
  case-based passage with visual input of 100-120 words (5 of 7). Section B creative writing 15: essay (argumentative, discursive,
  reflective or descriptive) 5, article 5 and speech 5, each 120-150 words with a choice of two topics. Section C textbook 20 (one
  prose and one poetry extract of two, 5 each; two of three short answers of 30-40 words 2x2; two of three of 50-60 words 3x2),
  drama 10 (two of three long answers of 80-100 words, 5 each) and fiction 10 (short answers of 30-40 words 2 and 50-60 words 3,
  one long answer of 120-150 words 5).
units:
  - name: 'Section A: Reading Comprehension'
    marks: 25
  - name: 'Section B: Creative Writing Skills'
    marks: 15
  - name: 'Section C: Textbook - Woven Words'
    marks: 20
  - name: 'Section C: Drama'
    marks: 10
  - name: 'Section C: Fiction'
    marks: 10
  - name: Seminar (internal assessment)
    marks: 20
