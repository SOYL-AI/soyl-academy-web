        title: Literary or discursive passage (950-1000 words)
        learning_outcomes:
          - >-
            Answer objective questions on comprehension, interpretation, inference, analysis, appreciation and vocabulary of a
            long unseen passage
      - id: cbse-11-english-elective-ch01-t02
        title: Unseen poem (10-12 lines)
        learning_outcomes:
          - Interpret the meaning, tone and imagery of an unseen poem and answer objective questions on it
      - id: cbse-11-english-elective-ch01-t03
        title: Case-based passage with visual input (100-120 words)
        learning_outcomes:
          - Interpret statistical data, charts or tables in a short passage and evaluate the conclusions drawn
