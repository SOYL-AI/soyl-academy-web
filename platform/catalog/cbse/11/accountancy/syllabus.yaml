# CBSE Class 11 Accountancy (055), 2026-27. Financial Accounting I and II (NCERT Part I/II); Computerised Accounting is a compulsory component in Class 11 per CBSE but assessed through projects.
subject_id: cbse-11-accountancy
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-accountancy-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  Class 11 has no board exam: school annual examination. Theory 80 + project 20. Units: Theoretical Framework 12, Accounting Process 44,
  Financial Statements of Sole Proprietorship 24.
units:
  - name: "Unit 1: Theoretical Framework"
    marks: 12
  - name: "Unit 2: Accounting Process"
    marks: 44
  - name: "Unit 3: Financial Statements of Sole Proprietorship"
    marks: 24
chapters:
  - id: cbse-11-accountancy-ch01
    number: 1
    title: Introduction to Accounting
    unit: "Unit 1: Theoretical Framework"
    topics:
      - id: cbse-11-accountancy-ch01-t01
        title: Meaning, objectives and role of accounting
        learning_outcomes:
          - Explain the objectives, advantages and limitations of accounting and its users
      - id: cbse-11-accountancy-ch01-t02
        title: Qualitative characteristics of accounting information
        learning_outcomes:
          - Describe reliability, relevance, understandability and comparability
      - id: cbse-11-accountancy-ch01-t03
        title: Basic accounting terms
        learning_outcomes:
          - Define entity, transaction, capital, drawings, assets, liabilities, revenue, expense, debtors and creditors
    removed_topics: []
    literature_texts: []
  - id: cbse-11-accountancy-ch02
    number: 2
    title: Theory Base of Accounting
    unit: "Unit 1: Theoretical Framework"
    topics:
      - id: cbse-11-accountancy-ch02-t01
        title: GAAP, basic accounting concepts and conventions
        learning_outcomes:
          - >-
            Explain business entity, money measurement, going concern, accounting period, cost, dual aspect, revenue recognition, matching,
            full disclosure, consistency, conservatism and materiality
      - id: cbse-11-accountancy-ch02-t02
        title: Bases of accounting and accounting standards; GST
        learning_outcomes:
          - Distinguish cash and accrual bases and explain the purpose of accounting standards, Ind AS and the features of GST
    removed_topics: []
    literature_texts: []
