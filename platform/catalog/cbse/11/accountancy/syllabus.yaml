    topics:
      - id: cbse-11-accountancy-ch05-t01
        title: Need for bank reconciliation and causes of difference
        learning_outcomes:
          - Identify causes of difference between cash book and pass book
      - id: cbse-11-accountancy-ch05-t02
        title: Preparation of BRS
        learning_outcomes:
