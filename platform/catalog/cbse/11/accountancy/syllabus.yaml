        title: Business transactions, source documents and vouchers
        learning_outcomes:
          - Prepare vouchers from source documents
      - id: cbse-11-accountancy-ch03-t02
        title: Accounting equation
        learning_outcomes:
          - Show the effect of transactions on the accounting equation
