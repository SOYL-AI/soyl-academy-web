# CBSE Class 11 Urdu Elective (003), 2026-27. Sections, marks and deleted lessons as printed in the CBSE 2026-27 Urdu Elective
# Classes XI-XII syllabus (Class XI table). Books: Gulistan-e-Adab (Class XI, NCERT), supplementary reader Khayaban-e-Urdu
# (NCERT); references Urdu Adab ki Tareekh and Urdu Qawaid (NCERT). CBSE lists only the DELETED lessons (in Roman script; the
# Urdu spellings in removed_topics are ours), so the textbook chapters carry placeholder topics until the NCERT contents pages
# are supplied. Class XI has no board exam. Literature: titles and authors only (CONTEXT §8).
subject_id: cbse-11-urdu-elective
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-urdu-elective-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  School annual exam: theory 80 marks (3 hours) + 20 internal (listening and speaking 10, project 10). Section A
  Comprehension and writing 32: an unseen passage for comprehension with literary appreciation, five questions 8; essay
  on imaginative and reflective topics (internal choice) 10; letter - personal, formal or professional (internal choice)
  10; precis writing 4. Section B Textbooks and supplementary reader 48: Gulistan-e-Adab prose (one extract with
  comprehension questions 5, an essay-type question of about 100 words 5, two short-answer questions 4) and poetry (one
  extract for reference to context 5, an essay-type or value-based question of about 100 words 5, two short-answer
  questions 4); Khayaban-e-Urdu (one essay-type question 4, two short-answer questions 6); literary genre - life and
  contribution of the writers and poets of the prescribed text 10.
units:
  - name: 'حصہ الف: عبارت فہمی اور تحریر'
    marks: 32
  - name: 'حصہ ب: درسی کتب اور معاون درسی کتاب'
    marks: 48
  - name: 'حصہ ج: سماعت و گفتگو اور پروجیکٹ (داخلی)'
    marks: 20
chapters:
  - id: cbse-11-urdu-elective-ch01
    number: 1
    title: غیر درسی اقتباس اور ادبی تحسین
    title_en: Unseen passage with literary appreciation
    unit: 'حصہ الف: عبارت فہمی اور تحریر'
    topics:
      - id: cbse-11-urdu-elective-ch01-t01
        title: غیر درسی اقتباس کی تفہیم
        title_en: Comprehension of an unseen passage
        learning_outcomes:
          - Read an unseen literary passage and answer five questions on content, inference and vocabulary
      - id: cbse-11-urdu-elective-ch01-t02
        title: ادبی تحسین
        title_en: Literary appreciation
        learning_outcomes:
          - Comment on the style, tone and literary qualities of an unseen passage
    removed_topics: []
    literature_texts: []
  - id: cbse-11-urdu-elective-ch02
    number: 2
    title: مضمون نگاری
    title_en: Essay writing
    unit: 'حصہ الف: عبارت فہمی اور تحریر'
    topics:
      - id: cbse-11-urdu-elective-ch02-t01
        title: تخیلی اور فکری موضوعات پر مضمون
        title_en: Essays on imaginative and reflective topics
        learning_outcomes:
          - Plan and write an imaginative or reflective essay with a clear structure and expressive, correct Urdu
    removed_topics: []
    literature_texts: []
  - id: cbse-11-urdu-elective-ch03
    number: 3
    title: خطوط نگاری
    title_en: Letter writing
    unit: 'حصہ الف: عبارت فہمی اور تحریر'
    topics:
      - id: cbse-11-urdu-elective-ch03-t01
        title: نجی خطوط
        title_en: Personal letters
        learning_outcomes:
          - Write a personal letter with suitable address, tone and closing
      - id: cbse-11-urdu-elective-ch03-t02
        title: رسمی اور پیشہ ورانہ خطوط
        title_en: Formal and professional letters
        learning_outcomes:
          - Write formal and professional letters in the correct format and register
    removed_topics: []
    literature_texts: []
  - id: cbse-11-urdu-elective-ch04
    number: 4
    title: تلخیص نگاری
    title_en: Precis writing
    unit: 'حصہ الف: عبارت فہمی اور تحریر'
    topics:
      - id: cbse-11-urdu-elective-ch04-t01
        title: تلخیص کے اصول
        title_en: Principles of precis writing
        learning_outcomes:
          - Reduce a passage to its essential ideas in about one-third of its length and give it a title
    removed_topics: []
    literature_texts: []
  - id: cbse-11-urdu-elective-ch05
    number: 5
    title: 'درسی کتاب: گلستان ادب (حصہ نثر و نظم)'
    title_en: 'Prescribed textbook: Gulistan-e-Adab (Class XI) - prose and poetry'
    unit: 'حصہ ب: درسی کتب اور معاون درسی کتاب'
    topics:
      - id: cbse-11-urdu-elective-ch05-t01
        title: نثری اسباق (فہرست درکار)
        title_en: Prose lessons (lesson list pending NCERT contents page)
        learning_outcomes:
          - Answer comprehension questions on an extract from a prescribed prose lesson
          - Write an answer of about 100 words on the content or theme of a lesson, and short answers on it
      - id: cbse-11-urdu-elective-ch05-t02
        title: شعرا اور ان کا کلام (فہرست درکار)
        title_en: Poets and poems (lesson list pending NCERT contents page)
        learning_outcomes:
          - Explain a poetic extract with reference to the context
          - Write an answer of about 100 words on the content of a poem, and short answers on it
    removed_topics:
      - 'یادش بخیر (CBSE: Yadash Bakhairia)'
      - شراب شوق سے سرشار ہیں ہم (غزل) - ولی دکنی
      - ہے غلط گر گمان میں کچھ ہے (غزل) - خواجہ میر درد
      - رفتگاں میں جہاں کے ہم بھی ہیں (غزل) - میر
      - سن تو سہی جہاں میں ہے تیرا فسانہ کیا (غزل) - آتش
      - پھر مجھے دیدۂ تر یاد آیا (غزل) - مرزا غالب
      - البیلی صبح (نظم) - جوش ملیح آبادی
      - چاند تاروں کا بن (نظم) - مخدوم
      - تنہائی (نظم) - فیض احمد فیض
      - رباعیات - امجد حیدرآبادی
    literature_texts: []
  - id: cbse-11-urdu-elective-ch06
    number: 6
    title: 'معاون درسی کتاب: خیابان اردو'
    title_en: 'Supplementary reader: Khayaban-e-Urdu'
    unit: 'حصہ ب: درسی کتب اور معاون درسی کتاب'
    topics:
      - id: cbse-11-urdu-elective-ch06-t01
        title: معاون درسی کتاب کے اسباق (فہرست درکار)
        title_en: Supplementary reader lessons (lesson list pending NCERT contents page)
        learning_outcomes:
          - Write an essay-type answer and short answers on the lessons of the supplementary reader
    removed_topics:
      - روٹیاں (نظم)
      - میرا جی (گیت)
      - منظوم ڈراما
      - طویل نظم
    literature_texts: []
  - id: cbse-11-urdu-elective-ch07
    number: 7
    title: 'ادبی اصناف: مصنفین اور شعرا'
    title_en: 'Literary genre: writers and poets of the prescribed text'
    unit: 'حصہ ب: درسی کتب اور معاون درسی کتاب'
    topics:
      - id: cbse-11-urdu-elective-ch07-t01
        title: نثر نگاروں کے حالات زندگی اور خدمات
        title_en: Lives and contributions of the prose writers
        learning_outcomes:
          - Write about the life, works and contribution of a prose writer in the prescribed book
      - id: cbse-11-urdu-elective-ch07-t02
        title: شعرا کے حالات زندگی اور خدمات
        title_en: Lives and contributions of the poets
        learning_outcomes:
          - Write about the life, works and contribution of a poet in the prescribed book
    removed_topics: []
    literature_texts: []
  - id: cbse-11-urdu-elective-ch08
    number: 8
    title: سماعت و گفتگو کی مہارت اور پروجیکٹ
    title_en: Listening and speaking skills and project work (internal assessment)
    unit: 'حصہ ج: سماعت و گفتگو اور پروجیکٹ (داخلی)'
    topics:
      - id: cbse-11-urdu-elective-ch08-t01
        title: سماعت کی مہارت
        title_en: Listening skills
        learning_outcomes:
          - Listen to news bulletins, lectures and talks in Urdu and extract the relevant information
          - Take part in formal group discussions on textbook and current topics and report on them
        board_assessed: false
      - id: cbse-11-urdu-elective-ch08-t02
        title: گفتگو کی مہارت
        title_en: Speaking skills
        learning_outcomes:
          - >-
            Take part in debates, poem recitation, programme anchoring, story telling, role play and picture narration
            in Urdu
          - Speak with interactive competence, fluency, correct pronunciation and accurate vocabulary
        board_assessed: false
      - id: cbse-11-urdu-elective-ch08-t03
        title: پروجیکٹ ورک
        title_en: Project work
        learning_outcomes:
          - >-
            Prepare a project of up to 1000 words on a literary or social theme (for example a review of the textbook or
            a poem, history of Urdu literature, environment, cyber safety) with pictures and data
          - Present the project and answer viva questions on it
        board_assessed: false
    removed_topics: []
    literature_texts: []
    board_assessed: false
removed_topics: []
