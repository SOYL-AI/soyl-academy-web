# CBSE Class 11 Kannada (115), 2026-27. Every prescribed poem and prose lesson (in
# Roman transliteration, without authors except the long prose text), the poets for the outline history of Kannada
# literature, grammar items and writing tasks, from the CBSE 2026-27 Kannada XI-XII syllabus, Class XI.
# Books: Sahitya Sampada (textbook) and Pallava (abhyasa pustaka) for the class, Department of Pre-University
# Education, Karnataka; references Kannada Sahitya Charitre and Kannada Sahityada Itihasa (R. S. Mugali, Sahitya
# Akademi). Kannada-script titles are SOYL's rendering of CBSE's transliteration. The syllabus prints no section marks, so units carry none. Titles only; no text is
# reproduced (CONTEXT §8).
subject_id: cbse-11-kannada
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-kannada-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Class 11 has no board exam; school annual examination 80 marks (3 hours) + internal assessment 20 (listening - questionnaire on stories,
  speeches or audio-visual clips; speaking - pick and speak and prepared elocution of 2-3 minutes; project work such as a neighbourhood
  survey, role play, case study or interview). Paper components: unseen and seen comprehension, grammar (MCQ and writing items), textbook
  poetry and prose, the long prose text, outline history of Kannada literature, essay and letter. The Class XII sample-paper pattern
  (reading 10, grammar 16, seen passages 14, textbook and writing 40) is a reasonable model.
