# CBSE Class 11 Punjabi (104), 2026-27. Sections, marks, writing, translation and grammar items and the Punjabi
# folk-literature forms, as printed in Punjabi in the CBSE 2026-27 Punjabi XI-XII syllabus, Class XI. Textbook: Lazmi
# Punjabi 11 (Punjab School Education Board, Sahibzada Ajit Singh Nagar; also on www.pseb.ac.in). CBSE names the folk
# forms, not individual pieces, so literature is organised by form. No text is reproduced (CONTEXT §8).
subject_id: cbse-11-punjabi
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-punjabi-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Class 11 has no board exam; school annual examination 80 marks (3 hours) + internal assessment 20 (project 10; listening- and
  speaking-based activities 10, with viva). Language 51: advanced reading - an information-rich unseen passage with 8 MCQs (8); effective
  writing 15 - letter to a newspaper editor 7 and an article of 200-225 words on a social, cultural or entertainment topic 8 (both with
  choice); translation from English and grammar 28, based on words and sentences in Lazmi Punjabi 11 - official terminology 5x1,
  subject-specific terminology 5x1, sentences on banking, railway, post, insurance and computers 4x2, idioms used in sentences 5x1,
  advertisement or invitation (50 words) 5. Punjabi folk literature 29: MCQs on lines from suhag, ghoriyan, sithniyan and tappe 6x1; MCQs on
  lines from boliyan, dhola, mahiya and bujharatan 6x1; short answers on folk songs (40-50 words) 3x3; short answers on legends and love
  tales (25-30 words) 4x2.
