# CBSE Class 11 Manipuri (111), 2026-27. Sections, marks, writing and grammar items and every
# prescribed lesson with its author, as printed (in Roman script) in the CBSE 2026-27 Manipuri XI-XII syllabus, Class
# XI. Books: Apunba Manipuri Wareng Seireng (Class XI, Council of Higher
# Secondary Education, Manipur); grammar Anouba Manipuri Lonmit Amasung Lonjan (Board of Secondary Education, Manipur)
# and Meetei Lonmit (Dr M. S. Ningomba). Content is verified against CBSE; status is unverified only because the Meitei
# Mayek spellings of titles are SOYL's transliterations and need review by a Manipuri speaker. Titles and authors only;
# no text is reproduced (CONTEXT §8).
