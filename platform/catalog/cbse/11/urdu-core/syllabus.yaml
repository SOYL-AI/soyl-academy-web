# CBSE Class 11 Urdu Core (303), 2026-27. Sections, marks, writing tasks, grammar items and deleted lessons as printed in the
# CBSE 2026-27 Urdu Core Classes XI-XII syllabus (Class XI table). Textbook: Nai Awaaz (Urdu Core, Class XI, NCERT 2011) and
# Urdu Qawaid (NCERT). CBSE lists only the DELETED lessons (in Roman script; the Urdu spellings in removed_topics are ours), so
# the textbook chapter carries placeholder topics until the NCERT contents page is supplied. Class XI has no board exam; the
# school exam follows this design. Literature: titles and authors only; no text is reproduced (CONTEXT §8).
subject_id: cbse-11-urdu-core
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-urdu-core-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  School annual exam: theory 80 marks (3 hours) + 20 internal (listening and speaking 10, project 10). Section A
  Comprehension and writing 45: one unseen factual passage of about 150 words with five questions 5; paragraph writing
  10; letter - personal, formal or professional (internal choice), written after a general study of Urdu newspapers,
  magazines and periodicals 10; advertisement 5; grammar 15 (parts of speech: kinds of nouns, pronouns and adjectives
  10; completing sentences with suitable words, phrases and idioms 5). Section B Nai Awaaz 35: prose 20 (one extract
  with short comprehension questions 7, one essay-type question of about 100 words on content or theme with internal
  choice 5, four short-answer questions 8) and poetry 15 (one of two extracts with comprehension questions 5, one
  essay-type or value-based question of about 100 words 5, five very short questions on characters, events or evaluation
  5). The paper includes value-based questions worth up to five marks.
units:
  - name: 'حصہ الف: عبارت فہمی اور تحریر'
    marks: 45
  - name: 'حصہ ب: نئی آواز (درسی کتاب)'
    marks: 35
  - name: 'حصہ ج: سماعت و گفتگو اور پروجیکٹ (داخلی)'
    marks: 20
