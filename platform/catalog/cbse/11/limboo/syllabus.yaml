# CBSE Class 11 Limboo (125), 2026-27. Sections, marks, grammar chapters and lessons as printed in the CBSE 2026-27
# Limboo Classes XI-XII syllabus (Class XI pages). Books: Thangsing Yakthung Huppan Nu Itchap (grammar), Patila Sung
# (prose), Sammila Sung (poetry), Kheda A Kheda (rapid reader) and the novel Thothama (Government of Sikkim).
# CBSE prints every Limboo term and lesson title only in Roman transliteration; titles here keep CBSE's romanisation
# (the script CBSE actually uses) because SOYL could not verify native-script (Limbu / Sirijanga) spellings. Native-script titles
# are to be added in language review (see the M1 languages handoff). Lesson titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-11-limboo
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-limboo-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20. Course structure: reading 15, writing 15, grammar 20, literature
  30. A Unseen comprehension 5 (one of two passages). B Grammar 20 (Thangsing Yakthung Huppan Nu Itchap chapters). C
  Seen comprehension 10: a paragraph from Patila Sung 5 and from Sammila Sung 5. D Literature 30: Patila Sung prose 8,
  Sammila Sung poetry 8, Kheda A Kheda rapid reader 6, Thothama novel (parts 1-10) 8. Writing 15: essay 6, letter 5,
  introduction of writers and poets 4. Class XI is examined by the school (no board exam).
units:
  - name: Reading (unseen and seen comprehension)
    marks: 15
  - name: Grammar
    marks: 20
  - name: Literature
    marks: 30
  - name: Writing
    marks: 15
