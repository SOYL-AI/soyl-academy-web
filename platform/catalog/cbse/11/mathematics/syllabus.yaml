    number: 6
    title: Permutations and Combinations
    unit: "Unit II: Algebra"
    topics:
      - id: cbse-11-mathematics-ch06-t01
        title: Fundamental principle of counting; factorial
        learning_outcomes:
          - Apply the multiplication principle
      - id: cbse-11-mathematics-ch06-t02
        title: Permutations
        learning_outcomes:
          - Derive and use nPr including with repetition
      - id: cbse-11-mathematics-ch06-t03
        title: Combinations
        learning_outcomes:
          - Derive and use nCr in selection problems
    removed_topics: []
    literature_texts: []
  - id: cbse-11-mathematics-ch07
    number: 7
    title: Binomial Theorem
    unit: "Unit II: Algebra"
    topics:
      - id: cbse-11-mathematics-ch07-t01
        title: Binomial theorem for positive integral indices; Pascal's triangle
        learning_outcomes:
          - Expand (a+b)ⁿ and use Pascal's triangle
      - id: cbse-11-mathematics-ch07-t02
        title: General and middle terms (formative assessment only)
        board_assessed: false
        learning_outcomes:
          - Find general and middle terms
    removed_topics: []
    literature_texts: []
  - id: cbse-11-mathematics-ch08
    number: 8
    title: Sequences and Series
    unit: "Unit II: Algebra"
    topics:
      - id: cbse-11-mathematics-ch08-t01
        title: Sequences and series; arithmetic progression revision
        learning_outcomes:
          - Write terms of sequences
      - id: cbse-11-mathematics-ch08-t02
        title: "Geometric progression: nth term, sum, infinite GP"
        learning_outcomes:
          - Find the nth term and sum of a GP and the sum of an infinite GP
      - id: cbse-11-mathematics-ch08-t03
        title: Arithmetic mean and geometric mean; AM–GM relation
        learning_outcomes:
          - Prove and apply AM ≥ GM
      - id: cbse-11-mathematics-ch08-t04
        title: Sums of n, n² and n³ (formative assessment only)
        board_assessed: false
        learning_outcomes:
          - Use formulas for Σk, Σk², Σk³
    removed_topics: []
    literature_texts: []
  - id: cbse-11-mathematics-ch09
    number: 9
    title: Straight Lines
    unit: "Unit III: Coordinate Geometry"
    topics:
      - id: cbse-11-mathematics-ch09-t01
        title: Slope of a line and angle between lines
        learning_outcomes:
          - Find slopes and conditions for parallel and perpendicular lines
      - id: cbse-11-mathematics-ch09-t02
        title: Forms of the equation of a line
        learning_outcomes:
          - Write point-slope, slope-intercept, two-point and intercept forms
      - id: cbse-11-mathematics-ch09-t03
        title: Distance of a point from a line; distance between parallel lines
        learning_outcomes:
          - Calculate perpendicular distances
      - id: cbse-11-mathematics-ch09-t04
        title: Normal form and general equation of a line (formative assessment only)
        board_assessed: false
        learning_outcomes:
          - Convert between general and normal forms
    removed_topics: []
    literature_texts: []
