# CBSE Class 11 Mathematics (041), 2026-27. 14 NCERT chapters; topics CBSE assesses only formatively carry board_assessed: false.
subject_id: cbse-11-mathematics
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-mathematics-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  Class 11 has no board exam: school annual examination on the same pattern as Class 12. Theory 80 + IA 20. Units: Sets and Functions 23,
  Algebra 25, Coordinate Geometry 12, Calculus 8, Statistics and Probability 12.
units:
  - name: "Unit I: Sets and Functions"
    marks: 23
  - name: "Unit II: Algebra"
    marks: 25
  - name: "Unit III: Coordinate Geometry"
    marks: 12
  - name: "Unit IV: Calculus"
    marks: 8
  - name: "Unit V: Statistics and Probability"
    marks: 12
chapters:
  - id: cbse-11-mathematics-ch01
    number: 1
    title: Sets
    unit: "Unit I: Sets and Functions"
    topics:
      - id: cbse-11-mathematics-ch01-t01
        title: Sets and their representations; types of sets
        learning_outcomes:
          - Represent sets in roster and set-builder form and classify sets
      - id: cbse-11-mathematics-ch01-t02
        title: Subsets, power set, universal set and intervals
        learning_outcomes:
          - Find subsets and power sets and write intervals
      - id: cbse-11-mathematics-ch01-t03
        title: Venn diagrams and operations on sets
        learning_outcomes:
          - Perform union, intersection, difference and complement with properties
      - id: cbse-11-mathematics-ch01-t04
        title: Practical problems on union and intersection (formative assessment only)
        board_assessed: false
        learning_outcomes:
          - Solve word problems using n(A∪B) formulas
    removed_topics: []
    literature_texts: []
  - id: cbse-11-mathematics-ch02
    number: 2
    title: Relations and Functions
    unit: "Unit I: Sets and Functions"
    topics:
      - id: cbse-11-mathematics-ch02-t01
        title: Ordered pairs and Cartesian product
        learning_outcomes:
          - Find Cartesian products of sets
      - id: cbse-11-mathematics-ch02-t02
        title: "Relations: domain, codomain and range"
        learning_outcomes:
          - Represent relations and find domain and range
      - id: cbse-11-mathematics-ch02-t03
        title: Functions and their graphs
        learning_outcomes:
          - >-
            Identify and graph constant, identity, polynomial, rational, modulus, signum, exponential, logarithmic and greatest integer
            functions
      - id: cbse-11-mathematics-ch02-t04
        title: Algebra of real functions
        learning_outcomes:
          - Add, subtract, multiply and divide functions
      - id: cbse-11-mathematics-ch02-t05
        title: Composition of functions (formative assessment only)
        board_assessed: false
        learning_outcomes:
          - Compose two functions
    removed_topics: []
    literature_texts: []
  - id: cbse-11-mathematics-ch03
    number: 3
    title: Trigonometric Functions
    unit: "Unit I: Sets and Functions"
    topics:
      - id: cbse-11-mathematics-ch03-t01
        title: Angles in radians and degrees
        learning_outcomes:
          - Convert between radians and degrees
      - id: cbse-11-mathematics-ch03-t02
        title: Trigonometric functions via the unit circle; signs and graphs
        learning_outcomes:
          - Define trigonometric functions using the unit circle and sketch their graphs
      - id: cbse-11-mathematics-ch03-t03
        title: Sum and difference identities and multiple angles
        learning_outcomes:
          - Prove and apply identities for sin(x±y), cos(x±y), tan(x±y) and double/triple angles
      - id: cbse-11-mathematics-ch03-t04
        title: General solutions of trigonometric equations (formative assessment only)
        board_assessed: false
        learning_outcomes:
          - Find general solutions of sin y = sin a type equations
    removed_topics: []
    literature_texts: []
