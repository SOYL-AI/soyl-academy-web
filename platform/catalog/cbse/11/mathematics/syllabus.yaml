    unit: "Unit III: Coordinate Geometry"
    topics:
      - id: cbse-11-mathematics-ch10-t01
        title: Sections of a cone; circle
        learning_outcomes:
          - Write the equation of a circle in standard form
      - id: cbse-11-mathematics-ch10-t02
        title: Parabola
        learning_outcomes:
          - Find focus, directrix and latus rectum of standard parabolas
      - id: cbse-11-mathematics-ch10-t03
        title: Ellipse and hyperbola
        learning_outcomes:
          - Find foci, vertices, eccentricity and latus rectum of standard ellipses and hyperbolas
    removed_topics: []
    literature_texts: []
  - id: cbse-11-mathematics-ch11
    number: 11
    title: Introduction to Three-dimensional Geometry
