    unit: "Unit II: Algebra"
    topics:
      - id: cbse-11-mathematics-ch04-t01
        title: Need for complex numbers; algebra of complex numbers
        learning_outcomes:
          - Perform operations on complex numbers
      - id: cbse-11-mathematics-ch04-t02
        title: Argand plane, modulus and conjugate
        learning_outcomes:
          - Represent complex numbers on the Argand plane
      - id: cbse-11-mathematics-ch04-t03
        title: Polar form; quadratic equations in the complex number system (formative assessment only)
        board_assessed: false
        learning_outcomes:
          - Write the polar form and solve quadratics with complex roots
    removed_topics: []
    literature_texts: []
  - id: cbse-11-mathematics-ch05
    number: 5
    title: Linear Inequalities
    unit: "Unit II: Algebra"
    topics:
      - id: cbse-11-mathematics-ch05-t01
        title: Linear inequalities in one variable
        learning_outcomes:
          - Solve linear inequalities algebraically and represent solutions on the number line
      - id: cbse-11-mathematics-ch05-t02
        title: Graphical solution of inequalities in two variables (formative assessment only)
        board_assessed: false
        learning_outcomes:
          - Solve systems of inequalities graphically
    removed_topics: []
    literature_texts: []
