        title: Distance between two points
        learning_outcomes:
          - Calculate distances in 3D
      - id: cbse-11-mathematics-ch11-t03
        title: Section formula (formative assessment only)
        board_assessed: false
        learning_outcomes:
          - Use the section formula in 3D
    removed_topics: []
    literature_texts: []
  - id: cbse-11-mathematics-ch12
    number: 12
    title: Limits and Derivatives
