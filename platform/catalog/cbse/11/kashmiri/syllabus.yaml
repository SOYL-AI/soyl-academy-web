  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Class 11 has no board exam; school annual examination 80 marks (3 hours) + internal assessment 20 (periodic tests on textual questions,
  grammar and vocabulary 10; notebook 5; subject enrichment - listening to short narrations and speaking through elocution, conversation,
  recitation and narration 5). Unseen comprehension: two of four unseen paragraphs of about 200 words with MCQs. Grammar: parts of speech,
  transformation of sentences, Kashmiri proverbs. Main course book: seen prose and poem passages of 100-150 words with five MCQs each; notes
  on poets and writers, genres of poetry, summaries, fill in the blanks, textual questions, book work. Creative writing: essay, report,
  story and letter.
