# CBSE Class 11 Kashmiri (197), 2026-27. Sections, grammar items, writing tasks and the five prescribed lessons
# (printed in Kashmiri by CBSE) from the CBSE 2026-27 Kashmiri XI-XII syllabus, Class XI. Prescribed book: Kashir Kitab
# (2008), J&K Board of School Education, Class XI. CBSE prints no marks per section. Lesson titles are transcribed from
# the CBSE scan and other labels are SOYL's; both need review by a Kashmiri speaker. Titles only; no text reproduced.
subject_id: cbse-11-kashmiri
academic_year: "2026-27"
source_status: verified
