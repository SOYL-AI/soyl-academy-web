# CBSE Class 11 Assamese (114), 2026-27. Sections, marks, writing tasks, grammar items and every
# prescribed lesson with its writer or poet (in Roman transliteration) from the CBSE 2026-27 Assamese XI-XII syllabus,
# Class XI. Books: Sahitya Sourav (Assam State Textbook Production and Publication Corporation,
# Guwahati) and Rachana Bichitra (Dharma Singha Deka, Assam Book Depot, Guwahati). Assamese-script titles are SOYL's
# rendering of CBSE's transliteration. Titles and authors only; no text is reproduced (CONTEXT §8).
subject_id: cbse-11-assamese
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-assamese-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Class 11 has no board exam; school annual examination 80 marks (3 hours) + internal assessment 20 (assignment 10, speaking and listening
  10). Section A Reading 15: one unseen passage of at least 500 words with six 2-mark questions and three 1-mark grammar questions. Section
  B Writing 25: story or essay 5, report on a current topic 5, proverbs 5, expansion of an idea (bhab samprasaran) 5, sentences with
  idiomatic phrases 5x1. Section C Grammar 20: five items x 4. Section D Textbook: prose 10 and poetry 10, each one long answer 4, one short
  answer 2 and four very short answers x 1. Class XI: proverbs nos. 21-30; idiomatic phrases with hat, mur, mon, pet, pani; grammar - voice,
  compounds, case endings of verbs and nouns, karak, sentence cohesion (bak sanhati).
