exam_notes: >-
  Class 11 has no board exam; school annual examination 80 marks (3 hours) + internal assessment 20 (pen-paper tests, art-integrated
  projects, portfolio, subject enrichment). Section A Reading 10: one unseen passage, 10 of 12 very short answers. Section B Creative
  writing 10: essay of about 200 words (one of two) 5; letter (application, letter to the editor, commercial correspondence) 5. Section C
  Grammar 10: applied grammar based on the recommended books - parts of speech, idioms and proverbs, correction and transformation of
  sentences, 10 of 12 x 1. Section D Literature 50: 10 MCQs x 2 on prose and poetry; prose 5 of 6 short answers x 3; poetry 5 of 6 x 3. 50%
  competency-based questions; about 33% internal choice.
