# CBSE Class 11 Chemistry (043), 2026-27. Nine examined units; s-/p-block elements and the gaseous state are formative only.
subject_id: cbse-11-chemistry
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-chemistry-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  Class 11 has no board exam: school annual examination on the same pattern as Class 12. Theory 70 + practical 30. Unit marks: Basic
  Concepts 7, Structure of Atom 9, Periodicity 6, Bonding 7, Thermodynamics 9, Equilibrium 7, Redox 4, Organic Basic Principles 11,
  Hydrocarbons 10.
units:
  - name: Physical Chemistry
    marks: 36
  - name: Inorganic Chemistry
    marks: 13
  - name: Organic Chemistry
    marks: 21
  - name: Formative assessment only
    marks: null
chapters:
  - id: cbse-11-chemistry-ch01
    number: 1
    title: Some Basic Concepts of Chemistry
    unit: Physical Chemistry
    topics:
      - id: cbse-11-chemistry-ch01-t01
        title: Nature and properties of matter; measurement and uncertainty
        learning_outcomes:
          - Use SI units, scientific notation and significant figures
      - id: cbse-11-chemistry-ch01-t02
        title: Laws of chemical combination and Dalton's theory
        learning_outcomes:
          - State and apply the laws of chemical combination
      - id: cbse-11-chemistry-ch01-t03
        title: Atomic and molecular masses; mole concept
        learning_outcomes:
          - Convert between mass, moles and number of particles
      - id: cbse-11-chemistry-ch01-t04
        title: Percentage composition, empirical and molecular formulae
        learning_outcomes:
          - Determine empirical and molecular formulae
      - id: cbse-11-chemistry-ch01-t05
        title: Stoichiometry and limiting reagent
        learning_outcomes:
          - Perform stoichiometric calculations including concentration terms
    removed_topics: []
    literature_texts: []
  - id: cbse-11-chemistry-ch02
    number: 2
    title: Structure of Atom
    unit: Physical Chemistry
    topics:
      - id: cbse-11-chemistry-ch02-t01
        title: Subatomic particles and atomic models
        learning_outcomes:
          - Describe Thomson and Rutherford models and their limitations
      - id: cbse-11-chemistry-ch02-t02
        title: Developments leading to Bohr's model; Bohr's model
        learning_outcomes:
          - Explain electromagnetic radiation, Planck's theory, photoelectric effect and Bohr's model of hydrogen
      - id: cbse-11-chemistry-ch02-t03
        title: Towards the quantum mechanical model
        learning_outcomes:
          - Explain de Broglie's relation and Heisenberg's uncertainty principle
      - id: cbse-11-chemistry-ch02-t04
        title: Quantum numbers and orbitals
        learning_outcomes:
          - Assign quantum numbers and describe shapes of s, p and d orbitals
      - id: cbse-11-chemistry-ch02-t05
        title: Electronic configuration
        learning_outcomes:
          - Apply Aufbau, Pauli and Hund's rules and explain stability of half-filled and filled subshells
    removed_topics: []
    literature_texts: []
  - id: cbse-11-chemistry-ch03
    number: 3
    title: Classification of Elements and Periodicity in Properties
    unit: Inorganic Chemistry
    topics:
      - id: cbse-11-chemistry-ch03-t01
        title: Development of the periodic table and modern periodic law
        learning_outcomes:
          - Trace the development of the periodic table and nomenclature of elements with Z > 100
      - id: cbse-11-chemistry-ch03-t02
        title: Electronic configurations and types of elements
        learning_outcomes:
          - Classify elements into s, p, d and f blocks
      - id: cbse-11-chemistry-ch03-t03
        title: Periodic trends
        learning_outcomes:
          - Explain trends in atomic and ionic radii, ionisation enthalpy, electron gain enthalpy, electronegativity and valency
    removed_topics: []
    literature_texts: []
  - id: cbse-11-chemistry-ch04
    number: 4
    title: Chemical Bonding and Molecular Structure
    unit: Inorganic Chemistry
    topics:
      - id: cbse-11-chemistry-ch04-t01
        title: Kössel–Lewis approach; ionic and covalent bonds
        learning_outcomes:
          - Draw Lewis structures and calculate formal charge
      - id: cbse-11-chemistry-ch04-t02
        title: Bond parameters and polarity
        learning_outcomes:
          - Explain bond length, angle, enthalpy, order, resonance and dipole moment
      - id: cbse-11-chemistry-ch04-t03
        title: VSEPR theory
        learning_outcomes:
          - Predict shapes of simple molecules
      - id: cbse-11-chemistry-ch04-t04
        title: Valence bond theory and hybridisation
        learning_outcomes:
          - Explain sp, sp², sp³, sp³d and sp³d² hybridisation
      - id: cbse-11-chemistry-ch04-t05
        title: Molecular orbital theory of homonuclear diatomics; hydrogen bond
        learning_outcomes:
          - Construct MO diagrams for H2 to Ne2 and explain hydrogen bonding
    removed_topics: []
    literature_texts: []
  - id: cbse-11-chemistry-ch05
    number: 5
    title: Chemical Thermodynamics
    unit: Physical Chemistry
    topics:
      - id: cbse-11-chemistry-ch05-t01
        title: System, surroundings and state functions
        learning_outcomes:
          - Distinguish types of systems and state functions
      - id: cbse-11-chemistry-ch05-t02
        title: First law; internal energy and enthalpy
        learning_outcomes:
          - Apply the first law and relate ΔH and ΔU
      - id: cbse-11-chemistry-ch05-t03
        title: Measurement of ΔU and ΔH; Hess's law
        learning_outcomes:
          - >-
            Use Hess's law and enthalpies of formation, combustion, atomisation, sublimation, phase transition, ionisation, solution and
            dilution
      - id: cbse-11-chemistry-ch05-t04
        title: Entropy, Gibbs energy and spontaneity
        learning_outcomes:
          - Predict spontaneity using ΔG = ΔH − TΔS and relate ΔG° to equilibrium
    removed_topics: []
    literature_texts: []
  - id: cbse-11-chemistry-ch06
    number: 6
    title: Equilibrium
    unit: Physical Chemistry
    topics:
      - id: cbse-11-chemistry-ch06-t01
        title: Equilibrium in physical and chemical processes
        learning_outcomes:
          - Describe dynamic equilibrium
      - id: cbse-11-chemistry-ch06-t02
        title: Law of mass action; Kc and Kp
        learning_outcomes:
          - Write and calculate equilibrium constants
      - id: cbse-11-chemistry-ch06-t03
        title: Le Chatelier's principle
        learning_outcomes:
          - Predict the effect of changes in conditions on equilibrium
      - id: cbse-11-chemistry-ch06-t04
        title: "Ionic equilibrium: acids, bases, pH, buffers"
        learning_outcomes:
          - Calculate pH, apply ionisation constants and explain common ion effect, hydrolysis and buffers
      - id: cbse-11-chemistry-ch06-t05
        title: Solubility product
        learning_outcomes:
          - Use Ksp to predict precipitation
    removed_topics: []
    literature_texts: []
  - id: cbse-11-chemistry-ch07
    number: 7
    title: Redox Reactions
    unit: Physical Chemistry
    topics:
      - id: cbse-11-chemistry-ch07-t01
        title: Oxidation and reduction; oxidation number
        learning_outcomes:
          - Assign oxidation numbers and identify redox reactions
      - id: cbse-11-chemistry-ch07-t02
        title: Types of redox reactions and balancing
        learning_outcomes:
          - Balance redox equations by oxidation-number and half-reaction methods
    removed_topics: []
    literature_texts: []
  - id: cbse-11-chemistry-ch08
    number: 8
    title: "Organic Chemistry: Some Basic Principles and Techniques"
    unit: Organic Chemistry
    topics:
      - id: cbse-11-chemistry-ch08-t01
        title: Tetravalence of carbon; structural representations
        learning_outcomes:
          - Represent organic molecules by various formulae
      - id: cbse-11-chemistry-ch08-t02
        title: Classification and IUPAC nomenclature
        learning_outcomes:
          - Name organic compounds by IUPAC rules
      - id: cbse-11-chemistry-ch08-t03
        title: Isomerism
        learning_outcomes:
          - Identify structural and stereoisomers
      - id: cbse-11-chemistry-ch08-t04
        title: "Electronic displacements: inductive, electromeric, resonance, hyperconjugation"
        learning_outcomes:
          - Explain stability of carbocations, carbanions and free radicals
      - id: cbse-11-chemistry-ch08-t05
        title: Types of organic reactions; purification and analysis
        learning_outcomes:
          - Classify reactions and describe purification and qualitative/quantitative analysis methods
    removed_topics: []
    literature_texts: []
  - id: cbse-11-chemistry-ch09
    number: 9
    title: Hydrocarbons
    unit: Organic Chemistry
    topics:
      - id: cbse-11-chemistry-ch09-t01
        title: "Alkanes: nomenclature, isomerism, conformations, properties"
        learning_outcomes:
          - Draw conformations of ethane and write reactions of alkanes
      - id: cbse-11-chemistry-ch09-t02
        title: "Alkenes: structure, isomerism, preparation and reactions"
        learning_outcomes:
          - Apply Markovnikov's rule and the peroxide effect
      - id: cbse-11-chemistry-ch09-t03
        title: "Alkynes: preparation and reactions"
        learning_outcomes:
          - Explain acidity of alkynes and addition reactions
      - id: cbse-11-chemistry-ch09-t04
        title: "Aromatic hydrocarbons: benzene, aromaticity, electrophilic substitution"
        learning_outcomes:
          - Explain aromaticity and directive influence of substituents; note carcinogenicity and toxicity
    removed_topics: []
    literature_texts: []
