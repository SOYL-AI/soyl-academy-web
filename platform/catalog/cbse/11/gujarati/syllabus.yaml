# CBSE Class 11 Gujarati (110), 2026-27. Every prescribed poem and prose lesson with its form and writer, the
# supplementary lessons (listening and speaking only), the lessons used only for seen comprehension, grammar and writing
# items and the Class XI blueprint, as printed in the CBSE 2026-27 Gujarati XI-XII curriculum. Textbook: Gujarati
# (Dwitiya Bhasha) Class XI (ed. 2016, 2017), Gujarat Rajya Shala Pathya Pustak Mandal, Gandhinagar. Unlisted book lessons
# are not prescribed. Titles and authors only; no text is reproduced (CONTEXT §8).
