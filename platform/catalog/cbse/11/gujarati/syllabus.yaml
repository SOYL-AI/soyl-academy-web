  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Class 11 has no board exam; school annual examination 80 marks (3 hours) + internal assessment 20 (listening 10 on the supplementary
  lessons, speaking 10). Part A (40): reading 10 - unseen prose passage 5 very short answers, unseen poem 5 MCQs; literature 15 - prose and
  poetry 5x1, seen poem 5x1, seen prose passage 5x1; applied grammar 15 (idioms from the textbook 5x1, sandhi (svar sandhi) from the
  textbook 3x1, correcting sentences 4x1, transformation of sentences by tense 3x1; all MCQ). Part B (40): literature 22 - poetry answers in
  two or three sentences 3 of 4 x 2, detailed answer on a prescribed poem 1 of 3 x 3, prose detailed answers 3 of 5 x 3 (essay, travelogue,
  novel, short story, drama), history of modern literature 1 of 2 x 4; writing 18 - essay of at least 200 words on a contemporary issue 1 of
  3 x 8, report 1 of 2 x 5, official letter 1 of 2 x 5. Supplementary-reader lessons are not examined in writing; they are used for
  listening and speaking.
