# CBSE Class 11 Sindhi (108), 2026-27. Sections, marks, grammar items, writing tasks
# and every prescribed lesson (titles as printed by CBSE in Devanagari Sindhi) from the CBSE 2026-27 Sindhi XI-XII
# syllabus, Class XI. Books: NIOS Senior Secondary Course 301 Sindhi; Sindhee Din Vaar (Sindhi festivals) section; grammar and usage:
# Choonda Sindhi Istalah ain Pahaka and Nutan Sindhi Grammar (Usha Saraswat), Sindhi Vyakaran (Gangaram Israni). The CBSE
# document uses Devanagari script, not the Arabic script listed in subjects.yaml. Titles only; no text is reproduced.
subject_id: cbse-11-sindhi
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-sindhi-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Class 11 has no board exam; school annual examination 80 marks (3 hours) + internal assessment 20. Unseen prose passage 5 MCQs; unseen
  poem 5 MCQs; MCQs on prose, poetry and grammar 10; grammar 10; main course book 30; Sindhi festivals 6; creative writing 14 - essay of 500
  words 6, letter 4, translation from Hindi to Sindhi 4. Grammar: correction and transformation of words and sentences (all grammatical
  forms), idioms and proverbs.
