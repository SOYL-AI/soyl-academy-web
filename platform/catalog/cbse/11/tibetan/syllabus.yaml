# CBSE Class 11 Tibetan (117), 2026-27. Sections, marks, topics and textbook lesson numbers as printed in the CBSE
# 2026-27 Tibetan Classes XI-XII syllabus (Class XI course structure). Prescribed book: New Tibetan Textbook
# (printed by Sherig Parkhang / TCRPC; CBSE prints "for class XI" on both pages). CBSE names texts in Wylie-style
# romanisation; the Tibetan spellings are SOYL renderings to be checked in language review. No text is reproduced.
subject_id: cbse-11-tibetan
academic_year: "2026-27"
source_status: verified
