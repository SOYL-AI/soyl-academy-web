exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (assignment 10, speaking and listening 10; rapid-reading practice,
  fortnightly homework and monthly group discussion). Section A Grammar 15: verb tenses and applied verbs; Si tu'i zhal
  lung of Ngulchu Dharmabhadra (lessons 1-4). Section B Reading 10: a seen and an unseen passage from stories, notes and
  biographies (lessons 5-6). Section C Writing 20: letters - agreement, application, envelope titles and meeting minutes
  (lessons 7-10) 10; essay writing and critique (lessons 11-12) 10. Section D Literature 35: prose - bSlab bya mu tig
  phreng ba (lessons 13-14) 10; drama - Tam pad Mai Tsel gyi zlos gar by Dza Patrul Rinpoche (lesson 15) 5; poetry -
  simile and words of simile from Tshig rgyan rig pa'i sgo 'byed (lessons 16-17) 10; rapid reading - My Land and My
  People (lessons 18-22) 10. Class XI is examined by the school (no board exam).
