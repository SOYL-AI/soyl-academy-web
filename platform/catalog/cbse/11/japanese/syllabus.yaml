# CBSE Class 11 Japanese (194), 2026-27. Sections, marks, grammar patterns, kanji range and writing topics as printed in the
# CBSE 2026-27 Japanese Classes XI-XII syllabus (Class XI pages). Prescribed books: Minna no Nihongo (Indian edition,
# Goyal Publishers, 2nd edition 2018) lessons 21-28 and Nihongo Challenge Kanji N4-N5 (kanji 101-150). Minna no Nihongo
# lessons are numbered, not titled, so grammar chapters follow the CBSE lesson groups. No text is reproduced.
subject_id: cbse-11-japanese
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-japanese-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (periodic tests 10, notebook 5, subject enrichment - listening,
  speaking and a project - 5). A Reading comprehension 20: unseen explanatory and opinion texts, short stories,
  articles. B Writing 20: guided paragraphs of about 400 characters (term 1: my favourite sport; term 2: what I want,
  and a school-trip notice poster) and completing conversations; no marks deducted for spelling. C Grammar 20: lessons
  21-24 (term 1) and 25-28 (term 2). D Script 20: kanji 101-150 of the N4 list, reading and writing. E Culture (Japanese
  customs, habits and festivals) is assessed internally only. Class XI is examined by the school (no board exam).
units:
  - name: A：読解
    marks: 20
  - name: B：作文
    marks: 20
  - name: C：文法
    marks: 20
  - name: D：漢字
    marks: 20
  - name: E：文化（内部評価）
    marks: null
chapters:
  - id: cbse-11-japanese-ch01
    number: 1
    title: 読解
    title_en: Reading comprehension (unseen passages)
    unit: A：読解
    topics:
      - id: cbse-11-japanese-ch01-t01
        title: 説明文・意見文・短い話・記事
        title_en: Explanatory and opinion texts, short stories, articles
        learning_outcomes:
          - Read unseen Japanese texts and answer questions on content and opinion
    removed_topics: []
    literature_texts: []
  - id: cbse-11-japanese-ch02
    number: 2
    title: 作文と会話
    title_en: Writing and conversation completion
    unit: B：作文
    topics:
      - id: cbse-11-japanese-ch02-t01
        title: すきなスポーツ（約400字）
        title_en: My favourite sport (about 400 characters, term 1)
        learning_outcomes:
          - Write a guided paragraph of about 400 characters about a favourite sport
      - id: cbse-11-japanese-ch02-t02
        title: わたしがほしいもの（約400字）
        title_en: What I want (about 400 characters, term 2)
        learning_outcomes:
          - Write a guided paragraph about something they want and why
      - id: cbse-11-japanese-ch02-t03
        title: しゅうがくりょこうのおしらせ（ポスター）
        title_en: School-trip notice poster (term 2)
        learning_outcomes:
          - Make a notice poster giving date, place, items to bring and rules
      - id: cbse-11-japanese-ch02-t04
        title: 会話文の完成
        title_en: Completing conversation passages
        learning_outcomes:
          - Complete conversations with suitable expressions
    removed_topics: []
    literature_texts: []
  - id: cbse-11-japanese-ch03
    number: 3
    title: 第21課〜第24課の文法
    title_en: Grammar of lessons 21-24 (term 1)
    unit: C：文法
    topics:
      - id: cbse-11-japanese-ch03-t01
        title: 〜とおもいます・〜といいます・でしょう
        title_en: to omoimasu, to iimasu, deshō
        learning_outcomes:
          - Give opinions, report speech and seek agreement with plain forms
      - id: cbse-11-japanese-ch03-t02
        title: 名詞修飾・時間／約束／用事があります
        title_en: Noun modification; jikan / yakusoku / yōji ga arimasu
        learning_outcomes:
          - Modify nouns with clauses and talk about time, appointments and errands
      - id: cbse-11-japanese-ch03-t03
        title: とき・と・〜たら・もし・いくら〜ても
        title_en: toki, to, -tara, moshi, ikura ... -temo
        learning_outcomes:
          - Express time, conditions and concessions with toki, to, -tara and -temo
      - id: cbse-11-japanese-ch03-t04
        title: くれます・あげます・もらいます
        title_en: 'Giving and receiving: kuremasu, agemasu, moraimasu'
        learning_outcomes:
          - Use giving and receiving verbs with things and actions (-te kuremasu etc.)
    removed_topics: []
    literature_texts: []
  - id: cbse-11-japanese-ch04
    number: 4
    title: 第25課〜第28課の文法
    title_en: Grammar of lessons 25-28 (term 2)
    unit: C：文法
    topics:
      - id: cbse-11-japanese-ch04-t01
        title: 〜んです・いただけませんか・〜たらいいですか
        title_en: -n desu, itadakemasen ka, -tara ii desu ka
        learning_outcomes:
          - Explain situations with -n desu and make polite requests and ask for advice
      - id: cbse-11-japanese-ch04-t02
        title: 可能動詞・〜しかありません
        title_en: Potential verbs and potential sentences; shika arimasen
        learning_outcomes:
          - Form potential verbs and express limitation with shika ... nai
      - id: cbse-11-japanese-ch04-t03
        title: 〜ながら・〜し〜し・それに・それで
        title_en: -nagara, -shi ... -shi, sore ni, sore de
        learning_outcomes:
          - Describe simultaneous actions and list reasons
      - id: cbse-11-japanese-ch04-t04
        title: けいようし〜くて・すき／きらい／上手／下手・よく〜ています
        title_en: Adjective -kute; suki, kirai, jōzu, heta; yoku ... -te imasu
        learning_outcomes:
          - Link adjectives and describe likes, skills and habitual actions
    removed_topics: []
