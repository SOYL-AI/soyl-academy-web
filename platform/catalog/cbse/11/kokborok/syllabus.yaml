  - cbse-xii-kokborok-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (project 10 - translation, interview, dramatisation, survey or
  self-composed story, one in Class XI and another in Class XII; listening 5; speaking 5). Section A Reading 10: two
  unseen passages of 100-150 words, four direct MCQs and one grammar MCQ each. Section B Grammar 10 MCQs: kok
  khochormung, kok phuarmung, kokmang rwgwi kokbwtangni dalberem, khwlai halok swlaimung. Section C Composition 15:
  report writing, summary writing and kok phologwi suimung, 100-120 words each, 5 marks each. Section D Literature 45:
  prose 15, poetry 15, supplementary reader 15 (short answers and reference-to-context or explanation long answers).
  Question design: remembering 25%, understanding 25%, applying 18.75%, analysing/evaluating/creating 31.25%. Class XI
  is examined by the school (no board exam).
units:
  - name: Section A - Reading
    marks: 10
  - name: Section B - Grammar
    marks: 10
  - name: Section C - Composition and writing
    marks: 15
  - name: Section D - Literature
    marks: 45
