# CBSE Class 11 Kokborok (191), 2026-27. Sections, marks, grammar items and lessons (titles and authors) as printed in
# the CBSE 2026-27 Kokborok Classes XI-XII syllabus (Class XI examination structure). Books (Kokborok tei Borok
# Bangthaya Bosong Kok Dagikhung, Tripura): Berem Kuchuk Rwngkwchar Kokrwbai Bwchap (textbook, Classes XI-XII) and Berem
# Kuchuk Rwngkwchar Kokborok Kokma tei Suimwng Bwchap (grammar and composition). CBSE writes Kokborok in Roman script.
# Lesson titles and authors only; no text is reproduced (CONTEXT §8).
subject_id: cbse-11-kokborok
