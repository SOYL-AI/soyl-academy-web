exam_notes: >-
  Class 11 has no board exam: school annual examination. Theory 80 + project 20. Part A 40 (Constitution 8 with Rights; Elections 6;
  Executive 12 with Legislature and Judiciary; Federalism 6; Local Governments 4; Living Document 4 with Philosophy). Part B 40 (Political
  Theory 4; Freedom 12 with Equality; Social Justice 6; Rights 4; Citizenship 8 with Nationalism; Secularism 6).
