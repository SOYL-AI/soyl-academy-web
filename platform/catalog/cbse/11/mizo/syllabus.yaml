# CBSE Class 11 Mizo (198), 2026-27. Sections, marks, grammar items and lessons (titles and authors) as printed in the
# CBSE 2026-27 Mizo Classes XI-XII syllabus (Class XI page). Prescribed textbook: Lengteng, published by the Expert
# Committee on Mizo Language (CBSE), revised edition 2022. Mizo is written in Roman script; Mizo headings for the language
# sections are SOYL wording. Lesson titles and authors only; no text is reproduced (CONTEXT §8).
subject_id: cbse-11-mizo
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-mizo-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20. Section A Grammar 20: synonyms and antonyms 3x2, proverbs for
  amplification 2x2, transformation of sentences on mood 2x2, punctuation 6x1. Section B Reading 15: summary 4, suitable
  titles 2x2, idioms and phrases 7x1. Section C Composition 15: letter 5, essay 10. Section D Literature 30 (book
  Lengteng): poetry 10 (general 2x2, substance 3, reference to context 3), prose 10 (words and phrases 4x1, general 2,
  summary 4), fiction Kraws Bulah Chuan 10 (6 objective, one long answer of 4). Class XI is examined by the school (no
  board exam).
units:
  - name: Section A - Grammar
    marks: 20
  - name: Section B - Reading
    marks: 15
  - name: Section C - Composition and writing
    marks: 15
  - name: Section D - Literature
    marks: 30
chapters:
