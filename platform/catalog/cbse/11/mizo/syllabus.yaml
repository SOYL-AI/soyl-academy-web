    title_en: 'Grammar: synonyms and antonyms, proverbs, mood, punctuation'
    unit: Section A - Grammar
    topics:
      - id: cbse-11-mizo-ch01-t01
        title: Thumal inang leh inang lo
        title_en: Synonyms and antonyms
        learning_outcomes:
          - Give synonyms and antonyms of Mizo words
      - id: cbse-11-mizo-ch01-t02
        title: Thufing (proverbs) sawifiahna
        title_en: Proverbs for amplification
        learning_outcomes:
          - Explain and expand the meaning of Mizo proverbs
      - id: cbse-11-mizo-ch01-t03
        title: Mood anga thu danglam
        title_en: Transformation of sentences on mood
        learning_outcomes:
          - Change sentences from one mood to another
      - id: cbse-11-mizo-ch01-t04
        title: Chhinchhiahna (punctuation)
        title_en: Punctuation
        learning_outcomes:
          - Punctuate Mizo sentences correctly
