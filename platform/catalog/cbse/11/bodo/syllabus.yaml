        title: थाइलालि
        title_en: Thailali (gloss to be verified)
        learning_outcomes:
          - Identify, explain and use Thailali correctly in Bodo sentences, following the prescribed Bodo grammar books
      - id: cbse-11-bodo-ch03-t03
        title: नङि दिन्थिग्रा दाजाबदा (सिगां आरो उन दाजाबदा)
        title_en: 'Nongi dinthigra dajabda: sigang and un dajabda (prefixes and suffixes; gloss to be verified)'
        learning_outcomes:
          - >-
            Identify, explain and use Nongi dinthigra dajabda: sigang and un dajabda correctly in Bodo sentences,
            following the prescribed Bodo grammar books
      - id: cbse-11-bodo-ch03-t04
        title: बाथ्रा (गोरलै, गलाय आरो जथाइ)
        title_en: 'Bathra: gorlai, golay and jothai (kinds of sentences; gloss to be verified)'
        learning_outcomes:
          - >-
            Identify, explain and use Bathra: gorlai, golay and jothai correctly in Bodo sentences, following the
            prescribed Bodo grammar books
      - id: cbse-11-bodo-ch03-t05
        title: होनजाब आरो दाजाब सोदोब
