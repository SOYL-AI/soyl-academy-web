# CBSE Class 11 Bodo (192), 2026-27. Sections, marks, writing tasks, grammar items, prescribed poems (khanthai), prose
# lessons (raithai) with authors and the value-education lessons as printed (in Devanagari) in the CBSE 2026-27 Bodo
# syllabus (Class XI table). Textbook: Sujunai Bijab, Gojousin Gejerari Sethi Bosorni Thakhay (Assam State Text Book Production and Publication Corporation, 2016). Grammar references: Gonang Raokhanthi (Kamal Kumar Brahma),
# Gojou Raokhanthi (Madhuram Boro), Phoraysalini Raokhanthi (Swarna Prabha Chainary). Lesson and author names are copied from
# CBSE; title_en values are SOYL romanisations, and the Bodo labels of the reading/writing/grammar chapters and the English
# glosses of grammar terms marked "to be verified" need a Bodo speaker's check. No text is reproduced (CONTEXT §8).
subject_id: cbse-11-bodo
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-bodo-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20. Section A reading comprehension 10 (an unseen literary or other
  relevant passage of about 150 words and an unseen poem of 15-20 lines); Section B writing 10; Section C grammar 10;
  Section D literature 40 (prescribed raithai/prose lessons and khanthai/poems); Value Education 10 (these lessons take
  the place of a supplementary reader). Internal assessment 20: periodic test/term evaluation 10, listening and speaking
  5, assignment 5. Class 11 has no board exam; this is the school annual exam design.
units:
  - name: 'Section A: Reading Comprehension'
    marks: 10
  - name: 'Section B: Writing Skills'
    marks: 10
  - name: 'Section C: Grammar'
    marks: 10
  - name: 'Section D: Literature'
    marks: 40
  - name: Value Education
    marks: 10
chapters:
  - id: cbse-11-bodo-ch01
    number: 1
    title: आयदा फरायनाय आरो बुजिनाय
    title_en: Reading comprehension (unseen passages)
    unit: 'Section A: Reading Comprehension'
    topics:
      - id: cbse-11-bodo-ch01-t01
        title: थुनलाइयारि आयदा एबा जायखिजाया जुक्तिगोनां आयदा
        title_en: Literary or other relevant unseen passage (about 150 words)
        learning_outcomes:
          - Read an unseen Bodo passage of about 150 words and answer questions on its content, inference and vocabulary
      - id: cbse-11-bodo-ch01-t02
        title: 15-20 सारिनि दोंसे खन्थाइ
        title_en: Unseen poem of 15-20 lines
        learning_outcomes:
          - Read an unseen Bodo poem of 15-20 lines and answer questions on its meaning, mood and message
    removed_topics: []
    literature_texts: []
  - id: cbse-11-bodo-ch02
    number: 2
    title: लिरनाय
    title_en: Writing skills
    unit: 'Section B: Writing Skills'
    topics:
      - id: cbse-11-bodo-ch02-t01
        title: जायखिजाया फोरमायथावना एबा जुक्तिगोनां बाथ्राखौ लानानै रायथाइ लिरनाय
        title_en: Writing a prose composition on a given title or from given hints (within 150 words)
        learning_outcomes:
          - Write a prose composition of up to 150 words on a given title or developing the given hints
      - id: cbse-11-bodo-ch02-t02
        title: रिपर्ट लिरनाय
        title_en: Report on a given event or incident (within 150 words)
        learning_outcomes:
          - Write a report of up to 150 words on a given event or happening
      - id: cbse-11-bodo-ch02-t03
        title: बाथ्रा फावखौ बेखेवना लिरनाय
        title_en: Explanation of a passage, or writing on a given passage
        learning_outcomes:
          - Explain a given passage or answer a task based on it
    removed_topics: []
    literature_texts: []
