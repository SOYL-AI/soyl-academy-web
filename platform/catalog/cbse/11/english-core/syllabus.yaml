# CBSE Class 11 English Core (301), 2026-27. Texts as listed by CBSE (Hornbill, Snapshots). Titles and authors only.
subject_id: cbse-11-english-core
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-english-core-2026-27
  - cbse-senior-secondary-curriculum-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  Class 11 has no board exam: school annual examination. Theory 80 + IA 20 (listening 5, speaking 5, project 10). Reading 26 (two unseen
  passages 10+8, note making 5, summary 3); grammar 7 (gap filling with tenses and clauses; re-ordering/transformation); creative writing 16
  (classified advertisement 3, poster 3, speech 5, debate 5); literature 31 (Hornbill poetry extract 3, Hornbill prose extract 3, Snapshots
  extract 4, short answers 3x2 and 1x3, long answers 6+6).
units:
  - name: "Section A: Reading Skills"
    marks: 26
  - name: "Section B: Grammar and Creative Writing"
    marks: 23
  - name: "Section C: Literature – Hornbill"
    marks: null
  - name: "Section C: Supplementary Reader – Snapshots"
    marks: null
