# CBSE Class 11 Sanskrit Elective (022), 2026-27. Sections, marks, grammar items, the prescribed lessons of Shashwati Part 1
# (NCERT) and the chapters of Sanskrit Sahitya Parichay as printed in the CBSE 2026-27 Sanskrit (Aichchhikam) XI-XII
# syllabus (Class XI pages). Lesson 6 of Shashwati Part 1 is not prescribed. Source attributions of lessons are given only
# where well established and are informational. No text is reproduced (CONTEXT §8).
