exam_notes: >-
  School annual examination (no board exam in Class 11): 80 marks (3 hours) + आन्तरिकमूल्याङ्कनम् 20 (periodic test 5, multiple
  assessment 5, portfolio 5, listening-speaking and writing enrichment activities 5). Section A unseen passage 10 (100-120 words).
  Section B creative writing 10 (letter from cues 5; paragraph from cues or translation into Sanskrit 5). Section C applied
  grammar 20 (sandhi 3, shabdarupa 3, dhaturupa 3, pratyaya 3, avyaya 4x1/2, case usage 3, compound analysis 3). Section D(i)
  textbook comprehension 30 (prose, verse and drama extracts 5 each; question formation 4; anvaya 3; bhavartha or character sketch
  3; explanation with reference to context 5). Section D(ii) history of Sanskrit literature 10 (introduction to principal authors
  of the textbook extracts 4; origin of Sanskrit and Vedic literature 3; classical (laukika) literature 3). Books: Shashwati Part
  1 (NCERT), Sanskrit Sahitya Parichay (NCERT); reference: Vyakaranasaurabham, Higher Sanskrit Grammar (M. R. Kale),
  Rachananuvadakaumudi, Vedaparijat.
