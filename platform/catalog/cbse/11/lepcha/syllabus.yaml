# CBSE Class 11 Lepcha (126), 2026-27. Sections, marks, grammar items and lessons as printed in the CBSE 2026-27 Lepcha
# Classes XI-XII syllabus (Class XI pages). Reference books (Education Department, Government of Sikkim): Ringmom
# Chhyogyu (poems), Kongchen Punol (prose), Thongoam Kat Nahan (drama), Mutanchi Ringthyum un Ringchuktoam (grammar).
# CBSE prints titles in a legacy Lepcha font that does not extract as Unicode, with a Roman transliteration beside each.
# CBSE prints every Lepcha term and lesson title only in Roman transliteration; titles here keep CBSE's romanisation
# (the script CBSE actually uses) because SOYL could not verify native-script (Lepcha / Rong) spellings. Native-script titles
# are to be added in language review (see the M1 languages handoff). Lesson titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-11-lepcha
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-lepcha-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (periodic assessment 5, multiple assessment 5, portfolio 5, subject
  enrichment 5). A Unseen comprehension 10: four passages, attempt two (questions on understanding, knowledge and
  thinking skills). B Grammar 15. C Prose and poetry 25. D-I Drama, Thongoam Kat Nahan scenes I-VII 15. D-II Writing 15:
  essay writing, expansion of a passage, letter writing (formal/informal). Class XI is examined by the school (no board
  exam).
units:
