    marks: 10
  - name: B - Grammar (Mutanchi Rong Ringthyum)
    marks: 15
  - name: C - Prose and poetry (Kongchen Punol, Ringmom Chhyogyu)
    marks: 25
  - name: D-I - Drama (Thongoam Kat Nahan)
    marks: 15
  - name: D-II - Writing skills
    marks: 15
