subject_id: cbse-11-tamil
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-tamil-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Class 11 has no board exam; school annual examination 80 marks (3 hours) + internal assessment 20. Section A Reading 10: two unseen
  passages, 5 MCQs and 5 short answers. Section B Grammar 12 (all MCQ): correction of errors (la/la/zha, na/na/na, ra/ra) 3, vallinam migum
  idangal 3, choose the correct example 3, choose the correct sentence 3. Section C Main course book 33: poetry comprehension 5x1, prose
  comprehension 5x1, poetry short answers 2x4, prose long answers 3x5. Section D Non-detail 10: one essay-type long answer (1 of 3). Section
  E Creative writing 15: letter 6, poem or short story 3, general essay 6.
