# CBSE Class 11 Arabic (116), 2026-27. Sections, marks, writing tasks and grammar items as printed in the CBSE 2026-27
# Arabic Classes XI-XII syllabus (Class XI page). Prescribed book: Minhaj al-Ta'lim al-Thanawi al-'Ali lil-Lughat
# al-'Arabiyah, Class XI (CBSE, Delhi, 2011). CBSE names lessons only by number (for summaries), so the literature
# chapter carries placeholder topics until the book contents page is supplied. No text is reproduced (CONTEXT §8).
subject_id: cbse-11-arabic
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-xii-arabic-2026-27
  - cbse-senior-secondary-curriculum-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20 (handwriting 4, reading a short passage without diacritics 4,
  Arabic speaking 4, oral applied grammar 4, project 4). Section A Advanced reading 10: two of three unseen passages of
  150 words, five MCQs each. Section B Writing 15: letter on a given topic (1 address + 4 content) 5; summary of a
  textbook lesson in about 50 words (lessons 1, 3, 5, 6, 9, 11, 13, 16, 19, 20) 5; a longer composition (essay, story or
  incident) of about 100 words 5. Section C Grammar 20: definitions and examples 10 and applied grammar as MCQs 5+5.
  Section D Literature 35: prose - translation of two of three passages of about 50 words 16, six MCQs on a passage 4,
  diacritical marking 5; poetry - explanation of five given verses 6, four MCQs on given verses 4. Class XI is examined
  by the school (no board exam).
units:
  - name: 'القسم أ: مهارات القراءة المتقدمة'
    marks: 10
  - name: 'القسم ب: مهارات الكتابة الفعالة'
    marks: 15
  - name: 'القسم ج: القواعد (النظرية والتطبيق)'
    marks: 20
  - name: 'القسم د: الأدب'
    marks: 35
