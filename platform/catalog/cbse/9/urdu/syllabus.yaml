# CBSE Class 9 Urdu, 2026-27 (new NCF-SE scheme; one subject covering Urdu as R1 and as R2). Learning standards, marks and
# question design as printed in the CBSE 2026-27 Urdu Grade 9 document (20 pages, Urdu): "Urdu as R1" (pp. 9-16) and "Urdu as
# R2" (pp. 17-20). Both levels use the NCERT textbook Jamna, with Urdu Qawaid aur Insha (NCERT) as the suggested grammar book.
# CBSE does not list the lessons of Jamna, so the textbook chapter carries placeholder topics until the NCERT contents page is
# supplied. Topics that apply to only one level say so in title_en. Literature: titles and authors only (CONTEXT §8).
subject_id: cbse-9-urdu
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-urdu-2026-27
  - cbse-secondary-curriculum-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  School annual exam (no board exam in Class 9): 80 marks (3 hours) + internal assessment 20, for both R1 and R2.
  Section A Reading 20: unseen prose passage (R1 150-200 words, R2 100-125 words) 5x1, unseen poetic extract (R1 two
  stanzas or five to seven couplets, R2 two stanzas or five couplets) 5x1, seen prose extract 5x1 and seen poetic
  extract 5x1 from Jamna, each with MCQ, one-word and one-sentence items. Section B Writing 25: essay 8 (R1 150-200
  words, one of three topics; R2 100-150 words, one of four); application or letter 5; R1 advertisement (50-60 words) or
  eyewitness account (80-100 words) 4, R2 interview questions (eight) or a notice/announcement (about 50 words) 4; notes
  of about 100 words on prose lessons and their writers 4 and on poems and poets 4. Section C Grammar 20: R1 - nouns,
  pronouns and adjectives 6, verbs 4, figures of speech 6, idioms and sayings 4; R2 - number, gender, synonyms and
  antonyms, prefixes and suffixes 6, parts of speech and tenses 6, simile, allusion and antithesis 4, idioms and sayings
  4. Section D Literature 15: prose 6 and poetry 6 (short answers with choice; may be value based) and literary genres 3
  (R1 afsana, maktoob, mazmoon, ghazal, nazm, masnavi, qita; R2 afsana, ghazal, nazm). R3 Urdu is school-assessed only.
units:
  - name: 'حصہ الف: عبارت فہمی اور شعر فہمی'
    marks: 20
  - name: 'حصہ ب: تحریری مہارت'
    marks: 25
  - name: 'حصہ ج: عملی قواعد'
    marks: 20
  - name: 'حصہ د: ادب'
    marks: 15
chapters:
