        title_en: Unseen prose passage (R1 150-200 words; R2 100-125 words)
        learning_outcomes:
          - Read an unseen Urdu prose passage and answer multiple-choice, one-word and one-sentence questions on it
          - Identify the central idea of the passage and the meaning of words in context
      - id: cbse-9-urdu-ch01-t02
        title: غیر درسی شعری اقتباس
        title_en: Unseen poetic extract (two stanzas or five to seven couplets)
        learning_outcomes:
          - Explain the meaning and message of unseen verse and answer one-word and one-sentence questions on it
