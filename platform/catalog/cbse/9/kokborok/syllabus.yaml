# CBSE Class 9 Kokborok (091), 2026-27. Sections, marks, grammar items and lessons (titles and authors) as printed in the
# CBSE 2026-27 Kokborok Class IX-X syllabus (Class IX examination structure). Books (Kokborok Tei Kubuni Borok Bangthaya Bosongni
# Kok Dagikhung): Rwng Kwchar Kokrwbai Bwchap, Kothoma Bwsa (supplementary reader), Maidamik Kokborok Kokma Tei Swimung
# (grammar). CBSE writes Kokborok in Roman script. Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3 (school-based assessment). No text is reproduced (CONTEXT §8).
subject_id: cbse-9-kokborok
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-kokborok-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20 for R1/R2; at R3 the
  language is assessed by the school only. Internal assessment: periodic test 10, subject enrichment 5, notebook 5. A
  Reading 10: two passages, four direct short questions and one grammar question each (sandhi, sentence making, opposite
  words). B Writing 10: report writing (kokthum swimung) 5 and notice writing 5. C Grammar 10 very short answers. D
  Literature 50: prose 20, poetry 20, supplementary reader 10. The course-structure table gives reading 15, writing 10,
  grammar 20, literature 35.
units:
  - name: A - Reading
    marks: 10
  - name: B - Writing skills
    marks: 10
  - name: C - Grammar
    marks: 10
  - name: D - Literature (textbook and supplementary reader)
    marks: 50
