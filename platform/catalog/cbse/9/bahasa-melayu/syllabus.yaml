# CBSE Class 9 Bahasa Melayu (099), 2026-27. Sections, marks, grammar items and literature texts as printed in the CBSE
# 2026-27 Bahasa Melayu Class IX-X syllabus (Class IX page). Grammar book: Buku Teks Bahasa Melayu Tingkatan 3; literature:
# Bintang Hati - Antologi Teks Komponen Sastera Bahasa Melayu Tingkatan 3 (both Kementerian Pendidikan Malaysia).
# Text titles only; no text is reproduced (CONTEXT §8).
# Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3 (school-based assessment).
subject_id: cbse-9-bahasa-melayu
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-bahasa-melayu-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20 for R1/R2; at R3 the
  language is assessed by the school only. Internal assessment 20 (as for all Class X languages). Section A Reading 15:
  three unseen passages totalling 400 words (max 100 words each), 15 one-mark MCQs. Section B Writing 20: summary of one
  unseen passage in at most 80 words 10; one essay of at most 250 words or a formal letter 10. Section C Grammar 20:
  twenty one-mark items on sentence arrangement, the grammar items and idioms/proverbs. Section D Literature 25:
  traditional poem and modern poems (MCQ 5x1, short answers 3x2 and 1x3), traditional prose (long answer 6), short
  stories (MCQ 5x1).
units:
  - name: 'Bahagian A: Pemahaman'
    marks: 15
  - name: 'Bahagian B: Penulisan'
    marks: 20
  - name: 'Bahagian C: Tatabahasa'
    marks: 20
  - name: 'Bahagian D: Kesusasteraan'
    marks: 25
chapters:
