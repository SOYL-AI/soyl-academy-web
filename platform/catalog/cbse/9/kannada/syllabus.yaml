        title: ತತ್ಸಮ-ತದ್ಭವ
        title_en: Tatsama and tadbhava
        learning_outcomes:
          - Give the tadbhava of a tatsama word and vice versa
      - id: cbse-9-kannada-ch03-t02
        title: ಸಮಾನಾರ್ಥಕ ಪದ, ವಿರುದ್ಧ ಪದ, ಜೋಡಿ ಪದ
        title_en: Synonyms, antonyms and paired words
        learning_outcomes:
          - Choose synonyms, antonyms and the correct paired word (jodi pada)
      - id: cbse-9-kannada-ch03-t03
        title: ದ್ವಿರುಕ್ತಿ / ಅನುಕರಣಾವ್ಯಯ
        title_en: Reduplication and onomatopoeic indeclinables
        learning_outcomes:
          - Identify dvirukti and anukaranavyaya and use them in sentences
      - id: cbse-9-kannada-ch03-t04
        title: ಅರ್ಥವ್ಯತ್ಯಾಸ
        title_en: Words that differ in meaning (arthavyatyasa)
        learning_outcomes:
          - Distinguish the meanings of similar-looking word pairs
    removed_topics: []
    literature_texts: []
  - id: cbse-9-kannada-ch04
