      - id: cbse-9-kannada-ch04-t03
        title: 'ವಸ್ತುವಾಚಕಗಳು: ರೂಢನಾಮ, ಅಂಕಿತನಾಮ, ಅನ್ವರ್ಥನಾಮ'
