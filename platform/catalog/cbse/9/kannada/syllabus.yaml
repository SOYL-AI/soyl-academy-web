# CBSE Class 9 Kannada (015), 2026-27. Every prescribed lesson (in Roman transliteration, without authors), the 19
# grammar items and the writing tasks as listed in the CBSE 2026-27 Kannada Class IX syllabus. The syllabus prints no
# section marks, so units carry none. Textbook: Siri Kannada 9, Prathama Bhasha Kannada Pathyapustaka (Parishkrutha 2024,
# Karnataka Pathya Pustaka Sangha, Bengaluru); the non-detailed lessons are in the same book. Kannada-script titles are
# SOYL's rendering of CBSE's transliteration. Under the 2026-27 Class IX scheme the language may be taken at R1, R2 or R3;
# this file follows the CBSE IX list. Titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-9-kannada
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-kannada-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam; school annual examination 80 marks (3 hours) + internal assessment 20 (listening questionnaire; pick-and-speak
  and prepared elocution of 2-3 minutes; project work). Paper components: unseen passage on a Karnataka context, seen passage, grammar (MCQ
  items 1-13 and writing items 14-19), textbook prose and poetry, non-detailed lessons, essay, application or official letter, and report.
