chapters:
  - id: cbse-9-kannada-ch01
    number: 1
    title: ಅಪಠಿತ ಮತ್ತು ಪಠಿತ ಗದ್ಯಭಾಗ
    title_en: Unseen and seen comprehension passages
    unit: 'ವಿಭಾಗ ಎ: ಓದು ಮತ್ತು ಗ್ರಹಿಕೆ'
    topics:
      - id: cbse-9-kannada-ch01-t01
        title: ಅಪಠಿತ ಗದ್ಯಭಾಗ (ಕರ್ನಾಟಕ ಸಂದರ್ಭ)
        title_en: Unseen passage (Karnataka context)
        learning_outcomes:
          - Read an unseen Kannada passage set in a Karnataka context and answer questions on it
      - id: cbse-9-kannada-ch01-t02
        title: ಪಠಿತ ಗದ್ಯಭಾಗ
        title_en: Seen prose passage from the textbook
        learning_outcomes:
          - Answer one-sentence and MCQ questions on an extract from a textbook prose lesson
      - id: cbse-9-kannada-ch01-t03
        title: ಪಠಿತ ಪದ್ಯಭಾಗ
        title_en: Seen poetry extract from the textbook
        learning_outcomes:
          - Answer questions on an extract from a textbook poem
    removed_topics: []
    literature_texts: []
  - id: cbse-9-kannada-ch02
    number: 2
    title: ಸಮಾಸ ಮತ್ತು ಸಂಧಿ
    title_en: Compounds and sandhi
    unit: 'ವಿಭಾಗ ಬಿ: ಅನ್ವಯಿಕ ವ್ಯಾಕರಣ ಮತ್ತು ಪಠ್ಯಪೂರಕ ಅಧ್ಯಯನ'
    topics:
      - id: cbse-9-kannada-ch02-t01
        title: 'ಸಮಾಸಗಳು: ತತ್ಪುರುಷ, ಕರ್ಮಧಾರಯ, ಕ್ರಿಯಾ, ದ್ವಂದ್ವ, ದ್ವಿಗು'
        title_en: 'Compounds: tatpurusha, karmadharaya, kriya, dvandva, dvigu'
        learning_outcomes:
          - Identify the samasa and write its vigraha vakya
      - id: cbse-9-kannada-ch02-t02
        title: 'ಸಂಧಿಗಳು: ಲೋಪ, ಆಗಮ, ಆದೇಶ, ಸವರ್ಣದೀರ್ಘ, ಗುಣ, ಯಣ್, ವೃದ್ಧಿ'
        title_en: 'Sandhi: lopa, agama, adesha, savarnadirgha, guna, yan, vriddhi'
        learning_outcomes:
          - Split and join words and name the Kannada or Sanskrit sandhi
    removed_topics: []
    literature_texts: []
  - id: cbse-9-kannada-ch03
    number: 3
    title: ಪದಪರಿಚಯ
    title_en: Word study
    unit: 'ವಿಭಾಗ ಬಿ: ಅನ್ವಯಿಕ ವ್ಯಾಕರಣ ಮತ್ತು ಪಠ್ಯಪೂರಕ ಅಧ್ಯಯನ'
    topics:
