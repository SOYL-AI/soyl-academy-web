# CBSE Class 9 Dogri (170), 2026-27. Sections, marks, grammar items and writing tasks as printed in the CBSE 2026-27 Dogri
# Class IX syllabus (one page). Textbook: "Paungar" (Jammu and Kashmir State Board of School Education). CBSE does not list
# its lessons, so the textbook chapter carries placeholder topics until the contents page is supplied. Dogri section labels
# other than the grammar items are SOYL’s and should be checked by a Dogri reviewer. CBSE publishes no Class X Dogri
# syllabus for 2026-27. No text is reproduced (CONTEXT §8).
subject_id: cbse-9-dogri
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-dogri-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam; school annual examination 80 marks (3 hours) + internal assessment 20 (pen-and-paper tests 5,
  multiple assessment 5, portfolio 5, listening and speaking skills 2.5 + 2.5). A Reading 10: comprehension of unseen prose and
  poetry passages. B Grammar 25 (alphabet, nouns and their kinds, pronouns, adjectives and their kinds, verbs and their kinds,
  idioms and proverbs, antonyms, synonyms, change of gender, the pluta sign) and Writing 15 (essay, letter, application). C
  Textbook 30: short and long answer questions on the chapters of the textbook. Under the 2026-27 Class IX scheme the language may
  be taken at R1, R2 or R3 (R3: school-based assessment only); this file follows the CBSE Class IX syllabus. CBSE publishes no
  Class X syllabus for this language for 2026-27 (the subject enters with the 2026-27 Class IX cohort).
