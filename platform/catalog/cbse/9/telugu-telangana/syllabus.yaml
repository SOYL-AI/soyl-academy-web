# CBSE Class 9 Telugu (Telangana) (089), 2026-27. Sections, marks, grammar items (with CBSE's closed list of
# technical terms), writing tasks and every prescribed lesson as listed (in Roman transliteration, without authors) in
# the CBSE 2026-27 Telugu (Telangana) IX-X syllabus, Class IX. Textbook: Vennela - 4, Telugu Vachakam (Government of
# Telangana, new edition 2025). Telugu-script titles are SOYL's rendering of CBSE's transliteration. Under the 2026-27
# Class IX scheme the language may be taken at R1, R2 or R3; this file follows the CBSE IX list. Titles only; no text is
# reproduced (CONTEXT §8).
subject_id: cbse-9-telugu-telangana
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-telugu-telangana-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam; school annual examination 80 marks (3 hours), 18 questions + internal assessment 20. Section A Reading 14: two
  unseen prose passages 2x5 (MCQ); seen prose passage or seen poem 4x1. Section B Writing 12: letter 4, dialogue 4, diary entry 4. Section C
  Grammar 28 (MCQ): parts of speech 4, tenses 4, vibhaktulu 4, sandhis (akara, ikara, ukara, savarna dirgha, guna) 4, compounds (dvandva,
  dvigu) 4, synonyms 4, prakriyalu 2, technical terms from CBSE's list of 16 2. Section D Literature 26: long answer 4, 6 very short answers
  x 1, short answers 3x2 + 3x2, long answer 4.
