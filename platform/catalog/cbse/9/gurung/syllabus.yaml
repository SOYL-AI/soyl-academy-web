# CBSE Class 9 Gurung (132), 2026-27. Sections, marks, grammar items and lessons as printed in the CBSE 2026-27 Gurung
# Class IX-X syllabus (Class IX pages). Prescribed books (ASG(T)BA): Tamu Hyarkuhyi (Rup Raj Gurung); Tamu Kuhyi Ngina Khey and
# Tamu Hringang (Meg Raj Gurung and Padma Gurung). Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3 (school-based assessment).
# CBSE prints every Gurung term and lesson title only in Roman transliteration; titles here keep CBSE's romanisation
# (the script CBSE actually uses) because SOYL could not verify native-script (Devanagari or Khema) spellings. Native-script titles
# are to be added in language review (see the M1 languages handoff). Lesson titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-9-gurung
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-gurung-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20 for R1/R2; at R3 the
  language is assessed by the school only. Internal assessment: periodic test, project, home assignment, subject
  enrichment, copy submission. Part A: two unseen passages, five MCQs each (10); grammar 10 MCQs (Kuhyi, Hyarkuhyi, Pri,
  Tanz, Tanzai Khal, Mih, Mihyi Rathlangsyo, Garo). Part B: grammar 3x2; prose 3x2, 3x3, 2x4, 1x5 (28); poetry 4x2, 1x3
  (11); creative writing - essay of 110-115 words 5, letter 5, translation from English into Gurung 5.
