# CBSE Class 9 Odia (013), 2026-27. Sections, marks, design of the question paper, grammar items, writing tasks
# and every prescribed lesson (in Roman transliteration, without authors) from the CBSE 2026-27 Odia IX-X syllabus,
# Class IX. Books: Sahitya Dhara (Class IX, revised 2023) and Madhyamika Byakarana (Class IX, revised 2023), Board of
# Secondary Education, Odisha. Book lesson numbers 8, 14 and 15 are not prescribed. CBSE does not say which lessons form
# the non-detailed section; SOYL assumes the short stories and one-act plays. Odia-script titles are SOYL's rendering of
# CBSE's transliteration. Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3
# (school-based assessment); this file follows the CBSE IX list. Titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-9-odia
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-odia-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam; school annual examination 80 marks (3 hours), 14 questions + internal assessment 20 (periodic tests, best two
  of three 5; portfolio 5; subject enrichment - quiz, book review or books-and-authors chart, art-integrated activity 5; multiple assessment
  - listening and speaking, group work, field work, audio-visual presentation 5). Section A Reading 10: unseen prose passage of 130-150
  words, 5x2. Section B Writing 12: essay on a contemporary issue 1 of 3 x 6; official letter 1 of 2 x 6. Section C Grammar 10: sandhi 3 of
  4 x 1, samasa 3 of 4 x 1, taddhita 2 of 3 x 1, krudanta 2 of 3 x 1. Section D Literature 48: explanation from prose 1 of 2 x 5, prose
  short answers 3 of 5 x 2, prose MCQs 10x1; explanation from poetry 1 of 2 x 5, poetry short answers 3 of 5 x 2, poetry MCQs 10x1;
  non-detailed short answers 3 of 5 x 2.
