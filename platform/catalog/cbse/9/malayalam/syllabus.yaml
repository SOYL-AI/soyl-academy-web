# CBSE Class 9 Malayalam (012), 2026-27. Sections, marks, writing and grammar items and every prescribed lesson
# with its author, as listed (in Roman transliteration) in the CBSE 2026-27 Malayalam syllabus, Class IX. Books: Kerala
# Padavali Malayalam Part 1 and Part 2 and Adisthana Padavali Malayalam Std IX, edition 2024 (SCERT Kerala).
# Malayalam-script titles are SOYL's rendering of CBSE's transliteration. Under the 2026-27 Class IX scheme the language
# may be taken at R1 or R2 (school exam) or R3 (school-based assessment); this file follows the CBSE IX list. Titles and
# authors only; no text is reproduced (CONTEXT §8).
subject_id: cbse-9-malayalam
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-malayalam-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam; school annual examination on the CBSE design. Paper 80 marks (3 hours) + internal assessment 20 (pen-paper
  tests, art-integrated projects, portfolio, subject enrichment). Section A Reading 15: two unseen passages with 8 and 7 very short answer
  questions. Section B Creative writing 14: essay of about 200 words on social issues, family or school life (one of two) 5; letter
  (application, letter to the editor, commercial correspondence) 5; newspaper report of a simple event 4. Section C Grammar 15:
  transformation of sentences based on the textbook 4x2 (very short answers); vocabulary building 7 MCQs. Section D Literature 36: 9
  MCQ-type annotation and short questions x 2 (5 poetry, 4 prose); prose 3 of 4 short answers of about 100 words x 3; poetry 3 of 4 x 3. 50%
  competency-based questions; about 33% internal choice.
