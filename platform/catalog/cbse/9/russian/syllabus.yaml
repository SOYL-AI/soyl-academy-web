# CBSE Class 9 Russian (021), 2026-27. Sections, marks, essay topics and grammar items as printed in the CBSE 2026-27
# Russian Class IX-X syllabus (Class IX page). Books: Russian for Children (Russkii Yazyk), Book 3, by M. N. Vityutnev and
# others (Moscow, 1989) and Russian in Exercises by S. Khavronina and A. Shirochenskaya (Progress). CBSE lists the prescribed
# texts by NUMBER only, so the textbook chapter carries a placeholder topic. Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3 (school-based assessment). No text is reproduced.
subject_id: cbse-9-russian
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-russian-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20 for R1/R2; at R3 the
  language is assessed by the school only. Internal assessment: listening and speaking 10, a small project on Russian
  culture 5, a write-up on learning Russian 5. Section A Reading 10: unseen passage with 4-5 short questions. Section B
  Composition 15: short essay of 100-150 words on my family, my school, my friend, what I want to be or my favourite
  teacher. Section C Applied grammar 40: cases as used in the texts, prepositions в, на, с, к, changing sentences
  between present and past, adjective forms, translation of simple sentences. Section D Literature 15: five questions
  answered in Russian on texts 2, 4, 6, 8, 9, 14, 15, 17, 18, 19, 22, 24, 26, 28, 29.
units:
  - name: 'Раздел A: Чтение'
    marks: 10
  - name: 'Раздел B: Сочинение'
    marks: 15
  - name: 'Раздел C: Грамматика'
    marks: 40
  - name: 'Раздел D: Тексты учебника'
    marks: 15
