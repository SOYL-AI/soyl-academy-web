# CBSE Class 9 Tamang (133), 2026-27. Sections, marks, grammar items and lessons as printed in the CBSE 2026-27 Tamang
# Class IX syllabus. CBSE does not name the textbook (Government of Sikkim Tamang textbook). Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3 (school-based assessment).
# CBSE prints every Tamang term and lesson title only in Roman transliteration; titles here keep CBSE's romanisation
# (the script CBSE actually uses) because SOYL could not verify native-script (Devanagari or Tibetan) spellings. Native-script titles
# are to be added in language review (see the M1 languages handoff). Lesson titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-9-tamang
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-tamang-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20 for R1/R2; at R3 the
  language is assessed by the school only. Section A Reading 10: unseen passage (MCQ) 5 and seen passage from the
  prescribed book (MCQ) 5. Section B Literature 40: MCQ 15, short answers 17, long answers 8 on ten lessons. Section C
  Grammar 15 (MCQ). Section D Writing 15: essay of at least 300 words on contemporary issues 5, letter 5, translation 5.
units:
  - name: Section A - Reading
    marks: 10
  - name: Section B - Literature / textbook
    marks: 40
  - name: Section C - Grammar
    marks: 15
  - name: Section D - Writing
    marks: 15
