# CBSE Class 9 Gujarati (010), 2026-27. Every prescribed poem and prose lesson with its form and writer, grammar
# and writing items as printed in Gujarati in the CBSE 2026-27 Gujarati curriculum (Class IX table), and the Class IX
# blueprint. Textbook: Gujarati (Dwitiya Bhasha) Class IX, ed. 2016 (Gujarat Rajya Shala Pathya Pustak Mandal,
# Gandhinagar). Unlisted book lessons are not prescribed. Under the 2026-27 Class IX scheme the language may be taken at R1
# or R2 (school exam) or R3 (school-based assessment); this file follows the CBSE IX list. Titles and authors only; no
# text is reproduced (CONTEXT §8).
subject_id: cbse-9-gujarati
academic_year: "2026-27"
source_status: verified
sources:
