# CBSE Class 9 Spanish (096), 2026-27. Sections, marks, grammar items, culture and literature content as printed in the
# CBSE 2026-27 Spanish Class IX-X syllabus (Class IX pages). Prescribed book: Aula Internacional 1 (Jaime Corpas et al.,
# Difusión) - "relevant chapters", no lesson list. Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3 (school-based assessment). Literary works titles and authors only; no text is reproduced.
subject_id: cbse-9-spanish
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-spanish-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20 for R1/R2; at R3 the
  language is assessed by the school only. Internal assessment: periodic tests (best 2 of 3) 10, notebook 5, subject
  enrichment (listening and speaking) 5. Section A Reading 15: short unseen passages on everyday situations. Section B
  Written expression 15: short compositions from visual or verbal stimuli and dialogue writing. Section C Applied
  grammar 35. Section D Culture, civilisation and literature 15: Spain and ten Latin American countries; six authors and
  their best-known works.
units:
  - name: 'Sección A: Comprensión lectora'
    marks: 15
  - name: 'Sección B: Expresión escrita'
    marks: 15
  - name: 'Sección C: Gramática aplicada'
    marks: 35
  - name: 'Sección D: Cultura, civilización y literatura'
    marks: 15
chapters:
  - id: cbse-9-spanish-ch01
    number: 1
    title: Comprensión lectora
    title_en: Reading comprehension
    unit: 'Sección A: Comprensión lectora'
    topics:
      - id: cbse-9-spanish-ch01-t01
        title: Textos breves de la vida cotidiana
        title_en: Short passages on everyday situations
        learning_outcomes:
          - Deduce meaning from context, identify main points and scan for specific details
    removed_topics: []
    literature_texts: []
  - id: cbse-9-spanish-ch02
    number: 2
    title: Expresión escrita
    title_en: Written expression
    unit: 'Sección B: Expresión escrita'
    topics:
      - id: cbse-9-spanish-ch02-t01
        title: Composición breve a partir de un estímulo
        title_en: Short composition from a visual or verbal stimulus
        learning_outcomes:
          - Write a short composition from a picture or verbal cue
      - id: cbse-9-spanish-ch02-t02
        title: Diálogo de la vida cotidiana
        title_en: Dialogue on everyday matters
        learning_outcomes:
          - Write a dialogue on an everyday situation
    removed_topics: []
    literature_texts: []
  - id: cbse-9-spanish-ch03
    number: 3
    title: Pronombres, artículos y concordancia
    title_en: Pronouns, articles, gender, number and agreement
    unit: 'Sección C: Gramática aplicada'
    topics:
      - id: cbse-9-spanish-ch03-t01
        title: Pronombres personales e interrogativos
        title_en: Personal and interrogative pronouns
        learning_outcomes:
          - Use subject pronouns and question words correctly
      - id: cbse-9-spanish-ch03-t02
        title: Género, número, artículos y concordancia
        title_en: Gender, number, definite and indefinite articles, agreement (cuánto/-a/-os/-as)
        learning_outcomes:
          - Make articles, nouns and adjectives agree
      - id: cbse-9-spanish-ch03-t03
        title: Demostrativos y posesivos
        title_en: Demonstrative adjectives and pronouns; possessive adjectives
        learning_outcomes:
          - Use este/ese/aquel and mi/tu/su correctly
      - id: cbse-9-spanish-ch03-t04
        title: Pronombres indefinidos y numerales
        title_en: Indefinite pronouns; cardinal and ordinal numbers
        learning_outcomes:
          - Use alguien, nadie, algunos and numbers correctly
    removed_topics: []
    literature_texts: []
  - id: cbse-9-spanish-ch04
    number: 4
    title: El presente y sus usos
    title_en: The present tense and its uses
    unit: 'Sección C: Gramática aplicada'
    topics:
      - id: cbse-9-spanish-ch04-t01
        title: Verbos regulares -ar, -er, -ir y ser, llamarse, vivir
        title_en: Regular -ar/-er/-ir verbs; ser, llamarse, dedicarse, vivir, trabajar
        learning_outcomes:
          - Conjugate regular verbs in the present
      - id: cbse-9-spanish-ch04-t02
        title: Verbos irregulares en presente
        title_en: Irregular and stem-changing verbs in the present (querer, poder, saber, ir, venir, decir...)
        learning_outcomes:
          - Conjugate common irregular verbs in the present
      - id: cbse-9-spanish-ch04-t03
        title: Ser y estar; tener y hacer; hay y estar
        title_en: Ser vs estar; uses of tener and hacer; hay vs estar for location
        learning_outcomes:
          - Choose correctly between ser/estar and hay/estar
      - id: cbse-9-spanish-ch04-t04
        title: Gustar, encantar, interesar
        title_en: Gustar and similar verbs
        learning_outcomes:
          - Express likes and interests with gustar-type verbs
    removed_topics: []
    literature_texts: []
  - id: cbse-9-spanish-ch05
    number: 5
    title: Perífrasis, imperativo y pasado
    title_en: Periphrases, imperative, gerund and the preterite
    unit: 'Sección C: Gramática aplicada'
    topics:
      - id: cbse-9-spanish-ch05-t01
        title: Tener ganas de, ir a, empezar a, terminar de, antes de / después de + infinitivo
        title_en: Verbal periphrases with the infinitive
        learning_outcomes:
          - Express plans, beginnings and sequences with periphrases
      - id: cbse-9-spanish-ch05-t02
        title: Estar + gerundio
        title_en: Estar + gerund
        learning_outcomes:
          - Describe actions in progress
      - id: cbse-9-spanish-ch05-t03
        title: Imperativo afirmativo con pronombres
        title_en: Simple affirmative commands with object pronouns
        learning_outcomes:
          - Give simple commands attaching object pronouns
      - id: cbse-9-spanish-ch05-t04
        title: Comparación, negación, preposiciones de tiempo y lugar
        title_en: Comparison, negation, prepositions of time and place
        learning_outcomes:
          - Compare things and use prepositions of time and place
      - id: cbse-9-spanish-ch05-t05
        title: Introducción al pretérito indefinido
        title_en: Introduction to the preterite
        learning_outcomes:
          - Narrate simple past events with the preterite
    removed_topics: []
    literature_texts: []
  - id: cbse-9-spanish-ch06
    number: 6
    title: Cultura de España y América Latina
    title_en: Culture of Spain and Latin America
    unit: 'Sección D: Cultura, civilización y literatura'
    topics:
      - id: cbse-9-spanish-ch06-t01
        title: España
        title_en: 'Spain: events, monuments, festivals, cuisine, places, personalities, geography'
        learning_outcomes:
          - State basic cultural facts about Spain
      - id: cbse-9-spanish-ch06-t02
        title: Países latinoamericanos
        title_en: México, Costa Rica, El Salvador, Panamá, Cuba, Argentina, Bolivia, Chile, Ecuador, Paraguay
        learning_outcomes:
          - State basic cultural and geographical facts about the listed countries
    removed_topics: []
    literature_texts: []
  - id: cbse-9-spanish-ch07
    number: 7
    title: Autores hispánicos
    title_en: Authors from Spanish-speaking countries
    unit: 'Sección D: Cultura, civilización y literatura'
    topics:
      - id: cbse-9-spanish-ch07-t01
        title: Miguel de Cervantes y Benito Pérez Galdós
        title_en: Cervantes and Pérez Galdós
        learning_outcomes:
