# CBSE Class 9 Lepcha (026), 2026-27. Sections, marks, grammar items and lessons as printed in the CBSE 2026-27 Lepcha
# Class IX-X syllabus (Class IX pages). Titles are printed in a legacy Lepcha font that does not extract as Unicode, with a
# Roman transliteration beside each. Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3 (school-based assessment).
# CBSE prints every Lepcha term and lesson title only in Roman transliteration; titles here keep CBSE's romanisation
# (the script CBSE actually uses) because SOYL could not verify native-script (Lepcha / Rong) spellings. Native-script titles
# are to be added in language review (see the M1 languages handoff). Lesson titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-9-lepcha
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-lepcha-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20 for R1/R2; at R3 the
  language is assessed by the school only. Internal assessment 20 (speaking and listening, assignment, project). A
  Unseen comprehension 10: four passages, attempt two, five MCQs each. B Grammar 15. C Prose and poetry 25 (11 lessons).
  D-I Sung Norjut 15 (three stories). D-II Writing 12: paragraph, translation, formal or informal letter. D-III
  Introduction of poets and writers 3.
units:
  - name: A - Unseen comprehension
    marks: 10
  - name: B - Grammar (Mutanchi Rong Ringthyum)
    marks: 15
  - name: C - Prose and poetry (Ringmom Chhyogyu, Chukdong Chyogyu)
    marks: 25
  - name: D-I - Sung Norjut
    marks: 15
  - name: D-II - Writing skills
    marks: 12
  - name: D-III - Understanding skills
    marks: 3
