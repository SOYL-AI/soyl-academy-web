# CBSE Class 9 French (018), 2026-27. Sections, marks, writing tasks, grammar items and textbook lessons as printed in the
# CBSE 2026-27 French Class IX-X syllabus (Class IX pages). Prescribed textbook: Entre Jeunes, Class IX (CBSE), lessons 1-8.
# Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3 (school-based assessment). Lesson titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-9-french
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-french-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20 for R1/R2; at R3 the
  language is assessed by the school only. Internal assessment: subject enrichment (ASL) 5, portfolio 5, periodic tests
  5, multiple assessment 5. Section A Reading 10: one unseen factual/descriptive passage of 150 words with a picture or
  data (true/false, short answers, vocabulary search). Section B Writing 20: informal letter of 80 words 10 (1 of 3) and
  two short compositions of 30-35 words (message, describing a person, recipe, postcard) 2x5. Section C Grammar 30: six
  questions of 5 (5 of 7 items each). Section D Culture and civilisation 20 (lessons 1-8): short answers 5x2 and any two
  of true/false, matching and gap filling.
units:
  - name: 'Section A : Compréhension écrite'
    marks: 10
  - name: 'Section B : Expression écrite'
    marks: 20
  - name: 'Section C : Grammaire'
    marks: 30
  - name: 'Section D : Culture et civilisation'
    marks: 20
chapters:
  - id: cbse-9-french-ch01
    number: 1
    title: Compréhension écrite
    title_en: Reading comprehension (unseen passage)
    unit: 'Section A : Compréhension écrite'
    topics:
      - id: cbse-9-french-ch01-t01
        title: Texte inconnu (150 mots) avec image ou données
        title_en: Unseen passage (150 words) with a picture or data
        learning_outcomes:
          - Answer true/false and short questions on an unseen French passage
      - id: cbse-9-french-ch01-t02
        title: Recherche de vocabulaire
        title_en: 'Vocabulary search: noun and verb forms, opposites, synonyms, adjectives'
        learning_outcomes:
          - Find given word forms, opposites and synonyms in the passage
    removed_topics: []
    literature_texts: []
  - id: cbse-9-french-ch02
    number: 2
    title: Expression écrite
    title_en: Writing
    unit: 'Section B : Expression écrite'
    topics:
      - id: cbse-9-french-ch02-t01
        title: La lettre informelle (80 mots)
        title_en: Informal letter (80 words)
        learning_outcomes:
          - Write an informal letter of about 80 words with the correct layout
      - id: cbse-9-french-ch02-t02
        title: Message, carte postale, recette, description d'une personne (30-35 mots)
        title_en: 'Short compositions: message, postcard, recipe, describing a person (30-35 words)'
        learning_outcomes:
          - Write short functional texts of 30-35 words from visual input and clues
    removed_topics: []
    literature_texts: []
  - id: cbse-9-french-ch03
    number: 3
    title: 'Grammaire : déterminants, pronoms et phrases'
    title_en: 'Grammar: demonstratives, pronouns, questions and negation'
    unit: 'Section C : Grammaire'
    topics:
      - id: cbse-9-french-ch03-t01
        title: Les adjectifs démonstratifs
        title_en: Demonstrative adjectives
        learning_outcomes:
          - Use ce, cet, cette and ces correctly
      - id: cbse-9-french-ch03-t02
        title: Trouvez la question
        title_en: Question formation (excluding interrogative adjectives and pronouns)
        learning_outcomes:
          - Frame questions for given answers
      - id: cbse-9-french-ch03-t03
        title: La négation
        title_en: Negatives
        learning_outcomes:
          - Make sentences negative with ne...pas, jamais, plus, rien, personne
      - id: cbse-9-french-ch03-t04
        title: Les pronoms personnels (COD, COI) et relatifs simples
        title_en: Object pronouns and simple relative pronouns
        learning_outcomes:
          - Replace nouns with object pronouns and join sentences with qui, que, où, dont
    removed_topics: []
    literature_texts: []
