# CBSE Class 9 Maithili (169), 2026-27. Sections, marks, grammar items and writing tasks as printed in the CBSE 2026-27
# Maithili Class IX syllabus. Textbooks: Praveshika, Maithili Gadya-Padya Sangrah, Part 1 and the supplementary reader
# Mithilak Dharohar, Part 1 (Bihar State Textbook Publishing Corporation, developed by SCERT Patna). CBSE does not list
# the lessons of either book, so the textbook chapters carry placeholder topics until the contents pages are supplied.
# CBSE publishes no Class X Maithili syllabus for 2026-27. Titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-9-maithili
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-maithili-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam; school annual examination 80 marks (3 hours) + internal assessment 20 (pen-and-paper tests 5,
  multiple assessment 5, portfolio 5, listening and speaking skills 2.5 + 2.5). A Reading 10: two unseen passages (one prose, one
  poetry), short-answer and MCQ. B Grammar 25 (noun, pronoun, adjective, tense, verb, indeclinable, one word for many, synonyms
  and antonyms; very short, MCQ and short answers) and Writing 15 (precis, letter, essay). C Textbook 30 (prose and poetry; short
  and long answers). Under the 2026-27 Class IX scheme the language may be taken at R1, R2 or R3 (R3: school-based assessment
  only); this file follows the CBSE Class IX syllabus. CBSE publishes no Class X syllabus for this language for 2026-27 (the
  subject enters with the 2026-27 Class IX cohort).
