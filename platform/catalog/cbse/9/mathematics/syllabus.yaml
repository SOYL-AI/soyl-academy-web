# CBSE Class 9 Mathematics, 2026-27 — new NCF-SE syllabus (new NCERT textbook). Chapters in CBSE syllabus order; textbook order may differ.
subject_id: cbse-9-mathematics
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-mathematics-2026-27
  - cbse-secondary-curriculum-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20. IA: pen-paper test and multiple
  assessment 5+5, portfolio 5, lab practical 5. Optional Mathematics at Advanced Level paper (25 marks, 1 hour) is a separate subject. Unit
  marks: Number System 7, Algebra 20, Coordinate Geometry 4, Geometry 25, Mensuration 14, Statistics and Probability 10.
units:
  - name: "Unit I: Number System"
    marks: 7
  - name: "Unit II: Algebra"
    marks: 20
  - name: "Unit III: Coordinate Geometry"
    marks: 4
  - name: "Unit IV: Geometry"
    marks: 25
  - name: "Unit V: Mensuration"
    marks: 14
  - name: "Unit VI: Statistics and Probability"
    marks: 10
chapters:
  - id: cbse-9-mathematics-ch01
    number: 1
    title: Number System
    unit: "Unit I: Number System"
    topics:
      - id: cbse-9-mathematics-ch01-t01
        title: Rational and irrational numbers on the number line
        learning_outcomes:
          - Represent rational and irrational numbers such as √2 and √3 on the number line
      - id: cbse-9-mathematics-ch01-t02
        title: Real numbers and their decimal expansions
        learning_outcomes:
          - Classify decimal expansions as terminating, recurring or non-recurring
      - id: cbse-9-mathematics-ch01-t03
        title: Operations on real numbers; rationalisation
        learning_outcomes:
          - Simplify surds and rationalise denominators
      - id: cbse-9-mathematics-ch01-t04
        title: Laws of exponents for real numbers
        learning_outcomes:
          - Apply laws of exponents with integral and rational powers
    removed_topics: []
    literature_texts: []
  - id: cbse-9-mathematics-ch02
    number: 2
    title: Introduction to Polynomials
    unit: "Unit II: Algebra"
    topics:
      - id: cbse-9-mathematics-ch02-t01
        title: Polynomials in one variable; degree and zeroes
        learning_outcomes:
          - Classify polynomials and find their zeroes
      - id: cbse-9-mathematics-ch02-t02
        title: Remainder and factor theorems
        learning_outcomes:
          - Apply the remainder and factor theorems to factorise polynomials
    removed_topics: []
    literature_texts: []
  - id: cbse-9-mathematics-ch03
    number: 3
    title: Sequences and Progressions
    unit: "Unit II: Algebra"
    topics:
      - id: cbse-9-mathematics-ch03-t01
        title: "Sequences: patterns, recursive and explicit rules"
        learning_outcomes:
          - Identify the pattern in a sequence and write recursive and explicit formulas
      - id: cbse-9-mathematics-ch03-t02
        title: Arithmetic progressions
        learning_outcomes:
          - Identify an AP, find its nth term and visualise it graphically
      - id: cbse-9-mathematics-ch03-t03
        title: Geometric progressions
        learning_outcomes:
          - Identify a GP, find its nth term and visualise it; relate GPs to fractals and the Tower of Hanoi
    removed_topics: []
    literature_texts: []
  - id: cbse-9-mathematics-ch04
    number: 4
    title: Exploring Algebraic Identities
    unit: "Unit II: Algebra"
    topics:
      - id: cbse-9-mathematics-ch04-t01
        title: Visualising algebraic identities
        learning_outcomes:
          - Visualise identities such as (a+b)², (a+b)³ and a³+b³+c³−3abc geometrically
      - id: cbse-9-mathematics-ch04-t02
        title: Factorisation using identities
        learning_outcomes:
          - Factorise algebraic and quadratic expressions using identities
      - id: cbse-9-mathematics-ch04-t03
        title: Simplifying rational expressions
        learning_outcomes:
          - Simplify rational algebraic expressions
    removed_topics: []
    literature_texts: []
  - id: cbse-9-mathematics-ch05
    number: 5
    title: Linear Equations in Two Variables
    unit: "Unit II: Algebra"
    topics:
      - id: cbse-9-mathematics-ch05-t01
        title: Linear equations in two variables and their solutions
        learning_outcomes:
          - Show that a linear equation has infinitely many solutions and find solutions
      - id: cbse-9-mathematics-ch05-t02
        title: Graph of a linear equation
        learning_outcomes:
          - Plot linear equations and interpret graphs of real-life linear relationships
    removed_topics: []
    literature_texts: []
  - id: cbse-9-mathematics-ch06
    number: 6
    title: Coordinate Geometry
    unit: "Unit III: Coordinate Geometry"
    topics:
      - id: cbse-9-mathematics-ch06-t01
        title: Cartesian plane and plotting points
        learning_outcomes:
          - Locate points in the four quadrants and read coordinates
      - id: cbse-9-mathematics-ch06-t02
        title: Distance and midpoint in the plane
        learning_outcomes:
          - Find distances along axes and coordinates of midpoints
    removed_topics: []
    literature_texts: []
  - id: cbse-9-mathematics-ch07
    number: 7
    title: "Introduction to Euclid's Geometry: Axioms and Postulates"
    unit: "Unit IV: Geometry"
    topics:
      - id: cbse-9-mathematics-ch07-t01
        title: Origins of geometry; contributions of India, Egypt and Greece
        learning_outcomes:
          - Describe how geometry developed, including Sulba Sutra contributions
      - id: cbse-9-mathematics-ch07-t02
        title: Definitions, axioms and postulates
        learning_outcomes:
          - State Euclid's five postulates and distinguish definitions, axioms and postulates
      - id: cbse-9-mathematics-ch07-t03
        title: Simple constructions justified by postulates
        learning_outcomes:
          - Justify simple constructions such as a square using postulates
    removed_topics: []
    literature_texts: []
  - id: cbse-9-mathematics-ch08
    number: 8
    title: Lines and Angles
    unit: "Unit IV: Geometry"
    topics:
      - id: cbse-9-mathematics-ch08-t01
        title: Angles and rays; types of angles
        learning_outcomes:
          - Classify angles and explain the notion of a ray and an angle
      - id: cbse-9-mathematics-ch08-t02
        title: Linear pair and vertically opposite angles
        learning_outcomes:
          - Prove the linear pair theorem and that vertically opposite angles are equal
      - id: cbse-9-mathematics-ch08-t03
        title: Parallel lines and transversals
        learning_outcomes:
          - Identify corresponding, alternate and co-interior angles and use transitivity of parallelism
      - id: cbse-9-mathematics-ch08-t04
        title: Proof by contradiction
        learning_outcomes:
          - Follow and construct simple proofs by contradiction
    removed_topics: []
    literature_texts: []
  - id: cbse-9-mathematics-ch09
    number: 9
    title: Triangles – Congruence Theorems
    unit: "Unit IV: Geometry"
    topics:
      - id: cbse-9-mathematics-ch09-t01
        title: Rigidity of triangles
        learning_outcomes:
          - Explain why triangles are rigid and their uses in structures
      - id: cbse-9-mathematics-ch09-t02
        title: "Congruence criteria: SAS, ASA, SSS, RHS, AAS"
        learning_outcomes:
          - Use congruence criteria to prove triangles congruent
      - id: cbse-9-mathematics-ch09-t03
        title: Properties of isosceles triangles
        learning_outcomes:
          - Prove the basic properties of isosceles triangles
      - id: cbse-9-mathematics-ch09-t04
        title: Propositions and converses; why SSA fails
        learning_outcomes:
          - Form converses and explain why SSA is not a congruence condition in general
    removed_topics: []
    literature_texts: []
  - id: cbse-9-mathematics-ch10
    number: 10
    title: 4-gons (Quadrilaterals)
    unit: "Unit IV: Geometry"
    topics:
      - id: cbse-9-mathematics-ch10-t01
        title: Definition and types of 4-gons
        learning_outcomes:
          - Frame precise definitions of quadrilaterals and characterise parallelograms
      - id: cbse-9-mathematics-ch10-t02
        title: Midpoint theorem and its converse
        learning_outcomes:
          - Prove the midpoint theorem and its converse
      - id: cbse-9-mathematics-ch10-t03
        title: Medians and the Varignon parallelogram
        learning_outcomes:
          - Prove that medians are concurrent and that joining midpoints of a 4-gon gives a parallelogram
      - id: cbse-9-mathematics-ch10-t04
        title: Symmetry and tiling
        learning_outcomes:
          - Explain reflection, rotation and tiling with 4-gons
    removed_topics: []
    literature_texts: []
  - id: cbse-9-mathematics-ch11
    number: 11
    title: Circles
    unit: "Unit IV: Geometry"
    topics:
      - id: cbse-9-mathematics-ch11-t01
        title: Circle terms; unique circle through three points
        learning_outcomes:
          - Define circle terms and construct the circumcircle
      - id: cbse-9-mathematics-ch11-t02
        title: Chords and the angles they subtend
        learning_outcomes:
          - Prove results on equal chords, perpendiculars from the centre and distances of chords
      - id: cbse-9-mathematics-ch11-t03
        title: Angles subtended by arcs; cyclic quadrilaterals
        learning_outcomes:
          - >-
            Prove that the angle at the centre is double the angle at the circumference, angles in the same segment and the semicircle, and
            properties of cyclic quadrilaterals
    removed_topics: []
    literature_texts: []
  - id: cbse-9-mathematics-ch12
    number: 12
    title: Area and Perimeter
    unit: "Unit V: Mensuration"
    topics:
      - id: cbse-9-mathematics-ch12-t01
        title: Perimeter and circumference; π
        learning_outcomes:
          - Compute circumferences and arc lengths and describe historical approximations of π
      - id: cbse-9-mathematics-ch12-t02
        title: "Area of triangles: Heron's formula"
        learning_outcomes:
          - Use Heron's formula and explain why a median bisects area
      - id: cbse-9-mathematics-ch12-t03
        title: Area of circles and sectors
        learning_outcomes:
          - Compute areas of circles and sectors
      - id: cbse-9-mathematics-ch12-t04
        title: Brahmagupta's formula for cyclic quadrilaterals
        learning_outcomes:
          - State and use Brahmagupta's formula and relate Heron's formula as a special case
    removed_topics: []
    literature_texts: []
  - id: cbse-9-mathematics-ch13
    number: 13
    title: Surface Area and Volume
    unit: "Unit V: Mensuration"
    topics:
      - id: cbse-9-mathematics-ch13-t01
        title: Cuboids and cubes
        learning_outcomes:
          - Compute surface area and volume of cuboids and cubes
      - id: cbse-9-mathematics-ch13-t02
        title: Right circular cylinders and cones
        learning_outcomes:
          - Compute surface area and volume of cylinders and cones
      - id: cbse-9-mathematics-ch13-t03
        title: Pyramids
        learning_outcomes:
          - Identify pyramids and compute their surface area and volume
      - id: cbse-9-mathematics-ch13-t04
        title: Spheres and hemispheres
        learning_outcomes:
          - Compute surface area and volume of spheres
    removed_topics: []
    literature_texts: []
  - id: cbse-9-mathematics-ch14
    number: 14
    title: Statistics
    unit: "Unit VI: Statistics and Probability"
    topics:
      - id: cbse-9-mathematics-ch14-t01
        title: Collecting and organising data
        learning_outcomes:
          - Collect, organise and visualise data
      - id: cbse-9-mathematics-ch14-t02
        title: Weighted average
        learning_outcomes:
          - Compute and apply weighted averages
      - id: cbse-9-mathematics-ch14-t03
        title: Stacked bar graphs and other representations
        learning_outcomes:
          - Read and interpret stacked bar graphs, histograms and frequency polygons
    removed_topics: []
    literature_texts: []
  - id: cbse-9-mathematics-ch15
    number: 15
    title: Introduction to Probability
    unit: "Unit VI: Statistics and Probability"
    topics:
      - id: cbse-9-mathematics-ch15-t01
        title: Likelihood and empirical probability
        learning_outcomes:
          - Describe likelihood and estimate empirical probability from experiments
      - id: cbse-9-mathematics-ch15-t02
        title: Theoretical probability
        learning_outcomes:
          - Define and compute theoretical probability of simple events
    removed_topics: []
    literature_texts: []
removed_topics: []
