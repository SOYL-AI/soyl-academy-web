# CBSE Class 9 Santhali (167), 2026-27. Sections, marks, grammar items, writing tasks and every prescribed lesson as printed
# in the CBSE 2026-27 Santhali Class IX syllabus. CBSE prints Santali titles in DEVANAGARI (not Ol Chiki as subjects.yaml
# assumes), so this file follows CBSE. Books: Santali Literature (Prose and Poetry) - Santali Sahitya (Kathni ar Gathni),
# BSTPC Patna; Pe Pawa Chawle by Bal Kishor Baski "Arman". Reference: Bhenta Katha (proverbs), Santali Grammar, Sanatari
# Parsi Unurum (Dr Krishna Chandra Tudu). Titles are transcribed from the PDF (nukta/halant marks need a Santali reviewer;
# song 10 is printed "लागड़ें सेरेञ प" with a stray letter); section and topic labels are SOYL’s. English glosses in
# title_en are given only where well known. CBSE publishes no Class X Santhali syllabus for 2026-27. No text is reproduced.
subject_id: cbse-9-santhali
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-santhali-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam; school annual examination 80 marks (3 hours) + internal assessment 20 (pen-and-paper tests 5,
  multiple assessment 5, portfolio 5, listening and speaking skills 2.5 + 2.5). A Reading 10: two unseen passages (one prose, one
  poetry). B Writing 15 (essay, letter) and Grammar 25 (noun, pronoun, adjective, change of gender, tenses, case (karak), proverbs
  and their use in sentences, translation of a passage from English into Santhali). C Main textbook 30 (prose, poetry, story).
  Under the 2026-27 Class IX scheme the language may be taken at R1, R2 or R3 (R3: school-based assessment only); this file
  follows the CBSE Class IX syllabus. CBSE publishes no Class X syllabus for this language for 2026-27 (the subject enters with
  the 2026-27 Class IX cohort).
