# CBSE Class 9 Tibetan (017), 2026-27. Sections, marks, topics and textbook lesson numbers as printed in the CBSE 2026-27
# Tibetan Class IX-X syllabus (Class IX course structure). Prescribed book: New Tibetan Textbook for Class IX (Sherig Parkhang /
# TCRPC). Tibetan spellings of the romanised CBSE names are SOYL renderings to be checked in language review.
# Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3 (school-based assessment). No text is reproduced.
subject_id: cbse-9-tibetan
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-tibetan-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20 for R1/R2; at R3 the
  language is assessed by the school only. Section A Reading 15: a seen and an unseen passage from stories, notes and
  biographies (lesson 9). Section B Writing 25: letters to parents, relatives and friends; notice, minutes and diary
  (lessons 10-12) 8; essay, article or column (lessons 13-22) 12; translation from English into Tibetan 5. Section C
  Grammar 15: letter order of the Sum cu pa and particles depending on the suffix letter; introduction to noun, adverb,
  verb and adjective (lessons 1-7) 10; orthography (lesson 8) 5. Section D Literature 25: prose - selected verses of
  chapter 1 of the Sa skya legs bshad, Kha che pha lu'i bslab bya and proverbs (lesson 23) 10; poetry - verse of 6 to 9
  syllables and Ka bshad (lessons 25-26) 10; rapid reading - My Land and My People (lesson 26) 5.
