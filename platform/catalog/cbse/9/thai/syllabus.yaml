# CBSE Class 9 Thai (136), 2026-27. Sections, marks and topics as printed in the CBSE 2026-27 Thai Class IX-X syllabus
# (one examination structure for Classes IX and X). CBSE names no prescribed textbook or literary texts for Thai, so the
# literature chapter covers the skills it tests (reference to context, character sketch, culture and civilisation). Add
# texts here if CBSE or the school names them. Thai titles are SOYL translations of the English headings.
# Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3 (school-based assessment).
subject_id: cbse-9-thai
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-thai-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20 for R1/R2; at R3 the
  language is assessed by the school only. Internal assessment 20 (periodic tests, best 2 of 3, 5; multiple assessment
  5; subject enrichment activity 5; portfolio 5). Section A Reading comprehension 10 (12.5%): unseen passage with
  short-answer questions, vocabulary search and grammar. Section B Written expression 20 (25%), long answers: short
  story with cues or writing poems; formal or informal letter; article or mind mapping; short newspaper report, or
  report writing or dialogue writing. Section C Applied grammar 30 (37.5%), very short answers: types of nouns, sentence
  reordering, verb forms, classifiers, consonant blends and syllables, Pali/Sanskrit loanwords, gap filling, synonyms
  and antonyms. Section D Literature, culture and civilisation 20 (25%): reference to context and short answers,
  character sketch, theory or project-based questions on culture.
units:
  - name: 'ส่วน ก: การอ่านจับใจความ'
    marks: 10
  - name: 'ส่วน ข: การเขียน'
    marks: 20
  - name: 'ส่วน ค: ไวยากรณ์ประยุกต์'
    marks: 30
  - name: 'ส่วน ง: วรรณคดีและวัฒนธรรม'
    marks: 20
chapters:
