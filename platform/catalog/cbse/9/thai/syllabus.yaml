      - id: cbse-9-thai-ch01-t02
        title: การค้นหาคำศัพท์และไวยากรณ์จากบทอ่าน
        title_en: Vocabulary search and grammar from the passage
        learning_outcomes:
          - Find words in a passage that match given meanings, opposites or grammatical forms
    removed_topics: []
