    title_en: Reading comprehension (unseen passage)
    unit: 'بخش الف: خواندن'
    topics:
      - id: cbse-9-persian-ch01-t01
        title: متن ناخوانده به فارسی ساده
        title_en: Unseen passage in simple Persian
        learning_outcomes:
          - Read an unseen passage in simple Persian and answer questions on it
    removed_topics: []
