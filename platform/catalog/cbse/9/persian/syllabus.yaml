# CBSE Class 9 Persian (023), 2026-27. Sections, marks, grammar items, prescribed books and lesson titles as printed in
# the CBSE 2026-27 Persian Class IX-X syllabus (Class IX page). Books: Farsi wa Dastoor (Book I) by Dr Zahra Khanlari and
# Amoozish-e-Zaban-e-Farsi (Kitab-e-Sewum) Book III (Iran Culture House). CBSE prints titles in transliteration; the Persian
# spellings are SOYL transliterations, to be checked in language review. Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3 (school-based assessment). No text is reproduced (CONTEXT §8).
subject_id: cbse-9-persian
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-persian-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20 for R1/R2; at R3 the
  language is assessed by the school only. Internal assessment: writing project (grammar chart) 5, oral test on the
  prescribed text 5, debate, group discussion, reading and recitation 10. Section A Reading 10: unseen passage of simple
  Persian. Section B Writing 10: paragraph of 50 words 6; sick-leave application 4. Section C Grammar and translation
  20: subject and predicate, ism-e-fa'il and maf'ul, noun (singular and plural), pronouns (persons), ezafe and
  prepositions (huruf-e-jar), infinitives and their meanings; translation between Persian and Urdu/Hindi/English.
  Section D Literature 40 (printed as "Grammar and Translation" in the syllabus) from the two prescribed books.
units:
  - name: 'بخش الف: خواندن'
    marks: 10
  - name: 'بخش ب: نوشتن'
    marks: 10
  - name: 'بخش ج: دستور زبان و ترجمه'
    marks: 20
  - name: 'بخش د: ادبیات (نثر و شعر)'
    marks: 40
chapters:
