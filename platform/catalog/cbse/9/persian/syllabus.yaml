    title_en: Grammar
    unit: 'بخش ج: دستور زبان و ترجمه'
    topics:
      - id: cbse-9-persian-ch03-t01
        title: نهاد و گزاره
        title_en: Subject and predicate
        learning_outcomes:
          - Identify the subject and predicate of Persian sentences
      - id: cbse-9-persian-ch03-t02
        title: اسم فاعل و اسم مفعول
        title_en: Ism-e-fa'il and ism-e-maf'ul
        learning_outcomes:
          - Form agent nouns and participles from verbs
      - id: cbse-9-persian-ch03-t03
        title: اسم (مفرد و جمع) و ضمیر
        title_en: Noun (singular and plural) and pronouns (persons)
        learning_outcomes:
          - Form plurals and use personal pronouns correctly
      - id: cbse-9-persian-ch03-t04
        title: اضافه و حروف جر
        title_en: Ezafe and prepositions (huruf-e-jar)
        learning_outcomes:
          - Use the ezafe construction and common prepositions
      - id: cbse-9-persian-ch03-t05
        title: مصادر و معانی
        title_en: Infinitives and their meanings
        learning_outcomes:
          - Give the meanings of common Persian infinitives
    removed_topics: []
    literature_texts: []
