        learning_outcomes:
          - >-
            Summarise the poem "Be-nameh-e-Ezad Bakshandeh" from Farsi wa Dastoor and state its central idea or moral in
            simple Persian
      - id: cbse-9-persian-ch05-t02
        title: واژگان، پرسش و پاسخ و ترجمه
