# CBSE Class 9 Punjabi (004), 2026-27. Sections, marks, grammar and writing items and every prescribed poem, prose
# piece, story and one-act play with its author, as printed in Punjabi in the CBSE 2026-27 Punjabi IX-X syllabus, Class
# IX. Books: Sahit-Mala 9 (Punjabi poetry and prose) and Vangi 9 (Punjabi stories and one-act plays), Punjab School
# Education Board, Sahibzada Ajit Singh Nagar (also on www.pseb.ac.in). Under the 2026-27 Class IX scheme the language
# may be taken at R1, R2 or R3; this file follows the CBSE IX list. Titles and authors only; no text is reproduced.
subject_id: cbse-9-punjabi
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-punjabi-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam; school annual examination 80 marks (3 hours) + internal assessment 20 (activities and assignments). Reading 10:
  unseen prose passage of 200-250 words with 6 MCQs, unseen poem extract with 4 questions. Grammar 12 (MCQ and short answers, with choice):
  antonyms, gender, interjections, word correction, verbs, idioms (letters ura to ha, used in sentences) - 2x1 each. Writing 18: essay of
  200 words on a reflective or general topic (one of three, with points) 8; personal or application letter (one of two) 6; description of a
  picture in 50 words 4. Textbooks 40: MCQs on stories and prose 5x1 and on poetry and one-act plays 5x1; one- or two-word answers on
  stories and prose 4x1; short answers (25-30 words) on stories, plays and prose 7x2; answers of 50-60 words on poetry and prose 2x4 and on
  a one-act play 1x4.
