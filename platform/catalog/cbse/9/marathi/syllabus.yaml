# CBSE Class 9 Marathi (009), 2026-27. Grammar items, writing tasks and every prescribed lesson with its writer or
# poet, as printed in Marathi in the CBSE 2026-27 Marathi IX-X curriculum (Class IX table); paper pattern from the same
# document's blueprint. Textbook: Aksharbharati Iyatta Navavi (Maharashtra State Bureau of Textbook Production and
# Curriculum Research, Pune). Book lessons 8 and 14 are not prescribed. Lesson 1 is for reading only. Under the 2026-27
# Class IX scheme Marathi may be taken at R1 or R2 (school exam) or R3 (school-based assessment); this file follows the
# CBSE IX list. Titles and authors only; no text is reproduced (CONTEXT §8).
subject_id: cbse-9-marathi
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-marathi-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam; school annual examination on the CBSE IX-X blueprint. Paper 80 marks (3 hours) + internal assessment 20
  (notebook records, homework and classwork, periodic test, subject enrichment / portfolio). Section A Reading 15: one unseen prose passage
  of 150-200 words (5 MCQs of 6, 3 very short answers of 4) and one unseen poem of 10-12 lines (4 MCQs of 5, 3 very short answers of 5).
  Section B Grammar 20: parts of speech 4, identify and change tense 3, kinds of sentences 3, number 2, gender 2, synonyms 2, antonyms 2,
  compounds 2 (number, gender, synonyms and antonyms are textbook-based). Section C Textbook 30: prose - one-sentence answers 3, fill in the
  blanks 3, one short answer of 30-40 words 3, idioms (vakprachar) matching 5; poetry - one-sentence answers 4, fill in the blanks 4,
  explanation with reference to context 3; supplementary reader - one-sentence answers 5 of 7. Section D Writing 15: essay
  (autobiographical, imaginative or descriptive, 120-150 words) or story from given points (title and moral required) 5; formal letter
  (demand or complaint, envelope required) 5; advertisement writing 5.
