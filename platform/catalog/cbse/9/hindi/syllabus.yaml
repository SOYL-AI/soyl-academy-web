exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20. R1: अपठित बोध 14 (गद्यांश ~200 शब्द 7,
  काव्यांश 80-100 शब्द 7); व्याकरण 16 (शब्द-निर्माण 4, संज्ञा-सर्वनाम-विशेषण-क्रिया 4, अर्थ के आधार पर वाक्य-भेद 4, शब्दालंकार 4);
  पाठ्यपुस्तक 30; लेखन 20 (अनुच्छेद ~120 शब्द, अनौपचारिक पत्र ~100, संवाद ~80, सूचना ~80; प्रत्येक 5)। R2: दो अपठित गद्यांश 7+7; व्याकरण —
  शब्द भंडार (समानार्थी, मुहावरे), उपसर्ग-प्रत्यय, विराम चिह्न, संज्ञा-सर्वनाम-निपात; लेखन — अनुच्छेद ~100, पत्र, संवाद, चित्र आधारित लेखन
  ~80।
