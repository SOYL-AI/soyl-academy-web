# CBSE Class 9 Social Science (087), 2026-27 — new integrated NCF-SE syllabus with themes in NCERT "Social Science Part 1"
# and "Part 2". Theme titles and concepts are from the CBSE 2026-27 course outline; CBSE says the marks-wise course structure
# "will be provided shortly", so units carry no marks yet.
subject_id: cbse-9-social-science
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-social-science-2026-27
  - cbse-secondary-curriculum-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20. IA: periodic assessment 5, multiple
  assessment 5, interdisciplinary project 5, portfolio 5. Marks distribution by theme not yet published by CBSE (as of 2026-10-25).
