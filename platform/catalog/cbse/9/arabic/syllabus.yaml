# CBSE Class 9 Arabic (016), 2026-27. Sections, marks, writing tasks and grammar items as printed in the CBSE 2026-27
# Arabic Class IX-X syllabus (Class IX page and examination structure). Prescribed textbook: Minhaj al-Ta'lim al-Thanawi,
# Class IX, new edition 2023 (CBSE / Shiksha Kendra). CBSE prescribes prose units 1-4 (8 lessons) and poetry units 1-4 (4
# lessons) without titles, so the textbook chapters carry placeholder topics. Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3 (school-based assessment). No text is reproduced.
subject_id: cbse-9-arabic
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-arabic-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20 for R1/R2; at R3 the
  language is assessed by the school only. Internal assessment: handwriting 5, reading without diacritics 5, Arabic
  speaking 5, oral applied grammar 5. Same paper design as Class X: Section A Reading 10 (unseen passages of about 80
  words, MCQs); Section B Writing 10 (short paragraph, application or letter 4; use of words, fill in the blanks,
  correction of sentences 2 each); Section C Grammar and translation 20; Section D Literature 40 (prose translation,
  passage questions and MCQs; poetry explanation and central idea).
units:
  - name: 'القسم أ: القراءة'
    marks: 10
  - name: 'القسم ب: الكتابة'
    marks: 10
  - name: 'القسم ج: القواعد والترجمة'
    marks: 20
  - name: 'القسم د: الأدب (النثر والشعر)'
    marks: 40
