# CBSE Class 9 Bodo (092), 2026-27. Sections, marks, writing tasks, grammar items, prescribed poems (khanthai), prose
# lessons (raithai) with authors and the supplementary reader as printed (in Devanagari) in the CBSE 2026-27 Bodo
# syllabus (Class IX table). Textbook: Khonsai Bidang, Thakho-Gu (Assam State Textbook Production and Publication Corporation, 2018); supplementary reader Baidi Maiyani Assam (2018). Grammar references: Gonang Raokhanthi (Kamal Kumar Brahma),
# Gojou Raokhanthi (Madhuram Boro), Phoraysalini Raokhanthi (Swarna Prabha Chainary). Lesson and author names are copied from
# CBSE; title_en values are SOYL romanisations, and the Bodo labels of the reading/writing/grammar chapters and the English
# glosses of grammar terms marked "to be verified" need a Bodo speaker's check. No text is reproduced (CONTEXT §8).
subject_id: cbse-9-bodo
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-bodo-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Theory 80 marks (3 hours) + internal assessment 20. Section A reading comprehension 10 (an unseen literary or other
  relevant passage of about 150 words); Section B writing 10; Section C grammar 10; Section D literature 40 (prescribed
  raithai/prose lessons and khanthai/poems); supplementary reader 10. Internal assessment 20: periodic test/term
  evaluation 10, discussion, listening and speaking 5, assignment 5. Class 9 has no board exam; this is the school
  annual exam design.
units:
  - name: 'Section A: Reading Comprehension'
    marks: 10
  - name: 'Section B: Writing Skills'
    marks: 10
  - name: 'Section C: Grammar'
    marks: 10
  - name: 'Section D: Literature'
    marks: 40
  - name: Supplementary Reader
    marks: 10
chapters:
  - id: cbse-9-bodo-ch01
    number: 1
    title: आयदा फरायनाय आरो बुजिनाय
    title_en: Reading comprehension (unseen passages)
    unit: 'Section A: Reading Comprehension'
    topics:
      - id: cbse-9-bodo-ch01-t01
        title: थुनलाइयारि आयदा एबा जायखिजाया जुक्तिगोनां आयदा
        title_en: Literary or other relevant unseen passage (about 150 words)
        learning_outcomes:
          - Read an unseen Bodo passage of about 150 words and answer questions on its content, inference and vocabulary
    removed_topics: []
    literature_texts: []
  - id: cbse-9-bodo-ch02
    number: 2
    title: लिरनाय
    title_en: Writing skills
    unit: 'Section B: Writing Skills'
    topics:
      - id: cbse-9-bodo-ch02-t01
        title: आर'ज बिलाइ लिरनाय / लाइजाम लिरनाय
        title_en: Application writing / letter writing
        learning_outcomes:
          - Write an application or a letter in Bodo in the correct format and register
      - id: cbse-9-bodo-ch02-t02
        title: रिपर्ट लिरनाय / सुंद'वै लिरनाय
        title_en: Report writing / precis writing
        learning_outcomes:
          - Write a short report of an event, or a precis of a passage, in clear Bodo
      - id: cbse-9-bodo-ch02-t03
        title: बाथ्राफावखौ बेखेवना लिरनाय
        title_en: Explanation of a passage
        learning_outcomes:
          - Explain the meaning of a given line or passage with reference to the context
      - id: cbse-9-bodo-ch02-t04
        title: रनसाइ लिरनाय (200 सोदोबनि गेजेराव)
        title_en: Essay writing (within 200 words)
        learning_outcomes:
          - Write an organised essay of up to 200 words on a given topic
    removed_topics: []
    literature_texts: []
  - id: cbse-9-bodo-ch03
    number: 3
    title: रावखान्थि
    title_en: Grammar (raokhanthi)
    unit: 'Section C: Grammar'
    topics:
      - id: cbse-9-bodo-ch03-t01
        title: गारां रिंसारथि आरो खौरां रिंसारथि
        title_en: Garang ringsarthi and khourang ringsarthi (gloss to be verified)
        learning_outcomes:
          - >-
            Identify, explain and use Garang ringsarthi and khourang ringsarthi correctly in Bodo sentences, following
            the prescribed Bodo grammar books
      - id: cbse-9-bodo-ch03-t02
        title: सोदोबमा (मुंमा आरो मुंराइ)
        title_en: 'Sodobma: mungma and mungrai (nouns and pronouns; gloss to be verified)'
        learning_outcomes:
          - >-
            Identify, explain and use Sodobma: mungma and mungrai correctly in Bodo sentences, following the prescribed
            Bodo grammar books
      - id: cbse-9-bodo-ch03-t03
        title: सानराइ
        title_en: Sanrai (gloss to be verified)
        learning_outcomes:
          - Identify, explain and use Sanrai correctly in Bodo sentences, following the prescribed Bodo grammar books
      - id: cbse-9-bodo-ch03-t04
        title: बाथ्रा दानाय
        title_en: Bathra danai (sentence making)
        learning_outcomes:
          - >-
            Identify, explain and use Bathra danai correctly in Bodo sentences, following the prescribed Bodo grammar
            books
      - id: cbse-9-bodo-ch03-t05
        title: रोखोमसे सोदोब आरो उल्था सोदोब
        title_en: Synonyms and antonyms (rokhomse sodob and ultha sodob)
        learning_outcomes:
          - >-
            Identify, explain and use Synonyms and antonyms correctly in Bodo sentences, following the prescribed Bodo
            grammar books
    removed_topics: []
    literature_texts: []
