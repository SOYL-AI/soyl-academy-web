# CBSE Class 9 Sherpa (134), 2026-27. Sections, topics and lessons as printed in the CBSE 2026-27 Sherpa Class IX-X
# syllabus (Class IX pages). Books (Education Department, Government of Sikkim): Sherpai Sumtak Tang Tri-Tsom; Sherpai
# Ked-Deb, Sherpai Molwa and Sherpai Leg-Shyed. Tibetan-script spellings are SOYL renderings where confident (to be checked);
# other items keep CBSE's romanisation. Unit marks follow CBSE's course-structure table. Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3 (school-based assessment). No text is reproduced.
subject_id: cbse-9-sherpa
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-sherpa-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20 for R1/R2; at R3 the
  language is assessed by the school only. Course structure: reading 24, writing 15, grammar 16, literature 25.
  Question-wise table: Part A - two of four unseen passages of about 200 words (one prose, one poetry) 5+5 MCQs; applied
  grammar MCQs 10. Part B - grammar short answers 6; literature short answers on Ked-Deb prose 14, Leg-Shyed verses 1-35
  12, rapid reader 10 and further Ked-Deb lessons 4; essay of at least 200 words 14, letter and translation (long
  answers). The two tables do not add up; follow the school paper. Internal assessment: periodic assessment, speaking
  and listening, multiple assessment.
