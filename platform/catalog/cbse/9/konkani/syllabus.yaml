# CBSE Class 9 Konkani (168), 2026-27. Sections, marks, grammar items, writing tasks and every prescribed lesson with its
# author as printed (in Devanagari) in the CBSE 2026-27 Konkani Class IX syllabus. Textbook: Konkani "Mhaday", prescribed
# by the Goa Board of Education. The Konkani section and topic labels are SOYL’s and should be checked by a Konkani
# reviewer. CBSE publishes no Class X Konkani syllabus for 2026-27. Titles and authors only; no text is reproduced (CONTEXT §8).
subject_id: cbse-9-konkani
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-konkani-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam; school annual examination 80 marks (3 hours) + internal assessment 20 (pen-and-paper tests 5,
  multiple assessment 5, portfolio 5, listening and speaking skills 2.5 + 2.5). A Reading 10: two unseen passages (one prose, one
  poetry), short-answer and MCQ. B Grammar 20 (parts of speech and word order, indeclinables, tense, idioms and proverbs, sentence
  correction, positive and negative forms, adjective formation, translation from English into Konkani) and Writing 20 (dialogue of
  eight exchanges, essay, story completion from hints, invitation). C Textbook 30 (prose and poetry). Under the 2026-27 Class IX
  scheme the language may be taken at R1, R2 or R3 (R3: school-based assessment only); this file follows the CBSE Class IX
  syllabus. CBSE publishes no Class X syllabus for this language for 2026-27 (the subject enters with the 2026-27 Class IX
  cohort).
