# CBSE Class 9 English, 2026-27 (R1/R2), new NCERT textbook "Kaveri" (Grade 9). Paper pattern verified from CBSE.
# The chapter list of Kaveri is NOT in the CBSE document and ncert.nic.in was unreachable: literature texts are pending
# (one placeholder literature chapter) — owner/Lead to supply the Kaveri contents page.
subject_id: cbse-9-english
academic_year: "2026-27"
source_status: unverified
