  - cbse-ix-english-2026-27
  - cbse-secondary-curriculum-2026-27
  - ncert-textbooks-secondary
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20. R1: reading 20 (discursive 400-450 words
  10, case-based 200-250 words 10); grammar 10 (editing 4, rearrangement 3, transformation 3); writing 20 (notice/invitation 3, letter to
  editor/formal email 5, factual description/magazine article 5, descriptive/narrative essay 200-250 words 7); literature 30 (extracts 5x2,
  short answers 5x2, two long answers 5+5). R2 differs slightly (reading 12+8, paragraph completion, writing 4+5+5+6). IA 20 (periodic 5,
  multiple assessment 5, portfolio 5, subject enrichment 5).
units:
  - name: "Section A: Reading Skills"
    marks: 20
  - name: "Section B: Writing Skills and Grammar"
    marks: 30
  - name: "Section C: Language through Literature"
    marks: 30
