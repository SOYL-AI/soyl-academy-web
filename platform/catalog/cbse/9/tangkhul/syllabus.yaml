  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20 for R1/R2; at R3 the
  language is assessed by the school only. Internal assessment: assignment 10, speaking and listening 10. CBSE lists
  sections without marks. Removed from 2026-27: grammar tone, ideophone, noun, pronoun; prose Manipurwui ngashan,
  Khangareo Ngasamkakhui, Lairikshim; poetry Ngarumsak; rapid reader Mirinwui thingrongnao, Kapha Ruichumnao.
