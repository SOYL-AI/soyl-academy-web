# CBSE Class 9 Tangkhul (093), 2026-27. Sections, topics, lessons and removed portions as printed in the CBSE 2026-27
# Tangkhul syllabus (Class IX page). Books (Tangkhul Literature Society): Tangkhul Tuitam Kachiko, Tangkhul Grammar and
# Composition, Tangkhul Rapid Reader. CBSE gives no marks for the sections (units carry null marks). Roman script.
# Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3 (school-based assessment). Lesson titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-9-tangkhul
