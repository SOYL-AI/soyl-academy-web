# CBSE Class 9 Limboo (025), 2026-27. Sections, marks, grammar items and lessons as printed in the CBSE 2026-27 Limboo
# Class IX-X syllabus (Class IX pages). Books are the Government of Sikkim Limboo textbooks. Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3 (school-based assessment).
# CBSE prints every Limboo term and lesson title only in Roman transliteration; titles here keep CBSE's romanisation
# (the script CBSE actually uses) because SOYL could not verify native-script (Limbu / Sirijanga) spellings. Native-script titles
# are to be added in language review (see the M1 languages handoff). Lesson titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-9-limboo
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-limboo-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20 for R1/R2; at R3 the
  language is assessed by the school only. Internal assessment: periodic 5, multiple assessment 5, portfolio 5, subject
  enrichment 5. A Unseen comprehension 5 (one of two passages, MCQs). B Grammar 20 (MCQ). C Seen comprehension 5. D
  Literature 30: Patila Sapsok 8, Sammila Sapsok 8, Khedasung 6, Sodhungembahare Siwading Khahunha 8. E Writing 20:
  essay 5, letter 5, translation 5, introduction of the writers and poets 5. CBSE's course-structure table gives reading
  15, writing 15, grammar 20, literature 30.
units:
  - name: A - Unseen comprehension
    marks: 5
  - name: B - Grammar
    marks: 20
  - name: C - Seen comprehension
    marks: 5
  - name: D - Literature
    marks: 30
  - name: E - Writing
    marks: 20
