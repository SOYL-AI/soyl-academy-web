# CBSE Class 9 Sanskrit, 2026-27 (new NCF-SE scheme; R1/R2 school annual exam 80 + internal assessment 20).
# Sections, marks and every grammar item as printed in the CBSE 2026-27 Class IX Sanskrit document. CBSE says the
# prescribed textbook (NCERT) and the lessons for the exam are "शीघ्रमेव सूचयिष्यन्ते" (to be notified soon), so the
# textbook chapter is a placeholder until CBSE/NCERT publish them. CBSE asks that applied-grammar items be chosen from
# the textbook as far as possible. No text is reproduced (CONTEXT §8).
subject_id: cbse-9-sanskrit
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-sanskrit-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  वार्षिकं मूल्याङ्कनम् 80 अङ्काः (school annual exam; Class IX has no board exam) + आन्तरिकमूल्याङ्कनम् 20 (periodic
  tests 5 and other school activities). Section A (क) unseen passage 10: one prose passage or simple story of 80-100
  words with one-word and full-sentence answers (2+4), a title (1) and language tasks (3: subject-verb selection and
  agreement, adjective-noun, synonym-antonym, noun for pronoun). Section B (ख) creative writing 15: formal or informal
  letter completed from a word box 5, picture description or paragraph from a word box 5, dialogue or story completion
  from a word box 5. Section C (ग) applied grammar 25: sandhi 3, karaka/upapada vibhakti 3, noun forms 3, verb forms 3,
  pratyaya 3, samasa (tatpurusha) 3, numbers 1-100 3, places of articulation 2, avyaya 2. Section D (घ) textbook
  comprehension 30: prose, verse and drama extracts 5 each, question formation on underlined words 5, anvaya or
  bhavartha 4, story completion from a word box 3, contextual meaning 3. Paper design: 1-mark and half-mark very short,
  MCQ (21 marks), short, long and essay-type items as in the CBSE question-paper table.
units:
  - name: "क खण्डः: अपठितावबोधनम्"
    marks: 10
  - name: "ख खण्डः: रचनात्मककार्यम्"
    marks: 15
  - name: "ग खण्डः: अनुप्रयुक्तव्याकरणम्"
    marks: 25
  - name: "घ खण्डः: पठितावबोधनम्"
    marks: 30
