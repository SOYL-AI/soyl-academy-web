# CBSE Class 9 Mizo (098), 2026-27. Sections, marks, grammar items and lessons (titles and authors) as printed in the CBSE
# 2026-27 Mizo Class IX-X syllabus (Class IX pages). Prescribed textbook: Tiau, published by the Expert Committee on Mizo Language
# (CBSE), revised edition 2022. Mizo is written in Roman script; Mizo section headings are SOYL wording. Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3 (school-based assessment). No text is reproduced.
subject_id: cbse-9-mizo
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-mizo-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20 for R1/R2; at R3 the
  language is assessed by the school only. Section A Reading 15: one unseen passage of at least 500 words, six 2-mark
  questions and three 1-mark grammar questions. Section B Grammar 16: eight parts of speech, two 1-mark items each.
  Section C Composition 24: essay 10, translation from English into Mizo 5, short story 5, letter (personal, formal,
  informal) 4. Section D Literature 25 (Tiau): poetry - one long answer of 4, two short answers of 2, four objective
  items; prose - one long answer of 4, three short answers of 2, three objective items.
units:
  - name: Section A - Reading comprehension
    marks: 15
  - name: Section B - Grammar
    marks: 16
  - name: Section C - Composition
    marks: 24
  - name: Section D - Literature (Tiau)
    marks: 25
