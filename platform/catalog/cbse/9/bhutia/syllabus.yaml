# CBSE Class 9 Bhutia (095), 2026-27. Sections, marks, topics and lessons as printed in the CBSE 2026-27 Bhutia Class IX
# syllabus. CBSE prints every Bhutia term in romanisation; Tibetan-script spellings are SOYL renderings only where the item
# could be identified with confidence (to be checked in language review); other items keep CBSE's romanisation.
# Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3 (school-based assessment). No text is reproduced (CONTEXT §8).
subject_id: cbse-9-bhutia
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-bhutia-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20 for R1/R2; at R3 the
  language is assessed by the school only. Internal assessment: periodic test 10, subject enrichment 5, class work and
  activities 5. Part A objective: A Reading 10 (two unseen passages, 5 MCQs each); B Applied grammar 5 MCQs; C
  Literature (tshig-lug) 5 MCQs. Part B: D Writing 15 - composition 5, letters and applications 5, translation from
  English into Bhutia 5; E Textbook 45 - grammar 2x5; tshig-lug, poem and rapid reader 2x5; verses (tshig chey) long
  answer 5 and very short answers 5x1; Tangku nyi mig thamchey 2x5 and 5x1.
