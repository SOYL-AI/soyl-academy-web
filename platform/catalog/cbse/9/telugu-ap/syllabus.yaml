# CBSE Class 9 Telugu (Andhra Pradesh) (007), 2026-27. Sections, marks, grammar items, writing tasks and every
# prescribed lesson as listed (in Roman transliteration, without authors) in the CBSE 2026-27 Telugu (A.P.) IX-X
# syllabus, Class IX. Textbook: Telugu Parimalam, Telugu Vachakam Class IX (Government of Andhra Pradesh, new edition
# 2023), with a non-detail section of six life sketches. Telugu-script titles are SOYL's rendering of CBSE's
# transliteration. Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3
# (school-based assessment); this file follows the CBSE IX list. Titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-9-telugu-ap
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-telugu-ap-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam; school annual examination 80 marks (3 hours), 24 questions + internal assessment 20. Section A Reading 10:
  unseen prose passage. Section B Writing 13: report writing (lekha rachana) 5, essay 8. Section C Grammar 20: Telugu and Sanskrit sandhis
  (akara, ikara, ukara, savarna dirgha, guna, vriddhi, yanadesha) 4x1, synonyms 4x1, prakriti-vikriti 4x1/2, antonyms 4x1/2, idioms 2x2,
  proverbs 4x1. Section D Literature 37: 8 short answers x 2, long answers 5, 7 and 8, 4 long answers x 4, 4 short answers x 3 and MCQs on
  prose, poetry and the non-detail lessons.
