# CBSE Class 9 Sindhi (008), 2026-27. Sections, marks, grammar items, writing tasks and every prescribed lesson
# (titles as printed by CBSE in Devanagari Sindhi) from the CBSE 2026-27 Sindhi syllabus, Class IX. Books: NIOS Secondary
# Course 238 Sindhi; supplementary Sorahan Sanskar (Pujya Shadani Darbar Tirath, Raipur); grammar: Nutan Sindhi Grammar
# (Usha Saraswat) and Sindhi Vyakaran (Gangaram Israni). The CBSE document uses Devanagari script, not the Arabic script
# listed in subjects.yaml. Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3
# (school-based assessment); this file follows the CBSE IX list. Titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-9-sindhi
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-sindhi-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam; school annual examination. Paper 80 marks (3 hours) + internal assessment 20 (as for all Class IX-X languages).
  Unseen prose passage 5 MCQs; unseen poem 5 MCQs; literature MCQs on prose, poetry and grammar 10; grammar 10; main course book (prose and
  poetry lessons) 30; supplementary book 6; creative writing 14 - essay of 300 words 6, letter or report 4, dialogue or advertisement 4.
  Unseen and MCQ items test understanding, reasoning, analysis and higher-order thinking. Class IX grammar: noun, pronoun, gender, antonyms,
  adjective, verb, number, idioms and proverbs.
