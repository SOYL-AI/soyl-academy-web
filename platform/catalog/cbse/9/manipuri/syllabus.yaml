# CBSE Class 9 Manipuri (011), 2026-27. Sections, marks, writing and grammar items and every prescribed lesson
# with its author, as printed (in Roman script) in the CBSE 2026-27 Manipuri IX-X syllabus, Class IX. Books: Manipuri
# Nachom (Class IX, Board of Higher Secondary Education, Manipur), supplementary reader Manipuri Nongin (Class IX) and
# grammar Anouba Manipuri Lonmit Amasung Lonjan (Class IX-X), Board of Secondary Education, Manipur. Content is verified
# against CBSE; status is unverified only because the Meitei Mayek spellings are SOYL's transliterations. Under the
# 2026-27 Class IX scheme the language may be taken at R1, R2 or R3; this file follows the CBSE IX list. Titles and
# authors only; no text is reproduced (CONTEXT §8).
subject_id: cbse-9-manipuri
