# CBSE Class 9 Bengali (005), 2026-27. Sections, marks, question-paper structure, grammar items, writing tasks and
# every prescribed lesson with its author (CBSE prints titles and authors in Roman transliteration; Bengali-script
# spellings are SOYL's) from the CBSE 2026-27 Bengali IX-X syllabus, Class IX. Books: Sahitya Sanchayan Bangla (Pratham
# Bhasha) Nabam Shreni (WBBSE / West Bengal Text Book Corporation); supplementary reader Aam Aantir Bhenpu (complete),
# Bibhutibhushan Bandyopadhyay (Signet Press); grammar: Saraswati Bangla Byakaran O Rachana and Ucchatara Bangla
# Byakaran (IX-X). Under the 2026-27 Class IX scheme the language may be taken at R1, R2 or R3; this file follows the
# CBSE IX list. Titles and authors only; no text is reproduced (CONTEXT §8).
subject_id: cbse-9-bengali
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-bengali-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam; school annual examination 80 marks (3 hours) + internal assessment 20 (periodic tests 5, multiple assessment 5,
  portfolio 5, subject enrichment 5). Part A (MCQ, 25%): two unseen passages of 150-200 words, each with four direct questions and one
  grammar question (sandhi, antonyms, synonyms) 2x5; prose MCQs 5; supplementary reader MCQs 5. Part B: grammar 20 - vowel sandhi (3x1)x2,
  samas (dwigu, tatpurush, bahubrihi) 5x1, transformation of sentences (assertive, interrogative, exclamatory, imperative, optative) 5x1,
  correction of word and sentence errors 4x1; prose 2 + 3 + (2+3); poetry 5 + 2 + 3; supplementary reader 8; creative writing 12 - report
  (120-150 words) 6 and school notice (within 100 words) 6. Word limits: 5 marks 120-130 words, 3 marks 50-60, 2 marks 25-30.
