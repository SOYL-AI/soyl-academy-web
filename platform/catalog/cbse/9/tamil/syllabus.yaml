# CBSE Class 9 Tamil (006), 2026-27. Sections, marks, grammar items and every prescribed lesson as listed (in Roman
# transliteration, without authors) in the CBSE 2026-27 Tamil IX-X syllabus, Class IX, Iyal 1-7. Textbook: Tamil
# Textbook Class IX, revised edition 2025 (SCERT Tamil Nadu; Tamil Nadu Textbook and Educational Services Corporation).
# Tamil-script titles are SOYL's rendering of CBSE's transliteration. Under the 2026-27 Class IX scheme the language may be
# taken at R1 or R2 (school exam) or R3 (school-based assessment); this file follows the CBSE IX list. Titles only; no
# text is reproduced (CONTEXT §8).
subject_id: cbse-9-tamil
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-tamil-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam; school annual examination 80 marks (3 hours) + internal assessment 20, same design as Class X. MCQ 25 marks,
  descriptive 55. Section A Reading 10: unseen passage 1 (language, literature, history or science) 5 MCQs; unseen passage 2, 5 short
  answers. Section B Grammar 12 (all MCQ): give example 3, fill up 3, grammar note 3, do as directed 3. Section C Main course book 31:
  Thirukkural fill-ups 3x1, poetry comprehension 5x1, poetry short answers 4x2, prose long answers 3x5. Section D Non-detail 10 (one long
  answer). Section E Creative writing 17: picture description 3, official or informal letter 8, essay 6.
units:
  - name: 'பிரிவு அ: படித்தல் (காணாப் பகுதி)'
    marks: 10
  - name: 'பிரிவு ஆ: இலக்கணம்'
    marks: 12
  - name: 'பிரிவு இ: பாடநூல் (உரைநடை, செய்யுள்)'
    marks: 31
  - name: 'பிரிவு ஈ: துணைப்பாடம்'
    marks: 10
  - name: 'பிரிவு உ: படைப்பாக்க எழுத்து'
    marks: 17
chapters:
  - id: cbse-9-tamil-ch01
    number: 1
    title: காணாப் பகுதி
    title_en: Unseen passages
    unit: 'பிரிவு அ: படித்தல் (காணாப் பகுதி)'
    topics:
      - id: cbse-9-tamil-ch01-t01
        title: 'காணாப் பகுதி 1: பலவுள் தெரிவு வினாக்கள்'
        title_en: 'Unseen passage 1: multiple-choice questions'
        learning_outcomes:
          - Read an unseen Tamil passage on language, literature, history or science and answer five MCQs
      - id: cbse-9-tamil-ch01-t02
        title: 'காணாப் பகுதி 2: குறுவினாக்கள்'
        title_en: 'Unseen passage 2: short answers'
        learning_outcomes:
          - Answer five short questions on an unseen passage in their own words
          - Infer meanings of words and the central idea from context
    removed_topics: []
    literature_texts: []
  - id: cbse-9-tamil-ch02
    number: 2
    title: எழுத்து, சொல், தொடர் இலக்கணம்
    title_en: Grammar of letters, words and phrases
    unit: 'பிரிவு ஆ: இலக்கணம்'
    topics:
      - id: cbse-9-tamil-ch02-t01
        title: எழுத்து, அளபெடை
        title_en: Letters (ezhuthu) and prolongation (alabedai)
        learning_outcomes:
          - Classify Tamil letters and identify the kinds of alabedai with examples
      - id: cbse-9-tamil-ch02-t02
        title: பகுபத உறுப்பிலக்கணம்
        title_en: Parts of a divisible word (pagubatha uruppilakkanam)
        learning_outcomes:
          - Split a word into pagudhi, vigudhi, idainilai, saariyai, sandhi and vigaaram
      - id: cbse-9-tamil-ch02-t03
        title: தொடர் இலக்கணம், ஆகுபெயர்
        title_en: Phrase grammar and metonymic nouns (aagupeyar)
        learning_outcomes:
          - Identify the kinds of thodar and aagupeyar in sentences
      - id: cbse-9-tamil-ch02-t04
        title: துணைவினைகள்
        title_en: Auxiliary verbs (thunaivinaigal)
        learning_outcomes:
          - Identify auxiliary verbs and use them correctly in sentences
    removed_topics: []
    literature_texts: []
  - id: cbse-9-tamil-ch03
    number: 3
    title: வல்லினம் மிகுதல், யாப்பு
    title_en: Doubling of hard consonants and prosody
    unit: 'பிரிவு ஆ: இலக்கணம்'
    topics:
      - id: cbse-9-tamil-ch03-t01
        title: வல்லினம் மிகும் இடங்கள்
        title_en: Where hard consonants double (vallinam migum idangal)
        learning_outcomes:
          - Apply the rules for doubling of k, ch, th, p in joined words
      - id: cbse-9-tamil-ch03-t02
        title: வல்லினம் மிகா இடங்கள்
        title_en: Where hard consonants do not double (vallinam migaa idangal)
        learning_outcomes:
          - Identify contexts where the hard consonant does not double and correct errors
      - id: cbse-9-tamil-ch03-t03
        title: யாப்பிலக்கணம்
        title_en: Prosody (yaappilakkanam)
        learning_outcomes:
          - Identify ezhuthu, asai, seer, thalai, adi and thodai in a given verse
    removed_topics: []
    literature_texts: []
