# CBSE Class 9 Kashmiri (097), 2026-27. Sections, grammar items, writing tasks and the four prescribed lessons
# (printed in Kashmiri by CBSE, two per term) from the CBSE 2026-27 Kashmiri IX-X syllabus, Class IX. Prescribed book:
# Kashir Kitab (2010), J&K Board of School Education, Class IX. CBSE prints no marks per section. The first term-1 lesson
# title is hard to read in the CBSE scan; its spelling needs checking. Labels other than lesson titles are SOYL's and need
# review by a Kashmiri speaker. Under the 2026-27 Class IX scheme the language may be taken at R1, R2 or R3; this file
# follows the CBSE IX list. Titles only; no text reproduced.
subject_id: cbse-9-kashmiri
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-kashmiri-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam; school annual examination 80 marks (3 hours) + internal assessment 20 (periodic tests on textual questions,
  grammar and vocabulary 10; notebook 5; subject enrichment - listening to short narrations and speaking through elocution, conversation,
  recitation and narration 5). Unseen comprehension: two of four unseen paragraphs of about 200 words, five MCQs each. Grammar: transitive
  and intransitive sentences, gender, number, prefix and suffix words, Kashmiri proverbs. Main course book: seen prose and poem paragraphs
  of 100-150 words with five MCQs each; notes on poets and writers, genres, summaries, textual questions and book work. Creative writing:
  paragraph, story, formal and informal letters.
