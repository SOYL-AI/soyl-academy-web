    marks: 10
  - name: Applied grammar
    marks: 16
  - name: Literature - prose (Yaangchhapchhang)
    marks: 24
  - name: Literature - poetry (Yaangchhamchhang)
    marks: 16
  - name: Writing
    marks: 14
