# CBSE Class 9 Rai (131), 2026-27. Sections, marks, grammar items and lessons as printed in the CBSE 2026-27 Rai Class IX
# syllabus. Books (Education Department, Government of Sikkim): Sasengyang (grammar); Yaangchhapchhang and Yaangchhamchhang,
# compiled by P. M. Rai. Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3 (school-based assessment).
# CBSE prints every Rai term and lesson title only in Roman transliteration; titles here keep CBSE's romanisation
# (the script CBSE actually uses) because SOYL could not verify native-script (Devanagari or Kirat Rai) spellings. Native-script titles
# are to be added in language review (see the M1 languages handoff). Lesson titles only; no text is reproduced (CONTEXT §8).
subject_id: cbse-9-rai
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-rai-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20 for R1/R2; at R3 the
  language is assessed by the school only. Internal assessment: project 5, listening and speaking 5, periodic test 5,
  copy 5. Part A: reading 10 (unseen prose and poem of about 200 words, five MCQs each); grammar 10 MCQs (Yangsiwa,
  Baranang). Part B: grammar 3x2 (Yangkap, Muya); prose 24 (6x2, 4x3); poetry 16 (2x2, 4x3); writing 14 - letter 5,
  essay of 120 words 5, translation 4.
units:
