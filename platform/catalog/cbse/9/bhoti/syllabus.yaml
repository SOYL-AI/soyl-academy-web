# CBSE Class 9 Bhoti (088), 2026-27. Sections, marks, topics and textbook lesson numbers as printed in the CBSE 2026-27
# Bhoti Class IX-X syllabus (Class IX course structure). Prescribed book: Bhoti Textbook Class IX (Directorate of School
# Education, UT of Ladakh). Prose lessons 1-6 and poetry lessons 7-12 are given by NUMBER only, so those chapters carry
# placeholder topics. Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3 (school-based assessment). No text is reproduced (CONTEXT §8).
subject_id: cbse-9-bhoti
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-bhoti-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20 for R1/R2; at R3 the
  language is assessed by the school only. Internal assessment: pen-and-paper tests 5, multiple assessment 5, portfolio
  5, listening and speaking 5. Section A Reading 10: unseen passage from stories, notes or biographies and a seen
  extract from the poetry section. Section B Writing 11: informal letter to parents, relatives and friends (lesson 14);
  essay on an unseen topic. Section C Grammar 25: lesson 13, Legs bshad ljon dbang - from the invocation to the vocative
  particle (letters, suffixes, prefixes and particles depending on the suffix), and from the particle ni to the
  punctuation mark shad. Section D Textbook 34: prose lessons 1-6 and poetry lessons 7-12.
