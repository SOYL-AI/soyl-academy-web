# CBSE Class 9 German (020), 2026-27. Lessons, communicative aims, structures and the assessment scheme as printed in the
# CBSE 2026-27 German Class IX-X syllabus (Class IX pages). Prescribed book: Beste Freunde B1.1, lessons 1-5 (Hueber; Goyal
# Publishers). German lesson titles are SOYL translations of CBSE's English topic names. Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3 (school-based assessment). No text is reproduced.
subject_id: cbse-9-german
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-german-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20 for R1/R2; at R3 the
  language is assessed by the school only. Internal assessment: periodic tests and dictations 5, listening 5, speaking
  5, classwork and homework 5. Section A Reading 15: two unseen passages (10 and 5). Section B Writing 10: e-mail of
  about 50 words 5 and a dialogue or SMS 5. Section C Applied grammar 40: verbs with fixed prepositions, wo(r)- and
  da(r)- 8; genitive articles, nouns and prepositions 8; subordinate clauses um...zu, während, bevor, damit, wenn 8;
  Konjunktiv II würde + infinitive 8; relative pronouns (nominative, accusative, dative) 4; separable verbs 4. Section D
  Textbook 15: two seen passages to complete with given vocabulary (5 each) and a seen comprehension 5.
units:
  - name: 'Teil A: Leseverstehen'
    marks: 15
  - name: 'Teil B: Schreiben'
    marks: 10
  - name: 'Teil C: Angewandte Grammatik'
    marks: 40
  - name: 'Teil D: Lehrbuch (Beste Freunde B1.1, Lektionen 1-5)'
    marks: 15
