# CBSE Class 9 Japanese (094), 2026-27. Sections, marks, grammar items, kanji range and writing topics as printed in the
# CBSE 2026-27 Japanese Class IX-X syllabus (Class IX pages). Prescribed books: Minna no Nihongo Indian edition 1-1 (Goyal
# Publishers, 2nd edition 2018) lessons 1-12 and the Nihongo Challenge Kanji book, chapters 1-5 (kanji 1-50, N5). Minna no
# Nihongo lessons are numbered, not titled. Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3 (school-based assessment). No text is reproduced.
subject_id: cbse-9-japanese
academic_year: "2026-27"
source_status: verified
sources:
  - cbse-ix-japanese-2026-27
  - cbse-secondary-curriculum-2026-27
exam_notes: >-
  Class 9 has no board exam: school annual examination 80 marks (3 hours) + internal assessment 20 for R1/R2; at R3 the
  language is assessed by the school only. Section A Reading 20: 3-5 unseen passages, conversations or stories related
  to lessons 1-12 - short answers 10, vocabulary search 5, true/false or matching 5. Section B Writing 20: two
  compositions of about 350 characters (my teacher, my friend, my school, my day, my weekend, my house; letters to a
  grandfather or to a friend) 10, creative writing 5, completing dialogues and passages 5; no deduction for spelling.
  Section C Grammar 20 (lessons 1-12): particles, pronouns and time, giving and receiving, arimasu/imasu, question
  words, counters, all tenses. Section D Kanji 20: kanji 1-50 to hiragana 10 and hiragana to kanji 10.
units:
  - name: A：読解
    marks: 20
  - name: B：作文
    marks: 20
  - name: C：文法
    marks: 20
  - name: D：漢字
    marks: 20
