# CBSE Class 9 Assamese (014), 2026-27. Sections, marks, writing tasks, grammar items and every prescribed lesson
# with its writer or poet (in Roman transliteration) from the CBSE 2026-27 Assamese syllabus, Class IX. Books: Asamiya
# Sahitya Chayanika (Assam State Textbook Production and Publication Corporation, Guwahati) and Rachana Bichitra
# (Dharma Singha Deka, Assam Book Depot, Guwahati). Assamese-script titles are SOYL's rendering of CBSE's
# transliteration. Under the 2026-27 Class IX scheme the language may be taken at R1 or R2 (school exam) or R3
# (school-based assessment); this file follows the CBSE IX list. Titles and authors only; no text is reproduced.
