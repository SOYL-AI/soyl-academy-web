exam_notes: >-
  Class 9 has no board exam; school annual examination. Paper 80 marks (3 hours) + internal assessment 20 (periodic test 10, subject
  enrichment activity 5, notebook keeping 5). Section A Reading 15: one unseen passage of at least 500 words with six 1-mark and three
  2-mark questions and three 1-mark grammar questions. Section B Writing 25: four long tasks x 5 and five 1-mark sentences using idiomatic
  phrases (jatuwa khanda bakya). Section C Grammar 20 (very short answers). Section D Textbook: prose 10 and poetry 10, each one long answer
  4, one short answer 2 and four very short answers x 1. Writing in Class IX: story or biographical (jibanimulak) essay, report on a school
  function, proverbs nos. 1-10, expansion of an idea (bhab samprasaran), idiomatic phrases with kapal, kaan, kakal, athu. Grammar: sandhi
  (vowel and consonant) 4; parts of speech - noun, adjective, pronoun, verb, indeclinable 2 each; gender 4; number 2.
